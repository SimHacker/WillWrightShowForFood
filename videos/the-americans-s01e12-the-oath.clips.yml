clips:
  - id: claudia-pacman-arcade
    title: "Ominous Pac-Man — Claudia, then Elizabeth's reaction"
    characters:
      - "Claudia (Margo Martindale)"
      - "Elizabeth Jennings (Keri Russell)"
    timecode_status: verified
    start: "10:07"
    end: "12:06"
    duration_note: |
      ~1m59s. Arcade meet (Jennifer/Alexandra disguises) through ominous Ms. Pac-Man banter.
      Includes opening beat of the following scene — Elizabeth does not trust a word
      "that bitch" says — then cut before the rest of the next scene.
    output: claudia-pacman-arcade.mp4
    audio_fade: true
    captions: captions/claudia-pacman-arcade.srt
    key_lines:
      - line: "You're good at games. I'll give you that."
        speaker: Elizabeth
        actor: Keri Russell
        delivery: "Icy contempt — not praise; cold acknowledgment of Claudia's game-playing"
      - line: "I enjoy the maze part, and the eating-without-eating part. Pac-dots are calorie-free."
        speaker: Claudia
        actor: Margo Martindale
      - line: "The Center wants the meeting with the Colonel to proceed."
        speaker: Claudia
      - line: "Don't get your panties in a bunch, Elizabeth. This isn't about you and me."
        speaker: Claudia
      - line: "I don't trust a word that bitch says. I mean, who knows what she could be up to."
        speaker: Elizabeth
        note: "Trust rupture coda — first domino"
    cast_note: |
      Claudia is SUCH a character; Margo SUCH an actor. Keri Russell's spy-mom Elizabeth —
      contempt, distrust, and game-playing in one breath.
    narrative_weight: |
      Pivotal scene. Elizabeth's contempt and distrust here set up and push the first domino
      in a long tragic chain — Rennhull meet, handler wars, i-told-you-so rights across the
      series. Bookended oath episode (Nina's KGB oath / Clark-Martha wedding oath).
    cultural_note: |
      Margo Martindale — BoJack Horseman "Esteemed Character Actress Margo Martindale"
      (HN: https://news.ycombinator.com/item?id=42905440). Claudia eats without eating;
      Elizabeth plays games too. Pairs with Lars / iron / simulation / handler themes.
