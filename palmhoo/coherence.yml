# PALMHOO COHERENCE MANIFEST
# Summary -> sources dependency edges, so staleness is computable.
# Protocol: JOURNALISM.md · Law: CONSTITUTION.md Article IX
# Maintained by hand (instance-first); a GitHub Action will read this someday.
#
# Entry schema:
#   summary: path of the summarizing document (relative to repo root, or URL)
#   sources: what it summarizes — paths, globs, or URLs; cross-repo allowed
#   beat: who watches this (default: palm; journalists claim beats by PR)
#   last_verified: date the summary was last checked against sources at head
#   volatility: low | medium | high — how fast sources move (triage hint)

summaries:

  - summary: palmhoo/README.md
    sources:
      - palmhoo/*/README.md
      - palmhoo/CONSTITUTION.md
