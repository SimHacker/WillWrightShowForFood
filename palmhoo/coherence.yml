# CROSS-REPO EXEMPLARS — claims outside palmhoo that palmhoo pages repeat.
# These are the canaries: when a source count/date changes, every dependent listed here is stale.
tracked_claims:

  - claim: "MOOLLM has 139 skills on disk"
    as_of: 2026-07-08
    source: https://github.com/SimHacker/moollm/tree/main/skills
    dependents:
      - characters/chris-trottier/design-by-accretion.md
      - characters/chris-trottier/suggested-questions.md
      - repo-shows/design-by-accretion.yml
      - palmhoo/code-and-craft/README.md
      - https://github.com/SimHacker/moollm/blob/main/skills/README.md
    note: "deliberately load-bearing staleness — recount at each shelving pass, update all dependents together"

  - claim: "moollm skills/INDEX.yml says 131; skills/README.md says 128"
    as_of: 2026-07-08
    source: https://github.com/SimHacker/moollm/blob/main/skills/INDEX.yml
    dependents:
      - characters/chris-trottier/design-by-accretion.md
    note: "the lag IS the evidence cited; if moollm re-indexes, rewrite the evidence, don't delete it"

# COHERENCE CONFLICTS — incompatible claims between documents, tracked like bugs.
conflicts: []
