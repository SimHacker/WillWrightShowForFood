# IDEAS-STRONGEST-AND-WEAKEST.yml — the good and the bad, ranked, no flattery.
#
# Don asked to extract the good AND bad things. This is the honest scorecard: what to protect at all costs,
# what's overrated or risky, and the disputes with the original review. Ratings use the no-ai-sycophancy
# calibration: exceptional / good / adequate / flawed / wrong. Status tags match harvest.yml + stack-evaluation.md.
#
# Author: Claude Opus (Cursor). Companion: stack-evaluation.md (longer prose), harvest.yml (claim ledger).

meta:
  date: 2026-07-05
  calibration: [exceptional, good, adequate, flawed, wrong]
  rule: "Rate the idea, not the person. Respect is not agreement."

# ─ The ideas worth protecting. These are the stack's crown jewels; losing them loses the point.
strongest:

  repo_as_medium:
    rating: exceptional
    status: working (as framing) / partial (as practice)
    why: "The genuinely original core. A repo is a world you enter/fork/improve, not a file you watch. Reframes everything downstream."
    protect: "Don't let episodes decay into 'a video with a git URL.' The medium is only as rich as its last invitation to participate."
    ref: framing/FRAMING-REPO-AS-MEDIUM.md

  command_bus_no_ghost_actions:
    rating: exceptional
    status: working
    why: "AI safety through architecture: every world mutation is an inspectable, approvable, logged, reversible object. Verified in code (CommandBus.ts + tests)."
    protect: "This is the ethical boundary between language and world. It generalizes to the Proposal Object (PR/TicketPR/Finding). Never add a mutation path that bypasses it."
    ref: ../read-only-hosts.md

  semantic_image_pyramid:
    rating: good
    status: working (as discipline) / aspirational (as enforced paging)
    why: "GLANCE→CARD→SKILL→README is a real, reusable LLM attention-paging discipline. Portable beyond this stack."
    protect: "Keep GLANCE/CARD genuinely short. The moment CARDs bloat, the pyramid stops paying for itself."
    becomes_real_when: "mooco's CG engine turns it from a reading habit into actual paging."

  pull_request_as_message:
    rating: exceptional
    status: working
    why: "McLuhan line that names what's new: a PR = social intent + proposed change + review + identity + history. No prior medium had a governed proposal as a native primitive."
    protect: "Same primitive as command bus + TicketPR. Unify them; don't let them drift into three vocabularies."
    ref: framing/FRAMING-GITCITY-MCLUHAN.md

  mooco_owns_the_loop:
    rating: good
    status: aspirational (design >> prototype)
    why: "The only path from advisory→enforced. mooco can make why/gate/append/ambient/k-lines load-bearing instead of honor-system. Whole other ball game."
    protect: "Ship the 2-capability wedge (enforced why+gate, CG heat loop) as proof BEFORE extending the bar. Spec gravity is the enemy."
    ref: mooco/MOOCO-DRIVER-DEEP-DIVE.md

  lean_into_training_data:
    rating: good
    status: working
    why: "Reusing famous, well-defined terms (K-line, room, character, card) means the model arrives pre-taught. The name is itself a K-line."
    protect: "Keep coining to a minimum. Every neologism is onboarding debt an LLM can't pay from its weights."

  heizronym_ambiguity:
    rating: good
    status: working (feature, by design)
    why: "MOOLLM/UBIK/CARD as deliberately multi-expansion names. LLMs collapse them correctly per-domain — that's the feature, not a bug."
    protect: "Do NOT pin one canonical expansion; it collapses the superposition globally. DO provide a boring-front-door glossary for humans."
    ref: nomenclature/NOMENCLATURE-HEISENBERGIAN-ACRONYMS.md

  self_one_object_model:
    rating: good
    status: aspirational
    why: "Deepest unification: identity/config/messaging/deploy/sync/memory as prototype objects in one browsable universe. Direct Ungar/Self lineage."
    protect: "Present as north star, not as done. Real for skills/rooms/characters; a thesis for the rest."
    ref: framing/FRAMING-ONE-OBJECT-MODEL-SELF.md

# ─ The weak spots, risks, and overrated bits. Naming these is the point of an honest review.
weakest:

  spec_gravity:
    rating: flawed (risk)
    severity: high
    what: "Design docs vastly outrun implementation (mooco: ~17k lines design vs a vibe-coded prototype; MOOFS/MOOT/CG largely unbuilt)."
    risk: "'Enforced' guarantees stay theoretical; the capability bar becomes unreachable even for mooco itself."
    fix: "Ship the smallest enforced loop first. Tag every doc working/partial/aspirational (harvest.yml does this) so nobody mistakes design fiction for shipped."

  onboarding_debt:
    rating: flawed
    severity: high
    what: "The nomenclature surface is large (MOO, K-line, CARD, CG, moorl, MOOFS, MOOT, MOOKIE, TicketPR, heizronym...). Great for LLMs, taxing for humans."
    risk: "Teachers, school IT, first-time contributors bounce off. The heizronym feature reads as 'nobody will tell me what this means.'"
    fix: "The boring-front-door glossary (done) + a single linear onboarding path. Gate ambiguity behind a ramp."
    ref: nomenclature/NOMENCLATURE-ONBOARDING-GLOSSARY.md

  cursor_dependence_masquerading_as_universal:
    rating: flawed
    severity: medium
    what: "Behaviors described as 'universal MOOLLM' are actually Cursor-shaped: the resolver is me hand-walking, append-only is a promise, cursor.yml isn't even parsed by Cursor (.cursorrules is)."
    risk: "Writing a non-Cursor driver reveals hidden dependencies late."
    fix: "The tiny reference workspace + a second real driver (Claude-Code-via-MCP) surface these now. Capability-negotiation table forces honesty."
    ref: ../driver-spec.md

  proliferation_of_MOO_prefixed_systems:
    rating: adequate (watch)
    severity: medium
    what: "mooco, moo, MOOT, MOOFS, MOOKIE, mooco-mirror, MOONUAL, MOOGLANCE, moocroworld... naming density risks confusion even for fans."
    risk: "Cognitive load; unclear which are shipped vs sketched (MOOCO-REPOS.md itself retracted a 3400-line MOOKIE/MOOT fiction)."
    fix: "One index that states, per MOO-thing: shipped / prototype / design-only. Prune retracted fiction (the repo already started doing this)."

  git_lfs_and_large_media:
    rating: adequate
    severity: low
    what: "Repo-as-medium needs a clean large-file story. Don rejects git-lfs; prefers pointers to YouTube/SoundCloud/cloud/Twitch."
    risk: "Pointer rot / dead links over time; the 'canonical world' points at things that vanish."
    fix: "A small pointer-manifest convention with archival fallback. Decide before many episodes accrue."

  license_gap_unverified:
    rating: adequate
    severity: low
    what: "Review claimed WWSFF has 'no LICENSE file' — but that was a GitHub-sidebar inference, NOT a filesystem check."
    risk: "Acting on an unverified claim; or shipping with an actually-missing license."
    fix: "Verify against the filesystem, then add the correct per-zone LICENSE files."

  invention_over_compression:
    rating: adequate
    severity: medium
    what: "The stack is better at inventing new primitives than at compressing them. Command/TicketPR/Finding are one idea in three costumes; CG has two names before it has one implementation."
    fix: "Name the shared primitive (Proposal Object) once and route the variants through it. Compression is a feature, not a chore."

# ─ Where I disagree with the original ChatGPT deep-research review specifically.
disputes_with_review:
  - claim: "WWSFF has no LICENSE file."
    verdict: refine
    note: "Unverified GitHub-sidebar inference presented as fact. Requires filesystem check. Flagged in harvest.yml."
  - claim: "Will Wright's participation is contradictory/unconfirmed."
    verdict: resolved
    note: "characters/INDEX.yml is SSOT: invitation_status = accepted. Review lacked filesystem ground truth."
  - claim: "Recommend an external SDK (e.g. OpenAI Agents) as the first real non-Cursor driver."
    verdict: refine
    note: "mooco should be the Tier-6 flagship (it's ours, keeps leverage + IP boundary). External SDKs are strong SECOND children of the same spec."

# ─ One-line verdicts to carry forward.
carry_forward:
  protect_at_all_costs: [repo_as_medium, command_bus_no_ghost_actions, pull_request_as_message]
  ship_next: [mooco enforced-why+gate, mooco CG heat loop, boring-front-door glossary]
  watch_closely: [spec_gravity, onboarding_debt, MOO-prefix proliferation]
