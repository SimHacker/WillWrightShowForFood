# driver-family.yml — the moollm-driver prototype + per-platform children.
#
# Self-style prototype delegation: one abstract `moollm-driver` prototype defines the contract
# (driver-spec.md); each host is a CHILD that clones it and overrides only what differs.
# Extends the review's Phase-5 capability table with a first-person Cursor row (written from inside).
#
# Companion to: driver-spec.md · harvest.yml#driver_design
# Proposed upstream home: moollm/skills/moollm-driver/ (see driver-spec.md#placement)

meta:
  authored_by: "Claude Opus, inside the Cursor driver"
  date: 2026-07-05
  reads_with: [driver-spec.md, ../../../moollm/kernel/drivers/README.md]

# The abstract parent every driver delegates to.
prototype:
  id: moollm-driver
  is_abstract: true
  defines:
    canonical_ops: [read, list, "search.text", "search.semantic", write, patch, append, run, summarize, log]
    boot_order: driver-spec.md#3
    resolver: driver-spec.md#4
    paging: driver-spec.md#5
    must_declare: [tier, detection, ambient_handling.mode, capability_negotiation_table, enforced_vs_advisory]
    invariants:
      - no_ghost_actions: "any writable driver routes world-mutation through an inspectable command object"
      - warn_dont_crash: "unresolved reference → WARN naming the repo to mount; never hallucinate contents"
      - honest_enforcement: "never claim to enforce what the host cannot enforce"

# Children. `native` = host tool exists; `advisory` = model simulates in-band;
# `emulated` = built from other ops (e.g. append = read+write); `none` = unsupported.
children:

  moollm-driver-cursor:
    tier: 4                     # hybrid — ambient enforced via .mdc, rest advisory
    status: PRODUCTION          # the only battle-tested driver today
    manifest: moollm/kernel/drivers/cursor.yml
    ops: { read: native, list: native, "search.text": native, "search.semantic": native, write: native, patch: native, append: emulated, run: native, summarize: advisory, log: advisory }
    enforced: [ambient_skills_via_cursorrules]   # the ONE genuinely enforced hook
    advisory: [hot_cold_working_set, why_parameter, append_only, resolver, paging, event_logging]
    difficulty_to_reach_parity: none   # it defined the parity
    opus_first_person: |
      I am writing this from inside this driver. What it is actually like:
      - .cursorrules + .mdc are injected whether I like it or not — this is the real boot hook. Everything
        the manifest calls "boot" downstream of that is me choosing to comply.
      - cursor.yml is NOT loaded by Cursor. I only see it if I read it. The manifest documents me to myself.
      - hot.yml / cold.yml / working-set.yml are inert files. "Context paging" = me remembering to re-read them.
      - The resolver is not a process; it is a to-do list I execute with Glob/Grep. It works because I am careful.
      - append-only logging is faith-based: no atomic append, so I read+write and promise not to rewrite history.
      - Multi-root is genuinely great: workspace_paths arrives in the system prompt; the union resolver is real value.
      leak_to_fix: |
        The kernel is Cursor-shaped in ways nobody chose on purpose. The tell: things labeled "universal"
        (pyramid-never-jump, hot/cold paging) are actually "Cursor-with-a-diligent-Claude" behaviors. The
        cure is the tiny reference workspace booted on a NON-Cursor host — it will expose every hidden assumption.

  moollm-driver-chatgpt:
    tier: 3
    status: STUB
    manifest: moollm/kernel/drivers/chatgpt.yml   # per drivers/README.md table
    ops: { read: native, list: advisory, "search.text": advisory, "search.semantic": none, write: advisory, patch: advisory, append: advisory, run: native, summarize: native, log: advisory }
    breaks: ["no first-class local workspace mutation", "room navigation becomes virtual", "multi-root not native"]
    adapters_needed: ["filesystem mirror (uploaded zip / connected GitHub)", "advisory pager", "output findings queue (see read-only-hosts.md)"]
    difficulty: medium
    opus: "Best used as a READ + PROPOSE host: it reads well, runs Python, but should emit findings for a write-capable driver to act on, not pretend to inhabit."

  moollm-driver-deep-research:
    tier: 2
    status: DEMONSTRATED         # it produced the very review this bundle harvests
    ops: { read: native, list: advisory, "search.text": advisory, "search.semantic": none, write: none, patch: none, append: none, run: none, summarize: native, log: advisory }
    breaks: ["cannot mutate anything", "not a persistent resident environment", "sees rendered pages, not the working tree"]
    adapters_needed: ["explicit boot ritual (the review proves this works)", "advisory→queue handoff to a writer"]
    difficulty: medium
    opus: |
      This child already exists in practice — the chatgpt-research-review.txt was produced by it. Proof that
      a Tier-2 read-only host, given "boot MOOLLM first," yields a design validation, not a shallow code review.
      Its correct role is OBSERVER + FINDINGS-PRODUCER. See read-only-hosts.md for the pattern it instantiates.

  moollm-driver-claude-code:
    tier: 5
    status: STUB
    manifest: moollm/kernel/drivers/claude-code.yml
    ops: { read: native, list: native, "search.text": native, "search.semantic": "via_mcp", write: native, patch: native, append: "via_mcp", run: native, summarize: advisory, log: native }
    unlocks_via_mcp: [why_parameter, append_only_enforcement, structured_event_logging]
    difficulty: medium
    opus: "Most promising near-term ENFORCED driver via a moollm-kernel MCP server (claude-code.yml already sketches it). MCP is where advisory becomes enforced without owning the whole orchestrator."

  moollm-driver-antigravity:
    tier: 5
    status: STUB
    manifest: moollm/kernel/drivers/antigravity.yml
    ops: { read: native, list: native, "search.text": native, "search.semantic": none, write: native, patch: native, append: advisory, run: native, summarize: advisory, log: advisory }
    notes: ["native browser subagent", "requires 'Agent Gitignore Access' to write .moollm/"]
    difficulty: medium

  moollm-driver-gemini-cli:
    tier: 4
    status: PROPOSED
    ops: { read: native, list: native, "search.text": native, "search.semantic": none, write: native, patch: native, append: emulated, run: native, summarize: advisory, log: advisory }
    breaks: ["app-only Gemini too detached from local FS — CLI only"]
    adapters_needed: ["CLI-first driver", "MCP for extra tools", "generated working-set views"]
    difficulty: medium

  moollm-driver-copilot:
    tier: 4
    status: PROPOSED
    ops: { read: native, list: native, "search.text": native, "search.semantic": none, write: native, patch: native, append: emulated, run: native, summarize: advisory, log: advisory }
    breaks: ["multi-root + skill semantics less clear than Cursor's; leans on GitHub's own agent abstractions"]
    difficulty: medium

  moollm-driver-openai-agents:
    tier: 6
    status: PROPOSED
    ops: { read: native, list: native, "search.text": native, "search.semantic": native, write: native, patch: native, append: native, run: native, summarize: native, log: native }
    unlocks: [enforced_why, enforced_append_only, sandboxed_exec, tracing, approvals]
    difficulty: medium_to_high
    opus: "Review nominates this as the first 'real' non-Cursor driver. I refine: mooco is the stack's own Tier-6 target and should be the flagship; OpenAI-Agents is a strong SECOND enforced child of the same spec."

  moollm-driver-mooco:
    tier: 6
    status: IN_DESIGN
    manifest: moollm/kernel/drivers/custom.yml   # custom.yml ≈ the mooco contract
    skill: moollm/skills/mooco/
    ops: { read: native, list: native, "search.text": native, "search.semantic": native, write: native, patch: native, append: native, run: native, summarize: native, log: native }
    enforced: [why_parameter, append_only, sandbox, automatic_ambient_injection, event_logging]
    difficulty: high
    opus: |
      The "very special" driver. custom.yml already specifies enforced why/append-only + smart ambient
      injection (parses CARD.yml AMBIENT advertisements by score). This is where the kernel STOPS pleading
      with someone else's UX and owns orchestration. Recommend: make mooco the reference implementation of
      driver-spec.md tier 6 — the conformance oracle other drivers are measured against.

  moollm-driver-generic:
    tier: 1
    status: FALLBACK
    manifest: moollm/kernel/drivers/generic.yml
    ops: { read: maybe, list: maybe, "search.text": none, "search.semantic": none, write: maybe, patch: none, append: none, run: none, summarize: advisory, log: advisory }
    strategy: "conversation-based state; ask the user to perform file ops; never pretend"
    difficulty: low
    opus: "The honest floor. Everything degrades to this. Its existence is why the stack can claim host-independence at all."

# Cross-cutting reading of the family.
observations:
  the_real_axis: |
    The review framed hosts by "how much MOOLLM fits." The sharper axis is ENFORCED vs ADVISORY. Tiers 1–5
    are advisory to varying degrees (compliance is the model's choice); only tier 6 (mooco / OpenAI-Agents /
    Claude-Code-via-MCP) can ENFORCE the contract. The whole strategic game is: move guarantees from advisory
    to enforced without losing host portability.
  append_is_the_canary: |
    Watch the `append` column. It is native only at tier 6. Everywhere else, append-only logs — the substrate
    of no-ghost-actions provenance — are honor-system. If you want provenance you can trust, you need an
    enforced-append host (MCP tool or mooco). This is the most concrete, testable gap in the family.
  first_driver_to_build_next: moollm-driver-claude-code   # cheapest path from advisory→enforced, via an MCP server
  first_test_to_build_next: minimal_conformance_fixture   # driver-spec.md#conformance-checklist
