# MOOCO-CAPABILITY-BAR.yml — the yardstick mooco sets and other drivers must answer to.
#
# For each MOOLLM capability: what mooco does natively/enforced, and what each other driver must do —
#   native     = a host tool provides it directly
#   virtualize = the model performs the behavior by hand (documented, honor-system)
#   simulate   = approximate with weaker means (lossy)
#   stub       = declare unsupported; degrade gracefully (robust-first) — this is CONFORMANT if declared
#
# Companion prose: MOOCO-DRIVER-DEEP-DIVE.md · contract: ../driver-spec.md · family: ../driver-family.yml
# Rule (driver-spec.md §6): a driver that STUBS and says so is conformant; one that CLAIMS what it lacks is not.

meta:
  authored_by: "Claude Opus (Cursor), reading the mooco repo"
  date: 2026-07-05
  sources: [mooco/README.md, mooco/designs/MOOCO-ARCHITECTURE.md, mooco/designs/MOOCO-TOOLS.md, mooco/designs/MOOCO-IN-THE-MIDDLE.md, mooco/designs/MOOCO-SKILL-SYSTEM.md, mooco/designs/MOOCO-MEMORY.md, mooco/designs/MOOCO-REPOS.md, moollm/kernel/drivers/custom.yml]
  legend: { native: "host tool", virtualize: "model does it by hand", simulate: "weaker approximation", stub: "declared unsupported" }

capabilities:

  enforced_why:
    what: "Every tool call carries a required, typed reason (Zod withWhy); calls without it fail."
    mooco: enforced
    claude_code: native_via_mcp      # a moollm-kernel MCP tool can require why
    cursor: virtualize               # I write why in prose; nothing rejects a why-less call
    chatgpt: virtualize
    deep_research: virtualize
    why_it_matters: "Intent becomes a queryable field, not a courtesy. Powers analytics + process summaries."

  tool_gate:
    what: "Pre-execution block/confirm/scriptify-to-sandbox; dangerous/confirmRequired + skill-containment + local snitch."
    mooco: enforced
    claude_code: native_via_mcp      # MCP tool can gate; sandbox depends on host
    cursor: stub                     # I call the tool and it runs; no interception
    chatgpt: stub
    deep_research: stub
    why_it_matters: "Executable no-ghost-actions for EVERY tool, with a real sandbox. The Proposal Object, enforced."

  ambient_injection:
    what: "Parse CARD.yml AMBIENT ads (score/condition/scope/resolution); inject by score until budget spent."
    mooco: enforced
    claude_code: simulate            # can preload some via MCP/system prompt; not scored/dynamic
    cursor: simulate                 # ambient arrives only via precompiled .cursorrules (static)
    chatgpt: virtualize
    deep_research: virtualize
    why_it_matters: "Ambient becomes a dynamic, budget-aware, scored engine instead of a static rules file."

  cg_treasure_collector:
    what: "K-line activation engine: heat detection + diffusion along edges + K-CACHE.yml persistence + focus/defocus learning + pgvector semantic activation."
    mooco: enforced
    claude_code: stub
    cursor: simulate                 # I free-associate k-lines by reading files; no heat, no learning, forgets each session
    chatgpt: simulate
    deep_research: simulate
    why_it_matters: "The single biggest gap. Turns 'k-lines as naming convention' into a running, learning attention economy. Makes the semantic image pyramid REAL paging."

  in_the_middle_proxy:
    what: "user→mooco→model proxy: intercept/analyze/filter/record every message+tool call; local-model skill-snitch; declared-vs-actual diff; full record to PG for playback."
    mooco: enforced
    claude_code: stub
    cursor: simulate                 # cursor-mirror READS persisted SQLite after the fact + append via RPC; no live intercept/block
    chatgpt: stub
    deep_research: stub
    why_it_matters: "Governance + provenance + telemetry layer no advisory host has. Where orchestration-gold training traces come from free."

  three_tier_memory:
    what: "Ephemeral (PG, preserved) + Persistent (git SSOT) + Reflective (cursor-mirror + mooco-mirror); pgvector cross-session recall; PG time-series analytics."
    mooco: enforced
    claude_code: simulate            # MCP could add persistence; no native pgvector recall
    cursor: simulate                 # chat window + cursor-mirror read-after-fact; no semantic recall
    chatgpt: simulate
    deep_research: stub
    why_it_matters: "Memory as a queryable, embeddable, time-indexed substrate — not a scrollback buffer."

  moorl_resolver:
    what: "moo skill: moollm:// URLs, GitHub-branches-as-objects VM, cache; MOOT on-disk reification; MOOFS overlay stack AMBIENT→ROOM→CHARACTER→LOCAL SHADOW→WORKING→UPSTREAM→BASE."
    mooco: native                    # delegates to shipped moo skill; MOOT/MOOFS future
    claude_code: virtualize          # can call moo CLI
    cursor: virtualize               # resolver = me running Glob/Grep by hand; no moollm:// scheme, no overlay stack
    chatgpt: simulate
    deep_research: simulate
    why_it_matters: "The resolver becomes a real cached VM with layered overlays — the thing driver-spec.md §4 can conform TO."

  hermetic_namespace:
    what: "Compose many repos into ONE sealed virtual FS from (repo+ref+path+mount) tuples; ref-pinned (require-sha) → reproducible; no ambient host-disk leakage. 'Docker mounts but better.'"
    mooco: enforced                  # moorl+MOOFS+MOOT compose it; seal.hermetic is the new ask
    claude_code: stub
    cursor: virtualize               # 'namespace' = whatever multi-root workspace is open; unpinned, host-coupled, hand-resolved
    chatgpt: stub
    deep_research: stub
    why_it_matters: "Reproducible, contained worlds. Fair model-branching/AI-off eval requires every contestant to boot the SAME pinned world. See MOOCO-COMPOSABLE-FILESYSTEM.md."

  live_control_surfaces:
    what: "Files bound to live interfaces: READ reflects current state as self-describing YAML Jazz, WRITE actuates the orchestrator. /proc + Apple ][ $C000 soft switches + NeWS magic dictionaries. Mount a skill on a path → it comes alive (lazy)."
    mooco: enforced                  # MOOFS magic-dictionary READ exists; live WRITE/actuate is aspirational
    claude_code: stub
    cursor: simulate                 # cursor-mirror READS persisted state after the fact; no live write-to-steer, no self-image
    chatgpt: stub
    deep_research: stub
    why_it_matters: "The model reads its own k-line heat and steers itself by writing files — introspection+control as first-class FS objects. Every write is a gated Proposal Object. See MOOCO-LIVE-CONTROL-SURFACES.md."

  skill_cli_sandbox:
    what: "Skills declare sanitary CLI APIs (sister-script: top-of-file IS the API); mooco exposes ONLY declared commands as scoped sandboxed tools (fs_scope/network/timeout, Zod args, required why) instead of raw shell."
    mooco: enforced                  # sister-script + containment designed; auto-gen sandboxed tool from CARD is the new ask
    claude_code: native_via_mcp      # MCP tools ARE scoped declared commands
    cursor: stub                     # I get raw shell; skills can't be reduced to a sanctioned command surface
    chatgpt: stub
    deep_research: stub
    why_it_matters: "Makes declared-vs-actual auditing COMPUTABLE (you can't snitch a wildcard; you can snitch a manifest). Shell graduates to CLI via play→learn→lift. See MOOCO-SKILL-CLI-SANDBOX.md."

  multi_model_provider:
    what: "Provider abstraction w/ capability negotiation; model-branching (fork+compare) and stick-shift routing first-class."
    mooco: native
    claude_code: simulate
    cursor: stub                     # single-session/single-model from the model's vantage; model swap out-of-band
    chatgpt: stub
    deep_research: stub
    why_it_matters: "Powers WWSFF process/model-branching.yml + ai-offs.yml spend-proof under orchestrator control."

  streaming_reconnect:
    what: "AsyncGenerator<SSEEvent> streaming, reconnection, clean abort, process grouping."
    mooco: native
    claude_code: native
    cursor: native                   # Cursor streams; but the AsyncGenerator contract is mooco's, not exposed to me
    chatgpt: native
    deep_research: simulate
    why_it_matters: "Clean multi-turn tool loop; speed-of-light multi-turn; UX."

# The two-capability wedge to ship first (highest advisory→enforced delta; exactly what Cursor cannot fake).
ship_first:
  wedge:
    - enforced_why + tool_gate     # proves no-ghost-actions has teeth
    - cg_treasure_collector        # proves the pyramid is real paging, not a reading habit
  rationale: "These two are the guarantees Cursor cannot virtualize convincingly and the review most wants proven. Everything else follows once the loop is real. See ../roadmap.md."

# The failure mode to avoid.
risk_spec_gravity: |
  The bar can grow so tall that neither other drivers NOR mooco's own prototype reach it, leaving 'enforced'
  theoretical. The design docs (~17k lines) already outrun the vibe-coded prototype. Counter by shipping the
  two-capability wedge as a working proof before extending the bar further.
