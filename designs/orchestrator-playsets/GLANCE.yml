# Orchestrator playsets — dispatch + hub protocols (glance)

what: CARD abilities as advertised services; hub objects merge plugin ads; magazines on tables; locked slices teach unlock path

schemas:
  - ../../schemas/advertisement-dispatch.yml
  - ../../schemas/orchestrator-hub.yml
  - ../../schemas/guest-skills-card.yml

prose: README.md

designs_here:
  # The two design docs that live in this directory — proposals, not shipped catalogs.
  life_events_playset: life-events-playset.md   # licenses, mass pairing, the eloporter
  cult_sims: |
    cult-sims.md — the bridge playset between SimProv and Zombie Sims. Argues cult
    conversion and zombie infection are one mechanism with different fiction, and that
    the ENTIRE wedding object set works unaltered: Buddha suppresses needs so members
    keep working, Come and See Me is the call to assembly, the eloporter becomes a
    defection hatch. Worked example: red baseball caps as the visible infection marker,
    where the marker is BOUGHT rather than caught, so transmission is a transaction.
    TWO OBJECTS, split demand/supply. The TELEVISION is the demand side: channels dispense
    ideology like a magazine dispenses a menu but broadcast to the room, so the remote is
    contested and the channel lineup generates factions. It never touches the Sim — it
    raises the CAP's advertised score and the Sim walks over and buys it autonomously.
    From inside nothing happened; from the god view you watch the numbers move.
    Faux News is not a placeholder — see ../../apps/simfaux/.
    WORKED CHANNEL: Zappa's "I'm the Slime" (1973) is sung BY a television and its verses
    are the spec — "I make you think I'm delicious" IS advertisement modification in verse.
    The set oozes an expanding green puddle ONLY while watched, so attention is the
    delivery vector and a TV in an empty room is inert. The puddle is a VIEWERSHIP METER
    (read the floor, know what they watch) and Sims mop it, so TV generates housework.
    Watching writes a PERSISTENT AFFINITY to the soul (saved identity, not mood), which is
    what lets exposure become conversion — the effect stops being room-local, so the Sim
    walks to a stand on its own. Souls outlive Sims here: the ghost still wants the hat.
    Rights: ships as a CUE SHEET keyed to a track identity, never audio — "recipes, not
    files" (../../catalogs/soul-city/rendering-and-rights.md).
    The HUB is a SWAGOMATIC — caps are dressable accessories, not objects, so the
    orchestrator is a dresser: a stocked AnythingOMatic (../../catalogs/soul-city/
    portals-and-modules.md) whose credited ancestor is Steve Alvey's one-armed-bandit
    TMog, so the grift stand is a reskinned slot machine by inheritance.
    MULTIPLE STANDS ARE THE ESSENTIAL GAMEPLAY — one stand is one cult, each with its own
    parameters. A SLOT HOLDS ONE THING, so hostility is inversely proportional to doctrinal
    difference: identical cults need the same slot. Competitive exclusion + Freud's
    narcissism of minor differences, as a slider the player discovers by experiment.
    Precedents: Seuss's Star-On/Star-Off Machine (the spec, 1961), Swift's Big-Endians,
    Life of Brian.
    AFFINITY IS TO THE STAND, NOT THE HAT — the object has a current stock, so the doctrine
    is whatever it sells today and whoever configures it can change it. Reconfiguring fires
    a MASS RE-DRESS: members drop everything, run over, queue, switch. That is a LOYALTY
    ASSAY — change red to green, whoever follows was loyal to the stand, whoever balks was
    loyal to the colour, count the dropouts. Conviction and obedience are identical until
    the doctrine changes. Orwell's Eurasia/Eastasia switch is the same beat.
    The QUEUE UTILITY ALREADY EXISTS and Don found it in the wild: the Slap Conga
    (Cupid + Buddha + Crowd Sitter, "lovers lined up and slapped him in sequence"), scored
    on queue length. Same machine, verb changed; queue length becomes congregation size.
    Choreography from Faceball's formation swoop. THE COMEDY IS IN THE UNIFORMITY.
    MANY SLOTS, MANY CULTS AT ONCE — membership is a set, not a flag, and the FEUD GRAPH IS
    COMPUTED FROM ANATOMY: same slot = necessarily rivals, different slots = compatible.
    Belief is not the mechanism; the real estate is. A costume is a readable affiliation
    display. Faceball is the parts supplier (Balls For Hands club), so regalia is
    user-generated.
    PIXELATION CLUBS (head / left hand / right hand) — regalia made of ABSENCE. The mosaic
    is already an attach-to-any-part bounding box in Faceball, so the censorship argument
    pays off as a membership mechanic: the occluder is evidence, so hiding makes you the
    most conspicuous thing in the room; closure means the uniform differs for every observer
    while being identical in the save; Pixelated Head members are mutually
    indistinguishable. Left vs Right Hand IS Swift's egg — and by the slot rule they are not
    even rivals, which is the joke Swift was making. Contact transmission comes free: the
    spec already has "pass a pixelated joint → it pixelates your HEAD", giving the playset
    a zombie-bite vector alongside the purchase vector. Genuinely new: contagion (`spreads:`), membership as a group host, and
    advertisement modification (an object re-weighting ANOTHER object's ad score).

