# Orchestrator playsets — dispatch + hub protocols (glance)

what: CARD abilities as advertised services; hub objects merge plugin ads; magazines on tables; locked slices teach unlock path

schemas:
  - ../../schemas/advertisement-dispatch.yml
  - ../../schemas/orchestrator-hub.yml
  - ../../schemas/guest-skills-card.yml

prose: README.md

designs_here:
  # The two design docs that live in this directory — proposals, not shipped catalogs.
  life_events_playset: life-events-playset.md   # licenses, mass pairing, the eloporter
  cult_sims: |
    cult-sims.md — the bridge playset between SimProv and Zombie Sims. Argues cult
    conversion and zombie infection are one mechanism with different fiction, and that
    the ENTIRE wedding object set works unaltered: Buddha suppresses needs so members
    keep working, Come and See Me is the call to assembly, the eloporter becomes a
    defection hatch. Worked example: red baseball caps as the visible infection marker,
    where the marker is BOUGHT rather than caught, so transmission is a transaction.
    TWO OBJECTS, split demand/supply. The TELEVISION is the demand side: channels dispense
    ideology like a magazine dispenses a menu but broadcast to the room, so the remote is
    contested and the channel lineup generates factions. It never touches the Sim — it
    raises the CAP's advertised score and the Sim walks over and buys it autonomously.
    From inside nothing happened; from the god view you watch the numbers move.
    Faux News is not a placeholder — see ../../apps/simfaux/.
    WORKED CHANNEL: Zappa's "I'm the Slime" (1973) is sung BY a television and its verses
    are the spec — "I make you think I'm delicious" IS advertisement modification in verse.
    The set oozes an expanding green puddle ONLY while watched, so attention is the
    delivery vector and a TV in an empty room is inert. The puddle is a VIEWERSHIP METER
    (read the floor, know what they watch) and Sims mop it, so TV generates housework.
    Watching writes a PERSISTENT AFFINITY to the soul (saved identity, not mood), which is
    what lets exposure become conversion — the effect stops being room-local, so the Sim
    walks to a stand on its own. Souls outlive Sims here: the ghost still wants the hat.
    Rights: ships as a CUE SHEET keyed to a track identity, never audio — "recipes, not
    files" (../../catalogs/soul-city/rendering-and-rights.md).
    The HUB is a SWAGOMATIC — caps are dressable accessories, not objects, so the
    orchestrator is a dresser: a stocked AnythingOMatic (../../catalogs/soul-city/
    portals-and-modules.md) whose credited ancestor is Steve Alvey's one-armed-bandit
    TMog, so the grift stand is a reskinned slot machine by inheritance.
    MULTIPLE STANDS ARE THE ESSENTIAL GAMEPLAY — one stand is one cult, each with its own
    parameters. A SLOT HOLDS ONE THING, so hostility is inversely proportional to doctrinal
    difference: identical cults need the same slot. Competitive exclusion + Freud's
    narcissism of minor differences, as a slider the player discovers by experiment.
    Precedents: Seuss's Star-On/Star-Off Machine (the spec, 1961), Swift's Big-Endians,
    Life of Brian.
    AFFINITY IS TO THE STAND, NOT THE HAT — the object has a current stock, so the doctrine
    is whatever it sells today and whoever configures it can change it. Reconfiguring fires
    a MASS RE-DRESS: members drop everything, run over, queue, switch. That is a LOYALTY
    ASSAY — change red to green, whoever follows was loyal to the stand, whoever balks was
    loyal to the colour, count the dropouts. Conviction and obedience are identical until
    the doctrine changes. Orwell's Eurasia/Eastasia switch is the same beat.
    The QUEUE UTILITY ALREADY EXISTS and Don found it in the wild: the Slap Conga
    (Cupid + Buddha + Crowd Sitter, "lovers lined up and slapped him in sequence"), scored
    on queue length. Same machine, verb changed; queue length becomes congregation size.
    Choreography from Faceball's formation swoop. THE COMEDY IS IN THE UNIFORMITY.
    MANY SLOTS, MANY CULTS AT ONCE — membership is a set, not a flag, and the FEUD GRAPH IS
    COMPUTED FROM ANATOMY: same slot = necessarily rivals, different slots = compatible.
    Belief is not the mechanism; the real estate is. A costume is a readable affiliation
    display. Faceball is the parts supplier (Balls For Hands club), so regalia is
    user-generated.
    PIXELATION CLUBS (head / left hand / right hand) — regalia made of ABSENCE. The mosaic
    is already an attach-to-any-part bounding box in Faceball, so the censorship argument
    pays off as a membership mechanic: the occluder is evidence, so hiding makes you the
    most conspicuous thing in the room; closure means the uniform differs for every observer
    while being identical in the save; Pixelated Head members are mutually
    indistinguishable. Left vs Right Hand IS Swift's egg — and by the slot rule they are not
    even rivals, which is the joke Swift was making. Contact transmission comes free: the
    spec already has "pass a pixelated joint → it pixelates your HEAD", giving the playset
    a zombie-bite vector alongside the purchase vector.
    HIGH FIVES bond the cult and are membership-gated, so THE PIE MENU IS THE MEMBERSHIP
    TEST (works even when members wear mosaics for faces). It is a hand-cranked Super Cupid
    `complete` topology — a relationship-inflation machine raising the whole clique at once.
    Two engine facts make Don's punchline inevitable rather than editorial: sims1 tracks ONE
    relationship score (no platonic channel, so the no-homo handshake accumulates exactly
    what courtship does), and the engine NEVER CHECKS GENDER — same-sex romance shipped by
    omission, surfacing in a live E3 demo nobody planned. So mass bonding produces mass
    incidentally-gay romance with nothing authored. THE KILLER: to make the cult obey its own
    ideology you would have to ADD a gender check — the prejudice is a feature request
    somebody would have to file. Aim: the cohesion ritual does not share the cult's politics;
    the simulation is indifferent where the doctrine is obsessed. No closet in the engine —
    third instance of the god-view asymmetry (ad scores, slime, now the romance graph).
    Seinfeld 1993: the protest is the tell.
    SLAP CONGAS KEEP IT SPICY — a LIMIT CYCLE, not a death spiral, and the spec agrees
    (`queues_survived` plural, "queue may reform"). Rupture-and-repair is stickier than never
    fighting, because the repair mechanism IS the high five, so each cycle sinks more
    investment and raises the switching cost: the cascade is RETENTION, not attrition. It
    also filters — weak ties leave, average commitment rises, amplitude grows, and it breaks
    as schism rather than collapse. "Failure-as-entertainment" is already in the Slap Conga
    notes: DRAMA IS THE PRODUCT, which makes the cult and the television THE SAME SHAPE.
    POPULATION TOOLS, three distinct things: INSTACULT (god tool — makes crowd experiments
    runnable, sibling of Super Cupid's skip-the-grind pattern; spawns PRE-CONVERTED, so it
    can tell you nothing about conversion), BANISH (a cult power if the guru holds it —
    public purging RAISES everyone else's commitment, filtering by force where the cascade
    filters by attrition), and the DEPROGRAMMER (a rival institution, summoned like the
    divorce attorney, built from the cult's OWN objects — Eloporter, Buddha, repetition. If
    deprogramming is mechanically indistinguishable from conversion that is a FINDING, not a
    bug, and the player discovers it by reaching into the same parts bin).
    DISBAND on the anchor is the robustness requirement PROMOTED TO A VERB (if the graceful
    teardown must exist anyway, let the player ask for it) — bulldoze routes through the same
    code path. Its design content is the MEMBER TAXONOMY, and what happens to each class falls
    out of WHERE IT LIVES IN THE SAVE: NPC spawns are RAPTURED and nothing is lost; VISITORS go
    home AND TAKE THE AFFINITY WITH THEM, which is how the cult crosses lots and is the real
    `spreads:` vector (household-to-household by social call, so the scope is the neighbourhood,
    not the lot); FAMILY MEMBERS STAY, unhatted, with the slap-cascade wreckage still in the
    panel — which is the consequence system, since disbanding would otherwise be free. The
    NPCs get raptured and the real people are LEFT BEHIND; the save format writes that joke.
    DISBAND STRIPS MEMBERSHIP, NOT FRIENDSHIP — membership is Super Cupid's buff layer,
    high-five bonding is base values, so afterwards an intact tightly-bonded clique sits there
    wearing no hats and a second stand adopts it instantly. THE CULT DIES AND THE CONGREGATION
    DOES NOT. Four removal verbs, kept distinct: Banish (one, guru, raises commitment),
    Disband (all, anchor, wreckage persists), Deprogram (one, rival, costs and can fail),
    Bulldoze (all, ungraceful, must degrade to Disband).
    INSTACULT + DISBAND ARE SETUP AND TEARDOWN — what makes this a repeatable experiment and a
    laboratory you can run twice, rather than a lot that silently fills with dead cults.
    THE COLLAPSE: THE TELEVISION *IS* THE VENDING MACHINE. Demand/supply was a split this doc
    invented to keep two objects busy; fusing them removes an object and gains an argument,
    because direct-response TV sells what it just made you want IN THE SAME BREATH — the
    absence of the gap IS the format. Televangelism is the fused object already built (the set
    asks for money, sends back a prayer cloth). ONE ROLE, MANY SKINS — television (broadcast,
    canonical because fused) / vending machine (Seuss, profits both directions) / clothes
    cabinet (a wardrobe) / web stand (merch drop + algorithm). Same mechanism, four media eras.
    MEMBERSHIP IS A RELATIONSHIP WITH A TELEVISION — Don's "under-the-thrall-of" taken
    literally as a directed weighted edge Sim→appliance. Thrall is a SCORE not a flag; the
    roster becomes a QUERY so there is no second copy of the truth to go stale; Super Cupid's
    topologies operate on it directly; and Disband becomes literally what Don said — drop every
    inbound thrall edge.
    PING-PONG MULTI-CULT CAP DYNAMICS, the best emergent result and nobody implements it. One
    rule (a set advertises harder at members in the wrong cap) + thrall to two sets claiming
    the head = the Sim shuttles between televisions changing hats forever. It is a HUNTING
    OSCILLATION — two controllers fighting one actuator with no coordination — so colliding
    cults DO NOT refuse each other, THEY TEAR THE MEMBER IN HALF, which is nastier than
    exclusion. Self-limiting and diagnostic: ping-pong is the SIGNATURE OF A TIE (unequal
    thrall settles), and needs decay while commuting, so death by irreconcilable ideological
    obligation needs no new code. HYSTERESIS IS THE KNOB and refusing to turn it up is the
    joke: commitment_hysteresis from zero (farce) to high (Sims commit and ignore the shouting).
    The word "strongly" also makes advertising STATE-DEPENDENT, a feedback controller, so two
    sets ESCALATE — and the arms race crowds out every other ad on the lot. The Sim is not
    neglecting its needs out of devotion; it cannot hear them over two TVs arguing about a hat. Genuinely new: contagion (`spreads:`), membership as a group host, and
    advertisement modification (an object re-weighting ANOTHER object's ad score).

