  - { at: ../../apps/performance-space/character-button-board.yml,  why: how the driver hot-swaps presets mid-show }
  - { at: ../../process/artifactory.yml,                            why: a construction set is an artifact factory — the repo's central metaphor }
  - { at: ../orchestrator-playsets/,                                why: advertisement dispatch, the same Sims machinery driving menus }
