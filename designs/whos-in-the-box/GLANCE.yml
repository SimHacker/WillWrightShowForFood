# A character guessing game: someone is in the box, or nobody is.

what: |
  Work a box (the pilot is Minsky's Ultimate Machine) and guess who is hiding inside
  from timing and gesture alone. Occupants are user-made: character cards, programs,
  or improvised hand performances by webcam. "Nobody" is a fair answer.

