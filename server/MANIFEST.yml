# What a WillWrightShowForFood box is made of.
#
# Declarative on purpose: scripts/server-setup.sh converges a machine onto this file, and can be
# run any number of times on the same machine with no additional effect. Adding a tool is editing
# this file, not editing a script.
#
# THE SERVER IS CATTLE, THE DISK IS A PET.
#
# Everything in this file is reinstallable from scratch with one command, which is the property
# that makes deleting a VM safe. Nothing here creates state worth keeping. The state lives on a
# separate disk (see `disk:`) that outlives any particular server, and the honest accounting of
# what is NOT yet on that disk is in `disk.not_yet_moved` -- read it before you delete anything.

target:
  os: ubuntu
  release: '24.04' # noble. Older works; the docker repo line derives the codename at runtime
  arch: amd64

# apt packages, grouped by why they are here rather than alphabetically, because the grouping is
# the argument for keeping each one. Install a subset with: --only base,dev
packages:
  base: # the box does not function without these
    - ca-certificates
    - curl
    - git
    - gnupg
    - ufw
    - rsync
    - cloud-guest-utils # growpart, for when the boot disk gets resized under a live system
    - python3-yaml # how this file gets read; installed in phase 0, before it is parsed

  dev: # somebody lands here at 3am over a phone tether and has to actually work
    - screen
    - tmux
    - emacs-nox # no X on a server, and -nox is 30MB instead of 300
    - vim
    - ripgrep
    - jq
    - tree
    - htop
    - ncdu # "what filled the disk", answered in ten seconds
    - lsof
    - net-tools
    - dnsutils # dig, for the ACME failures that are always DNS
    - unzip
    - build-essential # native node modules need a compiler

  ops: # diagnosing the stack without guessing
    - ca-certificates
    - postgresql-client # psql against the container, without exec'ing into it
    - sqlite3

# Docker Engine from Docker's own repo, not Ubuntu's, because the compose plugin and current
# engine only exist there. Idempotent: the keyring and source list are rewritten to the same
# bytes, and apt-get install of an installed package is a no-op.
docker:
  repo: https://download.docker.com/linux/ubuntu
  keyring: /etc/apt/keyrings/docker.asc
  packages:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
  # Members get docker without sudo. SUDO_USER is added automatically when set.
  group_members: []

# Node on the host, which is new: builds used to happen inside Docker, and HyperTIES now builds
# on the box and publishes a release directory. Without this, `deploy-all.sh hyperties` fails at
# pnpm install.
node:
  major: 22
  source: nodesource # deb.nodesource.com, which is the only apt route to a current major
  # pnpm is deliberately NOT pinned here. Root package.json's `packageManager` field is the one
  # source of truth and corepack reads it, so the server cannot drift from CI and laptops. A
  # version in this file would be a second truth that silently disagrees.
  pnpm: from_repo_package_json

firewall:
  # Caddy needs 443/udp for HTTP/3. The old scripts opened only tcp, so HTTP/3 was advertised
  # and then unreachable, which browsers handle by falling back quietly.
  allow:
    - OpenSSH
    - 80/tcp
    - 443/tcp
    - 443/udp
  default_incoming: deny
  default_outgoing: allow

repo:
  url: https://github.com/SimHacker/WillWrightShowForFood.git
  dir: /opt/WillWrightShowForFood
  # Shallow is fine and deliberate: the box builds what is at a ref, it is not a place anyone
  # does history archaeology. `server-deploy.sh` fetches what it needs.
  clone_depth: 1

disk:
  # THE PET, and the only pet. A separate GCP persistent disk (wwsff-data, 100GB pd-balanced),
  # attached to whatever server currently exists. Detach it, delete the VM, create a new VM,
  # attach it, run server-setup.sh, deploy. That is the whole disaster-recovery story and it is
  # the reason this file exists.
  mount: /data
  # GCP exposes an attached disk by its device name under by-id, so attach with
  # --device-name=data. Set DATA_DISK to override.
  device_hint: /dev/disk/by-id/google-data
  fstype: ext4
  # Never format a disk that already has a filesystem. server-setup.sh refuses, rather than
  # asking, because the wrong answer here is unrecoverable and the right one takes one flag.
  format_if_empty: true

  # ONE GLOBAL NAMESPACE, NOT A PER-CONTAINER ONE.
  #
  # A /data path means the same thing everywhere: on the host, in every container, in every log
  # line, in this manifest, in a backup script. Nothing is remapped. /data/postgres is
  # /data/postgres in the db container; /data/releases/hyperties/current is that same string in
  # Caddy and in the deploy script that writes it.
  #
  # Narrowing is done by MOUNTING LESS, never by renaming. The viewer sees exactly
  # /data/ebike-safari/rides and nothing else on the disk; it does not see a private alias of it.
  # So `access` below is the whole access model: who mounts what, and read-only or read-write.
  #
  # The consequence worth stating: to point a program at its data you CONFIGURE the program
  # (PGDATA, EBIKE_DATA_DIR, XDG_CONFIG_HOME, Caddy's `storage file_system`) rather than lying to
  # it with a mount. If a program cannot be told where its data is, that is a fact worth knowing
  # about the program; it is not a reason to bend the namespace.
  namespace:
    rule: 'Same absolute path on the host and in every container. No remapping, ever.'
    narrowing: 'By omitting mounts and by :ro. Never by aliasing a path to a different name.'
    shared: 'Top-level subtrees mounted :ro by consumers, :rw by exactly one producer.'
    private: 'One subtree per service, named for the service or the app that owns it.'
    adding_a_site: |
      Caddy mounts the whole of /data/releases read-only, so a new static site is a Caddyfile
      block rooted at /data/releases/<app>/current plus an import line. No volume to add, no
      container to restart, no new path to invent.

  # EVERYTHING STATEFUL IS HERE. The rule is not "the important things" or "the database" -- it is
  # that if deleting the VM would lose it, it lives on this disk. Anything left on the boot disk
  # must be reconstructible from git plus this manifest, or it is a bug.
  #
  # `access` is who mounts it and how: the complete list, since nothing reaches state any other way.
  contains:
    postgres:
      access: 'db rw'
      what: 'The database. PGDATA points here directly; never a named volume.'
    caddy/storage:
      access: 'caddy rw'
      what: |
        The Let's Encrypt account key and every issued certificate. The first thing you would
        miss: re-issuance is capped at 5 duplicate certs per week, so losing these twice inside
        one week means the sites stay down on TLS until the window rolls over.
        Set by `storage file_system` in the Caddyfile, not by the image's XDG_DATA_HOME.
    caddy/config:
      access: 'caddy rw'
      what: "Caddy's autosaved JSON config. XDG_CONFIG_HOME."
    releases:
      access: 'caddy ro (whole tree) | host rw (deploy-app.sh)'
      what: |
        THE SHARED SUBTREE. One directory per app, each holding releases/<commit> and a `current`
        symlink. Built on the host, served by Caddy, which is why it is at the top level rather
        than inside any one app's directory.
    ebike-safari/rides:
      access: 'viewer ro'
      what: 'Ride GeoJSON the site serves. Never in git, and there is no other copy.'
    ebike-safari/osm:
      access: 'none'
      what: |
        OSM extracts, raw and filtered, 3.7G. No container mounts them -- the import runs on the
        host. Re-downloadable from Geofabrik, slowly.
    secrets:
      access: 'none mounted; compose reads named files on the host'
      mode: '0700, root -- the one subtree where the mode is part of the design'
      what: |
        ONE SECRET, ONE FILE, ONE OWNER, grouped by what the secret IS rather than by which app
        wants it. A service names the files it needs in env_file, so the compose file is also the
        complete access model: postgres/superuser.env reaches ONLY the db container, and each app
        gets its own login role under postgres/roles/ with DML and nothing else.
        Nothing is mounted into a container and nothing is interpolated into the compose file.
        Layout and threat model: server/SECRETS.md. Roles: scripts/provision-db-roles.sh.
      files:
        postgres/superuser.env: 'db'
        postgres/roles/<app>.env: 'that app only -- PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD'
        mapbox/token.env: 'viewer'
        acme/email.env: 'caddy'

  stays_on_the_boot_disk:
    # Only things a rebuild reconstructs from scratch. If you want to add to this list, the test
    # is: can server-setup.sh plus a deploy recreate it exactly? If not, it goes on /data.
    docker_images: 'Rebuilt by a deploy.'
    node_modules: 'Reinstalled by pnpm from the lockfile.'
    build_output: 'apps/*/build, .svelte-kit — regenerated by a build.'
    repo_checkout: 'Recloned by the repo phase.'
