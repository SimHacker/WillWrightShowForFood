# GitHub-backed distribution — metadata catalogs + free content + MOOLLM/Soul City
# Micropolis Home rails: TSR/SFS replacement for repo-native work; federation for paid storefronts.

meta:
  id: github-distribution-model
  updated: "2026-07-08"
  status: planted
  parent: CATALOG.yml

one_line: |
  Distribute metadata catalogs **and** the content itself (when not for pay) from public GitHub repos —
  MOOLLM skills + Soul City bridge payloads alongside Sims object repos. TSR browse model replaced;
  creator subscriptions still federated, not vacuumed.

principle:
  metadata_and_content: |
    Obviously we ship both: CARD.yml / CATALOG.yml indexes **and** the `.iff` / `.fam` / playset
    binaries when the creator chooses free, non-pay distribution on git. Metadata-only entries remain
    for IA pointers, paid storefronts, and rights-we-don't-hold.
  github_as_backing: |
    GitHub is the durable host — version history, forks, PRs, blame, releases, LFS when needed.
    Replaces ad-walled browse sites and brittle shortlinks for **our** lane; still **federates**
    SimFileShare permanent URLs and Heather/Steve/ZombieSims paid archives.

what_we_replace:
  the_sims_resource_lane:
    old: "Free files + ads; VIP for convenience; no git lineage; broken links"
    new: "Searchable CARD catalog in repo; clone or release zip; install docs in-tree; Steam guide links"
  simfileshare_lane:
    partial: |
      SFS remains fine for Simblr creators — we index their simfil.es links in CARD metadata.
      Repo-native free objects live **in** GitHub; no alt-tab upload for WWSFF/Micropolis Home drops.
  exchange_lane:
    old: "thesims.ea.com upload + Family Album HTML"
    new: "Git PR + Micropolis Home publish + optional Angel tray watcher → repo path or release tag"

repos:
  willwrightshowforfood:
    url: https://github.com/SimHacker/WillWrightShowForFood
    holds:
      - catalogs/ — federated brand dirs (simfreaks, simslice, simprov, zombie-sims, maxis metadata)
      - characters/ — portrayal rooms; source bundles; correspondence
      - repo-shows/ — episode artifacts, bridge specs, harvested homefun
      - apps/ — MicropolisAngel, stream-gateway pointers
    role: "Show catalog + Sims object repo + Simopolis hub index"
  moollm:
    url: https://github.com/SimHacker/moollm
    holds:
      - skills/ — MOOLLM skills (installable protocol + examples)
      - examples/adventure-4/ — character overlays, rooms, Palm lineage
      - Soul City / bridge content as skills + yaml rooms (cross-game organelles)
    role: "Skills-as-content; Soul City liminal payloads; MOOLLM-native UCC parallel to Sims objects"
  micropoliscore:
    note: "Engine + WASM playable projection — sibling; hosted-content README cross-links catalogs"

catalog_card_shape:
  metadata_always:
    - id, title, creator, license, requires_game
    - install_path (UserData/Objects, Houses, …)
    - shopping_list for external deps
    - federation_links (SFS, simfreaks.com, IA) when binary not in-repo
  content_when_free:
    - paths/to/*.iff in repo OR release asset attached to git tag
    - round-trip saves, Family Album markdown/yaml, playset orchestrator CARDs
    - generated bridge outputs (Soul City ⇒ Sims compiler artifacts)
  never_in_public_repo:
    - EA game binaries or expansion packs
    - Paid Heather/Steve SKUs without explicit grant
    - Malware vectors — .exe installers; prefer .iff/.fam/.zip with README

soul_city_and_moollm:
  soul_city:
    bridge_spec: ../../../repo-shows/will-wright-premiere/game-bridge-soul-city-procreation.yml
    delivery: |
      Soul events compile to Sims 1 **content injection** — objects, skins, album pages — checked into
      catalog dirs or generated in show branches. Liminal state lives in yaml facets; Sims side in iff/fam.
  moollm_skills:
    parallel: |
      MOOLLM skills are content the same way Sims objects are — SKILL.md + CARD.yml rooms, forkable,
      attributable. Repo Show harvest merges audience homefun back into skills/ and catalogs/.
  simopolis_hub:
    framing: |
      Simopolis = git-checked-in hi-fidelity character facets; spokes (Proxi, Minecraft, Stardew, …)
      round-trip through hub CARDs. Same distribution model: metadata + payload in repos.

federation_rules:
  non_extractive:
    rule: "Send buyers to ZombieSims lifetime / SimFreaks — Micropolis Home is rails, not a loot box"
    see: ../sims1-community-landscape.yml#non_extractive_lift
  paid_vs_free_split:
    free_on_github: [SimProv HN giveaway pattern, Don composable objects, show artifacts, MOOLLM examples]
    federate_only: [SimFreaks/SimSlice paid sets, TSR VIP convenience — link + metadata CARD]
  ea_posture:
    requires_owned_game: ../get-the-sims-on-steam.md
    disclaimer: Transmogrifier EULA fan-posting clause pattern — see sims1-community-landscape.yml

micropolis_home_implementation:
  web_hub: Browse CARD indexes; deep-link to raw GitHub paths or releases; SimShow preview from metadata
  angel: Watch UserData → commit to local fork OR open PR template → clipboard link to tree path
  steam_guide: Points to repo catalog roots + install wiki — drives Steam sales

contrast_table:
  - { surface: TSR, model: "Ad/VIP browse site", us: "Git browse + CARD search + no ads on repo lane" }
  - { surface: SimFileShare, model: "Central shortlink, no search", us: "Git permanent URLs + searchable index; federate SFS for external" }
  - { surface: Exchange, model: "EA server + local HTML", us: "Git PR + Family Album yaml + Micropolis publish" }
  - { surface: Tiny Life Workshop, model: "Steam subscribe + export json", us: "Federate Workshop in CARD; Soul City soul-file bridge — lift Ell, don't replace" }
  - { surface: MOOLLM skills, model: "Zip publish", us: "skills/ tree + adventure rooms in moollm repo" }

federate_games:
  tiny_life:
    guest: ../../characters/ellpeck/
    bridge: ../../repo-shows/will-wright-premiere/game-bridge-sims-tiny-life.yml
    site: https://tinylifegame.com/
    note: "Friend project — metadata CARD + optional git mods; Soul City bridge; traffic to Steam/Workshop"

