# The GUID registry + remapper — TMog module and Soul City service (Don, 2026-08-29)
# Prose spec: guid-registry.md. Lineage: the 2004 Transmogrifier renovation plan asked for
# "The Sims File Cop rules, checks and conventions" — 22 years later the browser can do it.

meta:
  id: guid-registry
  type: module_and_service
  status: spec
  one_line: "Index every object id and Magic Cookie registration, document overlaps, remap ids so any objects coexist — creator attribution preserved."
  playful_name: "Sims File Cop on shrooms"

guid_anatomy:   # why suffix-only renumbering preserves credit
  bits: 32
  high_16: "Magic Cookie — the producer (person or org), honor-system registered at thesimstransmogrifier.com"
  low_16: "Suffix — which object that producer made (originally random)"
  design_consequence: |
    Renumber the LOW half and keep the cookie: a remapped object still says who made it.
    Attribution survives the collision fix.
  registry_rules_2004:
    - "65535 cookies; each allows fewer than 65536 unique objects"
    - "Maxis-published object ids are RESERVED regardless of cookie field"
    - "Cookie hoarders banned, cookies recycled"
    - "Transmogrifier clone dialog defaulted the cookie to 0 when unset — a large unknown tier"
  source: ../../characters/will-wright/sources/2004-transmogrifier-magic-cookie-registry/README.md

id_space_tiers:
  official_maxis:
    what: "Base game + every expansion — immutable anchors, reserved regardless of cookie field"
    policy: "NEVER renumbered; conflicts resolve around them"
    deliverable: "Complete catalog of official objects — also the test that no UGC overlaps it"
  registered_cookies:
    what: "Producers who signed up 2000-2004"
    seed: "Don has the old registration database — becomes the index seed and historical record"
  unregistered_unknown:
    what: "Cookie 0, hand-hacked ids, tools that ignored the convention, 26 years of drift"
    note: "Where the interesting damage lives"
  newly_issued:
    what: "Ids we allocate now, in space the index shows is free"

overlaps:
  stance: "Documented, not silently fixed"
  object_clashes: "Same 32-bit id, different objects — classified exact-duplicate / near-duplicate / hard-conflict"
  creator_clashes: |
    Two producers using the same 16-bit cookie — the honor system was an honor system.
    A cookie is EVIDENCE of a creator, not proof. Keep the ambiguity on the record.
  provenance_per_record: [source_file, root, archive, siblings_shipped_alongside]
  knowledge_model: |
    Incremental and cumulative: scan a new archive, learn more, publish the delta. Nobody has
    ever had a complete map of this space; building one is worth doing for its own sake.

remapper:
  what: "TMog module in SoulAngel — pick any set of objects, however conflicting, get an installable set with unique ids"
  policy_order:
    1: "Never renumber an official Maxis object"
    2: "Renumber the SUFFIX only, keep the cookie — creator stays legible"
    3: "Stay close to the original: prefer the nearest free suffix, so ids remain recognizable"
    4: "If the cookie itself is contested, keep it and record the ambiguity — do not launder it"
  hard_part: |
    Not the number — the REFERENCES. SimAntics code, other objects, and save files point at GUIDs.
    A remap that misses a reference breaks the object. The whole-library reference graph
    (scan every object's code for GUID refs, build edges, keep coherent families together) is a
    PREREQUISITE, not an optimization.

virtualized_ids:   # the key move (Don, 2026-08-29)
  principle: "Object ids are virtualized PER SAVE FILE — global uniqueness was never actually required"
  registry_holds: "Global truth about identity and provenance"
  save_holds: "Its own mapping table from registry identity to that save's local id space"
  scope_clarification: |
    "Save file" INCLUDES the Downloads directory (Don, 2026-08-29) — that is where the local id
    space actually lives. Installed custom objects DEFINE the numbers; neighborhoods and lots only
    REFERENCE them. So the unit is the CLOSURE: install + Downloads + every neighborhood and save,
    remapped together as one transaction. We have read/write over all of it, so it can be atomic —
    the same supernatural access the web reaper has (sims1-soul-bridge.yml), aimed at identity.
  closure: [install, downloads_directory, neighborhoods, saves, lots]
  consequences:
    - "Two globally colliding objects can both be installed in the same game under different local ids"
    - |
      The closure is remapped TOGETHER and consistently; rewriting saves without Downloads (or
      Downloads without the saves that point into it) breaks the game.
    - "Registry identity never changes no matter how many local ids it wears — credit attaches to identity, not to a free number"
    - "Save-before-mutate, always, with operator consent — snapshot the whole closure, not just the touched file"

provenance_stamp:   # Don, 2026-08-29 -- renumbered objects carry their own papers
  what: "When we renumber an object we stamp metadata INTO it: what the original was, plus a JSON snapshot of what the database knows"
  contents:
    original_numbers: "Ids and magic cookie AS FOUND -- so any remap is reversible and re-mappable"
    the_remap: "Old to new, which set, which tool version, when"
    registry_snapshot: "What we knew at stamp time: provenance, source archive, requirements, conflicts, attribution state, readme if any"
    resolvable_id: "For the live version -- the snapshot is a cache and knows it"
  why_in_the_object_not_only_the_database:
    because_objects_escape: |
      Somebody zips their Downloads folder and posts it in 2031 on a forum we never heard of, long
      after whatever happens to us has happened. A file carrying its own provenance stays
      interpretable by strangers with no access to our index; a file whose provenance lives only in
      our database goes anonymous again the moment it travels.
    principle: "METADATA TRAVELS WITH THE ARTIFACT, NOT JUST IN THE INDEX"
    also: "The honest answer to 'what if Soul City disappears' -- and it costs a few kilobytes"
  append_never_overwrite:
    principle: "Provenance is a LOG, NOT A FIELD"
    effect: "An object through three sets carries all three entries in order; a second pass cannot quietly erase the first. A stamp already present means we are RE-processing -- worth knowing on its own."
    safety: "Original numbering always recoverable; cross-set migration lossless in both directions; dummy objects know exactly what they stand in for"
  three_places:   # because tools are careless
    caveat: "An unknown IFF chunk SHOULD be skipped harmlessly -- VERIFY against the game and common editors -- but a tool that REWRITES the file may drop what it does not recognize"
    1_custom_chunk: "Machine-readable JSON. The truth."
    2_string_table_entry: "Short human-readable summary in a chunk type every Sims editor supports -- visible even in tools that know nothing about us; this is what the About box renders"
    3_sidecar_file: "Beside the object, for tools that never look inside and objects rewritten by something old and grumpy"
    redundancy: "Any two surviving is enough to reconstruct the third"
  contents_rules:
    small: "A snapshot SUMMARY, not a database dump: a few KB, with ids to resolve for the long version. Embedded says LAST KNOWN; online says CURRENT."
    facts_about_the_object_never_the_person: "No local paths, no usernames, no machine identifiers, nothing about who ran the tool. Downloads folders get shared; a stamp must never leak somebody's home directory."
  dividend: "Because the stamp is in the file, THE ABOUT BOX WORKS WITH NO NETWORK AT ALL -- it renders from the embedded snapshot, with the scannable link there for the live version"

about_slice_delivery:   # Don, 2026-08-29 -- the registry shows up IN THE GAME
  problem: "A registry nobody reads is a filing cabinet"
  mechanism: "The import transform that builds a Downloads set injects an About action into every object it imports -- first slice, always top"
  contents: [identity, provenance, original readme verbatim, conflicts and the remap applied, scannable link to the registry page, illustrated user-contributed pages]
  both_directions:
    when_known: "The player finally gets an answer, and creators stripped of attribution by the old repack chain GET THEIR CREDIT BACK"
    when_unknown: "The box says exactly that and ASKS -- every unidentified object in every player's game becomes a documentation prompt at the moment somebody is curious"
  why_it_matters: "How a corpus this size gets cataloged: it asks for help from inside the game"
  full_spec: object-shops.yml   # about_slice

implementation:   # Don, 2026-08-29 — the honest mechanism
  hard_constraint: "We do NOT change how The Sims reads and writes files. Its file handling is fixed; we work with it."
  what_we_control: "Which directory trees occupy the paths the game reads: GameData, UserData, Downloads"
  mechanism: "Not runtime indirection — honest file management"
  steps:
    named_sets: "Every Downloads tree (and companion user data) is a named, registry-tracked set with a manifest of contents and which id mapping it uses"
    mount_one: "The game always sees exactly ONE set, where it expects it. Swap between sessions, never during."
    synchronize: "The registry knows what each set holds — sets can be built, diffed, updated, shared, rebuilt from manifests"
  sets:
    default: "For normal play"
    special_purpose: |
      Built for one body of content: a zombies set, a SimProv set, a recreate-a-2002-fansite set.
      Small, coherent, fast to load, no conflicts — a purpose-built set holds only what it needs.

save_scope:   # the rule that makes the model sound
  rule: "A SAVE FILE BELONGS TO A DOWNLOADS SET — its object ids only mean anything inside that set"
  binding: "Part of the save's identity; the registry records it"
  cross_set_move: "A MIGRATION, not a copy"
  migration_steps:
    - "Remap every object id in the save into the target set's id space"
    - "Discover which objects the target set does not have — unknown objects are the NORMAL case, not an error"
  dummy_objects:   # long-term plan; design toward it now
    what: "Generate a placeholder object standing in at the right id, carrying what the save knows about what belonged there"
    marking: "Marked as a dummy in a way WE RECOGNIZE on the way back — this is what makes round-tripping work"
    round_trip: |
      Migrate a save to a poorer set and home again, and the real objects come back because the
      dummies remembered their places.
    presentation: |
      Invisible or an obvious placeholder — a pie menu action away in either direction.
      "Make invisible" / "show placeholder" is exactly what the action editor generates
      (object-shops.yml). A lot full of invisible dummies still loads, still plays, and still
      reports what is missing when asked.
  direction: "FULL VIRTUALIZATION OF GAME DATA — not this month, but every decision stays compatible with it"

lineage:
  request_2004: |
    From Don's own Transmogrifier renovation plan, user-requested features: "Incorporate The Sims
    File Cop rules, checks and conventions from managing objects and verifying validity. Detect,
    repair and prevent conflicts and crashes." Same document requested object preview export and
    the statue renderer now spec'd as Stat-U-Matic.
  source: ../../characters/will-wright/sources/2004-02-05-transmogrifier-renovation-plan/README.md
  existing_groundwork:
    collision_analysis: "TMog suite collision layer (carried from SimObliterator) — intake, exact grouping, near-match clustering, classification; ANALYSIS ONLY, never mutates"
    catalog_storage: ../../apps/soul-angel/windows/CATALOG-DB-SCHEMA.yml   # objects, guid_references, guid_collision_cases, creators
    public_triage: ../../apps/soul-angel/windows/GUID-ISSUE-HUB.yml        # one issue per GUID or cluster
  what_this_adds:
    - "The registry as a first-class PUBLISHED artifact (official catalog + cookie registrations + observed ids)"
    - "The remapper as a shipping module"
    - "Per-save virtualization as the policy that makes arbitrary combination safe"

monetization:
  free: "Local scans and remaps of your own folders — like every other local TMog operation"
  metered: "Hosted registry side: continuous Downloads-folder monitoring, catalog-wide bulk ops, the published index"
  spec: membership-model.md

