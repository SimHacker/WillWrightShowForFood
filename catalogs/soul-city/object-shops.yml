# The shops + the action editor -- objects as UGC containers (Don, 2026-08-29)
# Prose spec: object-shops.md. The realization: a startling number of Sims objects are already
# containers with a switch. Ship them empty, let players fill them.

meta:
  id: object-shops
  type: module_cluster
  status: spec
  one_line: "Ordinary game objects as containers for player content, plus a general pie menu tree editor that builds new ones without code."
  clusters_around: sims1-soul-bridge.yml   # the shops-and-residencies district
  governed_by: rendering-and-rights.yml

shops:   # each = one template + a generator + a storefront; open list by construction
  jukebox:
    container: "Music player"
    fill_with: "Your own tracks -- the most requested thing in the game's history, and it was always just a file list"
    moody_jukebox:   # Don, 2026-08-29 -- the flagship demo of the ad editor
      canonical_design: https://github.com/SimHacker/moollm/blob/main/designs/MOODY.md   # "A moody jukebox for The Sims 1, in SimAntics"
      lineage: |
        NOT a new design -- the implementation of one. Proposed to the Maxis team as SimRadio on
        1999-02-18 with the moody track as its emotional payload; MOODY.md is the canonical spec.
        This entry covers the shop and its authoring tool.
      show_seed: ../../repo-shows/moody-midi-for-mood/moody-midi-for-mood.yml
      why_flagship: "Exercises every part of the system at once: advertisement conditions, consequences, timelines"
      when_does_it_call_you:
        what: "Conditions on the ADVERTISEMENT, written against motives the game already tracks"
        examples:
          - "Play when you gotta pee (bladder low)"
          - "Play when you are tired (energy low)"
          - "Play when you are sad (mood down)"
          - "Any combination, plus time of day, who is home, what room"
        point: |
          The object is not waiting to be clicked -- it advertises to specific MOODS. The Sim
          wanders over on their own because the right song was listening for the right moment.
      what_does_it_do_to_you:
        what: "Moody consequences -- action plugins pointed at motives"
        examples: [mood_boost, energy_lift, comfort_bump, fun_spike, any_plugin]
      moody_timelines:
        what: "Schedule effects along the track -- chorus hits and mood jumps; bridge drops and the Sim slows"
        mechanism: "Dead reckoning audio time, assuming normal play speed (Don's own framing)"
        honest_constraint: |
          The game will not report the playhead, so the timeline is OPEN LOOP: note when the track
          started, count forward, compute position. What moves the goalposts is GAME SPEED -- audio
          runs in real seconds while sim time can run 2x or 3x, so a timeline authored in audio
          time drifts against a fast-running game.
        moody_terms: "(time, tag, heat) envelopes -- the mood swing literally IS an envelope; conditions read the same parameter bus from the other end"
        correction: |
          GAME SPEED IS INVISIBLE FROM INSIDE SIMANTICS -- ticks are the only clock, so all speeds
          feel identical from within and the object CANNOT notice a speed change. The drift is
          structural, not detectable in-object. (Corrects an earlier note that said otherwise.)
        mitigations:
          - "t=0 is anchored to the tick that issued the play call"
          - "Ticks convert to seconds by calibration (MOODY.md ships measured constants)"
          - "Resync is free at every track boundary -- the jukebox controls when songs start"
          - "Quantize envelopes to coarse sections (intro, verse, chorus, drop) -- dead reckoning never misses by a section"
          - "Emotional weather is forgiving in a way lip-sync is not"
          - "Web side has full save access and can calibrate; FreeSO/Simitone can grow a real audio-position primitive and close the loop"
      shop_tool: "Advanced moody timeline + audio editor -- waveform, markers, condition/consequence editors side by side; scoring your game is a visual task, not a programming one"
      blue_note:   # Don, 2026-08-29: "One fun moody action is the blue note! ;)" -- already canon in MOODY.md
        what: |
          The legendary BROWN NOTE, in this schema, is just a tag whose constraint binds not to a
          mood but to the BLADDER MOTIVE AT MAX GAIN -- media driving physiology, skipping the heart.
        localization: |
          The Sims localizes it as THE BLUE NOTE: Sims pee blue puddles, the game collapses all
          bodily catastrophe into one blue-puddled bladder motive, so the note comes out the color
          of the puddle. Also the bent, flatted tone that makes the blues the blues -- exactly the
          register of a Sim standing in a puddle with both hands on their head.
        artifacts:
          prank_subwoofer: "A legitimate plug-in object with a BLUE-NOTE parameter track"
          diaper: "A buff that disables exactly one binding"
        real_world: "MythBusters busted the note; in a microworld it works every time"
        point_under_the_joke: |
          The moody track is a PARAMETER BUS, not a mood system. Mood was just the first thing worth
          broadcasting on it. Any plugin that can write a motive can be scheduled on a timeline and
          advertised on a condition -- which is why "play when you gotta pee" and "make you need to
          pee" are the same machinery pointed in opposite directions.
      the_argument: |
        A jukebox that plays your songs is nice. A jukebox that knows your Sim is miserable at 3am
        and plays the right song, unprompted, is the game writing a scene with you.
  video_quote_rig:   # Don, 2026-08-29 -- frames on a TV, movie screen, or rug
    container: "Selected frames plus their transcript lines (rug, painting, TV, projector screen)"
    fill_with: "Frames from your own video, chosen by hand or picked via transcript, each carrying a scannable citation back to the source at its timecode"
    no_new_object: "RugOMatic plus a frame picker in front"
    frame: "A frame plus its transcript line is a BLOCK QUOTE of a video -- fair-use sized, citation attached"
    rules: rendering-and-rights.yml   # media_sources.frames -- cue sheets not pixels; enclosure-only fetching

  squawk_box:   # Don, 2026-08-29 -- trainable parrot / sound board; THE SHAREABLE ONE
    container: "Recorded sounds plus dialogs"
    fill_with: "Your own microphone. Your cat meowing. Your dog farting. Your kid's laugh. A photo from your pocket."
    names: [Squawk Box, trainable parrot, sound board]
    the_delight: |
      Immediate and slightly stupid, which is the correct register: invent silly action names
      attached to your own sounds and have them AFFECT THE SIMULATION.
    inherits_from_jukebox: "Everything -- conditions on advertisement, consequences as plugins, timelines. It was never really about music."
    dialogs: "Every action can open a dialog (title, picture, text, buttons, branching) -- rung 3; a sound board is one edit away from interactive fiction that talks in your voice"
    embodiment: |
      A trainable parrot wants to be a CHARACTER rather than an appliance (Death precedent,
      sims1-soul-bridge.yml). Whether the game ships a bird to embody is a question for the
      official-object catalog scan (guid-registry.yml); if not, we make the object.
    rights_clean_by_construction:   # the strategic point -- a rights argument, not an aesthetic one
      music_is_encumbered: |
        Locally fine, and exactly the point of local-first: make an object with any track you love
        on your own machine and nobody distributes anything. But SHARED music is somebody else's
        copyright -- the one content class that cannot go viral safely.
      your_media_is_yours: |
        Voice, pets, phone photos: no license, no clearance, no takedown, no gray area. Shareable
        BY CONSTRUCTION. The publishable class is also the more personal and funnier one.
      the_viral_artifact: "A template + your own recordings and photos + visually programmed behavior"
      requirements_met:
        inherently_shareable: "Only the creator's own media -- no third-party rights, no official game art"
        browser_full_fidelity: "Voice, photo, dialog, buttons need no install to EXPERIENCE; owning the game is what lets you INSTALL it"
        template_based: "One template, infinite instances, each on the template index page"
        visually_programmable: "The action editor and its ladder"
        expressive_personal: "It is literally your voice and your cat"
        memetic: "THE TEMPLATE IS THE MEME FORMAT -- instances are the memes; the template index page is the gallery"
      distribution_strategy: |
        A meme format is a template strangers fill in and pass along; ours are EXECUTABLE. Fill in
        the blanks with your own media, get a real object, and it plays back in anybody's browser
        whether or not they own the game. Owning the game is the upgrade, not the ticket.
      composes_back: |
        Once the sharing-safe class exists, the sophisticated storytelling machinery (branching
        dialog, motive consequences, moody timelines) rides on content free to travel. The jukebox
        stays local and personal; the squawk box goes everywhere.

  anythingomatic:
    container: "Accessory manager (appliance pattern, portals-and-modules.md)"
    fill_with: "Any accessory category -- toggle on/off, reset, organize; generalizes past wigs"
  rugomatic_picture_rig:
    container: "ONE rug holding MANY images, switchable from the pie menu"
    fill_with: "Import a Family Album into a rug -- walk on your own story. A picture rig you can stand on."
  backdrop:
    container: "Switchable scene backdrop"
    lineage: |
      Superstar (2003) brought the film set, photo shoot set, and music video set to Studio Town.
      Bring the backdrop home and load your own scenes. (Exact object names to be confirmed from
      the official-object catalog scan -- guid-registry.yml.)
    fill_with: "Your own scenes"
  statue:
    container: "Posed character"
    spec: stat-u-matic.md
  tombstone:
    container: "Text and a soul"
    spec: sims1-soul-bridge.md   # Tombstone Generator embodied in Death; the reaping ceremony
  open_list: [tvs, paintings, fireplaces, fish_tanks, signs, computers, radios, aquaria, lava_lamps]
  rule: "Every object with a state you can switch is a shop waiting to open"

action_editor:
  what: "General pie menu tree editor -- organize any number of actions into slices, submenus, slides"
  populated_from: "A library of ACTION PLUGINS; no SimAntics required to make a jukebox that plays your songs"
  two_kinds:
    player_actions:
      what: "What appears when you click the object"
      examples: [toggle_accessory, switch_to_picture, play_track, next_scene]
    autonomous_actions:
      what: "What the object BROADCASTS so Sims come use it on their own -- the motive advertising system"
      surface: "THE AD EDITOR -- set what the object advertises, to whom, how loudly, under what conditions"
      dispatch_semantics: ../../schemas/advertisement-dispatch.yml   # forward / inject / hub; SimAntics lineage acknowledged
      why_it_matters: "An object without advertisements is furniture; an object with them joins the simulation. The editor should make the second no harder than the first."

plugin_ladder:   # progressive disclosure, NOT tiers sold separately
  1: "Play this audio file [upload file]"
  2: "Show this picture and text [upload picture] [enter text]"
  3: "Say something in a popup, with this picture and these buttons -- each button branches to another node"
  4: "Conditionals and state -- remember choices; gate slices on motives, relationships, time of day, who is clicking"
  5: "A friendly visual programming language -- branching dialog and behavior graph, authored visually, compiled down"
  6: "Raw SimAntics -- Edith-class access for people who want it"
  rung_3_note: |
    Where it stops being decoration and becomes INTERACTIVE FICTION INSIDE A SIMS OBJECT: a
    branching conversation with a picture and buttons is a complete storytelling medium, and it is
    maybe two weeks of work on top of rungs 1 and 2.
  why_not_both: |
    The ladder does not replace Edith. Visual language for everyone, raw semantics tree for the
    people who grew up reading it. Everything the friendly editor emits must be inspectable and
    editable at the level below it, all the way down.

preview_runtime:   # Don, 2026-08-29 -- "it can say what it would have done"
  we_own_both_ends: |
    We design the templates AND implement the runtime, so full-fidelity browser playback is a
    DESIGN GUARANTEE, not an emulation problem. Nobody emulates The Sims to show off a squawk box --
    the only thing that needs running is the layer the author actually wrote.
  the_pie_menu_is_the_point: |
    Not a form describing the pie menu, not a screenshot of one: THE OBJECT'S OWN PIE MENU, LIVE,
    built from the authored tree, doing what it does as far as it can go. Click a slice: sound
    plays, dialog opens, picture is there, buttons branch, state remembers. The preview of what you
    made -- and the same thing a stranger experiences on the object's page.
  layers:
    authored: "pie menu tree, sounds, pictures, dialogs, branching, state, timelines -> EXECUTED EXACTLY (our code, our data)"
    simulated: "motives, routing, animation, autonomy, other Sims -> DECLARED, NOT FAKED: it says what it WOULD HAVE done"
  narration_beats_faking: |
    "Fun +30, Comfort +10." "The Sim would walk here and use this for two hours." "Advertises to
    tired Sims within eight tiles." A fake simulation is a lie that breaks the moment it disagrees
    with the real game; a STATED CONSEQUENCE is accurate by construction and makes invisible
    mechanics visible during authoring. The preview is an INSPECTOR, not a diorama.
  reads_the_argument_aloud: |
    The rhetoric layer surfacing (see visual_procedural_rhetoric): an ad is a claim about what is
    worth wanting, and the preview states the claim in words while the author is still deciding
    whether they meant it.
  falls_out_free:
    one_runtime_two_audiences: "Author preview and stranger playback are the same code path -- no separate web demo to keep in sync. Whatever previews, shares."
    dry_run_is_a_test_harness: |
      If it can say what it WOULD have done, it can enumerate what it COULD do: walk every branch,
      list every ending, flag the slice unreachable because its condition can never be true.
      Authoring tools usually get that late or never.
    real_simulation_is_an_upgrade_path: |
      The authored layer is DATA; a real VM can consume it. FreeSO/Simitone
      (../sims-open-source-and-formats.yml) are where "actually simulate it in the browser" lives
      if anyone wants it. Not needed to ship; designing as if we might get it costs nothing.

radio_simulator:   # Don, 2026-08-29 -- the natural top-of-ladder project; why the ladder goes that high
  what: "Several shows, each a sequence of clips, randomized, looping, commercials inserted -- the GTA model"
  key_insight: "A station is NOT a playlist, it is a SCHEDULER OVER POOLS OF SEGMENTS"
  segment_pools:
    music: "The tracks, tagged"
    dj_links: "Patter between songs"
    station_ids: "The three seconds that make it a station"
    commercials: "Fake ads -- the classic delight"
    other: "News, weather, call-ins, whatever the author invents"
  programming_rules: "No repeat inside a window; patter between songs; ad break cadence; this show mornings, that one nights"
  ladder_rung: "Rung 4 (conditionals + state) pointed at a playlist instead of a conversation -- no new engine features needed"
  dead_reckoning_easy_case: |
    A station that plays whether or not anyone is tuned in is the moody-timeline trick, but CHEAPER:
    it needs only a start tick plus a table of segment durations. Tuning in mid-song is the FEATURE
    and it falls out of arithmetic, not an audio API the game lacks.
  simradio_with_the_network_moved:
    source: ../../characters/don-hopkins/simradio-moody-1999-maxis-email.md   # 1999-02-18 to the Maxis team
    then: "SimRadio needed THE GAME on the network: SimRadioStation servers, IP multicast, a receiver in the game"
    now: |
      No networked game at all. THE TOOLS are networked; the game reads local files. Browser-based
      save/object editing is the delivery channel and it is asynchronous by nature: fetch, compose,
      bake, write. Content still arrives; nobody is forced online to play; the always-online lesson
      stays learned.
    survives: [fresh programming instead of insane loops, plug-in objects as diegetic events, personality-filtered reactions]
    does_not_survive: |
      LIVE SIMULTANEITY -- the twentieth-caller contest, everyone hearing the same broadcast in the
      same minute. Scheduled drops approximate it (bake a segment with a time window; the ad expires
      on schedule) but true simultaneity needs a network the game does not have. Say so.
  squawk_box_is_the_staff: |
    Your DJ links, station IDs, and fake commercials are recordings YOU made -- the whole station
    lands in the rights-clean class. And MOODY's pun is load-bearing: A RADIO AD IS A SIMS
    ADVERTISEMENT in the full behavioral sense, broadcast into the room, scored by everyone who
    hears it, acted on by the susceptible. Authoring a commercial IS authoring an argument aimed at
    your Sims' desires -- the mechanism, not a joke about it.
  podcasts:   # Don, 2026-08-29 -- "export podcast list to sims radio object, several podcasts on the same radio"
    the_import_is_a_file_open_dialog: |
      PODCAST APPS EXPORT SUBSCRIPTION LISTS AS OPML -- Apple Podcasts, Pocket Casts, Overcast,
      AntennaPod, all of them, because sharing subscription lists was the point of the format. Not a
      scraping project.
    mapping:
      opml_subscription_list: "The dial: one station per show"
      rss_feed: "A station's schedule"
      episode_enclosures: "The segments"
      chapters: "Segment boundaries inside a long episode (Podcasting 2.0 JSON, or ID3 chapters)"
      transcripts: "podcast:transcript -> subtitle popups, search, and mood tagging"
    several_on_one_dial: "The pie menu tree becomes the tuner -- no new mechanism"
    first_genuinely_shareable_catalog: |
      The format/catalog split said the records stay home -- but a PODCAST catalog IS A LIST OF URLS,
      and feed URLs are made to be passed around. Sharing a podcast station = an OPML file plus a
      schedule; the downloader's tool fetches the episodes itself. Nothing encumbered moves between
      players.
    fetch_client_side_from_the_publisher:
      rule: "Fetch audio client-side from the publisher's own feed, NEVER through us"
      why_not_just_legal: |
        Hosting somebody's show is redistribution, but the direct fetch is also the RIGHT thing: the
        publisher gets the download, the analytics, and the subscriber. A proxy would quietly steal
        all three. Podcasters have reason to LIKE this rather than tolerate it.
    freshness_is_the_1999_dream:
      mechanism: "Refresh: re-fetch latest episodes, re-bake, write into the Downloads set (guid-registry.yml)"
      payoff: "Open the tools on Sunday and your Sims radio has this week's shows"
      simradio: "Exactly what SimRadio wanted servers for -- fresh programming instead of insane loops -- with NO NETWORKED GAME AT ALL"
      monetization: "An honest recurring reason to open the tools: scheduled refresh + transcoding as a paid service (membership-model.md). Bake stays free and local; the convenience is the product; no content is ever sold."
    long_form_fits:
      time_scale: "A Sims day is roughly 24 real minutes at normal speed (calibration constant -- verify against the build), so an hour episode spans ~2.5 Sim days"
      chapters: "Clean segment boundaries where a show publishes them"
      better_answer: "Leave episodes whole and let the station keep its virtual playhead -- DEAD RECKONING TURNS LONG-FORM INTO REAL RADIO: tune in mid-sentence, the show was already going without you"
    better_than_the_podcast_part:
      talk_radio_in_the_dollhouse: "MOODY's SimDJ slot has been empty since 1999; the world now produces effectively infinite free talk audio, so the slot fills itself and motive consequences are already authorable"
      transcripts_compile_to_mood: |
        A show that ships a transcript can have its moody envelopes GENERATED from its own content
        instead of hand-authored -- a legitimate AI feature, not a decorative one. Subtitle popups
        come free, which is accessibility arriving through the side door.
    soulglyph_closes_the_loop: |
      Put a SoulGlyph on the radio pointing at the current show: SCAN YOUR SIMS RADIO, SUBSCRIBE ON
      YOUR PHONE. In-game listening becomes real-world subscription, linking is always clean, and the
      podcaster gains a listener out of somebody's dollhouse.

  format_vs_catalog:   # why stations are shareable even when music is not
    format: "Schedule, rotation rules, patter, jingles, show structure -- authored structure plus your own voice, so it travels clean"
    catalog: "The records -- encumbered music stays a local-only pleasure, exactly as designed"
    shared_station: |
      Arrives as programming with SLOTS: asks for tracks by tag or role, downloader maps their own
      library in. Every instance personal; the FORMAT is the shareable artifact. Radio formats have
      been syndicated this way for a century, and it is the only rights-clean version of this.

about_slice:   # Don, 2026-08-29 -- inject metadata into OTHER PEOPLE'S objects at import time
  trigger: "Importing user-created objects into a Downloads scope (guid-registry.yml)"
  injection: "An About action as the FIRST slice, ALWAYS TOP, where the about box belongs"
  the_question: "What the hell is this, where did it come from, and what can you tell me about it? -- asked about half of everyone's Downloads folder for 25 years"
  why_it_is_different: "Everything else in this file is about objects WE generate. This reaches objects OTHER PEOPLE made -- most of the corpus and all of the history."
  contents:
    identity: "Ids, and the magic cookie that names the creator"
    provenance: "Which archive or site, when scanned, the original download page, and THE ORIGINAL README VERBATIM when we have it (frequently the only documentation that ever existed)"
    requirements_and_conflicts: "Which expansion it needs; what it collided with in your set and what remap we applied"
    soulglyph: "Scan it, land on the object's registry page, read the long version, contribute to it"
    illustrated_help: "Pages, paginated with Next buttons, user contributed and curated"
  no_new_machinery: |
    An About box is a title, a picture, text, and buttons -- RUNG 3, the same plugin a squawk box
    uses to tell a joke. The archival apparatus and the fart button are built from the same part.
  credit_restored_retroactively:
    the_history: "Enormous amounts of 2000s custom content circulated repacked, rezipped, and stripped of its readme; creators lost attribution to the redistribution chain"
    what_survived: "The magic cookie, usually -- because it is INSIDE the object"
    the_move: "The About slice GIVES CREDIT BACK to people never credited by whoever passed their work along. Archival, not legal -- and it is what makes the registry worth trusting."
    dead_sites: |
      Creator URLs from 2002 mostly do not resolve. The resolve-an-id indirection lets our redirector
      fall back to an Internet Archive snapshot instead of a 404: point your phone at a
      fifteen-year-old object and arrive at its creator's site as it stood when the object was new.
  when_we_know_nothing:   # this case matters MORE than the well-documented one
    bad: "An About box that says 'unknown' is useless"
    good: "One that says what it can INFER and HOW TO HELP turns every mystery object into an open question with a submit button"
    example: "Creator cookie 0x4A2F, unregistered. Scanned from a 2004 archive mirror. Nobody has identified this yet. Do you know what it is?"
    the_flywheel: |
      THE ABOUT BOX IS THE CROWDSOURCING INTERFACE. Every unidentified object in every player's
      Downloads folder becomes a prompt, in context, at the moment somebody is curious. The corpus
      documents itself because the object asks. No cataloging campaign we could run would reach as
      many people as their own game does.
  the_page_behind_the_link:   # Don, 2026-08-29
    what: "The About link lands on THAT OBJECT'S PAGE -- a venue, not a record: chat, hints, tutorials, corrections, and CLAIM ATTRIBUTION for work that lost its credit in the repack chain"
    same_page_type: "The template instance browser -- objects we generated and objects strangers made in 2003 both get one page each, in one system, reachable by scanning the object"
    backend_github_first:   # Don's call
      discussion_is_free_and_moderated: "Threads, markdown, image uploads, notifications, search, spam handling, identity -- none of which we build. Discussions suit hints/Q&A; Issues suit corrections."
      claims_become_reviewable_diffs: |
        THE REAL WIN. A claim against registry data arrives as a PR or structured issue, gets
        reviewed, lands as a commit with author, date, signature. PROVENANCE HISTORY IS GIT HISTORY --
        the right shape for an archival project, and something a form-and-database would reinvent badly.
      issue_forms_parse_to_registry_data: "Humans fill a friendly form, a bot emits clean YAML. Liberal in, conservative out."
    limits_named_now:
      no_github_account_required: "Reading requires nothing. For writing, Soul City is the friendly face and GitHub the ledger: our form takes the submission, a bot files it upstream with the contributor credited. Direct filing still available."
      it_will_outgrow_this: "Hundreds of thousands of objects on issues in one repo will hurt eventually. Git history is then the migration source of truth, so moving to Postgres costs no provenance. Start where the tooling is free."
    claims_are_evidence:
      why: "'I made this' twenty years later needs support: creator cookie, original site plus archive snapshot, an old readme, a forum post, a matching body of work, an account on a defunct fansite"
      states: [unclaimed, claimed, corroborated, disputed, settled]
      disputes_stay_disputed: |
        Two people claiming the same object gets what colliding ids get: DOCUMENT, DO NOT ADJUDICATE.
        A disputed object says so, shows both claims and both sets of evidence, and waits. We are not
        a court and pretending otherwise would poison the well.
      acted_on_without_argument: "A creator who wants their work taken down gets it taken down"
    the_loop:
      steps:
        - "Player finds a mystery object and clicks About"
        - "The box admits what we do not know and offers a scannable link"
        - "They land on the object's page and say what they know"
        - "Curation folds it into the registry entry"
        - "The next import bakes the answer into the About box, in the game, for everybody"
      summary: "THE GAME RECRUITS ITS OWN CATALOGERS AND THE CATALOG PAYS THEM BACK IN THE GAME"
      precedent: "Crowd-cataloging at this scale is well-trodden: MusicBrainz on edit-with-peer-review, Discogs on submissions with community votes, both with dispute processes rather than referees"

  reserved_position:
    rule: "Always first, always top -- where the about box has lived in every interface since 1984"
    muscle_memory_objection: "Does not really apply: Sims pie menus already vary slice count by object and state, so there is no fixed geometry to disturb. A reserved slot at a known angle beats angles that happen to be stable."
    object_manager:   # Don, 2026-08-29 -- "About could open up into a whole object manager! Or have submenus for all kinds of magical things."
      why_here: "THE SYSTEM SLICE IS THE ONLY GUARANTEED ENTRY POINT ON EVERY OBJECT IN THE GAME -- anything we offer on all objects has exactly one place to live, so About stops being a dialog and becomes a door"
      ancestor: "The Smalltalk inspector, not a help screen: open any object, see what it is, change it from the same window"
      groups:   # grouped by verb because a flat list becomes a junk drawer
        identity: [About, open its page, claim or credit it, view the remap chain, verify the stamp]
        repair: [fix conflicts, remap into this set, check requirements, restore original numbering, export a clean copy]
        author: [open in TMog, edit the pie menu tree, edit advertisements, swap media, reskin]
        life_and_death: [hand to Death, clone, spawn copies, resurrect from a tombstone]
        housekeeping: [reset, unstick, clear the interaction queue, make invisible, show placeholder, snapshot]
        social: [publish, share, report a problem, see every instance of this template]
      housekeeping_note: "That row is where the community's 25 years of cheat-and-fix folklore becomes an ordinary menu on the object that needs it, instead of a console incantation remembered from a forum post"
      three_channels:   # writing out the runtime limit reveals the architecture has three complete channels
        tools_to_game: "Bake content into the Downloads set and saves -- content arrives without the game opening a socket"
        game_to_tools: "A slice the engine cannot execute QUEUES AN INTENT IN THE SAVE FILE; the tools perform it next time they are opened. 'Remap this', 'clean this up', 'clone this thirty times'. The game asks; the tools answer later."
        game_to_web_through_the_player: "The SoulGlyph -- point a phone at the screen and leave the game entirely"
        property: "Every arrow is asynchronous and offline-safe. The player never has to be online, and nothing requires the game to know the internet exists."
      disciplines: ["The system submenu must never crowd out the object's own actions", "Anything destructive snapshots first and stays undoable"]
    system_slice: "About is the first citizen of a SYSTEM SLICE -- our slot on somebody else's object. Family: repair a conflict, remap, export a clean copy, hand it to Death, report a problem."
  inherited_rules:
    never_modify_the_original: "Injection is part of the import transform that builds the Downloads set; originals untouched, unmodified copy always exportable (save-before-mutate discipline)"
    removable: "Anyone who wants their menu back can have it"

qr_codes:   # Don, 2026-08-29 -- "THIS OPENS UP THE UNIVERSE"
  name:   # DECIDED Don, 2026-08-29
    soulglyph: "The MECHANISM -- platform-level, because it works for any game (Soul family)"
    tmogcode: "The sims1 OBJECT that displays one (TMog family)"
    rationale: "Follows the decided Soul/TMog split: Soul = cross-game platform, TMog = sims1 content tools"
  build_scope: "DECIDED Don, 2026-08-29: dialog surface FIRST AND ALONE, shipped alongside the Squawk Box -- the surface that always scans. Panel and conditional-destination shop follow; neither is worth delaying a mechanism this cheap."
  what: "Objects that display QR codes with URLs. Any number per object, chosen by circumstance. In popup dialogs and drawn in the world."
  the_unmet_need: |
    Twenty-five years of Sims object creators wanting a link back to their own site inside their
    object, that players can ACTUALLY FOLLOW. Met.
  why_it_works: |
    Every other route out of the game needs the game to cooperate: clickable links, a browser
    control, network access, an API nobody shipped. This needs none of it, because the channel is
    not the game -- it is THE PLAYER'S PHONE LOOKING AT THE SCREEN. A QR code is a static bitmap
    baked at authoring time: no engine change, no runtime cost, no network in the game, nothing to
    patch. A 2000-era engine gets a working hyperlink because the link travels OUT OF BAND.
  fills_the_architecture_hole: |
    Tools networked, game not; content flows IN by baking into saves (radio_simulator) -- but
    nothing flowed OUT. The return path now exists and needs no permission from anybody.
  surfaces:   # in order of reliability
    1_dialog: "Biggest, flattest, most stable, stops the world while open -- the default. VERIFY what the dialog primitive accepts in its picture slot."
    2_catalog_thumbnail: "If the dialog picture is the object's icon, MAKE THE ICON THE CODE. Bonus: thumbnails show in buy mode, so the object advertises its source from the catalog."
    3_in_world_panel: |
      The spectacle version. Sprites are pre-rendered per rotation/zoom anyway, so draw the code
      FLAT AND SCREEN-ALIGNED in all four rotations rather than perspective-projected. Reads as a
      floating magic sign; flat beats skewed at this resolution.
  scannability:
    module_budget: "v1 (21x21) ~25 alphanumeric chars; v2 (25x25) ~47; v3 (29x29) ~77. Numeric-only is denser -- short domain + numeric id is the cheapest code."
    pixels_per_module: "Phones want ~3 screen px/module off a monitor. v3 at 3px plus quiet zone ~110px square: comfortable in a dialog, fine at closest zoom, hopeless at farthest. Zoom level is part of the design."
    quiet_zone: "Four modules of light border or scanners fail -- so EDGE occlusion breaks a code as thoroughly as center occlusion. Pad generously."
    flash_timing: "A phone wants ~1 second of steady frame. Cycling codes fine; strobing not."
    test_scan_in_preview: "The preview runtime decodes its own render at each target zoom and reports which scan -- the dry-run test harness catching an unscannable code before publishing."
  occlusion: |
    High z helps and will not save you: Sims 1 composites per-pixel against a z-buffer, so a tall
    enough neighbor wins. Wall paintings fare better than floor tiles; the dialog is the guaranteed
    surface. And the failure mode is a joke about the game's own rules -- "GET OUT OF THE WAY, I AM
    TRYING TO OPEN A QR CODE" is a perfect Sims sentence. Keep that failure mode.
  bake_an_id_not_a_destination:
    rule: "The URL is a stable short id WE RESOLVE, never a final destination"
    why: "Baked bitmaps are forever; a code minted today must land somewhere sane years later, after sites move and shops rename"
    dividends: [destination stays editable, dead links degrade into an explanation instead of a 404, per-instance identity rides along]
    closes_the_loop: "A scan lands on the exact instance page in the template instance browser -- see it, inspect it, install it. Every object becomes its own distribution vector."
  unlocks:
    credit_survives_distribution: "The creator's link rides inside the object, through every repost, forever"
    screenshots_and_video_carry_live_links: |
      A QR survives being photographed, streamed, clipped, re-encoded. Somebody else's let's-play or
      TikTok of your object is a WORKING LINK to it. This is the viral mechanism the shareable
      content class was missing.
    scan_a_tombstone: "The reaping ceremony gets a physical gesture: point your phone at a grave, arrive at the soul's page and the exit tally"
    conditional_codes: "Different circumstances, different destinations, chosen by the conditions the ad editor already evaluates -- a sign that links elsewhere at night"
  bright_lines:
    no_transaction_destinations: |
      EA's mods policy forbids monetary-transaction features in mods (membership-model.md), and a code
      that opens a checkout would be one. Creator site: fine. Cart: never.
    opaque_links_get_inspected: |
      A QR is unreadable to humans BY DESIGN, which makes it a phishing surface. So: the generator
      always displays the decoded URL; published codes resolve through our redirector; destinations
      are visible on the object's page before anyone scans; the redirector can revoke. Normal
      hygiene for hosting links -- build it in from the start, not after the first incident.

visual_procedural_rhetoric:   # Don, 2026-08-29 -- naming what rung 5 actually IS
  name: "Visual Procedural Rhetoric Programming Language"
  not_just_a_vpl: |
    A VPL is a language you draw instead of type -- that describes rung 5's NOTATION, not its
    PURPOSE. The purpose is Ian Bogost's procedural rhetoric: argument made through processes and
    rule authorship rather than words or pictures.
  bogost: ../../characters/ian-bogost/sources/procedural-rhetoric-quote.md   # "an unholy blend of Will Wright and Aristotle"
  the_loop_closes: |
    SimAntics was already a visual language and Edith was already its editor; Wright's half of
    Bogost's blend IS this simulation. What was missing was AUTHORS. Procedural rhetoric has had
    twenty years of critics and few practitioners because arguing in rules required being a
    programmer. Aristotle taught rhetoric as a CITIZEN SKILL -- too important to leave to
    professionals. Rung 5 is that theory applied to procedures.
  advertisement_is_the_argument:   # structural, not decorative
    claim: "A Sims ad literally IS an advertising claim: this object will satisfy this need, by this much, from this far"
    authoring_one: "Making a claim about WHAT IS WORTH WANTING"
    enthymeme: "The author supplies the premise; the Sim completes the argument by choosing to walk over"
    consequence: "THE AD EDITOR IS THE RHETORIC EDITOR"
  aristotle_mapping:
    logos: "The rule structure -- conditions, state, branching"
    pathos: "Motive consequences -- what it does to how they feel"
    ethos: "Whose object it is: credit, soul voice, the creator's name on the template"
    enthymeme: "The advertisement -- a premise the Sim finishes by acting"
  already_in_use: |
    The reaping ceremony was using the language before we named it: a tombstone speaking a
    character's last words is an argument authored in rules, delivered by a process, counted on a
    tote board (sims1-soul-bridge.yml, steam-app-strategy.md).
  consequences:   # accept these on purpose
    editorial_responsibility: |
      If templates carry arguments, WHICH TEMPLATES SHIP is an editorial decision wearing a
      technical costume. Own it explicitly rather than discovering it later.
    must_make_arguments_we_dislike: |
      The classic failure of persuasive-game tooling is the single-issue toy -- a machine that can
      only produce its author's opinion. Defense is already in the design: primitives are motives,
      media, and consequences, NEVER slogans. If ours can only make our argument it is not a
      language, it is a pamphlet with a GUI.
    venue_is_constitutive: |
      An argument nobody can hear is not rhetoric. Browser full-fidelity playback and the
      sharing-safe content class are parts of the LANGUAGE, not distribution details.
  open_naming_question: |
    The phrase is what the thing IS, but "VPRL" is not a name for a shop door. UI names stay plain
    (action editor, ad editor, timeline editor); whether the language gets a proper name is a
    branding decision, not a technical one, and it can wait.

why_it_matters: |
  These are not important objects. A rug that cycles your vacation photos is not important. But it
  is YOURS, it took five minutes, and it makes a house feel like somebody lives there. The Sims was
  always a medium for personal expression pretending to be a game about furniture; giving players
  containers to fill is the shortest path from "I downloaded some stuff" to "I made this, look."
  Every generated object gets its template index page -- the jukebox template's page lists every
  jukebox anyone published, a browsable installable catalog of other people's taste.

