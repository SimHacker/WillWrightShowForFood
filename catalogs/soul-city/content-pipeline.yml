# The content pipeline -- pristine sources, sidecar overlays, generated sets (Don, 2026-08-29)
# Prose spec: content-pipeline.md. One line: Downloads is a build output, not the source of truth.
# "It's a pipeline, never edit in place, just make data flow dependency network." -- Don

meta:
  decided_by: Don Hopkins
  date: 2026-08-29
  supersedes: "The implicit model where the Downloads directory WAS the content of record"

layers:   # one direction of flow
  catalog_cache:
    holds: "Every object exactly as it arrived, byte for byte, from whatever zip or mirror or folder it came from"
    mutability: "NEVER EDITED. Append-only."
    role: "The single source of truth"
  sidecar_overlays:
    holds: "YAML or JSON beside each source: identity binding to our catalog, corrections, categories, credits, claim state, notes"
    mutability: "Edited freely, by us and by contributors"
  generated_sets:
    holds: "The Downloads trees the game actually reads: renumbered, localized, About wrapped around each object"
    mutability: "DISPOSABLE. Rebuilt on demand."

analogy: "Git rather than filesystem: the cache is the REPOSITORY, a set is a WORKING TREE, the overlay is the DIFF YOU MEANT, the manifest is a LOCKFILE. You do not edit a checkout and hope."

what_falls_out_free:   # most hard problems elsewhere stop being problems
  downloads_becomes_fearless: "Delete the whole thing, rebuild from cache plus manifest. The folder every Sims player has feared since 2000 becomes a cache directory."
  renumbering_is_a_build_step: "Two sets can assign different ids to the same source and neither disturbs it. Id virtualization (guid-registry.yml) stops being a clever trick and becomes an ordinary consequence of building."
  every_profile_is_a_build_target: "Zombie set, SimProv set, recreate-a-2002-fansite set: same sources, different manifests and overlays"
  stamp_becomes_a_build_receipt: "Which source hash, which overlay revision, which mapping, which tool version -- describes a DERIVATION instead of asserting a history"
  improvements_apply_retroactively: |
    When the registry learns what a mystery object actually is, you rebuild and EVERY ABOUT BOX IN
    YOUR COLLECTION GETS BETTER. No re-downloading, no mutation, nothing lost. The payoff the
    cataloging flywheel needed.
  undo_is_free: "The original never changed"

content_addressing:   # an unexpected dividend
  scheme: "Address the cache by HASH OF THE ORIGINAL FILE"
  dividend: "REPACK DETECTION BECOMES A SIDE EFFECT rather than a project"
  why_it_matters: |
    Twenty-five years of custom content circulated through zips inside zips, rehosted, rebundled,
    renamed, stripped of readmes. Hash the bytes and the same object arriving from five bundles is
    STORED ONCE WITH FIVE PROVENANCE RECORDS -- the cache automatically reconstructs the
    redistribution chains.
  feeds_attribution: "Those chains are exactly the evidence attribution claims need: who published first, who repacked, where the readme survived (object-shops.yml)"
  conclusion: "The storage optimization and the archival mission are the same mechanism"

determinism:   # a requirement, not a nicety
  why: "Two players building from the same manifest must get THE SAME BYTES, because they will trade saves that reference those ids"
  constraints:
    - "Seed anything random"
    - "No wall-clock timestamps in outputs; if one must exist, take it from the manifest"
    - "Fix iteration order everywhere -- directory listing order is not an order"
    - "Pin inputs by HASH in the manifest, never by filename (filenames from 2003 are not identifiers)"
    - "Record the tool version; treat generator changes that alter output bytes as version bumps"
  payoff: "A manifest becomes a reproducible description of a set; sets diff and travel as RECIPES; a save's id space means the same thing on both machines"

backup_policy:
  precious: [catalog cache, overlays, manifests, per-save journal]
  disposable: "Every generated set -- regenerable by definition, so backing it up is backing up a build directory"
  honest_cost: "Storing original plus built copy roughly doubles a large collection. The cache compresses well and can keep originals in their delivered archives; outputs need no backup. Cheap for what it buys."

exchange_revival:   # Don, 2026-08-29 -- "this lets us recreate the sims exchange ... much safer and more virtual"
  the_hard_problem: "Never the upload button -- DEPENDENCIES. And only two options, both bad."
  option_1_dont_bundle: "The lot downloads BROKEN: missing objects, wrong objects, empty rooms, sometimes a crash. Communities adapted by circulating no-custom-content lots -- a real solution and a real amputation."
  option_2_bundle: |
    The lot works, and every download REDISTRIBUTES OTHER PEOPLE'S OBJECTS: credit stripped, readmes
    gone, duplicate copies of the same mesh under different ids, conflicts multiplying, sizes
    exploding. The failure mode that made Sims 2 era creators furious, and they were right.
  why_unsolved: "The two obvious answers are broken downloads and unauthorized redistribution"
  third_answer: "SHARE THE RECIPE, NOT THE PAYLOAD -- same discipline as everywhere else on this project"
  shared_lot_format: "Lot plus manifest: layout and instance state, plus what it needs by registry id"
  on_arrival:
    already_have: "Matched by CONTENT HASH, not filename or number -- nothing installed twice, no collision resolved by coin flip"
    missing: "Becomes a proxy wearing its own glyph -- the lot loads, plays, and shows exactly what it wants and where to get it"
    installs: "Resolve to THE CREATOR'S OWN CANONICAL ENTRY -- attribution is structural, not a courtesy line in a readme a repacker deleted"
    id_conflicts: "Stop mattering -- ids are assigned during YOUR build, not baked into somebody else's upload"
  result: "The download is never broken and nothing is ever redistributed"
  why_not_available_in_2001: |
    Not a failure of nerve: content-addressed storage, client-side compute in a browser with file
    access, ubiquitous cameras for scanning a code off a screen, and cheap deterministic rebuilds are
    all recent. The Exchange shipped the right idea on the wrong decade's infrastructure -- and the
    official exchanges are long gone, along with much of what lived only there.
  why_it_encourages_sharing:
    - "A creator's work is never inside somebody else's upload"
    - "A downloader never chooses between a broken lot and a mystery bundle"
    - "Every object in a shared lot is a link back to whoever made it"
  venue: sims1-soul-bridge.yml   # the suburbia of featured home save files -- where shared lots live

footgun:   # name it now
  what: "FIND OUT WHAT THE GAME ITSELF WRITES INTO THE OUTPUT TREES before treating them as disposable"
  severity: "A build system that deletes user files is a catastrophe, not a bug"
  rule: "Anything the game or player creates inside a generated tree must be ADOPTED AS A SOURCE on the next build. The importer needs a rule for unrecognized files in output directories: never delete, always ingest or leave alone."

see_also:
  guid_registry: guid-registry.yml   # the id mapping this pipeline applies
  object_shops: object-shops.yml   # the About wrapper and the generators that emit objects
  rendering_policy: rendering-and-rights.yml
  portals: portals-and-modules.md
