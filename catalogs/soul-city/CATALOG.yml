catalog:
  id: soul-city
  title: Soul City
  tagline: "Create · publish · share"
  kind: platform
  status: planted
  formerly: micropolis-home  # rebranded 2026-07-08 — Soul is the family name; less Micropolis coupling (the name is licensed). The platform takes the liminal city's own name: create/publish/share happens IN Soul City. Plaza, Depot, Station, Terminal are its districts.

what: |
  Web-browser platform for Sims-family user-created content — the whole stack
  Don and the community built for The Sims 1 (render, read, write, edit, generate)
  reborn on Micropolis Federation rails. Hosts legacy catalogs AND new creator work.

not_just_a_catalog: |
  Catalogs list what exists. Soul City is where you make it, ship it, and
  play it together — tools + publishing + sharing in one place.

layers:
  create:
    - "Transmogrifier / SafeTMog — web-native object authoring"
    - "RugOMatic, WigOMatic, body/head editors"
    - "SimShow — preview objects in-browser (ShowNTell lineage)"
    - "MOOLLM-assisted authoring — optional, human-reviewed"
  publish:
    - "Hosted content CARD.yml dirs per catalog + per creator"
    - "Federation repos — git-native, attributable, forkable"
    - "GitHub-backed object repo — metadata CARDs **and** free .iff/.fam content in-tree (see github-distribution-model.yml)"
    - "MOOLLM skills + Soul City bridge payloads in sibling moollm repo — same distribution ethic"
    - "Branching dialog cards — Family Album / agitprop / playset objects"
    - "Round-trippable saves — PITM ledger, game bridges"
  share:
    - "Sims Exchange revival — stories + downloadable lots/objects"
    - "TSR/SFS replacement lane for free git-native UCC; federate paid creator storefronts + external SFS links"
    - "Storefront syndication — simfreaks.com, simslice.com as federated nodes"
    - "Repo Show artifacts — audience homefun merges back into catalogs"
    - "Repo Show streams — show, don't tell"

steam_community_guides:
  spec: steam-community-guide.yml
  summary: |
    Steam Community Guide(s) on Legacy Collection hub — link-rich fan guides channeling players to
    Soul City (web) and Repo Shows. Not a wrapper app; no install required.
  requires: ../get-the-sims-on-steam.md

soul_angel:
  spec: soul-angel.yml
  dev_home: MicropolisCore/apps/soul-angel/   # source-available; subsumes stream-gateway
  summary: |
    SoulAngel — paid Steam Software, general-purpose game companion (planted — announce after web
    hub audience). Universal tier: always-on DVR, Soul Album with story cards + voice narration,
    machinima, OBS/Twitch/YouTube gateway — works on ANY game. Soul Bridge tier: per-game save/album
    read-write plugins in the web overlay. Windows first, Mac after (universal tier needs no Sims).
  sims1_bridge: micropolis-angel.yml
  broadcast: "Soul City Broadcast Network — TV (streams/machinima), radio (narrated albums), magazine (published stories)"
  not: "Web wrapper; Sim*/Micropolis trademark in product name"

micropolis_angel:
  spec: micropolis-angel.yml
  role: "Sims 1 Soul Bridge module of SoulAngel"
  summary: |
    The Sims-1-specific bridge: Family Album round-trip while game runs, family file
    import/export, save parse, graveyard manager, Simplifier showcase, catalog crawl.
  requires: ../get-the-sims-on-steam.md

hosts:
  federated_catalogs:
    - ../simfreaks/
    - ../simslice/
    - ../simprov/
    - ../zombie-sims/
  first_users:
    - "Heather Alvey (SimFreaks)"
    - "Steve Alvey (SimSlice)"
    - "Don Hopkins (SimProv, composable objects, Dumbold, Crowd Sitter)"

lineage:
  - "../characters/will-wright/sources/2005-09-18-simfreaks-content-catalog-laszlo/article.md"
  - "../characters/will-wright/sources/2004-01-12-sims-exchange/article.md"
  - "../characters/will-wright/sources/2004-01-08-showntell-activex-preview/article.md"
  - "../characters/will-wright/media/sims-series-micropolis-publishing-vision.md"

sibling_repo:
  micropolis_core: "apps/micropolis/website/pages/about/hosted-content/README.md"
  engine: "MicropolisCore — WASM/SvelteKit playable + publishing projection"

implements_from:
  show: "../SHOW.yml#the_mission_grounded_in_the_invite.web_tools_platform"
  distribution: github-distribution-model.yml
  browser_ecosystem: browser-ecosystem.yml
  modules:
    - "sims_exchange_revival"
    - "hosted_content_cards"
    - "pie_menus_piecrafter"
