# SoulAngel — general-purpose game companion. Watches over you playing ANY game.
# Rebrand lineage: SimAngel (working title) -> MicropolisAngel (EA TM respect) -> SoulAngel
# (Micropolis name is licensed too — same reason micropolis-home became Soul City).
# Soul is the family name: Soul City (web), SoulAngel (native), Soul Bridges (per-game plugins),
# Soul City Broadcast Network (channels). sims1-soul-bridge.yml holds the Sims 1 bridge module spec.

id: soul-angel
status: planted
supersedes: sims1-soul-bridge.yml   # that file narrows to the Sims 1 Soul Bridge module
subsumes: ../../apps/stream-gateway/   # brain bus + broadcast sinks fold into the universal tier
parent: CATALOG.yml
platforms: [windows, macos_later]
product: paid   # worth paying for; Steam Software listing; subscription only for AI/API tiers
license: source_available   # MicropolisCore/apps/soul-angel/LICENSE.md — open surface, reserved core
dev_home: MicropolisCore/apps/soul-angel/   # all software dev lives there; WWSFF keeps show/community side

one_line: |
  A guardian angel for your games: always-on DVR, universal family album, machinima and
  streaming studio, and per-game Soul Bridges that read and write the game's own soul —
  saves, albums, characters — from a web overlay. The Sims 1 is the first bridge, not the product.

# THE INVERSION — what changed from MicropolisAngel
inversion:
  was: "Sims 1 companion with streaming bolted on"
  is: "Universal capture/album/broadcast engine with game bridges plugged in"
  why: |
    Album + DVR + narrate + publish works on ANY game with zero integration (capture tier).
    Deep integration (save read/write, native album round-trip) is a per-game plugin.
    That makes Mac viable (no Mac Sims, plenty of Mac games), makes the product Steam-general,
    and makes each new bridge a content drop instead of a new app.

# TIERS — every game gets tier 1; bridges earn tiers 2-3
tiers:
  1_universal:
    requires: nothing_from_the_game
    features:
      - "Always-on DVR ring buffer — window capture, configurable minutes, NVENC/Media Foundation"
      - "Instant replay scrub — pause game, walk back in time on video"
      - "Still capture from live frame OR any DVR timestamp"
      - "Family album: caption, organize, sequence story cards, edit, save"
      - "Voice narration onto stills and clips; speech-to-text -> captions (later)"
      - "Publish album/clips to Soul City; download and remix others' albums"
      - "Twitch/YouTube/OBS gateway for live performance (stream-gateway lineage)"
  2_soul_bridge:
    requires: game_specific_plugin
    what: |
      TS module loaded in the web overlay, switched per game: save file read/write/edit/generate,
      character (soul) enumeration, native album round-trip where the game has one.
      FileBridge host object gives the browser sandboxed access to the game's data paths.
    first: sims1   # sims1-soul-bridge.yml — Family Album round-trip, save parse, graveyard, catalog lineage
    later: [sims2_plus_native_albums, other_games_with_photo_or_replay_modes]
  3_broadcast:
    requires: soul_city_account
    what: "Soul City Broadcast Network membership — scheduled shows, channels, federation syndication"

# SOUL ALBUM ENGINE — the heart
# Naming: "Soul Album" = generic cross-game schema (ours). "Family Album" = the Sims feature,
# fan vocabulary; the Sims 1 bridge imports/exports Soul Album <=> Family Album.
# We never co-opt game vocabulary — bridges uplift it into game-independent schemas.
album_engine:
  claim: "Everything the built-in Sims Family Album does, plus video, voice, and the network."
  schema: MicropolisCore/apps/soul-angel/SOUL-ALBUM.yml
  model:
    album: "Ordered story cards; per-game or cross-game; local-first, publishable"
    card:
      image: "Still from live capture, DVR scrub, or imported file"
      caption: "Text — typed, voice-narrated (STT), or drafted by assistant and human-edited"
      audio: "Optional narration track per card"
      provenance: "Game id, save id, sim/soul ids, DVR timestamp — card cites the moment"
  sims1_round_trip:
    read_write_live: |
      The Sims stores Family Album pages on disk as paired image + caption files and rescans
      the directory when the album UI opens. SoulAngel can read AND write the album while the
      game runs, pauses, or sleeps — external edits appear on next album open. No injection.
    exchange_format: "Exported family files carry album pages — import/export; VitaMoo files-inventory already detects them"
  video_integration:
    dvr: "Ring buffer always rolling; 'something happened' is never lost"
    scrub_to_card: "Pause -> scrub DVR -> freeze frame -> caption/narrate -> card lands in album"
    clip_cards: "Cards can hold clips, not just stills — machinima sequences from album ordering"
    like_thoughtful_commitment: |
      Album card = commit; DVR = session transcript; provenance = the trace link.
      Same shape as MOOLLM thoughtful-commitment: freeze the reasoning behind the artifact.
  production:
    time_shifted: "Voice-assisted album/video production AFTER play — narrate the replay, not the panic"
    outputs: [published_album_page, machinima_video, stream_vod_chapters, magazine_article]
  # Sixth incarnation of one data model: scenes, sequences, links, story graphs.
  lineage:
    invariant: "scenes, sequences, links, story graphs — card + ordered sequence + typed links + walkable graph"
    chain:
      - { name: StoryMaker, year: 2011, what: "Stupid Fun Club geo server + iPhone app; scene cards with photo/text/GPS/links", see: ../../process/storymaker-stories-and-scenes.md }
      - { name: Bar Karma, year: 2011, what: "Broadcast writers' room — community-linked scene cards became a Current TV show", see: "https://github.com/SimHacker/MicropolisCore/blob/main/documentation/designs/bar-karma/overview.md" }
      - { name: Urban Safari, what: "Field geo capture; legacy amber", see: "https://github.com/SimHacker/MicropolisCore/blob/main/documentation/designs/urban-safari/overview.md" }
      - { name: ShowMaker, what: "Git-native show graph — a show is a graph walk over StoryMaker content", see: ../../process/showmaker-network.md }
      - { name: Ebike Safari, what: "New FIT pipeline — GPS tracks as scene sequences", see: ../../apps/ebike-safari/README.md }
      - { name: Soul Album, what: "This engine — capture source is the game DVR, venue is every game" }
    what_changes: [substrate_server_to_git, capture_phone_to_game_dvr, venue_one_show_to_every_game]
    ancestor_closure: "Sims 1 Family Album (1999) — captioned picture cards in a directory — is both the oldest ancestor and the first round-trip bridge target"

# SOUL CITY BROADCAST NETWORK — TV, radio, magazine
broadcast-network:
  id: scbn
  tagline: "The liminal city has a station."
  channels:
    tv: "Live Twitch/YouTube gateway + machinima premieres + Repo Show simulcast"
    radio: "Audio-only: narrated albums as podcast episodes; TTS story readings (Simplifier lineage)"
    magazine: "Published albums as web stories — the Sims Exchange revival, cross-game"
  relation_to_repo_shows: "Repo Shows are programming; SCBN is the station; SoulAngel is the camera truck"

# PLATFORMS
platforms_plan:
  windows:
    status: primary
    shell: "WinUI 3 + WebView2 (apps/soul-angel/windows/native tree — renamed 2026-08-29)"
    capture: "Windows.Graphics.Capture + NVENC"
  macos:
    status: after_windows_v1
    why_now_viable: "Universal tier needs no Sims; Mac has its own game library"
    shell: "Existing Electron/stream-gateway Mac tier grows into SoulAngel Mac"
    capture: "ScreenCaptureKit + VideoToolbox"

# PRODUCT / STEAM
steam:
  category: software
  model: paid_app   # universal tier is the product; bridges are free content updates
  subscriptions: "Optional — AI assist (chat-with-god lineage) meters API tokens; never gates core album/DVR"
  framing: |
    Impeccably our brand, product, IP, and mission: bridging game souls and stories into
    saving, sharing, broadcasting, and storytelling infrastructure. Fan bridges are
    fan-made and disclaimed; the engine is ours.
  disclaimer: "Not endorsed by or affiliated with any game publisher. Trademarks belong to their owners."

# NAMING / TM
naming:
  product: SoulAngel
  avoids: ["Sim* (EA)", "Micropolis (licensed)"]
  family: [soul-city, soul-angel, soul-bridge, scbn]
  check_before_steam: "Soul* marks in games/software class — one search before the listing, not a blocker now"

# ROLLOUT — inherits web-first rule from sims1-soul-bridge.yml
rollout:
  1: "Soul City web hub live (unchanged prerequisite)"
  2: "SoulAngel Windows: universal tier (DVR + album + Twitch) with Sims 1 bridge as launch showcase"
  3: "Bridge SDK docs — third parties write Soul Bridges for their favorite games"
  4: "Mac universal tier"
  5: "SCBN channels as audience forms"

app_room: ../../apps/soul-angel/   # show/community side: README + SCBN; dev home is MicropolisCore/apps/soul-angel/

