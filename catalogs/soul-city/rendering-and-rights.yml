# Client-side rendering + what we host — the redistribution policy (Don, 2026-08-29)
# Prose spec: rendering-and-rights.md. One line: the client renders, the server keeps what the
# player authored. Not legal advice; counsel reviews before launch.

meta:
  id: rendering-and-rights
  type: policy
  status: spec
  one_line: "Rendered images are screenshots; asset-fidelity sprite sets are the object. Test: is it reconstructable?"

the_test:
  question: "Could a determined person rebuild a working game object from what we host?"
  yes_means: "We hosted the OBJECT — do not do it"
  no_means: "We hosted a PICTURE — fine, publish freely"
  never_publish: "Complete reassemblable sets of an official object's sprites, rotations, zooms, z-buffers, alpha"

precedents:
  ea_shipped_it: |
    The Sims 1 shipped "Auto Generate Web Pages" — exported houses, families, albums as HTML for
    the internet, rendered Maxis art included. Maxis built the publish-images-of-our-objects
    pipeline. Soul City album/scene publishing restores it after the Legacy Collection dropped
    the upload path.
  fansite_norm: "Object preview images were the download-site economy for 25 years (SimFreaks included)"
  don_2004_request: |
    Transmogrifier renovation plan asked Maxis for exactly this tooling: "Export composed picture
    previews and text descriptions of objects, for use on web pages... export them as gifs or
    jpegs directly from Transmogrifier." A request ON THE RECORD; no document shows Maxis answered.
    The practice ran unchallenged for two decades regardless.
  background: "Screenshots and machinima are normal, expected, publisher-desired marketing"

architecture:   # split the layers and the question mostly dissolves
  object_metadata:
    where: "Server, public, complete"
    why: "Facts about a product, not art — this is what makes the catalog useful to everyone"
    fields: [name, description, price, guid, expansion, category]
  official_object_art:
    where: "Rendered on the CLIENT from the player's own legal install; cached locally"
    why: "Never uploaded as a standalone asset; materializes only on machines entitled to it"
  user_authored_compositions:
    where: "Server, on explicit per-artifact consent"
    why: "The player made it — it is a screenshot of their game"
    examples: [scenes, showcases, room_snapshots, albums]
  ugc_object_art:
    where: "Server, creator's choice, credited"
    why: "Creator's own work; EA mods policy already allows free distribution"

glyph_fallback_renderer:   # Don, 2026-08-29 -- what a non-owner sees
  principle: "ANYTHING WE CANNOT DRAW RENDERS AS A SOULGLYPH INSTEAD, and the code carries the REASON"
  turns_policy_into_behavior: "The missing piece of the design -- a policy paragraph becomes a product behavior"
  reasons:
    needs_game: "This is official Maxis content. It renders from your own install. Here is where to get the game."
    needs_permission: "You have the game; the browser needs access to your Downloads and save folders. Here is how, and exactly what we read and write."
    missing_content: "Somebody's custom object belongs here and you do not have it yet. Install it."
    unknown_object: "We have never identified this one. Do you know what it is?"
  no_blank_boxes: "One mechanism, four causes. A shared lot opened by a non-owner does not fail -- it comes up as a BLUEPRINT STUDDED WITH SCANNABLE CODES, honest about what it withholds and specific about the fix."
  what_this_gets_right:
    rights_posture_becomes_self_evident: "We never host official art, and the reason is visible in the product at the moment it bites rather than buried in a policy page. Where the art would be, a code says YOUR COPY OF THE GAME DRAWS THIS."
    two_different_problems: "needs-game and needs-permission are NOT the same. Telling someone who already owns the game to go buy it loses a user for good. The permission page is also the right place to be precise about scope: which directories, read or write, revocable whenever."
  real_constraint:
    browser_directory_access_is_not_universal: "The File System Access API is a Chromium feature -- Safari and Firefox users cannot grant folder permission at all"
    consequence: "One of the concrete reasons SoulAngel exists as a Windows and Mac app; on those browsers needs-permission routes to the app rather than pretending a prompt is coming"
  not_a_paywall: "Metadata travels freely (rule 4) -- a non-owner can browse, search, read, and discuss every object in the game. The glyph is an honest statement that a particular PIXEL needs a particular LICENSE."

install_requirement:
  what: "Advanced dynamic house rendering, editors, and scene composition need a real purchased install"
  framing: |
    Not a limitation to apologize for: Soul City makes owning the game MORE valuable rather than
    substituting for it — a good-faith posture worth being able to point at.
  verification: "Steam sign-in via OpenID (built for the turnstile, steam-app-strategy.md) does double duty as the license-hygiene gate"
  non_owner_experience: "Full metadata catalog + UGC art + user-authored scenes; official art simply does not materialize"

gray_area_resolved:   # Don named it precisely; where each case falls
  composed_scene_showcases: "FINE — the SimFreaks playset prototype's whole point; same category as any screenshot"
  catalog_preview_thumbnails: "FINE — the 25-year norm; presentation renders: composed, flattened, one angle, screenshot resolution"
  complete_asset_fidelity_extraction: "DON'T — functions as an asset repository, substitutes for the install, fails the test"
  cost_of_honoring: "Small: render Maxis previews locally, cache locally, server holds metadata + deliberate compositions"

media_sources:   # where content may come from
  policy: "Two sources only: FILES YOU ALREADY HAVE, and URLS THAT PUBLISH FILES FOR DOWNLOAD"
  the_rule:
    test: "IS THE URL A PUBLISHED FILE, OR A PAGE?"
    enclosures: "RSS/OPML enclosures are files publishers put up TO BE DOWNLOADED -- fetching gives the publisher the download, the stats, the subscriber"
    pages: "A streaming platform's watch page is not that, and platform terms generally prohibit retrieving media from one by other means"
    allowlist: [podcast feeds, Internet Archive, Free Music Archive, ccMixter, Jamendo, Wikimedia Commons, YouTube Audio Library downloads, public-domain material]
  no_platform_extraction:
    rule: "We do not build extraction for streaming platforms"
    legal_landscape: |
      Unsettled at best. Germany: settled against such tools and reaching HOSTING PROVIDERS, not only
      authors (LG Hamburg 2023-03-31, 310 O 316/21; upheld OLG Hamburg 2024-11-21, 5 U 54/23, holding
      YouTube's rolling cipher an effective technological measure under sec. 95a UrhG). US: contested
      rather than resolved -- RIAA's Oct 2020 DMCA 1201 notice to GitHub against youtube-dl, EFF's
      answer that reading the signature JavaScript as any browser does is not circumvention, and
      GitHub's reinstatement, which is a platform declining a takedown rather than a court ruling.
    conclusion: "Not a landscape to build a product feature into"
  local_stays_local: "What anyone does with their own machine and their own files is their business, outside our tools. We do not ask where a file came from and we do not scan or fingerprint-report anything."
  recipes_not_files:
    principle: "SHARED ARTIFACTS CARRY ANNOTATION, NOT MEDIA -- so the sharing model needs no fetching at all"
    mechanism: "A moody station travels as envelope/timing data keyed to a track IDENTITY (duration + acoustic fingerprint); the recipient's tool matches their own copy"
    consequence: "A shared station does nothing for someone who lacks the track and never asks anyone to fetch anything"
    established_practice: [LRC lyric files, karaoke and rhythm-game charts, MusicBrainz and AcoustID, CDDB]
    also: "More useful than a URL recipe -- works wherever a legitimate copy came from"
  cc_on_platforms_is_not_a_download_permission: "The uploader's CC grant settles COPYRIGHT and leaves the platform's TERMS untouched. Get CC material from places with a download button."

  frames:   # Don, 2026-08-29 -- frames on a TV, movie screen, or rug; user or auto selected; use the transcript
    posture: "Same source rule, BETTER rights posture: a still is a small fraction of an audiovisual work, screenshot practice is universal, and criticism/commentary is what quotation is for"
    the_frame: "A FRAME PLUS ITS TRANSCRIPT LINE IS A BLOCK QUOTE OF A VIDEO -- fair-use sized, citation attached"
    vocabulary_already_ours: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/fictional/troll/realms   # a realm is a block quote of another game
    citation_is_scannable: |
      A SoulGlyph on the rug or TV pointing at the original AT THAT TIMECODE. Three things at once:
      the quotation carries attribution, traffic goes TO the source, and somebody scanning a TV in a
      Sims house ends up watching the clip. Attribution and virality are the same gesture.
    recipe_is_a_cue_sheet: "Shared artifacts carry TIMECODES, NOT PIXELS. Frames stay local unless the creator owns them (own footage, phone video, PD/CC with a download button)."
    transcript_makes_auto_selection_good:
      why: "Caption timings are semantic anchors -- grab the frame where a memorable line lands and put the line in the popup as its caption"
      stack_cheapest_first: [caption boundaries for candidates, frame differencing for scene changes, sharpness/brightness filter to drop blurry and black frames, optional LLM reading the transcript to pick quotable lines]
      where_it_runs: "Every step client-side against a local file"
    in_game:
      no_new_object: "RugOMatic already holds many images with pie-menu switching -- a video quote rig is that plus a frame picker, pointed at a rug, painting, TV, or projector screen"
      details: "Crop-or-letterbox choice for aspect ratio; quantize and downscale to the sprite pipeline, which reads as period-correct rather than degraded"
      moody_timeline: |
        Frames can advance on the timeline: dead-reckon audio position, swap the sprite at the next
        cue. ~1 frame/second with synced audio lands between a comic and a video -- the 2000-era
        slideshow aesthetic, charming on purpose. Real video playback is not on the table; this beats
        a stalled attempt at it.

rules:
  1: "Push rendering to the client, always — the server never needs game art to do its job"
  2: "Upload only on explicit per-artifact consent, never ambiently (paid tiers gate FEATURES, never widen uploads)"
  3: "Apply the reconstructability test before hosting any render of official art"
  4: "Metadata travels freely — how non-owners still get a complete searchable catalog"
  5: "Never host official object art as a standalone download, at any fidelity, for any tier"
  6: "Creators own their own art; UGC publishing is the creator's call, credited"
  7: "Advanced rendering requires a verified install — the thing that keeps the design clean"
  8: "Fetchers only for enclosure-style URLs from sources that publish files -- everything else is a recipe resolving against the user's own library"

