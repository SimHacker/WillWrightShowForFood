# SHOW PROPOSAL — Did The Sims Make You Gay? (Patrick Barrett III + Don Hopkins + invited congregation)

show:
  id: did-the-sims-make-you-gay
  title: "Did The Sims Make You Gay?"
  subtitle: "Same-sex romance in the engine room — Patrick + Don + Avila + Servin"
  type: group
  host: Don Hopkins
  guests: ["Patrick J. Barrett III", "Alexander Avila", "Jacques Servin", "Blake Jennings"]
  buds: ["Patrick J. Barrett III", "Alexander Avila", "Jacques Servin", "Blake Jennings"]
  character: characters/patrick-j-barrett-iii/
  topic: |
    How Patrick programmed same-sex relationships; Don's design-doc advocacy; E3 1999 kiss;
    Alexander Avila's video essay and comment corpus (title borrowed with invitation);
    Jacques Servin's SimCopter prequel — The Sims audience as congregation.
  status: proposed
  urgency: |
    Living history — invitations out to Patrick, Alex, and Jacques (may be hard to reach).
    Cannot use Avila's essay title without inviting him. Story degrades gracefully on documents alone.

dialect:
  voice: stoner_techno_hippie
  terms:
    guest: bud
    guests: buds
  on_air_opener: "This show's bud is…"
  voice_ref: characters/don-hopkins/portrayal/voice.yml

solidarity:
  stance: |
    LGBTQ+ solidarity default — trans, queer, nb, ace, bi, lesbian, gay, genderfluid,
    gender-benders of any persuasion. **This IS The Sims audience:** builders, modders,
    storytellers, creator-network solidarity. Pride is welcome mat, not punchline.
  lexicon: repo-shows/infodump/infodump.yml#solidarity-lexicon

segments:
  integrated_story:
    ask: "Walk the timeline together — slap in prototype, Don's reviews, which doc Patrick had, how romantic tags worked, Will's OK, E3."
    doc: characters/patrick-j-barrett-iii/sources/same-sex-relationships-integrated-story.md
    public_record: characters/patrick-j-barrett-iii/same-sex-relationships-the-record.md
    primary: https://donhopkins.com/home/TheSims/
  patrick_implementation:
    ask: "How did you program same-sex relationships without modeling fixed orientation?"
    with: characters/patrick-j-barrett-iii/
    press:
      - https://www.newyorker.com/tech/annals-of-technology/the-kiss-that-changed-video-games
  avila_comments:
    ask: "What do 1,700+ Avila comments tell us about the microworld Patrick and Don enabled?"
    with: characters/alexander-avila/
    invitation: characters/alexander-avila/invitation.md
    video: https://www.youtube.com/watch?v=Xi-HWyh0Ybk
    companion: https://www.youtube.com/watch?v=uox4OMC50-4
    analysis:
      comment_corpus: https://github.com/SimHacker/moollm/blob/main/designs/sims/sims-queer-identity-formation.md#community-response-comment-analysis
      essay_full: https://github.com/SimHacker/moollm/blob/main/designs/sims/sims-queer-identity-formation.md
      cluster_summary: https://github.com/SimHacker/moollm/blob/main/designs/sims/sims-queer-identity-formation.md#comment-cluster-summary
      cross_repo_index: characters/alexander-avila/sources/moollm-links.yml
    micropoliscore:
      procedural_rhetoric: https://github.com/SimHacker/MicropolisCore/blob/main/documentation/designs/og-cozy-games.md#procedural-rhetoric-why-the-rule-not-the-representation-is-the-argument
      design_receipts: https://github.com/SimHacker/MicropolisCore/blob/main/documentation/designs/og-cozy-games.md#the-receipts-dons-1998-design-document-reviews
      will_wright_page: https://github.com/SimHacker/MicropolisCore/blob/main/apps/micropolis/website/pages/about/will-wright/README.md
    on_air: "Fair-use commentary only with invitation on record; celebrate testimonies; no outing; no mockery"
  avila_solo_also:
    ask: "Same bud — optional deeper dive on solo show I'm Queer Therefore I Sim"
    solo_show: repo-shows/im-queer-therefore-i-sim/im-queer-therefore-i-sim.yml
    room: characters/alexander-avila/
    moollm: characters/alexander-avila/sources/moollm-links.yml
  simcopter_prehistory:
    ask: "The back door and the front door -- 1996 himbo easter egg (unauthorized, fired) vs 1998-2000 designed-in inclusion (reviewed, promised in writing, shipped). Don's Draft 3 cites 'the SimCopter fiasco' by name."
    with: characters/jacques-servin/
    invitation: characters/jacques-servin/invitation.md
    solo_show: repo-shows/simcopter-himbos/simcopter-himbos.yml
    sources: characters/jacques-servin/sources/simcopter-himbo-easter-egg.md
  sims_audience:
    ask: "Builders, modders, storytellers — creator-network solidarity and post-Collection exodus ethic"
    rooms: [characters/plumbella/, characters/lil-simsie/, characters/ellpeck/]
  blake_war_crimes:
    ask: "Sims community ethics essayist — War Crimes video named Don; Repo Show as antidote to comment-section landfill"
    with: characters/blake-jennings/
    invitation: characters/blake-jennings/invitation.md
    video: https://www.youtube.com/watch?v=zMD44gcSIJw
    outreach: "invited_2026-07-16"
  optional_reunion:
    ask: "Jun 1998 steering committee build — Edith/SimAntics with Jamie, Bobo, Irk, Patrick, Don, Will?"
    seed: ../will-wright-premiere/sims-team-steering-committee-playthrough/

format:
  live: false
  async_one_on_one: true
  production_model: |
    Fully async and degradable: the episode works with Don presenting the marked-up design docs,
    credited press quotes, and the past Don/Patrick conversations alone. If any bud contributes —
    Patrick, Alex, or Jacques — in any medium, Don intercuts it with design docs, fair-use Avila
    clips (invitation on record), MOOLLM comment themes, SimCopter prequel, and optional reunion
    footage. No deadlines, no dependency on any guest recording. Congregation participates via
    repo issues.

