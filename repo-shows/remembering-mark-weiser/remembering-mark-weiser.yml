# SHOW SEED — Remembering Mark Weiser (memorial tribute, edited from separate interviews)
# Memorial mode for Mark ONLY. Possible discussants = documented connections, NOT invitations.
# Standards: ../../schemas/portrayal-standards.yml#memorial_mode

show:
  id: remembering-mark-weiser
  title: "Remembering Mark Weiser"
  type: group_memorial
  host: Don Hopkins
  topic: "A tribute to Mark Weiser (1952–1999) — ubiquitous computing, calm technology, PARC, CHI'88 pie menus, Severe Tire Damage — and the PKD/Ubik thread that named the field."
  status: seed
  consent: not_yet_asked

memorial_mode:
  subject: mark-weiser
  rule: "We represent and discuss Mark's documented work only. We do NOT interview him or speak as him, and invent no inner life or quotes. Any living person on a produced episode requires their own consent — the list below is NOT an invitation."
  standards: ../../schemas/portrayal-standards.yml#memorial_mode
  memorial: ../../characters/mark-weiser/memorial.md

the_frame:
  read_the_intent: >
    Resist the ubicomp laundry list. Center what Mark was reaching for: computing that recedes into
    the background — a "quiet, invisible servant" — the opposite of technology that demands your
    attention. What world was he trying to build, and did we build it or its dystopian twin?
  pkd_door: >
    Mark named ubiquitous computing in reference to PKD's Ubik, and inverted its metered, hostile
    everyware into "calm technology." That naming story is the natural bridge into the sci-fi→AI
    reading group. See characters/mark-weiser/pkd-lem-ai-sf.md.

production:
  format: async_clips_cut_together
  how: >
    Record separate 1-on-1 memory clips with each person who knew Mark, whenever convenient for
    them — no synchronized group call required. Interlink their directories, artifacts, and videos,
    then edit the clips into one memorial tapestry in post. Same async pivot used for the PIXIE /
    David Rosenthal shows (characters/david-rosenthal/correspondence.yml#don_async_pivot).
  friend_phone_clips: "Short remembrances from family, friends, colleagues welcome — no live interview required."

possible_discussants:
  disclaimer: "Documented connections for planning only. Nobody listed has consented to this episode unless their own invitation says so."
  candidates:
    - name: "Don Hopkins"
      character: characters/don-hopkins/
      connection: "Weiser's student at UMD and close friend until his death; co-author of the CHI'88 pie-menu study (Callahan, Hopkins, Weiser, Shneiderman); primary source for the Ubik→ubicomp story Mark told him."
      verified: true
      consent: self_sovereign
    - name: "David S. H. Rosenthal"
      character: characters/david-rosenthal/
      connection: "Knew Mark; LOCKSS co-founder with Weiser's widow Vicki Reich; anchor of the Ubik/ubicomp/calm-tech reading-group thread."
      verified: true
      consent: not_yet_asked
      in_repo: ../../characters/mark-weiser/pkd-lem-ai-sf.md
    - name: "Vicki Reich"
      character: null
      connection: "Mark Weiser's widow; LOCKSS co-founder; e-journal preservation (HighWire, CLOCKSS)."
      verified: true
      consent: not_yet_asked
      note: "Warmly welcome — Don would love to have her; entirely David and Vicki's call, together. Not a booking."
    - name: "Ben Shneiderman"
      character: characters/ben-shneiderman/
      connection: "Co-author on the CHI'88 pie-menu paper; direct-manipulation vs calm-technology framing."
      verified: true
      consent: not_yet_asked
    - name: "Brad Myers"
      character: characters/brad-myers/
      connection: "HCI peer — UI tools and techniques era."
      verified: true
      consent: not_yet_asked
    - name: "John Seely Brown"
      character: null
      connection: "PARC Director/Chief Scientist; co-author with Weiser of 'The Coming Age of Calm Technology' / 'Designing Calm Technology'."
      verified: true
      consent: not_yet_asked
      to_verify: "No repo character directory yet — candidate only."

centerpieces:
  ubik_to_ubicomp: "The naming story — PKD's metered-doorknob dystopia inverted into calm technology. Don tells it firsthand (Mark's own retelling); David adds his view."
  computer_for_21st_century: "'The Computer for the 21st Century' (Scientific American, 1991) — read it as the map it turned out to be."
  chi88_pie_menus: "The table Mark sat at — Callahan, Hopkins, Weiser, Shneiderman. Remember him through the co-authors."
  severe_tire_damage: "Drummer for the first band to play live over the Internet (1993) — calm technology, loud music."
  calm_vs_attention_economy: "Argumentative-but-honest: we shipped everyware, but did we ship calm? Weiser vs the notification age."

threads:
  - "Ubik's metered everyware vs calm technology — did we build the dystopia? (ties to pkd-lem-ai-sf)"
  - "Ubicomp → IoT → ambient computing — what recedes, what demands attention"
  - "Instructions-per-joule over MIPS — Weiser's prescient low-power argument"
  - "AI as author-god: calm servant vs Palmer Eldritch — the repo's Player-in-the-Middle answer"

format:
  live: false
  edited_from_clips: true
  audience_qa: optional
  tone: "Warm remembrance that builds something; argumentative where the history is honest."

ties_to:
  - ../../characters/mark-weiser/
  - ../../characters/mark-weiser/memorial.md
  - ../../characters/mark-weiser/pkd-lem-ai-sf.md
  - ../../characters/mark-weiser/pkd-lem-ai-sf.yml
