# SHOW — Edd Coates (Game UI Database & ethical archives)
# Planted seed. Inherits from the SHOW skill (/skills/repo-show).

show:
  id: edd-coates
  title: "A Repo Show with Edd Coates — The Game UI Database & Ethical AI Archives"
  type: solo
  host: Don Hopkins
  guests: ["Edd Coates"]
  character: characters/edd-coates/
  topic: "Preserving game UI history at Guinness World Record scale; The Game UI Bible; ethical AI data licensing; and where pie menus fit in 1,800+ games of interface archaeology."
  status: seed
  format: remote_or_in_person
  consent: not_yet_asked

the_core_idea: |
  Edd Coates built the Guinness World Record-holding Game UI Database — the industry's leading
  reference tool for game UI/UX (record: 42,706 screens / 1,013 games as of Nov 2022; archive
  continued growing through GUIDB 2.0 and beyond; studios Edd lists include Insomniac, Arkane,
  Double Fine, Ubisoft Montreal). Built for working human designers. Don is building the Repo Show
  to preserve computing history as executable artifacts. Two UI archivists geeking out — plus how
  creators protect, monetize, and ethically license curated archives in the LLM era (Edd's terms lead).

why_him:
  guidb: "Creator of the [Game UI Database](https://www.gameuidatabase.com/) — Guinness World Record (Nov 2022, 42,706 screens). Game UI Database 2.0 (Aug 2024): video, colour filtering, image inspector."
  game_ui_bible: "*The Game UI Bible* — 500+ page historical reference, Lost in Cult (forthcoming)."
  padcrafter: "PadCrafter 2.0 — free controller / KB layout builder (URL share, SVG/PNG export)."
  awards: "Pocket Gamer Best Tools Provider 2021; Game Dev Heroes — Game Design Hero 2021."
  don_friend: "Friend of Don Hopkins — pie-menu archaeology, Gonzo reinterpret, ethical corpus strategy."

threads:
  - "Pandemic project → Guinness World Record → GUIDB 2.0 — taxonomy that scales"
  - "Ethical archives — human-first design reference; AI training / scrape boundaries; opt-in licensing"
  - "The Game UI Bible — translating interactive screens to print"
  - "UI trends across 1,000+ games — what shifted; where radials/pie menus land today"
  - "Reinterpret bad UIs — GUIDB misses as briefs; Gonzo pies/tabs keep the game's face, fix the hands"
  - "Executable archives vs screenshot archives — Repo Show + GUIDB complementarity"
  - "Micropolis / The Sims UI in GUIDB taxonomy — what makes them historically unique"

dream_segments:
