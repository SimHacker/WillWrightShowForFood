# SHOW SEED — Alan Kay (build a microworld; remember Doug; Vanessa welcome)
# Standalone seed file (referenced by characters/alan-kay/CHARACTER.yml).

show:
  id: alan-kay-microworld
  title: "A Repo Show with Alan Kay — Building a Microworld"
  type: solo   # expandable to series / pairings — see people-index.yml show_pairings
  host: Don Hopkins
  guests: ["Alan Kay"]
  character: characters/alan-kay/
  topic: "Smalltalk, the Dynabook, messaging, constructionism — building a glass-box microworld; optional Engelbart + Vanessa memorial threads"
  status: seed
  consent: not_yet_asked
  invitation_status: warm   # relationship warm; interview yes not yet

why_him:
  smalltalk: "True object-orientation and late binding — the live-object lineage behind NeWS, HyperLook, Squeak."
  dynabook: "The Dynabook vision and constructionist learning — Papert-adjacent, the spine of this show's educational arc."
  invent_the_future: "'The best way to predict the future is to invent it.' (widely attributed)"
  trust_teaching: "Quora copilots critique ↔ MOOLLM as microworld OS — draft in characters/alan-kay/moollm-trust-and-teaching-guess.md"

remember_engelbart:
  mode: "Memorial — represent + discuss, never interview the deceased."
  why: "Alan recalled the 1968 demo's impact; Yoot Saito personally interviewed BOTH Engelbart and Alan in Japan in the early 1990s (companion Alan Kay transcript OCR-restored in the YootTower repo)."
  pair_with_yoot: "Pair Alan WITH Yoot Saito to revisit that interview on air — and Yoot's own Engelbart interview."
  see:
    - ../../characters/douglas-engelbart/eulogy-ted-nelson.md
    - ../../characters/yoot-saito/yoot-tower-discussion.yml
    - ../../characters/alan-kay/media/quora-recaps/engelbart-media-inverse-vandalism.md

remember_vanessa:
  mode: "Memorial — represent + discuss; never speak as her."
  why: "Alan strongly interested in memorializing Vanessa (tragic she's gone); SqueakJS → WASM → Caffeine lineage."
  see: ../remembering-vanessa-freudenberg/remembering-vanessa-freudenberg.yml
  co_guests: [craig-latta, dan-ingalls]

threads:
  - "Build a microworld live — teach Will (or audience) to make a MOOLLM adventure world"
  - "MOOLLM × trust × teaching — is a microworld OS what Kay meant vs copilots?"
  - "What real object-orientation / messaging meant (and what got lost)"
  - "Constructionism — learning by building; SimCity black-box critique ↔ Micropolis glass box"
  - "NeWS / HyperCard — 'live system underneath' / end-users see their own faces"
  - "Optional series: Heinz Cambridge / PIXIE / Armit Utah — living and passed"

format:
