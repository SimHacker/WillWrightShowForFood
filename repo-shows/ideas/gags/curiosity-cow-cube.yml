# Curiosity Cow Cube — parody of Peter Molyneux's Curiosity + Ian Bogost's Cow Clicker
# Don's Unite 2012 troll: the secret inside the cube is a Rightward-Facing Cow
# Berkeley 2008: Mediterraneum Cafe — deadpan hippie gaslighting that a horse is a cow
# MOOLA clicks · scheduled death · NEVER gateway · the cow was always duplicable
# Status: gag / show beat — NOT a product resurrection (keep Curiosity dead and buried)

id: curiosity-cow-cube
type: gag
status: parody_seed
authored_by: don-hopkins
tagline: "Click the cube for worthless MOOLA. Peel layers. The center is a cow. It wasn't very fun before. That's a cow."

should_never_ship: |
  If there was ever a game that should never be recreated and kept dead and buried forever,
  it's Molyneux's cube clicker Curiosity (released 6 Nov 2012, ended 26 May 2013, never delivered
  on grandiose promises). This repo holds a *parody* and social-commentary beat — scheduled
  termination communicated upfront (Cow Clicker Cowpocalypse model). We do not resurrect the scam;
  we put Bogost's cow in the middle instead of godhood and broken lies.

