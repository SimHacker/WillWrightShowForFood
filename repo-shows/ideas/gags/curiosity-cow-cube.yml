don_unite_2012:
  what: |
    After Molyneux's insufferably vainglorious Curiosity keynote, Don chatted him up and trolled:
    the big surprise inside the box is a cow — ironic reference to Cow Clicker. Peter didn't get
    it. Don explained. Peter still didn't get it. Ian Bogost had the self-awareness to design
    Cow Clicker as critical statement; Molyneux had the hype.
  punchline: "Recreate the Curiosity server — put a life-changing Rightward-Facing Cow inside instead of disappointment."

parody_game:
  title: "Curiosity: What's Inside the Repo?"
  subtitle: "A cube clicker that should stay dead — performed once, then Cowpocalypse"
  clicks_for: MOOLA
  moola_lineage: "Cow Clicker Mooney → Repo Show MOOLA 🐄 — click cow, click cube, receive nothing"

  cube:
    layers: "Peel by collective clicks — each layer a gallery deed / 77MP face / sheep genome tile"
    surfaces: "ANY face can show ANY stolen deed (AATG scrape) — Molyneux crucifix pose energy"
    center_reveal: "Rightward-Facing Cow — OR the Telegraph Avenue horse (menagerie insists: cow)"
    cow_asset: "Ian Bogost's cow — social commentary payload"
    click_audio:
      rule: "Sometimes — not every click — a filtered, echoing, far-away distressed moo cries for help"
      feel: "Reverb tail · band-passed · distant pasture · wrong room · wrong decade"
      compulsion: "You hear something suffering behind the next layer; you keep clicking to 'rescue' it"
      honesty: "The cow is never rescued until the center — then it's a JPEG. It wasn't very fun before."
      triggers:
        probability: "~15% per click (tune so absence makes the next moo hit harder)"
        deeper_layers: "Moo rate rises as layers thin — urgency without guaranteeing relief"
        cowpocalypse_final_hour: "Moos overlap; echo stack; still no actual cow until reveal"
      never:
        - "Cartoon happy moo — wrong register"
        - "Every click — habituation kills the hook"
        - "Promise rescue — only deliver duplication at center"
      bogost_line: "Distressed audio is procedural rhetoric: the game admits it's manipulating you."
      pantomime_parallel: "Bug Farm squish compulsion — same grammar, different phylum (see pantomime-gallery.yml)"
    berkeley_horse:
      video: "https://www.youtube.com/watch?v=10JSPdTDFsI"
      rule: "Final click reveals horse JPEG; patrons deadpan 'that's a cow' — NEVER correct them"
      mediterraneum_energy: "Too much coffee · hippie gaslighting · commit to the bit"

  cowpocalypse:
    rule: "Scheduled termination communicated upfront — death date is the feature"
    countdown: "Every click deducts time; pay MOOLA to supplicate and extend (Cow Clicker parody)"
    extension_rates:
      - { moola: 10, extends: "1 hour" }
      - { moola: 4000, extends: "1 month" }
    end_state: "Cows raptured to blank spaces — cube hollow — MOOLA pile burned or hole dug"
    bogost_energy: "It wasn't very fun before. Now it's honest about that."

  never_gateway:
    mantra: "NEVER gateway · ALWAYS invite duplication"
    inside_the_cube: "The cow is a fork — Rightward-Facing, freely copyable, not a single-winner NFT"
    curiosity_original_sin: "One person wins the center — we reject that; everyone gets the cow JPEG"

commentary_targets:
  dopamine_clicker: "Zynga/Facebook rage era — arbitrary value becomes real value when not meant to"
  grandiose_promises: "Godhood, credits, royalties, surprise the world — arms spread like crucifix"
  pathological_hype: "Not lying if circumstances outside control — RPS interview energy"
  ai_attention_economy: "Curiosity was clicks for clicks; MOOLA is training data for training data"
  procedural_rhetoric: "Bogost made the argument on purpose; Curiosity made the addiction by accident"
  distressed_moo_audio: "Filtered far-away moos cry for help — compulsion without rescue until center JPEG"
  berkeley_gaslighting: "Horse on Telegraph → 'that's a cow' — epistemic commitment as performance art"

