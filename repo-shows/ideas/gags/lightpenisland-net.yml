operations:
  goal: "High-margin curated gadgets + kits — not print-on-demand tees (see partner_emporiums for Lars cross-link)"
  launch_tiers:
    weekend:
      hours: "48–72"
      what:
        - "Hover DNS → Shopify Basic or Carrd Pro landing (deadpan catalog + brother site footer)"
        - "Amazon Influencer/Creator storefront live — zero inventory"
        - "Bureau Picks page — affiliate geek links + CHM / Klein bottle goodwill (no kickback)"
        - "Amazon Associates on /amazon_picks — Logitech presenters + mice (heritage partner lane)"
        - "Amazon Associates disclosure"
        - "Free Engelbart STL page (email-gate or direct download — traffic, no fulfillment)"
        - "Free Type 340 Fake Light Pen STL + pamphlet PDF + USB LED assembly manual"
        - "Augment Expositions page — historic demos/videos/papers as deadpan free SKUs"
        - "Manuals page — bitsavers PDF links (SEO + sponsor read cross-link)"
      revenue: "Affiliate commissions only; proves domain + brand"
    week_two:
      what:
        - "Shopify + 10–20 dropship SKUs (cat lasers, presenters, pen lights, Bluetooth styluses)"
        - "Spocket / CJ / Syncee — US/EU suppliers into Shopify; DSers auto-routes orders"
        - "Seller Central FBM — mirror top movers; you or supplier ships"
      cs: "You answer sales@lightpenisland.net; supplier ships — template macros in Gorgias or Shopify Inbox"
    month_one:
      what:
        - "FBA for 2–3 fast movers (cat laser, presenter pen) — Amazon handles CS on those orders"
        - "Multi-Channel Fulfillment (MCF) — same FBA stock ships lightpenisland.net orders"
        - "First high-margin kit: Engelbart Bluetooth mouse OR Type 340 EZ-Grip OEM box (MOQ ~100)"
      margin_target: "3–5× on curated gadgets; 40–60% on kits you bundle"
  stack_recommended:
    storefront: Shopify
    why: "Physical + digital (STL) + affiliate embeds + Amazon Buy with Prime later; one admin"
    payments: "Shopify Payments primary; shop.groundupsoftware.nl checkout if domain name triggers review"
    dns: "Hover — lightpenisland.net A/CNAME to Shopify"
  fulfillment_matrix:
    low_touch_high_volume:
      channel: [amazon_fba, amazon_affiliate]
      products: [cat_lasers, toy_sabers, presenters, pen_lights]
      cs: "Amazon handles buyer messages on Amazon orders"
    dropship_web:
      channel: [shopify, spocket, cj, syncee]
      products: [styluses, wood_barrel_oem, fiber_pens, book_lights]
      cs: "You — email + Shopify; supplier ships blind or light-pen branded insert"
    maker_kits_high_margin:
      channel: [shopify_direct, etsy_maker, optional_fba]
      products: [engelbart_bluetooth_kits, keyset_kits, moad_bundle]
      fulfillment: "Small-batch assembly (you) or PCBWay + contract pack; NOT print-on-demand"
    digital_free_lead_gen:
      channel: [shopify_digital_download]
      products: [engelbart_stl_step, maker_guide_pdf, type_340_fake_light_pen_stl, pamphlet_340_pdf]
      price: free_or_pay_what_you_want
  cs_outsource_options:
    - "Amazon FBA — CS for Amazon-channel orders only"
    - "ShipBob / Deliverr — 3PL pick-pack-ship for owned inventory (website orders)"
    - "Syncee / DSers — order routing only; you still own customer email"
    - "Avoid full outsource CS until volume justifies — early stage: templates + 1hr/day"
  not_lars_model:
    what: "Printful/Printify = SWAG tees only; high-ticket path is OEM + kits + FBA curation"
    partner: partner_emporiums#lars_brinkhoff_t_shirts
  monetization_mix:
    - "Affiliate (Amazon + geek merchants) — day one, zero risk"
    - "Logitech on Amazon Picks — heritage lane; pursue direct affiliate + sponsorship after traffic"
    - "Goodwill outbound (CHM, Acme Klein Bottle, bitsavers) — trust + audience love; no cut"
    - "Dropship margin — week two, low capital"
    - "Owned SKU / FBA — month one, best unit economics on repeat buys"
    - "Kits + Bluetooth replicas — highest margin, Engelbart division flagship"
    - "Episode SWAG drops — limited POD run per show (optional Printful batch)"

