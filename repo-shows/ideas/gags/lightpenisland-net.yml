curated_outbound:
  thesis: |
    **Three lanes** — (1) **we stock** it; (2) **affiliate** — cool, valuable, good kickback;
    (3) **goodwill** — no commission, link anyway because the place deserves traffic. Museums
    sell what we don't; we sell (or affiliate) what they don't. Audience gets a curated map of
    things we love too.
  lanes:
    we_carry:
      what: "Shopify / FBA / kits — Light Pen Bureau SKUs"
      page: "/swag · /augment · division pages"
    affiliate_picks:
      what: "We earn a cut — only list if we'd recommend it deadpan anyway"
      disclose: "Affiliate link — Light Pen Bureau may earn from qualifying purchases"
    goodwill_picks:
      what: "No affiliate program (or we skip the program) — **point anyway**; drive traffic to preservation & oracles"
      badge: "Bureau sends you — no kickback, we mean it"
  split_with_museums:
    rule: |
      **Computer History Museum** and peers sell oral-history merch, exhibit books, member gifts —
      stuff we don't carry. **Send buyers there.** We carry Engelbart kits, styluses, cat lasers,
      presenter pens — and affiliate long-tail gadgets **CHM doesn't stock**. Complementary, not
      competitive.
    chm_they_have_we_dont: [gift_shop_books, membership, exhibit_catalogs, oral_history_donations]
    we_have_they_dont: [engelbart_bluetooth_kits, type_340_ez_grip, cat_division, affiliate_gadgets]
  affiliate_networks:
    amazon_associates:
      role: "Long-tail volume — cat lasers, presenters, pen lights, maker parts"
      page: amazon_picks
    geek_and_maker:
      note: "Prefer authentic geek merchants over generic retail when kickback + product both win"
      candidates:
        - name: Adafruit
          program: affiliate
          fit: [rp2040_keyset_pcb, encoders, maker_electronics]
        - name: SparkFun
          program: affiliate
          fit: [encoders, bluetooth_hid, maker_kits]
        - name: B&H Photo
          program: affiliate
          fit: [presenters, laser_pointers, conference_gear]
        - name: eBay Partner Network
          fit: [vintage_input_devices, dec_memorabilia, light_pens_collectible]
        - name: ShareASale / niche merchants
          fit: [audience_specific — audit per merchant]
    apply_as: "Light Pen Bureau / Ground Up Software — PG site copy for reviewer"
  goodwill_destinations:
    what: "Places that deserve traffic — Repo Show audience will love; we love too"
    list:
      - id: chm
        name: Computer History Museum
        url: https://computerhistory.org/
        shop: https://computerhistory.org/store/
        why: "Preservation, gift shop, Smalltalk Zoo neighbor — oral history for Heinz/Dan lineage"
        cross: [../../../characters/dan-ingalls/, ../../../characters/heinz-lemke/]
        badge: goodwill
      - id: smalltalk_zoo
        name: Smalltalk Zoo (CHM)
        url: https://smalltalkzoo.thechm.org/
        why: "Dan Ingalls — live Smalltalk in the browser; free; send the love"
        badge: goodwill
      - id: acme_klein_bottle
        name: Acme Klein Bottle
        url: https://kleinbottle.com/
        who: "Cliff Stoll — authentic Klein bottles; Cuckoo's Egg energy"
        why: "Peak geek oracle merchandise; audience will lose their minds"
        badge: goodwill
      - id: bitsavers
        name: Bitsavers
        url: http://bitsavers.trailing-edge.com/
        why: "Manual library already links here — traffic back to the cathedral"
        badge: goodwill
      - id: penisland_brother
        name: penisland.net
        url: https://penisland.net/
        why: brother_site
        badge: brother_site
      - id: lars_t_shirts
        name: Lars Brinkhoff — t-shirt emporium
        url: https://github.com/larsbrinkhoff/t-shirts
        why: partner_emporiums — not our store; wear on stream
        badge: partner
  heritage_partners:
    thesis: |
      Companies that **paid the debt** to Engelbart-era lineage — affiliate their gear on day one;
      pursue sponsorship when the catalog earns trust. Not on-air sponsor claims until a deal exists.
    logitech:
      relationship: |
        **Logitech** built a global business on the mouse Engelbart invented. Pierluigi Zappacosta
        gave Doug **office space in Fremont** (Logitech building, ~1992–2007). Logitech **increased
        financial support** for the Bootstrap Institute (circa 2000); celebrated **one billion mice**
        alongside the **40th Mother of All Demos** anniversary (2008). We name them on Augment and
        Bureau Picks whether or not they pay us — they already paid Doug.
      character_cross: ../../../characters/douglas-engelbart/
      not_claimed: "Not a Repo Show sponsor until contracted — heritage acknowledgment + affiliate"
      tiers:
        day_one_amazon:
          what: "Logitech SKUs on Amazon Picks — Amazon Associates; zero inventory"
          page: amazon_picks#logitech
          disclose: "As an Amazon Associate we earn from qualifying purchases"
          product_fit:
            presentation: [Spotlight, R500, R800, wireless_presenter_pens]
            augment_mouse_lineage: [MX_Master, Pebble, ergonomic_mice]
            plastic_stylus: [Crayon, Logitech_Pen]
            demo_desk_bundle: "Our Engelbart kit + Logitech Spotlight — Bureau bundle copy only"
        direct_affiliate:
          what: "Logitech affiliate / Impact program — apply after site traffic proves PG catalog"
          why: "Better kickback than Amazon alone on presenters + styluses audience already wants"
          status: outreach
        sponsorship_ads:
          what: "Paid placement, creator kit, MOAD-anniversary co-marketing, Engelbart memorial shows"
          pitch: |
            Augment Division is a deadpan tribute catalog — free Engelbart STLs, kits, presenter pens.
            Repo Show memorial lineage (Ted Nelson, Alan Kay, Bret Victor frame). Audience: retro
            computing, HCI, maker. Logitech already funded Doug; we send buyers to gear that fits.
          ask:
            - heritage_patron_read — optional second sponsor slot on Engelbart episodes only
            - Spotlight_presenter_bundle — co-branded MOAD desk set
            - creator_samples — MX Master + Spotlight for on-air demos
            - affiliate_rate_or_flat_fee
          contact_paths: [Logitech for Creators, partner marketing, education/heritage PR]
          do_not: "Never imply Logitech endorses the lightpenisland.net pun — surface copy is PG light pens"
      bureau_picks:
        section: affiliate_geek
        badge: "Heritage — Logitech supported Douglas Engelbart for decades"
        blurb: |
          Conference presenters, styluses, and the mouse line that exists because of 1968.
          Buy on Amazon today; we're talking to Logitech about a direct partnership.
      on_air_when_deal_exists:
        heritage_patron_read: |
          Augment Division acknowledges a heritage patron — Logitech — who supported
          Douglas Engelbart's Bootstrap Institute for many years. Presentation pointers
          and demo-desk gear at lightpenisland.net/augment. Lightpenisland dot net.
        episodes: [remembering-douglas-engelbart, pixie-pie-menus-pdp7, any_augment_segment]
  bureau_picks_page:
    path: /bureau-picks
    sections:
      - id: we_stock
        title: "Light Pen Bureau stocks"
      - id: affiliate_geek
        title: "Affiliate picks — cool, valuable, kickback where honest"
      - id: heritage_partners
        title: "Heritage partners — Logitech & Augment lineage"
        copy: "Companies that supported Engelbart-era work. We link their gear honestly."
      - id: amazon
        title: "Amazon Picks"
      - id: museums_and_oracles
        title: "Museums & oracles — we send you; no kickback"
        copy: "These places sell cool stuff we don't carry. Visit anyway. Preservation matters."
      - id: partner_emporiums
        title: "Partner emporiums"
    curation_rule: "Every link defensible deadpan — gag lives in the URL, not the product lie"

