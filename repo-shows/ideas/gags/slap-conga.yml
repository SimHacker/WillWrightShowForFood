# Slap Conga — SimProv relationship-chaos challenge
# Witnessed emergent loop: poly Cupid farm → public fall-in-love → jealousy slap queue → kiss buff → repeat.

id: slap-conga
type: interactive_challenge
status: seed
shows: [will-wright]
premiere_doc: ../../will-wright-premiere/simprov-slap-conga.yml

title: "The Slap Conga"
alt_titles:
  - "Cupid's Cascade"           # prettier; less slap-funny
  - "Relationship Stack Overflow"  # HN/dev gag — systems joke, longer
  - "Love Queue"                # soft; undersells the slap
  - "Kiss · Queue · Slap"       # mechanic as title
  - "Then They Lined Up to Slap Me"  # Don's witness story title

why_this_name: |
  Slap Conga wins: short, visual (they literally form a line), funny without jargon,
  and readable as a challenge name on a thumbnail. Stack Overflow is the runner-up for
  this audience. Keep "Then They Lined Up…" as the cold-open anecdote, not the brand.

elevator: |
  Farm as many lovers as possible with Cupid (Buddha keeps the trap fed). Trigger one
  public fall-in-love in front of the harem. Watch them line up to slap you. Each slap
  decays the delationship — kiss / Cupid buff restores it, and the conga starts again…
  until someone falls out of love and stops giving a shit.

object_kit:
  cupid:
    job: "Instant romance — speedrun the lover stack"
    prior_art: ./speed-dating-with-cupid.yml
  buddha:
    job: "Crowd need management — keep the trapped guests alive / happy enough to stay in play"
  crowd_sitter:
    job: "Optional: seat / gather bodies for the trap phase"
  playset: SimProv Wedding Playset
  catalog: ../../../catalogs/simprov/CATALOG.yml

mechanic: |
  Interpersonal dynamics are complex and chaotic. Observed loop (Don, lived once):

  1. PREP — Invite / lure many Sims onto the lot; trap + Buddha so motives don't kill the run.
  2. FARM — Cupid as many as possible, as fast as possible (poly romance stack).
  3. TRIGGER — Fall in love / kiss a *new* person in front of the existing lovers.
  4. CONGA — Jealous lovers queue up and slap the player Sim, one after another.
  5. DECAY — Each slap decays delationship strength.
  6. BUFF — Cupid and/or kiss the slapped lover → relationship recovers.
  7. REPEAT — If still in love, they rejoin the slap queue. If fully fallen out, they ignore you.

  Win condition (challenge mode): maximize slap-conga length, or sustain N full queues
  before the lover stack collapses. Lose: everyone falls out of love, or someone dies / leaves.

witness:
  who: Don Hopkins
  claim: "This happened to me once — the whole line formed and slapped me in sequence."
  epistemic: firsthand_gameplay
  note: "Not a designed 'mode' — emergent SimAntics / relationship AI. The show *stages* it as a challenge."

live_show:
  cold_open: |
    Don tells the witness story in one breath. Cut to setup lot (or prior recording).
    Will: systems / emergence / Simulator Effect — "the deep computer is in the player's head,
    but the slap queue is the shallow computer being *very* clear."
  audience_prompt: |
    Chat votes: next Cupid target · who to kiss in public · whether to buff after slap #3
    or let that lover drop out. TicketPR tag: `slap-conga`.
  scoring_board_optional:
    - lovers_in_stack
    - consecutive_slaps_this_queue
    - queues_survived
    - fallen_out_count
  host_riff: |
    MST3K / play-along narration. Bella Goth in balcony optional jealousy heckle.
    Tie to Speed Dating with Cupid — same object, opposite emotional register (matchmaking → farce).

flow:
  1_trap: "Pre-invite guests; Buddha + food/bath loop so the farm doesn't starve."
  2_farm: "Cupid speedrun — audience calls names / pairs."
  3_showcase: "Public romance with a newcomer in front of the stack."
  4_conga: "Do not pause — let the slap queue play out full length."
  5_buff_or_drop: "Audience votes kiss/Cupid vs abandon after each slap (or every N)."
  6_collapse_or_encore: "Stack dies → postmortem. Stack holds → encore queue."

modes:
  - audience_orchestrated_gameplay
  - timed_challenge
  - machinima_bumper
  - play_along_narration

will_hooks:
  - "Emergence vs authored story — the slap line *looks* scripted; it isn't."
  - "Advertisement-driven objects (Cupid/Buddha) vs motive AI vs relationship graph."
  - "1996 data-portability / hobby model — UCC objects that author social physics."
  - "Failure as entertainment — Calvin Syndrome, but romantic."

pairs_with:
  - ./speed-dating-with-cupid.yml
  - ./pixelized-joint-wedding.yml
  - ../themes/simulation-effect.md
  - ../themes/procedural-rhetoric.md
  - ../themes/inclusion-agitprop.md
  - ../../../catalogs/simprov/README.md
  - ../../will-wright-premiere/sims-play-along-narration.yml

poc:
  - One clean screen recording of a full slap queue (even if short)
  - Live stream: farm ≥5 lovers → one public kiss → count the conga
  - TicketPR template for `slap-conga` target suggestions

see_also:
  - ../../will-wright-premiere/simprov-slap-conga.yml
  - ../../../process/performance-space.yml
  - ../../will-wright-premiere/INTRO-NARRATIVE.md
  - ../traditions/audience-orchestrated-gameplay.yml
