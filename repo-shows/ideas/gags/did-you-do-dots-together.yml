# Did you Do Dots Together?

id: did-you-do-dots-together
type: gag
status: seed
shows: [building-the-sims, will-wright-premiere]

hook: |
  Awkward reunion question for Jim Mackraz + Eric Bowman: "Did you Do Dots Together?"
  Sounds scandalous; means post-Sims startup DoDots (~2000). Glick host makes explanations worse.

lineage:
  jiminy_glick: "Oblivious follow-ups until innocent facts sound compromising"
  old_band_reunion: ../../../process/old-band-back-together.yml#sims_team

guests: [jim-mackraz, eric-bowman, don-hopkins]

sources:
  company:
    - https://www.gsb.stanford.edu/faculty-research/case-studies/dodots
    - https://edition.cnn.com/2000/TECH/computing/04/07/dodots.idg/index.html
  beat: ../../building-the-sims/did-you-do-dots-together.md
  dodots_notes: ../../building-the-sims/sources/dodots-post-sims.md

career_arc:
  - { era: post-sims, org: DoDots, who: [jim-mackraz, eric-bowman], status: needs_confirmation }
  - { era: later, org: TomTom Amsterdam, who: [eric-bowman, don-hopkins], note: Don recruited Bobo }

instantiation_pattern:
  principle: |
    Public gag + beat are the parent. Per-cast green-room files inherit and hold
    production plans (consent, pairing, private Don accounts) — never duplicate the full script privately.
  public_parent:
    gag: did-you-do-dots-together.yml
    beat: ../../building-the-sims/did-you-do-dots-together.md
    sources: ../../building-the-sims/sources/dodots-post-sims.md
  private_cast_plans:
    jim-mackraz: DonHopkins/projects/willwrightshowforfood/green-room/jim-mackraz/did-you-do-dots-together.md
    eric-bowman: DonHopkins/projects/willwrightshowforfood/green-room/eric-bowman/did-you-do-dots-together.md
    don-hopkins: DonHopkins/projects/willwrightshowforfood/green-room/don-hopkins/did-you-do-dots-together.md

variations:
  glick_follow_ups:
    - "But WHAT did you DO? Together? With the DOTS?"
    - "I read it on the blogs… after The Sims… the dots…"
    - "Were you the manager of the dots? Did you make them ship?"
    - "Softbank — is that like Softbank for pillows?"
    - "Two Kembel brothers — twins? Were they related?"
  kembel_twins_confusion:
    beat: Host conflates George & John Kembel (CEO/CTO twins) with guest relationship — innocent facts sound worse
  stanford_debt_pivot:
    beat: Guest tries serious answer (Softbank, debt rounds); Glick hears scandal not finance case
  release_valve_headline:
    beat: 'Someone reads CNN headline aloud — "DoDots: The Web without a browser" — room exhales'
  tomtom_bridge:
    beat: '"And then you hired him? More dots? In Amsterdam?" — second reunion act'
  flatterbot_crossover:
    beat: Jason credits Bobo for DirectX book → "speaking of Bobo, did you Do Dots Together?"
    parent: ../traditions/flatterbot-2000.yml#signature_beats.directx_bobo_correction
  async_ensemble:
    beat: Jim and Eric answer on separate timelines; splice clips; Glick voiceover pretends they were in the same awkward moment
  evidence_bounce_cut:
    beat: |
      After async interviews, edit ping-pong: claim → screen-shared artifact → guest reaction.
      Founding payoff: FlatterBot credits Jason with DirectX book → cut to listing cover showing Eric Bowman.
    parent: ../../building-the-sims/evidence-bounce-cut.md
    book_evidence: ../../../characters/eric-bowman/sources/direct3d-professional-reference.md
    private_edit_plan: DonHopkins/projects/willwrightshowforfood/green-room/building-the-sims/evidence-bounce-cut.md
    lineage: ../../../process/repo-show-format.yml#splice_in_reactions
