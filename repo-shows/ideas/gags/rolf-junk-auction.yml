# Rolf Pixley junk drawer gag — virtual auction + face puppets

id: rolf-junk-auction
type: gag
status: canon
authored_by: don-hopkins
tagline: "Found in a junk drawer. MIND=BLOWN. Bid in MOOLA."

pitch: |
  **Rolf Pixley**'s Amsterdam workshop hoard — before he left the city. Twenty-three deduped photos:
  space-program keychains, green PCBs, Thacher slide rule, jenny haniver in cloche, alligator on
  fridge, flip-dot pixels, breadboard rat's nest, **RAVING BONKERS** (British Rock 'Em Sock 'Em —
  Rich Pixley's robot game). Don's verdict: **"Great face puppet! MIND=BLOWN"**
  — the reaction shot becomes canonical reference for Pantomime/menagerie face puppets.

  Virtual junk auction: patrons misread lots, bid §, deed format **JUNK-{slug}**. Cool thing to
  find in a drawer — not announced, discovered.

canonical: ../../characters/don-hopkins/media/rolf/INDEX.yml

integration:
  moola: ../../process/moola.yml
  jsonsters: "Fork simoleon-auctions.yml — junk drawer premiere"
  pantomime: "../../characters/don-hopkins/media/rolf/face-puppets.yml"
  face_puppet: don-hopkins-mind-blown-face-puppet.png

menagerie_lines:
  don: "Great face puppet! MIND=BLOWN."
  gregory: "Long Thacher, short flip-dot. I'm diversified."
  mimsy: "The drawer curates by accident—"
  slats: "I trained on the breadboard. You're welcome."
  slats_bonkers: "I trained on RAVING BONKERS. You're welcome."

