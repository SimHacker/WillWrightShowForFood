# Repo Show WARNING sticker + tee packs
# Howard Penner illustrates — ISO hazard parody + Usenet physics product labels
# Voystick/safari carnage + classic matter-product disclaimers (in the clear)

meta:
  id: voystick-warning-stickers
  status: design_brief
  art_lead: howard-penner
  operator: lightpenisland-net
  ties:
    - ../urban-ebike-safari.yml
    - ../../../characters/don-hopkins/sources/voystick-correspondence-lineage.md
    - ../../../characters/don-hopkins/sources/usenet-matter-product-warnings.md
    - sfc-sticker-packs.yml

one_line: "Big yellow WARNING panels (Voystick/safari) + Usenet physics product-label slaps — tees and kiss-cut sheets."

design_language:
  register: "ISO 3864 / ANSI Z535 industrial hazard — dead serious typography, absurd content"
  palette:
    primary: "#FFD100"  # safety yellow
    accent: "#000000"
    danger_red: "#E3000F"  # sparingly — DANGER tier only
  typography: "Helvetica/Arial Black — ALL CAPS WARNING / CAUTION / DANGER headers"
  illustration: "Stick-figure cartoons of carnage — Howard Penner line art; pinch points, flailing limbs, X eyes"
  layout_tee: |
    Front: oversized warning triangle (chest to sternum). Header band + pictogram + 2-line consequence.
    Back (optional): small barcode + SKU joke + lightpenisland.net
  layout_sticker: "3–4 inch die-cut triangle or horizontal OSHA panel; kiss-cut sheet of 6–12"
  precedents:
    - ../../../characters/will-wright/media/swag/sfc-warning-sticker-moving-machinery.png
    - ../../../characters/will-wright/media/swag/sims-warning-sticker.png
    - ../../../characters/don-hopkins/media/robot-sfc-battlebots/robot-sfc-battlebots-treaded-wheel-warning-sticker.png

howard_brief: |
  Will loves stickers like the SFC moving-machinery gift — treat these as a **pack**, not one-offs.
  Stick figures get caught in the interface: voice, pie wedges, handlebars, homomorphic feedback loops.
  Tees = **big warning sticker on a shirt** — readable from across the coffeeshop / canal path.
  Safari riders slap helmet decals; Repo Show booth sells kiss-cut sheets.

warnings:
  - id: vocal-joystick-in-use
    tier: WARNING
    headline: VOCAL JOYSTICK IN USE
    subtext: Unexpected warbling may attract office visitors
    pictogram: |
      Stick figure at desk, mouth wide "eee→aaa" trajectory; sound waves hit door; three heads peek in
      (Pink Trombone turned up loud — Don 2019)
    formats: [sticker, tee, laptop_slap]
    source: voystick-correspondence-lineage.md#CMU

  - id: homomorphic-feedback
    tier: DANGER
    headline: HOMOMORPHIC FEEDBACK LOOP
    subtext: Computer may sing along. Harmonic blend or inharmonic clash — no mute
    pictogram: |
      Two stick figures (human + monitor-with-face) mouths fused in vowel quadrilateral;
      one harmonizing, one with jagged sound lines and X eyes
    formats: [sticker, tee]
    source: voystick.yml#homomorphic

  - id: hands-on-handlebars
    tier: CAUTION
    headline: HANDS MUST REMAIN ON HANDLEBARS
    subtext: Voice steering does not replace steering
    pictogram: |
      Cyclist stick figure warbling while both hands wave free; Koga bars empty; canal edge approaching;
      pie-menu wedge ghost overlay on front wheel
    formats: [sticker, tee, helmet_decal]
    tie: urban-ebike-safari.yml#voystick

  - id: unattended-music-playing
    tier: WARNING
    headline: DO NOT LEAVE COMPUTER UNATTENDED WHILE MUSIC PLAYING
    subtext: Hardcore grindcore may be indistinguishable from UI interaction
    pictogram: |
      Empty chair; guitar + monitor duet; stick figure Rickenharp silhouette on triumphal arch sketch;
      fretboard pie menu rays from amp
    formats: [sticker, tee]
    source: GuitarPie HN 2025 — Eclipse energy

  - id: moving-pie-menu
    tier: DANGER
    headline: MOVING PIE MENU
    subtext: Fingers and vowels may be drawn into wedge without looking
    pictogram: |
      Radial pie slices as buzz saw; stick figure arm + tongue both caught in adjacent wedges;
      Fitts' Law arrows too short
    formats: [sticker, tee, laptop_slap]
    source: pie menus CHI'88 + voystick pie integration

  - id: pitch-axis-unreliable
    tier: CAUTION
    headline: PITCH AXIS LESS RELIABLE THAN VOWEL
    subtext: Auto-tune exists. Pitch-following does not
    pictogram: |
      Stick figure on ladder labeled Y; rungs snap; X-axis vowel rail stable below;
      Evan Balster thought-bubble "spectral centroid"
    formats: [sticker]
    source: Evan Balster Apr 2023

  - id: oy-oy-zone
    tier: WARNING
    headline: OY OY OY ZONE
    subtext: Punk rocker attention — not the yes button
    pictogram: |
      Pink Trombone tongue slider bottom-left→bottom-right; stick figure mohawk; "yeah yeah" vs "oy oy"
      split panel — wrong button pressed, carnage
    formats: [sticker, tee]
    source: Don → Ben Shneiderman Feb 2019

  - id: vowel-space-navigation
    tier: CAUTION
    headline: VOWEL SPACE NAVIGATION
    subtext: Jones tongue chart is not a map. F1×F2 is
    pictogram: |
      Stick figure lost inside trapezoid tongue diagram; real exit arrow to F1/F2 spectrogram grid;
      schwa pit trap labeled "ambiguous central zone"
    formats: [sticker, tee]
    source: Geoff Lindsey The Vowel Space Apr 2023

  - id: formant-projection
    tier: DANGER
    headline: FORMANT PROJECTION IN PROGRESS
    subtext: Vocoder telephony tricks will not save you
    pictogram: |
      LPC pipe spewing stick figures; band resonator saves one figure; MFCC classifier drops others
      into "information loss" shredder
    formats: [sticker]
    source: Evan — vocoder trap

  - id: guitar-pie-plus-voystick
    tier: WARNING
    headline: GUITAR PIE + VOYSTICK
    subtext: Combined audio input may rock harder than intended
    pictogram: |
      Fretboard grid + vowel quadrilateral overlay; dual stick figures — one shredding, one warbling;
      monitor showing TabCtrl with both hands still on guitar
    formats: [sticker, tee, helmet_decal]
    source: GuitarPie UIST 2025 + HN 45250328

  - id: voice-ahead-expert-path
    tier: CAUTION
    headline: VOICE AHEAD — EXPERT PATH
    subtext: Novices may be run over by confident warblers
    pictogram: |
      Stick figure blurring through pie stroke without menu visible; novice behind hit by vocal gesture wake
    formats: [sticker]
    source: pie menu rehearsal / mouse-ahead

  - id: quiet-monotone-mode
    tier: NOTICE
    headline: QUIET MONOTONE MODE AVAILABLE
    subtext: Not everyone wants to sing at the computer
    pictogram: |
      Stick figure whispering into mic; office mates relieved; optional smaller panel — Evan's counsel
    formats: [sticker]
    tone: "Rare friendly notice in a hostile pack"

  - id: bosch-moves-bike
    tier: WARNING
    headline: BOSCH MOVES BIKE — YOU MOVE PIE NETWORK
    subtext: Enviolo + voice skip — hands stay on bars
    pictogram: |
      E-bike stick figure; rear hub glow; speech bubble pie wedges; canal + Invader tile on wall
    formats: [tee, helmet_decal]
    tie: urban-ebike-safari.yml

# Usenet matter-product warnings — folklore physics humor (in the clear)
# Don Medium 2018: https://donhopkins.medium.com/warnings-f53f75aa2ec8
# SWAG register: fine-print product label — contrast with ISO yellow-black Voystick hazards above

usenet_matter_warnings:
  provenance:
    source: ../../../characters/don-hopkins/sources/usenet-matter-product-warnings.md
    medium: https://donhopkins.medium.com/warnings-f53f75aa2ec8
    note: "Found in the wild on Usenet — not Don's authorship; reposted for decades; merch-safe"
  design_language:
    register: "Product manual fine print — serif legal copy, deadpan physics"
    palette: "#FFFFFF background, #000000 text, optional yellow highlight band"
    illustration: "Optional Howard stick figures — tunneling to neighbor's house, heat death, relativity lifting"
    layout: "Horizontal slap 4×6 in; tee = wall of fine print on chest"
  warnings:
    - id: warps-spacetime
      tier: WARNING
      headline: THIS PRODUCT WARPS SPACE AND TIME IN ITS VICINITY
      formats: [sticker, tee]
    - id: universal-gravity
      tier: WARNING
      headline: ATTRACTS EVERY OTHER PIECE OF MATTER IN THE UNIVERSE
      subtext: Including products of other manufacturers
      formats: [sticker]
    - id: tnt-per-ounce
      tier: CAUTION
      headline: 85 MILLION TONS OF TNT PER NET OUNCE
      formats: [sticker, tee]
    - id: charged-particles
      tier: HANDLE_WITH_EXTREME_CARE
      headline: CHARGED PARTICLES EXCEEDING 500 MILLION MPH
      formats: [sticker]
    - id: uncertainty-principle
      tier: CONSUMER_NOTICE
      headline: CANNOT KNOW POSITION AND VELOCITY SIMULTANEOUSLY
      formats: [sticker, laptop_slap]
    - id: quantum-tunneling
      tier: ADVISORY
      headline: MAY REAPPEAR IN YOUR NEIGHBOR'S DOMICILE
      subtext: Manufacturer not responsible
      formats: [sticker, tee]
      tee_hero: true
    - id: gut-decay
      tier: READ_BEFORE_OPENING
      headline: PARTICLES MAY DECAY WITHIN 400 MILLION YEARS
      formats: [sticker]
    - id: matter-product
      tier: MATTER
      headline: 100% MATTER PRODUCT — ANTIMATTER CONTACT CATASTROPHIC
      formats: [sticker, tee]
    - id: heat-death
      tier: PUBLIC_NOTICE
      headline: USE INCREASES DISORDER — LEADS TO HEAT DEATH OF UNIVERSE
      formats: [sticker, tee]
      tee_hero: true
    - id: gluing-force
      tier: NOTE
      headline: GLUING FORCE ADHESIVE POWER NOT PERMANENTLY GUARANTEED
      formats: [sticker]
    - id: empty-space
      tier: ATTENTION
      headline: 99.9999999999% EMPTY SPACE
      formats: [sticker, laptop_slap]
    - id: ten-dimensional
      tier: GUT_DISCLAIMER
      headline: TEN-DIMENSIONAL — SEVEN ROLLED UP UNDETECTABLE
      formats: [sticker]
    - id: observer-effect
      tier: PLEASE_NOTE
      headline: MAY CEASE TO EXIST WHEN NOT OBSERVED
      formats: [sticker, tee]
    - id: component-equivalency
      tier: NOTICE
      headline: ELECTRONS SAME AS OTHER MANUFACTURERS
      formats: [sticker]
    - id: relativistic-weight
      tier: HEALTH_WARNING
      headline: MASS DEPENDENT ON VELOCITY RELATIVE TO USER
      formats: [sticker]
    - id: universe-collapse
      tier: IMPORTANT_NOTICE
      headline: UNIVERSE MAY COLLAPSE — RE-EMERGENCE NOT GUARANTEED
      formats: [sticker]

pack_compositions:
  safari_rider_sheet:
    stickers: [hands-on-handlebars, bosch-moves-bike, guitar-pie-plus-voystick, vocal-joystick-in-use]
    tee_default: hands-on-handlebars
  repo_show_booth_sheet:
    stickers: [homomorphic-feedback, moving-pie-menu, oy-oy-zone, vowel-space-navigation, unattended-music-playing]
    tee_default: homomorphic-feedback
  office_humor_sheet:
    stickers: [vocal-joystick-in-use, pitch-axis-unreliable, quiet-monotone-mode, formant-projection]
    tee_default: vocal-joystick-in-use
  full_carnage_sheet:
    note: "All Voystick tiers — kiss-cut sheet for Howard print proof"
    count: 13
  physics_fine_print_sheet:
    stickers: [heat-death, quantum-tunneling, matter-product, observer-effect, empty-space, uncertainty-principle]
    tee_default: heat-death
  sfc_physics_mashup_sheet:
    note: "Mix ISO Voystick hazards + Usenet physics — Will sticker culture sampler"
    count: 8

production:
  illustrator: howard-penner
  deliverables: [vector_svg, print_ready_pdf, tee_mockups]
  pod: Fourthwall / Printful — see DonHopkins strategy/swag-lightpenisland.md
  channel: ../gags/lightpenisland-net.yml#swag

