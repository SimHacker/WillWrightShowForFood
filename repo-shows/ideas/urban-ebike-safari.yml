dreamscape_wwdc_1995:
  what: |
    DreamScape (Actualized Fantasy Screen Waster) — constructive ScriptX experience: rooms connected
    in a map, objects with behaviors, smooching UI, astral travel between rooms ("don't lose your head").
    Live improvisational performance programming art at Apple WWDC May 11 1995 on PowerBook 540c.
    Demo did not crash; came close ("my demo's falling apart" — elasticity ping-pong, butterfly agent).
  authoring_and_browsing:
    director: "Import animations with registration points; Mr Potato Head / Lego robot parts; timeline"
    netscape: |
      Dynamically loaded C extension; scriptx: protocol; programmatic HTML collections; room browser
      with nested outlines; forms edit live simulation (elasticity, gravity); image map clicks hit
      real objects. Preview engine for multimedia web you generate — link globally, interact locally.
  web_vision: |
    Each room a distributable title container; plug-togetherable interactive objects on the web;
    window-shopping GIF storefronts linking to downloadable ScriptX objects for test drives. Long
    before modern component web — same itch as Urban Safari cards at POIs and MOOLLM rooms.
  leads_to: [iLoci, StoryMaker, Urban Safari, MediaGraph, MOOLLM, urban-ebike-safari]
  quote: "We want to give creative people an environment in which to plant their seeds — fertile ground, instead of a killer app."
  split_architecture:
    ray_ban_meta:
      roles: [capture_pov, open_ear_audio, microphone, prescription_lenses]
      why: |
        Will Wright is excited about Ray-Ban Meta glasses — no display, but good earphones, mic,
        and camera; safe while riding; put your own prescription lenses in. Camera off the phone
        means any handlebar mount works (display only).
      will_suggestion: true
      licensing_target: meta
    handlebar_phone:
      roles: [map_display, turn_by_turn, bosch_sdk_ui, optional_android]
      mount: "Any phone mount — Quad Lock, Bosch, generic; no integrated camera required"
    bosch:
      roles: [motor_assist_context, battery, speed, route_to_head_unit]
      sdk: "Kiox/Nyon — evaluate current Flow SDK vs legacy extensible mount platform Bosch acquihired and killed"
      note: "Flow is better than the acquired indie app but still sucks; we supply voice + story graph they lack"

field_hardware:
  note: "What Don actually rides on Amsterdam safaris — authentic endorsement, not aspirational spec."
  koga:
    what: "Dutch premium e-bike — Don's safari fleet"
    why: "Built for daily Dutch urban riding; local brand fits Amsterdam canal-loop demos"
    site: "https://www.koga.com/"
  enviolo:
    what: "Continuously variable transmission (CVT) hub — no discrete gear shifts"
    why: |
      Stop-start urban safari: narrate at a canal, roll off without hunting gears. Pairs with Bosch
      on Koga builds. Hands stay on handlebars; voice UX is not fighting drivetrain.
    site: "https://www.enviolo.com/"
  stack: "Koga frame + Bosch motor + Enviolo CVT — field-tested on real safaris"
  partner_or_ads: |
    Genuine product love from daily use. Open to co-marketing, sponsored safari episodes, or
    lightweight ad integration — show the bike as part of the story, not a spec sheet.

dual_location_navigation:
  what: |
    Adventure-like navigation through the graph of cards at places ahead of you. Two locations:
    physical (GPS on bike) and virtual focus (cursor hopping map → nearby POI → cards at POI →
    links between cards across topical layers). User does not care how it is modeled; LLM hides
    structure, interprets intent, follows overlaying topical graphs.
  physical: "GPS truth — bike position on map"
  virtual_focus: |
    Hops independently near physical location: scan POIs → load card stack at POI → follow links
    (person, time, topic layers). Not granular in UX — granular in model only.
  voice_commands:
    examples:
      - "What's near me?"
      - "Tell me about that canal"
      - "What did Will's son film here?"
      - "Take me to the next Invader"
      - "Set destination"
    set_destination: |
      Commit virtual focus to navigation target → route via Bosch/Apple. MUCH safer than
      pinch-zoom or list scroll while riding. Direct manipulation by voice syncs bike location
      and virtual graph cursor.
  temporal_abstraction:
    sutton_one_step_trap: |
      Rich Sutton (Jul 2024): iterating one-step world models for long horizons compounds error
      and explodes combinatorially — use options and GVFs instead.
      http://incompleteideas.net/IncIdeas/OneStepTrap.html · HN 48883415
    safari_is_options_not_rollout: |
      Scene cards at POIs = temporally abstract stops. Virtual focus + voice commands ("next Invader",
      "that canal") = semi-MDP options. "Set destination" commits an endpoint; Bosch turn-by-turn is
      hierarchical micro-detail filled on demand — not the primary planning model.
    tyranny_of_the_specific:
      source: "ssivark @ HN 48883415 — flight legs + 15–18 hours, not every turn to the airport"
      safari_read: "Voice layer plans story legs; map UI stays zoomed out until rider commits routing"
    llm_nuance: |
      HN counter (mxwsn): LLMs can self-correct with more tokens — applies to field narration, not to
      rehabilitating one-step tile/world-model rollout for navigation.
    room: ../../characters/don-hopkins/sources/sutton-one-step-trap.md
    moollm:
      hub: https://github.com/SimHacker/moollm/blob/main/skills/simulation/ONE-STEP-TRAP.md
      example: https://github.com/SimHacker/moollm/blob/main/skills/simulation/examples/one-step-trap.yml
      skills:
        simulation: "TICK = game turn, not physics integrator"
        adventure: "GO/LOOK/TAKE = Sutton options on rooms"
        exit: "Graph edges; guards = option preconditions"
        time: "Turn ≠ LLM iteration; narrative duration abstracted"
        memory-palace: "iLoci method of loci — spatial safari graph"
        simulator-effect: "Implication beats simulation — allied"
        speech: "Voice commands as option interface; SpeechAnalyzer field STT"
  parser_lineage: "Logo Adventure (zeroth, REPL-as-parser) → DreamScape → MOOLLM adventure → SpeechAnalyzer voice parser"

steering_pie_ride_game:
  what: |
    Continuous two-player game: AI guesses where you're going and suggests places; you pedal through
    a positional direct-manipulation pie-menu network — skip ahead and around by voice (or VoyStick
    warble). Handlebar steering IS steering law manifest; pedaling past POIs incrementally reveals
    focus and locality (LOD). AI remembers, looks up, organizes, projects onto your interests,
    narrates, answers questions — all while you ride.
  continuous_game:
    ai_guesses: "Bearing + speed + ride history → proposed next story leg"
    ai_suggests: "POIs/cards ranked on interest layers — not generic tourism"
    rider_moves: [confirm, deflect, voice_skip, voystick_wedge, set_destination]
    never_pauses: "Running inference duel, not a form or turn-by-turn nag"
  pie_menu_network:
    lineage: "iLoci pie-menu network → MediaGraph song+road flick (Mario cannons) → MOOLLM exit graph at POIs"
    iloci: "https://www.youtube.com/watch?v=03ddG3jWF98"
    model: "Each POI = hub; wedges = nearby cards + topical links; approach opens menu"
    positional_dm: "Biking navigates the network physically; virtual focus highlights wedge"
  steering_law_manifest:
    handlebars: "Path curvature from wheel angle — steering law"
    pie_wedges: "Arc gesture to target — same law family as Fitts pie menus (CHI'88)"
    unified: "One gesture steers Amsterdam AND graph focus"
    fitts: "Big nearby targets; outdoor = wide sloppy fast warbles without social cost"
  incremental_revelation:
    trigger: "Pedal toward and past POIs"
    lod: "glance → look → examine (adventure pickDescription pattern)"
    focus_cone: "Bearing + proximity widens/narrows what loads from hidden graph"
    simulator_effect: "Imply depth; reveal on approach — don't simulate every brick"
  voystick:
    what: "VoyStick — pitch=Y, vowel=X homomorphic vocal joystick; primary bike nav for linked card overlay"
    primary_use: "Hop down pie arcs and between POIs/cards — MediaGraph-style cannon flick, hands on bars"
    homomorphic: "Computer synthesizes same gesture — sing along, harmonic blend confirms"
    don_verdict: "Really fun and smooth — best gestural UI I've ever done"
    pie_navigation_lineage:
      zeroth: "../../characters/don-hopkins/sources/logo-adventure-c64-terrapin.md — REPL-as-parser, hidden graph"
      first: "../../characters/don-hopkins/kaleida-scriptx-dreamscape-multimedia-lisp-machine.md — rooms kiss, 1995 WWDC"
      chain: "Logo Adventure → DreamScape → MediaFlow (Lisp+QT, no pies) → iLoci → MediaGraph (flick) → Urban Safari → Urban eBike Safari"
    navigation_lineage:
      mediaflow: "Interval — Mac Common Lisp + QuickTime streams (no pie menus)"
      pie_flick: "MediaGraph — song+road graph; Mario-cannon flick; iLoci → MediaGraph → Urban Safari"
      chain: "Logo Adventure → DreamScape → MediaFlow (Lisp+QT, no pies) → iLoci → MediaGraph (flick) → Urban Safari → Urban eBike Safari"
    vowel_space: "F1/F2 acoustic space (Geoff Lindsey) — not Jones tongue quadrilateral"
    diphthong_rails: "Front (i,e,ɛ,a) + back (u,o,ɔ,ɑ) — skip central schwa"
    outdoor: "Outdoor = wide sloppy fast warbles without social cost; pitch+vowel trace steers singing while biking"
    channels:
      natural_language:
        engine: SpeechAnalyzer
        role: "Commands, questions, tool selection, guess confirm/veto in words"
        examples: ["What's near me?", "Set destination", "Capture this", "Tell me about that canal"]
      gestural:
        engine: Voystick
        role: "Arc hops along pie wedges; homomorphic confirm; voice-ahead expert path"
        trace: "continuous pitch + F1/F2 projection"
    code_switching: |
      Rider fluidly switches NL ↔ gestural — and combines them. NL selects tools/destinations;
      gestural executes spatial hops through the linked card overlay. Expert: mostly warble + occasional
      NL punctuation. Both streams parallel; LLM fuses intent from active channel(s).
    lineage: voystick-correspondence-lineage.md (1991–2025)
    guitar_pie: "https://news.ycombinator.com/item?id=45250328 — combine fretboard pies + voice"
    piecraft: "https://github.com/SimHacker/MicropolisCore/blob/main/documentation/designs/piecraft/RELATED-PROJECTS.md"
  ai_memory_loop:
    - remember — past safaris, linger time, git audience cards
    - lookup — graph links at approaching POIs
    - organize — topical layers (Invader, Will's son, canal, contributor)
    - project — rank onto rider interest profile
    - speak — proximity-triggered narration
    - answer — questions without stopping or screen touch
  room: ../../characters/don-hopkins/sources/urban-safari-steering-voystick-pie-network.md
  moollm: https://github.com/SimHacker/moollm/blob/main/skills/simulation/examples/urban-safari-ride-game.yml

voice_stack:
  primary: Apple SpeechAnalyzer
  browser_stt: skills/speech — recognition.js (Web Speech API)
  native_stt: skills/speech/native — moollm-speech CLI (planned, macOS 26+)
  voystick: skills/speech/voystick.yml — pitch parallel stream (not in Apple STT)
  audit: https://github.com/SimHacker/moollm/blob/main/skills/speech/STT-STACK.md
  fallback: WhisperKit for locales SpeechTranscriber does not cover
  benchmark: "https://get-inscribe.com/blog/apple-speech-api-benchmark.html"
  hn_thread: "https://news.ycombinator.com/item?id=48894752"
  why_on_bike: |
    Hands on handlebars; ~2% WER clean / ~4.5% noisy on LibriSpeech vs legacy SFSpeechRecognizer;
    on-device privacy and latency. Field test still needed: windy canal-side ride.
  implementation_note: |
    SpeechAnalyzer sessions hang without finalizeAndFinishThroughEndOfInput() — see Inscribe
    benchmark author (get-inscribe on HN).

llm_layer:
  roles:
    - interpret_natural_language_intent
    - hide_graph_structure_from_rider
    - field_narration_at_stops
    - vision_what_am_i_looking_at
    - caption_captured_scene_cards
    - memory_snow_globe_export_proxi_parallel
  capture_loop: |
    "Capture this" → Ray-Ban or phone photo + GPS + LLM caption → geotagged scene card on map/git

meta_licensing:
  heritage: |
    StoryMaker shipped Facebook app with album import/export (scene photos ↔ story cards).
    Micropolis Facebook app same era. **Don demonstrates album export / edit / import on camera**
    in the StoryMaker comprehensive demo (not the Layar-only clip):
    https://www.youtube.com/watch?v=_2yEHs_WLzQ&t=742
    (~12:22 export → ~12:39 Facebook drag-edit → ~13:11 import round-trip)
  fresh_audit_2026:
    status: needed
    why: "Graph API, Reels, Ray-Ban device SDK evolved; many 2011 endpoints dropped — evaluate before pitch"
  pitch_angle: |
    Meta already has the wearable (Ray-Ban). We built the safari layer + social card sync once.
    License the graph engine and voice adventure navigation — not acquihire. Uncle Milton model:
    contribute the weird idea; partner ships product with credit.
  licensing_preferred_over: acquihire

