# Urban eBike Safari — voice-first AI touring companion (product seed)
# Product layer on Urban Safari LIVE; license don't acquihire (Uncle Milton model).
# Ray-Ban Meta + handlebar phone + Bosch + Koga + Enviolo + SpeechAnalyzer + hidden story graph.

meta:
  id: urban-ebike-safari
  status: seed
  host: don-hopkins
  participants: [don-hopkins, will-wright, wills-son]
  parent: urban-safari-live.yml
  format: ../../process/one-minute-movie-sandwich.yml

one_line: |
  Voice-controlled adventure navigation through a hidden graph of story cards at real-world
  places — Ray-Bans see and hear, phone shows the route, Bosch moves the bike, LLM translates intent.

elevator: |
  Urban eBike Safari is DreamScape on wheels, descended through iLoci and Urban Safari: geolocated
  scene cards, topical link layers, adventure-style voice navigation while riding. Meta Ray-Ban glasses capture POV and handle
  mic/speakers (prescription lenses, hands on handlebars). Any phone on a handlebar mount is
  display-only — map, Bosch stats, turn-by-turn. Apple SpeechAnalyzer drives hands-free control.
  The rider never sees the graph; the LLM interprets natural language, hops virtual focus across
  nearby POIs and cards, then "set destination" arms Bosch/Apple routing. We already built
  several versions of this idea (1995 DreamScape → 2008–2011 TomTom/SFC → 2026); 2026 adds on-device speech, vision, and LLM narration.

