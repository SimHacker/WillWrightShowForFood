# Urban Safari LIVE — the 2011 AR prototype, performed for real in Amsterdam
# StoryMaker Urban Safari (characters/don-hopkins/media/storymaker-urban-safari/) was
# geotagged scenes on a map. This is the same show with LEGS: real streets, real phone,
# real family — assembled into playlists exactly the way StoryMaker assembled stories.

meta:
  id: urban-safari-live
  status: seed
  host: don-hopkins
  participants: [don-hopkins, wills-son, will-wright]
  lineage: ../../characters/don-hopkins/media/storymaker-urban-safari/INDEX.yml
  format: ../../process/one-minute-movie-sandwich.yml

premise: |
  A REAL urban safari: Don (and Will's son too) hop around Amsterdam on a map and show
  cool stuff — canals, Invader mosaics (../../characters/don-hopkins/media/
  amsterdam-tile-art/), whatever the street serves up. Each stop is a scene card:
  short clip, geotagged, dropped into playlists. The map is the story graph walked
  on foot.

the_call:
  what: |
    WILL'S SON VIDEO-CALLS HIS DAD while out on safari with Don showing him around.
    The time-shifted call-in frame goes mobile and INVERTS: instead of Don calling
    Will's answering machine, Will's SON calls Will live from the streets of
    Amsterdam — "Dad, look where I am, look what Don's showing me."
  why: "The phone frame is the series' connective tissue (sessions/01-mic-check answering machine); this is its warmest instance — family, travel, and the show calling home."

wills_son_clips:
  what: |
    Will's son sends in his own video clips from OTHER European cities too — same
    playlists and other ones. Rome scenes join Amsterdam scenes; the safari
    grows city by city, contributor by contributor.
  pattern: "Modular, incrementally assembled and elaborated over time — EXACTLY how StoryMaker built stories: scene cards accumulate, walks over them multiply."

context: |
  Will's son is right now planning his European trip; he'll visit Don in
  Amsterdam. The shoot rides an actual visit — the show is the trip, documented.
  eBike safaris use Don's Koga + Enviolo fleet (see product_layer field_hardware).

ties:
  - ../../characters/don-hopkins/media/storymaker-urban-safari/INDEX.yml
  - ../../characters/don-hopkins/media/amsterdam-tile-art/INDEX.yml
  - ../../characters/don-hopkins/media/amsterdam-coffeeshops-layar/INDEX.yml
  - ../../process/one-minute-movie-sandwich.yml
  - ../../process/storymaker-stories-and-scenes.yml
  - ../../characters/will-wright/sessions/01-mic-check/SESSION.yml   # the phone frame
  - ../../characters/will-wright/sources/2025-04-29-venturebeat-proxi-funding-crisis/proxi-pitch-parallels.yml  # Proxi geo memories (press)

ai_reimagining: |
  2011 geotagged cards + 2026 LLM field narration + Proxi memory snow globes from safari stops.
  Repo Show audience adds cards via git; map grows city by city.

product_layer: urban-ebike-safari.yml
