# SHOW — Tom Ngo + Golan Levin: ECG & Mouther (brainstorm)
# Heartbeat: talk designs; others implement. process/brainstorm-heartbeat.yml

show:
  id: tom-and-golan-ecg-mouther
  title: "ECG & Mouther — Embedded Constraint Graphics, then and now"
  type: pair
  host: Don Hopkins
  guests: ["Tom Ngo", "Golan Levin"]
  characters:
    - characters/tom-ngo/
    - characters/golan-levin/
  topic: "Brainstorm patent-free ECG reimplementation; WigFabrik as showcase (multitarget mesh+texture + AI target gen); Mouther recover/reverse-engineer; Faceball — conversation only, no coding required."
  status: seed
  consent: not_yet_asked
  heartbeat: ../../process/brainstorm-heartbeat.yml

the_core_idea: |
  At Interval, Tom Ngo built Embedded Constraint Graphics — example poses at simplex
  vertices; drag a feature, solve barycentric blend weights. Golan Levin (with Malcolm
  Slaney) used that editor for Mouther (1995–96): speech-driven cartoon faces.
  Patent US5933150 expired ~2016. The shippable public demo is Soul City's **WigFabrik**
  (aka Wig-M-Porium): multitarget mesh + texture interpolation, AI-generated
  texture maps and hair patterns as ECG *targets*, drag-to-solve weights → Sims head IFF.
  Dream pair: engine builder + artist brainstorm WigFabrik + how to reverse-engineer
  Mouther art (or recover archives), and SVG / Canvas / WebGPU paths for Faceball /
  morph-target faces. Nobody has to ship code on air. Designs land in the repo.

why_them:
  tom: "ECG inventor; WigFabrik is the funny product that needs his math; morph-target thread; Interval colleague"
  golan: "Mouther artwork + concept; flong.com archive; Interval colleague; CMU Electronic Art"
  malcolm_slaney: "Speech/phoneme path — cite with credit; optional later segment, not required this pair"

candidate_topics:
  - "WigFabrik — multitarget mesh + texture blend; AI authors targets, ECG solves weights"
  - "Where should image-gen stop and drag-to-solve start? (hair patterns vs silhouette)"
  - "What ECG actually solved that sliders still get wrong"
  - "Mouther pipeline — ECG visemes × MFCC/GMM phonemes (Slaney) — what to preserve vs simplify"
  - "Do the Mouther cartoons still exist? Recover vs reverse-engineer from flong / memory / stills"
  - "SVG paths as constraint geometry vs Canvas immediate mode vs WebGPU instanced meshes"
  - "Barycentric blends on ARKit / FaceIt morph targets — drag the face, solve the weights"
  - "Tradeoffs: fidelity to 1996 editor vs teaching-toy ECG for WigFabrik / FBCS"
  - "Elegant dead ends — what not to rebuild"
  - "Homefun later: who implements; how credit flows (Tom invents; Golan arts; implementer ships)"

