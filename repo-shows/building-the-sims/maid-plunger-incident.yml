thesis: |
  Censorship that **implies** anatomy the mesh lacks, plus service AI with no bathroom privacy,
  plus a plunger from hammerspace, produced an SNL **Unnecessary Censorship** sketch in SimAntics.
  The fix was behavior-graph surgery — privacy gating, interrupt rules, toilet state routing — not
  a pixel shader. No surviving video; Don's HN comment is the best primary source.

