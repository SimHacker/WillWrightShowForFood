consent:
  ellpeck: "not_yet_asked. IMPORTANT: Ellpeck Games has a public,
    principled stance against AI-generated content in games. The
    invitation must lead with the 1999 design and the composer angle —
    hand-authored moody tracks are artisanal annotation, the OPPOSITE
    of generated content — and make zero asks about LLMs or adopting
    anything. Their stance is a feature for the panel: the best critic
    of the deep end should be in the room, and the moody track schema
    works with no AI anywhere near it."
  leiss-hoffman: "not_yet_asked; natural channel is via Ell after Ell
    accepts. The concrete pitch: annotate your own OST with the meaning
    you already composed into it."
  jamal-green: "not_yet_asked; via Ell. The 'emotion sting artist'
    credit is the show's favorite job title — say so."
