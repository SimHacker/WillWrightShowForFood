# SHOW — Norman Margolus — Cellular Automata Machines (reversible computing, CAM-6)
# Planted seed. Inherits from the SHOW skill (/skills/repo-show).

show:
  id: norman-margolus
  title: "A Repo Show with Norman Margolus — Cellular Automata Machines"
  type: solo   # solo anchor with Norman; scales up to a "CA looping fest" if co-guests join
  host: Don Hopkins
  guests: ["Norman Margolus"]
  with: ["Stephen Wolfram", "Dave Ackley", "Dave Tristram", "Will Wright", "Brian Eno", "Jim Crutchfield", "Scott Draves"]   # dream co-guests for a CA looping fest
  character: characters/norman-margolus/
  topic: "Cellular automata machines, reversible computing, and the physics of computation — CAM-6, the Margolus neighborhood, billiard-ball computers, DLA/dendrite, and the Margolus–Levitin limit. Two acts: PLAY with Don's existing CAM6.js live, then DESIGN a modern version together."
  status: seed
  consent: not_yet_asked
why_him:
  cam6: "With Tommaso Toffoli, built the CAM-6 machine and wrote *Cellular Automata Machines* (MIT Press, 1987) — the book Don's CAM6 simulator follows."
  reversible: "Invented the block cellular automaton + Margolus neighborhood; built reversible, universal CA (billiard-ball computers, the Critters rule)."
  physics_of_computation: "Margolus–Levitin theorem (physical speed limit of computation); computronium / programmable matter; the Fredkin–Toffoli–Knight reversible-computing lineage."
  personal: "Introduced to Don by Milan and Henry Minsky from the AI Lab; Don made a long-form CAM6 demo tailored for Norman as the audience (youtube.com/watch?v=LyLMHxRNuck)."

arc:
  act_1_play: "Bring up the existing CAM6.js live and run the classic rules from the book, with Norman narrating — including the DLA/Margolus-dendrite rule (p.167, §15.7)."
  act_2_design: "Norman has ALREADY granted permission to turn book chapters into interactive playgrounds. Design conversation: build it ground-up modular (easier than breaking down the monolith) — each rule a composable, self-describing unit. Pick a chapter live and design its playground."
  permission: "Norman gave Don permission to take chapters from *Cellular Automata Machines* and make interactive playgrounds around particular sections and rules."
  chapter_picks: "Don's bias — the physical simulations: billiard-ball logic, spin glasses / Ising energy models, lattice gases, especially on the Margolus neighborhood (block partitioning → reversible, momentum-conserving physics). Norman explains why they're interesting; Don makes them playable."

dream_segments:
  - "CAM-6, live: CAM6.js — Sun Forth compiled book rules to lookup tables; JS imported them, then rewrote rules + compiler in JS."
  - "DLA / dendrite: the Margolus-dendrite rule from p.167 §15.7 aggregating live on the Margolus-neighborhood engine — the exact FORTH-generated lookup table."
  - "Block CA + the Margolus neighborhood: how partitioning makes a rule reversible."
  - "Run it backward: reversible, universal CA and the Critters rule — no information lost."
  - "Billiard-ball computers: universal computation from elastic collisions; the 'Flattop' chip with Tom Knight."
  - "The Margolus–Levitin limit: how fast can anything compute? Energy as the bound."
  - "Layers of iteration: x86 Forth on the CAM6 floppies → Don's reimpl in Mitch Bradley's Sun Forth → C → JS (identical tables) → TypeScript next. The lookup table is the constant; 'streams of streams.'"
  - "Emulator or simulator? A live whiteboard argument — hardware simulator, emulated in software, with a Forth DSL that simulates programming CA rules efficiently. Ask Lars Brinkhoff to referee."
  - "'Who JITs the jitter?' — a James-Burke Connections cut: Forth-as-shader on Radio Shack TTL, the 256-byte lookup table (all you need for huge CA spaces, video tracking, ganged parallel layers), now V8 JIT-compiling the JS — and V8's speed tracing back to Self (Ungar/Smith) → HotSpot/Strongtalk (Lars Bak) → V8. Pairs with the David Ungar / Self show."
  - "Design act: cauldron the good bones out of the monolith into a modern web CAM6 — modular, type-safe, self-describing rules that compile to lookup tables. Visual front end: integrate with Snap! (Jens Mönig/Brian Harvey) rather than build a new visual language from scratch — the BEST solution. See characters/don-hopkins/snap-visual-engines-fundable-goals.md (CAM6 + VitaMoo + Micropolis + Bounce, each a fundable goal)."
  - "Chapter playgrounds (permission granted): pick a chapter of the book and build an interactive playground live — physical sims first (billiard balls, spin glasses/Ising, lattice gases on the Margolus neighborhood). Modular, self-describing units, not a monolith fork."
  - "CA looping fest: weave async with Stephen Wolfram (NKS/ruliad), Dave Ackley (robust-first / Movable Feast Machine / indefinitely scalable hardware), Dave Tristram (graphics+CA), Will Wright + Brian Eno (generative systems as art), Jim Crutchfield (edge of chaos) + Scott Draves (generative art)."

archive_weave:
  approach: "A lot is already on the record — weave it async, contextualized into one coherent story, then re-open as a Repo Show anyone can contribute to."
  spine: "The long-form CAM6 demo Don made for Norman — https://www.youtube.com/watch?v=LyLMHxRNuck"
  to_locate_and_verify: ["an early-1990s CAM6 demo", "a Long Now-style talk on computation-as-physics"]
  note: "Archival links are candidates to confirm with Norman / Long Now — do not cite from memory."

