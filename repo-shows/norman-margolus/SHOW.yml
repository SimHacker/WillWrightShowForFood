# SHOW — Norman Margolus — Cellular Automata Machines (reversible computing, CAM-6)
# Planted seed. Inherits from the SHOW skill (/skills/repo-show).

show:
  id: norman-margolus
  title: "A Repo Show with Norman Margolus — Cellular Automata Machines"
  type: solo   # solo anchor with Norman; scales up to a "CA looping fest" if co-guests join
  host: Don Hopkins
  guests: ["Norman Margolus"]
  with: ["Stephen Wolfram", "Dave Tristram", "Will Wright", "Brian Eno", "Jim Crutchfield", "Scott Draves"]   # dream co-guests for a CA looping fest
  character: characters/norman-margolus/
  topic: "Cellular automata machines, reversible computing, and the physics of computation — CAM-6, the Margolus neighborhood, billiard-ball computers, DLA/dendrite, and the Margolus–Levitin limit. Two acts: PLAY with Don's existing CAM6.js live, then DESIGN a modern version together."
  status: seed
  consent: not_yet_asked
why_him:
  cam6: "With Tommaso Toffoli, built the CAM-6 machine and wrote *Cellular Automata Machines* (MIT Press, 1987) — the book Don's CAM6 simulator follows."
  reversible: "Invented the block cellular automaton + Margolus neighborhood; built reversible, universal CA (billiard-ball computers, the Critters rule)."
  physics_of_computation: "Margolus–Levitin theorem (physical speed limit of computation); computronium / programmable matter; the Fredkin–Toffoli–Knight reversible-computing lineage."
  personal: "Introduced to Don by Milan and Henry Minsky from the AI Lab; Don made a long-form CAM6 demo tailored for Norman as the audience (youtube.com/watch?v=LyLMHxRNuck)."

arc:
  act_1_play: "Bring up the existing CAM6.js live and run the classic rules from the book, with Norman narrating — including the DLA/Margolus-dendrite rule (p.167, §15.7)."
  act_2_design: "The current code is an honest 'ugly monolith' with great designs to cauldron out. Sketch, with Norman, what a modern web version wants to be."

dream_segments:
  - "CAM-6, live: bring up Don's existing CAM6.js (C+FORTH heritage, now JS generating the identical FORTH-era lookup tables; JS-Forth retrofittable) and run classic rules from the book."
  - "DLA / dendrite: the Margolus-dendrite rule from p.167 §15.7 aggregating live on the Margolus-neighborhood engine — the exact FORTH-generated lookup table."
  - "Block CA + the Margolus neighborhood: how partitioning makes a rule reversible."
  - "Run it backward: reversible, universal CA and the Critters rule — no information lost."
  - "Billiard-ball computers: universal computation from elastic collisions; the 'Flattop' chip with Tom Knight."
  - "The Margolus–Levitin limit: how fast can anything compute? Energy as the bound."
  - "Layers of iteration: x86 Forth on the CAM6 floppies → Don's reimpl in Mitch Bradley's Sun Forth → C → JS (identical tables) → TypeScript next. The lookup table is the constant; 'streams of streams.'"
  - "Emulator or simulator? A live whiteboard argument — hardware simulator, emulated in software, with a Forth DSL that simulates programming CA rules efficiently. Ask Lars Brinkhoff to referee."
  - "Design act: cauldron the good bones out of the monolith into a modern web CAM6 — a type-safe, self-describing TypeScript dataflow visual programming system (Sandspiel Studio spirit) that compiles rule graphs to lookup tables."
  - "CA looping fest: weave async with Stephen Wolfram (NKS/ruliad), Dave Tristram (graphics+CA), Will Wright + Brian Eno (generative systems as art), Jim Crutchfield (edge of chaos) + Scott Draves (generative art)."

archive_weave:
