# SHOW — Leela AI — visual intelligence, Society of Mind, running
# Planted seed. Inherits from the SHOW skill (/skills/repo-show).
# TONE: celebratory. Showcase the work and the people. No hardship framing.

show:
  id: leela-ai
  title: "A Repo Show with the Leela AI Crew — Visual Intelligence, Running"
  type: group   # scales down to couple / solo / small 'Leela chat' sessions
  host: Don Hopkins
  guests: ["Henry Minsky", "Milan Singh Minsky", "Cyrus Shaoul", "Steve Kommrusch", "Isabella Struckman", "Art Medlar"]
  character: characters/henry-minsky/
  topic: "What we do at Leela AI — visual intelligence that reads activity in video, learning systems in the Society-of-Mind lineage, and turning research into a real product. A friendly show-and-tell by the people who build it."
  status: seed
  consent: not_yet_asked

why_this_show:
  the_work: "Leela AI builds visual intelligence that understands what's happening in video — carrying MIT-AI-Lab ideas (Society of Mind, schema learning) into modern, explainable AI for the real world."
  the_people: "A genuinely deep bench: an MIT-AI-Lab lineage (Henry + Milan Minsky), a co-founder in learning models (Cyrus Shaoul), program-repair + verifiable-ML (Steve Kommrusch), vision-model eval + AI policy (Isabella Struckman), and a builder's builder (Art Medlar: WAIS, early Internet Archive, Connection Machines, PARC)."
  the_hook: "It's fun and it's real — bring up the system live, learn how it learns, and meet the crew. Great AI work deserves a great, open show."

formats:
  group: "The whole crew — a show-and-tell tour of Leela's visual intelligence and the ideas behind it."
  couple: "Milan + Henry Minsky together — product & architecture as a partnership (and a first-wired-family thread)."
  solo: "Individual episodes — each person on what they're passionate about (see per-person show seeds)."
  leela_chat: "A relaxed round-table 'Leela chat' — Steve Kommrusch, Isabella Struckman, Art Medlar, Cyrus Shaoul (+ Henry/Milan) riffing on how it all fits together."

dream-segments:
  - "Bring the system up live — visual intelligence reading activity in video, honest and explainable."
  - "Leela watches The Sims — the pipeline runs on a Sims 4 lot as a simulated customer (Don's captures): staged bottlenecks and stove fires, PDA chat narrating a dollhouse. The Simulator Effect squared, and the surveillance question answered on a workforce with no privacy to violate."
  - "Society of Mind, running — many small agents / schema learning as it shows up in a shipping product."
  - "How it learns — self-supervised grid-world learning (the 2020 Leela paper) and what came next."
  - "Builder's war stories — WAIS + the early Internet Archive + Connection Machines + PARC (Art), program repair + verifiable equivalence (Steve), vision-model eval + AI policy (Isabella)."
  - "Product ↔ research — Milan + Henry on turning research into something people use."

