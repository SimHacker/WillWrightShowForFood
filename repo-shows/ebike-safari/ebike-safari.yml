# eBike Safari — voice-first AI touring companion (product seed)
# Product layer on Urban Safari LIVE.
# Camera + handlebar phone + Bosch + Koga + Enviolo + SpeechAnalyzer + hidden story graph.

meta:
  id: ebike-safari
  status: seed
  host: don-hopkins
  participants: [don-hopkins, will-wright]
  parent: ../urban-safari-live/urban-safari-live.yml
  format: ../../process/one-minute-movie-sandwich.yml
  rendered_edition: ebike-safari.md

one_line: |
  Voice-controlled adventure navigation through a hidden graph of story cards at real-world
  places — you talk, the LLM listens, the phone shows the route, the bike moves you.

elevator: |
  eBike Safari is DreamScape on wheels, descended through iLoci and Urban Safari: geolocated
  scene cards, topical link layers, adventure-style voice navigation while riding. Any camera
  captures POV for scene cards — phone, GoPro, action cam. Any phone on a handlebar mount is
  display-only — map, Bosch stats, turn-by-turn. A mic and open-ear audio carry the
  conversation; Apple SpeechAnalyzer drives hands-free control.
  The rider never sees the graph; the LLM interprets natural language, hops virtual focus across
  nearby POIs and cards, then "set destination" arms Bosch/Apple routing. We already built
  several versions of this idea (1995 DreamScape → 2008–2011 TomTom/SFC → 2026); 2026 adds on-device speech, vision, and LLM narration.

