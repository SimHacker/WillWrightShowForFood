dreamscape_wwdc_1995:
  what: |
    DreamScape (Actualized Fantasy Screen Waster) — constructive ScriptX experience: rooms connected
    in a map, objects with behaviors, smooching UI, astral travel between rooms ("don't lose your head").
    Live improvisational performance programming art at Apple WWDC May 11 1995 on PowerBook 540c.
    Demo did not crash; came close ("my demo's falling apart" — elasticity ping-pong, butterfly agent).
  authoring_and_browsing:
    director: "Import animations with registration points; Mr Potato Head / Lego robot parts; timeline"
    netscape: |
      Dynamically loaded C extension; scriptx: protocol; programmatic HTML collections; room browser
      with nested outlines; forms edit live simulation (elasticity, gravity); image map clicks hit
      real objects. Preview engine for multimedia web you generate — link globally, interact locally.
  web_vision: |
    Each room a distributable title container; plug-togetherable interactive objects on the web;
    window-shopping GIF storefronts linking to downloadable ScriptX objects for test drives. Long
    before modern component web — same itch as Urban Safari cards at POIs and MOOLLM rooms.
  leads_to: [iLoci, StoryMaker, Urban Safari, MediaGraph, MOOLLM, ebike-safari]
  quote: "We want to give creative people an environment in which to plant their seeds — fertile ground, instead of a killer app."
  split_architecture:
    camera_and_audio:
      roles: [capture_pov, open_ear_audio, microphone]
      why: |
        Any camera works for POV scene cards — phone, GoPro, action cam; optional, not required.
        Mic + open-ear audio carry the conversation. Camera off the phone means any handlebar
        mount works (display only); hands stay on handlebars.
    handlebar_phone:
      roles: [map_display, turn_by_turn, bosch_sdk_ui, optional_android]
      mount: "Any phone mount — Quad Lock, Bosch, generic; no integrated camera required"
    bosch:
      roles: [motor_assist_context, battery, speed, route_to_head_unit]
      sdk: "Kiox/Nyon — read telemetry and routing via current Flow SDK"
      note: "Flow does turn-by-turn; it doesn't do voice or story graphs — this does"

