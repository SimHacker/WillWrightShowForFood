pitch_to_scott: |
  Spot — play along with a fun simulated opening for **your** artwork before we talk.
  The menagerie (fictional Chelsea patrons + Bella + Sad Clown + Slats + Donna + Palm…)
  misreads Flame and Electric Sheep, bids §, and you end up with a mountain of worthless
  Simoleons to scatter on Twitch. We did it for JSONsters; yours is generative-art misreads.
  Totally optional; you can redirect the patron voices or skip.

