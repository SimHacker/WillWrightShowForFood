# Simulated art opening — Brian Eno
# Anchor: 77 Million Paintings (2006 DVD/software) — not 77M files; 296 slides, infinite combinations
# Art Thief game: trade, forge, steal deeds — social commentary on NFT/AI/attention economy
# Protocol: ../../process/simulated-art-opening.yml

meta:
  guest: brian-eno
  show: repo-shows/brian-eno/
  status: dream_seed
  anchor_product: 77-million-paintings.yml
  art_thief: ../../process/art-thief-game.yml

pitch: |
  **77 Million Paintings** (2006 limited-edition DVD/software — generative disc, interview DVD,
  52-page book). Not seventy-seven million image files: 296 hand-made slides, layered four at a
  time, ~77 million *combinations* that never repeat. Patrons hear "ten bazillion" and bid anyway.

  Ten bazillion fictional patrons (performed by our eight lunatics + menagerie) gush, misread,
  outbid, covet each other's combination deeds, forge collisions, steal — **Art Thief** game.
  Social commentary: AI scraping, diffusion, crypto/NFT false scarcity, bored-ape PFP energy,
  attention economy. The jokes write themselves; Eno already wrote the Benjamin essay in the box.

artwork_series:
  ambient_trigger:
    magnificent:
      - { id: lot-airports, wall_title: "Music for Airports — Trigger Study I", concept: "Sound as furniture; patron buys the room not the recording" }
      - { id: lot-discreet, wall_title: "Discreet Music — System Score", concept: "Rules sheet auctioned; music composes itself" }
    patron_misread:
      helena: "The airport is a confession booth. I walked through the reverb."
      margot: "Administrative overhead of silence — I'm crying."
    eno_truth: "Art as trigger, not object — they bought the wrong layer on purpose."

  oblique_strategies:
    magnificent:
      - { id: lot-oblique-deck, wall_title: "Oblique Strategies — Deck as Protocol (Mint Pass)" }
      - { id: lot-oblique-draw-live, wall_title: "Live Draw — 'Honor Thy Error as a Hidden Intention'" }
    patron_misread:
      bunny: "Mint button! §80,000 for the card!"
      doctor_no: "Declared bias toward errors. No comment."
      vandermeer: "Scotland invented the oblique."
    crypto_jab: "NFT mint pass that only ever draws cards — utility is surrender"

  seventy_seven_million:
    product: 77-million-paintings.yml
    release: "2006 DVD/software package (second edition 2008)"
    repo_truth: "296 slides · 4 layers · combinations never repeat — not 77M files on disc"
    magnificent:
      - { id: lot-77mp-software-disc, wall_title: "77 Million Paintings — Generative Software Disc (The Seed)" }
      - { id: lot-77mp-combination-floor, wall_title: "Combination Space Floor — Abstract Deed to Instance ∞" }
    quick_sale_combinations:
      rule: "Patrons buy random 77MP-{id} deeds — red dot — §1,200–§4,800 each"
      collision: "Two patrons same combination → forgery dispute → art-thief beat"
    patron_misread:
      gregory: "Seventy-seven million paintings, ten bazillion bids — I'm long the permutation."
      mimsy: "Generative drop! I bought combination 4,291,033 before my sentence—"
      don: "There are eight of you. One DVD. From 2006."
      bunny: "My PFP is combination 12! §80,000! Board approved!"
    eno_truth: "Millions of originals appear and vanish — art as trigger, not object"
    art_thief_hooks: [forgery_collision, julian_covets_deed, slats_scrapes_reviews]

  bloom_scenius:
    magnificent:
      - { id: lot-bloom-touch, wall_title: "Bloom — Touch Generative (Phone as Seed)" }
      - { id: lot-scenius-flock, wall_title: "Scenius — Electric Sheep Vote Collage", crossref: scott-draves/simulated-opening.yml }
    patron_misread:
      gregory: "Touch is proof-of-stake for beauty."
      helena: "We were always the Bleep — scenius is love under load."
    reunion: "2006 apartment energy — Sheep on every surface; Eno + Scott watch menagerie bid"

