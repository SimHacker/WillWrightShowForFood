interview_center:
  the_source_listing:
    ask: "Heinz, you kept the complete PIXIE listing for 57 years — walk us through it. What do the light pen handler and interrupt code actually do? What did 5000 instructions of interaction + 3000 words of model feel like to budget?"
    doc: characters/heinz-lemke/pixie-source-recovery.md
    prompts:
      - "The correction on air: NOT a dumb terminal for Titan — an interactive graph-model builder. Let Heinz set the record straight, with DSHR responding (his p.465 reading was the reasonable inference; the author's memory + listing beat the diagram)"
      - "Graph-theoretic models in 3000 words — circuits, syntax graphs, control systems; what got cut?"
      - "DSHR's light-pen mechanics (beam-pass interrupt, 'figure out what you were drawing') vs the actual handler in the listing"
      - "Lars: from listing to SIMH — assemble it? Run it against the Type 340 emulation? What's missing?"
    segment_goal: "Turn the recovered listing from a scan into a runnable artifact on stream — telecine to source to emulator."
  chapman_films_bumblebee:
    ask: "What was it like when the 1969 films surfaced again? Who is in the footage? How did the light pen + radial menus feel?"
    doc: characters/heinz-lemke/cambridge-films-flight-of-the-bumblebee.md
  rosenthal_cambridge_pdp7:
    ask: "Heinz + David Rosenthal — same machine, different years. What did the lab feel like? What carried into NeWS and X11?"
    with: characters/david-rosenthal/
    prompts:
      - "Heinz programmed PIXIE; DSHR arrived ~1970 — overlap in hardware, different projects"
      - "Wiseman from two perspectives"
      - "Distributed graphics satellite + Titan link as ancestor of networked window systems"
  neil_wiseman:
    ask: "What was Neil E. Wiseman like to work with — technically, personally, and as a research leader?"
  cambridge_zeitgeist:
    ask: "What was the Cambridge computer graphics / CAD / HCI zeitgeist in the late 1960s?"
  engelbart_demo_zeitgeist:
    ask: "1968 Mother of All Demos ↔ 1969 PIXIE film — same light-pen era, different labs. What did Heinz see on the US trip? Demo culture vs distributed CAD?"
    doc: characters/douglas-engelbart/GLANCE.md
    memorial: "Discuss Engelbart in memorial mode — never interview"
    sponsor_gag: repo-shows/ideas/gags/cambridge-gag-credits.yml#light_pen_bureau_sponsor
    open_models: repo-shows/ideas/gags/lightpenisland-net.yml#engelbart_division
    on_air: "Mother of All Demos zeitgeist; demo Bluetooth kits and free STL — not private reference hardware"
  us_research_labs_trip:
    ask: "What was Heinz's trip to the US research labs like, and what did he see there?"
    weizenbaum_hook: |
      MIT 1969 — met Joe Weizenbaum presenting PIXIE; decades at TU Berlin. Heinz asks Don about
      "model science" and AI trustworthiness (10 Jul 2026). Two-episode pitch: 1969 US trip + modern CARS.
    greyhound_1969: |
      Summer 1969 — 3-month Greyhound ticket for $99; Engelbart at SRI; job offer from W.R. Sutherland
      at MIT; Utah (Evans, Ivan Sutherland). Full lab list in heinz-1969-us-lab-tour.md; agenda pull-in pending.
    doc: characters/heinz-lemke/sources/heinz-1969-us-lab-tour.md
  andrew_armit_coons_pdp7:
    ask: "Alan Kay remembers Andrew Armit at Utah with Coons patches on PDP-7 — parallel to PIXIE. Can we find film? What did Cambridge graphics export to Utah?"
    kay_side_note: characters/andrew-armit/sources/alan-kay-utah-coons-patches.md
    barn_archive_2026_07_16: characters/andrew-armit/sources/2026-07-16-armit-archive-manifest.md
    character: characters/andrew-armit/
    invitation: characters/andrew-armit/invitation.md
    heinz_echo: "Armit's Coons patch system — another UK graphics line ignored in US textbooks"
    film_update: "Jul 2026 — Armit confirms Multipatch film existed; barn notes; shown with Henri Gouraud on US CAD tour"
    simulation: "Octal listings + PDP-7/340 manuals — second emulator target beside PIXIE"
    on_air: "PDP-7 double feature — radial menus vs Coons patches; barn scan party; Alan↔Andrew dedication beat"
  newman_sproull_canon_correction:
    ask: "Roy Eagleson found PIXIE in Newman & Sproull as ref 520 — 'movable menu,' not radial/pie menu. What should the textbook have said?"
    with: characters/roy-eagleson/
    doc: characters/heinz-lemke/sources/newman-sproull-ref-520-movable-menu.yml
    also: characters/don-hopkins/pie-menus-chi-88-and-beyond.md
    on_air: "Scan ref 520 on stream; compare Wiseman radial-menu notes; credit lineage (Buxton, Kurtenbach)"
  alan_kay_light_pen_vs_tablet:
    ask: "Alan Kay wondered why PIXIE used a light pen instead of a RAND tablet — fatigued hand, twitch button. What did the pen actually feel like? What does the driver code show?"
    kay_quote: characters/heinz-lemke/from-alan-kay.yml#light_pen_2020
    lars_segment: "Emulator tests mouse → pen; compare tablet affordances"
  medical_automation_today:
    ask: "How does Heinz see the line from early graphical interaction/CAD to his later medical-computing work?"
    bridge: "PIXIE was graphical man-machine communication for design; CARS is model-guided human-computer assistance in medicine."
  cars_2027_berlin_hci:
    date: 2027-06-29
    ask: "Can PIXIE re-implementation, ELIZA history, and Human-AI model interaction share one HCI session in Berlin?"
    participants:
      roy_uwo: characters/roy-eagleson/sources/2026-07-14-uwo-pixie-reimplementation.md
      leo_joskowicz: characters/leo-joskowicz/sources/heinz-2026-07-cars2027-eliza-proposal.yml
      mario_cypko: characters/mario-cypko/sources/model-guided-medicine-cars.md
    characters:
      - characters/leo-joskowicz/
      - characters/mario-cypko/
    on_air: "60th anniversary Cambridge lecture — emulated PIXIE + Weizenbaum quote + transparent clinical models"
  lars_pdp7_type340_emulation:
    ask: "What did the PDP-7 + Type 340 + light pen actually do — and how do we emulate it faithfully today?"
    with: characters/lars-brinkhoff/
    prompts:
      - "Walk the Type 340 Display Programming Manual — vector refresh, display list, pen hits"
      - "SIMH / simh.org / community paths to a bootable PDP-7 with 340 option"
      - "Living hardware vs emulator — Munching Squares on PDP-7/340; what transfers to PIXIE"
      - "Titan link as distributed CAD — emulate graphics satellite first, batch link later?"
      - "Make-it-so deliverable: rig yaml + SETUP.md forkable from repo-shows/lars-brinkhoff/"
      - "Cambridge PDP-7 software likely lost — research hardware (light pen, networking) and implement test code"
      - "Label-target light-pen pie menus without float trig — vs mouse slice targeting"
      - "Mouse → light pen interpolation in emulator — design on air, code later or demo if done"
      - "Engelbart mouse + keyset on PDP-10 — how did the hardware attach?"
    homefun: "Boot closest faithful stack; one radial-menu interaction captured on stream"

format:
  live: false
  async_one_on_one: true
  production_model: |
    Record separate 1-on-1 video calls whenever each bud is available (no synchronized group
    session required). Don interlinks character directories, artifacts, and clips; post-production
    cuts an intertwingled tapestry — each bud shares, watches what others shared, responds on their
    own recording. Supersedes original "same call" invitation wording (July 2026 logistics pivot).
  audience_qa: true
  production_style: "Async Studio Sessions (recorded 1-on-1) → intercut in post; optional live Twitch for segments."
  notes: |
    Open with bud introductions (telecine slates). Heinz bud leads history; DSHR bud holds Cambridge
    ~1970 + lineage (short segment — defer NeWS/X11 depth to david-rosenthal solo show); Lars bud
    leads emulation. Intercut 1969 film + live emulator + cross-references between async clips.
    Honor Wiseman and Hiles.
  logistics_2026:
    lars_brinkhoff: "Yes/later — Swedish July vacation; unprepared/rambling format OK"
    david_rosenthal: "Grandparent duty through 2026-08-17; 9h from Amsterdam; PDP-7/340 only on PIXIE"
    correspondence:
      - characters/lars-brinkhoff/correspondence.yml
      - characters/david-rosenthal/correspondence.yml
  on_stream_wardrobe:
    host: "Don wears one of Lars Brinkhoff's retrocomputing tees — github.com/larsbrinkhoff/t-shirts (e.g. LISP MACHINE MANUAL; see characters/don-hopkins/media.md)"
    buds: "Lars or co-buds may wear their own from the same emporium if they like"
  segment_order_suggestion: [introductions, heinz_history, rosenthal_same_machine, lars_emulation, heinz_cars, open_qa]
  post_production:
    look: cambridge_telecine_jiggle
    spec: process/post-production/cambridge-telecine-jiggle.yml
    pipeline: characters/will-wright/sources/don-youtube-jDrqR9XssJI-flight-of-pixie/production-notes.md
    what: |
      After Effects — reuse the exact motion track + blur/glow from Don's *Flight of the PIXIE*
      Bumblebee edit on Repo Show titles, credits, bud slates, segment cards, jokes, and
      dedication blocks. Match Chapman digitized 1969 film jiggle so packaging looks like the
      same old Cambridge University reel as the archival inserts. Don (7 Jul 2026): extend to
      old-school B&W film grain + modern subtitles — **house style** for retro Repo Show videos;
      motion-tracked credits were his proudest Bumblebee moment.
    applies_to: [opening_title, bud_slates, introductions, segment_cards, lower_thirds, jokes, dedication, end_credits, gag_credits]
    gag_credits: repo-shows/ideas/gags/cambridge-gag-credits.yml
    gag_credits_anchor: "Department of Research Simulation"
    consulting: Ground Up Software
    sponsor_spot:
      id: light_pen_bureau_sponsor
      after: "Computing Laboratory — Light Pen Bureau"
      opener: "And now, a word from our sponsors."
      url: https://lightpenisland.net/
      url_repeat: "I repeat, lightpenisland.net. Surf carefully."
      spec: repo-shows/ideas/gags/cambridge-gag-credits.yml#light_pen_bureau_sponsor

