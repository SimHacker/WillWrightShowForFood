# SHOW — Paul Haeberli — ConMan, GRAFICA Obscura, resurrection hour
# Planted seed (stub — enhance later). Warm contact of Don's.

show:
  id: paul-haeberli
  title: "A Repo Show with Paul Haeberli — A Dynamic Live Performance, Orchestrated by the User"
  type: solo
  host: Don Hopkins
  guests: ["Paul Haeberli"]
  character: characters/paul-haeberli/
  topic: "ConMan and visual dataflow (1988), sixteen years of SGI graphics research, GRAFICA Obscura as proto-build-in-public, and resurrecting old code on air — F.U.N."
  status: seed
