  power_of_simplicity: "Ungar & Smith's thesis wasn't 'The Power of Prototypes' — it was **The Power of Simplicity.** Prototypes were the means; simplicity was the lesson JavaScript missed."
  implementation_lineage: "**Maps** and **polymorphic inline caches** (Chambers, Hölzle, Lars Bak) — how you make delegation fast; lineage runs Self → Strongtalk/HotSpot → **V8**. JS threw away Self's clean model but runs fast because of Self's implementation tech."
  generosity: "Very open and influential — **self-interest** mailing list, Kaleida **Conscientious Objectors** meetup (ScriptX × Self), papers, humor (*Self: The Movie*). Don: huge credit owed even if Self never shipped on every device."
  in_spirit: "Self doesn't run on everybody's phone — **in spirit it does**: JavaScript's object model, HotSpot/V8, MOOLLM's directories-as-prototypes."
  jan_2026: "Don wrote Jan 2026 about MOOLLM building on Self; warm thread in correspondence.yml."

