# SEED — Antoni Sawicki: ttycity — Micropolis for the Terminal
# A repo show about a repo: same medium, same lineage, same mandate.

show:
  id: antoni-sawicki-ttycity
  status: seed
  type: solo
  guest: antoni-sawicki
  guest_room: ../characters/antoni-sawicki/
  repo_to_show: https://github.com/tenox7/ttycity
  consent: not_yet_asked
  interview_planned: true

correspondence_jul_2026:
  note: "Antoni owns ttycity; pre-HN; emoji mode highlight — see ../characters/antoni-sawicki/sources/"

pitch: |
  Antoni Sawicki (Tenox) forked the freed Micropolis code and put SimCity in the
  terminal: ncurses, engine untouched, one binary, four graphics modes from vt100
  ASCII to Unicode emoji tiles, mouse support, playable over ssh at 80×24. It's
  his SECOND Micropolis port (wintown already runs it on Windows NT RISC). This
  is the Repo Show's home turf: a GitHub repo, a GPL lineage that credits Will
  Wright by name, and a one-person dev story that proves the whole thesis.

why_this_show:
  same_medium: |
    ttycity is a GitHub repo; the show is a GitHub repo. Browse the source on
    air, build a city over ssh, file issues as audience participation — the
    artifact and the episode are the same kind of object.
  lineage_payoff: |
    Long Now askers → Don's lightning bolts → Walter Bender's mandate → EA
    clearance → SimHacker/micropolis (2008) → tenox7/ttycity (2026). Eighteen
    years later the freed code is still sprouting new heads. Antoni is the
    mandate executing itself: view source, build on top, ship, credit.
  robots_in_the_toolchain: |
    Antoni's OpenTTD NT RISC port used LLMs — "a tireless army of robots" — to
    downgrade modern code to Visual C 4.0. Same production model as the show:
    humans author, AI does the mechanical rewrites, more worlds stay alive.
  show_it_to_will: |
    ttycity's README credits "SimCity Classic from Maxis, by Will Wright."
    Put the terminal on Will's screen: his 1989 city, rendered in emojis,
    playable over ssh. Ask him which tile set is canon.

segments:
  - id: build-a-city-over-ssh
    what: "Live terminal session — new random city, zone with hjkl, cycle themes and graphics modes on air; audience votes the next build via chat."
  - id: the-rendering-ladder
    what: "vt100 ASCII → 8-color curses → emoji tiles → aalib. One engine, four faces — portability as a spectrum, demonstrated with the u key."
  - id: the-porters-craft
    what: "wintown, NT Games, Web Rendering Proxy, OpenTTD on Alpha/MIPS/PowerPC — why keeping dead platforms alive is preservation, not nostalgia."
  - id: tireless-army-of-robots
    what: "LLM-assisted backporting to Visual C 4.0 — AI as the mechanical rewriter; what one person can maintain now."
  - id: will-reacts
    what: "Show ttycity to Will Wright — the emoji city meets its designer. Candidate crossover beat for the flagship show."

drag_race_tie:
  format: micropolis-ai-drag-race.yml
  challenge: retrocomputing_drive
  note: "ttycity is a ready-made vehicle: how small a terminal, how old a machine, how few colors can still hold a living city?"

ties_to:
  - ../characters/antoni-sawicki/CHARACTER.yml
  - ../characters/will-wright/sources/simcity-open-source-saga/README.md
  - ../characters/will-wright/sources/2013-tale-of-two-simcities/
  - micropolis-ai-drag-race.yml
  - ../catalogs/soul-city/README.md
