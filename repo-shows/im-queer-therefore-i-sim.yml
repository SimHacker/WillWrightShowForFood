# SHOW PROPOSAL — I'm Queer Therefore I Sim (Alexander Avila + Don Hopkins)

show:
  id: im-queer-therefore-i-sim
  title: "I'm Queer Therefore I Sim"
  subtitle: "Alexander Avila × Don Hopkins — the essay, 1,712 comments, and what MOOLLM found"
  type: group
  host: Don Hopkins
  guests: ["Alexander Avila"]
  character: characters/alexander-avila/
  topic: |
    Discuss Alexander Avila's "Did The Sims make you gay?" video essay and the wonderful
    YouTube comment corpus — already analyzed in MOOLLM (14 themes, cluster summary).
    Theory (Butler, Lacan, Althusser) meets engine room (Don's design-doc advocacy, Patrick's
    implementation). Optional cross-cut with Looksmaxxing essay and Patrick solo episode.
  status: proposed
  title_origin: characters/don-hopkins/sources/qgcon-inclusivity-paper/title-candidates.yml  # Don coinage → Avila talk

dialect:
  voice: stoner_techno_hippie
  terms:
    guest: bud
  on_air_opener: "This show's bud is…"

segments:
  essay_frame:
    ask: "Walk the thesis — performativity, mirror stage, within or without. Still your answer?"
    video: https://www.youtube.com/watch?v=Xi-HWyh0Ybk
    closing_question: "Do you queer The Sims — or does The Sims queer you?"

  comment_corpus:
    ask: "We analyzed 1,712+ comments in MOOLLM — did we miss anything? misread a cluster?"
    analysis: https://github.com/SimHacker/moollm/blob/main/designs/sims/sims-queer-identity-formation.md#community-response-comment-analysis
    highlights:
      - "Underground wlw houses (9.7k likes)"
      - "Quit without saving — parental concealment"
      - "Holy shit they can just DO that"
      - "Too busy placing couches (5.6k)"
      - "2022 orientation update debate"
      - "Counter-testimonies — didn't make me gay"
    moollm_index: characters/alexander-avila/sources/moollm-links.yml

  historical_correction:
    ask: "MOOLLM documents Don's design-doc intervention — slap in prototype, advocacy, Patrick parallel. Fair?"
    doc: https://github.com/SimHacker/moollm/blob/main/designs/sims/sims-queer-identity-formation.md#historical-correction-the-full-story
    optional_clip: repo-shows/did-the-sims-make-you-gay.yml  # Patrick episode cross-cut

  mirror_stage:
    ask: "Palm wrote 'The Mirror Stage of Games' in MOOLLM adventure — underground houses, fiction as mirror."
    reading: https://github.com/SimHacker/moollm/blob/main/examples/adventure-4/pub/stage/palm-nook/study/the-mirror-stage-of-games.md

  companion_essay:
    ask: "Looksmaxxing and M2M transsexuals — performativity vs gaze; Patreon connection."
    video: https://www.youtube.com/watch?v=uox4OMC50-4
    optional: true

  audience_stories:
    ask: "TicketPR — congregation submits Sims queer awakening stories; Alex reacts."
    format: async_friendly

format:
  live: false
  async_one_on_one: true
  production_model: |
    Alex records when ready; Don intercuts MOOLLM theme cards, fair-use essay clips, comment
    quotes (commentary), optional Flipbook B-roll. Solidarity default — Pride welcome mat.

solidarity:
  stance: |
    LGBTQ+ solidarity — trans, queer, nb, ace, bi, lesbian, gay, genderfluid. The Sims audience
    IS the congregation Alex documented. No mockery of commenters.
  lexicon: repo-shows/infodump.yml#solidarity_lexicon

invitation:
  path: characters/alexander-avila/invitation.md
  priority: warm_lead
  consent: not_yet_asked

evidence:
  - characters/alexander-avila/sources/moollm-links.yml
  - characters/alexander-avila/sources/filmography.yml
  - characters/patrick-j-barrett-iii/sources/did-the-sims-make-you-gay-avila.yml

see_also:
  - repo-shows/did-the-sims-make-you-gay.yml
  - characters/patrick-j-barrett-iii/
  - characters/don-hopkins/sources/qgcon-inclusivity-paper/
  - repo-shows/flipbook/
