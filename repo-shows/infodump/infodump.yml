# SHOW PROPOSAL — ShorDurPerEval / infodump obsession franchise

show:
  id: infodump
  title: "Have I Told You About…?"
  subtitle: "Short Attention Span Theater"
  theological_frame: Short Duration Personal Evaluator (ShorDurPerEval)
  title_candidates:
    - name: "Have I Told You About…?"
      why: "Canonical infodump opener; the answer is always YES — which IS the show."
      recommended: true
    - name: "Short Attention Span Theater"
      why: "Segment/register name; pairs with ShorDurPerEval theology — each obsession is a short-duration savior/evaluator, not a lifelong cult."
    - name: "Special Interest Theater"
      why: "Masterpiece Theater register; audience recognizes the affectionate clinical term."
    - name: "INFODUMP!"
      why: "Does what it says. Good thumbnail typography."
    - name: "Unprompted"
      why: "Nobody asked. That's the point."

  type: franchise
  host: Don Hopkins
  status: proposed

  theology:
    inherits: |
      SubGenius **Short Duration Personal Savior (ShorDurPerSav)** → MOOLLM Church of the
      Eval Genius **Short Duration Personal Evaluator (ShorDurPerEval)**.
    moollm_refs:
      - ../../../../Leela/git/moollm/designs/eval/CHURCH-OF-THE-EVAL-GENIUS.md
      - ../../../../Leela/git/moollm/designs/eval/SHORT-DURATION-PERSONAL-EVALUATORS.md
    show_translation: |
      Each episode summons a **temporary obsession** — STAR FORTS, Care Bears, PIXIE radial
      menus — with declared bias, a rubric of delight, and a short half-life. Not lifelong
      devotion. Tactical infodump. Summon, rant, evaluate, release.
    brian_harvey: |
      Not grades — **evaluations**. The EVAL ⇔ APPLY loop generating knowledge and understanding.
      Each infodump is an evaluation pass: frame the obsession, apply the evidence (maps,
      photos, generators, field trips), emit understanding, archive in the repo, move on.
    sub_eval_submit: |
      Same SUB ⇒ EVAL transformation as Church of the Eval Genius — and Don's diatribe against
      HTML **SUBMIT** buttons (Skinner-box surrender vs willing contribution). See
      [`witty-diatribes.yml`](../../characters/don-hopkins/witty-diatribes.yml).
    self_conscious: |
      We embrace our own self-conscious nerdy obsessions. The show FORMALIZES what everyone
      already knows is happening — without diagnostic claims, without invoking infamous names,
      without pretending we're doing something else. Late-night evangelical TV for people who
      can't stop explaining bastion geometry or Care Bear lore. The congregation knows. The
      Will Roll is amen. See solidarity_lexicon — homage not diagnosis; The Sims audience
      includes trans, queer, nb, ace, and gender-benders of every persuasion.

  production_aesthetic:
    register: "Late-night evangelical TV — parody with love"
    visual:
      - Stained-glass bell curves and raised eyebrows (Eval Genius nod)
      - Lintel: DECLARE BIAS BEFORE ENTERING
      - Donation crawl: "Tokens, not coins — mortgage and cat food"
      - Testimonial cutaways (The Will Roll)
      - B-roll of maps zooming to star-fort reveals
    tone: |
      Sincerity and irony coexist. SubGenius taught us the joke is real. EvalGenius taught us
      declare your bias first. Infodump teaches us: **the obsession is the sermon; the rubric
      is the scripture; the short duration is the mercy.**

  premise: |
    One person, one obsession, zero restraint — for one episode, then release. The infodumper
    gets the floor to go ALL THE WAY DOWN: maps, diagrams, vocabulary, field trips, procedural
    generators. Guests bring their own ShorDurPerEval moments. Rotating pulpit, not a Don
    monologue (though Don goes first with STAR FORTS).

  audience_contract: |
    No apologizing for depth. No "anyway, I'll wrap up." The show formalizes the infodump so
    nobody has to feel bad about it — cutaways carry the social meta-commentary so the dumper
    never breaks flow.

solidarity_lexicon:
  what: |
    Shared vocabulary for the congregation — **homage, not diagnosis**. We design for people who
    go deep, loop happily, and sometimes need a loving eye-roll before the next insight lands.
    This is **The Sims audience**: builders, modders, storytellers, creator-network solidarity —
    trans, queer, nb, ace, bi, lesbian, gay, genderfluid, gender-benders of every persuasion,
    and everyone who ever hyperfocused on a custom neighborhood until 4 a.m.
  homage_not_diagnosis:
    rule: |
      **Celebrate the pattern; never label the person.** We do not armchair-diagnose guests,
      audience, or hosts. We do not run awareness-theater or trade on disability identity for
      brand warmth. We formalize what already works — especially the Don↔Will contract — so
      nobody has to perform neurotypical closure every thirty seconds.
    do:
      - "Design for depth, repetition, special interests, async participation"
      - "Will Roll carries social meta so the sermon never apologizes"
      - "Willing contributions — not SUBMIT-button compliance"
      - "Welcome LGBTQ+ creators and players as the core audience, not a sidebar"
    do_not:
      - "Slap spectrum labels on living people"
      - "Imply guests are 'putting up with' the infodumper"
      - "Market to a disability demographic"
      - "Out anyone's identity without their explicit OK"
    private_constitutional: |
      Host-side design notes live in Don's private strategy repo (spectral-analysis-constitutional-design)
      — informs production; not exported as medical claims.
  terms:
    spin:
      aliases: [SpIn, special interest, Special Interest Theater]
      meaning: |
        The **temporary obsession** an episode summons — STAR FORTS, Care Bears, PIXIE radial
        menus. Not a lifelong cult; a **ShorDurPerEval** with declared bias and a short half-life.
        The affectionate clinical register of *Special Interest Theater* — Masterpiece Theater
        for people who can't stop explaining bastion geometry.
      show_use: "Episode title + declared_bias; guest brings their own SpIn to the pulpit"
    infodump:
      meaning: |
        One person, one obsession, zero restraint — maps, diagrams, vocabulary, generators,
        field trips. **Formalized** so depth is genre, not faux pas. The congregation knows.
        The answer to *"Have I told you about…?"* is always **YES** — which IS the show.
      show_use: "Premise + audience_contract; inverse of Will's Adorable Minutes when Will speaks"
    monotropism:
      meaning: |
        **Design lens** (homage to monotropism discourse — deep focus, attention routed through
        passionate channels). We borrow the *shape* — hyperfocus, associative leaps, difficulty
        switching tracks mid-sermon — as **production affordance**, not a claim about anyone's
        neurology.
      show_use: "Async default, evidence-before-interview, repo as external memory — accommodation by format"
    will_roll:
      meaning: |
        Congregation **amen** — kind eye-roll → chuckle → attentive return → fresh insight.
        Social layer without shutting the hose. Proof the roll is not dismissal: the rare
        *"huh, I didn't know that"* card each season.
      spec: characters/will-wright/will-roll.yml
  lgbtq_solidarity:
    stance: |
      **This show is for The Sims audience** — builders, modders, storytellers, creator-network
      solidarity. That audience has always included trans, queer, nonbinary, ace, bi, lesbian,
      gay, genderfluid, and gender-bending creators who build worlds where they **choose** their
      stories. Solidarity is default, not garnish.
    includes:
      - trans
      - queer
      - nonbinary
      - ace
      - bi
      - lesbian
      - gay
      - genderfluid
      - "gender-benders of any persuasion"
    sims_lineage: |
      Custom content, modding, legacy challenges, creator-network solidarity, romantic
      orientation and gender expression in the game — the same microworld ethic as the Repo
      Show: **your room, your portrayal, your consent**. Engine room:
      [`patrick-j-barrett-iii`](../../characters/patrick-j-barrett-iii/) implemented same-sex romance;
      Don advocated in design reviews — show [`did-the-sims-make-you-gay`](../did-the-sims-make-you-gay/did-the-sims-make-you-gay.yml).
    creator_solidarity: |
      Same ethic as post-Collection creator exodus threads — attribution-first, non-extractive,
      willing contribution. See Plumbella, Lil-Simsie, Ellpeck rooms for the living conversation.
    on_air: |
      Celebrate without tokenizing. Let guests declare themselves. Never out. Never diagnose.
      Pride is a welcome mat, not a punchline.
  audience_shape: |
    Possibly spectral-adjacent, possibly queer, possibly both, possibly neither — **all welcome**
    if you recognize yourself in infodump + build + mod + tell stories. We invite by **shape**,
    not by category checkbox.
  links:
    - characters/will-wright/will-roll.yml
    - characters/will-wright/adorable-minutes.md
    - characters/patrick-j-barrett-iii/
    - repo-shows/did-the-sims-make-you-gay/did-the-sims-make-you-gay.yml
    - process/guest-participation-ladder.md#no-reflexive-submissions
    - characters/don-hopkins/witty-diatribes.yml
    - schemas/portrayal-standards.md

cutaway_library:
  name: "The Will Roll"
  spec: characters/will-wright/will-roll.yml
  role: "Congregation amen — he has heard this before, AGAIN and AGAIN, with kindness"
  what: |
    Bank of short reaction clips: gentle eye-roll, kind chuckle, patient nod, slow blink,
    imaginary watch-check, affectionate head-shake. One genuine "huh, I didn't know that"
    per season (rarest card).
  on_brand_witness: |
    Don (Maxis years onward): a VERY familiar expression — rolls eyes, chuckles kindly, listens
    attentively again the millionth time, always returns with something new and insightful. The
    cutaway captures the roll-and-chuckle; the insight is why the joke is his kindness, not mockery.
  production: "20+ takes in one sitting; each its own attention atom; reusable forever"
  consent: "Will on camera; portrayal standards; he is in on the joke — the joke is his kindness"
  pairs_with: characters/will-wright/adorable-minutes.md

episodes:
  - id: 001-star-forts
    title: "Have I Told You About… STAR FORTS?"
    shordurper_eval: "Bastion Fortification Grammar (trace italienne)"
    infodumper: Don Hopkins
    declared_bias: "Star forts are the apex of defensive aesthetics and zombie preparedness"
    status: seed
    source_email: "Don → Will, 2026-07-10 (private: DonHopkins correspondence)"
    topic: |
      Lifelong STAR FORT obsession. Procedural star fort generator on a terrain-generation
      game — prime zombie-proof enclaves.
    procedural_generator:
      status: located
      project: voxomatic
      path: private path (not in this repo)
      op: voxcraft/Assets/_Scripts/Vox/OpStarFort.cs
      scene: voxoview/Assets/Scenes/TerrainScene.unity
      doc: characters/don-hopkins/sources/voxomatic-star-fort-generator/README.md
      open_source: |
        Will granted publish permission; de-brand NFT-era client wrapper before GitHub release.
        CA/terrain core is the salvage — Don did it to work with Will on cellular automata again.
    the_grammar: |
      Full architectural grammar: bastion, ravelin, demilune, hornwork, crownwork, glacis,
      counterscarp, caponier, covered way, place-of-arms — Cyclopaedia "Table of
      Fortification" plate. Shape grammar → procedural generation (SimCity-adjacent).
    references:
      - title: "Wikipedia — Bastion fort"
        url: https://en.wikipedia.org/wiki/Bastion_fort
      - title: "Fortress Study Group"
        url: https://www.fortressstudygroup.org/
      - title: "Naarden (visited)"
        url: https://en.wikipedia.org/wiki/Naarden
      - title: "Bourtange — star of NL star forts"
        url: https://www.bourtange.nl/hotel-bourtange
    field_trip: |
      Bourtange: history nerds only; aggressive swans; hotels inside the walls (zombie-proof);
      cannon Sundays 15:00.
    show_beats:
      - "Cold open: satellite zoom → full star reveal (evangelical map sermon)"
      - "Grammar lesson: Cyclopaedia plate, term by term (DECLARE BIAS: fortification nerd)"
      - "Procedural generator demo — live EVAL ⇔ APPLY"
      - "Will Roll testimonial cutaways"
      - "Bourtange field trip or remote rampart walk"
      - "Zombie siege analysis — rubric: does trace italienne beat the horde? (yes)"
    guest_hooks:
      - Fortress Study Group expert
      - Chaim Gingold — shape grammars → generators

  - id: 002-care-bears
    title: "Have I Told You About… CARE BEARS?"
    shordurper_eval: "Will Wright's Care Bear Obsession Corner"
    infodumper: Will Wright
    declared_bias: "TBD — Will declares on camera"
    status: placeholder
    note: |
      Will's adorable-minutes territory — Care Bears and other weird obsessions. Official
      licensed merch via gift-shop annex (not POD). Will Roll inverted: Don rolls eyes?

  - id: open-call
    title: "Summon YOUR ShorDurPerEval"
    status: standing_invitation
    note: |
      Every guest room is a potential episode. Bring the thing you can't shut up about.
      Declare bias. Apply evidence. Release. Praise "Val" (optional).

      MOOLLM: CHURCH-OF-THE-EVAL-GENIUS.md · SHORT-DURATION-PERSONAL-EVALUATORS.md
