# SHOW SEED — How Inclusivity Saved The Sims (QGCon paper → Repo Show)

show:
  id: how-inclusivity-saved-the-sims
  title: "How Inclusivity Saved The Sims"
  type: solo_or_panel
  host: Don Hopkins
  guests: ["Ian Bogost", "Janet Murray", "Tanja Sihvonen", "Jacques Servin", "Alexander Avila", "Blake Jennings"]
  topic: |
    Twenty years of Sims inclusivity — procedural rhetoric (Bogost), agency and storytelling
    (Murray), modding culture (Sihvonen), same-sex design arc (Don → Patrick Barrett),
    Simulator Effect, McCloud masking, Papert constructionism. Parallel marriage-law timeline.
    **2026 act:** Soul City NC namesake (Nixon HUD, Helms foreclosure); reported EA buyout;
    Soul Saver / SoulAngel soul evacuation; Sims ⇔ Soul City ⇔ Tiny Life bridge.
  status: seed
  consent: not_yet_asked
  origin: "QGCon 2020 abstract (canceled); Google Doc integrated to repo 2026-07; Soul City reframe 2026-07"

