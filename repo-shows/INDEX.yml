# SHOWS — one document per show proposal
#
# Each show is a streamed conversation that FOLLOWS THROUGH — designs land in the
# repo; implementation is optional *homefun* (guests need not code — brainstorm-heartbeat).
# Two axes:
#   solo:  one person × one topic (a person can do SEVERAL shows on different
#          topics — especially Will Wright).
#   group: multiple people × one topic.
#
# Add a show: copy _TEMPLATE.yml → <slug>.yml, fill it in, list it here.
# Roster + consent: ../process/collaborators.yml · Party pipeline: ../process/party-roster.yml. Method: ../process/design-in-public.yml.
#
# Creative inventory (gags, themes, traditions): ideas/ — see ideas/README.md

meta:
  status: proposals
  last_reviewed: 2026-06-25
  standard_shape: "Per episode: (1) explain WHY the design works / brainstorm tradeoffs; (2) optional follow-through — guests need not code (../process/brainstorm-heartbeat.yml); audience/Don/homefun may implement with MOOLLM + Cursor."
  github_native: "Each show's durable artifact is a PUBLIC GitHub repo: participants upload + review beforehand, edit live, viewers file HN-style discussion issues in real time. See ../process/design-in-public.yml github_native."
  brainstorm_heartbeat: ../process/brainstorm-heartbeat.yml

