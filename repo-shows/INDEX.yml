# SOUL CITY HUB — the architecture under every bridge (hub-and-spoke; "fly through Atlanta")
bridges_architecture:
  hub: "Soul City is the HUB that all bridges lead to — a git-checked-in store holding many facets of each character in high-fidelity, round-trippable data."
  spokes: "Each game bridges to/from Soul City (a spoke). 'Proxi <-> Sims' really means Proxi <-> Soul City <-> Sims; any game-to-game path routes THROUGH the hub. Hub-and-spoke — like flying through Atlanta."
  bridge_ui_skins: "Gonzo UI is totally skinnable — one skin pack per spoke so bridge chrome matches the game (Sims-evoking first). Multi-bridge sessions stay visually obvious when moving characters/content between worlds. Kernel stays game-agnostic. See MicropolisCore documentation/designs/GONZO-UI-MANIFEST.md."
  player_layer: "At a higher level, players define syncing workflows, constraints, and transformations between games and the hub (and onward to other games)."
  decoupling: "In principle a game need not know about any other game — only how to round-trip its own facets with Soul City. In practice a game MAY look for specific data it recognizes from a compatible game and special-case importing it."
  phasing:
    - "1. Generic hub/spoke first — every game round-trips cleanly with Soul City."
    - "2. Then shortcut optimizations + mutual schema recognition between compatible games (direct fast paths, special-cased imports)."
  note: "So the bridge seeds below are all spokes on this hub; the ⇔ in each is shorthand for ⇔ Soul City ⇔."
  the_frame: "The deep frame for all of this is biological: ../process/character-endosymbiosis.yml (games as cells, content as organelles in permeable membranes, Soul City as the shared cytoplasm, schema mapping as currency exchange). Life builds complexity by merger — so do we."
  precedent: |
    NOT hypothetical — shipped deep bridges already exist:
    - **Steve Alvey's SimSlice / SliceCity** — SimCity running *inside* The Sims* (community precedent).
      See characters/heather-alvey/ + repo-shows/heather-and-steve-alvey/.
    - **Will Wright's Proxi → Minecraft export** — Proxi characters already exported into Minecraft
      (Gallium; Dev Diaries Dec 2025). See characters/will-wright/sources/2025-12-will-wright-dev-diaries/proxi-minecraft-export.yml
      + game-bridge-proxi-minecraft.yml.
    Will's 1996 Winograd data-portability train-set model is the thesis; these are receipts.
  shallow_vs_deep: "SHALLOW = a cosmetic 'computer in The Sims plays a toy SimCity' (decorative; done before). DEEP = real nested simulations with data flowing between games — link actual SAVE FILES, run EMULATORS, edit save files to round-trip state. Soul City is the deep version, generalized across as many games as possible (cf. game-bridge-mind-mirror.yml's emulated Apple ][ runtime)."

