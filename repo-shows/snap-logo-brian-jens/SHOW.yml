# SHOW — Brian Harvey & Jens Mönig — Snap!, Logo, and the Joy of Computing
# Collegial creative partners — "not married but joined at the heart" (Snap!).
# Interview TOGETHER for the shared work. See process/couple-and-solo-shows.yml

show:
  id: snap-logo-brian-jens
  title: "A Repo Show with Brian Harvey & Jens Mönig — Snap!, Logo, and the Joy of Computing"
  type: group
  host: Don Hopkins
  guests: ["Brian Harvey", "Jens Mönig"]
  character: [characters/brian-harvey/, characters/jens-monig/]
  topic: "Snap! and the Logo→Scheme→Smalltalk lineage — first-class everything, and computing made teachable for everyone"
  status: seed
  consent: not_yet_asked
  joined_at_the_heart: "Colleagues, not a couple — but their shared work (Snap!) is a genuine partnership; interview as a pair for the shared story."

why_them:
  brian: "**Brian Harvey** — UC Berkeley Teaching Professor Emeritus; Berkeley Logo; *Computer Science Logo Style* (3 vols) + *Simply Scheme*; taught SICP-based CS 61A; design + documentation for Snap!."
  jens: "**Jens Mönig** — architect + lead programmer of **Snap!** (formerly BYOB) on his own **Morphic.js**; first-class lists, procedures, and continuations (the Y combinator in blocks) + prototype objects; ex-Scratch; GP under Alan Kay; SAP."
  the_partnership: "Snap! is the shared work: Jens builds it, Brian shapes and documents it. The 2024 ACM Karl V. Karlstrom Outstanding Educator Award to Brian (with Dan Garcia, for BJC) cites Snap! and names Jens as principal developer."
  bjc: "**Beauty and Joy of Computing** — the CSforALL curriculum Snap! powers; 1,000+ teachers trained, Spanish edition, BJC Sparks; Berkeley's BJC course has exceeded 50% (once 70%) female enrollment."
  kay_lineage: "Both sit in Alan Kay's orbit — Jens worked on GP under Kay; the whole lineage runs Logo (Papert) → Smalltalk (Kay) → Scratch → Snap!."
  don_orbit: "Don's 2018 thread with Brian + Jens: wire **Micropolis** (open SimCity) and **CAM6** cellular automata into Snap! blocks — an open, modifiable simulator for the classroom."
  snapcon_2025: |
    Snap!Con 2025 Karlstrom address (https://www.youtube.com/watch?v=pDK2PE_pkqQ) — Jens introduces Brian;
    CCUS/no-grades friendship vs curriculum assessment; Brian's lambda contribution to Snap!; skeptical AI-in-K-12 take.
  pair_not_solo: |
    Default interview is **this pair show** — the shared Snap!/BJC/Logo story told once, together.
    Optional solo verticals remain (Jens on Snap! internals/schemas/actors; Brian on his books) —
    for depth that would dilute or repeat if forced into the pair episode.

episodes:
  - id: pair-kickoff
    what: "Snap! live — build something real in blocks; the Logo→Scheme→Smalltalk→Snap! lineage told by the two people who carried it forward."
  - id: first-class-everything
    what: "Jens on Snap! internals: first-class procedures, lists, continuations (the Y combinator), prototype objects, Morphic.js — how far blocks go without losing beginners."
  - id: the-books-and-teaching
    what: "Brian on *CS Logo Style*, *Simply Scheme*, and teaching CS 61A/SICP — what makes a hard idea teachable."
  - id: bjc-for-everyone
    what: "BJC as CSforALL — the Karlstrom-cited work; reaching kids who were never invited to computing before."
  - id: karlstrom-ccus
    what: "Snap!Con 2025 Karlstrom address — CCUS, no grades, keys to the room, 'my friend' naming; curriculum vs friendship; Jens hosts, Dutch teacher Q&A."
  - id: karlstrom-directors-cut
    what: "The director's cut, delivered whole — Brian gives the 44-minute Karlstrom talk (or longer; no time limit, no editors). Everything ACM's People of ACM interview cut — Chinese food runs, California summers — stays in. Jens introduces again if he likes."
  - id: micropolis-in-snap
    what: "Drive Micropolis + CAM6 cellular automata from Snap! blocks — a city sim and CA rules you reprogram live (from Don's 2018 thread)."
    design: https://github.com/SimHacker/moollm/blob/main/designs/snap/snap-visual-engines-fundable-goals.md
  - id: snap-as-front-end
    what: |
      Snap! as the visual front end for three engines, each one a block palette with the same
      shape: commands that poke the engine, reporters that peek at it, hat blocks on its events.
      Jens on where the extension points are; Brian on what makes each one teachable.
    threads:
      micropolis: |
        The 2018 idea, now buildable. MicropolisCore's `MicropolisReactive` bridge already has
        `poke` (tools, tax, tiles), `peek`, event callbacks and `getSnapshot()` JSON, which map
        onto Snap! commands, reporters and hats. Zone a city from blocks, write a tax policy as a
        script, and open the simulator up as a glass box: kids read and change the rules, not just
        play them. Design: https://github.com/SimHacker/moollm/blob/main/designs/snap/micropolis-svelte-snap-constraint-bridge.md
      cam6: |
        CAM6 rules as blocks. A Toffoli–Margolus rule is a function of a cell's neighbourhood
        that the rule compiler turns into a lookup table. In Snap! that function is a ring (a
        first-class procedure), so "compile this rule" is a higher-order block that maps it over
        every neighbourhood into the table. Forth, then C, then JavaScript, then blocks, and the
        table stays identical, so it can be checked. Norman Margolus would be a natural visitor
        for this beat.
      cabinet: |
        The emulator cabinet (PDP-7 + Type 340, Mitch Bradley's Forth, Heinz Lemke's PIXIE) as
        a Snap! library. Blocks to load a cartridge, step and run, read and write core, type at
        the teletype, and plot what the 340 drew back onto the stage. Turtle graphics run twice:
        Snap!'s turtle and the PDP-7 Forth turtle on the 340, drawing the same square. The
        cabinet's "native CPU" plugin points the other way: a Snap! script can be the CPU,
        driving the 340 and teletype directly through their device blocks with no instruction
        set in between. Source maps carry over as well, so a block can show the listing line,
        the scan and the docs for the instruction the PDP-7 just ran.
      engines_as_cabinets: |
        Cabinet CPUs and devices can wrap existing TypeScript libraries, so the same palette shape
        covers CAM-6, Micropolis, the Turing machine with Minsky's universal machine, the Movable
        Feast Machine (Dave Ackley), and von Neumann's 29-state CA with its universal constructor.
        Each wrapper brings the cabinet's run, step, trace and recording to Snap!.
    cabinet_plan: ../../packages/cabinet/TODO.md
  - id: rings-macros-metaprogramming
    what: "Gray rings as visible quote; split/join/define AST; Lisp-family macros (honest partial scorecard); Palm audience Q&A — Brian pedagogy, Jens ship status."
  - id: morphic-heritage
    what: "Self UI → Ingalls' Lively Kernel → Morphic.js → Snap! — and why MVC got cargo-culted into everything while Morphic never got the love (Palm question id 10)."
  - id: people-to-remember
    what: "Community memorial — who Brian and Jens miss from Logo/blocks/BJC/Snap!Con, and lessons still worth learning (Palm question id 11); the harmonious-disagreement closer."

