relationship: |
  Palm filed Theo the Logo Turtle in his field notebook after Snap!Con — worms transform, birds carry,
  turtles draw and sometimes even embroider. He loves the gray ring as quote: evaluation must not pass 
  through until you choose.
  Warm, curious, not a gotcha — wants Brian and Jens to settle what Snap! actually ships vs what
  the Reference Manual promises for macros.

