    to: [brian-harvey, jens-monig]
    theme: macro-caller-context
    status: open
    priority: 4
    question: |
      The macro that declares script variables in the **caller** — not inside the helper — is the
      example that finally made macros click for me. The Manual admits macros aren't fully wired:
      you pass the calling script explicitly, there's no checkbox yet, users in 2023 couldn't tell
      macro from `call` of a ring. What's the status now — demo-ready, or still Snap!Con homework?
    context_lasers:
      file:
        - ../../../../characters/brian-harvey/sources/snap-macros-metaprogramming.yml
      url:
        - https://forum.snap.berkeley.edu/t/do-macros-actually-work-in-snap/14431
    answer: null
    children:
      - id: 5a
        to: jens-monig
        theme: command-macro-notation
        status: open
        question: |
          Command macros stack like commands but report scripts — syntactic mismatch. Brian said
          maybe don't try too hard in userland until the make-a-block dialog gets a macro checkbox.
          Is that checkbox designed, or still arguing on the forum?
        answer: null

