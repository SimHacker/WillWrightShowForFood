    theme: morphic-heritage-mvc
    status: open
    priority: 4
    question: |
      Jens — walk me through the **heritage of Morphic**: Self's direct-manipulation UI, Dan Ingalls'
      Lively Kernel in the browser, what you're building in Morphic.js today, and how Snap! actually
      uses it under the blocks. Smalltalk's antique **Model–View–Controller** got cargo-culted into
      everything — interactive GUIs, web server frameworks, client-side SPA stacks — until the words
      barely mean anything. Morphic was the live-object answer: morphs all the way down, edit the IDE
      while it runs. Why did MVC win the textbook and job-interview lottery while Morphic never got
      the same love — even from people who claim to admire Smalltalk?
