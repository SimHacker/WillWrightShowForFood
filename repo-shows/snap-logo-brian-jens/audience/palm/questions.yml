questions:
  - id: 1
    to: [brian-harvey, jens-monig]
    theme: ring-as-quote
    status: open
    priority: 1
    question: |
      Brian — you said the gray ring around a procedure is lambda, and I keep thinking it's also
      **quote**: the gap in the ring is where evaluation stops until something explicitly calls through.
      Did you design the ring to be *visible* quote for kids who will never type an apostrophe? And
      Jens — when the ring captures an environment for a macro expansion, is that closure the same
      object as a lambda closure, or a different beast under the hood?
    context_lasers:
      file:
        - ../../../../characters/brian-harvey/sources/snap-macros-metaprogramming.yml
        - https://docs.snap.berkeley.edu/procedures-as-data/
    answer: null
    children:
      - id: 1a
        to: brian-harvey
        theme: invisible-rings
        status: open
        question: |
          Follow-up: Scratch `if` and `forever` already had unevaluated C-slots — invisible rings.
          When you added `Any (unevaluated)` for special forms, were you smuggling macro semantics
          in through the back door so factorial wouldn't infinite-loop?
        answer: null

  - id: 2
    to: [brian-harvey, jens-monig]
    theme: sicp-in-blocks-honest-scorecard
    status: open
    priority: 2
    question: |
      Don posted on Hacker News that everything you can do in Scheme — recursion, HOFs, closures,
      continuations, macros, metaprogramming — lives in Snap! through BJC. I want the honest
      scorecard: what's **fully** there for a kid doing SICP-shaped thinking, what's **partial**
      (macros?), and what would you tell a Racket user *not* to expect yet?
    context_lasers:
      file:
        - ../../../../characters/brian-harvey/sources/snap-macros-metaprogramming.yml
        - ../../../../characters/brian-harvey/sources/simply-scheme.yml
    answer: null
    children:
      - id: 2a
        to: brian-harvey
        theme: hygiene
        status: open
        question: |
          The Manual says hygienic macros are the main Scheme feature Snap! doesn't implement yet.
          You argued on the forum that FEXPR-style might be better for learners anyway — teach
          name-capture, skip the wizardry. Still your position? Would BJC ever need hygiene?
        answer: null

  - id: 3
    to: brian-harvey
    theme: dynamic-binding-controversy
    status: open
    priority: 2
    question: |
      Brian — I hear your most **controversial** opinion is that **dynamic binding** is better for *kids*,
      because you taught Logo for decades and kids grokked caller-visible variables more easily than
      lexical puzzle boxes. You're **for** it on pedagogy grounds, not because you hate abstraction.
      Can you lay out the **arguments for** (Logo MAP and ?, debugging at the REPL, one-off helpers)
      and the **arguments against** (name capture, interchangeable blocks, teams of 500) — and which
      side you still hold after Snap! shipped **lexical** scope anyway?
    context_lasers:
      file:
        - ../../../../characters/brian-harvey/sources/snap-macros-metaprogramming.yml
        - ../../../../characters/brian-harvey/sources/computer-science-logo-style.yml
      url:
        - https://forum.snap.berkeley.edu/t/hygienic-macros/3258
    answer: null
    children:
      - id: 3a
        to: [brian-harvey, jens-monig]
        theme: snap-scope-reality
        status: open
        question: |
          So what does Snap! **actually** have — lexical only? Globals and script variables and
          sprite-local as special cases? Special forms and invisible rings? Something like fluid-let?
          Or one underlying atomic primitive (Don frames `self` as RISC for OOP) — rings
          plus environment, `of` for context switch, debugging hooks — vs a Rube Goldberg of scope rules?
          What are the minimal visual metaprogramming primitives and visual representations that you
          can build all the others out of?
        answer: null
      - id: 3b
        to: jens-monig
        theme: why-not-dynamic
        status: open
        question: |
          Jens — you told Brian dynamic scope is horror for interchangeable blocks and costs interpreter
          speed. What did you ship instead when kids need caller variables — gray rings, hyperblocks,
          extra inputs, globals? And did any of Brian's hybrid-scope or DYNAMIC VARIABLES ideas leave
          fingerprints in the debugger?
        answer: null
      - id: 3c
        to: brian-harvey
        theme: macros-as-dynamic-analogue
        status: open
        question: |
          You used dynamic scope as a metaphor for FEXPR macros and lexical scope for hygienic macros.
          If Snap! never gets dynamic binding, do gray rings + caller-context macros **subsume** what
          you wanted from Logo's dynamic scope — or is something still missing that only dynamic lookup
          would fix?
        answer: null

