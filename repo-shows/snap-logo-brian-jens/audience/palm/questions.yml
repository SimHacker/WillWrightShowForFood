  - id: 12
    to: brian-harvey
    theme: no-grades-friendship-buber
    status: open
    priority: 8
    question: |
      Brian — the beat I most want the full version of: **no grades**. At Lincoln-Sudbury you
      negotiated no grades for the computer center, and you've said that's what made friendship
      possible — with grades you're a hurdle, not a friend. Don remembers you telling a story
      about your **seventh-grade algebra teacher** — someone who, by your own telling, didn't
      teach you much algebra, but became a **friend**, and that mattered more. Tell that story
      here, whole. Then make the strong claim explicit: grading doesn't just stress kids out —
      it **spoils the relationship** between teacher and student. If a teacher's real purpose
      is holistic — building a relationship, showing ways to lead lives together, not just
      transmitting content — what does that mean concretely for how we should run classrooms,
      and what did CCUS prove that schools still refuse to hear?
