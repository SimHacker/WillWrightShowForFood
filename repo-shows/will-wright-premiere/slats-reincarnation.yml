  - ../../bits/theme-the-riff-loop/theme-the-riff-loop.md
  - ../PATTER.yml#slats_call_in_menu
  - ../../../../characters/don-hopkins/stupid-fun-club/STORY.yml
  - ../../process/apple2-emulator-stack.yml
  - ../../process/manual-transmission.yml
  - ../../process/brain-stream.yml
  - ../../process/micropolis-ai-drag-race.yml
