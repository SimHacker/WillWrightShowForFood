# SHOW SEED — Ian Bogost: procedural rhetoric from Motive.c to the Wedding Playset
# Bogost coined the term; Don's Sims objects are case studies in both registers.

show:
  id: ian-bogost-procedural-rhetoric
  title: "Procedural Rhetoric — Motive.c, SimProv Wedding Playset, and the Dumbold"
  type: solo
  host: Don Hopkins
  guests: ["Ian Bogost"]
  topic: |
    Procedural rhetoric in The Sims lineage: Will Wright's 1997 Motive.c (failure modes as design),
    the SimProv Wedding Playset (inclusion agitprop — who gets recognized in front of family),
    and the Dumbold Voting Machine (2004 institutional farce). Same SimAntics/dialog engine;
    opposite poles. Soul City as platform for more.
  status: seed
  consent: not_yet_asked

artifacts:
  motive_c:
    path: ../../../characters/will-wright/sources/2008-02-10-soul-of-the-sims/Motive.c
    hook: "Starvation, mandatory bath, wet bed — argument in alert strings and curves"
  wedding_playset:
    path: ../../../catalogs/simprov/
    hook: "Built when marriage equality was contested; republishing for Steam Sims 1 families"
  dumbold:
    path: ../../../characters/will-wright/sources/2018-04-24-dumbold-voting-machine/medium-article.md
    hook: "Dated e-voting satire — preserve honestly, don't repurpose as election denial"

discussion_prompts:
  - "Is the wedding playset quintessential intentional inclusion procedural rhetoric — and is that a useful category next to Persuasive Games?"
  - "How does procedural satire (Dumbold) age vs. procedural inclusion (playset) when republished 20+ years later?"
  - "Motive.c global variables vs. shipping Sims — does the *prototype* rhetoric differ from the *product* rhetoric?"
  - "Federation publishing (Soul City) — procedural rhetoric as infrastructure, not one object at a time"
  - "Deconstruct Curiosity (2012) without resurrecting it — Cow Clicker (2010) already argued on purpose; Molyneux argued by accident"
  - "Chip Morningstar's engineer deconstruction vs. procedural rhetoric — same immune system, different vocabulary?"
  - "Captain Ashford's homage essay How to Incarnate Almost Anything — invite a live read of How to Deconstruct the Cube"

curiosity_deconstruction:
  spec: ../../ideas/gags/how-to-deconstruct-the-cube.yml
  cube_parody: ../../ideas/gags/curiosity-cow-cube.yml
  invite_framing: |
    Optional segment for Bogost: **Morningstar (1993) → Ashford (MOOLLM homage) → Bogost (procedural rhetoric) → Don (cow inside the box).**
    Not a Curiosity revival — a postmortem. Distressed moos, MOOLA clicks, center is cow or Berkeley horse.
  morningstar: "http://www.fudco.com/chip/deconstr.html"
  ashford:
    persona: "Captain Kira Ashford — Belter space pirate, Expanse aesthetic — MOOLLM adventure-4"
    homage: "How to Incarnate Almost Anything — designs/postmodern-deconstruction.md"
    reincarnate: "Wear captain-ashford.yml from adventure-4 coatroom; or read from pub Palm Nook study"

