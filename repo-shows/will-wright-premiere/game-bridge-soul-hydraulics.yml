# Game bridge — soul hydraulics: add and drain souls on any save file
# Public creative concept. Sibling of game-bridge-sims-spore.yml and
# game-bridge-soul-city-procreation.yml. Don's spec, 2026-07-06.

meta:
  id: game-bridge-soul-hydraulics
  type: bridge
  status: seed
  one_line: "Souls as a conserved fluid between games: measure how many, drain them all, squirt them into another game."
  two_gates: "Population crosses as fluid (hydraulics); named characters cross as roles (the role gate)."

the_primitive:  # the whole API — three verbs on a save file
  measure: "How many souls are in this save?"
  drain: "Pump souls OUT — population leaves the save, counted and carried."
  squirt: "Pump souls IN — the save is edited so the city can hold and employ them."
  conservation: |
    Souls are conserved across the pipe. Nothing is created or destroyed at the
    bridge — just moved. That single constraint is what makes it feel like plumbing
    real people instead of editing numbers.
  implementation: |
    Super easy hack, in the best sense. An LLM could do it directly on the save
    files (Postel-style: read messily, write cleanly) — but we make a deterministic
    script to do it (or try) on ANY save file. LLM for exploration and odd formats,
    script for repeatability. The script is the sister-script of the LLM session
    that figured the format out.

the_squirt_mechanic:  # Don's SimCity/Micropolis spec — the key restraint
  scenario: |
    Take a low-developed SimCity save file. Import 60,000 dead souls from an
    Afterlife save file. The script edits the city to have enough residential
    skyscrapers and enough developed commercial and industrial zones for them all
    to live AND work.
  restraint: |
    It does NOT create zones. It only fake-simulates EXISTING zones up (and down) in
    population and growth — the same tile-evolution the simulator itself performs,
    applied instantly. The player's city plan is sacred; the bridge respects zoning
    the way weather respects geography. If the city hasn't zoned enough land for the
    incoming souls, that's a real constraint — souls wait at the Station.
  drain_symmetry: "Draining runs the same edit downward: zones devolve toward empty as their population departs for another world."

bridges:

  lucasarts_afterlife:
    game: "Afterlife (LucasArts, 1996)"
    why_important: |
      THE afterlife city-builder — its population units literally ARE souls, its
      map IS heaven and hell as urban planning. A natural sibling of Soul City and
      an important game to bridge: the joke and the architecture were already
      aligned in 1996. And it's abandonware territory — its save files are full of
      stranded souls nobody can visit anymore.
    rallying_cry: "Repossessing lost souls!"
    demo: "Drain 60,000 dead souls from an Afterlife save; squirt them into a sleepy Micropolis town; watch the skyline jump. Resurrection as re-zoning."

  they_are_billions:
    game: "They Are Billions (Numantian Games, 2017)"
    what: |
      The zombie-swarm survival RTS. Every zombie in the horde was a person.
      DEZOMBIFY them — the bridge is the cure — and export them to live in
      high-rise apartments in SimCity. The horde becomes housing demand.
    why_it_sings: |
      Perfect inversion: the game about 60,000 bodies coming AT your walls becomes
      60,000 residents moving INTO your towers. Same crowd, opposite valence.
      Salvation at scale, measured in occupancy rates.

the_role_gate:  # Don's ruling, 2026-07-07 — how NAMED characters cross into SimCity
  insight: |
    SimCity does not directly represent citizens. Population is statistical — a
    hydraulic quantity, not a crowd of individuals. So the bridge into SimCity has
    TWO gates: souls move by the thousand as population (hydraulics, above), but a
    NAMED character crosses as a ROLE — Mayor, Adviser, City Planner, Police Chief,
    the voice that signs the budget instead of a face in the skyline.
  the_press_gallery: |
    The city hall roles aren't the only door. SimCity 2000's newspaper is a whole
    masthead of importable roles: the JOURNALIST filing city-desk stories about your
    zoning decisions, the ADVICE COLUMNIST answering troubled Sims by mail, and the
    LETTERS TO THE EDITOR page — where any imported character can cross as a byline
    and a grievance instead of a body. A Sim doesn't need an apartment to live in
    your city; a weekly column will do. Letters are the cheapest visa the bridge
    issues: one voice, one complaint, printed and archived in the save.
    The dream behind the masthead — kids publishing their own paper into the game,
    grown from the SimCityNet scrolling chat window — is planted at
    ../ideas/kids-city-newspaper.yml.
  the_civic_ladder: |
    Between the mayor's office and the letters page runs the whole ladder of
    citizen participation, every rung an importable role at its own scope:
    CITY COUNCIL members voting district by district, elected REPRESENTATIVES
    carrying a neighborhood's grievances uptown, the SCHOOL BOARD fighting over
    one building's budget, planning commissions, zoning boards of appeal,
    neighborhood associations, the PTA, the poll workers. Real cities govern at
    many dimensions and scopes at once — geographic (block, district, city),
    institutional (schools, transit, parks), and temporal (a term, a hearing,
    one angry public comment). The bridge honors all of them: a character can
    cross as big as a mayor or as small as three minutes at the microphone
    during the open comment period. Scope is the price of the visa; every scope
    is a seat.
  import: |
    A Sim stepping into SimCity doesn't become one of 60,000 residents; she takes
    office. Her name goes on the city, her personality colors the advice stream,
    her signature on the ordinances. The city becomes her biography for a term.
  export: |
    And the roles can step OUT: the Mayor, the nagging Advisor, the Planner leave
    SimCity as full characters — move them into The Sims and they need a house, a
    salary, a bathroom, and suddenly forty years of 'Mayor, the citizens demand a
    stadium' has a face that has to sleep.
  precedent: |
    SimCity's own fiction already does this — the mayor and the advisors are the
    only 'people' the game names. The role gate just makes that personification
    portable. Cast exemplar: audience/fictional-simcity-advisor/ (the pop-up you
    clicked away, now demanding a moment of YOUR time).
  conservation_note: "Roles obey conservation too: one Mayor per city. Import a new one and the old one has to go somewhere."

soul_city_tie: |
  Hydraulics is the freight layer under Soul City: Depot moves the soul-files,
  Station bridges the games, and measure/drain/squirt is what actually happens to
  a save when a crowd of souls passes through. The procreation bridge moves souls
  one at a time with names and genetics; hydraulics moves them by the thousand as
  population. Both obey conservation.

