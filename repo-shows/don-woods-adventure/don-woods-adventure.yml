# SHOW SEED — Don Woods: the founding repo of interactive fiction
# Seed. Adventure walked by its co-author; the original Repo Show.

show:
  id: don-woods-adventure
  title: "The Last Lousy Point — walking Adventure with Don Woods"
  type: solo
  host: Don Hopkins
  guests: ["Don Woods"]
  topic: "The Crowther/Woods 350-point Adventure (1977) walked from source by its co-author: the crowther@-every-ARPANET-host permission story, the pirate, the endgame, the last lousy point — plus INTERCAL's PLEASE and NeWS/TNT war stories with a former Sun colleague."
  status: seed

why_this_guest:
  - "Adventure is the founding repo of an entire genre — no repository is more load-bearing to walk on air."
  - "Knuth recast the game in CWEB; advent.w carries the copyright 'Don Woods and Don Knuth' — annotated literature ready to read from."
  - "The crowther@ story is the best provenance-and-permission origin story in software, told firsthand."
  - "Firsthand rapport: Woods and Don Hopkins worked together at Sun on The NeWS Toolkit — the two-Dons PostScript episode is pre-built."
  - "INTERCAL's calibrated PLEASE censor plugs into the show's Minsky Memo 603 executable-humor thread."

format:
  live: true
  audience_qa: true
  notes: "Open by mailing the MOOLLM Spelunker Today matchbook and presenting the One Lousy Point Donald Woods Stamp. Boot the 1977 original on an emulated PDP-10 (Lars Brinkhoff assist); close with Woods scoring the episode's final point."

ensemble_option:
  with: characters/lars-brinkhoff/
  arc: "Crowther's cave (1976) → Woods's 350-point canon (1977) → Zork and Infocom → Knuth's advent.w (1998) → the cave running live on preserved iron."

dream_ensemble:
  with: characters/donald-knuth/
  title: "The Literate Adventure Code Reading — the three Dons"
  arc: "Woods + Knuth walk advent.w together, author beside annotator — the copyright line ('Don Woods and Don Knuth') made flesh. Woods narrates what the 1977 FORTRAN did; Knuth narrates why each section reads the way it reads; Don Hopkins hosts. Vocabulary → travel table → dwarves → the last lousy point."
  encore: "The border crossing: after the literate Adventure, walk next door into the Zork MDL — a neighboring realm in the same cave country, visited while the adventure party is still assembled. (GIVE TROLL TO TROLL is Zork, not Adventure — the crossing is the point.) Don called the MDL source 'practically a form of literature' on the Wikipedia Zork talk page back in 2013 — which is literally Knuth's advent.w thesis, stated fifteen years early about Adventure's own descendant. Read the troll clause from act1.mud aloud: GIVE AXE TO TROLL (he eats his own axe, cowers), then GIVE TROLL TO TROLL (POOF — self-devouring via transitive containment), then the bug — TROLL-FLAG!-FLAG never cleared, so an empty room still 'fends you off with a menacing gesture.' Don's own story: hypothesis from black-box play on MIT-DM, confirmed in the source decades later. This puts the HOST in the reading — all three Dons close-read code they each have history with. Woods gets right of reply: Zork was MIT's answer to HIS cave. Source: characters/don-hopkins/sources/zork-troll-flag-adventure-lineage-hn.md · https://github.com/itafroma/zork-mdl"
  encore_beat_npc_menagerie: "Comparative troll zoology and the NPC bestiary — ask the Dons. Woods's troll (1977) is a toll-taking economist: burly, by the bridge, insists you throw him a treasure to cross; the bear scares him off, and the bridge buckles under you-plus-bear on the way back. MIT's troll (same year) is an omnivorous fighter who eats anything given, including himself. Two labs, one archetype, opposite failure modes. Then the wider bestiary: Adventure's pirate ('Shiver me timbers, matey!') stashes your loot in the maze — Zork's thief refines him into a gentleman with a stiletto who can OPEN the jeweled egg for you (giving your treasure to the villain as puzzle solution — the same move as GIVE AXE TO TROLL). Adventure's little bird drives off the snake but fears the rod; Zork answers with the clockwork canary and the songbird's brass bauble. Adventure kills you in the dark with a pit; Lebling invents the grue to explain WHY the dark kills. Axe-throwing dwarves vs the cyclops who flees at 'ODYSSEUS' through a wall. And the ROBOT (source-verified from dung.mud): flags OVISON+VICBIT+SACREDBIT+ACTORBIT — NOT a vehicle (the actual VEHBIT vehicles are barrel, balloon basket, inflatable boat, bucket). It's your remote avatar: obeys WALK/TAKE/DROP/PUT/JUMP/PUSH/THROW/TURN, survives the high-voltage buttons that electrocute you, lifts the gas-trap cage off you. Its parser synonyms: R2D2, C3PO, ROBBY. 'Trained at MIT Tech to perform various simple tasks.' The do-cool-stuff-you-normally-couldn't memories are GDT: move any object INCLUDING YOURSELF to any room — teleport into the robot-only death rooms, march the robot anywhere. Supnik's in-game debugger as the original noclip."
  channel: "Woods first: he saw Knuth at a SAIL reunion ~2025 ('getting frail but is still plenty sharp'). If Woods accepts his solo show, ask him whether a joint reading would delight Knuth — then the paper letter (repo-shows/donald-knuth/, snail mail only) goes out with his vouch."
  status: dream

pair_option:
  with: repo-shows/woods-and-adams-adventurers/woods-and-adams-adventurers.yml
  arc: "The two Adventurers — Woods + Scott Adams: the free mainframe cave meets the first adventure ever sold."

