slice_city_precedent:
  # Steve Alvey already SHIPPED the deep version of Will Wright's dream — credit it loudly.
  claim: "**SimSlice / SliceCity** is the existing proof: years ago Steve Alvey built a **beautiful, fully functional, genuinely entertaining** implementation of **Will Wright's long-aspired data-portability / games-nested-in-games idea** (which Will articulated in his 1996 Winograd 'Interfacing to Microworlds' talk) — a **Lilliputian SimCity that fits in your Sims back yard**: a tiny but real, deeply-integrated city, not a cosmetic prop."
  shallow_vs_deep:
    shallow: "A computer object in The Sims that 'plays' a toy SimCity/Sims — surface-level, decorative (it's been done)."
    deep: "What SliceCity did and what Soul City proposes: real simulations nested and **data flowing between games** — link **actual save files**, run **game emulators**, and **edit save files** to round-trip characters/state."
  ambition: "Generalize beyond SimCity ⇔ The Sims to **as many games as possible** — the Soul City hub-and-spoke (see ../repo-shows/INDEX.yml bridges-architecture; game-bridge-*.yml, incl. the Mind Mirror emulated-runtime bridge)."
  on_show: "Have Steve walk through how SliceCity actually nests the sim; then design live how to widen it to save-file + emulator bridges across the catalog."

brain_flurry_defense:
  # From the 2026-08-20 chat jam — sources/2026-08-20-brain-flurries-and-the-hierarchy-of-bleeds.md
  concept: "Mod the McFlurry to advertise **Brain Flurries** zombies can't resist — laxative payload, they get the shits and run away"
  mechanism: "Tower defense by advertisement — the Sims ad auction does the targeting; zombie brain-hunger re-weights the Brain Flurry ad sky-high and the zombie walks itself into the trap"
  deployment: "Station several stands around the encampment perimeter — no bullets fired"
  byproduct: "A hell of a lot of shit all over the place — which fertilizes the garden. Siege → sewage → soil → supper: every repelled invasion feeds next season's harvest"
  feeds_into: "hierarchy_of_bleeds — the brown flood is this defense's own effluent, piped into the fluid CA"

hierarchy_of_bleeds:
  # Maslow for fluids — https://en.wikipedia.org/wiki/Maslow%27s_hierarchy_of_needs
  ask_steve: "Did you clone the blue flood into a red blood flood? Or chum flood with lots of niblets? 😉"
  precedent: "SimSlice's blue flood is already a tile-spreading machine — the pyramid is a palette-and-rules mod away"
  escalation_rules:
    - "Chum flows into and replaces blood"
    - "Blood and chum flow into and replace water"
    - "Once you're blood you're no longer water; once you're chum you're no longer blood"
  total_order: "water < blood < chum — one-way escalation; fluids self-actualize upward and never come back down"
  brown: "Diarrhea floods fit the hierarchy AND the cellular automata — and close the Brain Flurry loop as its byproduct"
  yellow: "Pee — does it pool or not? Vanilla Sims pee is a static puddle; if a puddle is just a flood with spread radius zero, pee joins as the humble ground floor — the physiological base of the pyramid"
  moveable_feces: "Like a moveable feast — random combination rules when two fluids meet; roll on a combination table, let the rules mutate mid-flood, Fluxx-style (../fluxx-rules-change-as-you-play/)"
  z_buffers: "Floods stack into layers — not raised, OVERLAPPING co-located strata per tile, composited by z-buffer in disgusting patterns. Painter's algorithm for filth; Porter–Duff for bodily fluids: chum-over-blood-over-water, marbled"
  attachment_points: "Each layer gets 'same height' and 'above' slots to layer objects on, like plates stack — a flood layer with slots is just an object that happens to be a liquid: raft in water's same-height slot, corpse in blood's, McFlurry stand riding 'above' the whole parfait"
  source: sources/2026-08-20-brain-flurries-and-the-hierarchy-of-bleeds.md

interview_heather:
  segment: "Zombie provenance — artisanal vs industrial"
  ask: |
    Where do you source your zombies? Are they artisanal? Farm-grown? Soil to spike?
  why_on_air: |
    Sets up the Afterlife bridge punchline — SimFreaks as craft UCC vs hell save as bulk supplier.
    Audience learns how Heather + Steve actually build undead (IFF, SimAntics, skins) before we
    pipe damned souls in by religion batch.
  follow_ups:
    - "Hand-sculpted vs kitbashed vs procedurally spawned — what's in the SimFreaks pipeline?"
    - "If hell debits 10,000 Lutheran damned souls — do you skin them one suite or mix denominations?"
    - "Steve: does SliceCity become the zombie farm, or the siege map when the horde arrives?"
  bridge_reveal: "Afterlife save = industrial zombie supply chain; SimFreaks = the artisan label on the jar"

interview_steve:
  segment: "SliceCity under siege"
  ask: "When the wave hits — is SliceCity the farm or the fortress?"

segments:
  order: [interview_heather, fresh_shipment, live_play, catalog_integration]

  fresh_shipment:
    beat: "Interview → play handoff"
    don_line: "We're just getting in a fresh shipment from Afterlife now — let's go and play!"
    on_screen: |
      Truck/backing-beep gag optional. Show Afterlife hell save on one monitor; soul ledger by
      religion on another. Batch just arrived — still warm from the damned.
    live_steps:
      - "Open Afterlife save — read hell population by denomination"
      - "Debit first shipment (audience picks batch size — start small, TAB scale later)"
      - "Map debited souls → SimFreaks/SimSlice zombie skins (afterlife-religion-zombie-map.yml)"
      - "Spawn wave into Sims lot / SliceCity — Heather + Steve drive, Don runs the pipe"
      - "PITM stamp — round-trip ledger visible in repo"
    tone: "Homefun not homework — play first, explain the schema while zombies shamble"

  live_play:
    beat: "Drain hell wave by wave until Pleasantville falls or hell empties"
    escalation: "Each wave = next save debit; They Are Billions energy if audience cranks the slider"

implements: "Fresh shipment → read hell save → subtract soul batch → ZombieSims wave with SimFreaks skins → play live → catalog integration path."

