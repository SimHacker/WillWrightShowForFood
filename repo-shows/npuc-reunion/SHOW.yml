what_was_npuc: |
  Ted Selker's **New Paradigms for Using Computers** workshop at IBM Almaden Research
  (USER lab). Small, opinionated, forward-looking — speakers who argued for interfaces
  and interaction models the industry had not shipped yet. Don spoke on self-revealing
  gesture interfaces (1993); demoed **Multiplayer SimCity** at a later NPUC; Ted Nelson
  gave the legendary 1996 talk (transcript on archive.org). Ted Selker says he holds
  **transcriptions, videos, and audios of seven years** of heroes speaking about the future.

reincarnation: |
  The product is not a podcast — it is a **living GitHub repo**: digitized tapes,
  reformatted transcripts, linked character directories, and runnable code spun out of
  whatever the reunion remembers. MOOLLM microworld rooms as the spiritual successor to
  "personal information managers" — but with simulation, characters, and forkable state.

traditions:
  virtual_ibm_burgers: |
    NPUC famously served **free IBM Burgers** (Ted Selker's memory). On air: order
    delivery to wherever each guest is Zooming from; document the ritual in the repo.
  multiplayer_simcity: |
    Don's NPUC demo thread — cooperative city simulation UI; tie to
    characters/will-wright/sources/multiplayer-simcity-ui-network/.
  ted_nelson_1996: |
    Resurrect the NPUC '96 Ted Nelson × Netscape tension; reformat transcript;
    clip into unnatural-selection panel if Nelson joins.

