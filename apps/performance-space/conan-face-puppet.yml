# Conan face-puppet — browser OBS overlay (P0 web toy)
# Homage: still photo with mouth cut out; webcam mouth shows through.

meta:
  id: conan-face-puppet
  status: spec
  type: [web_toy, obs_browser_source]
  design: ../../process/performance-space.yml#performance-modes.face_puppet

what: |
  Single-page web app: load a face PNG (with alpha mouth hole), capture webcam, composite
  performer's mouth in the hole, mirror for performer comfort. Transparent background for OBS
  Browser Source at 1920×1080.

  **Squares in a Box** extends this: per-panel idle (full portrait) vs active (fade-open hole);
  one compositor, many cells, driver mouth mapped with scale/stretch/rotate. See squares-in-a-box.yml.

states:
  idle: full_portrait_no_hole
  active: mouth_hole_fade_open + webcam_mouth_mapped
  transition: crossfade_ms

obs:
  url_pattern: "/performance/conan-face?face=bob-newbie.png"
  background: transparent
  recommended_size: "1920x1080"
  websocket_cues: "Optional — stream-gateway switches face preset via obs-websocket"

ui:
  controls:
    - face_picker  # bundled game-character faces + upload
    - mouth_hole_adjust  # drag corners if PNG isn't pre-cut
    - mirror_toggle
    - scale_and_position
  bundled_faces:
    note: "Affectionate fan portrayals — clearly labeled; no EA logos."
    examples: [bob-newbie, bella-goth, sad-clown, slats, don-philahue]
  button_board: ../character-button-board.yml
  squares_in_a_box: ../squares-in-a-box.yml
  faceball_construction_set: ../faceball-construction-set.yml

tech:
  stack: "TypeScript + WebGPU in browser — see faceball-construction-set.yml#render-pipeline"
  v0:
    - getUserMedia → Canvas2D composite (bring-up)
    - per-face preset yaml; button jump swaps mappings + grade
  v1:
    - WebGPU mouth warp + grade shaders
    - operator mouth ROI normalize → map to selected puppet hole
    - genre profiles (Betty Boop monochrome, horror host, VC look)
  v2:
    - googly eyes + particle GPU passes
    - amplitude meter export for amplitude-scrub-puppet

ethics:
  - "Default faces = game characters from show pantheon."
  - "Celebrity photos = performer-supplied; living people need consent for broadcast."
  - "Label as homage to late-night face-cutout tradition."

see_also:
  - ../../process/performance-space/README.md
  - ../../repo-shows/will-wright-premiere/performance-and-culture.yml#puppet-kinds.face_puppet
  - ../stream-gateway/overlay-viewer.yml
