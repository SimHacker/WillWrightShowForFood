    status: harvested

  - id: magnetic-playback-jam
    from: design jam, Don Hopkins, 2026-08-17
    into: city-record.md
    extract:
      - magnetic inertial playback — play head owns its clock; grooves attract, never drag; stoplight discontinuities are why
      - jump-in semantics — resume at location or play from start; position picks song, listener owns clock
      - roundabout dynamics via Infinite Jukebox self-similar loop points; own open beat analysis (Spotify killed the API)
      - genre-tagged rides — Vondelpark techno / handbag house filters
      - turn means switch — pick unheard-recently song from new path's grooves
      - stop means scan — AR pie menu, body as compass, "you ARE the radio dial", music radar by density bearing
      - MediaGraph question resolved — songs as nodes AND arcs; full OSM vocabulary (POIs, ways, addresses, areas)
    status: harvested

  - id: bike-computer-product
    from: design jam, Don Hopkins, 2026-09-18
    into: [bike-computer.md, sources/cloudmade-2009-stack.md]
    extract:
      - the shippable product is a bike computer that is a web page — live map, metrics, voice, offline, ride is a file
      - incumbent's bug list is the spec — Flow's paywalled map, streamed-not-stored tiles, broken GPX import, malformed FIT, closed to third-party head units
      - PND lesson — Google Maps on the phone you already own beat dedicated low-margin satnav hardware; same shape, and TomTom survived by becoming the map underneath
      - CloudMade 2009 was one generation before Mapbox existed; the vendor evaporated with 30 days' notice
      - offline-first collides with commercial tile terms — default to self-hosted OSM in PMTiles, keep the style as a file we hold
    status: harvested

  - id: bosch-flow-ui-critique
    from: Don Hopkins — to be recorded BY VOICE, deferred deliberately
    into: bike-computer.md
    priority: high
    extract:
      - "specific Flow UI violations, rule by rule, from the person who has ridden with it daily"
    note: |
      Don: "There are SO MANY THINGS I hate about its user interface, it violates every rule in
      the book. I can do SO MUCH better." Deferred by his decision — "I will have to do that by
      voice since there's just so much to say."
      Only the structural failures are written down so far (paywall, no local map, lag, broken
      GPX import, rejected FIT, closed to third parties), all from Bosch's own docs and rider
      reports. The hands-on critique is the substance and it is UNHARVESTED.
      Do not invent it. Transcribe it.
    status: pending

  - id: hn-tomtom-record
    from: 38 DonHopkins HN comments mentioning TomTom, 2014-2026
    into: [sources/tomtom-hn-record.md, bumps-as-input.md, map-distribution.md, privacy.md, virtual-ride.md]
    extract:
      - "'an interactive user interface could cost people their lives' (2015) — the bump-dialog argument, ten years early, via Magic Ink"
      - BitTorrent map distribution — Pieter Geelen's idea, €1M/yr projected, separate process over HTTP, shared service, CDN floor, consent panel, killed when Akamai cut prices
      - trace anonymisation — no identity, trip ends clipped, per-road speed by hour x weekday/weekend, returned as better routing
      - the shortcut side effect — aggregate routing sends truck convoys onto quiet roads; publishing the smooth route moves traffic onto it
      - Enhanced Positioning Technology — IMU dead reckoning where GPS fails, graph-constrained because tunnels do not branch
      - Shneiderman dynamic queries -> SimCity Frob-O-Matic; 100 queries/sec, no syntax errors; the planning interface
      - PND collapse economics — Tele Atlas bidding war, Garmin head-fake, debt into recession, free nav on phones people already owned
      - browsers on devices twice — XULRunner for TomTom Home, WebKit on the embedded units; the platform-bet scar
    status: harvested

