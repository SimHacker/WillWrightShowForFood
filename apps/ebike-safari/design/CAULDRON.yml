    from: design jam, Don Hopkins, 2026-09-18
    into: [camera.md, privacy.md, skeleton/gesture-engine.md]
    extract:
      - "this is a digital photography app — the phone as camera showing the environment is a HUGE part"
      - distance-sampled capture, retroactive marking, bump-triggered downward frames, wait-point aiming
      - resolves the privacy.md 'we do not run a camera' line — local capture yes, public photo host no
    status: harvested

  - id: every-screen-virtual-ride
    from: design jam, Don Hopkins, 2026-09-18
    into: [virtual-ride.md, bike-computer.md]
    extract:
      - "not a niche device — EVERYTHING. Desktop browser is a first-class client, not a dev tool"
      - HN link -> desktop -> load the city you love -> drag a bike to your house -> ride, all features work
      - WASD first-person, drag-and-drop placement, turtle graphics, simulated on-screen controls, time compression, hyperjumps
      - virtual touring is pleasurable, educational, enriching in its own right; massively single-player online
      - one point stream with a source tag (gps / replay / sim); two code paths is the failure mode
    status: harvested

  - id: local-first-is-about-private-data
    from: Don Hopkins, 2026-09-18
    into: [privacy.md, bike-computer.md, map-distribution.md]
    extract:
      - "offline-first is a policy about YOUR PRIVATE DATA, more importantly than the tiles"
      - phones have fast practically unlimited data — cached tiles are convenience, not foundation
      - the real issue is consent and anonymisation for ride GPS; hide home, work, destinations
      - TomTom's method is the model — clip the ends, drop identity, aggregate the middle into coarse bins
    status: harvested

  - id: ride-into-it-and-say-pothole
    from: Don Hopkins, 2026-09-18
    into: [bumps-as-input.md, skeleton/gesture-engine.md]
    extract:
      - "you can literally measure and report a pothole by purposefully riding into it and saying 'pothole'"
      - the impulse supplies severity, the spoken word supplies the class — hands stay on the bars
      - deliberate hits are labelled training data and civic reports, never prevalence statistics
      - the vocabulary needs `nice` as much as `pothole`, or the corpus only describes misery
      - Signalen is where a Dutch report actually goes, and its open data closes the loop backwards
    status: harvested

  - id: three-axes-and-leidsestraat
    from: Don Hopkins, 2026-09-18
    into: [bumps-as-input.md, skeleton/gesture-engine.md, transgression.md]
    extract:
      - braking, acceleration, turning, swerving — the vertical axis is the least social one
      - hard braking is the near-miss channel; crashes leave reports, near-misses leave decelerations
      - launches not meters are the true cost of a route to a cyclist
      - "Leidsestraat: cobbles, rails underfoot, ambling tourists, trams, bikes, police, dismount and walk"
      - gait is the least ambiguous statement in the corpus — the rider gave up and walked
      - enforcement encounters stay private; aggregate to street and month, never coordinate and hour
    status: harvested

  - id: holes-from-dodges-and-puddle-drainage
    from: Don Hopkins, 2026-09-18
    into: [bumps-as-input.md]
    extract:
      - recognise holes from riders bumping into them AND riders swerving around them
      - the space nobody rides through is the obstacle's footprint — shape from negative space
      - hits with no dodges means nobody sees it; danger is severity times invisibility
      - "'puddle swerves tell where water pools' — drainage failure, unreported because it is nobody's emergency"
      - standing water is how a crack becomes a hole, so the autumn puddle map forecasts spring potholes
      - the same low points ice first — puddle layer is the black-ice layer
      - measure the hole dry, measure the puddle wet; weather must be attached to every event
    status: harvested

  - id: mechanical-turk-on-an-ebike
    from: Don Hopkins, 2026-09-18
    into: [mechanical-turk-ebike.md, skeleton/gesture-engine.md]
    extract:
      - "'a worklist a human reviews and enters' => like the mobile OSM editing maps"
      - "a tool for humans executing verification worklists, as a game, with social currency as credit"
      - "'mechanical turk on an ebike' — the name indicts itself, which is why it is right"
      - our tasks come from measurements, not from gaps in the map, so each one arrives with a suspicion
      - "'was this repaired?' is a question only we can ask, because we measured before and after"
      - StreetComplete's achievements unlock links to other projects — the prize is a door, not a number
      - MapRoulette is the integration path; do not build another editor
      - pay the null result, pay corroboration over first report, grow the bounty with neglect
      - the refusal list is the whole point — never route for throughput, never blur play with paid wages
    status: harvested

  - id: blocked-bike-lanes-as-a-plugin
    from: Don Hopkins, 2026-09-18
    into: [map-game-platform.md, sources/blocked-bike-lanes-record.md, mechanical-turk-ebike.md]
    extract:
      - "overlaps the app somebody posted to HN about cars blocking bike lanes in SF — worse than potholes"
      - "should be easily doable as a plug-in layer — THAT is why we need a platform other people can build on top of"
      - identified as Safe Lanes (Stephen Braitsch, 2019) and its successor Bike Bureau
      - 9477 volunteer reports in nine months matched SFMTA's entire citation output over the same period
      - enforcement geography does not match problem geography; the fix is loading zones, not tickets
      - SFMTA's TOLE already auto-cites from transit-vehicle cameras — precedent exists, never aimed at bike lanes
      - a blocked lane leaves a forced-merge signature, so it is measurable with no camera and no plate
      - aggregated by hour the obstruction has a schedule, and a schedule argues with a curb
      - platform boundary — a layer gets the frame, never the plate; identities never enter the shared store
      - one new primitive only, the report sink; everything else already exists for other reasons
    status: harvested

  - id: feng-shui-measurement
    from: Don Hopkins, 2026-09-18
    into: [feng-shui-measurement.md, bumps-as-input.md]
    extract:
      - "the hex shaped paths in the rose garden of vondelpark show up as 'swervy at a particular frequency'"
      - different granularities of cobbles and surfaces are high frequency low amplitude vertical bumps
      - stretches without smooth road/sidewalk ramps have bumps — so we can locate where the ramps ARE
      - "'feng shui measurement' — wind and water, how movement flows through a place"
      - bike speed and turbulence flow maps
      - "implementation consequence: resample the motion stream by DISTANCE not time, so spectra are cycles per metre and belong to the street rather than the ride"
      - paving unit size is the wavelength, so the spectrum names the material instead of rating it
      - herringbone couples vertical into lateral, so the laying bond is in the cross-correlation
      - a repair patch is three metres where the periodicity disappears
      - kerb ramps map to OSM kerb=flush/lowered/raised — serves wheelchairs more than bikes, and is presence mapping not complaint mapping
      - flow field gives routing a second axis, calm as distinct from smooth
    status: harvested

  - id: tomton-trilogy-jam
    from: ../../../process/crazy-idea-jam.yml
    tags: [iloci-memory-palace, amsterdam-coffeeshops-app, bongo-bingo]
    into: sources/amsterdam-gps-lineage.md
