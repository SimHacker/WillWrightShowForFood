# Local dev: Postgres only (viewer runs via pnpm dev on host)
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   export DATABASE_URL=postgresql://ebike:ebike@localhost:5432/ebike_safari
#   cd ../viewer && pnpm dev

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebike_safari}
      POSTGRES_USER: ${POSTGRES_USER:-ebike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebike}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata_dev:
