# Ebike Safari — production stack (GCP VM + Docker)
# Caddy (TLS) → SvelteKit viewer → static ride JSON
# PostGIS for future map-match / exposure API (schema init on first boot)
#
# EVERY BYTE OF STATE LIVES ON THE DATA DISK, AT THE SAME PATH EVERYWHERE.
#
# ONE GLOBAL NAMESPACE. A path means the same thing on the host, in every container, in every log
# line, in every backup script, and in this file. /data/postgres is /data/postgres is
# /data/postgres. Nothing is remapped, ever. A container that should not see a subtree does not
# mount it -- that is the ONLY way access is narrowed. Never by renaming.
#
#   /data/postgres              db      rw   the database
#   /data/caddy/storage         caddy   rw   ACME account key + every issued certificate
#   /data/caddy/config          caddy   rw   Caddy's autosaved JSON
#   /data/releases/<app>        caddy   ro   SHARED. Every app's static build. See below.
#   /data/ebike-safari/rides    viewer  ro   ride GeoJSON the site serves (never in git)
#   /data/ebike-safari/osm      --           OSM extracts; no container needs them
#   /data/secrets/<domain>/...  --           one file per secret, named by env_file below
#
# SECRETS ARE FACTORED THE SAME WAY, and the env_file lists are the entire access model: a service
# that does not name a file cannot read it. One secret, one file, one owner -- grouped by what the
# secret IS, never by which app wants it. Each app also gets its OWN postgres role, so the
# superuser password exists in exactly one file that only the db container names. Full layout and
# threat model in server/SECRETS.md; roles are converged by scripts/provision-db-roles.sh.
#
# Secrets are read by compose on the HOST and injected as environment, never mounted into a
# container and never interpolated into this file -- so `docker compose config` stays safe to paste
# and no credential is visible to a service that merely shares a machine with its owner.
#
# Because the namespace does not fork, the way to point a program at its data is to CONFIGURE it,
# not to lie to it with a mount. Hence PGDATA, EBIKE_DATA_DIR, XDG_CONFIG_HOME and `storage
# file_system` below: each names the real path. When a program cannot be configured, that is worth
# knowing about the program -- it is not a reason to bend the namespace around it.
#
# SHARED SUBTREES. /data/releases is the shared one: apps write their builds there (on the host,
# via deploy-app.sh) and Caddy reads the whole tree read-only. Adding a site is therefore a
# Caddyfile block rooted at /data/releases/<app>/current and NOTHING ELSE -- no volume to add
# here, no container to restart, no path to invent. One producer writes, consumers mount :ro.
#
# NO NAMED VOLUMES. A named volume lands in /var/lib/docker on the boot disk, which is cattle,
# and deleting the VM would take the database and the ACME account key with it.
#
# The only mounts NOT under /data are read-only config out of the git checkout, at paths the
# images themselves mandate (/etc/caddy/Caddyfile, /docker-entrypoint-initdb.d). Those are not
# state, they are the image's published interface, and they are versioned in git.
#
# $DATA_ROOT varies the HOST side only, for a laptop that has no /data. The container side is
# always the literal /data, so the namespace inside a container is invariant across machines.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # The superuser credentials, and ONLY those. Not interpolated into this file, so the password
    # does not appear in `docker compose config` output, in any other service's environment, or in
    # a DATABASE_URL. The apps get their own roles -- see scripts/provision-db-roles.sh.
    env_file:
      - ${DATA_ROOT:-/data}/secrets/postgres/superuser.env
    environment:
      # Configured, not remapped: postgres is told where its data actually is, rather than being
      # shown someone else's path at /var/lib/postgresql/data.
      PGDATA: /data/postgres
    volumes:
      - ${DATA_ROOT:-/data}/postgres:/data/postgres
      # Image-mandated config path, out of git, read-only. Not state.
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  viewer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.viewer
    restart: unless-stopped
    # Its own postgres role, and the Mapbox token. Two files because they are two secrets with
    # different owners and different rotation schedules -- not one file because one app wants both.
    #
    # The superuser password is absent by construction: this service does not name that file, so
    # nothing in this container can read it. An RCE in a route reaches DML on the app's tables,
    # not DROP DATABASE.
    env_file:
      - ${DATA_ROOT:-/data}/secrets/postgres/roles/ebike-safari.env
      - ${DATA_ROOT:-/data}/secrets/mapbox/token.env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:-https://${DOMAIN:-ebike-safari.com}}
      EBIKE_DATA_DIR: /data/ebike-safari/rides
    volumes:
      # Outside build/client so sirv does not cache stale Content-Length after ride sync.
      # On the data disk, not in the checkout: this is the only copy of the rides.
      # Read-only, and rides ONLY -- the viewer has no business in osm/, postgres/ or secrets/.
      # That narrowing is done by mounting less, never by showing it a different path.
      - ${DATA_ROOT:-/data}/ebike-safari/rides:/data/ebike-safari/rides:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  caddy:
    # Shared ingress: TLS for every site on this VM. The official image, unmodified.
    #
    # It briefly had a Dockerfile of its own that baked the HyperTIES build in. That made a
    # content change require an image build, and compose only builds during `up` when the
    # image is missing -- so a changed build context silently kept serving the old image.
    # That is how a Caddyfile fix sat undeployed while hyperties.org was down. HyperTIES
    # releases are now bind-mounted and swapped by symlink instead, which is both atomic and
    # impossible to forget to build.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    # The ACME contact address. Caddy holds no other credential, and this is the only file it names.
    env_file:
      - ${DATA_ROOT:-/data}/secrets/acme/email.env
    environment:
      DOMAIN: ${DOMAIN:-ebike-safari.com}
      # The image ships XDG_CONFIG_HOME=/config and XDG_DATA_HOME=/data, which would put the
      # autosaved config at /config and treat the whole shared namespace as Caddy's private data
      # directory. Both are overridden: config here, and storage in the Caddyfile where it is
      # visible next to the sites it protects.
      XDG_CONFIG_HOME: /data/caddy/config
    volumes:
      # Image-mandated config paths, out of git, read-only. Not state.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Owned by apps/ties, mounted rather than copied, so a redirect edit is a reload.
      - ../../ties/deploy/hyperties.Caddyfile:/etc/caddy/hyperties.Caddyfile:ro
      # SHARED, read-only: the WHOLE releases tree, not one app's corner of it. This is what
      # makes adding a site a Caddyfile block and nothing else -- a new app's releases appear
      # here the moment its first deploy lands, with no edit to this file and no restart.
      #
      # Mounting the tree also sidesteps the bind-mount trap that a per-app mount walks into: a
      # bind mount resolves its source path once, at mount time, so mounting a `current` symlink
      # pins the container to whichever release existed then and makes every later swap
      # invisible inside it. Here Caddy resolves `current` per request, so a swap lands live.
      - ${RELEASE_ROOT:-/data/releases}:/data/releases:ro
      # Caddy's own subtree, read-write: the ACME account key and all eight certificates, plus
      # the autosaved config. Re-issuance is rate-limited to 5 duplicates a week, so losing this
      # twice inside one week means the sites stay down on TLS until the window rolls over.
      - ${DATA_ROOT:-/data}/caddy:/data/caddy
    depends_on:
      # `service_started`, not `service_healthy`. Caddy answers for hyperties.org as well,
      # and a viewer that fails its healthcheck must not keep an unrelated static site from
      # being served -- Caddy returns 502 for a dead upstream on its own, which is the
      # correct degradation.
      viewer:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge
# No `volumes:` block. See the header: named volumes live on the boot disk, and nothing that
# matters is allowed to live on the boot disk. If you find yourself adding one, add a bind mount
# under $DATA_ROOT instead.
