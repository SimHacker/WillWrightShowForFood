# Ebike Safari — production stack (GCP VM + Docker)
# Caddy (TLS) → SvelteKit viewer → static ride JSON
# PostGIS for future map-match / exposure API (schema init on first boot)
#
# EVERY BYTE OF STATE LIVES ON THE DATA DISK, under $DATA_ROOT (default /data).
# Not some of it. There are no named volumes in this file, deliberately: a named volume lands in
# /var/lib/docker on the boot disk, which is cattle, and deleting the VM would take the database
# and the ACME account key with it. Bind mounts under /data are the only kind of persistence here.
#
#   /data/postgres              the database
#   /data/caddy/{data,config}   ACME account key + every issued certificate
#   /data/releases/<app>        built releases; `current` is the symlink Caddy follows
#   /data/ebike-safari/rides    ride GeoJSON the site serves (never in git)
#   /data/ebike-safari/osm      OSM extracts, raw and filtered
#   /data/secrets               .env, mode 600; the checkout symlinks to it
#
# If you add a service that stores anything, it gets a bind mount under $DATA_ROOT too.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ebike-safari}
      POSTGRES_USER: ${POSTGRES_USER:-ebike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ${DATA_ROOT:-/data}/postgres:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal

  viewer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.viewer
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:-https://${DOMAIN:-localhost}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ebike}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ebike-safari}
      EBIKE_DATA_DIR: /app/data
      # From deploy/.env on the VM (chmod 600, gitignored) — never baked into the image.
      # Empty default so a VM without it still boots; the map degrades, the site does not.
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    volumes:
      # Outside build/client so sirv does not cache stale Content-Length after ride sync.
      # On the data disk, not in the checkout: this is the only copy of the rides.
      - ${DATA_ROOT:-/data}/ebike-safari/rides:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  caddy:
    # Shared ingress: TLS for every site on this VM. The official image, unmodified.
    #
    # It briefly had a Dockerfile of its own that baked the HyperTIES build in. That made a
    # content change require an image build, and compose only builds during `up` when the
    # image is missing -- so a changed build context silently kept serving the old image.
    # That is how a Caddyfile fix sat undeployed while hyperties.org was down. HyperTIES
    # releases are now bind-mounted and swapped by symlink instead, which is both atomic and
    # impossible to forget to build.
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-ebike-safari.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Owned by apps/ties, mounted rather than copied, so a redirect edit is a reload.
      - ../../ties/deploy/hyperties.Caddyfile:/etc/caddy/hyperties.Caddyfile:ro
      # The PARENT of `current`, never the symlink itself: a bind mount resolves its source
      # once, at mount time, so mounting `current` would pin this container to whichever
      # release existed then and make every later swap invisible inside it.
      - ${RELEASE_ROOT:-/data/releases}/hyperties:/srv/hyperties:ro
      # The ACME account key and all eight certificates. On the pet disk, because re-issuing
      # them is rate-limited to 5 duplicates a week -- lose these twice in one week and the
      # sites go down on TLS with nothing you can do but wait.
      - ${DATA_ROOT:-/data}/caddy/data:/data
      - ${DATA_ROOT:-/data}/caddy/config:/config
    depends_on:
      # `service_started`, not `service_healthy`. Caddy answers for hyperties.org as well,
      # and a viewer that fails its healthcheck must not keep an unrelated static site from
      # being served -- Caddy returns 502 for a dead upstream on its own, which is the
      # correct degradation.
      viewer:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge
# No `volumes:` block. See the header: named volumes live on the boot disk, and nothing that
# matters is allowed to live on the boot disk. If you find yourself adding one, add a bind mount
# under $DATA_ROOT instead.
