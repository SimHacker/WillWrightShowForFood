# Tooling lineage — what MicropolisAngel / SoulAngel inherits from Don's 2000s Windows tools
# Capability-level summary. Detailed port maps live in private green-room lineage notes.

meta:
  id: simskit-lineage
  status: spec
  note: |
    Between 2000 and 2004 Don built a family of Windows tools around The Sims: catalog
    showcase bots, object cloning and preview exporters, character/animation viewers,
    and embedded-browser preview controls. Those tools proved the workflows. SoulAngel
    reimplements the DATA paths in TypeScript; screen scrape becomes a bootstrap
    shortcut, not the primary catalog reader.

# ── SIMPLIFIER (catalog showcase) ─────────────────────────────────────────────
simplifier:
  era: "Buy-mode catalog showcase — read object descriptions aloud, drive the UI"
  what_it_did:
    capture: "Grabbed the game window into a bitmap buffer on a timer"
    read: "Pixel-font OCR of the catalog description panel — title, description, price"
    speak: "Windows speech synthesis read descriptions aloud as the player browsed"
    inject: "Synthesized clicks and pie-menu picks to navigate the catalog; handled modals"
    multi_window: "Attached to multiple game windows side by side"
  port_to:
    primary: |
      Do NOT port pixel OCR as the long-term catalog reader. SoulAngel TypeScript reads
      game data files directly (catalogs/maxis pipeline).
    bootstrap_crawler: |
      Port the navigation state machine + click inject to walk every buy-mode category
      and capture preview bitmaps. Store rows in SQLite (local Angel cache, sync to
      central Soul City federation). Retire scrape once file parsing covers metadata.

# ── OBJECT TOOLING (clone, export, preview) ───────────────────────────────────
object_tooling:
  era: "Object editor era — clone objects, export catalogs as XML, render preview sprites"
  key_assets:
    object_catalog_seed: "Thousands of object name/description/GUID records — seed the SQLite catalog"
    batch_automation: "COM automation scripts batch-exported object previews"
  port_to:
    - "TypeScript/WASM file reader replaces 2000s preview plumbing (catalogs/maxis/CATALOG.yml#iff-reader)"
    - "Import legacy catalog seed → SQLite object_records table (one-time + diff on new packs)"
    - "GUID clone/renumber logic informs Soul City 'publish collection' installer helpers"
    - "Batch-export pattern → headless preview render job queue"

# ── CHARACTER / ANIMATION SHOWCASE ────────────────────────────────────────────
character_showcase:
  era: "Cycled character outfits and animations on screen — machinima precursor"
  port_to:
    - "Soul City character preview panel (WebGPU path)"
    - "SoulAngel machinima segment tooling"

# ── EMBEDDED BROWSER PREVIEW ──────────────────────────────────────────────────
browser_preview:
  era: "Object preview embedded in the browser via an ActiveX control"
  port_to:
    - "Replace ActiveX with WebView2 + WebGPU renderer"
    - "See characters/will-wright/sources/2004-01-08-showntell-activex-preview/"

# ── SQLITE CATALOG SCHEMA (target) ────────────────────────────────────────────
sqlite_catalog:
  why_sqlite_not_server_sql: |
    Local embedded DB on the player's PC — catalog cache, crawl progress, graveyard index,
    downloaded-object inventory. Syncs UP to central Soul City (SvelteKit + Postgres)
    via federation API; Angel does not need a local SvelteKit server for v1.
  tables_sketch:
    objects:
      columns: [guid, name, description, price, category, pack_id, preview_blob_path, source]
      sources: [iff_parse, catalog_seed, showcase_crawl, user_download]
    wallpapers: { columns: [guid, name, pack_id, preview_blob_path] }
    floors: { columns: [guid, name, pack_id, preview_blob_path] }
    graveyard:
      columns: [save_id, lot_id, sim_name, death_cause, object_guid, tile_x, tile_y, urn_type, album_card_id]
      source: save_file_parse  # primary — NOT screen scrape
    saves:
      columns: [path, neighborhood, lot, household, mtime, hash]
    crawl_state:
      columns: [category, last_index, last_guid, completed_at]

# ── PORT PRIORITY ─────────────────────────────────────────────────────────────
port_priority:
  1: "Register scan_root → parse owned Legacy Collection install → objects + fingerprints"
  2: "TypeScript save/file reader → graveyard + save_object_refs + missing GUID workflow"
  3: "Optional validation diff vs legacy catalog seed (never import as truth)"
  4: "Showcase inject port — catalog crawl for preview images only (bootstrap)"
  5: "Preview render → WebGPU pipeline (replaces scrape entirely)"
  6: "GUID collision + save bundle + creditcasting — CATALOG-DB-SCHEMA.yml"

see_also:
  - ARCHITECTURE.yml
  - ../../catalogs/maxis/CATALOG.yml
  - ../stream-gateway/simplifier.yml
  - ../../characters/will-wright/sources/don-youtube-imu1v3GecB8-simplifier-tools-demo/
