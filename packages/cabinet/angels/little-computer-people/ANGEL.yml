# Screen angel for Little Computer People (Activision, 1985).
# Looks are cut from the 560x192 frame the Korz page paints (scripts/angel-cut.mjs).
# The guestbook's black message box is x 69-338, y 136-167: four text lines 8 pixels apart.

title: Little Computer People
screen: [560, 192]

looks:
  - id: guestbook          # HOUSE-ON-A-DISK logo on the book cover, every guestbook screen
    png: looks/guestbook.png
    at: [98, 28]
    looks:
      - id: flip           # "Please turn over / HOUSE-ON-A-DISK / and press a key"
        png: looks/flip.png
        at: [69, 136]
      - id: name           # "NAME OF RESEARCHER / (first name then last) / Example: JOHN DOE"
        png: looks/name.png
        at: [69, 136]
        looks:
          - id: name-empty # the line the name is typed on, still black. The blinking cursor is transparent.
            png: looks/name-empty.png
            at: [69, 160]
      - id: date           # "Enter Date: MM/DD/YY / Example: 09/30/88"
        png: looks/date.png
        at: [69, 136]
        looks:
          - id: date-empty # the line the date is typed on, still black. The blinking cursor is transparent.
            png: looks/date-empty.png
            at: [69, 152]
      - id: signed         # "RESEARCHER" over the name, session and date
        png: looks/signed.png
        at: [69, 136]
        looks:
          - id: session    # "SESSION:", drawn a moment after the name
            png: looks/session.png
            at: [69, 152]
            # Hi-res color at a dot depends on its neighbors, so a look's last few columns,
            # beside the number that follows, are transparent.
            looks:
              - id: session-1  # first visit: he has not moved in yet
                png: looks/session-1.png
                at: [69, 152]
              - id: dated      # "Date:", drawn after the session number
                png: looks/dated.png
                at: [69, 160]
  - id: house              # attic floor left of the stairs; he never stands on it
    png: looks/house.png
    at: [0, 56]
    looks:
      - id: field          # the game's input line, open and empty: two white text rows
        png: looks/field.png
        at: [0, 0]

states:
  - id: loading
    # Booting: the 6502 and the disk arm over the engine, no chords yet.
    music: { style: straight, bpm: 84, loops: false, mute: [harmony] }
    speed: 100
    frames: 1
    say: The Apple is reading the guestbook side of the disk.

  - id: flip
    music: { loops: true, bpm: 60, mute: [drums] }
    when: [guestbook, flip]
    say: >-
      The game wants the disk turned over to the house side. The screen angel turns it for
      you; on a real Apple you would flip the floppy and press a key.
    auto: Turn the Disk Over
    moves: [Turn the Disk Over]

  - id: name
    # Asked a name: a soft jazz ride under the question.
    music: { style: jazz, bpm: 96, loops: false, mute: [] }
    when: [guestbook, name, name-empty]
    say: >-
      Sign the guestbook. The game keeps your name as the researcher studying the little
      person who lives on this disk.
    lock: true
    ask:
      label: Your name
      hint: Type it here and press OK. The Apple only has capitals; Return is pressed for you.
      speak: Welcome, researcher, to Little Computer People. Please enter your name.
      reply: Welcome, {value}.
      keys: "{value}\r"
      upper: true
      maxlength: 30

  - id: signing
    when: [guestbook, name]
    unless: name-empty
    say: Writing your name in the guestbook.
    lock: true

  - id: date
    music: { style: bp, bpm: 84, mute: [drums] }
    when: [guestbook, date, date-empty]
    say: The guestbook dates each visit. Today is filled in; change it if you like.
    lock: true
    ask:
      label: Today's date
      hint: Month, day, year as MM/DD/YY.
      default: "{MM}/{DD}/{YY}"
      speak: Please enter the date.
      reply: Wow, I can't believe it's {when}! If you say so.
      keys: "{value}\r"
      maxlength: 8

  - id: first-visit
    music: { style: straight, bpm: 72, loops: true, mute: [drums] }
    when: [guestbook, signed, session-1]
    say: Signed for session 1. The Apple is loading the house; someone is about to move in.
    speak: Hang on while someone moves in and gets settled.

  - id: return-visit
    when: [guestbook, signed, session, dated]
    unless: session-1
    say: Signed. The Apple is loading the house.
    speak: Welcome back. He is coming home.

  # Before moving-in and coming-home: they hold whenever the house is seen.
  - id: home
    # Playing: everything in.
    music: { style: jazz, bpm: 120, loops: false, mute: [] }
    when: [house, field]
    from: [moving-in, coming-home]
    speed: 1
    speak: He is home. Take care of him with the buttons, or ask him something.
    say: >-
      He lives here now. The buttons give him things: the game's own keys are Control-F food,
      Control-W water, Control-D dog food, Control-A the alarm, Control-C the phone, Control-P
      a pat, Control-R a record and Control-B a book, but you don't need to type them, just
      press the buttons. Or ask him to do something in the field below.
    moves: [Food, Water, Dog Food, Ring the Alarm, Ring the Phone, Pat Him, A Record, A Book,
      Ask for the Piano, Ask for a Fire, Ask Him to Dance, Ask for a Letter]
    ask:
      label: Say something to him
      hint: A request, starting with PLEASE. Return is pressed for you.
      keys: "{value}\r"
      upper: true
      maxlength: 38
      keep: true
      examples: [PLEASE PLAY THE PIANO, PLEASE PLAY ANOTHER SONG, PLEASE BUILD A FIRE, PLEASE DANCE,
        PLEASE TYPE A LETTER TO ME, PLEASE PLAY WITH ME]
      # Made from the words his parser knows: the vocabulary on the Guestbook side, file sectors
      # 466-469 of 4am's crack, in synonym groups (PIANO IVORIES SONG TUNE SERENADE JAZZ BOOGIE,
      # FIRE FIREPLACE LOG, NAP BED, ...). Whether he does a thing is up to his mood.
      groups:
        - label: Music
          examples: [PLEASE TICKLE THE IVORIES, PLEASE PLAY SOME JAZZ, PLEASE PLAY SOME BOOGIE,
            PLEASE PLAY A SERENADE, PLEASE PLAY A RECORD, PLEASE LISTEN TO MUSIC]
        - label: Games
          examples: [PLEASE PLAY A GAME, PLEASE PLAY POKER, PLEASE PLAY CARD WAR, PLEASE PLAY ANAGRAMS]
        - label: Around the house
          examples: [PLEASE LIGHT A FIRE, PLEASE TAKE A SHOWER, PLEASE BRUSH YOUR TEETH,
            PLEASE TAKE A NAP, PLEASE GO TO BED, PLEASE RELAX, PLEASE WORK, PLEASE GO UPSTAIRS]
        - label: Food and the dog
          examples: [PLEASE EAT SOMETHING, PLEASE HAVE A SNACK, PLEASE DRINK SOME WATER,
            PLEASE FEED THE DOG, PLEASE FILL THE DOG BOWL]
        - label: Writing and the computer
          examples: [PLEASE WRITE ME A NOTE, PLEASE TELL ME YOUR NAME, PLEASE LOGON TO YOUR COMPUTER]
        - label: Asking how he is
          examples: [HELLO, EXCUSE ME, "ARE YOU HUNGRY?", "ARE YOU TIRED?", "ARE YOU BORED?",
            "ARE YOU COLD?", "WHAT IS THE MATTER?", "WHAT IS YOUR PROBLEM?", PLEASE TALK TO ME]
        - label: Holidays
          examples: [MERRY CHRISTMAS, HAPPY HOLIDAYS, THANK YOU]

  # Nothing on screen says the game has started to listen until it is asked. Return opens the
  # game's input line, an empty white bar across the top, once it reads the keyboard; before
  # that the key is ignored. So while he moves in or comes home the angel presses Return now
  # and then, and he is home when the bar is there. Not on the guestbook, where Return answers.
  - id: moving-in
    # Waiting to move in: Eno's loops over the engine at max, no beat to wait on.
    music: { style: straight, bpm: 60, loops: true, mute: [drums, harmony] }
    when: house
    from: [loading, flip, name, signing, date, first-visit]
    speed: 100
    # One picture per game second. The max button. The wait runs flat out.
    frames: 1
    probe: { keys: "\r", every: 5 }
    say: >-
      He is moving in. The game ignores the keyboard until he has, so there is nothing to do
      but watch. The screen angel runs the Apple at max until he is home, then back to 1×.

  - id: coming-home
    music: { style: straight, bpm: 60, loops: true, mute: [drums, harmony] }
    when: house
    from: [return-visit]
    speed: 100
    frames: 1
    probe: { keys: "\r", every: 5 }
    say: >-
      He comes in the front door and goes about his business. The game ignores the keyboard
      until he has, so the screen angel runs the Apple at max until he is home.
