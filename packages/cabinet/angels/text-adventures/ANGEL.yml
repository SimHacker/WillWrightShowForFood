# Screen angel for text adventures on the Apple ][: Infocom's Zork I, II and III, and next the
# Scott Adams adventures. One angel for all of them: it reads the screen's text, knows the game
# by its banner, and keeps it until another game's banner shows or the Apple reboots. Each game
# has its own buttons: a compass rose of the directions its parser knows, LOOK in the middle,
# a few commands used all the time, and for Zork I, where most people start, every verb it has.
#
# The verbs are the games' own: scripts/zork-words.mjs reads each story's dictionary out of the
# Apple's RAM, groups the synonyms by the parser's verb number, and types each verb alone to see
# whether the game asks for more. Rerun it with --write after changing a disk.

title: Text adventures
screen: [560, 192]

looks:
  - id: zork-i
    text: "^ZORK I: THE GREAT UNDERGROUND EMPIRE"
  - id: zork-ii
    text: "^ZORK II: THE WIZARD OF FROBOZZ"
  - id: zork-iii
    text: "^ZORK III: THE DUNGEON MASTER"
  - id: columns            # Infocom's Apple interpreter, before the game starts
    text: "80 COLUMNS\\? \\(Y/N\\):"
  - id: more               # the screen is full: a key shows the rest
    text: "\\[MORE\\]"
  - id: prompt             # Infocom's prompt, waiting for a command
    text: "^>.?$"

states:
  - id: loading
    say: The Apple is loading the game.

  - id: columns
    when: columns
    say: >-
      The game asks whether to use 80 columns. The page answers 40 by itself, the width this
      Apple shows best; 80 Columns is there for a //e with the card.
    moves: [40 Columns, 80 Columns]

  - id: more
    when: more
    say: The screen is full and there is more to read. Press More, or any key, to see the rest.
    moves: [More]

  - id: playing
    when: prompt
    unless: more
    say: >-
      The game is waiting for a command at the > prompt. Type one on the Apple, or press the
      buttons: a direction to walk there, LOOK in the middle to look around, and the game's
      other words below. A word with … after it wants something more: finish it on the Apple
      and press Return.

# Typed with Return, or with a space when `then` says the game asks what.
often: &often
  - INVENTORY
  - { word: TAKE ALL, tip: Everything here you can carry }
  - { word: DROP ALL, tip: Put down everything you carry }
  - { word: TAKE, then: true }
  - { word: DROP, then: true }
  - { word: EXAMINE, then: true }
  - { word: OPEN, then: true }
  - { word: CLOSE, then: true }
  - { word: READ, then: true }
  - { word: PUT, then: true }
  - { word: AGAIN, tip: Does the last command again }
  - { word: WAIT, tip: Lets a turn go by }
the-game: &the-game
  - { word: SCORE, tip: Your score and rank }
  - { word: DIAGNOSE, tip: How hurt you are }
  - { word: VERBOSE, tip: Describe every place each time you come to it }
  - { word: BRIEF, tip: Describe a place in full only the first time }
  - { word: SAVE, tip: Save the game to a disk; the game asks for one }
  - { word: RESTORE, tip: Go back to a saved game }

