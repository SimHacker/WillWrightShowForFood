    compass: *zork-i-compass
    center: LOOK
    groups:
      # For someone who has never played, in the order the game meets them: the mailbox in the
      # first room, the window round the back of the house, the lamp and the rug in the living
      # room, the troll in the cellar. Whole commands, typed with Return.
      - label: Getting started
        open: true
        words:
          - { word: OPEN MAILBOX, tip: The mailbox at West of House }
          - { word: READ LEAFLET, tip: What was in the mailbox }
          - { word: OPEN WINDOW, tip: "Behind the house: the window is the way in" }
          - { word: ENTER WINDOW, tip: Climb in through the open window }
          - { word: TAKE LAMP, tip: The brass lantern in the living room }
          - { word: TURN ON LAMP, tip: It is dark below; light the lantern first }
          - { word: TURN OFF LAMP, tip: Save the lantern's batteries }
          - { word: MOVE RUG, tip: "What is under the rug in the living room?" }
          - { word: OPEN TRAP DOOR }
          - { word: TAKE SWORD, tip: The elvish sword over the trophy case }
          - { word: KILL TROLL WITH SWORD, tip: The troll guards the way on; it may take a few blows }
          - { word: KILL TROLL WITH AXE, tip: "The axe is the troll's: see what the game says" }
      - { label: Often, open: true, words: *often }
      - { label: The game, words: *the-game }
      - { label: Every Zork I verb, words: *zork-i-verbs }
