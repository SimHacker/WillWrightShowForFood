# The Forth kernel's family of copies. Design rule: variants are copies with descriptive
# names, not ifdefs, and their provenance lives here and in each file's first lines.
# When one copy changes, carry the change into the others or record why it doesn't apply.
# See ../../DESIGN.md#cartridges-and-live-coding.

upstream:
  repo: https://github.com/MitchBradley/pdp7forth
  commit: 96c3202ee88683a114517d474939da0dd8ea6a5d
  date: 2026-09-26
  license: MIT (LICENSE)

files:
  kernel.s:
    role: upstream
    what: Mitch's src/kernel.s, unchanged.
    built_by_as7_as: [sop.s from pdp7-unix, kernel.s, end.s]
    assembled: [kernel.a7out, kernel.lst]

  kernel-names-full.s:
    parent: kernel.s
    role: the cabinet's Forth, FORTH + TURTLE on the program menu. Tiny ITS, turtle Forth and
      PIXIE rings build on this copy; kernel.s stays as the upstream reference and test baseline.
    what: Names kept whole, up to 31 characters.
    cost: 231 more dictionary words with the prelude, turtle and scheme loaded (dp 10022, not 7453).
    layout: |
      [name] [count|imm|tag|link] [body], as Open Firmware lays a word out. The name is the
      whole name in SIXBIT, three characters a word, space-padded, ceil(count/3) words just
      before the header. The xt is still the header's address and links still run header to
      header, so the 512-word gap limit counts the names too. The body is at xt+1 (kernel.s
      has xt+2, with the first name word between), so mkcell adds 1. Nothing above mkcell
      knows where the body is.
    generated: |
      The 84 kernel headers' names come from each header's comment, which names the word in
      full. scripts/make-forth-names-full.py makes this file from kernel.s, names and code alike,
      so a change upstream is carried over by rerunning it.
    as_built: |
      parse packs the whole token into tnbuf (tname is its first word, tnw the count) through
      a plain pointer, so auto-index 015-017 stay free as in kernel.s. find compares the
      count, then the name from xt-ceil(count/3) up. mkhdr lays the name, then the header, and
      remembers hbase, where the name began, so abort and a link too far give it back.
    planned_adopt: |
      Open Firmware's layout-independent words (forth/kernel/kernel.fth): >link, >name,
      n>link, l>name, >flags, name>string, and >body, so code above them doesn't care.
    differs_in: [the 84 kernel headers, parse, find, mkcell, mkhdr, abort, WORDS]
    must_match_parent: everything else, line for line
    simh_tests: |
      Mitch's test/run_tests.py under SIMH, with this file as src/kernel.s: all pass but eight,
      none of them the kernel's. Four check upstream's own name encoding (cellx redefining
      cell+, and WORDS's listing). Four are find tests for longer names: the harness deposits
      tcnt and tname only, and find reads the rest of the name from tnbuf. The PR's harness
      deposits tnbuf too.
    next: |
      The PRs: a KERNEL parameter for his Makefile, test/run_tests.py and check_names, then
      src/kernel-names-full.s, a full-names hdr.py and the harness changes above.

  pixie.s:
    parent: kernel-names-full.s
    role: PIXIE rings in the cabinet's Forth. Assembled after kernel-names-full.s, then rsppix.s,
      then end.s (forth.ts, assembleForthKernel with pixie).
    what: |
      A Forth word for each RSPPIX routine (RSETUP RINIT RGETSP RCAR RCDR RPUSH RPOP RNULLR
      RINSRT RFINDS RFINDN RFINDP RFEL RFELN RADDW RDELB), REL REL1 RNM RSAVINS for its
      permanent names, and RBEG REND RFREE for the RINGS panel. It plays SYMELEC's part: the
      variables RSPPIX expects, in SYMELEC's order, and its error exits ERRMEB and ERRGB, which
      print "ring?" or "rings full?" and abort. It ends the kernel's dictionary chain at its own
      last word and starts the literal pool below RSPPIX.
    layout: |
      014022 RSPPIX, 014000 above Cambridge's 022, so its ORed offsets still add; the literal
      pool grows down from there. 015400 the variables. 015500-017000 the ring area, 017000-017100
      the reserve past END, 017101-017600 permanent names and the garbage collector's branch
      stack (bigger than SYMELEC's, so a ring of a few hundred elements can be marked),
      017601 the operand stack, 017640-017700 the link stack.

  rsppix.s:
    parent: ../symelec/rsppix.asm
    role: RSPPIX from the 1972 listing, generated by scripts/translate-cambridge.mjs; not edited.
    as_linked: |
      forth.ts, rsppixForForth, moves it to px.org and leaves its placeholder variables as
      space, since pixie.s defines them. Every other word is the listing's, 014000 up.

  pixie.fs:
    role: Forth over pixie.s, loaded after prelude.fs and turtle.fs. RINGS, ELEMENT, NAMED,
      PNAME, RFIRST, RNEXT, RCOUNT, .PNAME, .RING.
