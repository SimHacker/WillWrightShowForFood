# The Forth kernel's family of copies. Design rule: variants are copies with descriptive
# names, not ifdefs, and their provenance lives here and in each file's first lines.
# When one copy changes, carry the change into the others or record why it doesn't apply.
# See ../../DESIGN.md#cartridges-and-live-coding.

upstream:
  repo: https://github.com/MitchBradley/pdp7forth
  commit: 96c3202ee88683a114517d474939da0dd8ea6a5d
  date: 2026-09-26
  license: MIT (LICENSE)

files:
  kernel.s:
    role: upstream
    what: Mitch's src/kernel.s, unchanged. Names keep a length and three SIXBIT characters.
    built_by_as7_as: [sop.s from pdp7-unix, kernel.s, end.s]
    assembled: [kernel.a7out, kernel.lst]

  kernel-names-full.s:
    parent: kernel.s
    role: variant, built and tested in the cabinet (src/forth.test.ts, "full names")
    what: Every character of a name kept, so WORDS prints EXIT, not EXI_, and SQUARE and SQUID are two words.
    cost: 221 more dictionary words with the prelude, turtle and scheme loaded (dp 10010, not 7453).
    generated: |
      The 54 extra name words of the 84 kernel headers were generated from each header's
      comment, which names the word in full; the rest of the diff is by hand.
    layout: |
      The threading is untouched. A thread cell holds the body address (mkcell:
      optab[tag] | (xt + 2)), and only mkcell and find go from header to body. So the extra
      name words go BEFORE the two-word header, as Open Firmware lays names out (name>string
      reads back from the name field): [name words 2..n] [count|imm|tag|link] [name word 1]
      [body]. The xt stays the link word and the body stays at xt + 2; find compares the first
      word as now, then the words before it when the count is over 3. Links still run link word
      to link word, so the 512-word gap limit counts the name words too.
    as_built: |
      Words 2..n are stored last first, so word k sits at xt-(k-1) and find and WORDS walk
      down from the header. parse packs the whole token into tnbuf (tname is its first word,
      tnw the count) through a plain pointer, and find compares the same way, so auto-index
      015-017 stay free as in kernel.s (Mitch's test harness uses 015). mkhdr lays the name
      words, then the header, and remembers hbase, where they began, so abort and a link too
      far give the name words back. The 31-character limit is the 5-bit count field's, as before.
    planned_adopt: |
      Open Firmware's layout-independent words (forth/kernel/kernel.fth): >link, >name,
      n>link, l>name, >flags, name>string, and >body. The PDP-7 Forth has none today; add them
      to both copies, with bodies that differ, so code above them doesn't care.
    differs_in: [the name words before 30 of the 84 kernel headers, parse, find, mkhdr, abort, WORDS]
    must_match_parent: everything else, line for line
    simh_tests: |
      Mitch's test/run_tests.py under SIMH, with this file as src/kernel.s: all pass but four,
      each expecting three-character names (cellx redefining cell+, and the session WORDS
      checks for EXI_-style truncation). Those tests need full-name versions in the PR.
    next: |
      The PRs: a KERNEL parameter for his Makefile,
      test/run_tests.py and check_names, then src/kernel-names-full.s and a full-names hdr.py.
      The Open Firmware words above.
