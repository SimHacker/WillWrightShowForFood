# The Machine Room's About panel: what this is, and the people and projects it stands on.
# Every machine page's outline ends with it (apps/ties/src/lib/AboutPanel.svelte). Each
# section is a panel, and each entry a link, that can be pinned to the toolbar.
#   about     what the Machine Room is, paragraph by paragraph
#   sections  id, title, about (a line), entries
#   entries   id (unique across the file), name, url, kind (person, project, place, document),
#             for: what it gave the Machine Room, in a line. A click shows the page in the
#             outline's viewer (WebPanel.svelte) and scrolls to it: a GitHub file read in place,
#             a video, a page in a frame, or for a site that refuses frames a card with this line
#             and a new-tab button. ⌘-click is the browser's new tab; view: tab makes a plain
#             click one too. A url starting /machine/ runs that machine inside this one
about:
  - >-
    The Machine Room runs old computers in the browser, and the programs people wrote for them:
    a DEC PDP-7 with its Type 340 display, light pen and teletype; an Apple ][+ with a Disk II, a
    Videx card and a cabinet panel; and a PDP-10, a KA10 running MIT's ITS. The PDP-7 and the Apple are
    Korz machines: the CPU and devices are described once, then interpreted, resolved or compiled
    to JavaScript, all checked against each other and against SIMH or microM8. The KA10 is SIMH's
    code ported, and a hand-written engine checked against it in lockstep, which the page runs.
  - >-
    The bus dance turns each machine's work into music, the way people once held an AM radio
    to a computer to hear it think. Screen angels watch the screen and explain what is going
    on. Cartridges wrap a program with its disks, its moves and its guide, over a shared
    collection of disks every configuration can reach.
  - >-
    It was made in MOOLLM, Don's microworld for language models, and it is for MOOLLM. MOOLLM
    treats a git repository as a world that people and models share, like a text adventure:
    directories are rooms, files are the things in them, and characters are files a person or a
    model can play. This repository is one of those worlds. The Machine Room grew in it, written by
    Don with Claude working in the same rooms, and Korz was designed in MOOLLM's own repository.
  - >-
    MOOLLM's characters will sit down at these machines, play the Apple ][ games and run MACSYMA.
    Two designs point that way, neither built yet: Korz′, which asks a model to speed up a
    machine's hottest code, and Dasher at the teletype, where the running program is the language
    model and a model helps rank what comes next.
  - >-
    It is Don Hopkins's project, built in the open on hyperties.org. Pin any name below to keep it
    in the toolbar as a link to open later.

