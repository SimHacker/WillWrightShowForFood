# The Machine Room's About panel: what this is, and the people and projects it stands on.
# Every machine page's outline ends with it (apps/ties/src/lib/AboutPanel.svelte). Each
# section is a panel, and each entry a link, that can be pinned to the toolbar.
#   about     what the Machine Room is, paragraph by paragraph
#   sections  id, title, about (a line), entries
#   entries   id (unique across the file), name, url, kind (person, project, place, document),
#             for: what it gave the Machine Room, in a line
about:
  - >-
    The Machine Room runs old computers in the browser, and the programs people wrote for them:
    a DEC PDP-7 with its Type 340 display, light pen and teletype; an Apple ][+ with a Disk II, a
    Videx card and a cabinet panel; and a PDP-10 running ITS, coming. Each machine is a Korz
    machine: its CPU and devices are described once, then interpreted, resolved or compiled to
    JavaScript, all checked against each other and against SIMH or microM8.
  - >-
    The bus dance turns each machine's work into music, the way people once held an AM radio
    to a computer to hear it think. Screen angels watch the screen and explain what is going
    on. Cartridges wrap a program with its disks, its moves and its guide, over a shared
    collection of disks every configuration can reach.
  - >-
    It is Don Hopkins's project, built in the open on hyperties.org, with Claude writing much of
    the code. Pin any name below to keep it in the toolbar as a link to open later.

sections:
  - id: project
    title: This project
    about: Where the Machine Room comes from and what it is built with.
    entries:
      - { id: don-hopkins, name: Don Hopkins, kind: person, url: "https://www.donhopkins.com/", for: "The Machine Room's author, and the Apple ][ Forth and H19 terminal on its disks" }
      - { id: hyperties-org, name: hyperties.org, kind: place, url: "https://hyperties.org/", for: "Where the Machine Room lives" }
      - { id: ben-shneiderman, name: Ben Shneiderman, kind: person, url: "https://en.wikipedia.org/wiki/Ben_Shneiderman", for: "HyperTIES, the hypertext system at the University of Maryland that the site is named for" }
      - { id: moollm, name: MOOLLM, kind: project, url: "https://github.com/SimHacker/moollm", for: "Don's microworld for language models, where Korz was designed" }
      - { id: korz-design, name: Korz, kind: document, url: "https://github.com/SimHacker/moollm/tree/main/designs/korz", for: "The design of the machines as described once and run at several rungs" }
      - { id: korzybski, name: Alfred Korzybski, kind: person, url: "https://en.wikipedia.org/wiki/Alfred_Korzybski", for: "The map is not the territory: Korz is named for him" }
      - { id: patreon, name: Don on Patreon, kind: place, url: "https://www.patreon.com/c/DonHopkins", for: "Supporting the work" }

