  - id: pdp7
    title: PDP-7 and PIXIE
    about:
      - >-
        The Machine Room's first machine is a DEC PDP-7, the 18-bit computer of 1964, with the
        Type 340 precision display, the Type 370 light pen and a teletype. The 340 is nearly a
        computer of its own: it reads its display file straight out of the PDP-7's core, and the
        PDP-7 talks to it with IOT instructions, so the display adds instructions to the machine.
      - >-
        It is here because of PIXIE. At the Cambridge University Mathematical Laboratory in 1969,
        Neil Wiseman, Heinz Lemke and John Hiles built an interactive CAD system on a PDP-7 and 340
        linked to Titan, Cambridge's Atlas 2. Circuits were drawn with the light pen, and the
        commands were lightbuttons that travelled around the pen's tracking cross: among the
        earliest radial menus known. The PDP-7 built the drawing's ring structure itself; Titan
        analysed it over Wiseman's high-speed link.
      - >-
        Heinz Lemke's 1972 listing of SYMELEC, PIXIE's circuit editor, survived on lineprinter
        paper. It was transcribed back into source and assembled, and SYMELEC runs on the cabinet
        with the pointer as the light pen and tiny-titan at the far end of the link. The two 1969
        demonstration films came back from the Cambridge Computer Laboratory's archive in 2019.
        Beside PIXIE, the cabinet runs PDP-7 UNIX, DUEL from DECUS, Mitch Bradley's Forth with a
        turtle on the 340, and devices built for it in Forth.
