# AB* abacus/register machine program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/EXP.AB
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Registers A-J, -9999..9999, start at 0. SET R x, DEC R, INC R, GTO x, ZER R x (jump if 0),
# CAL NAME (run NAME.AB on the same registers; recursion allowed), END (return or halt).
# See Boolos & Jeffrey, Computability and Logic (1980) ch. 6; Jeffrey, Formal Logic (1981) ch. 6.

id: pcomp-ab-exp
name: EXP
machine: abacus
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file EXP.AB

calls: [pcomp-ab-xmult]
program:
  1: "SET A 3"  # Let A=3           ---|
  2: "SET E 4"  # Let E=4              |
  3: "DEC A"  # ---|                 |
  4: "INC B"  # |   Let B=B+A     |
  5: "INC F"  # |---Let F=F+A     |
  6: "ZER A 8"  # |   Let A=0       |
  7: "GTO 3"  # ---|                 |
  8: "DEC F"  # ---|                 |---A gets A to the
  9: "INC A"  # |---Let A=F       |   Eth power (e.g.,
  10: "ZER F 12"  # |   Let F=0       |   3 to the 4th power
  11: "GTO 8"  # ---|                 |   equals 81)
  12: "DEC E"  # ---|                 |
  13: "ZER E 16"  # |   A gets A*B    |
  14: "CAL XMULT"  # |---E number of   |
  15: "GTO 12"  # |   times         |
  16: "END"  # ---|              ---|
  # 18: PURPOSE: compute 3 to the 4th power.
  # 19: INPUT:   registers [A] and [E] are initially set
  # 20: to 3 and 4, respectively (assuming that
  # 21: registers [B] and [F] are initially 0).
  # 22: OUTPUT:  register [A] gets [A] to the [E]th power.
  # 24: (This is designed to be a main program that calls
  # 25: XMULT.AB as a subroutine.  XMULT.AB in turn calls
  # 26: XADD.AB)
  99: "END"
runs:
  - registers: {}
    expect: { registers: { A: 81, E: 0 } }
