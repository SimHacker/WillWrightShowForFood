# AB* abacus/register machine program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/XMULT.AB
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Registers A-J, -9999..9999, start at 0. SET R x, DEC R, INC R, GTO x, ZER R x (jump if 0),
# CAL NAME (run NAME.AB on the same registers; recursion allowed), END (return or halt).
# See Boolos & Jeffrey, Computability and Logic (1980) ch. 6; Jeffrey, Formal Logic (1981) ch. 6.

id: pcomp-ab-xmult
name: XMULT
machine: abacus
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file XMULT.AB

calls: [pcomp-ab-xadd]
program:
  1: "DEC A"  # ---|                ---|
  2: "INC D"  # |---Increment D     |
  3: "ZER A 5"  # |   A number of     |
  4: "GTO 1"  # ---|   times           |---A gets A*B when D is
  5: "DEC D"  # ---|                   |   initially zero
  6: "CAL XADD"  # |---Add B to A      |
  7: "ZER D 9"  # |   D number of     |
  8: "GTO 5"  # ---|   times        ---|
  9: "END"
  # 11: PURPOSE: compute the product of two given integers.
  # 12: INPUT:   register [A] contains a positive integer;
  # 13: register [B] contains an integer
  # 14: (assume that register [D] contains 0).
  # 15: OUTPUT:  register [A] gets the product of registers
  # 16: [A] and [B].
  # 18: (EXP.AB calls this program, and it in turn calls
  # 19: XADD.AB)
  99: "END"
runs:
  - registers: { A: 3,  B: 4 }
    expect: { registers: { A: 12, B: 4, D: 0 } }
