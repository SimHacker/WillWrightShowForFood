# AB* abacus/register machine program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/XADD.AB
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Registers A-J, -9999..9999, start at 0. SET R x, DEC R, INC R, GTO x, ZER R x (jump if 0),
# CAL NAME (run NAME.AB on the same registers; recursion allowed), END (return or halt).
# See Boolos & Jeffrey, Computability and Logic (1980) ch. 6; Jeffrey, Formal Logic (1981) ch. 6.

id: pcomp-ab-xadd
name: XADD
machine: abacus
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file XADD.AB

program:
  1: "DEC B"  # ---|                         ---|
  2: "INC A"  # |---Increment A and C        |
  3: "INC C"  # |   B number of times        |
  4: "ZER B 6"  # |   while decrementing B     |
  5: "GTO 1"  # ---|                            |---Add B into A
  6: "DEC C"  # ---|                            |
  7: "INC B"  # |---Restore B and C to       |
  8: "ZER C 10"  # |   their previous values    |
  9: "GTO 6"  # ---|   before this routine      |
  10: "END"  # was invoked           ---|
  # 12: PURPOSE: compute the sum of two given integers.
  # 13: INPUT:   register [A] contains an integer;
  # 14: register [B] contains a positive integer
  # 15: (assuming that register [C] contains 0).
  # 16: OUTPUT:  register [A] contains the sum of the
  # 17: original contents of [A] and [B]
  # 19: (XMULT.AB calls this program as a subroutine,
  # 20: passing the arguments in registers [A] and [B])
  99: "END"
runs:
  - registers: { A: 3,  B: 4 }
    expect: { registers: { A: 7, B: 4, C: 0 } }
