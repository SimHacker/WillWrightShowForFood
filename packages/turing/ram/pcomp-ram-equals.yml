# RAM* program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/EQUALS.RAM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Words are strings: sign + 3 digits, as RAM* shows them. Cells not listed hold +000.
# Cell 00 is hardwired +001 (Hagelbarger's bootstrap). Ops: 0 INP 1 OUT 2 CLA 3 STO
# 4 ADD 5 SUB 6 SFT(left,right) 7 JMP 8 TAC(jump if ACC<0) 9 HRS(set PC, halt).

id: pcomp-ram-equals
name: EQUALS.RAM
machine: ram
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file EQUALS.RAM

pc: 10
memory:
  # 02: EQUALS Tester:
  # 03: Tests 2 positive integers for equality:
  # 04: A > B  ->  Print out A, then B
  # 05: B > A  ->  Print out B, then A
  # 06: A = B  ->  Print out 0
  # 08: PC starts at  10.
  10: "+030"  # read in A to 30
  11: "+031"  # read in B to 31
  12: "+230"  # ---   clear ACC & add A
  13: "+531"  # |   subtract B from A
  14: "+820"  # |   test ACC:  + -> go on to 15; - -> jump to 20 (A < B)
  15: "+500"  # |   subtract 1 from ACC
  16: "+823"  # ---   test ACC:  + -> go on to 17 (B < A); - -> jump to 23 (A = B)
  17: "+130"  # --|
  18: "+131"  # |-- A > B
  19: "+910"  # --|
  20: "+131"  # ---
  21: "+130"  # |-- A < B
  22: "+910"  # ---
  23: "+132"  # -- A = B
  24: "+910"
runs:
  - input: [5, 3]
    expect: { halt: true, output: [5, 3] }
  - input: [3, 5]
    expect: { halt: true, output: [5, 3] }
  - input: [4, 4]
    expect: { halt: true, output: [0] }
