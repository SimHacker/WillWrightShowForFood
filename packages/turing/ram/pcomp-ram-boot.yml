# RAM* program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/BOOT.RAM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Words are strings: sign + 3 digits, as RAM* shows them. Cells not listed hold +000.
# Cell 00 is hardwired +001 (Hagelbarger's bootstrap). Ops: 0 INP 1 OUT 2 CLA 3 STO
# 4 ADD 5 SUB 6 SFT(left,right) 7 JMP 8 TAC(jump if ACC<0) 9 HRS(set PC, halt).

id: pcomp-ram-boot
name: BOOT.RAM
machine: ram
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file BOOT.RAM

pc: 0
memory:
  # 01: BOOTSTRAP  PROGRAM:
  # 02: For loading instructions
  # 03: from  Input  into memory.
  # 06: The bootstrap is just the
  # 07: "001" hardwired into memory cell 00
  # 08: (due to David Hagelbarger, Bell Laboratories).
  # 10: PC must start at memory cell  00.
  # 13: Bootstrap  INPUT  format example:
  # 15: 002  -For
  # 16: 700  - Boot.
  # 17: 010  -memory address, for
  # 18: 030  -program instruction.
  # 19: 011  -address
  # 20: 031  -instruction
  # 21: 012  -address
  # 22: 230  -instruction
  # 23: 013  -address                     = ADD.RAM program
  # 24: 431  -instruction
  # 25: 014  -address
  # 26: 332  -instruction
  # 27: 015  -address
  # 28: 132  -instruction
  # 29: 016  -address
  # 30: 910  -instruction
  # 33: -See  also  FBOOT.RAM
runs:
  - input: [2, 700, 10, 30, 11, 31, 12, 230, 13, 431, 14, 332, 15, 132, 16, 910]
    pc: 0
    why: "The slow-boot input stream in the listing: loads ADD.RAM into 10-16"
    expect: { stop: input-exhausted }
    expect_memory: { 10: "+030", 11: "+031", 12: "+230", 13: "+431", 14: "+332", 15: "+132", 16: "+910" }
