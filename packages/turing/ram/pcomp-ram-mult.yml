# RAM* program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/MULT.RAM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Words are strings: sign + 3 digits, as RAM* shows them. Cells not listed hold +000.
# Cell 00 is hardwired +001 (Hagelbarger's bootstrap). Ops: 0 INP 1 OUT 2 CLA 3 STO
# 4 ADD 5 SUB 6 SFT(left,right) 7 JMP 8 TAC(jump if ACC<0) 9 HRS(set PC, halt).

id: pcomp-ram-mult
name: MULT.RAM
machine: ram
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file MULT.RAM

pc: 10
memory:
  # 01: Multiplies two integers.
  # 02: Input:  first number may be any integer within range,
  # 03: but the second must be a positive integer.
  10: "+030"  # (30)<-input         | A=input
  11: "+604"  # ACC<-(ACC)/10000    |
  12: "+331"  # (31)<-(ACC)         | Z=0
  13: "+032"  # (32)<-input         | B=input
  14: "+232"  # ACC<-(32)           |            --------|
  15: "+500"  # ACC<-(ACC)-10       |                    |
  16: "+332"  # (32)<-(ACC)         | --B                |---Add A to Z,
  17: "+822"  # goto 22, if (ACC)<0 | If B<0, goto (22)  |   B times.
  18: "+231"  # ACC<-(31)           |                    |
  19: "+430"  # ACC<-(ACC)+(30)     |                    |
  20: "+331"  # (31)<-(ACC)         | Z=Z+A              |
  21: "+714"  # goto 14             | Goto (14)  --------|
  22: "+131"  # output (31)         | Output Z
  23: "+910"  # PC<-10 and quit     | Quit
runs:
  - input: [6, 7]
    expect: { halt: true, output: [42] }
  - input: [-3, 5]
    expect: { halt: true, output: [-15] }
