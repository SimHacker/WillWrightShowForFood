# RAM* program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/COUNTDN.RAM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Words are strings: sign + 3 digits, as RAM* shows them. Cells not listed hold +000.
# Cell 00 is hardwired +001 (Hagelbarger's bootstrap). Ops: 0 INP 1 OUT 2 CLA 3 STO
# 4 ADD 5 SUB 6 SFT(left,right) 7 JMP 8 TAC(jump if ACC<0) 9 HRS(set PC, halt).

id: pcomp-ram-countdn
name: COUNTDN.RAM
machine: ram
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file COUNTDN.RAM

pc: 11
memory:
  # 01: COUNTDOWN  Program
  # 02: Counts down from negative integer in cell 10,
  # 03: outputting each successive smaller integer until 0.
  # 06: (Demonstrates Conditional Jump instruction 8)
  # 08: PC starts at cell  11.
  10: "-005"  # =  countdown kernel (a negative integer)
  11: "+210"  # kernel to ACC
  12: "+400"  # add 01                             <-----------
  13: "+309"  # store ACC in cell 09                          |
  14: "+109"  # output cell 09                                |
  15: "+812"  # test ACC:  + -> go on to 16; - -> jump to 12 --  = branch point
  16: "+911"  # halt & reset to cell 11
  # 18: (For Unconditional Jump instruction 7, see COUNTUP.RAM)
runs:
  - input: []
    expect: { halt: true, output: [-4, -3, -2, -1, 0] }
