# RAM* program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/FBOOT.RAM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Words are strings: sign + 3 digits, as RAM* shows them. Cells not listed hold +000.
# Cell 00 is hardwired +001 (Hagelbarger's bootstrap). Ops: 0 INP 1 OUT 2 CLA 3 STO
# 4 ADD 5 SUB 6 SFT(left,right) 7 JMP 8 TAC(jump if ACC<0) 9 HRS(set PC, halt).

id: pcomp-ram-fboot
name: FBOOT.RAM
machine: ram
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file FBOOT.RAM

pc: 3
memory:
  3: "+004"  # (= PC starting setting: 03)          FAST BOOTSTRAP PROGRAM:
  # 04: <------                        For loading instructions
  5: "+204"  # CLA         |                        from  Input  into memory.
  6: "+400"  # ADD 1       |
  7: "+304"  # STO         |
  8: "+704"  # ------                      INPUT  format example:
  # 09: 010   = First memory address
  # 10: 030    --
  # 11: 031     |
  # 12: 230     |
  # 13: 431     |  =  ADD.RAM program
  # 14: 332     |
  # 15: 132     |
  # 16: 910    --
  # 17: [blank]
  # 21: RAM* also has a "hardwired" SLOW BOOTSTRAP:
  # 22: just the "001" in memory cell 00 (due to
  # 23: David Hagelbarger, Bell Laboratories).
  # 25: Slow bootstrap  INPUT  format example:
  # 26: 002  -For Slow
  # 27: 700  - Boot.
  # 28: 010  -memory address, for
  # 29: 030  -program instruction.
  # 30: 011  -address
  # 31: 031  -instruction
  # 32: 012  -address
  # 33: 230  -instruction
  # 34: 013  -address                  =  ADD.RAM program
  # 35: 431  -instruction
  # 36: 014  -address
  # 37: 332  -instruction
  # 38: 015  -address
  # 39: 132  -instruction
  # 40: 016  -address
  # 41: 910  -instruction
  # 42: [blank]
  # 44: PC must start at memory cell  00  for Slow Boot.
  # 48: Slow Boot can be used to load Fast Boot,
  # 49: and Fast Boot in turn used to load, e.g.,
  # 50: ADD.RAM .
runs:
  - input: [10, 30, 31, 230, 431, 332, 132, 910]
    why: "The fast-boot input stream in the listing: loads ADD.RAM into 10-16"
    expect: { stop: input-exhausted }
    expect_memory: { 10: "+030", 11: "+031", 12: "+230", 13: "+431", 14: "+332", 15: "+132", 16: "+910" }
