# RAM* program, recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/ADD.RAM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
# Words are strings: sign + 3 digits, as RAM* shows them. Cells not listed hold +000.
# Cell 00 is hardwired +001 (Hagelbarger's bootstrap). Ops: 0 INP 1 OUT 2 CLA 3 STO
# 4 ADD 5 SUB 6 SFT(left,right) 7 JMP 8 TAC(jump if ACC<0) 9 HRS(set PC, halt).

id: pcomp-ram-add
name: ADD.RAM
machine: ram
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file ADD.RAM

pc: 10
memory:
  # 02: PUPOSE: Add two integers.
  # 03: INPUT:  two integers.
  # 04: OUTPUT: sum of the two integers.
  10: "+030"  # (30)<-input      |  A=input
  11: "+031"  # (31)<-input      |  B=input
  12: "+230"  # ACC<-(30)        |
  13: "+431"  # ACC<-(ACC)+(31)  |  C=A+B
  14: "+332"  # (32)<-(ACC)      |
  15: "+132"  # output (32)      |  output C
  16: "+910"  # PC<-10 and quit  |  quit
  # 20: (See also  MULT.RAM)
runs:
  - input: [3, 4]
    expect: { halt: true, output: [7] }
  - input: [-5, 12]
    expect: { halt: true, output: [7] }
