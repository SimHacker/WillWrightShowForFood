# Binary counter. Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/BCOUNT.TM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
# -------------------------------------------------------
# PURPOSE:
#    Counts up in binary, indefinitely.
# STARTING POSITION:
#    The read/write head can initially point to the
#    1 on an otherwise all zero tape, or anywhere to
#    the left of the 1.
# INITIAL STATE:
#    State 1
# -------------------------------------------------------

id: pcomp-bcount
name: Binary counter
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file BCOUNT.TM

blank: "0"
symbols: ["0", "1"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: none }

states:
  q1:
    "0": { write: "0", move: R, next: q1 }  # find the end-marker of the number
    "1": { write: "1", move: L, next: q2 }  # keep the end-marker and continue the count
  q2:
    "0": { write: "1", move: R, next: q1 }  # place the next 1 on the correct digit to count up
    #      (this is like carrying the 1 to add by 1)
    "1": { write: "0", move: L, next: q2 }  # zero the rightmost consecutive 1's to place the next
    #      carry to the right digit
  q0: {}
