# 5-state busy beaver contender, Marxen 1989. Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/BB5.TM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
#   4,098 ones on an initially all-zero tape, before
#   it halts.
#   Total tape excursion = 6,145 squares, so it
#   should be started on TM*'s 10,000 square tape
#   at around - 2,000 squares to the left of square
#   zero.
#   (For a 2-state Busy-Beaver, and
#    references with information on
#    the Busy-Beaver concept, see
#    BUSY2.TM  on TM*)

id: pcomp-bb5
name: 5-state busy beaver contender, Marxen 1989
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file BB5.TM

blank: "0"
symbols: ["0", "1"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: none }

states:
  q1:
    "0": { write: "1", move: L, next: q2 }  #   This is a contender for the title of 5-state
    "1": { write: "1", move: L, next: q1 }  #   Busy-Beaver, as of August 1989.
  q2:
    "0": { write: "1", move: R, next: q3 }  #   It was devised by a program devised by
    "1": { write: "1", move: R, next: q2 }  #   Heiner Marxen (Technical University of Berlin),
  q3:
    "0": { write: "1", move: L, next: q1 }  #   who reported it to Allen Brady (Univ Nevada),
    "1": { write: "1", move: R, next: q4 }  #   who passed it on to A. K. Dewdney, who announced
  q4:
    "0": { write: "1", move: L, next: q1 }  #   a related machine in Dec 1989 SCIENTIFIC
    "1": { write: "1", move: R, next: q5 }  #   AMERICAN.
  q5:
    "0": { write: "1", move: R, next: q0 }
    "1": { write: "0", move: R, next: q3 }  #   This machine takes 11,798,826 steps to print out
  q0: {}
