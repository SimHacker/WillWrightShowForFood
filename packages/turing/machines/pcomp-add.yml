# Unary add. Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/ADD.TM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
# -------------------------------------------------------
# PURPOSE:
#    Add two positive unary numbers separated by a 0,
#    on an otherwise all zero tape.  The addition is
#    performed by simply connecting the two numbers
#    by moving the leftmost 1 of the first number to
#    the 0 that separates the two integers.
# STARTING POSITION:
#    The read/write head must initially point to the
#    leftmost 1, or anywhere to the left of it.
# INITIAL STATE:
#    State 1
# -------------------------------------------------------

id: pcomp-add
name: Unary add
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file ADD.TM

blank: "0"
symbols: ["0", "1"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: none }

states:
  q1:
    "0": { write: "0", move: R, next: q1 }  # find the leftmost 1
    "1": { write: "0", move: R, next: q2 }  # clear the leftmost 1
  q2:
    "0": { write: "1", move: L, next: q0 }  # replace the 0 that was initially between the two unary
    #      integers with a 1
    "1": { write: "1", move: R, next: q2 }  # find the 0 separating the two unary integers
  q0: {}
