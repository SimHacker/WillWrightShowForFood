# Unary square. Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/SQUARE.TM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
# -------------------------------------------------------
# PURPOSE:
#    Given N contiguous 1's on an otherwise all
#    zero tape, compute N-square by printing N-square
#    number of contiguous 1's (N must be greater than 0)
#    Roughly, the program copies
#    the N 1's, N number of times; then it
#    cleans up the tape of all its "note taking,"
#    leaving only the N-square number of 1's
#    on the tape.
# STARTING POSITION:
#    The read/write head can initially point to any
#    one of the 1's.
# INITIAL STATE:
#    State 1
# -------------------------------------------------------
# EXAMPLE:
#    input:  ...000^111000...
#    output: ...000111111111^000...
#    (That is, 3-square equals 9.)

id: pcomp-square
name: Unary square
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file SQUARE.TM

blank: "0"
symbols: ["0", "1", "A", "C", "S", "X", "Y"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: none }

states:
  q1:
    "1": { write: "1", move: L, next: q1 }  # Place an S to the imediate      ---|
    "?": { write: "S", move: R, next: q2 }  #    left of the series of ones.     |
  q2:
    "1": { write: "X", move: R, next: q3 }  # Mark the first count of copying.   |--INITIAL SETUP
  q3:
    "1": { write: "1", move: R, next: q3 }  # Point to the rightmost 1 and start |
    "?": { write: "?", move: L, next: q4 }  #    making multiple copies of the   |
    #    original series of ones.     ---|
  q4:
    "Y": { write: "Y", move: L, next: q4 }  # -----|
    "A": { write: "A", move: L, next: q4 }  #      |
    "C": { write: "C", move: L, next: q4 }  #      |
    "1": { write: "C", move: R, next: q5 }  #      |
    "X": { write: "Y", move: R, next: q5 }  #      |---Append a copy of the original N number of
    "S": { write: "S", move: R, next: q6 }  #      |   ones to the right.
  q5:
    "A": { write: "A", move: R, next: q5 }  #      |
    "Y": { write: "Y", move: R, next: q5 }  #      |
    "C": { write: "C", move: R, next: q5 }  #      |
    "?": { write: "A", move: L, next: q4 }  # -----|
  q6:
    "Y": { write: "X", move: R, next: q6 }  # --------|
    "C": { write: "X", move: R, next: q7 }  #         |
    "A": { write: "A", move: L, next: q8 }  #         |---Do the above copy N number of times.
  q7:
    "C": { write: "1", move: R, next: q7 }  #         |
    "A": { write: "A", move: L, next: q4 }  # --------|
  q8:
    "Y": { write: "0", move: L, next: q8 }  # -----|
    "X": { write: "0", move: L, next: q8 }  #      |
    "S": { write: "0", move: R, next: q9 }  #      |
  q9:
    "0": { write: "0", move: R, next: q9 }  #      |---Clean up so that only the N-square number
    "A": { write: "1", move: R, next: q10 }  #      |   of ones remain on the tape.
  q10:
    "A": { write: "1", move: R, next: q10 }  #      |
    "?": { write: "?", move: N, next: q0 }  # -----|
  q0: {}
