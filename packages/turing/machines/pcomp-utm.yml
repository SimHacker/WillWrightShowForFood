# PCOMP Universal Turing Machine (after Minsky ch. 6-7). Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/UTM.TM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
# -------------------------------------------------------
#  Universal Turing Machine:
#  a TM that can simulate any TM
#  described on its input tape.
#  This file is identical with the UTM
#  invoked from TM* main menu by switching
#  to "UTM mode."
#  See Help in UTM mode for input tape format, etc.
# -------------------------------------------------------

id: pcomp-utm
name: PCOMP Universal Turing Machine (after Minsky ch. 6-7)
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file UTM.TM

blank: "0"
symbols: ["0", "1", "A", "B", "M", "S", "X", "Y"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: standard }

states:
  q1:
    "Y": { write: "Y", move: R, next: q2 }
    "0": { write: "A", move: L, next: q1 }
    "1": { write: "B", move: L, next: q1 }
    "?": { write: "?", move: L, next: q1 }
  q2:
    "X": { write: "X", move: R, next: q7 }
    "A": { write: "0", move: R, next: q3 }
    "B": { write: "1", move: R, next: q4 }
    "?": { write: "?", move: R, next: q2 }
  q3:
    "0": { write: "A", move: L, next: q5 }
    "1": { write: "B", move: R, next: q6 }
    "?": { write: "?", move: R, next: q3 }
  q4:
    "0": { write: "A", move: R, next: q6 }
    "1": { write: "B", move: L, next: q5 }
    "?": { write: "?", move: R, next: q4 }
  q5:
    "Y": { write: "Y", move: R, next: q2 }
    "?": { write: "?", move: L, next: q5 }
  q6:
    "X": { write: "X", move: L, next: q1 }
    "Y": { write: "Y", move: R, next: q0 }
    "?": { write: "?", move: R, next: q6 }
  q7:
    "0": { write: "A", move: L, next: q8 }
    "1": { write: "B", move: L, next: q9 }
    "?": { write: "?", move: R, next: q7 }
  q8:
    "Y": { write: "Y", move: R, next: q11 }
    "?": { write: "?", move: L, next: q8 }
  q9:
    "Y": { write: "Y", move: R, next: q10 }
    "?": { write: "?", move: L, next: q9 }
  q10:
    "0": { write: "B", move: R, next: q12 }
    "1": { write: "B", move: R, next: q12 }
    "X": { write: "X", move: L, next: q13 }
    "?": { write: "?", move: R, next: q10 }
  q11:
    "0": { write: "A", move: R, next: q12 }
    "1": { write: "A", move: R, next: q12 }
    "X": { write: "X", move: L, next: q14 }
    "?": { write: "?", move: R, next: q11 }
  q12:
    "X": { write: "X", move: R, next: q7 }
    "?": { write: "?", move: R, next: q12 }
  q13:
    "M": { write: "B", move: R, next: q15 }
    "?": { write: "?", move: L, next: q13 }
  q14:
    "M": { write: "A", move: R, next: q15 }
    "?": { write: "?", move: L, next: q14 }
  q15:
    "A": { write: "0", move: R, next: q15 }
    "B": { write: "1", move: R, next: q15 }
    "X": { write: "X", move: R, next: q16 }
    "?": { write: "?", move: R, next: q15 }
  q16:
    "0": { write: "0", move: L, next: q17 }
    "1": { write: "1", move: L, next: q17 }
    "?": { write: "?", move: R, next: q16 }
  q17:
    "A": { write: "0", move: L, next: q17 }
    "B": { write: "1", move: L, next: q17 }
    "0": { write: "S", move: L, next: q18 }
    "1": { write: "S", move: L, next: q19 }
    "?": { write: "?", move: L, next: q17 }
  q18:
    "A": { write: "0", move: L, next: q21 }
    "B": { write: "0", move: R, next: q20 }
    "?": { write: "?", move: L, next: q18 }
  q19:
    "A": { write: "1", move: L, next: q21 }
    "B": { write: "1", move: R, next: q20 }
    "?": { write: "?", move: L, next: q19 }
  q20:
    "0": { write: "M", move: R, next: q22 }
    "1": { write: "M", move: R, next: q23 }
    "?": { write: "?", move: R, next: q20 }
  q21:
    "0": { write: "M", move: R, next: q22 }
    "1": { write: "M", move: R, next: q23 }
    "?": { write: "?", move: L, next: q21 }
  q22:
    "S": { write: "A", move: L, next: q1 }
    "?": { write: "?", move: R, next: q22 }
  q23:
    "S": { write: "B", move: L, next: q1 }
    "?": { write: "?", move: R, next: q23 }
  q0: {}
