# Unary equality test (patched). Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/EQUALS.TM
# The file names itself "COMPARE.TM".
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
# -------------------------------------------------------
# PURPOSE
#    Accepts two positive nonzero integers in unary
#    notation, separated by one zero (all other
#    symbols on the tape must be zeroes).
#    If the two positive integers are equal,
#    then the machine halts pointing to a zero;
#    else the machine halts pointing to a one.
# STARTING POSITION
#    The read/write head must initially point to the
#    zero separating the two integers.
# INITIAL STATE
#    State 1
# -------------------------------------------------------

id: pcomp-equals-patched
name: Unary equality test (patched)
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file EQUALS.TM

blank: "0"
symbols: ["0", "1"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: none }
patches:
  - { state: q7, read: "1", disk: "1 0 L 0", here: "1 1 N 0" }
    # On the disk, a left number exactly one more than the right halts on a 0 (reads as equal): 2/1, 3/2, 4/3 ... State 7 erased the extra 1 and stepped off it. Halting on the 1 instead is right for every a, b in 1..7.

states:
  q1:
    "0": { write: "0", move: L, next: q1 }  # scan-left for 1           ---
    "1": { write: "0", move: L, next: q2 }  # erase 1, go left            |
  q2:
    "0": { write: "0", move: R, next: q6 }  # exit loop, go right         |
    "1": { write: "1", move: R, next: q3 }  # stay in loop, go right      |
  q3:
    "0": { write: "0", move: R, next: q3 }  # scan-right for 1            |----within loop
    "1": { write: "0", move: R, next: q4 }  # erase 1, go right           |
  q4:
    "0": { write: "0", move: L, next: q7 }  # exit loop, go left          |
    "1": { write: "1", move: L, next: q5 }  # stay in loop, go left       |
  q5:
    "0": { write: "0", move: L, next: q1 }  # go left, start all over     |
    "1": { write: "1", move: N, next: q5 }  # (ignore this)             ---
  q6:
    "0": { write: "0", move: R, next: q6 }  # scan right for 1          ---
    "1": { write: "0", move: R, next: q0 }  # erase 1, go right, HALT     |----out of loop
  q7:
    "0": { write: "0", move: L, next: q7 }  # scan left for 1             |
    "1": { write: "1", move: N, next: q0 }  # erase 1, go left, HALT    ---  [patched; disk has '1 0 L 0']
  q0: {}
