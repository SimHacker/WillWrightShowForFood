# 2-state busy beaver. Recovered from the PCOMP course disk: characters/christopher-cherniak/sources/pcomp/disk/BUSY2.TM
# Generated by packages/turing/scripts/pcomp.py convert. Comments are Cherniak's, verbatim.
#
# A 2-state Busy-Beaver is a Turing machine with 2
# states that prints the greatest possible number of
# ones on an initially all zero tape and then halts.
# This 2-state Busy-Beaver takes 6 steps to print
# 4 ones.
# (For more information about Busy-Beavers, see
#  "Computer Recreations," Scientific American,
#  August 1984 and March & April 1985.)
#  See also  BB5.TM  on TM*

id: pcomp-busy2
name: 2-state busy beaver
credits:
  - Christopher Cherniak, PCOMP, Philosophy and Computers, University of Maryland
  - UMD Philosophy Dept. CogSci Courseware Project, Turbo Pascal 4.0, v2.0 June 1990
  - Source file BUSY2.TM

blank: "0"
symbols: ["0", "1"]
wildcard: "?"   # TM*: as read, every symbol not listed in this state; as write, leave the cell
start: q1
halt: [q0]
missing: error  # TM* stops with 'ERROR:state ...' when a state has no row for the scanned symbol
bounds: [-5000, 5000]  # TM*'s tape; leaving it is an error
universality: { kind: none }

states:
  q1:
    "0": { write: "1", move: R, next: q2 }
    "1": { write: "1", move: L, next: q2 }
  q2:
    "0": { write: "1", move: L, next: q1 }
    "1": { write: "1", move: L, next: q0 }
  q0: {}
