# 👁️ packages/turing — Cherniak-class TM, YAML Jazz machines, many UIs
what: |
  Library + thin CLI + web UI for single-tape Turing machines.
  Descended from Christopher Cherniak's TM* (PCOMP, Philosophy and Computers, UMD).
  The PCOMP course disk is recovered: its machines, UTM, tapes, RAM* and AB* programs
  are here as pcomp-*.yml, verified against the disk's own claims (PCOMP.md).
  Also ships Minsky 7×4 (standard UTM), Wolfram 2×3 (weak UTM), and student machines.
why: comments on the floor plan are the programming language
split:
  turing/: "the library — no UI"
  machines/: "floor plans (never change during a run)"
  tapes/: "pictured cells + head + regions + provenance"
  ram/: "PCOMP RAM* (CARDIAC-style) programs"
  abacus/: "PCOMP AB* register-machine programs"
  scripts/pcomp.py: "disk -> YAML converter, TM/RAM/AB steppers, verify"
  web/: "one UI; others should import the library, not this page"
k_line: LOAD MACHINE · LOAD TAPE · STEP
