bio:
  summary: "**Art Medlar** — a veteran software engineer with a rare résumé of foundational systems. He **co-developed WAIS** (Wide Area Information Servers, an early internet search system) and the **early Internet Archive**; began at **Thinking Machines** in the late 1980s programming massively parallel **Connection Machines**; did **operating-systems R&D at Xerox PARC** in the 1990s; and was **principal engineer at Brightmail** (San Francisco anti-spam), taking it from a napkin sketch through full-scale deployment to its 2004 acquisition by Symantec. Later **CIO at Local Power** (community-choice-aggregation modeling). Don works with Art at **Leela AI**."
  don_note: "Don: 'Art Medlar, who I work with at Leela and is awesome.' A builder's builder — great at making things and understanding large complex systems."

why_invited:
  builder: "Firsthand across four eras of infrastructure — massively parallel computing, PARC OS research, one of the internet's first search systems, the early Internet Archive, and shipping a product to acquisition."
  internet_history: "A living primary source on WAIS and the early Internet Archive — how search and preservation on the internet actually started."
  leela: "A current Leela AI collaborator — part of the crew showing what modern visual-intelligence AI looks like in practice."

