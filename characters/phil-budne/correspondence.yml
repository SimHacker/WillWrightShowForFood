    date: "1990-03-16"
    public: false
    what: "Don, at UMD, told uunet he got Rick Adams's FTP from Phil and was running it on tumtum."
  pizzatool:
    date: "1990-10-24"
    public: false
    what: "Don (Sun) posted about Ben Stoltz's PizzaTool; Phil (Shiva) replied 'Mind if I forward this?'"
  type340_via_lars:
    date: "2020-03-17"
    public: false
    what: "Lars to Don: 'Actually Phil Budne did most of the work. He wrote the emulator for the PDP-6/10. I added the PDP-7 parts.'"
