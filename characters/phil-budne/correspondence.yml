    date: "2026-11-25"
    what: "Facebook friends. First DM: Cabinet's 340 from his code, Ultimate Hand, Forth Day video, PDP-7 UNIX in Cabinet. Follow-ups: the tools core and MIDAS macros; Cambridge-to-as7 translation and a multi-dialect assembler; Mitch's metacompiler in TypeScript on Korz."
