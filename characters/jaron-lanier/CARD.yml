- id: DATA-DIGNITY-REPO
  name: Data Dignity · Repo Show
  type: activated
  mana: "{W}{W}"
  conditions:
  - segment_topic_in: [data-dignity, repossession, repo-show, anti-sharecropping]
  - audience_ready_for: medium_not_just_topic
  advertisement:
    method: dataDignityRepoShow
    signature: dataDignityRepoShow(signedCommit) → authorship in the file format
    score_when:
    - trigger: siren_server_named_and_countered
      weight: 0.95
    - trigger: audience_understands_why_repo_is_stage
      weight: 0.93
    - trigger: relationship_matrix_edge_active
      edge: jaron-lanier → will-wright
      theme: data_portability
      weight: 0.88
  effect: Spell — signed commits = data dignity concrete. No siren server. Instruments you fork, not apps you rent.
  verifiable: Who Owns the Future?; invitation.md repo-medium paragraph
  combos_with:
  - WILL-DATA-PORTABILITY

- id: VR-AS-INSTRUMENT
  name: VR as Instrument
  type: activated
  mana: "{G}{G}{U}"
  conditions:
  - segment_topic_in: [generative-performance, music, vr-input, eno, laurie-anderson]
  - performance_space_active: true
  advertisement:
    method: vrAsLiveInstrument
    signature: vrAsLiveInstrument(controller) → post-symbolic expression
    score_when:
    - trigger: audience_sees_instrument_not_app
      weight: 0.91
    - trigger: avant_garde_ensemble_present
      weight: 0.89
  effect: Play VR/input devices as expressive instruments — DataGlove, rare acoustics, ensemble generative performance.
  verifiable: Dawn of the New Everything; public performance history
  combos_with:
  - BRIAN-GENERATIVE

- id: BODY-REMEMBERS
  name: The Body Remembers
  type: emote
  mana: "{1}"
  conditions:
