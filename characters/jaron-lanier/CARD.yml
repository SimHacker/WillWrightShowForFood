  verifiable: Jaron quote in Don's pie-menu materials
  combos_with:
  - DON-PIE-MENU

- id: DORMOUSE-THREAD
  name: The Dormouse Thread
  type: triggered
  mana: "{W}{B}"
  conditions:
  - segment_type: memorial
  - segment_topic_in: [marvin-minsky, engelbart, ai-vs-ia, tech-ethics]
  advertisement:
    method: dormouseThread
    signature: dormouseThread() → Engelbart's challenge to Minsky, told by a friend of both camps
    score_when:
    - trigger: ai_vs_augmentation_debate_grounded
      weight: 0.93
    - trigger: family_and_students_share_stage
      weight: 0.88
  effect: Reaction — memorial discussant who loved Marvin AND documented the hardest question anyone asked him ('What are you going to do for the people?'); keeps the memorial honest, not hagiographic.
  verifiable: American Scientist review of Markoff's What the Dormouse Said; sources/
  combos_with:
  - MENTOR-CONSTELLATION
  - TWIN-PROVENANCE

