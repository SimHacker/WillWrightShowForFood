  combos_with:
  - CHUCK-LEAD-BE-PROGRAMMER

- id: UI-ALL-THE-WAY
  name: UI All the Way Down
  type: activated
  mana: "{U}{U}{U}{G}"
  conditions:
  - segment_topic_in: [body-electric, bounce, scenegraph, knowledge-base, rebounce]
  - quote_ready: 1999_jaron_don_email
