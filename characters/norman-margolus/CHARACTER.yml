bio:
  summary: |
    **Norman Margolus** is a Canadian-American physicist and computer scientist (MIT PhD in physics,
    1987, under **Edward Fredkin**), a research affiliate at **MIT CSAIL**, known for foundational
    work on **cellular automata** and **reversible computing**. With **Tommaso Toffoli** he built
    the **CAM-6** cellular-automata machine and co-wrote ***Cellular Automata Machines: A New
    Environment for Modeling*** (MIT Press, 1987) — the book and hardware that taught a generation
    (including Don) to *do* CA. He invented the **block cellular automaton** and the **Margolus
    neighborhood**, built reversible, universal CA simulations of **billiard-ball computers**
    (the **Critters** rule), and — with **Lev Levitin** — proved the **Margolus–Levitin theorem**,
    a fundamental physical speed limit on computation. He helped organize the seminal 1982
    **Physics & Computation** meeting, worked with **Tom Knight** on the "Flattop" billiard-ball
    chip, contributed to early **reversible quantum gate** logic, and founded the storage company
    **Permabit**. Recurring themes: **computronium** and **programmable matter** — computing as
    physics, physics as computing.
  known_for:
    - "CAM-6 cellular-automata machine + *Cellular Automata Machines* (with Tommaso Toffoli, 1987)"
    - "Block cellular automata + the Margolus neighborhood; the Critters rule"
    - "Reversible & universal cellular automata; billiard-ball computers"
    - "Margolus–Levitin theorem (physical speed limit of computation, with Lev Levitin)"
    - "Reversible computing; computronium / programmable matter; Permabit"

connections:
  cam6_kinship: "The direct link: Don built a **CAM6 simulator** — software-compatible with Toffoli & Margolus's *Cellular Automata Machines* book and CAM-6 hardware. **C emulator + Mitch Bradley's Sun Forth** compiled book Forth rules into **saved lookup tables**; **CAM6.js** imported those tables, then rewrote **rules and the rule compiler in JS**. Same lookup-table contract throughout; no embedded Forth in the shipped JS version."
  minsky_brothers: "**Milan and Henry Minsky** — from the **MIT AI Lab** — introduced Don to Norman. They are the natural bridge for the invitation, and the doorway into the whole Fredkin–Toffoli–Knight / AI-Lab nexus."
  tailored_demo: "Don made a **long-form CAM6 demo tailored for Norman as the audience** — narrating what he did with Norman's book and his emulation of Norman's hardware, taking the rules into the storytelling realm. Video: https://www.youtube.com/watch?v=LyLMHxRNuck"
  playground_permission: "**Norman has already given Don permission** to take chapters from *Cellular Automata Machines* and build **interactive playgrounds** around particular sections and rules. Act 2 of the show: design a ground-up **modular** CAM6 (easier than breaking down the monolith), picking a chapter live — Don's bias is the physical sims (billiard balls, spin glasses/Ising, lattice gases on the Margolus neighborhood)."
  dla: "**Diffusion-Limited Aggregation** — Don has a working **DLA** simulation right out of the book (*Cellular Automata Machines* p. 167, §15.7), the **Margolus-dendrite** rule, running on Don's Margolus-neighborhood engine with the identical FORTH-generated lookup table. A direct, live-runnable Margolus artifact to show Norman."
  mit_nexus: "MIT CSAIL; the Fredkin–Toffoli–Knight reversible-computing lineage — part of the broader MIT AI/CS nexus the Minskys connect into."
  generative_kinship: "Cellular automata as a shared language with Scott Draves (generative art) and Jim Crutchfield (edge of chaos, evolving CA)."

