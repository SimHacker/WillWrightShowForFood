bio:
  summary: |
    **Wesley A. Clark** (1927–2016) designed the **LINC** (1962) — a small computer biomedical
    researchers could assemble and run themselves — which Kay cites as an early personal computer
    and a precedent for individual computing. His **TX-2** at Lincoln Lab hosted Ivan Sutherland's
    **Sketchpad**. Later Washington University and consulting. July 2026 Alan Kay digests in-repo
    also touch Wes Clark / PDP-8 / Popplestone adjacency on the PIXIE thread.

