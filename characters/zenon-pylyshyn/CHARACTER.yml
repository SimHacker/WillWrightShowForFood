bio:
  summary: |
    **Zenon Walter Pylyshyn** (1937–2022) was a Canadian cognitive scientist and philosopher.
    Engineering Physics (McGill), MSc in Control Systems and PhD in Experimental Psychology
    (Saskatchewan). Professor at **Western University (UWO)** 1966–1994 — in Psychology, Computer
    Science, Philosophy, and Electrical Engineering — and director of the UWO Centre for Cognitive
    Science. In 1994 he became Board of Governors Professor at **Rutgers** and founding director of
    the **Center for Cognitive Science (RuCCS)**. Known for foundational work on **cognition and
    computation**, the critique of mental imagery as pictorial, and **visual indexing ("FINST")
    theory** of visual attention and tracking. FRSC (1998); Jean Nicod Prize (2004); Donald O. Hebb
    Award.

memorial:
  mode: represent_and_discuss
  who_can_discuss:   # documented connections only — NOT invitations until they accept
    - { who: roy-eagleson, why: "His PhD student at UWO; can speak first-hand to his teaching and lineage" }
  lineage_note: |
    Roy reports Pylyshyn's postdoc advisors were Allen Newell and John McCarthy, and that Pylyshyn
    directed the CIFAR AI & Robotics program that hired Geoffrey Hinton, and (with Jerry Fodor) was
    a noted critic of connectionism. These figures are context, not characters in this show.

