# Tiny Life — site snapshot (primary sources 2026-07-08)

meta:
  site: https://tinylifegame.com/
  wiki: https://wiki.tinylifegame.com/wiki/Main_Page
  docs: https://docs.tinylifegame.com/
  engine: MonoGame
  status: Early Access (0.50.0 gardening/foraging — Jun 2026 devlog)

game:
  pitch: Isometric pixel life sim — households, needs, skills, relationships, open world
  share:
    - Export/import households and lots with story descriptions
    - Steam Workshop for lots, households, worlds, C# mods
  modding: C# modding API; Example Mod; docs accept community PRs for tutorials
  worlds: Maple Plains City, Lunar Grove, Lavender Park, Demoville + custom maps
  inclusivity: Queer-led; pronoun/gender/reproductive independence; Safe In Our World partner

contrast_sims_legacy:
  tiny_life_has: Workshop + export/import + mod API + story text on shared content
  sims1_legacy_lacks: Exchange button, upload hooks, Sims Creator (see legacy-collection-exchange-gap research)

praise_on_site:
  don_hopkins: "retro pixel … re-interpretation of The Sims 1 … stands on its own … mesmerizing soundtrack"
  plumbella: "makes me feel the way that The Sims 1 did"
  james_turner: "what we know and what we love (formerly The Sim Supply)"

distribution:
  workshop: Subscribe button → loads from Steam
  manual: Mods zip → Mods/; lots/households json → respective folders; maps zip → Custom Maps/
  github_federation: |
    Soul City indexes Workshop items + git-native mod repos as CARD metadata — federate through
    Soul City soul-file lane; does not replace Ell's Workshop; drives players to buy Tiny Life.

see_also:
  ../../../repo-shows/will-wright-premiere/game-bridge-sims-tiny-life.yml
