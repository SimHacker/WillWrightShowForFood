bio:
  summary: |
    **Ell** (handle **Ellpeck**) built [**Tiny Life**](https://tinylifegame.com/) as a project of love:
    households, needs, skills, relationships, and an open world where off-screen Tinies keep living.
    Visual lineage cites RollerCoaster Tycoon 2; gameplay cites The Sims 4; player memory cites The Sims 1.
    Sharing is first-class — export/import, embedded story descriptions, Steam Workshop, C# mod API —
    while EA's Sims 1 Legacy Collection removed the Exchange.

  don_connection: |
    Don praised Tiny Life on Twitter (Apr 2024); quote on [Praise page](https://tinylifegame.com/#reviews).
    Discord May 2024–Jul 2026 (Pez de Spencer): Soul City pitch — Ell **"that sounds interesting!"**
    and *pandoc for life sim characters*. Jul 2026: Don shared this directory + premiere show for
    review; Ell **excited to have a closer look**. See correspondence.yml.

