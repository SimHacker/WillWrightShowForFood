bio:
  summary: |
    Analog circuit designer at Rolm, then joined Sun Microsystems when it was
    about six months old and stayed ten years, designing SCSI and Ethernet
    interfaces and building a Forth environment for hardware diagnostics. Around
    1987 Andy Bechtolsheim asked him for smaller firmware for the machine that
    became the SPARCstation 1, and he wrote OpenBoot. It became IEEE 1275-1994,
    Open Firmware, used by Sun, by Apple in PowerPC Macs and by IBM in PowerPC
    servers; its device tree survives in Linux. Acting Vice-Chair of X3J14, the
    ANS Forth committee, representing Bradley Forthware. Founded FirmWorks to
    support Open Firmware on other platforms. Wrote the firmware for the One
    Laptop per Child XO, replacing LinuxBIOS with Open Firmware. Author of
    CForth and top contributor to the FluidNC CNC firmware. In September 2026
    he wrote a Forth for the DEC PDP-7, with turtle graphics on the Type 340.
  known_for:
    - "OpenBoot / Open Firmware (IEEE 1275-1994), FCode, the device tree"
    - "Sun Forth and Forthmacs"
    - "OLPC XO firmware"
    - "CForth (https://github.com/MitchBradley/cforth)"
    - "PDP-7 Forth (https://github.com/MitchBradley/pdp7forth, 2026)"
    - "Suggested the name 'pie menu'"

connections:
  sun_1987: >-
    Hired Don as a summer intern at Sun in 1987 to put pie menus and Forth
    into CADroid, a schematic editor from Lucasfilm, running under NeWS.
  pie_menus: >-
    Suggested the name "pie menu" (Don, HN 39217923). Don's pie menu
    experiments ran in uwm with its main loop rewritten in Mitch's Sun Forth
    (HN 38445174).
  malloc: >-
    Don's memory allocator, written at Maryland, is still in Open Firmware,
    modified by Mitch (ofwcore.fth; HN 21823081).
  cam6: "Mitch's Sun Forth compiled the rules for Don's CAM6 simulator."
  hyperties: "HyperTIES at Maryland used Mitch's Forth (HN 29722536)."
  pdp7_forth: >-
    Written in a day in September 2026, with Claude Code, at Don's request;
    vendored in the cabinet at packages/cabinet/tapes/pdp7forth/.

