bio:
  summary: |
    **Daan van West** (Daniel van West, b. 1971, Amsterdam) — composer, sound
    designer, and audio engineer; trained in Muziekregistratie (audio recording)
    at the **Royal Conservatory, The Hague** (1993–98); member of the Amsterdam
    multimedia collective **PIPS:lab** since June 1999. He is the audio and
    Max/MSP side of the PIPS:lab shows Don loves: **DieSpace** (compositions and
    Max/MSP programming — Oerol and De Parade 2007, Pittsburgh Cultural Trust
    2012, Oldenburgisches Staatstheater 2014), **Shadows In The Cloud** (Perth
    Fringe 2016), **Archie and the Bees** (concept, Max/MSP, compositions, and
    performance, De Parade 2009), and the TEDxAmsterdam closing acts (2013; 2015
    **Selfie Symphony**). Installations: Lowlands (Wisselkantoor 2014, Spoohkuis
    2013), Tropenmuseum Lumandulator, CineKid HindSight (interactive sound,
    Max/MSP + Arduino), Scheepvaartmuseum Koningssloep soundscape, The Potator
    (music by motion capture). Recorded and mixed the **Kilio Cha Haki** hiphop
    CD in Nairobi (2004). Jingle and commercial composer (Top Format, LIDL,
    radio stations). Drummer — The Scallymatic Orchestra and, pleasingly for the
    show at hand, a band called **Moody Allen**.
  self_description: |
    From his 2017 mail: "My coding skills are somewhat limited, I am more of an
    audio engineer slash composer slash sound designer, with the ability to
    connect to and understand technology." Which is exactly the seat a moody
    panel needs: the person who wires meaning to sound without pretending the
    wiring is the point.

