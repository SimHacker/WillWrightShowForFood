  summary: >
    **Janet H. Murray** — Georgia Tech professor; author of *Hamlet on the Holodeck: The Future of
    Narrative in Cyberspace* (Free Press, 1997; later editions). Foundational vocabulary for
    interactive narrative: **agency, immersion, transformation**. Cited throughout IF / game
    studies (Montfort *Riddle Machines* among many). Don collaborated with her students via
    Stupid Fun Club StoryMaker; MOOLLM/Repo Show pitch as practical holodeck threads.

