# FreeTA — Daniel Tupper's open-world city game (seed)

meta:
  id: freeta
  author: daniel-tupper
  status: dream
  first_pitch: 2013-08

pitch: |
  **FreeTA!** — like GTA, but **no missions**: a **full New York City** to roam. Daniel described
  the idea to Don in 2013; early web presence at **mgismafia.webs.com** (mafia/city theme). He
  wanted to make his own engine (WebGL / Unity among the options Don mentioned).

show_use: |
  Pyramid-of-players beat: fan dream → engine ambition → tool maker. Pair with Jeff Adkins /
  SimFreaks climbs.

