naming: |
  **SWRSgaming** — studio name built from the **founders' initials** (Daniel asked Don what Don
  thought of the name and meaning). Don compared it to a friend's **WPS.com — World Power Systems**:
  "Makes sense! Easy to remember."

pattern: |
  Initialism studio names as world-building — opaque until you know the founders, then obvious.
  Same family as Maxis (McDonough + Willis? — actually Maxis has its own origin) and WPS.

show_use: |
  Fake-commercial or blipvert slot: "SWRSgaming presents..." — Daniel's fictional studio branding
  as real repo files. Grows with logo, mission statement, and project list (FreeTA as flagship).

