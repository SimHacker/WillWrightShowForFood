bio:
  summary: |
    **Daniel Tupper** — a super-apex **artist, programmer, and fan** who has been in
    correspondence with Don for **more than a decade** (first logged Facebook thread,
    August 2013). He dreams in full cities and own engines: **FreeTA** (GTA with no
    missions — a free-roam full New York), **SWRSgaming** (founders'-initials studio name,
    in the spirit of WPS / World Power Systems), and a custom engine of his own. He asks
    the good lore questions (did The Sims 1 ship with three stories, or only the original?),
    collects old Maxis imagery, and keeps showing up with new designs. He also stepped up
    pipeline through LLM-assisted translation toward the browser (Transmogrifier / TMOG
    modernization thread — see catalogs/sims1-community-landscape.yml clean_room_tools).
    Daniel is another face of Will Wright's **pyramid of players**: fan → builder → tool maker.

correspondence:
  since: "2013-08 (first logged thread)"
  note: "Verbatim logs in DonHopkins green-room only"

