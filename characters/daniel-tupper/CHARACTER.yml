why_a_guest:
  pyramid: |
    Same ladder Jeff Adkins, Heather Castillo, and Steve Alvey climbed — play → dream → build →
    tools. Daniel's side is **open-world city dreams + Sims toolchain modernization**; the
    show names that climb for everyone watching.
  stories_spawn: |
    Daniel's threads enrich Don's story, Will's lore answers, and the repo's artifact graph:
    FreeTA, SWRS, engine ambition, TMOG/browser pipeline — each a file that can grow into
    demos, blipverts, and session beats.

