bio:
  summary: >
    **Dr Peter Mowforth** — cofounder and director of Glasgow's **Turing Institute**
    with **Donald Michie** and **Tim Niblett**; organised the accidental-then-legendary
    **First Robot Olympics** (1990; Guinness; Pete's photos); HyperLook-era colleague
    of Arthur van Hoff and Don Hopkins. Later CEO of **INDEZ** (Glasgow ecommerce —
    ML from Turing still earning its keep). Writing a **people-first book** about the
    Institute (Apr 2026: asked Don for anecdotes; Chapter-one PDF pending deposit).
    Keeper of Turing orphans mail and memorials (Tim Niblett 2022; Jim Alty news).
    Enduring Don compliment: "complete technicolour madness" — and he dislikes beige people.

