bio:
  summary: |
    **Ralph Herman Abraham** (1936–2024) — mathematician of dynamical systems and
    chaos at UC Santa Cruz from 1968; author (with Marsden) of *Foundations of
    Mechanics* and (with Shaw) of *Dynamics: The Geometry of Behavior*; builder of
    the Visual Mathematics Library; early video-feedback cascade experiments that
    hand off to Jim Crutchfield's line; Santa Cruz counterculture voice (*Chaos,
    Gaia, Eros*; Trialogues with McKenna & Sheldrake); *The Web Empowerment Book*
    (1995). Will Wright's "possibility space" vocabulary sits next to Abraham's
    phase space — Will named him on a 2026 look-up list.

known_for:
  - "Foundations of Mechanics (with Jerrold Marsden) — the classic, from his Princeton lectures"
  - "Dynamics: The Geometry of Behavior (with Christopher Shaw) — phase space made visible"
  - "Visual Mathematics Library — computer graphics as a mathematical instrument"
  - "'Simulation of cascades by video feedback' (Springer LNM 525, 1976) — the Crutchfield handoff"
  - "Santa Cruz counterculture (Hip Santa Cruz); Trialogues with McKenna & Sheldrake; Chaos, Gaia, Eros"
  - "The Web Empowerment Book (1995) — early web evangelism"

