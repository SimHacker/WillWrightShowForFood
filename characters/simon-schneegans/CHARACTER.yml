bio:
  summary: "**Simon Schneegans** — German developer and researcher who has been building and refining pie menus for well over a decade: thesis work on **Trace-Menus** and **Coral-Menus** (~2012), **Gnome-Pie** (the circular launcher for Linux, Vala/GTK/Cairo), **Fly-Pie** (its GNOME Shell successor), and now **Kando** — a cross-platform (Windows/macOS/Linux) open source marking/pie menu with a WYSIWYG editor, CSS themes, sound themes, and an achievement system. Also the author of beloved GNOME extensions (**Burn-My-Windows**, **Desktop Cube**) and a developer on **CosmoScout VR** at DLR."

pie_menu_lineage:
  fact: "Simon is the most persistent pie-menu implementer of his generation — a dozen-plus years of continuous design iteration from academic thesis (trace/coral menus, with sub-menu preview nubs and reserved roll-back slices) through Gnome-Pie's Fitts's-law launcher to Kando's cross-platform marking menus."
  don_on_simon_2018: "https://news.ycombinator.com/item?id=17106453 — 'I'm very impressed by Simon Schneegans' work on Gnome-Pie... And especially his delightful thesis work.'"
  don_on_simon_2024: "https://news.ycombinator.com/item?id=42525290 — on the Kando Show HN: 'not only do you totally get the inherent advantages and joys of pie menus... but you also have an impeccable sense of design and creativity.'"
  thesis_videos:
    trace_menu: "https://vimeo.com/51073078"
    coral_menu: "https://vimeo.com/51072812"

