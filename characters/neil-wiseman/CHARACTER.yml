relationship:
  to_project: storyline_figure
  to_pixie: |
    Heinz Lemke's PhD supervisor and PIXIE co-author. Wiseman designed the high-speed data-link
    joining the DEC PDP-7 + Type 340 vector display to the Titan — described in his Cambridge
    obituary as "probably the world's first distributed system," and the substrate PIXIE ran on.
    Lead author of both the PIXIE (1969) and RAINBOW (1972) papers.

bio:
  summary: |
    **Neil Ernest Wiseman** (1934–1995) founded and led the Cambridge Computer Laboratory's
    **Rainbow Group** (1965–1995), contributing for 30 years to computer graphics, display
    architectures, modelling, rendering, interaction techniques, CAD, graphic design, and
    animation. He designed the **PDP-7 ↔ Titan** high-speed data-link (an early distributed
    system), invented a **pen-following screen menu** that anticipated the pop-up menu, held three
    patents and 70+ publications, and supervised 40+ PhDs (including Peter Robinson and Neil
    Dodgson). In 1986 Cambridge created a personal **Readership in Computer Graphics** for him; he
    repeatedly declined chairs elsewhere, preferring Cambridge. With David Kindersley he explored
    the mathematics of letterforms and co-founded the consultancy Fendragon Ltd.

