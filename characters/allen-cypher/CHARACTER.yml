bio:
  summary: |
    BA in Mathematics, Princeton (1975); PhD in Computer Science, Yale (1980).
    Cognitive scientist and Sloan Fellow in Don Norman's group at UCSD
    (1980-85). Expert systems at IntelliCorp (1985-88). Senior Scientist for
    intelligent agents at Apple (1988-97), in Alan Kay's group, where he built
    Eager and, with David Canfield Smith, KidSim (later Cocoa, then Stagecast
    Creator). Cofounder and Chief Designer of Stagecast Software (1997-2001).
    At IBM in San Jose (2002-14) he invented CoScripter, a Firefox extension
    for recording and sharing web tasks. Later at Microsoft (Azure ML
    Workbench), Socratic Arts and Uber. His home page says that with large
    language models his dream of end-user programming has come true.
  known_for:
    - "Eager: Programming Repetitive Tasks by Example (CHI '91)"
    - "Watch What I Do: Programming by Demonstration (MIT Press, 1993), editor"
    - "KidSim: Programming Agents Without a Programming Language (CACM, 1994), with David Canfield Smith and Jim Spohrer"
    - "Stagecast Creator: children build simulations and games with graphical rewrite rules"
    - "CoScripter at IBM"
    - "No Code Required: Giving Users Tools to Transform the Web (2010), co-editor"

