bio:
  summary: >
    **Miller S. Puckette** — creator of **Max** (the graphical real-time music/dataflow environment,
    built at **IRCAM**, named after Max Mathews) and of **Pure Data (Pd)**, his **open-source** (C)
    real-time dataflow environment. The audio-DSP extension **MSP** (→ **Max/MSP**, commercialized by
    Opcode then **Cycling '74** / David Zicarelli) puns on both "Max Signal Processing" and his initials,
    **M**iller **S**. **P**uckette. Professor at **UC San Diego**. At MIT he was **office-mate of
    [David Levitt](../david-levitt/)** in the Lisp machine's "Music Hacker's Hangout."

