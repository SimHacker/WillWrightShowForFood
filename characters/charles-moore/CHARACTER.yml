bio:
  summary: >
    **Charles Moore** invented **Forth**. **Forth, Inc.** sent him to **HOMER & Assoc.**
    (Sunset Gower) to program the **Homer II** host: PolyForth, multitasking, 32K on a
    master Z80, while **Paul Rother** programmed the 2K EPROM in each of 24 channel Z80s.
    Paul's public memoir: "I learned Object Oriented Programming without knowing it."
    That HOMER contract is the thread this room is for — not a recap of Forth.

