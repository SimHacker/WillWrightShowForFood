bio:
  summary: >
    **Bill St. Clair** — Lisp hacker (Knoxville; MIT-listed). At **Atari Cambridge Research Lab**
    (1984) wrote Symbolics code to use a **Star Wars** arcade game as graphics output, plus 6805
    loader, **3D turtles**, maze (jsMaze.com later). Then **Thinking Machines** (CM-2 circuit language
    on Symbolics), **Apple** (MCL, Dylan, CLOS, WOOD), **Digitool** (MCL→PowerPC), Shaker construction
    software (Albany), **ITA** / **Clozure Associates**. Now personal projects — **Mammudeck** (Elm
    Mastodon client). Confirmed Don's ACRC memory by email May 2024.

