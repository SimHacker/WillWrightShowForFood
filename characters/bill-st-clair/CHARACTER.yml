bio:
  summary: >
    **Bill St. Clair** — Lisp hacker. At **Atari Cambridge Research Lab** (Q1 1984) turned the
    **Star Wars** arcade cabinet into a turtle-graphics device (new ROM; vector persistence ~0.5s)
    and wrote a **3D turtle** eye-steering system on a **Symbolics Lisp Machine**. Later: Thinking
    Machines (Connection Machine circuit sim), Apple, Digitool, ITA Software, Closure Associates.
    Public sites: billstclair.com; HN `bill-stclair`.

