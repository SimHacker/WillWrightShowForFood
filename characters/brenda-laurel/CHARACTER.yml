bio:
  summary: |
    **Brenda Laurel** — interaction designer, researcher, and writer. Author of **_Computers as
    Theatre_** (dramatic theory applied to HCI). At **Interval Research** she led multi-year **gender +
    technology** research that spun off **Purple Moon** (1996) — narrative CD-ROM games for girls
    (e.g. Rockett's New School). Also known for **_Utopian Entrepreneur_** and design-research advocacy.
  don_firsthand: |
    Don worked at **Interval Research** (~mid-1990s) in the same Camelot-era circle. Before joining
    **Maxis** and **The Sims**, he watched Brenda's **games-for-girls** research and found it
    **enlightening** — worth doing even when the market was brutal (see Don's note on Henry Jenkins's
    *Barbie to Mortal Kombat* reflection). Don compares Purple Moon's research-driven "pink pill" to
    Will's **Simulator Effect** path: The Sims didn't follow focus groups; it shipped ambiguity and
    user-created content.
  known_for:
    - "Computers as Theatre — HCI as dramatic experience"
    - "Interval Research → Purple Moon — gender-inclusive game design research"
    - "Placeholder VR — landscape and narrative (with Rob Tow, Rachel Strickland); CS547 1993"

why_a_guest:
  connective_tissue: |
    Brenda is the **dramatic interface + narrative** node from Interval → **The Sims storytelling**
    lineage. Natural **pair** with **Rob Tow** (Placeholder, psychophysics) and bridge to **Will Wright**
    (Purple Moon vs Maxis design philosophy), **Scott McCloud** (closure/gutter), and **Interval reunion**.
  flags:
    - "Purple Moon commercial outcome ≠ research value — frame Don's view as firsthand, not verdict on Brenda."

