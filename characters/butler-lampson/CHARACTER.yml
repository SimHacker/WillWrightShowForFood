bio:
  summary: |
    **Butler Lampson** — Project GENIE / CAL-TSS / SDS-940 at Berkeley; Bob Taylor recruited him
    (with Thacker, Deutsch, et al.) to Xerox PARC CSL (1971). Co-architect of **MAXC** and the
    **Alto**; Kay heard Lampson's capability OS talk (fall 1969) and credits unforgeable pointers /
    "objects as server" as an influence on OOP thinking. Shared Draper Prize with Kay, Taylor,
    Thacker (2004). Turing Award 1992. Kay (Quora 2026): *"Butler Lampson is the quintessential
    example of a great [computer scientist]."*

