bio:
  summary: |
    **Dame Stephanie ("Steve") Shirley CH** (1933–2025) arrived in Britain as an
    unaccompanied **Kindertransport** child refugee and went on to found
    **Freelance Programmers** (1962) from her dining table — a software house that
    predominantly employed women working from home, pioneering flexible remote
    work decades before it was fashionable. She signed letters **Steve** so
    male buyers would answer. The firm grew into FI Group (thousands of staff;
    later valued near $3bn). After stepping back she became a major UK
    **venture philanthropist**, focusing on autism (Shirley Foundation → Autistica,
    Prior's Court) and IT (including founding gift to the Oxford Internet Institute).
    Public motto of her giving: money that isn't working has a kind of obscenity.

