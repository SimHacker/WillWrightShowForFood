bio:
  summary: |
    PhD, University of Washington (2015), "Pixel-Based Reverse Engineering of
    Graphical Interfaces", advised by James Fogarty; Microsoft Research PhD
    Fellow (2011). Prefab recovered the structure of any graphical interface
    from its pixels, many times a second, so that it could be modified,
    enhanced or made accessible without the application's source. CHI 2010
    Best Paper. Research Scientist at Adobe (2016-17), then UX Engineer at
    AppSheet, acquired by Google in 2020. Plays drums in the band Spesh.
  papers:
    - "Prefab: Implementing Advanced Behaviors Using Pixel-Based Reverse Engineering of Interface Structure. CHI 2010, Best Paper. doi:10.1145/1753326.1753554"
    - "Prefab: What if Every GUI Were Open-Source? CHI 2010 FLOSS HCI workshop"
    - "Content and Hierarchy in Pixel-Based Methods for Reverse Engineering Interface Structure. CHI 2011 (with Leventhal, Fogarty)"
    - "A General-Purpose Target-Aware Pointing Enhancement Using Pixel-Level Analysis of Graphical Interfaces. CHI 2012 (with Fogarty, Wobbrock)"
    - "Sliding Widgets. CHI 2014 (with Laput, Fogarty)"
    - "Prefab Layers and Prefab Annotations. UIST 2014 (with Nied, Fogarty)"
    - "Doctoral symposium, UIST 2013. doi:10.1145/2508468.2508469"
  patent: "US9182981, with Fogarty and Leventhal (granted 2015)"

