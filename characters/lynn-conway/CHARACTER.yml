  full_name: "Lynn Ann Conway"
  type: memorial
  signifier: "🕯️"
  status: deceased
  born: "1938-01-02"   # Mount Vernon, New York
  died: "2024-06-09"   # Jackson, Michigan (aged 86)
  field: "Computer architecture; VLSI / Mead–Conway design methodology; transgender rights advocacy"
  home: characters/lynn-conway/
