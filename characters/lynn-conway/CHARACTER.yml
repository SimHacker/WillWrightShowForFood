invitation:
  status: memorial
  document: memorial.md
  note: "Deceased (1938–2024) — represent + discuss; CHM Fellow 2014; friend-phone clips welcome from people who knew her"

memorial:
  mode: represent_and_discuss
  rule: >
    Represent and discuss her documented public work and publicly shared advocacy.
    Do not interview, do not speak as her, invent no inner life. Only her real,
    documented words, with attribution. Treat gender history with care — her own
    framing after she came out publicly (late 1990s) is the guide.
  who_can_discuss: []   # fill as people who knew her accept
  draw_on_for_shows:
    - "IBM ACS — foundational multiple out-of-order dynamic instruction scheduling (before 1968 firing)"
    - "Xerox PARC LSI Systems group; Mead–Conway VLSI revolution"
    - "Introduction to VLSI Systems (with Carver Mead, 1978/79) — democratized chip design education"
    - "MPC79 / MOSIS multiproject wafer infrastructure — fabless + foundry paradigm"
    - "DARPA Strategic Computing Initiative planning"
    - "University of Michigan professor / associate dean"
    - "CHM Fellow 2014 — IC design methods"
    - "Public transgender advocacy after coming out; 'Transsexual Women's Successes' and related resources"

bio:
  summary: |
    **Lynn Ann Conway** (1938–2024) was a computer scientist and electrical engineer
    whose **Mead–Conway VLSI** methods (Xerox PARC, with Carver Mead) taught a
    generation how to design microchips and helped create the fabless-design +
    silicon-foundry model (MPC79 → MOSIS). Earlier at IBM she contributed to
    advanced computer architecture (including dynamic instruction scheduling)
    before being fired in 1968 during gender transition; she rebuilt her career
    under a new identity at Memorex and PARC. After her history became public in
    the late 1990s she became a leading advocate for transgender rights and a
    CHM Fellow (2014). Professor Emerita, University of Michigan.

