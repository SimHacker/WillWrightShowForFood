# Bruce "Tog" Tognazzini × Don Hopkins — correspondence summary (public-safe)
# Tight public-safe digest. NOT the full private thread.
# Standards: ../../schemas/portrayal-standards.md

meta:
  with: bruce-tognazzini
  curated_by: don-hopkins
  consent: not_yet_asked
  span: "2022–2026"
  note: "Tog's asktog.com address rotates yearly (tog2021, tog2023, tog2026...) — old ones bounce"

gist: |
  Warm, practical exchange that started with an expired https certificate and grew into
  the AskTog preservation saga, a Fitts'-Law-and-pie-menus running conversation, HN
  coordination offers, and (2026) Palm the monkey's thank-you letter for Tog's 1979
  Apple II "Infinite No. of Monkeys" demo. Ben Shneiderman, Ted Selker, and Brad Myers
  are recurring Cc's — the elders keep each other's sites and stories alive.

threads:
  cert_rescue_2022:
    what: |
      Sep 2022 — Don noticed asktog.com's https certificate expired while trying to link
      "A Quiz Designed to Give You Fitts" on HN; wrote via Ben Shneiderman + nngroup since
      he didn't have Tog's address. Oct 14 2022, Tog: "I visited LetsEncrypt and was able
      to sign up with no problem. Site now reads https." Don: "LetsEncrypt is a force of
      good in this world."
  cert_relapse_2023:
    what: |
      Nov 2023 — cert expired AGAIN (Sectigo, not the LetsEncrypt cron). Don flagged it
      alongside a GIMP/pie-menus HN thread; also proposed coordinating a fresh HN post of
      "Keyboard vs. The Mouse" so Tog could answer questions in classic AskTog tradition,
      with Ted Selker dropping in on TrackPoint switching-cost research (the two-TrackPoint
      ThinkPad story included).
  golive_stranded:
    what: |
      Tog (Nov 13 2023): "I no longer have any reasonable access to my site since Adobe
      discontinued GoLive. (I also tired of having to spend ten times as much time
      formatting new material as I did writing it.) And I'm 78 years old." Same day:
      "Happily, I have no need to save money. In fact, I'd happily spend a considerable
      sum if someone could rebuild the site in a framework that could enable me to easily
      add new content. Just haven't found a competent, reliable person to do that task."
  preservation_plan:
    what: |
      Don's proposal: snapshot to a static cloud bucket (auto-renewing certs, HN-proof,
      cheap), Google search instead of the broken search box, one clean package on
      archive.org for offline browsing, ACM or similar as long-lived host; Jim Paradis
      as the competent-reliable builder. Ben Shneiderman widened it: index MANY early-HCI
      sites — "a nicely done HCI history page." Don to Al Kossow (bitsavers) and Arthur
      van Hoff for platform advice; "For goodness sake, Bruce Tognazzini wrote the
      original Apple Human Interface Guidelines" — his life's work deserves a modern site.
    doc: sources/asktog-preservation.yml
  asktog_ai:
    what: |
      Don + Ben (Nov 2023): train an LLM on AskTog + early HCI corpus — "asktog.ai" —
      interactive Q&A, glossaries, simulated historical dialogues; possibly with CHM or
      SIGCHI. Also pitched to Simon Schneegans (Gnome-Pie/Fly-Pie author).
  fitts_and_pie_menus:
    what: |
      The long-running friendly technical thread: Tog's mile-high menu bar vs Don's
      pie menus (both Fitts' Law plays); Tog's 1986 "<"-buffer hierarchical menu
      algorithm (Jim Batson math, Frank Leahy Menu Manager, NeXT regression, Amazon
      resurrection); Steve Jobs unconvinced at EduCom '88, Don Norman unconvinced at
      NPUC; Blender running with pie menus anyway.
    doc: sources/apple-hig-and-menus.yml
  tabbed_windows_thread:
    what: |
      Nov 2023 — Don's HN tabbed-windows essay (NeWS UniPress Emacs 1988, tabs on any
      edge, pie menus on tabs) shared with Ben + Tog + Brad Myers.
  cs547_cc:
    what: |
      Tog was on the big Jan 2023 CS547 crowdsourcing Cc — the thread that surfaced
      Will Wright's 1996 "Interfacing to Microworlds" (Dollhouse) video and ~300 more
      Stanford HCI lectures.
  palm_tribute_2026:
    what: |
      Jan 2026 — Don sent Tog "A thank you letter from a finite number of monkeys named
      Palm": Palm's tribute to Tog's 1979 "THE INFINITE NO. OF MONKEYS" Apple II demo,
      plus "Palm on Being Palm." Thesis: the theorem's answer is one navigating monkey
      (Dasher/LLM), not infinite random ones. "GZINCLE FORTEN GLAFFLE" isn't gibberish —
      it's a navigation error.
    doc: sources/infinite-monkeys-1979.yml
  kreitman_credit:
    what: |
      March 2020 (Bill Atkinson PhotoCard farewell thread) — Don quoted *Tog on
      Interface* pp. 156–157 crediting Kristee Kreitman Rosendahl for HyperCard's
      graphic design and Home icons; she's interviewed in Douglas Adams's *Hyperland*.
  bike_standing_offer:
    what: "Don's standing offer since 2022: come to Amsterdam, borrow the esteemed-visitor eBike, ride and talk pie menus."

connects_in_repo:
  - { path: CHARACTER.yml, why: "Bio + invitation status" }
  - { path: sources/asktog-preservation.yml, why: "Site-rescue saga + HCI history site idea" }
  - { path: sources/infinite-monkeys-1979.yml, why: "1979 demo + Palm's 2026 answer" }
  - { path: sources/apple-hig-and-menus.yml, why: "HIG editions, submenu forgiveness, Fitts quiz" }
  - { path: ../ben-shneiderman/, why: "Recurring Cc; HCI history site co-conspirator" }
  - { path: ../ted-selker/, why: "Keyboard-vs-mouse + TrackPoint thread partner" }
  - { path: ../brad-myers/, why: "Menu-tracking p.171 thread; Pick Click Flick" }
  - { path: ../bill-atkinson/, why: "PhotoCard farewell thread where the Kreitman credit surfaced" }
  - { path: ../terry-winograd/, why: "CS547 archive Cc" }
  - { path: ../../repo-shows/moollm-readings/topics/tog-infinite-monkeys.yml, why: "Existing reading topic" }

show_hooks:
  - "Writing the Apple HIG — 8 editions, 14 years, and WHY the 1987 edition justified everything"
  - "The '<' submenu buffer — invention, Batson's math, Leahy's implementation, NeXT's regression, Amazon's resurrection"
  - "A Quiz Designed to Give You Fitts — mile-high menu bar vs pie menus, settled amiably on air"
  - "Magic and software design — a magician's view of attention"
  - "Starfire — what the 1994 future film got right and wrong"
  - "The Infinite No. of Monkeys (1979) — read Palm's tribute together; one navigating monkey"
  - "AskTog preservation — GoLive strandedness, static-site rescue, asktog.ai, the HCI history site"
