bio:
  summary: "**Jens Mönig** — Architect and lead programmer of **Snap!** (formerly BYOB, \"Build Your Own Blocks\"), the block-based visual language used in UC Berkeley's *Beauty and Joy of Computing* curriculum, with design input + documentation by Brian Harvey. Built it on his own **Morphic.js** framework; Snap! has first-class lists, procedures, AND continuations (enough for the Y combinator), plus prototype-based objects. Previously on the MIT **Scratch** team and worked under **Alan Kay** on the GP language (with John Maloney + Yoshiki Ohshima). Research Expert at **SAP**, consultant at UC Berkeley; a fully qualified German lawyer who returned to programming via Scratch/Squeak. Good friend of Don Hopkins; proposed guest — solo (Micropolis × Snap!, Snap! internals, schemas, distributed/actor systems) and joint with Brian Harvey (the Snap!/Logo pair show)."

