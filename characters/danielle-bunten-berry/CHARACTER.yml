    - "**The Sims (2000) dedicated to her** — Will Wright's tribute"
    - "CGDA Lifetime Achievement (1998); AIAS Hall of Fame inductee (2007, Sid Meier accepting)"

bio:
  summary: |
    **Danielle Bunten Berry** (1949–1998) — game designer and a founding voice of
    **multiplayer social gaming**. At Ozark Softscape she created **M.U.L.E.** (1983),
    a four-player economic strategy game among Electronic Arts' first and most
    beloved titles, and **The Seven Cities of Gold** (1984). She believed games were
    at their best when they brought people together in person. Published as Dan
    Bunten before coming out as a trans woman in 1992. CGDA Lifetime Achievement
    Award (1998); posthumous **AIAS Hall of Fame** (2007). **The Sims was dedicated
    to her.**

