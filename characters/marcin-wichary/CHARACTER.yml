bio:
  summary: |
    **Marcin Wichary** — designer, writer, and engineer; in his own words, "the person who
    stumbled upon a magical typewriter museum in Spain, obsessed about underlines while
    working at Medium, wrote about fonts at Figma, or put Pac-Man on Google's homepage."

    He co-created the **playable Pac-Man Google Doodle** (May 2010, with Ryan Germick) —
    the first interactive doodle, and possibly the largest single deployment of a video
    game in history — and the **Stanisław Lem Google Doodle** (November 2011), an
    interactive mini-game honoring the 60th anniversary of Lem's first published book,
    drawn in the style of Daniel Mróz's Cyberiad illustrations.

    In 2015 he translated Lem's 1976 short story **"One hundred and thirty-seven
    seconds"** into English — a tale of news, teletypes, and an IBM computer with
    unanticipated abilities — and wrote a translator's essay about the two-month process
    of carrying his childhood author across the language border.

    His book **Shift Happens** (2023) tells 150 years of keyboard history across two
    volumes and 1,000+ photos, funded by one of Kickstarter's most successful book
    campaigns. His archive lives at aresluna.org.

why_the_show_cares: |
  Marcin sits at the exact junction this repo keeps walking: Lem and translation
  (Kandel, the Electronic Bard, bitic literature), Pac-Man reverence (see the Church of
  PacMania and the 2010 doodle), the history of input devices (keyboards; Don: pie menus),
  and writing about technology with love and receipts. The 2020 correspondence is a
  ready-made show outline — every thread in it grew into a room somewhere in these repos.

