bio:
  summary: |
    **Sophie Wilson CBE FREng FRS** — designed early Acorn micros; with **Steve Furber**
    prototyped the **BBC Micro** (OS + **BBC BASIC**); designed the **ARM1** instruction
    set (delivered 1985; now the dominant mobile/embedded CPU architecture); later
    chief architect of **Firepath** (Element 14 → Broadcom), still shipping in broadband
    silicon. CHM Fellow 2012; CBE 2019. Cambridge-rooted career — strong adjacency to
    this project's Cambridge graphics / PDP-7 history without being the same lab.

why_invited:
  arm: "Primary voice on how a tiny RISC ISA conquered the planet."
  bbc_micro: "Education computing that actually shipped into schools."
  cambridge: "Geographic/cultural neighbor to Wiseman/PIXIE storylines — different machine, same city of invention."

