bio:
  summary: |
    **Charles P. ("Chuck") Thacker** (1943–2017) — lead hardware designer of the **Xerox Alto**,
    the machine that hosted early Smalltalk; built **MAXC** (PARC's PDP-10 emulator). With
    Lampson offered to build Kay's proposed machine on Kay's Nova budget; first Alto months later
    ("Bilbo"). Later DEC / Microsoft (Tablet PC). Turing Award 2009; Draper Prize with Kay,
    Lampson, Taylor. Kay notes Thacker as a Roger Needham fan who later set up Microsoft's
    Cambridge lab.

