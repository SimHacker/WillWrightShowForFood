# What Alan Kay says about Chuck Thacker — public sources
character: chuck-thacker
kay_hub: ../alan-kay/
kay_says:
  gist: |
    Lead Alto designer; with Lampson took Kay's Nova/character-generator budget to build the
    machine (Thacker bet: whole machine in three months). First Alto nicknamed Bilbo. Built MAXC.
    Kay: Thacker was a Roger Needham fan who later set up the Cambridge Microsoft research lab;
    Wilkes→PARC connection "mainly through Chuck Thacker, etc."
