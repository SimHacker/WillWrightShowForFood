bio:
  summary: |
    **Amy Jo Kim** — social game designer, community architect, and startup coach. Designer and
    consultant on **The Sims**, **Rock Band**, **Ultima Online**, **eBay**, **Netflix**, and many
    others. Author of *Community Building on the Web* (2000) and *Game Thinking* (2018). PhD
    behavioral neuroscience (University of Washington). Co-founder of **Shufflebrain** with her
    husband **Scott Kim**. Named by Fortune among powerful women in games; praised by **Will Wright**
    for social-design craft.

