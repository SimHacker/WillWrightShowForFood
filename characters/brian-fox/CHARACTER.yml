bio:
  summary: "**Brian Jhan Fox** (b. 1959, Boston) — the **first employee of the Free Software Foundation** (hired by Richard Stallman, 1985) and original author of **GNU Bash** (announced beta June 1989; primary maintainer to ~1993) — the shell this whole repo runs on. Also wrote **GNU readline and history** (the line-editing under Bash, Python, psql, and a thousand REPLs), GNU Info, Makeinfo, Finger, and Echo, and maintained GNU Emacs for a time. Built the **first interactive online banking software in the US** (Wells Fargo, 1995). Co-founded **Universal Access Inc.** with **Henry and Julie Minsky** — the Meta-HTML company from the NYT 'First Wired Family' article. Created an **open-source election system** (2008) and serves with the National Association of Voting Officials. Co-founded **Orchid Labs** (2017–2024), building a surveillance-resistant internet. Grew up with a BBN-physicist father and a teletype in the basement; brother of jazz pianist-composer **Donal Fox**."

connections:
  stallman: "FSF employee #1, hired 1985; wrote Bash because the GNU project needed a free sh — the proof that copyleft could staff a movement"
  minsky_twins: "Universal Access Inc. co-founded with Henry and Julie Minsky; Meta-HTML; the NYT First Wired Family article is the primary source in this repo"
  marvin: "One hop from Marvin through the twins — the family's startup partner; a Diespace-wing-adjacent voice for the memorial's 'what the kids built' segment"
  don: "Every Unix pie menu, every SimCity build script, every MOOLLM shell tool in these repos runs through Bash and readline"
  music: "Brother Donal Fox — jazz/classical composer-pianist; velcro to the show's music-machines thread"

