bio:
  summary: |
    **Dave Fleck** — pen-input engineer who spent twenty-six years at **Wacom Technology
    Corp** (Vancouver, WA): **VP of Engineering 1993–2016**, then **VP of Software
    Technology 2016–2019**. Named on **37 issued US patents** (50+ international) across
    stylus pressure and tilt, jitter filtering, palm rejection, the finger-wheel stylus,
    and a filament-sensing stylus brush. Co-inventor of **US 7,941,765** — the radial
    control menu that shipped as **Wacom's Radial Menu**, a standard driver feature in
    front of millions of artists since the Intuos4 era. Represented Wacom in the **W3C
    Pointer Events** working group (pen twist/rotation, 2016). BSEE Cincinnati, MSCS
    Johns Hopkins, MBA Loyola Maryland, Doctor of Computer Science (CTU). Retired 2019.

pixie_connection:
  fact: |
    Fleck is the person whose May 2008 question started the PIXIE recovery chain. Hunting
    prior art for Wacom's radial menu, he found the 1969 PIXIE citation on Don's pie menu
    site and asked for the paper; Don connected him to Bill Buxton; when Buxton sent his
    Wiseman-papers notes to a CC list that excluded Don, **Fleck forwarded Don the two
    PDFs himself** (8 July 2008) — which is how Don learned the PIXIE film existed. The
    entire film recovery, Flight of the PIXIE, and the Heinz Lemke correspondence are
    downstream of his courtesy.
  the_unclosed_loop: |
    In 2008 he wrote: "I just feel this need to see the original." He never got it —
    Buxton declared the original "unsuitable for scanning." As of 2019–2026 there is:
    the digitized paper; Heinz's PhD thesis (reproducible detail of the radial menus);
    both 1969 films; Flight of the PIXIE; the entire PIXIE assembly source and octal
    machine language (transcribed, stepping toward / in SIMH); notes, recollections, and
    original sources; articles, interviews, and discussion threads. Eighteen years later,
    the loop can close.
  saga: ../heinz-lemke/sources/2019-2020-film-recovery-saga.md

