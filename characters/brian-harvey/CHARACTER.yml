bio:
  summary: "**Brian Harvey** (he/him) — UC Berkeley CS educator (Teaching Professor Emeritus), a lifelong force in **computer science education**. Developed **Berkeley Logo**, co-developed **Snap!** (design + documentation) with Jens Mönig, and co-created **The Beauty and Joy of Computing (BJC)** curriculum with Dan Garcia. Author of *Computer Science Logo Style* (3 vols, MIT Press) and *Simply Scheme* (with Matthew Wright, foreword by Hal Abelson); taught the legendary SICP-based **CS 61A**. Won the 2024 ACM Karl V. Karlstrom Outstanding Educator Award (with Dan Garcia, for BJC) and Berkeley's Distinguished Teaching Award (1995). BS Math (MIT, 1969), MS CS (Stanford, 1975), PhD Science & Math Education (UC Berkeley, 1985). Good friend of Don Hopkins; proposed as a joint guest with Jens Mönig, centering his books + lifelong Logo work."

