gist: |
  Don wrote to Brian Harvey (UC Berkeley) about wiring **SimCity / Micropolis** and **CAM6
  cellular automata** into **Snap!**, the visual programming environment. Brian looped in Jens
  Mönig (Snap! co-creator). Don discussed connecting Snap! blocks to live simulation parameters —
  Logo/Scheme/Smalltalk-Morphic heritage meeting an open, modifiable city simulator for the classroom.
  Same constructionist thread as **Alan Kay** on the OLPC list (Nov 2007 “SimCity Rules” — glass-box
  sim, not black box). Today: **MicropolisReactive.svelte.ts** (Svelte 5 runes) binds WASM ↔ UI;
  Snap! blocks call the same `poke` / `getSnapshot` façade.

