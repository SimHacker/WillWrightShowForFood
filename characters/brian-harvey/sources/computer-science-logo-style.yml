the_hook: |
  Logo as a serious language for serious ideas — not a toy prefix on "learning to code."
  Volume by volume: procedures, data structures, recursion, compilers — the curriculum
  Brian spent a career making legible.

why_don_loves_it: |
  Don's whole microworld stack — SimCity, pie menus, MOOLLM skills — assumes learners can
  *reprogram the system they're inside*. Brian's books are the pedagogy that makes that assumption
  honest instead of magical thinking.

