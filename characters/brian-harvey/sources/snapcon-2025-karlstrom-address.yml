  - "Curriculum vs friendship — the Karlstrom talk's real subject"
  - "ACM embarrassed about Machinery — parallel to Shneiderman's Human-first HCIL vs CHI"
  - "Anonymous procedures (lambda) — Brian's Snap! contribution in his own words"
  - "AI in schools — Brian's skeptical transitional-issue argument (pair with Doctorow canonization thread?)"
