# Jesus Mouse — memorial portrayal (in memoriam). NOT Jesus Mouse.
# Memorial mode: represent + discuss, never interview. Standards: ../../schemas/portrayal-standards.md#memorial-mode

character:
  id: jesus-mouse
  name: "Jesus Mouse"
  type: memorial
  signifier: "🕯️🐭✝️"
  status: deceased
  field: "Street mythology — Haight/Ashbury; embodied Jesus × Mickey Mouse as American archetypes"
  home: characters/jesus-mouse/
  known_as: "Jesus Mouse"   # public street name; legal name not collected
  when_where:
    - "early 1990s — Haight Street coffee shop regular, San Francisco"
    - "InterCHI '93 — Amsterdam, Homegrown Fantasy Coffeeshop (Don's last sighting)"

representation:
  governed_by: ../../schemas/portrayal-standards.md#memorial-mode
  consent_level: 5_deceased_legacy
  authored_by: don-hopkins

invitation:
  status: memorial
  document: memorial.md
  note: "Deceased — represent + discuss Don's published memoir; Soul Model worked example; not an interview guest"

relationship:
  to_project: design_receipt
  to_soul_model: |
    Tangible example of Self multiple inheritance: one soul inheriting Jesus AND
    Mickey Mouse (what he lived and stated) vs two minds with separate wells.
    Linked from moollm skills/soul-city/SOUL-MODEL.md for busy readers.

bio:
  summary: |
    **Jesus Mouse** — Haight Street regular who dressed as the combination of
    America's two biggest shared archetypes (Jesus and Mickey Mouse), charged
    tourists for selfies, carried a jester-headed wizard stick and sequined spell
    book, and told Don explicitly that embodying both was his intention. Mission
    (as told to Don): pass the Vatican's Second Coming test on their terms, then
    demand they liquidate treasures for the poor. Last Don sighting: Amsterdam
    InterCHI '93. Later passed away (relayed by a mutual friend).

memorial:
  mode: represent_and_discuss
  who_can_discuss:
    - { who: don-hopkins, why: "Knew him on Haight Street; published the memoir on HN; last sighting Amsterdam '93" }
  artifacts:
    - "HN comment 2023-01-16 — news.ycombinator.com/item?id=34398396"
    - "sources/hn-34398396.md — cleaned memoir text"

# Latent-space imports — from <well> import <dimension.aspect> as <local> (spec syntax)
# Canonical: sources/latent-imports.md
latent_imports:
  canonical: sources/latent-imports.md
  grammar: "from <latent_module> import <dimension.aspect> as <local_name>"
  parents:
    - jesus_christ      # soul, hair, beard, myth-well, vatican test, mission, declaration
    - mickey_mouse      # soul, hat, tail, myth-well
    - the_wizard        # scepter, jester head + key, sequined spell book
    - haight_ashbury    # coffee-shop regular, hippie parade
    - tourism           # $5 selfie economy
  dimension: costume_soul_props_mission_praxis
  kin_parallel: donald-michie

latent_import: |
  # from <module> import <dimension.aspect> as <local>
  from jesus_christ import soul.jesus as jesus
  from jesus_christ import hair.long as hair
  from jesus_christ import beard.long as beard
  from jesus_christ import archetype.american_myth as jesus_well
  from jesus_christ import mission.second_coming_test as vatican_test
  from jesus_christ import mission.liquidate_treasures_for_the_poor as mission

  from mickey_mouse import soul.mickey as mouse
  from mickey_mouse import costume.hat as hat
  from mickey_mouse import costume.long_tail as tail
  from mickey_mouse import archetype.american_myth as mouse_well

  from the_wizard import props.walking_stick as scepter
  from the_wizard import props.jester_head.purple as jester_head
  from the_wizard import props.spell_book.sequined as spell_book

  class JesusMouse(Jesus, MickeyMouse, Wizard):
      wells = (jesus_well, mouse_well)
      look = hair | beard | hat | tail | scepter | jester_head | spell_book
      body = 1

soul_inheritance:
  parents:
    - { archetype: jesus-christ, contributes: [soul_well, hair, beard, mission, vatican_test, declaration], mnemonic: "Jesus as in Christ" }
    - { archetype: mickey-mouse, contributes: [soul_well, hat, long_tail], mnemonic: "Mouse as in Mickey" }
    - { archetype: the_wizard, contributes: [scepter, jester_head, spell_book] }
  blend: Jesus Mouse
  lived: true
  dimension: soul_costume_props_mission
  not: "Not pronunciation-only (that's Duckmouse). Full costume + wells + props + mission."
  kin_parallel: donald-michie
  inventory: sources/latent-imports.md

soul_model_variations:
  blended_soul:
    lived: true
    sketch: 'parents: ["Jesus", "Mickey Mouse", "Wizard"]'
    python: sources/latent-imports.md
    note: "Exactly his stated intention — one body, two myth wells, wizard props, combined."
  two_minds:
    lived: false
    sketch: "minds: jesus-cup + mouse-cup"
    note: "Valid alternate Self architecture — not what he performed."
  see: "https://github.com/SimHacker/moollm/blob/main/skills/soul-city/SOUL-MODEL.md#jesus-mouse--blended-soul-vs-two-minds"

