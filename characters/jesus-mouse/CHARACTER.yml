    sketch: "minds: jesus-cup + mouse-cup"
    note: "Valid alternate Self architecture — not what he performed."
  see: "https://github.com/SimHacker/moollm/blob/main/examples/adventure-4/SOUL-MODEL.md#jesus-mouse--blended-soul-vs-two-minds"

