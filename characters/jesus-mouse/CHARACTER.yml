bio:
  summary: |
    **Jesus Mouse** — Haight Street regular who dressed as the combination of
    America's two biggest shared archetypes (Jesus and Mickey Mouse), charged
    tourists for selfies, carried a jester-headed wizard stick and sequined spell
    book, and told Don explicitly that embodying both was his intention. Mission
    (as told to Don): pass the Vatican's Second Coming test on their terms, then
    demand they liquidate treasures for the poor. Last Don sighting: Amsterdam
    InterCHI '93. Later passed away (relayed by a mutual friend).

memorial:
  mode: represent_and_discuss
  who_can_discuss:
