bio:
  summary: |
    **Randall B. Smith** — co-creator of **Self** with David Ungar; co-author of
    **The Power of Simplicity** (OOPSLA 1987) and **Programming as an Experience:
    The Inspiration for Self** (ECOOP 1995). Before Self, at Xerox PARC, he built the
    **Alternate Reality Kit (ARK)** — a physics-based animated world where simulation
    objects carry mass and velocity and you program by grabbing things — and wrote the
    CHI 1987 paper naming the **tension between literalism and magic** that UI designers
    have been quoting ever since. At Sun Labs with Ungar: **Us** (subjective
    object-oriented programming — one object, many perspectives), the **Self 4.0**
    environment, **Kansas** (a shared flat world so big everyone lives in one space —
    used for distance-learning experiments), and **Morphic** (with John Maloney), the
    direct-manipulation UI framework that jumped to **Squeak** and shaped Etoys and the
    live-objects world after it. Physicist by training (Ph.D. UC Davis); Sun Labs
    Distinguished Engineer; later collaborative virtual worlds at Sun Labs.
  don_credit: |
    Don's Self credit always names both designers: "you (and Urs, and Randall)."
    ARK's literalism-vs-magic tension is load-bearing in Don's UI writing — pie menus
    are a magic act wearing a literal costume. Morphic is the bridge from Self's UI to
    the Squeak/Etoys lineage Don keeps on the show's family tree; Kansas prefigures
    every shared-world microworld MOOLLM builds in directories.

