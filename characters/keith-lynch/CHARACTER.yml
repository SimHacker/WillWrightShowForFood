    **Keith F. Lynch** — on the ARPAnet from 1977 (TI Silent 700, TIP/TAC dialup, MIT ITS
    guest culture). His July 1994 email to Ronda Hauben, republished at
    [keithlynch.net/history.net.html](https://keithlynch.net/history.net.html), is a standard
    reference for early net folklore (Zork on DM, SEND→DDT guest login, Bandykin, netism).

