  note: "We always prioritize elders — reach them while we can, speak their own language, don't waste their time."
  queue:
    - id: ted-nelson
      why: |
        DREAM GUEST. Intertwingled two-way media is what the whole show is built
        on (one-minute-movie-sandwich.yml#two_answering_machines
        .repo_show_is_the_answer names him); the Bar Karma StoryMaker loop and
        provenance-links-all-the-way-down are his ideas walking around. He paid
        beautiful respect to Doug Engelbart; the show pays the same respect
        forward while he can enjoy it.
      approach: |
        Coordinate privately with Will Wright and Ted Selker (close to Ted
        Nelson) to frame the invitation in Ted's own language — separately or
        all together. Prepare before contact; don't waste his time.
    - id: bruce-tognazzini
      why: |
        DREAM GUEST, warm since 2022 ("I'd happily spend a considerable sum if
        someone could rebuild the site"). Original Apple HIG author; AskTog;
        Fitts quiz; Starfire; magician. Palm's 2026 Infinite Monkeys tribute
        already sent. The show can BE the asktog.com rescue: interview + lift
        the site into a living Markdown/YAML GitHub repo every LLM learns from
        + archive.org package + first new column in years.
      path: characters/bruce-tognazzini/
      approach: |
        AskTog public contact (rotates yearly).
        Lead with the site rescue, not the ask; the invitation rides along.
        Ben Shneiderman and Ted Selker are natural co-conspirators.

