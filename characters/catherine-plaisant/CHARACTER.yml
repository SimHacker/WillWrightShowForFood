invitation:
  status: draft
  document: invitation.md
  relationship: >-
    HCIL colleague of Don's from 1987; co-author of the 1991 HyperTIES paper.
    In recent correspondence with Don and Ben Shneiderman about HyperTIES
    history, PIXIE and Roger Gregory's Xanadu draft.
  note: "Her HCIL page (2022) says she is fully retired and not taking students or review work. Ask for nothing that is work."

bio:
  summary: |
    Doctorat d'Ingénieur, Université Pierre et Marie Curie, Paris; earlier a
    research associate at the Centre Mondial Informatique et Ressource Humaine
    in Paris. At the University of Maryland's Human-Computer Interaction Lab
    from 1987, where her first project was hypertext. Interim director, then
    associate director of HCIL from 1997; senior research scientist at UMIACS.
    Co-author with Ben Shneiderman of Designing the User Interface (4th to 6th
    editions). Editor of the HCIL video reports (1991-2006). Retired in June
    2021; Research Scientist Emerita, UMIACS.
  known_for:
    - "Designing the User Interface, 4th to 6th editions (2005, 2010, 2016), with Ben Shneiderman and others"
    - "SpaceTree (InfoVis 2002, with Grosjean and Bederson); InfoVis Test of Time award, 2022"
    - "LifeLines, EventFlow and EventAction: visualizing personal histories and event sequences"
    - "Touchscreen toggle switches (with Wallace, 1990; CHI '92 video); high-precision touchscreens (with Sears and Shneiderman, 1990)"
    - "Co-edited BELIV 2006, the first workshop on evaluating information visualization; co-chaired the first IEEE Visual Analytics Challenge (2006)"
  awards:
    - "ACM SIGCHI Academy, 2015"
    - "INRIA International Chair, 2018"
    - "IEEE VGTC Visualization Career Award, 2020"
    - "ACM SIGCHI Lifetime Service Award, 2020"

shared_work_with_don:
  hyperties_paper: "Shneiderman, Plaisant, Botafogo, Hopkins, Weiland. Designing to facilitate browsing: a look back at the Hyperties work station browser. Hypermedia 3(2), 1991. HCIL-90-02. Describes 'mouse ahead display suppression' for pie menus."
  hyperties: "The HyperTIES browser, developed by Ben Shneiderman, Bill Weiland, Catherine Plaisant and Don Hopkins; the 'road pizza' architecture diagram drawn on a Xerox Star with Ben."
  history: "In 2022 Ben and Catherine were running an HCI history group; Ben proposed a HyperTIES history paper. Don restored HyperTIES at hyperties.org."

