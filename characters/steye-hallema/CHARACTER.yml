bio:
  summary: |
    **Steye Hallema** (b. 1976) — composer, director, inventor. Studied Beeld en Geluid at the
    art academy and Royal Conservatory The Hague. Son of a magician; builds career around
    creating magic with advanced media so the **audience co-creates** rather than consumes.
    Co-founder era: **PIPS:lab** (composer/musician/writer/actor, ~1999–2013) with Keez Duyves
    and others. VPRO Medialab creative lead; **Creative Director, Jaunt VR / JauntXR EMEA**
    (~2016–2017). Founder / creative director **The Smartphone Orchestra** and WildVreemd;
    volumetric work with **4DR Studios** (Eindhoven). Filmacademie Artist in Residence (VRAcademy).

