bio:
  summary: |
    At **Los Alamos National Laboratory**, Josh Siegel built NeWS front ends that pushed the
    system harder than almost anyone: **LGATE**, the SDI war-game simulation demoed at the
    Pentagon (with Bret Thayler), and **MPM** ("Tanks & AirPlains"), a conventional-warfare
    front end — panels the Joint Chiefs used to drive simulators running on Crays, all on an
    8 MB Sun 3/60 era stack.

    In 1990 **James Gosling arranged an interview at Sun**; Don lobbied for someone to "tell
    him about the peaceful things he could be doing." Josh joined the NeWS group, **rewrote
    the NeWS PostScript interpreter** from Gosling's original design, and worked with Don on
    **owm** — the Open Window Manager: X11 and NeWS windows integrated under tabbed frames,
    pie menus, a scrolling desktop, and multiple rooms, written entirely in object-oriented
    NeWS PostScript. In the 1991 TNT window-management fight he argued the pure-ICCCM side —
    the debate is preserved verbatim in Don's archive.

    Later: **General Magic**, Magic Cap Core Technology, working with Bill Atkinson and
    Andy Hertzfeld.

