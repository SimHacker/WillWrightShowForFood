bio:
  summary: |
    **Rudolf von Bitter Rucker** (b. 1946) is a mathematician, computer scientist, and a founder of
    the **cyberpunk** literary movement. PhD in mathematical logic/set theory (Rutgers); taught at
    SUNY Geneseo, Heidelberg (Humboldt fellowship), and Randolph-Macon, then — inspired by an
    interview with **Stephen Wolfram** — became a CS professor at **San José State University**
    (1986–2004, emeritus). Best known for the **Ware Tetralogy** (*Software*, *Wetware*, *Freeware*,
    *Realware*); *Software* and *Wetware* won the first two **Philip K. Dick Awards**. Pioneer of
    **transrealism**; nonfiction includes *Infinity and the Mind*, *The Fourth Dimension*, and
    *Mind Tools*. Four generations removed from the philosopher **G. W. F. Hegel**.
  cellular_automata: |
    Hired by **John Walker** of **Autodesk** after Hackers 2.0 (1987), Rucker worked there 1988–1992
    and shipped three products: **CA Lab: Rudy Rucker's Cellular Automata Laboratory** (later free as
    **CelLab**), **James Gleick's CHAOS: The Software**, and **BOPPERS: Artificial Life Laboratory**.
    That work fed his novel *The Hacker and the Ants*. CelLab's illustrated manual and rule catalog
    are, in Don's view, spectacular — a prime candidate to seed a MOOLLM CA skill.

