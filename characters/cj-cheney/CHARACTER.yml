bio:
  summary: |
    **C. J. Cheney** worked at the University of Cambridge Mathematical Laboratory and is best known
    for **Cheney's algorithm** — the elegant non-recursive, breadth-first **stop-and-copy garbage
    collector** described in "A Nonrecursive List Compacting Algorithm," *Communications of the ACM*
    13(11), November 1970, pp. 677–678. It splits the heap into two semispaces and copies live
    objects with just two pointers (scan/free), avoiding recursion — foundational to copying and
    generational garbage collectors ever since. He was also a co-author of the **RAINBOW** CAD-system
    paper (1972), which is why he belongs to this Cambridge storyline.
  status_note: "Living-or-passed status UNKNOWN — confirm via Heinz Lemke / Cambridge records before any memorial framing."

