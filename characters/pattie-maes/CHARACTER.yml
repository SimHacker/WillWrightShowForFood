bio:
  summary: |
    Professor at the MIT Media Lab; founded the Software Agents group, now leads Fluid Interfaces.
    PhD, Vrije Universiteit Brussel AI Lab; behaviour-based action selection with Rodney Brooks's
    group at the MIT AI Lab. "Agents that Reduce Work and Information Overload" (CACM, 1994).
    Co-founded Firefly (collaborative filtering), acquired by Microsoft in 1998. Debated Ben
    Shneiderman on direct manipulation vs. interface agents at IUI 97 and CHI 97.
  known_for:
    - "Learning interface agents (CACM 1994)"
    - "Software Agents group, then Fluid Interfaces group, MIT Media Lab"
    - "Firefly — collaborative filtering, acquired by Microsoft 1998"
    - "Behaviour networks / action selection (late 1980s)"
    - "1997 debates with Ben Shneiderman (IUI 97, CHI 97)"

the_slide:
  what: "Slide 13, 'Agent UI solutions', from her Software Agents Debate deck, Jan '97"
  seen: "Shown again in her talk, October 2026; photographed from the audience by Cyrus Shaoul"
  bullets:
    - "make user model available to user"
    - "method of operation has to be understandable to user"
    - "explanations should be available"
    - "gradual approaches work best"
    - "give continuous feedback to user about agent's state, actions & learning"
    - "allow variable degrees of autonomy (user decides)"
    - "allow user programming of the agent (teach/forget)"
    - "avoid making user learn a new language; use language of application to communicate between agent & user"
  read_against: agent-ui-solutions.md

connections:
  ben-shneiderman: "1997 debates; he quoted her 'make the user model available to the user' back approvingly"
  henry-lieberman: "MIT; she cited his teach-by-demonstration work from the IUI 97 stage, with him in the audience"
