bio:
  summary: "**Gary Drescher** — AI researcher and philosopher. **MIT PhD** under **Marvin Minsky** → **Made-Up Minds** (MIT Press, 1991): the **schema mechanism** — an agent that learns **schemas** (context → action → result) from raw experience via **marginal attribution** and **synthetic items** (Piaget made to run). **Good and Real** (2006): determinism, choice, acausal cooperation. **Leela AI adviser**; longtime friend of **Henry** and **Milan Minsky**. His thesis underpins Leela's technology and MOOLLM's schema-mechanism / schema-factory / play-learn-lift skills."

connections:
  will_wright: "Same pun, two projects — Will teaches players to 'make up minds' (Sims, motives, Proxi); Drescher names the constructivist mechanism. Dream crossover interview."
  leela: "Adviser to Leela AI; friend of Henry Minsky (co-founder/CTO) and Milan Singh Minsky (VP Product) — Leela leaders carrying constructivist AI into production."
  henry_python: "Henry Minsky has built a Python implementation of Drescher's schema mechanism (a 'schema factory') — a living substrate to build on."
  schema_lineage: "The through-line: Piaget's constructivism → Drescher's schema mechanism → Leela's Piaget-schema learning (Steve Kommrusch, Henry Minsky)."
  neuro_symbolic: "The frame for a show together: Leela does **neuro-symbolic AI** — conscientiously combining 'scruffy'/symbolic and 'neat'/neural approaches (two independent-but-correlated axes). Neural vision models are powerful but **black boxes**; symbolic reasoning (schemas, frames, reversible inference) can answer **'why'**. Layered and synthesized, each reinforces the other and mitigates the other's weaknesses — Drescher's constructivist schema mechanism meeting modern deep learning. Deep hands-on experience; lots to talk about."
  llm_breakthrough: "LLMs ground symbolic schema terms in world-knowledge — MOOLLM operationalizes Drescher as skills (schema-mechanism, schema-factory, play-learn-lift) that can surpass Lisp/Python implementations while keeping causal discipline."
  moollm_skills:
    - "https://github.com/SimHacker/moollm/tree/main/skills/schema-mechanism"
    - "https://github.com/SimHacker/moollm/tree/main/skills/schema-factory"
    - "https://github.com/SimHacker/moollm/tree/main/skills/play-learn-lift"
    - "https://github.com/SimHacker/moollm/tree/main/skills/schema"
  made_up_minds_essay: made-up-minds.md
  ai_koan_canon: "Subject of the classic AI koan 'Drescher and the Toaster' (compiled by Danny Hillis, MIT AI Lab / Jargon File) — proselytizer offers a personality test 'because I want you to be happy'; Gary toasts it: 'I wish the toaster to be happy, too.' Simultaneously a subject of the lab's humor canon and author of the mechanism that explains it."
  memo_603_resolution: "Minsky's AI Memo 603 (Jokes, Nov 1980) says censors are learned but never says how. Proposed resolution: a censor is a schema with the sign bit flipped; marginal attribution over one's own failures is the learning rule; laughter is the training signal. Prime interview thread — see ideas.md hooks 9-10."

