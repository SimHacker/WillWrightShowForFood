bio:
  summary: |
    **Andrew Quitmeyer** interned at Will Wright's **Stupid Fun Club**, studied at **Georgia Tech**
    under **Janet Murray**, and runs **Digital Naturalism Laboratories** — field science and playful
    ubicomp at the intersection of nature, bodies, and check-in culture. His **Mark Your Territory**
    project (Foursquare-style territory marking) is the perfect foil for Don's **Bongo Bingo**
    (bike-around-Amsterdam Foursquare bingo on coffeeshops — the TomTom project that re-hired Don
    into SFC). He posted the classic **Nancy the Van Seat** SFC video (2011).

