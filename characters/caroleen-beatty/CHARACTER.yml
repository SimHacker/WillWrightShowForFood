bio:
  summary: |
    **Caroleen Beatty** sang every song on Doug Hilsinger's 2004 track-for-track cover of
    **Brian Eno's *Taking Tiger Mountain (By Strategy)*** (DBK Works #111) — the record Eno
    himself blessed as "beautiful music" made from his "cold experiments." It was her idea:
    during a covers session she said "I love this record... Let's do the whole album!"
    Bay Area scene veteran — fronted **The Bedlam Rovers**, sang in **Waycross** with Doug,
    collaborated with **Jon Langford** of the Mekons, and performed the album live as the
    **ENORCHESTRA**.
  note: |
    Invited both as a guest in her own right and as a warm path to Doug Hilsinger
    (saucefaucet.com is offline; Bandcamp form + legacy email are the current channels).

relationship:
  kind: musician_invitee
  don_connection: |
    Don was given the Tiger Mountain CD by Doug at The Eagle in 2006 and has told the story
    ever since; Caroleen's voice is the first thing he praises about it.

