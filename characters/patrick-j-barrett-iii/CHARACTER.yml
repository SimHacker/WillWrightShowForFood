bio:
  summary: |
    **Patrick J. Barrett III** implemented social interactions on the original **The Sims**
    (1999–2000). Working from an older design document, he coded **same-sex romantic
    interactions** — tagging interactions as romantic and letting preference emerge from
    player-directed behavior rather than fixed personality traits. **E3 1999:** two female Sims
    kissed during the live demo; EA kept the feature. *"It was a magical moment when my first
    same-sex Sims couple kissed. I still sometimes wonder how in the world I got away with it."*
    (New Yorker / Game Developer, 2014). Will Wright approved: glad to see same-sex support back.

