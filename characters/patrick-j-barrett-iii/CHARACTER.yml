bio:
  summary: |
    **Patrick J. Barrett III** implemented social interactions on the original **The Sims**
    (1999–2000). Hired ~Oct 1998, he coded **same-sex romantic interactions** on his own
    initiative — romantic tags; preference emerging from player-directed behavior rather than
    fixed personality traits — while the **production database had not yet spec'd** Don Hopkins's
    Aug–Oct 1998 design reviews (see [integrated story](sources/same-sex-relationships-integrated-story.md)).
    **E3 1999:** two female Sims kissed autonomously during the live demo; EA kept the feature.
    *"It was a magical moment when my first same-sex Sims couple kissed…"* (Barrett, New Yorker 2014).
    Will Wright approved: glad to see same-sex support **"back in the game."**

  press_note: |
    2014 press (Parkin/New Yorker) reported an "outdated design doc" and "team decided too
    controversial" — incomplete vs Don's marked-up PDFs, which show written docs **promising**
    inclusion after Aug 1998. Patrick may not have seen those reviews when hired. See
    sources/same-sex-relationships-integrated-story.md § Press discrepancies.

