card:
  name: Tom Lord
  title: The Scheme Underground
  rarity: legendary
  signifier: 🕯️
  flavor: Nobody stays pure.
abilities:
- id: TOM-UNIVERSAL-ENGINE
  name: Universal Engine
  type: activated
  mana: '{U}{U}'
  conditions:
  - 'show_topic_matches_public_work: true'
  advertisement:
    method: universalEngine
    signature: universalEngine(scheme) → many languages, one substrate
    score_when:
    - trigger: audience_learns_something_true
      weight: 0.85
  effect: Fork SCM into GEL, sell RMS on one Scheme engine under all of GNU. Vindicated decades later by Guile 3.0 under Guix.
  verifiable: GEL/Guile origin; Guile manual history; guix-devel remembrance
  combos_with:
  - DON-AXIS-OF-EVAL
- id: TOM-TCL-WAR
  name: Account of the Tcl War
  type: activated
  mana: '{R}{U}'
  conditions:
  - 'show_topic_matches_public_work: true'
  advertisement:
    method: tclWar
    signature: tclWar(usenet) → definitive insider history, murky From line
    score_when:
    - trigger: audience_learns_something_true
      weight: 0.85
  effect: Ignite and chronicle free software's formative flamewar. Authorship deliberately murky — a semi-prank by "the Scheme underground."
  verifiable: Tom's published account (basiscraft.com, archived); Vanderburg's flamewar archive
  combos_with:
  - DON-SIMCITY-TCLTK
- id: TOM-DISTRIBUTED-ARCH
  name: Tom Lord's Arch
  type: activated
  mana: '{G}{G}'
  conditions:
  - 'show_topic_matches_public_work: true'
  advertisement:
    method: tla
    signature: tla(cvs) → distributed version control, years before git
    score_when:
    - trigger: audience_learns_something_true
      weight: 0.85
  effect: Ship the distributed version control argument in 2001. The argument won completely; the tool got eclipsed. That counts.
  verifiable: GNU arch (Wikipedia); LWN remembrance
  combos_with: []
- id: TOM-I-HATE-YOU
  name: I Hate You (Love Letter)
  type: passive
  mana: '{B}{W}'
  conditions:
  - 'show_topic_matches_public_work: true'
  advertisement:
    method: oppositionality
    signature: oppositionality(friendship) → be straight about the negatives, then have a real conversation
    score_when:
    - trigger: audience_learns_something_true
      weight: 0.85
  effect: 'Hate Man and the brothers of People''s Park "basically saved my life" (Tom, 2010). Heated argument as the grammar of love: the argument is the handshake.'
  verifiable: 2010 Facebook exchange (sources/2010-04-hate-man-facebook-exchange.md, screenshot in media/); SF Chronicle Hate Man profile (archived)
  combos_with:
  - TOM-TCL-WAR
- id: TOM-FULL-STRENGTH
  name: Full Strength in Public
  type: passive
  mana: '{W}'
  conditions:
  - 'show_topic_matches_public_work: true'
  advertisement:
    method: civicIntensity
    signature: civicIntensity(berkeley) → housing, climate, young writers
    score_when:
    - trigger: audience_learns_something_true
      weight: 0.85
  effect: Berkeley Daily Planet, Housing Advisory Commission, climate emergency truth-telling, Writer Coach Connection. The same fire, aimed at the city.
  verifiable: Obituary by Trina Pundurs, Berkeley Daily Planet
  combos_with: []
- id: TOM-COMMODITY-FETISH
  name: Chapter 1 in a Nutshell
  type: instant
  mana: '{U}{R}'
  conditions:
  - 'show_topic_matches_public_work: true'
  advertisement:
    method: marxianPun
    signature: marxianPun(teledildonics) → corporate standup → Capital vol 1
    score_when:
    - trigger: audience_learns_something_true
      weight: 0.9
  effect: Deadpan product-management questions on Kyle Machulis's Buttplug thread; land on commodity fetishism with a conventional-fetish pun for icing. Deldo lineage. Not shameful.
  verifiable: teledildonics-hn-2020.md; HN item 23094477; Deldo video D1sXuHnf_lo
  combos_with:
  - TOM-TCL-WAR
invoke_rules:
  consent: memorial
  simulation: false
  note: "Memorial — celebrate documented work + his own published writings; do not speak as him; Don can remember him; family consent (Trina Pundurs) guides anything show-bound."
