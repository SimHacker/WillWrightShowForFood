memorial:
  mode: represent_and_discuss
  rule: "Represent and discuss his documented work, his own published writings, and the stories friends tell. Do not interview, do not speak as him, invent no inner life or quotes."
  family: "Survived by his wife Trina Pundurs (author of his obituary, Don's friend), mother Luanna Pierannunzi, and extended family. Nothing about Tom reaches a show without Trina's blessing."
  who_can_discuss:
    - { who: don-hopkins, why: "Close friend; decades of heated arguments about Tcl, Tk, and extension languages; corresponded since at least 1998 (XML vs S-expressions thread with RMS); the 2006 Self/V8 conversation" }
  draw_on_for_shows:
    - "**GEL → Guile** — forked Aubrey Jaffer's SCM into an embeddable library at Cygnus in 1993 and talked RMS into blessing it as the official GNU extension language; early maintainer of Guile"
    - "**The Tcl War (1994)** — his own published account: Sun declaring Tcl 'the ubiquitous scripting language of the Internet,' his Scheme-based GDB GUI skunked by a quick Tcl/Tk one, venting to RMS, and 'Why you should not use Tcl' landing on comp.lang.tcl with deliberately murky authorship — 'a semi-prank by the Scheme underground'"
    - "**GNU arch (tla)** — started 2001, one of the earliest distributed version control systems, part of GNU in 2003; Canonical's first Bazaar began as a fork of tla; the DVCS argument arch pioneered was later won by git"
    - "**Andrew Project** at Carnegie Mellon (1987) — where his career began"
    - "**FSF staff** in the early 1990s, developing for the GNU Project"
    - "**Nobody stays pure** — even Tom, patron saint of the embeddable Scheme interpreter, compiled the performance-critical parts of his Scheme editor with the Hobbit compiler (his own account)"
    - "**Universal engine argument** — one Scheme engine executing many surface languages; vindicated decades later by Guile 3.0 under Guix"
    - "**Berkeley civic life** — Berkeley Daily Planet contributor; appointed to the City Housing Advisory Commission in 2016; after the IPCC SR15 report, a tireless advocate for treating the climate emergency as an actual emergency; Writer Coach Connection volunteer at Longfellow Middle School"
    - "**People's Park** — a place and a society that held great meaning for him (obituary); in his own 2010 words, 'Hate man and several of the brothers in the park basically saved my life' (sources/2010-04-hate-man-facebook-exchange.md)"

bio:
  summary: >
    **Thomas Lord** (1966–2022) — free software developer, extension language
    philosopher, and Berkeley housing and climate advocate. Born in Pittsburgh,
    educated at Johns Hopkins and Carnegie Mellon, he began his career on CMU's
    Andrew Project in 1987, worked for the FSF in the early 1990s, and at Cygnus
    in 1993 forked SCM into GEL, the embeddable library RMS blessed as the official
    GNU extension language — renamed Guile after trademark trouble. His account of
    the 1994 Tcl War is the definitive insider history of one of free software's
    formative flamewars. In 2001 he started GNU arch (tla), one of the earliest
    distributed version control systems. From 2004 he lived in Berkeley, where he
    threw himself into housing and climate advocacy with the same intensity he
    brought to language design. He died unexpectedly of a massive brain hemorrhage
    in June 2022, at 56.

