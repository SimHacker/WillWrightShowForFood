memorial:
  mode: represent_and_discuss
  rule: >
    Represent and discuss her documented public work and publicly shared advocacy.
    Do not interview, do not speak as her, invent no inner life. Only her real,
    documented words, with attribution. Prefer her chosen name Jennell in all
    present-tense and memorial text; historical credits may note prior publication
    names where bibliographically required.
  who_can_discuss: []   # fill as colleagues accept
  draw_on_for_shows:
    - "Dark Tower (1979, Judges Guild) — only non-TSR adventure on Dungeon's 2004 '30 greatest' list"
    - "Caverns of Thracia — non-linear 'Jaquaysing' dungeon design (loops, multiple paths)"
    - "The Dungeoneer fanzine — early third-party D&D culture"
    - "Coleco conversions (Pac-Man, Donkey Kong); later Age of Empires, Quake II/III, EVE Online"
    - "Dragon Mountain cover art (TSR)"
    - "Trans rights advocacy — Transgender Human Rights Institute (Seattle); Leelah's Law petition"
    - "Return to Perinthos memorial game jam / megadungeon (2024) — family + Trans Lifeline"

bio:
  summary: |
    **Jennell Allyn Jaquays** (1956–2024) was a game designer, artist, and level
    designer whose Judges Guild adventures **Dark Tower** and **Caverns of Thracia**
    (1979) defined non-linear dungeon design so thoroughly that designers still say
    **Jaquaysing** a map. *Dark Tower* was the only non-TSR entry on *Dungeon*
    magazine's 2004 list of the thirty greatest D&D adventures. She co-founded
    *The Dungeoneer*, illustrated widely (including *Dragon Mountain*), moved into
    video games (Coleco, Age of Empires, Quake II/III, EVE Online), and was an
    outspoken transgender rights advocate. Married to fellow game developer
    **Rebecca Heineman** (also memorialized here). Memorial projects after her
    death include the **Return to Perinthos** collaborative megadungeon.

