bio:
  summary: |
    **Keez Duyves** (b. 1971, Alkmaar) — founder of artist group **PIPS:lab**; Urban Nation
    calls him master of the impossible, image wizard, media genius, natural-born inventor.
    Denied early computer games at home, he and his brothers programmed their own; master's
    *cum laude* in Interactive Multi Media (Utrecht School of the Arts); chose art on purpose.
    PIPS:lab transforms new media into unexpected media — works for **participation, not just
    observation**. Signature tech: **Lumasol** light-writing → live-feedback **Luma2solator**
    (ZKM Karlsruhe among buyers; 500,000+ lightpaintings worldwide). Also Scoretrack,
    **AnywaysVR**, duo **Hybrid Sculptors** with Thomas Bratzke (ZASD). Flagship show piece for
    Will: **Die Space** — "the first interactive social network community for people who have
    already passed away, so you can still chat when you're dead" (TEDxAmsterdam 2012).

