bio:
  summary: >
    Creative technologist, 25+ years building novel interaction on the web. Works at **Apple** in the
    **Vision Products group on Spatial Web Technologies**, prototyping and advocating for new ways to
    express and understand over the web on spatial machines. Active in the **Near Future Laboratory**
    and **Future of Text** communities. Posts interactive sketches on Twitter, CodePen and ShaderToy.
  his_own_framing: >
    From zachernuk.com: his work is informed by "taking a long view of technological development (back
    to the origins of writing and beyond), a firm belief in embodied cognition/extended mind, and the
    nearly-limitless [potential] for human neuroplasticity and adaptiveness." His 2022 portfolio page —
    built around embodied cognition and writing-as-a-technology — is what got him the Apple role.
  unverified:
