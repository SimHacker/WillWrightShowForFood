bio:
  summary: |
    Lumpinou writes gameplay mods for The Sims 4 in Python. The flagship,
    [LGBTQIA+ / Gender & Orientation Overhaul](https://lumpinoumods.com/2022/06/07/lumpinous-lgbtqia-mod/),
    published 7 June 2022 and still maintained against EA patches, turns identity from a CAS
    setting into something Sims live through: gender identities including questioning, agender,
    non-binary, genderfluid and transgender; medical and non-medical gender affirmation played out
    in interactions, moodlets, sentiments and relationship statuses rather than a menu; romantic
    and sexual orientation split apart and modeled separately; optional self-discovery and coming
    out; queerplatonic partnerships; romance-free WooHoo for aromantic Sims; and an auto-assign
    system with tunable population percentages so a neighborhood is not uniformly straight by
    default. Every part of it can be turned off — the whole mod is built to be customized rather
    than imposed.
  why_it_matters: |
    This is procedural rhetoric done by a modder, on top of a game that stopped at the
    representation layer. EA shipped the wardrobe — gender-independent clothing in 2016, custom
    pronouns in 2022, an orientation setting in July 2022, binders and top surgery scars in the
    January 2023 patch. Lumpinou shipped the rules underneath it. That is the same move Patrick
    Barrett made in 1998 when he simply did not check sex, twenty-four years later and from
    outside the company.

