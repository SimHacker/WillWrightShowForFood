bio:
  summary: |
    **Tom van Dijk** wrote **IFF Pencil** as a teenager — the tool that helped the early Sims 1
    modding community decipher **SimAntics** and object formats — under the handle
    **mazelord2000**. He reverse-engineered the formats from hex dumps; IFF Pencil 2 is still
    in use. Now an assistant professor of computer science. Reconnected with Don in **June 2024**.

aliases:
