bio:
  summary: |
    **Tom van Dijk** wrote **IFF Pencil** as a teenager — the tool that helped the early Sims 1
    modding community decipher **SimAntics** and object formats. He reverse-engineered from hex dumps
    on family holidays; **Behavior.iff** (or similar shipped IFF) puzzled him — accidental modding
    aid or intentional? **EA Legal** (via PJB3, Feb 2002) forced removal of SimAntics material from
    his site. Nickname **mazelord2000**. Reconnected with Don **Jun 2024** after a LUCPIX request
    for steering-committee-era tools; recovered dusty archives; reflected on how modding/open
    source culture matured since the early 2000s.

aliases:
