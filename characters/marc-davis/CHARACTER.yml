bio:
  summary: |
    **Marc Davis** — media scientist and inventor. MIT Media Lab PhD (*Media Streams*:
    iconic visual language for video annotation, retrieval, and repurposing — developed
    with Golan Levin and Brian Williams). **Interval Research** (1993–1999): led automatic
    media production teams; Don Hopkins and **David Levitt** were colleagues there.
    *Garage Cinema* (CACM 1997): "professional video by hobbyists with camcorders."
    NPUC **1996 speakers' roundtable** photo — Marc is seated at the far left
    ([panel source](../ken-kahn/sources/npuc-almaden-panel.md)).

