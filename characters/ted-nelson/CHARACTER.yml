bio:
  summary: "**Ted Nelson** (b. 1937) — coined **hypertext** and **hypermedia**, founded **Project Xanadu**, and wrote **Computer Lib / Dream Machines** (1974). Champion of **transclusion**, visible parallel connections (Xanalinks vs jump-only weblinks), and **intertwingularity** — 'everything is deeply intertwingled.' A direct inspiration for Don's HyperTIES work at Maryland and a north star for the Repo Show."

# NOTE, deliberate: there is no "how to reach Ted" section in this public file, and there
# should not be. He is 89, he restricts his correspondence on purpose, and publishing a
# playbook for getting past that would be the opposite of respecting it — however
# admiringly written. Contact routing lives in Don's private correspondence records.
# What belongs here is the reverse: things Ted took the trouble to put ON the record.

corrections_from_ted: |
  Kept because he asked for the record to be right, and in one case said so outright.

  **"People think it sprang from the brow of Zeus."** Ted's own phrasing, supplied in June 2018
  when Don was transcribing his IEEE interview for people who would not watch the video and could
  not make out a name at 2:40. It is a line about how people imagine ideas arrive — fully formed,
  from nowhere — which is exactly the misconception his whole career argues against.

  **Klavs Landberg**, not "Klaus Landsberg." Ted corrected this himself in January 2020, after Don
  asked about the man Ted had credited with the term *self revealing* in a talk. Landberg was
  Ted's supervisor at Datapoint in 1981, and had written an operating system for the Datapoint 2200
  in Denmark "before they would acknowledge that it was a computer." With Harry Pyle he attempted
  an OS to "Outdo Unix" — "which was a bad idea, but I documented that system till Datapoint
  folded." Ted's closing line was **"Don't know how to put this in Wikipedia,"** which reads as a
  standing request. Consider it filed here in the meantime.

  Also: a misquotation of Ted on Hacker News — "you know NOT where" — was corrected at Don's
  request. Getting his words right is the least the rest of us can do.

