position_summary: |
  Modern **cut** = hide into invisible buffer; **paste** = plug/blurp from hidey-hole.
  True cut-and-paste = **parallel visible rearrangement** (Tolstoy's noodles, NY Times paste
  pots). **Cram and Vomit** (Ctrl+C/V). Alternative: **transclusion** + visible connections.

