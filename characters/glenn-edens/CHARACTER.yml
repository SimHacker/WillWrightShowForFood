notes: |
  GRiD Compass co-creator — often cited as first clamshell laptop (1982); Dynabook-inspired;
  Smalltalk on 8086; Alan Kay and Dan Ingalls played with it. Bullet-stopped-laptop story (US agency,
  not Mossad — returned units with shrapnel). 1982 mouse crisis: Tat Lam sole producer, Xerox took
  all; Glenn "appropriated" PARC mouse for Apple Lisa (Xerox was Apple investor). First GRiD to
  Steve Jobs (a bet); second to William F. Buckley; Larry Ellison sailing race computer.
  Interval Research circle (broadband → Avio Digital). Don's FMC Motor Home parked at Interval.
  Oct 2021 LinkedIn exchange; Dec 2022 Engelbart mouse consultation ([email redacted]).
  NOT Glenn Reid (PostScript Distillery) — different person.
