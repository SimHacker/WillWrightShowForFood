bio:
  summary: |
    Editor of Paleotronic Magazine. BASIC on a Timex Sinclair 1000 at six,
    then a Tandy MC-10, Commodore 64 and Atari 130XE; PC and Apple service
    technician. Two self-published novels, short stories and editorials;
    background music for the WebTV / MSNTV platform in the late 1990s. With
    April, turtleSpaces (a 3D Logo based on Apple Logo II) and microM8; the
    Paleotronic Kickstarter lists her as creator. Believes early electronics
    and programming are what future engineers need to solve humanity's
    problems.

