bio:
  summary: |
    **Diana Merry-Shapiro** (née Mayhugh; also known in the literature as **Diana Merry**)
    joined Xerox PARC as a secretary and became a programmer in Alan Kay's **Learning
    Research Group**. Original Smalltalk developer: early **overlapping window** systems,
    character scanners / text editors, font tools, and co-invention of **BitBLT**
    (bit-boundary block transfer) with Dan Ingalls, Larry Tesler, and Bob Sproull
    (Alto/Smalltalk-72 era; Ingalls later microcoded a redesign). Left PARC ~1986;
    continued in financial software still using Smalltalk; retired 2014. CHM oral
    history documents her first-person account of BitBLT and windows.

