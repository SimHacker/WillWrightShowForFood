# What Alan Kay says about Diana Merry-Shapiro — public sources only

character: diana-merry-shapiro
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Kay recruited Diana Merry from the physics lab — she was doing a typing service but showed "programming
    kind of thinking"; became one of the great PARC "bulldogs." At PARC she worked with Dan Ingalls on
    **BitBLT** and Smalltalk text/windowing. Kay's Quora PARC hiring answer is a primary portrait.

