bio:
  summary: >
    **Andrew Plotkin** ("Zarf") — interactive fiction author and toolsmith:
    games from *A Change in the Weather* (1995) and *Spider and Web* (1998)
    to the Kickstarter-funded *Hadean Lands* (2014); architect of the IF
    ecosystem's load-bearing infrastructure (the Glulx virtual machine, the
    Glk I/O standard, the Blorb packaging format); co-founder of the
    Interactive Fiction Technology Foundation (2016). In December 1989, as a
    CMU student, he announced MIDgaard — a "Multi-Implementor Dungeon" with
    object-oriented rooms and programmable object behavior — on the TinyMUD
    mailing list, and Don answered with the "what could be..." language
    letter.

# The 1989 primary record — why this room exists
tinymud_1989:
  announcement:
    date: "1989-12-03"
    from: "Andrew C. Plotkin <ap1i+@ANDREW.CMU.EDU>"
    what: |
      Zarf and Moonchilde announce MIDgaard, a "MID, for Multi-Implementor
      Dungeon": object-oriented environment instead of a flat database,
      object responses programmable "in a cheapo Pascalish language," and a
      real multi-word parser. Explicitly against the few-builders model:
      "To we of tinyMUD, of course, that ruins the whole point of the game."
  dons_reply:
    date: "1989-12-04"
    subject: "what could be..."
    thesis: >
      Do not invent a language — "language implementation is a bitch,
      language design is a big hairy mother of a bitch, and the biggest
      nastiest bitch of them all is writing the manual." Use an existing
      interactive language: PostScript/NeWS, Scheme, Forth, Perl; mine
      ZIL/MDL and DDL for ideas.
    archived: ../don-hopkins/sources/1989-tinymud-archive/tinymud.txt
  aftermath: >
    MIDgaard did not ship; the embedded-language MUD arrived as MOO
    (1990-91). Plotkin went on to build exactly the things Don's letter said
    were the hard part — a virtual machine (Glulx), an I/O standard (Glk),
    a packaging format (Blorb) — and wrote their manuals, which became the
    field's specs. In 2013 he shipped Seltani, a multiplayer hypertext world
    with player-writable Ages: the MIDgaard loop, closed on the web.
  evidence_note: >
    Plotkin's 2024 career interview with Jimmy Maher does not mention
    MIDgaard or TinyMUD at all; his IF origin story there begins in 1993-94.
    Don's archived copy of the announcement is therefore a primary source
    the subject's own retrospective omits. Treat "did not ship" as
    inference from silence, not from a statement, and ask him.
  source: sources/1989-12-midgaard-what-could-be.md

# Independently converged designs — the strongest show material
convergences:
  praser_5_filesystem_mud:
    when: "circa 1990, CMU"
    what: >
      Praser 5 began as a puzzle embedded in the CMU filesystem:
      directories as rooms, symlinks as exits, `ls` as look, a small
      executable linked into each directory as its verbs, and file
      permissions as the progression gate — on a shared multi-user machine.
      Later rebuilt as an Inform 6 parser game; the original survives in
      pre-ANSI K&R C. His stated intent was to subvert the filesystem, not
      to teach it.
    don_parallel: >
      Same twelve months, Don built the parallel room database inside Emacs
      instead of inside the filesystem: one window per room, clickable
      objects, a personal hypertext universe paralleling TinyMUD.
    descendant: "MOOLLM — filesystem as navigable space, directories as rooms"
    source: sources/2024-12-digital-antiquarian-interview.md
  the_glk_seam:
    what: >
      Plotkin's Glk origin story: two front ends times two virtual machines
      revealed that the VM only accepts text in and emits text out, so slice
      presentation away from the world model into its own layer.
    don_1989: >
      Don proposed the same seam to the TinyMUD list on 1989-12-20: typed
      output packets with object types and IDs, plus "download PostScript
      procedures to the mud server that tell it what format to send messages
      back to me. The standard text-based user interface would be just one
      such procedure."
    difference: >
      Don reached for NeWS, where the interface is code that travels to the
      display. Plotkin shipped a C API with a capability model, which is the
      one that got ported everywhere and still sits under Inform 7.
    source: sources/2024-12-digital-antiquarian-interview.md
  lisp_punchline:
    what: >
      Asked about Lisp: "Yes! I hate it!" — yet Lists and Lists (1996) is a
      Lisp tutorial with a Lisp interpreter running inside the Z-machine's
      64K, and Don's 1989 letter had recommended Scheme as the embedded
      language.
    source: sources/2024-12-digital-antiquarian-interview.md

