bio:
  summary: |
    **Melissa Bachman-Wood** — Maxis/EA, The Sims era. Named on a 2002 bug report as the previous
    assignee, which places her in the production or QA chain during *Deluxe + Unleashed*. She kept
    a box of material, photographed it for Maxis Alumni around **2017**, and then **mailed it to
    Don** — including the title page of **The Sims — Design Script**, which lists five working
    titles: *Project X*, *Jefferson*, *T.D.S. the Tactical Domestic Simulator*, *T.D.S. the Total
    Dollhouse System*, and *What the Hell Is It?*

why_she_matters: |
  **She is why the codenames are legible.** `TDSB.pdf`, `TDSBInfo.pdf`, `TDSEditToDo.pdf`, and
  `TDRObjects.pdf` sit in Don's published design-documents directory as cryptic filenames; this
  title page expands the acronym. **She tried to place the collection properly** — in the thread
  she says she would *"want to start with the Sims folks still at EA, since they own the
  franchise"* before approaching an outside library, which is an ex-employee doing rights
  diligence on her own memorabilia, unprompted. **And she mailed it to Don**, who confirmed
  receipt: *"Your wonderful package arrived in the mail! I will scan it and put the PDF online as
  soon as I get a chance!"*

