bio:
  summary: |
    Started textfiles.com (1998). Directed BBS: The Documentary (2005), GET LAMP (2010) and
    DEFCON: The Documentary (2013). Co-founded Archive Team (2009). At the Internet Archive since
    2011 as Free-Range Archivist and Software Curator: proposed JSMESS (2011); in-browser software
    from its October 2013 launch to more than 250,000 programs by 2023. Podcast: Jason Scott
    Talks His Way Out of It.
  known_for:
    - "textfiles.com (1998)"
    - "BBS: The Documentary (2005), GET LAMP (2010), DEFCON: The Documentary (2013)"
    - "Archive Team (2009), GeoCities rescue"
    - "Internet Archive software collections: Console Living Room, Internet Arcade, MS-DOS, Windows 3.x, HyperCard, Apple II (4am), Malware Museum, Flash via Ruffle"
    - "JSMESS, proposed and organized (2011), later folded into MAME's own JavaScript build"

credit_others:
  note: "The emulators were built by many people. Credit them by name where it matters."
  jsmess: "Justin Kerk (DopefishJustin) first to join; MAME developer Micko for per-driver JavaScript builds; many others named in Scott's 2015 post"
  emularity: "Daniel Brooks (db48x) with Jason Scott; John Vilk (BrowserFS)"
  em_dosbox: "Dreamlayers"
  ruffle: "The Ruffle Team (started by Mike Welsh); Archive integration first drafted by Guy Sowden"
  ten_year_retrospective: "Justin Kerk, Daniel Brooks, Vitorio Miliano, James Baicoianu, John Vilk, Tracey Jaquith, Jim Nelson, Hank Bromley"
  malware_museum: "Mikko Hypponen (F-Secure) with Jason Scott"

