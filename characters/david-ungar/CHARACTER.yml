bio:
  summary: "**David Ungar** — co-creator (with Randall B. Smith) of **Self**, the prototype-based object language that dropped classes entirely. **Multiple named `parent*` slots**, dynamic reparenting, **mirrors**. Thesis: **The Power of Simplicity** (OOPSLA 1987). Pioneered **generation-scavenging** GC and **adaptive JIT** — **maps/PICs** (with Chambers, Hölzle, Bak) → HotSpot → **V8**. Very open and influential — Don credits him with a huge share of where we are. Self doesn't run on everybody's phone; **in spirit it does** (JS object model, MOOLLM `# import self from self`). Kaleida **Conscientious Objectors** meetup; **self-interest** mailing list. **Worked at Laszlo Systems as a contractor** — offered a job, chose IBM Research instead (confirmed by David Temkin, Jul 2026); Don ran into him there (primary source: Don → Tom Lord email, 21 Aug 2006; Self factorial/`*` demo; JS compilability retort two years before V8). Invited to OL → Declare reunion as well as solo. Jan 2026 correspondence with Don about MOOLLM. Jul 2026: public LinkedIn reunion on Amanda Walker's Self-manual find — Ungar still programming in Self (Russell Allen / SIC on 64-bit Macs) and hoping to bring Self's exploratory IDE to spatial computing / Vision Pro."
  don_credit: |
    David was generous, open, and cross-pollinating — Conscientious Objectors, self-interest,
    papers, humor (Self: The Movie). Don: huge credit owed even if Self never shipped on every device;
    the ideas did — and the VMs (V8) borrowed the speed without the simplicity.
    And he literally opened Don's eyes and focused his attention: his foveation critique of the
    Unity3D pie menus' deselection flourish (peripheral motion is a hardware interrupt — animate
    the rejects and you summon the eye to exactly what the user just dismissed) became a standing
    design principle: "Motion is a foveation summons. Only send it where you want the eye."
    (fitts-and-foveation.md)

moollm_lineage:
