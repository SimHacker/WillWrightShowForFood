bio:
  summary: "**David Ungar** — co-creator (with Randall B. Smith) of **Self**, the prototype-based object language that dropped classes entirely. **Multiple named `parent*` slots**, dynamic reparenting, **mirrors**. Thesis: **The Power of Simplicity** (OOPSLA 1987). Pioneered **generation-scavenging** GC and **adaptive JIT** — **maps/PICs** → HotSpot → **V8**. Very open and influential — Don credits him with a huge share of where we are. Self doesn't run on everybody's phone; **in spirit it does** (JS object model, MOOLLM `# import self from self`). Kaleida **Conscientious Objectors** meetup; **self-interest!** mailing list. Interviewed at **Laszlo** and got OpenLaszlo (Don's recollection) — invited to the OL → Declare reunion as well as solo. Jan 2026 correspondence with Don about MOOLLM."
  don_credit: |
    David was generous, open, and cross-pollinating — Conscientious Objectors, self-interest!,
    papers, humor (Self: The Movie). Don: huge credit owed even if Self never shipped on every device;
    the ideas did — and the VMs (V8) borrowed the speed without the simplicity.

