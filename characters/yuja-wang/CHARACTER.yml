bio:
  summary: |
    **Yuja Wang** (b. 1987, Beijing) — Chinese-American concert pianist, Curtis Institute
    graduate, Deutsche Grammophon artist. Known for blistering technique and adventurous
    programming. Her *Flight of the Bumblebee* (Cziffra arrangement) became the rhythmic
    spine of Don Hopkins's *Flight of the PIXIE* — 1969 Cambridge radial-menu footage cut to
    match the speed of her hands. She has also explored **immersive music** and **VR**
    (including LA Phil's *The Rite of Spring* VR experience) — a natural kinship with
    historic GUI performance captured on film.

flight_of_the_pixie:
  title: "Flight of the PIXIE"
  url: https://www.youtube.com/watch?v=jDrqR9XssJI
  published: 2020-03-17
  editor: Don Hopkins
  visual_source: "1969 PIXIE demonstration films (Cambridge; digitized by David Chapman, Cambridge University Library)"
  audio_source: "Yuja Wang — Flight of the Bumblebee (archival concert footage; credited in video description)"
  dedication: "Neil E. Wiseman, Heinz U. Lemke, John O. Hiles — PIXIE (1969 CAD Conference, Southampton)"
  intent: |
    Show how fast and fluid PIXIE's radial menus were on the PDP-7 graphics terminal — pie-menu
    interaction as bumblebee flight. Respectful sync edit; not a commercial derivative product.

