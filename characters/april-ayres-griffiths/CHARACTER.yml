bio:
  summary: |
    Technical director of Paleotronic. Designed and programmed microM8, the
    Apple ][ emulator that "upcycles" the machine (3D and HD graphics, live
    rewind, a reverse debugger, Logo and Applesoft in Go with 3D modes,
    microPAK, an HTTP API and an MCP server), and tapDancer, a cassette
    playback app. microM8's source is MIT since September 2025. With Melody,
    turtleSpaces, a 3D Logo. Commodore 64 as a teenager; Bachelor of
    Computing, La Trobe University, Bendigo; Bendigo Bank, National Australia
    Bank, PaperCut. An informal Golang evangelist.

