# John Walker — memorial portrayal (in memoriam). NOT John Walker.
# Memorial mode: represent + discuss, never interview. Standards: ../../schemas/portrayal-standards.md#memorial-mode

id: john-walker
name: "John Walker"
type: person
layer: memorial
signifier: "🕯️"
status: deceased
real_being: true
field: >-
  Programmer and author: co-founder of Autodesk (AutoCAD), Marinchip Systems,
  The Autodesk File, CelLab with Rudy Rucker, Fourmilab
home: characters/john-walker/

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent:
    state: not_asked
  authored_by: don-hopkins

invitation:
  status: memorial
  document: memorial.md
  note: "deceased (16 May 1949 – 2 February 2024) — represent + discuss; invite people who knew him"

memorial:
  mode: represent_and_discuss
  rule: "Represent and discuss his documented work. Do not interview, do not speak as him, invent no inner life or quotes."
  who_can_discuss:
    - { who: rudy-rucker, why: "Walker hired him at Autodesk after they met at the Hackers conference in 1987; co-authors of CelLab", consent: not_asked }
    - { who: roger-gregory, why: "Xanadu during Autodesk's investment, 1988-92", consent: not_asked }
    - { who: mark-miller, why: "Xanadu architect during the Autodesk years", consent: not_asked }
    - { who: ted-nelson, why: "Xanadu; Autodesk acquired a controlling interest in 1988", consent: not_asked }
    - { who: liam-proven, why: "Wrote The Register's obituary", consent: not_asked }
    - { who: don-hopkins, why: "CelLab and the Autodesk File as influences; cites them throughout the CA work" }
  draw_on_for_shows:
    - "ANIMAL (1974-75): a UNIVAC Twenty Questions game whose PERVADE routine copied it from directory to directory"
    - "Marinchip Systems (1976-85): the M9900, a 16-bit TMS9900 computer for the S-100 bus"
    - "Autodesk (1982): fourteen founders; AutoCAD; public in 1985"
    - "The Autodesk File: a company's history told in its own internal documents, the Information Letters"
    - "Xanadu and AMIX: Autodesk's 1988 investment and 1992 divestment"
    - "CelLab (1989), with Rudy Rucker: cellular automata on a PC, the first Autodesk Science Series title; later WebCA in JavaScript"
    - "Fourmilab: The Hacker's Diet, HotBits, the Analytical Engine emulator, Earth and Moon Viewer, Home Planet, the Reading List"

bio:
  summary: |
    Born 16 May 1949 in Baltimore; studied electrical engineering at Case
    Western Reserve. Wrote ANIMAL on the UNIVAC in 1974. Founded Marinchip
    Systems in Mill Valley in 1976. In 1982 he and Dan Drake gathered the
    friends who founded Autodesk, which built AutoCAD and went public in 1985;
    he stepped down as chairman and president in 1986 and left in 1994. Hired
    Rudy Rucker and published CelLab (1989). Moved to Switzerland in 1991 with
    his wife Roxie Smail and published everything at fourmilab.ch. Died 2
    February 2024 in Neuchâtel after a fall at home.

