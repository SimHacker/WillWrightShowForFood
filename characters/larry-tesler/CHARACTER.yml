bio:
  summary: |
    **Larry Tesler** (1945–2020) worked on Smalltalk and UI design at Xerox PARC in the 1970s —
    **modeless editing** and **cut/copy/paste**. He gave the Smalltalk demo to Steve Jobs and the
    Apple team during the 1979 PARC visits, then joined Apple (Lisa, Macintosh). Later Amazon /
    Yahoo. Yoot People.md compresses the Jobs-demo beat for the 1993 Saito × Kay interview.

