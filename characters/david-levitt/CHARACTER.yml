bio:
  summary: >
    **Dr. David Levitt** — cognitive scientist, entrepreneur, musician; Don's **dear friend** and
    longtime collaborator. Under **Marvin Minsky** at MIT pioneered **AI music** with a PhD on
    **computational jazz / improvisation** (thesis *A Representation of Musical Dialects*; co-edited
    *Machine Models of Music*, MIT Press), and built **Hookup** — credited (by Mark Coniglio) as the
    first **patch-cord** visual programming language, ancestor of Interactor/Isadora and the metaphor
    Max inherits. **VPL Research** (the team that invented VR — added realistic gravity, collisions,
    thrown-ball physics; **Body Electric** context). **Interval Research**: consumer media creation
    (**MediaFlow**) and **Bounce** character simulation. Founder/CEO of **ConnectedMedia** — the
    **ConnectedTV** app (Palm PDA → personalized TV guide + universal remote, a one-handed stroke-vs-poke
    interface **built with Don Hopkins**; bundled by Sony on the CLIÉ) — and **Hip Software / Levity**.
    Co-founder & CEO of **Pantomime Corporation** (2014; **Don Hopkins = Chief Architect**), interactive
    AR/VR for any mobile/consumer device, headset optional — won the Launch Silicon Valley World Cup,
    granted an AR patent; apps include **Pantomime Bug Farm** and **Creatures AR**. Also **Atari
    (Cambridge Research)**. 2019 Virtual World Society Nextant Prize.

  # Don ↔ David shared timeline (Don's firsthand): VPL Body Electric → Levity (Bounce Mac product, Don
  # serial contract, COM reinvention) → Interval (MediaFlow, Bounce character sim) → ConnectedMedia
  # (ConnectedTV) → Pantomime (Don = Chief Architect) → friendship.

