relationship:
  to_project: storyline_figure
  to_pixie: |
    Heinz Lemke met Weizenbaum at MIT while presenting PIXIE on the 1969 US tour. Weizenbaum later
    spent decades in Germany (visiting professor TU Berlin from 1979); Heinz cites his human-not-machine
    ethic in Model-Guided Medicine editorials. Don's "conscientious objector" coinage (Jul 2026) explicitly
    honors Weizenbaum's stance against blind AI dominance.

bio:
  summary: |
    **Joseph Weizenbaum** (1923–2008) — creator of **ELIZA** (1966) at MIT; author of *Computer Power
    and Human Reason: From Judgment to Calculation* (1976). Taught **6.031 Intro to Programming** at MIT;
    **Kent Pitman** was in that course and later wrote **DOCTOR** in MACLISP on ITS. Weizenbaum warned that
    machines must not become the measure of man — a line Heinz still quotes in CARS work.

