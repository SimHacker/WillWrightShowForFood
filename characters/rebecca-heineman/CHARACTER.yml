bio:
  summary: |
    **Rebecca Ann Heineman** (1963–2025) taught herself to program by reverse
    engineering, won the 1980 national **Space Invaders** championship at 16, and
    co-founded **Interplay Productions** (1983). She designed **The Bard's Tale III**
    and **Dragon Wars**, programmed major ports, and later founded Logicware /
    Contraband / Olde Sküül. Out as a transgender woman in the early 2000s, she
    served on the **GLAAD** board and remained a public advocate and mentor.
    Married to game designer **Jennell Jaquays** (memorialized here; died 2024).
    Died 2025-11-17 after cancer.

