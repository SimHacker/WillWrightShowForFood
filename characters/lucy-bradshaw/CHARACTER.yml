    **Lucy Bradshaw** — LucasArts and Activision veteran; joined EA/Maxis 1997 after acquisition.
    Executive producer **The Sims 2**; VP Production on **Spore** with Will Wright; General Manager
    then SVP of Maxis (2011–2015). Oversaw Sims, SimCity, and Spore franchises. Psychology B.A.,
    University of Michigan. Left EA September 2015.
