why_the_show_cares: |
  Cyrus sits at the junction this repo keeps walking: **cognitive science → shipping AI**
  (psycholinguistics, n-grams, formulaic sequences → concept-aware video understanding),
  **Japan internet pioneer → Somerville factory floor**, and **neuro-symbolic hybrid models**
  in a world drowning in LLM hype. He posts from the bench and the plant — Physical AI with
  receipts, not slide decks. The CCO who listens on the shop floor is a natural Repo Show guest:
  the customer voice, the deployment war stories, and the learning-models lineage behind Leela.

