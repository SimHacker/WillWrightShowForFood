bio:
  summary: |
    **Cyrus Shaoul** — co-founder and **Chief Customer Officer** at **Leela AI** (Somerville, MA),
    which delivers **visual intelligence** to manufacturers: measurement-based AI vision that
    reveals what is actually happening on the shop floor without relying on machine data or
    manual input. Leela's leadership met as MIT students; Cyrus holds a **BS in Brain and
    Cognitive Science from MIT** (studied psycholinguistics under Steven Pinker) and a **PhD
    from the University of Alberta** (word n-grams and mental processing, Chris Westbury),
    with postdoctoral work in quantitative psycholinguistics at **Universität Tübingen**
    (Harald Baayen).

    Before Leela he co-founded **Eccosys** and **Digital Garage** in Japan with Joichi Ito and
    others — CTO through the Infoseek Japan era to IPO — after an NTT internship on large-scale
    VR communities and MIT Media Lab / Project Athena work. Author on Leela's self-supervised
    grid-world learning paper (Kommrusch, H. Minsky, M. Minsky, Shaoul, 2020). Open-source
    tools include **HiDEx** (High Dimensional Explorer) and the **NDL** R package. Publications
    include *The myth of cognitive decline* (experience as escalating memory search, not decay)
    and work on formulaic sequences in language.

    As CCO he is on the factory floor constantly — deployment videos, customer case studies
    (Schneider Electric distribution center), Axis Communications camera partnerships, and a
    public voice for **neuro-symbolic AI**, **IA over AI**, and the thesis that **AI-readiness
    is baloney** — meet manufacturers where they actually are.

