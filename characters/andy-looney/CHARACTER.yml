bio:
  summary: >
    **Andrew (Andy) Looney** — inventor of **Fluxx** (1997): the card game where the rules change
    as you play. Co-founded **Looney Labs** (1996) with Kristin; NASA Goddard / Hubble software
    background. Don knew Andy at **University of Maryland** through **LUMSSFS** (Lums Science
    Fiction Society) — pie menus by day, infinite rule mutations by night. MOOLLM's fluxx-chaos
    experiment and 33-turn tribute sessions lean hard on Looney Labs FAQ wisdom (with love, not
    without permission — see LETTER-TO-ANDY.md).

