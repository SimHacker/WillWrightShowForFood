  siblings: ["Margaret Minsky (haptics; MIT Media Lab)", "Juliana 'Julie' Minsky (his twin)"]
  spouse: "Milan Singh Minsky — VP Product at Leela AI (Marvin's daughter-in-law)"
  in_laws: ["Oliver Steele — Marvin's son-in-law (Laszlo Systems chief architect; Henry's brother-in-law)"]

leela_colleagues:
