bio:
  summary: "**Juliana (Julie) Minsky** — daughter of Marvin Minsky and Gloria Rudisch, **twin of Henry Minsky**, sister of Margaret. Grew up in the 'first wired family' (NYT). Co-founded **Universal Access Inc.** (~1994, Santa Barbara) with Henry and two MIT friends, **Michael Fredkin** and **Brian Fox** (GNU Bash author) — VP of marketing for **META-HTML**, a scripting language for building Internet/intranet applications, competing with Lotus Notes Domino. Her 'Roll 'em' homepage was the most playful of the Minsky family pages — an enigmatic clock linking to daily life in Japan, the Mystical Smoking Head of 'Bob, and Suck; it doubled as a networked sketchpad for a postage-stamp wallpaper project."

