bio:
  summary: >
    **W. Watson** (Wavell Watson) wrote and performed *The Pervert's Guide to Computer
    Programming Languages* (SXSW 2017, paper via Vulk LLC): Lacanian and Žižekian
    psychoanalysis applied to why programmers choose languages for irrational libidinal
    reasons — psychopath languages, obsessional languages, hysterical languages, melancholy
    languages (Lisp, "a loss of a loss"). Behind the joke title is a serious framework, with
    heavier siblings: *Four Elements of Software Ideology* and *The Plague of Programming
    Languages*. He read Lacan so we don't have to ("the most difficult popular philosopher
    to read"), producing a YouTube book-review series and hand-drawn mind maps. He organizes
    around worker co-ops (Vulk is one; Austin Software Co-operatives; Loomio for group
    decisions), and in 2020 he joined the HN discussion of his talk under his own name and
    answered everything, from journal-publication questions to Erlang's nine nines as sadism.

