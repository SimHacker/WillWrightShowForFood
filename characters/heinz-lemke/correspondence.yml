# Heinz U. Lemke × Don Hopkins — correspondence summary (public-safe)
# Tight public-safe digest. NOT the full private thread.
# Standards: ../../schemas/portrayal-standards.md

meta:
  with: heinz-lemke
  curated_by: don-hopkins
  consent: not_yet_asked
  span: "~2020–present"
  provenance_private: SimHacker/DonHopkins/characters/don-hopkins/correspondence/heinz-lemke.yml

gist: |
  Don found Heinz through Bill Buxton's research trail. Warm, long-running exchange:
  PIXIE paper and 1969 film (Cambridge Univ Library digitization via David Chapman);
  Don's *Flight of the PIXIE* homage edit (Bumblebee score; pie menus as rapid flight —
  not Don's paper or original film); CARS congress and model-guided medicine; Will Wright
  modelling talk; YouTube captioning workflow for Heinz's conferences; Black Forest farmhouse
  (Bechtersbohl); Mario Cypko patient-modelling video in the barn. CARS 2025 Berlin workshop
  proposal on game thinking for healthcare interfaces. Don wants CHM oral history for Heinz
  while first-hand memory remains.

threads:
  chapman_cambridge_films:
    what: |
      David Chapman (Cambridge Univ Library Reference) tracked two PIXIE films via Rainbow group,
      coordinated digitisation (ref #91692), published July 2019. Without this, Don could not
      have made *Flight of the PIXIE* (Bumblebee edit). Buxton had promised digitization for years
      but never delivered to Don.
    doc: cambridge-films-flight-of-the-bumblebee.md
    export_msgs: ["msg-403", "msg-407", "msg-409", "msg-410", "msg-413", "msg-414"]
  pixie_history:
    what: "1969 PIXIE paper + film; Wiseman/Hiles co-authors; radial menus on PDP-7"
  flight_of_pixie:
    what: "Don's Yuja Wang Bumblebee score edit — highlights of Chapman's digitized films"
    production: will-wright/sources/don-youtube-jDrqR9XssJI-flight-of-pixie/production-notes.md
  rosenthal_same_pdp7:
    what: |
      David Rosenthal Cambridge undergrad ~1970 on same PDP-7/340 + Titan; met Wiseman;
      Don proposed DSHR interview Heinz for CHM. Line to NeWS/X11/Andrew.
    export_msgs: ["msg-408"]
    doc: cambridge-films-flight-of-the-bumblebee.md
    character: ../david-rosenthal/
  electronics_magazine_1969:
    what: |
      McGraw-Hill Electronics (Apr 28 1969) PIXIE article; Gilmore scan; Heinz photo at PDP-7.
      **Received from Heinz 2026-07-10** — PDF + clean MD in private/public archives.
    doc: sources/electronics-international-1969-04-28-pixie.md
    pull_in: pull-in-gaps.yml#electronics_magazine_1969_pdf — snip p158 photo
  cars_medicine:
    what: "IFCARS, CARS congress, patient-specific modelling, model-guided medicine"
  cars_2025_berlin:
    what: |
      Workshop proposal — game thinking for healthcare interfaces (CARS 2025 Berlin).
      PIXIE-era interaction design → model-guided medicine continuity.
  will_wright_modelling:
    what: "Modelling / simulation talk thread with Will Wright — games thinking meets medicine"
  youtube_captioning:
    what: "Don's captioning workflow for Heinz's conference videos"
  bechtersbohl:
    what: "Black Forest farmhouse visits — Bechtersbohl; in-person continuity with correspondence"
  mario_cypko_barn:
    what: "Mario Cypko patient-modelling video filmed in the barn"
  preservation:
    what: |
      Digitized Cambridge films; CHM oral history for Heinz while first-hand PIXIE + Cambridge
      memory remains — honor Wiseman and Hiles through Heinz's voice
  pixie_source_listing_2026:
    what: |
      2026-07-07 (from Nagoya, CARS 40th anniversary) — Heinz reveals he has the COMPLETE PIXIE
      program: ~5000 words Assembler/Machine code, PDP-7 + DEC 340, with light pen handling,
      interrupt management, interactive model building; offers to prepare a copy. Also corrects
      the record: the PDP-7 was NOT a dumb display terminal for Titan — the 5000 instructions
      interactively built graph-theoretic models (in the remaining 3000 words) for circuits,
      syntax graphs, control systems, then sent them to Titan for simulation. DSHR (4 Jul) had
      reasonably read p.465 as a dumb terminal; Heinz's author memory + listing supersede the
      diagram. DSHR contributed light-pen interrupt mechanics in the same thread.
    doc: pixie-source-recovery.md
    transcript: sources/2026-07-07-pixie-trio-thread.md
    pull_in: pull-in-gaps.yml#pixie_complete_source_listing
  roy_eagleson_uwo_2026:
    what: |
      Roy Eagleson (Western University / UWO) — Heinz's friend; teaches history of computer
      graphics in CS courses. Discussed PIXIE in Nagoya at CARS 40th; Heinz Cc'd him on the trio
      thread. 7 Jul: preparing an HCI lecture (normally Sketchpad) pivoted to PIXIE; synchronicity
      — reading Don's Buxton patent page when Heinz's email arrived; asked whether to play
      *Flight of the PIXIE* in class. Heinz sent the YouTube link same day.
    transcript: sources/2026-07-07-pixie-trio-thread.md
    interest: "MIT and Cambridge beginnings of computer graphics"
    consent: not_yet_asked
    note: "On the email thread — not a Repo Show bud unless invited separately"

  pixie_trio_invitation_2026:
    what: |
      July 2026 — Don sent matching PIXIE trio invitations (Heinz, Lars, David). David flagged
      timezone/grandparent-duty logistics; Lars yes/later (Swedish July offline). Don pivoted to
      async 1-on-1 recordings interlinked in post — intertwingled tapestry, not one live group call.
    docs:
      - ../lars-brinkhoff/correspondence.yml
      - ../david-rosenthal/correspondence.yml
      - ../../repo-shows/pixie-pie-menus-pdp7.yml#format
  don_reply_evidence_room_2026_07_07:
    date: "2026-07-07 16:34"
    transcript: sources/2026-07-07-pixie-trio-thread.md
    what: |
      Don replies giddy about Heinz listing + Roy/Heinz from Japan. Repo Show model: upload ALL
      evidence (papers, magazine articles, ESPECIALLY source code) BEFORE interview; discuss on
      air; brainstorm revival on extended emulator. Virtual light pen drivers from listing.
      Async default (voice/face/screen/code); optional multi-person or Twitch. AE telecine jiggle
      as retro house style (B&W grain, motion-tracked credits). Cc: Will Wright.
    show_refs:
      - ../../repo-shows/pixie-pie-menus-pdp7.yml
      - ../../process/post-production/cambridge-telecine-jiggle.yml

  cambridge_storyline_installments_2026_07_09:
    date: "2026-07-09"
    transcript: sources/2026-07-09-pixie-storyline-thread.md
    continues: sources/2026-07-10-pixie-storyline-thread.md
    what: |
      Roy Eagleson (9 Jul 11:58) greets Don, jokes "does Maurice Wilkes have an avatar in the
      SIMs milieu?", shares his own operator backstory (Honeywell GE-115 in HS; midnight shift
      ~1979–mid-80s on PDP-10 / PDP-11 inkpen plotter / Cyber-73), his PhD under Zenon Pylyshyn
      (whose postdoc advisors were Newell & McCarthy; CIFAR AI&Robotics director, hired Hinton;
      Fodor connectionism critique; Rutgers CogSci), and his HCI teaching method — students
      re-implement Sketchpad until they reinvent OOP. He asks Heinz + Don to collect the CAMBRIDGE
      / TRE storyline: Maurice Wilkes, Neil Wiseman, John Hiles, Cheney, Etherton, the Rainbow
      Project, PIXIE, PDP-7 vector display ↔ Titan. Cc's his mentor Kelly Booth (UBC).
      Heinz (14:22) answers by starting to deliver it: attaches his 1967 origin story ("changed
      my life forever some 60 years ago"), first of installments over the coming weeks.
    pull_in: pull-in-gaps.yml#heinz_1967_origin_story
    received: "sources/1967-back-to-the-roots-part1.md — Heinz's memoir 'Back to the Roots (Part 1, 1967)' arrived 2026-07-09 (.docx). Spy accusation → Wilkes → medieval-statute PhD → Wiseman → 1972 thesis. Private archive in DonHopkins."
    new_people:
      - "Kelly Booth (UBC) — Roy's HCI storytelling mentor; newly Cc'd"
    storyline_targets: ["Maurice Wilkes", "Neil Wiseman", "John Hiles", "Cheney", "Etherton", "Rainbow Project", "PDP-7 ↔ Titan"]
    show_refs:
      - ../roy-eagleson/
      - ../../kelly-booth/

  conscientious_objector_weizenbaum_2026_07_10:
    date: "2026-07-10"
    transcript: sources/2026-07-10-pixie-storyline-thread.md
    what: |
      Heinz echoes Don's conscientious-objector software-design coinage; main activity now is AI
      model trustworthiness. Nagoya CARS: Model Guided Medicine + AI in Surgery (Roy attended).
      Met Joe Weizenbaum at MIT 1969 presenting PIXIE; decades of TU Berlin discussions — "many of
      his predictions have become true now." Asks Don about "model science." Don proposes two
      episodes (1969 US/Weizenbaum + modern CARS); Cc Alan Kay on light pen vs RAND tablet.
    private_archive: DonHopkins/characters/don-hopkins/correspondence/attachments/heinz-lemke/
    pull_in: pull-in-gaps.yml#nagoya_ai_surgery_slides_2026

  lemke_constellation_2026_07_10:
    date: "2026-07-10"
    what: |
      DSHR asks if Heinz is related to David Lemke (Sun X11). Heinz: unknown; many Pomeranian
      Lemkes scattered after 1945. Don maps a constellation: David "Officer" Lemke (Sun NeWS, DSHR
      Usenix co-author), Andreas C. Lemke (U. Colorado — NeWS-makers pie-menu question, CHI'90
      "Using Critics to Empower Users"), Helmut Lemke (NURNICHTNUR experimental musician). Family
      connection TBD. Childhood essay private — forward-to-David permission only.
    private_archive: DonHopkins/.../lemke-constellation.yml

  alan_kay_armit_utah_2026_07_10:
    date: "2026-07-10"
    transcript: ../andrew-armit/sources/alan-kay-utah-coons-patches.md
    what: |
      Alan Kay side-note on PIXIE thread: Andrew Armit extended visitor at Utah (~1968–69), Coons
      patch interactive system on PDP-7. Ivan Sutherland period; 4×4 matrix multiplier for HMD /
      Coons work. Asks Don or Heinz to find film/video — "quite impressive."
    show_hook: "PDP-7 double feature — PIXIE + Armit; Don's archive nose"

  heinz_us_tour_1969_2026_07_10:
    date: "2026-07-10"
    transcript: sources/heinz-1969-us-lab-tour.md
    what: |
      Heinz responds to Roy: Cambridge graphics ignored in US; Armit Coons patches second example.
      Summer 1969 Greyhound tour ($99 / 3 months); Engelbart and many labs; job offer from W.R.
      Sutherland at MIT. Attachment: agenda (pull in).
    pull_in: pull-in-gaps.yml#heinz_1969_us_trip_agenda

  pixie_attachments_batch_2026_07_10:
    date: "2026-07-10"
    transcript: sources/2026-07-10-pixie-storyline-thread.md
    what: |
      Heinz sends Buxton 2008 PIXIE letter + Electronics Apr 1969 article (as Don requested).
      Buxton met Bill Newman in Cambridge; CARS 2009 keynote. PowerPoint/PhD thesis observation.
      Don proposes historic US-trip episode + modern CARS episode; Cc Alan Kay (light pen vs RAND
      tablet); Conscientious Objector club cards.
    docs:
