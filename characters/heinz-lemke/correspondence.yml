# Heinz U. Lemke × Don Hopkins — correspondence summary (public-safe)
# Tight public-safe digest. NOT the full private thread.
# Standards: ../../schemas/portrayal-standards.yml

meta:
  with: heinz-lemke
  curated_by: don-hopkins
  consent: not_yet_asked
  span: "~2020–present"
  provenance_private: SimHacker/DonHopkins/characters/don-hopkins/correspondence/heinz-lemke.yml

gist: |
  Don found Heinz through Bill Buxton's research trail. Warm, long-running exchange:
  PIXIE paper and 1969 film (Cambridge Univ Library digitization via David Chapman);
  Don's *Flight of the PIXIE* homage edit (Bumblebee score; pie menus as rapid flight —
  not Don's paper or original film); CARS congress and model-guided medicine; Will Wright
  modelling talk; YouTube captioning workflow for Heinz's conferences; Black Forest farmhouse
  (Bechtersbohl); Mario Cypko patient-modelling video in the barn. CARS 2025 Berlin workshop
  proposal on game thinking for healthcare interfaces. Don wants CHM oral history for Heinz
  while first-hand memory remains.

threads:
  chapman_cambridge_films:
    what: |
      David Chapman (Cambridge Univ Library Reference) tracked two PIXIE films via Rainbow group,
      coordinated digitisation (ref #91692), published July 2019. Without this, Don could not
      have made *Flight of the PIXIE* (Bumblebee edit). Buxton had promised digitization for years
      but never delivered to Don.
    doc: cambridge-films-flight-of-the-bumblebee.md
    export_msgs: ["msg-403", "msg-407", "msg-409", "msg-410", "msg-413", "msg-414"]
  pixie_history:
    what: "1969 PIXIE paper + film; Wiseman/Hiles co-authors; radial menus on PDP-7"
  flight_of_pixie:
    what: "Don's Yuja Wang Bumblebee score edit — highlights of Chapman's digitized films"
    production: will-wright/sources/don-youtube-jDrqR9XssJI-flight-of-pixie/production-notes.md
  rosenthal_same_pdp7:
    what: |
      David Rosenthal Cambridge undergrad ~1970 on same PDP-7/340 + Titan; met Wiseman;
      Don proposed DSHR interview Heinz for CHM. Line to NeWS/X11/Andrew.
    export_msgs: ["msg-408"]
    doc: cambridge-films-flight-of-the-bumblebee.md
    character: ../david-rosenthal/
  electronics_magazine_1969:
    what: |
      McGraw-Hill Electronics (Apr 28 1969) PIXIE article; Gilmore scan; Heinz photo at PDP-7.
      Ask Heinz: US research-lab trip story behind the magazine piece.
    export_msgs: ["msg-384", "msg-385", "msg-393"]
    pull_in: pull-in-gaps.yml#electronics_magazine_1969_pdf
  cars_medicine:
    what: "IFCARS, CARS congress, patient-specific modelling, model-guided medicine"
  cars_2025_berlin:
    what: |
      Workshop proposal — game thinking for healthcare interfaces (CARS 2025 Berlin).
      PIXIE-era interaction design → model-guided medicine continuity.
  will_wright_modelling:
    what: "Modelling / simulation talk thread with Will Wright — games thinking meets medicine"
  youtube_captioning:
    what: "Don's captioning workflow for Heinz's conference videos"
  bechtersbohl:
    what: "Black Forest farmhouse visits — Bechtersbohl; in-person continuity with correspondence"
  mario_cypko_barn:
    what: "Mario Cypko patient-modelling video filmed in the barn"
  preservation:
    what: |
      Digitized Cambridge films; CHM oral history for Heinz while first-hand PIXIE + Cambridge
      memory remains — honor Wiseman and Hiles through Heinz's voice
  pixie_source_listing_2026:
    what: |
      2026-07-07 (from Nagoya, CARS 40th anniversary) — Heinz reveals he has the COMPLETE PIXIE
      program: ~5000 words Assembler/Machine code, PDP-7 + DEC 340, with light pen handling,
      interrupt management, interactive model building; offers to prepare a copy. Also corrects
      the record: the PDP-7 was NOT a dumb display terminal for Titan — the 5000 instructions
      interactively built graph-theoretic models (in the remaining 3000 words) for circuits,
      syntax graphs, control systems, then sent them to Titan for simulation. DSHR contributed
      light-pen interrupt mechanics in the same thread. Roy Eagleson (UWO; teaches computer
      graphics history) joined the exchanges after discussing PIXIE with Heinz in Nagoya.
    doc: pixie-source-recovery.md
    pull_in: pull-in-gaps.yml#pixie_complete_source_listing

  pixie_trio_invitation_2026:
    what: |
      July 2026 — Don sent matching PIXIE trio invitations (Heinz, Lars, David). David flagged
      timezone/grandparent-duty logistics; Lars yes/later (Swedish July offline). Don pivoted to
      async 1-on-1 recordings interlinked in post — intertwingled tapestry, not one live group call.
    docs:
      - ../lars-brinkhoff/correspondence.yml
      - ../david-rosenthal/correspondence.yml
      - ../../repo-shows/pixie-pie-menus-pdp7.yml#format

connects_in_repo:
  - { path: CHARACTER.yml, why: "Bio + invitation status" }
  - { path: cambridge-films-flight-of-the-bumblebee.md, why: "Chapman + Rosenthal + production + HN index" }
  - { path: pull-in-gaps.yml, why: "Heinz assets to pull in (magazine PDFs, Cambridge doc, Wiseman notes)" }
  - { path: ../../repo-shows/pixie-pie-menus-pdp7.yml, why: "PIXIE show — Heinz + Lars Brinkhoff PDP-7/340 emulation" }
  - { path: ../don-hopkins/pie-menus-chi-88-and-beyond.md, why: "PIXIE credited; Don does not claim invention" }
  - { path: ../lars-brinkhoff/, why: "Co-guest — PDP-7/340 emulation segment" }
  - { path: ../david-rosenthal/, why: "Same Cambridge PDP-7/Titan; possible CHM interviewer" }

show_hooks:
  - "Neil Wiseman — lab culture, design judgment, personal memory"
  - "Lars Brinkhoff — PDP-7 + Type 340 + light pen; emulate PIXIE on stream"
  - "David Rosenthal — same Cambridge PDP-7/Titan ~1970; PIXIE → NeWS/X11; CHM oral history"
  - "Cambridge late 1960s + US research-lab trip"
  - "PIXIE → CARS continuity — graphical interaction to model-guided medicine"
  - "CARS 2025 Berlin — game thinking for healthcare interfaces"
  - "Bechtersbohl + Mario Cypko barn video — medicine modelling in the Black Forest"
