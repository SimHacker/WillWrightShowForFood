bio:
  summary: |
    **Heinz U. Lemke** — co-author of **PIXIE: A New Approach to Graphical Man-Machine
    Communication** (1969 CAD Conference; with Neil E. Wiseman and John O. Hiles). PhD on the
    PIXIE user interface. In 1969 he toured US labs showing the PIXIE film "to spread the
    message of man-machine communication" — including **to Douglas Engelbart at SRI**, the
    year after the Mother of All Demos (his own first words to Don, 21 Feb 2020). Retired
    Professor of Computer Graphics and Computer Assisted Medicine,
    TU Berlin. Founder/chair of **CARS** (Computer Assisted Radiology and Surgery); model-guided
    medicine. Lives in the Black Forest. Don's warm correspondence since 21 Feb 2020
    ("Hello, Doctor Lemke!" — answered within three hours) — Chapman film recovery,
    *Flight of the PIXIE*, CARS workshops (incl. 2025 Berlin game-
    thinking proposal), Will Wright modelling thread, YouTube captioning help, barn visits
    (Mario Cypko patient-modelling video). CHM oral history while memory remains.

