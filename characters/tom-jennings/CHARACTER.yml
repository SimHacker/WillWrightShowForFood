bio:
  summary: "**Tom Jennings** (b. 1955) — created **Fido** BBS and **FidoNet** (1984), the first large store-and-forward BBS network; co-founded **The Little Garden (TLGnet)** early ISP (1992) with David Henkel-Wallace, John Romkey, and Steve Crocker; portable BIOS work at Phoenix Technologies; built **Wired** magazine's first internet presence; artist/programmer (CalArts). Archive: [sensitiveresearch.com](https://www.sensitiveresearch.com/)."

