bio:
  summary: |
    Wrote the Fido BBS and FidoNet (1984), the store-and-forward network of
    bulletin boards. In September 1992 took over running The Little Garden, a
    shared Internet connection begun by John Gilmore, John Romkey and Trusted
    Information Systems and extended by Tim Pozar, and built it into TLGnet,
    Inc.: resale allowed, no control over content, hiring and training people
    from local communities; Wired's first Internet connection. Portable BIOS at
    Phoenix Technologies; co-published the zine Homocore. Writes and builds: a
    novel, The Delivery; "wabi tek sabi"; embedded code.

