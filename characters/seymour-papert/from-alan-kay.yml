# What Alan Kay says about Seymour Papert — public sources only

character: seymour-papert
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Papert shaped the Dynabook — Kay recruited PARC researchers while literally handwaving the **cardboard
    Dynabook** model he built after meeting Papert. LOGO and children programming at MIT was the moment Kay
    saw what personal computing was *for*. Papert's constructionism (on Piaget) → microworlds, Etoys, the
    "Sure!" answer when asked about libraries adopting constructivism.

