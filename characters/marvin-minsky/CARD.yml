  effect: "One of the first neural-network learning machines, built as a Princeton grad student — rare footage of Marvin telling it survives in Cynthia Solomon's video trove."
  verifiable: "SNARC (1951); Cynthia Solomon's YouTube channel (@cynthiaso)"
  combos_with: [cynthia-solomon]

