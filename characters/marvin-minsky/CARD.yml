  effect: "Explain intelligence as many little processes — and let Henry, Gary, and the Leela crew show it running in production."
  verifiable: "The Society of Mind (1986); The Emotion Machine (2006)"
  combos_with: [henry-minsky, VISUAL-INTELLIGENCE, SCHEMA-MECHANISM]

