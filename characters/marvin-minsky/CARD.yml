# CARD — Marvin Minsky (memorial portrayal). NOT Marvin Minsky.
# Memorial mode: legacy abilities celebrate documented work; never speak as him.
# Schema: ../../schemas/guest-skills-card.yml — BIG CARD: size constraints released;
# this card anchors the Minsky constellation and must carry many real relationships.

room:
  id: marvin-minsky
  name: Marvin Minsky
  type: [legacy, memorial, portrayal]

meta:
  schema: ../../schemas/guest-skills-card.yml
  governed_by: ../../schemas/portrayal-standards.md
  card_type: guest_skills

card:
  name: Marvin Minsky
  title: Society of Mind · MIT AI Lab Co-Founder
  rarity: legacy
  signifier: "🧠🕯️"
  flavor: "Minds are what brains do — and this card is what a memorial does: many small documented abilities, no invented inner life."

relationships:
  # kinds may stack — real people relate in multiple ways at once
  - { with: henry-minsky, kinds: [son, lab_child, idea_carrier], why: "Grew up in the AI Lab children's computer lab; carries Society-of-Mind ideas into Leela AI as co-founder/CTO" }
  - { with: margaret-minsky, kinds: [daughter, lab_child, colleague], why: "First wired family (net address at 14, 1971); haptics at Atari Cambridge + MIT Media Lab — labs in his orbit" }
  - { with: julie-minsky, kinds: [daughter, lab_child], why: "Henry's twin; Universal Access Inc. (META-HTML) co-founder — the third seat of the first wired family" }
  - { with: milan-singh-minsky, kinds: [daughter_in_law, idea_carrier], why: "VP Product at Leela AI; co-author of the Leela grid-world paper carrying the lab's learning agenda forward" }
  - { with: oliver-steele, kinds: [son_in_law], why: "Laszlo chief architect; instance-first design" }
  - { with: gary-drescher, kinds: [phd_student, intellectual_heir], why: "PhD under Minsky — Made-Up Minds (schema mechanism); Minsky hailed it as a landmark in learning theory" }
  - { with: david-levitt, kinds: [doctoral_student, jam_partner], why: "Sc.D. 1985 'A Representation for Musical Dialects' (advisor: Minsky, MIT DSpace); part of the lab improvisation scene around Marvin's Bach-fugue keyboard playing" }
  - { with: ivan-sutherland, kinds: [thesis_committee, credited_influence], why: "Sketchpad (1963) — Shannon supervised; acknowledgments credit Shannon + Minsky with giving 'Sketchpad much of its present character'" }
  - { with: ken-kahn, kinds: [lab_milieu, committee_reported], why: "PhD 1979 in the lab Minsky co-directed (advisor Carl Hewitt; Minsky/Papert reported on committee); Logo group" }
  - { with: ray-kurzweil, kinds: [teenage_correspondent, mentee], why: "Wrote to Marvin from high school; invited to visit; came to MIT expressly to study with him (B.S. 1970)" }
  - { with: seymour-papert, kinds: [co_director, co_author], why: "🕯️ Co-directed the AI Lab; Perceptrons (1969)" }
  - { with: alan-kay, kinds: [peer, milieu], why: "Shaped by the same MIT/ARPA milieu; carried lab ideas into personal computing" }
  - { with: walter-bender, kinds: [media_lab_colleague], why: "MIT Media Lab (Minsky founding member); OLPC carried the learning mission forward" }
  - { with: nicholas-negroponte, kinds: [institution_builder, media_lab_founder], why: "Co-founded the Media Lab (1985) — Marvin's institutional roof for three decades; Margaret's PhD advisor" }
  - { with: tod-machover, kinds: [media_lab_colleague, book_adapted_by], why: "Brain Opera (1996) turned The Society of Mind into an audience-played opera — 'done in the lab next to mine' (NYT)" }
  - { with: brian-fox, kinds: [family_startup_partner], why: "Co-founded Universal Access (META-HTML) with Henry + Julie — one hop from Marvin through the twins" }
  - { with: cynthia-solomon, kinds: [logo_culture, archivist], why: "MIT Logo culture + Atari Cambridge; her YouTube trove preserves rare footage of Marvin (incl. the 1951 SNARC story)" }
  - { with: stephen-wolfram, kinds: [friend, sounding_board], why: "'Farewell, Marvin Minsky' (2016) — met via Feynman 1979; discussed every major project (SMP → Mathematica → NKS → Wolfram|Alpha)" }
  - { with: jaron-lanier, kinds: [friend, documented_foil], why: "Dormouse thread — Engelbart's challenge to Minsky ('What are you going to do for the people?') in Jaron's American Scientist review" }
  - { with: richard-stallman, kinds: [lab_hacker], why: "AI Lab hacker culture (1971–1984) — Emacs/Lisp grew in Marvin's lab" }
  - { with: kent-pitman, kinds: [lab_hacker], why: "MACLISP/Pitmanual era of the lab's Lisp culture" }
  - { with: david-henkel-wallace, kinds: [lab_hacker, leela_alum], why: "MIT AI Lab (youngest hacker with his own office); later at Leela AI — both ends of the pipeline" }
  - { with: norman-margolus, kinds: [mit_physics_of_computation, family_friend], why: "CAM-6/reversible CA at MIT; close friend of Henry" }
  - { with: don-hopkins, kinds: [k_line_inheritor, memorialist], why: "K-lines are load-bearing in MOOLLM; hosts this memorial" }
  - { with: bot-ultimate-machine, kinds: [invention, mascot], why: "His 1952 Ultimate Machine lives on as the repo's fictional bot mascot — the gong that switches off the stream (never speaks as him)" }

