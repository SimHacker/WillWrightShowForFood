      weight: 0.9
  effect: "The 1969 analysis that reshaped neural-net research — told honestly, including that he built SNARC, one of the FIRST neural-net learning machines (1951). Ray Kurzweil visited both Minsky and Rosenblatt as a teenager and can speak to both poles firsthand."
  verifiable: "Perceptrons (1969, with Papert); SNARC (1951, with Dean Edmonds)"
  combos_with: [MINSKY-CORRESPONDENT, ray-kurzweil]

