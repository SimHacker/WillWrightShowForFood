  advertisement:
    method: kLines
    signature: kLines(name) → constellation activates
    score_when:
    - trigger: moollm_skill_activation_explained
      weight: 0.95
    - trigger: audience_learns_something_true
      weight: 0.85
  effect: "Name things so ideas snap together later — the theory of memory MOOLLM's skill activation is built on."
  verifiable: "K-lines: A Theory of Memory (1980); The Society of Mind"
  combos_with: [DON-YAML-GIRDER, don-hopkins]

