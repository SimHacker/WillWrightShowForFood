# Minsky 7-state 4-symbol UTM as typed in the 1981 TECO mail.
# Paper (AIM-33 / AMS 1962): symbols 0 1 X B, states q1..q7, halt q0.
# TECO spelling: X → y, B → A, qi → Q-register i.
# Each group is read write direction next-state. Rows in paper order: X 0 1 B.

symbols: [y, "0", "1", A]   # paper: X, 0, 1, B
halt: 0

states:
  1: [y0L1, 00L1, 11L2, A1L1]
  2: [y0L1, 0yR2, 1AR2, AyR6]
  3: [yyL3, 00L0, 1AL3, A1L4]   # 00L0 is the halt transition
  4: [yyL4, 0yR5, 11L7, A1L4]
  5: [yyR5, 0yL3, 1AR5, A1R5]
  6: [yyR6, 0AL3, 1AR6, A1R6]
  7: [y0R7, 0yR6, 11R7, A0R2]

# Initial tape in the mail, head on the first y, state 1:
#   rules region          | working sequence | blank padding
#   110101110000010011011   yyAyyAyy           0 × 32
tape:
  rules: "110101110000010011011"
  work: "yyAyyAyy"
  blanks: 32
  head: first_y
  state: 1

# Independent run of simulate.py, 2026-09-22:
# halt after 1870 transitions; significant tape 11010111000001001101100000000000000000000000000yAAAA
run:
  steps: 1870
  halt_state: 0
  significant: "11010111000001001101100000000000000000000000000yAAAA"
