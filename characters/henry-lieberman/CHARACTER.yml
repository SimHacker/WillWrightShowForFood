bio:
  summary: |
    **Henry Lieberman** — MIT AI Lab and Media Laboratory researcher; pioneer of
    **programming by demonstration** (*Tinker*: define procedures by working through
    concrete examples on the Lisp Machine, with menus and immediate feedback).
    Author in Allen Cypher's *Watch What I Do* anthology. NPUC 1993 opening speaker:
    **Smart Interfaces to Smart Machines** (First Annual New Paradigms for Using
    Computers, IBM Almaden). Constructionist lineage connects to Ken Kahn, Logo,
    and visual-programming heritage in MOOLLM.

