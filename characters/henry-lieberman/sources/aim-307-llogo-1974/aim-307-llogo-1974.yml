  funding: "NSF grant GJ-1049; ARPA, monitored by ONR under contract N00014-70-A-0362-0005 (read from the scan; the OCR garbles both)"
  scan_composition: |
    Scans 1-76 are the June 27, 1974 memo, through its two indexes (printed pages 63-72).
    Scans 77-93 are dated March 4, 1975: the second half of Section 17, "Display Turtle for the
    Knight TV Terminals" (printed pages 73-81, from 17.14's TVSIZE through 17.22 Implementation),
