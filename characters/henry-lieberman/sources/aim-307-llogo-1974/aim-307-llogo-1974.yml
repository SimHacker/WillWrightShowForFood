binding_and_scope:   # answers "does it declare dynamic binding?" with page references
  - { scan: 34, section: 9, quote: "For safety's sake, all variables are automatically declared SPECIAL." }
  - { scan: 35, section: 9, quote: "procedures which depend heavily on maintaining the dynamic environment of the interpreter may fail to compile correctly without modification." }
  - { scan: 41, section: 11, quote: "Regardless of where a LOCAL statement is placed in a procedure, the variables declared will be local to the entire procedure. This corresponds to a PROG variable in LISP." }
  - { scan: 40, section: 11, note: "variables set by MAKE are Lisp atoms whose names begin with a colon" }
  - { scan: 8, section: "2.1", note: "the TEST flag is a global Lisp variable, so a TEST in a subprocedure affects IFTRUE in its caller" }
  - { scan: 12, section: "3.1", note: "switching between the Logo, Lisp, PLANNER and CONNIVER worlds is done by rebinding READTABLE and OBARRAY" }

