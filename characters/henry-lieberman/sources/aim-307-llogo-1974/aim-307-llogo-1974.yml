# Sidecar: LLOGO, MIT AI Memo 307 / Logo Memo 11, June 27, 1974.
# Human-readable exposition: README.md in this folder.
# Page numbers: "scan" is the page of the PDF; "printed" is the memo's own page number, read from
# the OCR of the running header, so a few may be off by one where the header was garbled.

