bio:
  summary: |
    **Adele Goldberg** — Learning Research Group at Xerox PARC (later manager); co-authored the
    main **Smalltalk-80** books with Dave Robson; led much of the effort to document and release
    Smalltalk-80 outside Xerox. Discussant for Kay's HOPL Early History of Smalltalk talk; later
    ACM president. Central living voice for how Smalltalk left the lab.

