bio:
  summary: >
    **Tim Niblett** — cofounder of Glasgow's **Turing Institute** with Donald Michie
    and Peter Mowforth; suggested the name after a clash with another MIRA. Architect
    and co-author of **GoodNeWS** / **HyperNeWS** (with Arthur van Hoff): object-oriented
    PostScript UI, **PdB** (C-like → PostScript), **WiT** structured editor / SGML.
    Rarely took credit for key ideas that shaped the Institute. Mentor — Scrabble,
    speed chess, ski trips, Prolog meta-interpreters, pub interviews for new hires.
    Later Virtual-Mirrors Ltd (Glasgow). Died of cancer **5 June 2022**, aged 66;
    Pete Mowforth announced to the Turing orphans. In 2019 he posted Dec-94 DAT tapes
    toward the HyperLook source hunt (John Gilmore's drive).

