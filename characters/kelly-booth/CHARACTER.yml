bio:
  born_context: "Palos Verdes HS — science club programming; SAGE field trip (math + psychology teams)"
  summary: |
    Kellogg S. Booth (Kelly) — Professor Emeritus, UBC Computer Science. Berkeley Ph.D. in theory;
    Lawrence Livermore (1968–76); Waterloo faculty (1977–90) where he co-founded Canada's Computer
    Graphics Laboratory with John Beatty and Richard Bartels; UBC from 1990 — Imager Lab, founding
    director of MAGIC, NECTAR leadership. Published across theory, graphics, and HCI; mentored 16 Ph.D.
    and 50+ Master's students. SIGGRAPH co-chair 1983, Chair 1985–89; CHCCS/Graphics Interface
    president 2002–08; key organizer of Canadian CG/HCI for four decades.
  waterloo_cgl:
    joined: 1977
    cgl_formed: 1979
    with: [John Beatty, Richard Bartels]
    source: https://cs.uwaterloo.ca/kiosk/history/cs.htm
  signature_projects:
    - "Benesh Movement Notation intelligent editor (Ryman, Beatty) — Royal Academy of Dance"
    - "Experimental HCI test-beds: menu layout, anti-aliasing, 3D via 2D displays"
    - "Multitasking/multiprocess interactive systems (1980s)"

