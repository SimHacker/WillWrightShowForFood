# What Alan Kay says about Dan Ingalls — public sources only
# Index: ../alan-kay/people-index.yml

character: dan-ingalls
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Kay credits Ingalls as the implementer who turned Smalltalk from ideas into working systems —
    hallway recruit with "stars in their eyes," impact "cannot be overstated." Ingalls built Smalltalk-72
    from the "page of code" bet, invented BitBLT and pop-up menus, and later Fabrik at Apple. Alan introduced
    Don to Dan via the Fabrik PE paper (2018), recalling **"swiped pie menus"** in Fabrik (~1986).

