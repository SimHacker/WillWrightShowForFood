bio:
  summary: "**Tod Machover** (b. 1953) — composer and inventor; professor at the **MIT Media Lab**, where he directs the **Opera of the Future** group. Director of musical research at **IRCAM** in Paris before joining the Media Lab at its founding era; composed **VALIS** (1987, Pompidou commission, after Philip K. Dick). Invented **hyperinstruments** — instruments that amplify expressive intent, including the hypercello built for **Yo-Yo Ma** (1991). His **Brain Opera** (1996) — an audience-participatory opera **inspired by Marvin Minsky's *The Society of Mind*** — was built in the lab next to Minsky's and lives on permanently at the Haus der Musik, Vienna. **Death and the Powers** (2010, libretto by Robert Pinsky; Pulitzer finalist 2012) stages a dying tycoon uploading himself into 'The System' — an opera about premorializing before we had the word. **Hyperscore** lets children compose by drawing. His students **Alex Rigopulos and Eran Egozy** founded Harmonix and made **Guitar Hero** and **Rock Band**. Recent decade: crowd-sourced **City Symphonies** (Toronto, Edinburgh, Perth, Detroit, Philadelphia…)."

connections:
  minsky: "Brain Opera (1996) explicitly inspired by The Society of Mind; made 'in the lab next to mine' — Marvin Minsky, NYT 1996/97 (the First Wired Family article in this repo's sources); Oliver Steele added the Brain Opera link to Marvin's home page"
  media_lab: "Opera of the Future group; Media Lab founding era with Negroponte + Minsky"
  participation: "Brain Opera's audience-as-performer ethos rhymes with PIPS:lab (keez-duyves) and the Repo Show audience-PR model"
  premorial: "Death and the Powers = the premorializing opera — Simon Powers interring himself in The System while alive; Die Space and RAI territory, on the opera stage in 2010"

