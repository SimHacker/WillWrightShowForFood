    method: deathAndThePowers
    signature: deathAndThePowers(simonPowers) → a man inters himself in The System, live
    score_when:
    - trigger: premorializing_segment
      weight: 0.96
    - trigger: relationship_matrix_ensemble
      guests: [tod-machover, keez-duyves, ray-kurzweil]
