  effect: "Crowd-sourced symphonies composed with whole cities (Toronto, Edinburgh, Perth, Detroit, Philadelphia…) — mass participation as compositional method; SimCity for the ears."
  verifiable: "City Symphonies project (Opera of the Future, 2013– )"
