  title: Opera of the Future
  rarity: rare
  signifier: "🎼🧠"
  flavor: An instrument should amplify what you mean, not just what you do.

relationships:
  # kinds may stack — real people relate in multiple ways at once
  - { with: marvin-minsky, kinds: [media_lab_colleague, adapted_his_book, lab_next_door, memorial_discussant], why: "Brain Opera (1996) explicitly inspired by The Society of Mind; Marvin in NYT: 'done in the lab next to mine by Tod Machover'" }
  - { with: nicholas-negroponte, kinds: [media_lab_founding_director], why: "Joined the Media Lab in its founding era; Opera of the Future group" }
  - { with: oliver-steele, kinds: [homepage_link_story], why: "Oliver added the Brain Opera link to Marvin's home page on his own — 'sometimes they meddle with mine' (NYT)" }
  - { with: david-levitt, kinds: [ai_music_peer], why: "Two Minsky-orbit answers to expressive machine music — hyperinstruments vs computational jazz" }
  - { with: ray-kurzweil, kinds: [music_machines_peer], why: "Hyperinstruments vs the K250 — augmenting players vs synthesizing orchestras" }
  - { with: jerry-martin, kinds: [game_music_bridge], why: "His students Rigopulos + Egozy (Harmonix) made Guitar Hero/Rock Band — games as instruments" }
  - { with: keez-duyves, kinds: [participation_art_kin, premorial_costar], why: "Brain Opera's audience-as-performer ethos ↔ PIPS:lab; Death and the Powers ↔ Die Space premorializing" }
  - { with: brian-eno, kinds: [generative_music_peer], why: "Generative/participatory composition worlds" }

abilities:
- id: HYPERINSTRUMENTS
  name: Hyperinstruments
  type: activated
  mana: "{G}{U}"
  conditions:
  - segment_topic_in: [music, instruments, expressive-interfaces, yo-yo-ma]
  advertisement:
    method: hyperinstruments
    signature: hyperinstruments(gesture) → intent amplified, not just captured
    score_when:
    - trigger: instrument_not_app_thread
      weight: 0.92
  effect: "Instruments that measure expressive intent and amplify it — the hypercello built for Yo-Yo Ma (1991); the design pole for every 'instrument, not app' thread on the show."
  verifiable: "Hyperinstruments program (MIT Media Lab, from 1986); Begin Again Again… (1991)"
  combos_with: [VR-AS-INSTRUMENT, BOUNCE]
- id: BRAIN-OPERA
  name: Brain Opera
  type: activated
  mana: "{U}{W}{G}"
  conditions:
  - segment_topic_in: [society-of-mind, participation, marvin-minsky, interactive-music]
  advertisement:
    method: brainOpera
    signature: brainOpera(audience) → Society of Mind as a playable building
    score_when:
    - trigger: minsky_memorial_segment
      weight: 0.95
    - trigger: audience_becomes_performer
      weight: 0.93
  effect: "The Society of Mind staged: an audience-participatory opera of many small musical agents (1996), built in the lab next to Marvin's; permanently installed at Haus der Musik Vienna. Memorial gold — the book turned into a room you can play."
  verifiable: "Brain Opera (1996); NYT First Wired Family; Haus der Musik"
  combos_with: [SOCIETY-OF-MIND, MENTOR-CONSTELLATION, ANI-STORY-ANIMATION]
- id: DEATH-AND-POWERS
  name: Death and the Powers
  type: activated
  mana: "{W}{B}{U}"
  conditions:
  - segment_topic_in: [premorializing, uploading, digital-twins, opera, die-space]
