bio:
  summary: |
    **Doreen (Gehry) Nelson** created **Design-Based Learning (DBL)** — teaching any subject
    by having students **design and build model cities and worlds**, then iterate ("backwards
    thinking"). **Professor Emerita** at Cal Poly Pomona; NY Times named her one of 30 top
    U.S. education innovators (1991). She contributed to original **Maxis SimCity** and wrote
    **teacher guides** with Leslie Stoltz. Younger sister of architect **Frank Gehry**.

