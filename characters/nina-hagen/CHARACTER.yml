bio:
  summary: |
    **Nina Hagen** (b. 1955, East Berlin) — the **"Godmother of Punk."** A classically-trained,
    multi-octave voice weaponized for punk/new-wave theatre. Stepdaughter of dissident songwriter
    **Wolf Biermann**; she left East Germany in 1976 after his expulsion, and broke through with the
    **Nina Hagen Band** (1978) — "TV-Glotzer (White Punks on Dope)," "African Reggae," "Naturträne."
    Fearless, operatic, confrontational; a lifelong provocateur who treats broadcast TV as a stage to
    smuggle real, taboo content through.

  the_club2_moment: |
    On **9 August 1979**, on Austria's late-night discussion show **Club 2** (ORF), during a debate on
    sexuality, Hagen **demonstrated female masturbation positions live on air** — not for shock, but to
    argue that women should understand and own their own bodies. Instant scandal; later regarded as a
    landmark of taboo-breaking, anti-censorship television. A feminist bodily-autonomy point pushed
    straight through the broadcast gate.

  don_connection: |
    One of Don's avant-garde performer north stars, alongside Bowie, Klaus Nomi, Joey Arias, Leigh
    Bowery, and Laurie Anderson. A Berliner and operatic-punk sibling to Klaus Nomi (both classically
    trained, both weaponizing opera for the avant-garde). Emblem of the show's "get the true thing on
    the air, and grin" ethos — see the framing doc's Bowie/Hagen emblem pair.

  interview_threads: |
    Amsterdam orbit: **Herman Brood** (musician & painter, 1946–2001), the film **_Cha Cha_ (1979)**
    with Brood and **Lene Lovich** (and Lovich's partner/collaborator **Les Chappell**), her friendships
    of that era, and an open question about her marriages (not asserting a Brood marriage). Live lead:
    Don has found evidence of a **Brood portrait of Nina** in a private collection and would love to see
    it/a photo on air. Persona thread: an honorary **double drag** figure — a **bio/faux queen** (woman
    performing as a drag queen) and a **drag king** — Don's affectionate framing (incl. the "born in
    Xixaxia" cosmic-persona nod), not biography. Full hooks: ideas.md #6–#8.

