bio:
  summary: |
    **Aaron Swartz** (1986-2013) co-authored RSS 1.0 at fourteen, helped make Creative Commons
    machine-readable, wrote html2text in the Markdown lineage, built web.py and Infogami (merged
    into Reddit), worked with Brewster Kahle on Open Library, liberated PACER documents via
    RECAP, and founded Demand Progress (SOPA/PIPA). The 2008 Guerilla Open Access Manifesto is
    the ethic this repo practices when it copies papers and quotes books into the working tree:
    sharing knowledge is a moral imperative, not piracy. Punk remix (Hagen) and generative
    reuse (Eno) are how that ethic stays a show instead of a mausoleum. Prosecuted under the
    CFAA after downloading JSTOR at MIT; died by suicide 11 January 2013, age 26.

