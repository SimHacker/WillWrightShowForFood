bio:
  summary: |
    **Alan Turing** (1912-1954) invented the universal machine as a byproduct of answering
    Hilbert's Entscheidungsproblem (1936), headed naval Enigma work at Bletchley Park, designed
    ACE, published "Computing Machinery and Intelligence" (1950), and spent his last years on
    morphogenesis -- reaction-diffusion systems, phyllotaxis, "intended to defeat the argument
    from design." One published biology paper; a drawer of unfinished manuscripts published
    posthumously as Collected Works Volume 3. Don typed in the prefatory texts and scanned the
    1923 daisy drawing by Turing's mother.

