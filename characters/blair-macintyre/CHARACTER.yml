bio:
  summary: |
    Began augmented reality research in 1991 in Steven Feiner's group at
    Columbia on KARMA (Knowledge-based Augmented Reality for Maintenance
    Assistance); PhD from Columbia (1998 or 1999). Co-author of "Windows on
    the World: 2D Windows for 3D Augmented Reality" (UIST 1993), which put X11
    windows into an AR space and later received the UIST Lasting Impact Award.
    Joined Georgia Tech in 1999, where he founded and directed the GVU
    Augmented Environments Lab and the Argon AR browser (2011), and directed
    the Qualcomm Augmented Reality Game Studio. Principal Research Scientist at
    Mozilla (2016-20) on WebXR and the WebXR Viewer; co-chaired IEEE VR 2020,
    held online in Mozilla Hubs. Global Head of Immersive Technology Research
    at JPMorgan Chase (2022-26). Professor at Northeastern University.

connections:
  aquery_2013: |
    Replied to Don's aQuery proposal (forwarded by Ben Shneiderman). His
    objection, credited by name in SCREEN-ANGEL.yml: interfaces built by
    drilling down to specific objects break when the application updates, so
    bind to patterns and build libraries of capabilities with a layer for each
    application. He also pointed beyond HTML: the same layer could serve AR,
    speech and other interfaces, as in Windows on the World.

