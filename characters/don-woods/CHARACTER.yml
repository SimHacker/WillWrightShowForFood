bio:
  summary: "**Donald R. Woods** — the Stanford grad student who found Will Crowther's cave on a lab machine in 1976, tracked down its author by emailing crowther@ every host on the ARPANET, got the source and the blessing, and expanded it into the canonical 350-point **Adventure** (1977) — the founding text of interactive fiction. Also co-designer (with James M. Lyon, Princeton 1972) of **INTERCAL**, the first and greatest parody programming language, and a co-author of **The Hacker's Dictionary** (1983). Later a systems hacker at **Sun Microsystems**, where he worked on **NeWS** and **The NeWS Toolkit** with Don Hopkins — a great PostScript hacker."

adventure:
  fact: "The Crowther/Woods 350-point Adventure is the common ancestor of Zork, interactive fiction, MUDs, and arguably the graphical adventure genre. Woods added the pirate, the endgame, and the scoring — including the last lousy point."
  the_email: "To get permission to extend the game, Woods emailed crowther@<host> to every host on the ARPANET until one reached Will Crowther at Xerox — possibly history's first distributed git blame."
  source_recovery: "Crowther's original source, presumed lost for decades, was recovered in 2005 from the salvaged Stanford backup tapes — specifically from WOODS'S OWN STUDENT ACCOUNT at SAIL. The tapes also let Woods correct the year he'd been giving in every previous interview. (tnt-geeks thread, Aug 2007; Jerz's DHQ article.)"
  knuth_recast: "Donald Knuth recast Adventure in CWEB (advent.w, 1998) — the copyright line reads 'Don Woods and Don Knuth'. Full study: ../donald-knuth/sources/adventure-knuth/"
  one_lousy_point: "In Zork lore, mailing the Spelunker Today matchbook to Infocom got you a real brochure bearing the 'One Lousy Point Donald Woods Stamp'. The MOOLLM microworld reissued it: https://github.com/SimHacker/moollm/blob/main/examples/adventure-4/kitchen/matchbooks.yml"

sun_news:
  fact: "At Sun, Woods worked on NeWS and The NeWS Toolkit (TNT) alongside Don Hopkins — firsthand collaboration, Don's attestation. A great PostScript hacker: quicksort.ps, the Spider solitaire that shipped with OpenWindows, Open Look widgets, the TNT tracking service (with Densmore + Raymor), the pinned-menus design memos. Artifacts: sources/sun-news-artifacts.md"
  motd: "His workstation was named 'colossal'; /etc/motd read: 'Welcome to Adventure. Would you like instructions?' — the host machine WAS the well house. Myth-check (Woods, 2025): motd real, but 'I do not recall anyone ever telling me' they fell for it. Public citation: Don's HN comment, Jul 2025 (https://news.ycombinator.com/item?id=44540509). See ../donald-knuth/sources/adventure-knuth/ANALYSIS.md"
  interop_thread: "Woods in the 1991 NeWS/TNT vs ICCCM interoperability work (focus/server-grab threads): 'I'm Woods with an `s`. The former Windows person with no `s` is Tom Wood.' — ../don-hopkins/sources/1991-09-news-tnt-icccm-death-match.md"

career_arc:
  fact: "Princeton (INTERCAL, 1972) → Stanford SAIL grad student (Adventure, 1977) → Xerox (Woods.pa@Xerox.COM, 1986; Spider ported to Xerox Development Environment) → Sun (NeWS/TNT) → General Magic (Communicating Applications, per the 1994 org chart at datarover.com/SEKRIT — Don's HN find, Jul 2025) → Postini → Google (via 2007 acquisition; per the 2008 Computerworld interview) → retired July 2022, 'playing games and solving puzzles' (his words, 2025)."
  general_magic: "The 1994 General Magic org chart lists Woods in Communicating Applications — the Adventure co-author at the Telescript shop, alongside Atkinson and Hertzfeld ('on loan') in Magic Cap Core Technology. Don's HN comment: https://news.ycombinator.com/item?id=44540509 — see ../don-hopkins/sources/zork-troll-flag-adventure-lineage-hn.md"

intercal:
  fact: "INTERCAL (Woods & Lyon, Princeton freshman year, 1972, post-finals and 'more than a little giddy') — 'Compiler Language With No Pronounceable Acronym'. Statements must say PLEASE often enough to be polite but not so often as to grovel; the compiler rejects both. A complete theory of programming-language humor, executable. Original compiler emitted SPITBOL, datatypes as strings of '0's and '1's."
  knuth_hack: "In 2003 Knuth wrote an INTERCAL program and found 'a really cool hack' in the standard library's DIVISION ROUTINE — he wrote to Woods asking whether he or Lyon deserved the credit in TAOCP vol 4. Neither could remember. (2008 Computerworld interview, archived: https://web.archive.org/web/20080723072756/http://www.computerworld.com.au/index.php/id;528456667)"
  not_a_fortran_spoof: "Woods: 'We didn't [spoof FORTRAN and COBOL specifically]. (Even though Wikipedia seems to claim we did.) We spoofed the languages of the time.' On the 17-hour Sieve benchmark: 'That's not criticism, that's a boast!'"

hackers_dictionary:
  fact: "Co-author of The Hacker's Dictionary (1983, with Guy Steele, Raphael Finkel, Mark Crispin, Richard Stallman, Geoff Goodfellow) — the book form of the Jargon File, the culture's own dictionary."

