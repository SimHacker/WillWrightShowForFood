bio:
  summary: |
    **David C. ("Dave") Evans** (1924–1998) co-ran the ARPA-funded computer-graphics program at
    the **University of Utah** where Alan Kay was a graduate student, and co-founded
    **Evans & Sutherland** with [Ivan Sutherland](../ivan-sutherland/). Through Evans, Kay met
    Ed Cheadle and began the **FLEX** personal-computer work (Yoot People.md / Cheadle entry).

