thesis: |
  Read PKD and Lem as literal engineering specs. Each story = an authored reality with a
  demiurge inside it, plus an arrow of entropy. The AI era instantiates the premise; the only
  open variable is Weiser's: calm servant vs Palmer Eldritch.

# CLAIM-LEDGER — every factual claim handled before it enters the repo (no-ai-slop).
claim_ledger:
  weiser_coined_ubicomp_after_ubik:
    status: CONFIRMED
    detail: "Weiser coined 'ubiquitous computing' (PARC, 1988), explicitly referencing PKD's Ubik as ironically dystopian, inverted into 'calm technology'."
    sources: [https://en.wikipedia.org/wiki/Ubiquitous_computing, https://en.wikipedia.org/wiki/Mark_Weiser]
    primary_source: |
      Don heard it directly from Mark — Don was Weiser's student at UMD and a close friend until
      Weiser's death. Mark cited the Ubik scene where Joe Chip is trapped in his apartment, unable
      to afford the fee to open his own door (Don recalls him borrowing coins from the toaster) as
      the dystopia calm technology was built to avoid. Attributed to Don's memory; not a Weiser quote.
  vicki_reich_widow_of_weiser:
    status: CONFIRMED
    detail: "Victoria 'Vicky' Reich was married to Mark Weiser (d. 1999); daughters Nicole & Corinne Reich-Weiser."
    sources: ["Weiser memorial bio (cs.berkeley.edu/Weiser/bio)", https://en.wikipedia.org/wiki/Mark_Weiser]
  reich_rosenthal_cofounded_lockss:
    status: CONFIRMED
    detail: "Victoria Reich & David S. H. Rosenthal founded LOCKSS (1999, Stanford); shared 2025 Paul Evan Peters Award."
    sources: [https://www.lockss.org/about/history, "CNI 2025 award"]
  david_married_to_vicki:
    status: DISPUTED_UNVERIFIED
    detail: |
      Not in the public record we found; public materials describe David and Vicki as LOCKSS
      co-founders / professional partners, and one summary says they are not married. David's own
      marital status is his to state, not ours. DO NOT publish as fact.
    action: defer_to_david
    published: false
  don_relationships:
    status: CONFIRMED_BY_DON
    detail: "Don was Mark Weiser's student (UMD) and close friend until Weiser's death; long-time friend of David. Primary source for the Weiser/Ubik thread."
  stigmata_is_the_sims:
    status: INTERPRETATION
    detail: "Don's reading: Perky Pat layouts (dolls in dollhouses, inhabited via Can-D) + Eldritch's stigmata in every avatar = The Sims + provenance-in-every-character. Defensible, labeled as reading not fact."
  counterclock_reverse_christianity:
    status: INTERPRETATION
    detail: "Hobart Phase = entropy reversed; resurrection as default, Eucharist mirrored, digestion backward. Don's reading grounded in the novel's premise."
  lem_2plus2_equals_7:
    status: CONFIRMED
    detail: "Lem, 'Trurl's Machine' (Cyberiad): machine insists 2+2=7, rejects correction, rampages. Also in ../david-rosenthal/media/pdp7-hex-let-machine-win.yml."

