reflexive_punchline: |
  MOOLLM (LambdaMOO x The Sims) makes the PKD premise literal: gods edit the minds of simulated
  characters via yaml jazz; the author's marks are the stigmata on every character. Calm vs
  predatory demiurge = the repo's procedural answer: Player-in-the-Middle, consent, labeled
  simulation, portrayal standards. LOCKSS = an engineered Hobart Phase (preservation as applied
  eschatology).

