# sdi-icon-mdw.png — the SDI game icon, signed "mdw"
artifact:
  files: [sdi-icon-mdw.png, sdi-icon-mdw-4x.png]
  what: |
    The main SunView icon for SDI: the letters S, D, I as balloon-bombs on
    strings over a rubble skyline, signed "mdw" (Mark D. Weiser) in the
    lower balloon. The fancy_icon1-24 sequence animates this icon exploding
    frame by frame — the signature dissolving from "mdw" to "mark" to "mar"
    to a scatter of debris (see sdi-icons-contact-sheet.png).
  depicts: "SDI game icon + Mark's signature"

