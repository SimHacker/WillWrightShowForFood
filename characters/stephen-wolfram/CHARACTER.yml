bio:
  summary: "**Stephen Wolfram** (b. 1959) — British-American physicist, computer scientist, and entrepreneur. PhD in theoretical physics from Caltech at 20 (1979); youngest cohort of the MacArthur Fellowship (1981). Founder/CEO of **Wolfram Research** (1987), creator of **Mathematica**, **Wolfram|Alpha**, and the **Wolfram Language**. Author of ***A New Kind of Science*** (2002), arguing that **simple programs (cellular automata) generate the complexity of nature** — home of **Rule 30**, **Rule 110** (Turing-complete), the four **behavior classes**, **computational irreducibility**, and the **Principle of Computational Equivalence**. Since 2020 leads the **Wolfram Physics Project** — hypergraph rewriting, **multiway systems**, and the **ruliad** (the entangled limit of all possible computations)."

