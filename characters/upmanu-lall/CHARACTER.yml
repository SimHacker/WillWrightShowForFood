bio:
  summary: >
    **Upmanu Lall** — one of the world's leading water scientists. Inaugural director of the
    **Water Institute** at Arizona State University's Julie Ann Wrigley Global Futures Laboratory
    (since January 2024) and professor in ASU's School of Complex Adaptive Systems. Before that,
    the Alan & Carol Silberstein Professor of Engineering at **Columbia University** and director
    of the **Columbia Water Center** (Earth & Environmental Engineering). B.Tech IIT Kanpur (1976),
    PhD UT Austin (1981). AGU Fellow (2017), AAAS Fellow (2018), EGU **Henry Darcy Medal** (2014),
    Reuters "Hot List" of the world's top 1,000 climate scientists (2021).

  don_connection: >
    Decades-long thread. At Columbia, Lall ran **Project OPTIMUS**, using simulation games —
    SimCity included — to teach science and engineering. As Don recalls it, his move was to use
    SimCity to draw students from OTHER departments into environmental engineering classes: a fun
    multidisciplinary course where students ran controlled experiments in the game, gathered and
    exported the data as spreadsheets, and learned data analysis and spreadsheet wrangling along
    the way. When Don wrote him in December 2008 about GPL Micropolis, he replied: "Fantastic to
    hear from you … perhaps i can be listed as a collaborator? and I could then say I will use in
    my classes." He is in the Micropolis manual credits (Special Thanks) to this day.

quotable:
  reply_2008: "Fantastic to hear from you and learn what you are working on -- sounds very cool … perhaps i can be listed as a collaborator? and I could then say I will use in my classes"   # verbatim, 9 Dec 2008 email to Don
  optimus_blocker: "Currently, SimCity lacks the open architecture to add modules and extract state variables."   # Garvin/Smyth/Sommer/Lall paper, ~2002 — the requirement MicropolisCore+MOOLLM fulfills

approach: "Back into the fold with love and respect — guide, not grant ornament. Standing invitation, first look, zero obligation. Reconnection ask: 'your 2002 blocker is fixed; may we see the original OPTIMUS proposals?'"

