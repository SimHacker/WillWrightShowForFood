bio:
  summary: |
    **Nathaniel S. Borenstein** co-created **MIME** with Ned Freed (RFC 1341, 1992) —
    every email attachment, every multimedia message, rides on his work. Before that:
    the **Andrew Message System** at CMU's Information Technology Center, the same
    Andrew project that produced James Gosling and David Rosenthal's window system.
    He wrote **metamail**, designed **ATOMICMAIL** and co-designed **Safe-Tcl** —
    programs delivered *inside email*, behavior on the wire years before Java applets.
    Author of *Programming As If People Mattered* (Princeton, 1991). Co-founded
    **First Virtual Holdings** (1994), the first internet payment company. Later IBM
    Research and chief scientist at Mimecast. The first multimedia MIME message
    carried a photo and a song by his barbershop quartet, the **Telephone Chords**.
  quote: |
    "The most likely way for the world to be destroyed, most experts agree, is by
    accident. That's where we come in; we're computer professionals. We cause
    accidents."
  note: |
    Self-described (LinkedIn, 2026): an "Internet Greybeard trying to help people
    envision working together with intelligent machines to build a better world" --
    which is close to a mission statement for this repo.

relationship:
  kind: warm_lead
  don_connection: |
    Shared lineage rather than shared office: Andrew at CMU (Gosling, Rosenthal),
    active mail vs NeWS ("send a program, not a data structure"), programs-as-messages
    all the way down. First direct contact: 31 Jul 2026, Don replied to Nathaniel's
    comment on Gosling's retirement post, inviting him to help build the SIMH virtual
    lightpen input and AM radio output drivers -- "write PDP-7 code that you can dance
    to, using the light pen to direct it like a baton with PIXIE pie menus."
    Receipts: ../james-gosling/sources/2026-07-31-linkedin-retirement-thread.md

