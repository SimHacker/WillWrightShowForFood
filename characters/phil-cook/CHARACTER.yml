  to_pixie: |
    Director of research at Plessey who, in Heinz Lemke's 1967 memoir, cleared Heinz of the
    'German spy' suspicion, asked him to write up his computing ideas, personally drove him to
    Cambridge to meet Maurice Wilkes, and later agreed to fund his PhD as a Plessey investment.
    Without Cook's two decisions there is no PIXIE.

bio:
  summary: |
    **Dr. Phil Cook** was director of research at the **Plessey Automation Research Laboratories**
    in Poole, Dorset, in 1967. He appears in **Heinz Lemke's memoir** as the man who interviewed
    Heinz over the librarian's spy accusation, was persuaded, and then opened the door to Cambridge
    — introducing him to Maurice Wilkes and backing his PhD financially. No independent public
    biography has been located; he is documented here through Heinz's first-hand account.
  status_note: "Living/passed status and any further biography UNKNOWN. Sourced solely from Heinz's memoir."

