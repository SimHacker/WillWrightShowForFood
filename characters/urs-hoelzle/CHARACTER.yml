bio:
  summary: |
    **Urs Hölzle** — the implementation half of Self's miracle. PhD under **David Ungar**
    at Stanford: *Adaptive Optimization for Self* (1994) — the dissertation Ungar still
    says makes programming feel like "split second response time to every operation,
    including changing, running optimized code." With Chambers and Ungar: **polymorphic
    inline caches** (ECOOP '91) and **dynamic deoptimization / debugging optimized code**
    (PLDI '92) — the tricks that made a classless, delegating, everything-is-a-message
    language run fast, and that every modern VM now rests on. Wrote Self's **SIC**
    (simple inlining compiler). Co-founded **Animorphic Systems** (Strongtalk, with Lars
    Bak and David Griswold) → acquired by Sun 1997 → **HotSpot** (why Java got fast) →
    Bak to Google → **V8** (why JavaScript got fast). Then a second act at planet scale:
    **Google employee #8** and first VP of Engineering; SVP Technical Infrastructure;
    **Google Fellow**; co-author (with Barroso) of *The Datacenter as a Computer*;
    drove the warehouse-scale computing and energy-efficiency agenda.
  the_manual_story: |
    Jul 2026, on Amanda Walker's LinkedIn post of a spiral-bound Self manual: "That's how
    I learned to write in English... my advisor (David Ungar) asked me to expand the draft
    sketch of a manual we had, and about 30 versions later, there we had it. Dave was an
    excellent writer, and through the many rounds of his feedback I learned a lot!" He also
    posted a link to the v4 manual. Ungar replied that working with Urs was one of the best
    times of his career, and that Russell Allen recently got Urs's SIC working on 64-bit Macs.
  don_credit: |
    Don's line for decades: JavaScript runs fast today because of Self's implementation
    tech while keeping a broken object model. The "implementation tech" is substantially
    Urs's dissertation. Self delivered simplicity AND performance AND debugging —
    Hölzle's 1992 deoptimization paper is the "blew my mind" citation in Don's
    Vanessa-philosophy essay.

