bio:
  summary: >
    **Ray Kurzweil** (b. 1948, Queens NYC) — inventor, computer scientist, author, futurist.
    Built the first **omni-font OCR** system and the **Kurzweil Reading Machine** (1976 — Stevie
    Wonder was the first production user); founded **Kurzweil Music Systems** with Wonder's
    encouragement (the **K250**, 1984 — Technical Grammy 2015); pioneered commercial **speech
    recognition** (Kurzweil Applied Intelligence). Author of *The Age of Intelligent Machines*,
    *The Age of Spiritual Machines*, *The Singularity Is Near* (2005), *How to Create a Mind*
    (2012), and *The Singularity Is Nearer* (2024). Proposed the **Law of Accelerating Returns**.
    **National Medal of Technology** (1999), **Lemelson–MIT Prize** (2001), National Inventors
    Hall of Fame (2002), Grace Murray Hopper Award (1978). Principal Researcher + AI Visionary
    at **Google** (hired by Larry Page in 2012 "to bring natural language understanding to
    Google"). In July 2026 he unveiled **RAI**, his own consented Human-First Digital Twin,
    at the UN AI for Good Summit — appearing on stage alongside it.

minsky_thread:
  documented: >
    As a high-school student Kurzweil corresponded with **Marvin Minsky** and was invited to
    visit him at MIT; he then attended MIT expressly to study with Minsky (B.S. 1970, computer
    science and literature). He also visited Frank Rosenblatt at Cornell — he knew BOTH poles
    of the Perceptrons debate personally. (Wikipedia, sourced.)
  memorial_invite: >
    Warmly invited as a discussant for the marvin-minsky memorial — represent + discuss, never
    interview the deceased. Bridge: Don works at Leela AI with Marvin's son Henry Minsky
    (co-founder/CTO) and Milan Singh Minsky; Margaret Minsky also in the cast.
  see: ../marvin-minsky/CHARACTER.yml

rai_twin:
  what: "RAI — Human-First Digital Twin built from his lifetime writings, interviews, and reasoning; Kurzweil Technologies × Praxis AI joint venture"
  debut: "2026-07-10 — UN AI for Good Global Summit, Geneva; Ray appeared virtually alongside RAI, moderated by Kenneth Cukier (The Economist)"
  lineage: "His earlier avatar Ramona (2001, kurzweilai.net; the heroine of his Singularity film) is RAI's ancestor"
  show_relevance: >
    The show's portrayal-standards problem is HIS problem too: provenance, consent, governance,
    not flattening a mind into generic optimism. A conversation about how to represent a real
    person's ideas — with the person who just shipped his own answer — is a show about the
    show itself. We still want the human on air; RAI may cameo, clearly labeled, on his terms.

