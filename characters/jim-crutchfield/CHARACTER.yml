bio:
  summary: |
    **James P. Crutchfield** ("Chaos") is a physicist and mathematician of complex systems —
    **Distinguished Professor of Physics at UC Davis**, director of its **Complexity Sciences
    Center**, external faculty at the **Santa Fe Institute**, and president of the **Art & Science
    Laboratory** (Santa Fe). As a UC Santa Cruz grad student he was part of the legendary
    **Dynamical Systems Collective** ("the Chaos Cabal") with **Doyne Farmer, Norman Packard, and
    Rob Shaw** — whose **"Geometry from a Time Series"** (1980) showed how to reconstruct a
    system's hidden dynamics (attractors) from a single stream of measurements, and who famously
    built wearable computers to beat **roulette** (the *Eudaemonic Pie* story). He did foundational
    work on **video feedback** as a spatiotemporal dynamical system, on the **"edge of chaos"** and
    **evolving cellular automata to perform computation** (with Melanie Mitchell), and founded
    **computational mechanics** — the **ε-machine**, a way to discover the intrinsic structure and
    information processing hidden inside a process. The Santa Cruz group is a centerpiece of James
    Gleick's *Chaos: Making a New Science*.
  known_for:
    - "Video feedback as a dynamical system ('Space-time dynamics in video feedback', 1984)"
    - "'Geometry from a Time Series' (1980) — attractor reconstruction"
    - "Edge of chaos + evolving cellular automata to compute (with Melanie Mitchell)"
    - "Computational mechanics / ε-machines / statistical complexity"
    - "The Santa Cruz Dynamical Systems Collective (Eudaemonic Pie / roulette)"
    - "Art & Science Laboratory (Santa Fe)"

  feedback_kinship: "The reason for the invite: **video feedback** and **iterated graphical systems** — point a camera at its own screen and you get spatiotemporal chaos. It's the same family Don plays in with his **CAM6** cellular-automata performance platform and Scott Draves's generative work. A natural 'digress, recurse, and iterate' jam."
  cellular_automata: "Crutchfield's edge-of-chaos / evolving-CA work sits right next to Don's CAM6 and Norman Margolus's CAM-6 hardware — complexity living between order and randomness."
  complexity_lineage: "Santa Fe Institute complexity science; the Santa Cruz chaos lineage (Farmer, Packard, Shaw) that James Gleick popularized."
  art_and_science: "President of the **Art & Science Laboratory** (Santa Fe) — CA/chaos AS an art medium; the seam for Don's **CA artwork storytelling** at the finale of the CAM6 demo made for Norman Margolus (painting with overlapping CA layers, cells as animated SimCity tiles)."
  sfi_nexus: "Santa Fe Institute is the repo's complexity/CA/feedback nexus — Owen Densmore (Complex Systems Summer School → Redfish) and Reese Jones (SFI board trustee) also flow from it."
  rules_and_art_jam: "Anchors the cellular-automatists' rules-and-art jam: Don's CAM6 + Norman Margolus + Scott Draves + Reese Jones's agent-based modeling."
  directors_cut_live: "Finish the 2013 thread ON AIR: record the lost explanatory narration onto the clean 1984 film transfer, MST3K-style — 'we're the robots.' Source narration survives on Kathy Abelson's tape (Don's Sun office mate; wrote the NeWS manual Don reviewed/illustrated)."
  ca_playground_plan: "Jim's Dec 2013 CA-intro co-development offer, now unlocked: Norman Margolus gave Don permission to build interactive instructional/artistic web apps from Cellular Automata Machines chapters. First cut: modular TypeScript rewrite of Don's monolithic CAM6; Jim's structural-complexity layer (excess entropy, ε-machines, 1+1D space-time diagrams); students get homefun; a thousand flowers bloom."

