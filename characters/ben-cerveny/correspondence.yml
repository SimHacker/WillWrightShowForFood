gist: |
  Don moved the last Facebook Messenger thread to **Signal** — Ben already uses Signal
  (cat photos with his mom; main channel to Juho). Active 2026-07-03 thread: Don pitched
  the **Micropolis / Simopolis** stack — TypeScript in the browser, `packages/sims-io`,
  player-in-the-middle publish gates, **Head Shop + Wig-O-Matic**, **Simopolis** as liminal
  space between game worlds (Marusek *Wedding Album*), and **data portability** as Will's
  explicit 1986 pre-Dollhouse thesis.

  Ben **affirmed** the crown-jewel framing: moving characters/data between worlds/games is
  the big idea; while uplifted in heavenly liminal Simopolis you explore, edit bodies and
  souls, create/buy/share. That's the **starting point for the first Will Wright episode**.
  Ben recalled Don's **OpenLaszlo SimProv Wedding Playset + SimFreaks** plumbing (not the
  LLM soul-reading layer). Don is rewriting in clean TypeScript for browser + optional server.

  Ben flagged stale docs still saying **"88 shorts"** in round-trip fidelity prose — read as
  unwanted Nazi dogwhistle; Don removed that phrasing from narrative docs (PersonData instead;
  field count stays in BRIDGE.md for implementers only). Ben: "My heart goes out to you."

  Don extended the vision: **Mind Mirror** via browser Apple ][ emulator; per-game character
  storage + uplifted YAML; **Transmogrifier pattern** for entire save files including
  SimAntics→YAML; deterministic browser re-engineering tools; LLMs for reverse engineering
  commentary, not runtime dependency.

