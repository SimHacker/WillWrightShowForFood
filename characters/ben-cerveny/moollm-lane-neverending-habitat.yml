      ACME Road Runner bakfiets parked on Lane Neverending — MOOLLM plugin object (inheritance +
      programming-by-example). GPS tracker + heavy lock + recovery service = Don's real Amsterdam
      ebike parking problem (garage rented but bikes stay in house; Ken Kahn borrowed one).
  bike_rack:
    url: https://github.com/SimHacker/moollm/blob/main/examples/adventure-4/street/lane-neverending/center/bike-rack.yml
