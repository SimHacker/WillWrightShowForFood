    note: "Topologically circular street outside the Gezelligheid Grotto pub. Splice segments for more real estate."
  acme_bakfiets:
    url: https://github.com/SimHacker/moollm/blob/main/examples/adventure-4/street/lane-neverending/w1/acme-bakfiets-of-holding.yml
