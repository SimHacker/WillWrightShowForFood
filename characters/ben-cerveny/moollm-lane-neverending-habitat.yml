# Not in-repo MOOLLM files — pointers only.

meta:
  character: ben-cerveny
  kind: cross_reference
  date: "2026-07-03"
  channel: Signal

why_ben_cares: |
  Ben's lineage: **Game Neverending** (social spatial world → Flickr), **Habitat** thinking,
  public digital infrastructure. Don's MOOLLM **adventure-4** street is a deliberate homage:
  topologically circular, infinitely extensible by splicing segments — same move as GNE and
  Habitat-style world growth. YAML and markdown files are *paper*; buildings park on the street.

