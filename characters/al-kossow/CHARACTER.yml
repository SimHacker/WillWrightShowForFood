bio:
  summary: |
    Created bitsavers.org, an online archive of documentation and software for
    historic computers. Senior software engineer at Apple, 1986 to 2005:
    interactive graphics, operating systems, real-time control, software
    liaison to CPU vendors. Long-time Computer History Museum volunteer, on the
    PDP-1 restoration team. Named the museum's Robert N. Miner Software Curator
    in July 2006; chairman of its Software Preservation Group from 2007.

connections:
  cabinet: >-
    The cabinet's PDP-7, Type 340 and MACRO-9 work rests on bitsavers scans:
    7-13_340_Display_Programming_Manual.pdf, pdf/dec/pdp7/,
    DEC-9A-AMZA-D_MACRO9.pdf, PDP7_Instruction_list.pdf, MIT AI memos.
  arthur_van_hoff: >-
    November 2023: Al read 1/4-inch Sun tapes from the Turing Institute,
    Glasgow, and passed them to Don and Arthur.
  sunos_bar: >-
    One tape was a SunOS bar archive; packages/sunos-bar reads it.
  bruce_tognazzini: "Don asked Al and Arthur for platform advice on preserving asktog.com."
  david_rosenthal: "Emulation and software preservation."

