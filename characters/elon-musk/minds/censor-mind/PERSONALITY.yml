# ELON MUSK — censor-mind personality, built from Brainball parts
# ============================================================================
# Public, under portrayal-standards.md#public-power. A hypothesis about a
# mind, tested against the record; not a claim about what he feels.
#
#   abstract  the-baron archetype (moollm), which imports four traits from
#             his followers' archetypes: persecution, awkward-gesture,
#             just-joking, someone-else-did-it
#   concrete  each trait's cover replaced with his own sentence, verbatim,
#             with a source. real: [self] makes lint fail otherwise.
#
# The ablation in README.md says the record doesn't need any of these
# censors: applause explains every action. So they're offered as his own
# account of each moment, not as the cause of it.
# ============================================================================

inherits:
