    source: >
      Reuters 2025-01-21 https://www.reuters.com/world/us/musks-hand-gesture-during-trump-inauguration-festivities-draws-scrutiny-2025-01-21/ ;
      NPR 2025-01-23 https://www.npr.org/2025/01/23/nx-s1-5269719/elon-musk-salute-inauguration-day-nazis
