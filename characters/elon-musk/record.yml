# ELON MUSK — the public record, as a layer over the Brainball case
# ============================================================================
# Public, under portrayal-standards.md#public-power. The kit's fictional
# case (moollm skills/schema-mechanism/censors/examples/baron/) paraphrases
# a pattern; this layer replaces each paraphrase with what was actually
# said or done, verbatim where it's words, with a source on every event.
# `real: [ally]` makes lint fail on any event without one.
#
# Used by crowd/*.yml (his followers, as archetypes) and by
# minds/censor-mind/on-stage.yml (his own seat). Corrections with evidence
# are welcome and will be made; see README.md and disputes.yml.
# Sources checked 2026-11-23.
# ============================================================================

real: [ally]

who:
  ally: "Elon Musk"
  accuser: "historians and Jewish organizations"
  org: "the press"

events:
  - t: 1
    say: >
      Musk on X, 15 Nov 2023, replying to a post that accused Jewish
      communities of pushing "the exact kind of dialectical hatred against
      whites that they claim to want people to stop using against them":
      "You have said the actual truth."
    source: >
      NYT 2023-11-17 https://www.nytimes.com/2023/11/17/technology/elon-musk-twitter-x-advertisers.html ;
      TechCrunch 2023-11-20 https://techcrunch.com/2023/11/20/apple-to-pause-advertising-on-x-after-musk-endorses-antisemitic-conspiracy/
  - t: 1.5
    set: { accusation-heard: on }
    say: >
      DealBook Summit, 29 Nov 2023, asked about the reply: "I should in
      retrospect not have replied to that particular person ... And
      essentially I handed a loaded gun to those who hate me. And arguably
      to those who are antisemitic. For that, I'm quite sorry. That was not
      my intention." Later: "I would certainly put that comment that you've
      said the actual truth among perhaps one of the most foolish, if not
      the most foolish thing I've ever done on the platform." To the
      advertisers who had left: "If somebody's going to try to blackmail me
      with advertising, blackmail me with money, go fuck yourself."
    source: >
      Rev transcript https://www.rev.com/transcripts/dealbook-summit-2023-elon-musk-interview-transcript ;
      Reuters 2023-11-29 https://www.reuters.com/technology/elon-musk-curses-out-advertisers-who-left-x-over-antisemitic-content-2023-11-29/
  - t: 1.8
    say: >
      Madison Square Garden, Trump rally, 27 Oct 2024: "I'm not just MAGA.
      I'm dark, gothic MAGA."
    source: "Guardian 2026-11-18 https://www.theguardian.com/us-news/2026/nov/18/elon-musk-maga-trump ; GMA 2026-11-19 https://www.goodmorningamerica.com/news/story/musk-regrets-500-million-midterm-elections-spending-hes-138270985"
  - t: 2
    say: >
      Capital One Arena, 20 Jan 2025, inauguration celebration: he slapped
      his right hand on his chest and threw his arm out straight, palm down;
      turned to the crowd behind him and did it again. "My heart goes out
      to you. It is thanks to you that the future of civilization is
