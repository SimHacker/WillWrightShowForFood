bio:
  summary: >
    **David Joshua "DJ" Kurlander**, Ph.D. — conceived and led **Comic Chat** (Microsoft Chat)
    from Microsoft Research (1995) through Internet Division productization (IE3, Windows 98,
    24 languages). SIGGRAPH '96 paper with Tim Skelly and David Salesin; art collaboration with
    **Jim Woodring**. Columbia Ph.D. (*Graphical Editing by Example*, Feiner); early MSR UI/graphics;
    later Product Unit Manager for **Mobile Internet Toolkit** and GM of New Consumer Products /
    **Microsoft Surface**. Retired; side projects; public site kurlander.net.

