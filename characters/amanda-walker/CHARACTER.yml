bio:
  summary: |
    **Amanda Walker** — PostScript / NeWS hacker and longtime friend of Don's. At
    **InterCon Systems** (Reston) she was a sharp voice on `NeWS-makers` and a co-conspirator
    on the **PostNews** experiment (PostScript over compress+btoa; signed
    **Speaker-To-PostScript**). Wrote the classic NeWS pitch: UI factored into the server so
    look-and-feel is decided at invocation — she remade liteUI into a Mac-like desktop without
    touching client binaries. Bluntly called Sun marketing stupid for sidelining NeWS and
    named **Don Hopkins and SGI** as its most visible proponents. By late 1990 at **Visix**
    (`amanda@visix.com`); June 1991 congratulated Don on **Pizza Tool** and said she was
    putting NeWS into a real commercial product — **Galaxy**, the cross-platform framework
    with a NeWS-like PostScript interpreter at its core. Later: engineering leadership in
    privacy, safety, and security (Sr. Director at Google). Jul 2026: found a spiral-bound
    **Self** manual in a 90s office-move box and lit the Ungar/Urs reunion.

galaxy:
  fact: |
    Technical lead for Visix Galaxy. 1991 email is the receipt that Galaxy's NeWS support
    was intentional ("incorporate support for NeWS into a (shh…) real live commercial
    product"). Don's Interval notes: PostScript rendering with DPS or software fallback.
  don_notes: "https://donhopkins.com/home/interval/pluggers/galaxy.html"
  news_receipt: sources/1989-1991-news-makers-and-postnews.md

