    (Way to Win). Earlier career: startups and academia with a **visualization** research focus
    (UCSB Alexandria Digital Library / ADEPT — GIS + spatial simulation, 2002–2004). The 2006 Long
    Now SimCity question is exactly his lane: **political assumptions in rule-based systems**.
