bio:
  summary: |
    **Bill Budge** (b. 1954) — American game programmer/designer, an industry legend for the Apple II
    classics **Raster Blaster** (1981) and **Pinball Construction Set** (1983). PCS wasn't a game so
    much as a **tool to build games**: drag pinball parts onto a table, wire up how they behave, and
    play — pioneering **user-generated content** and naming the **"construction set"** genre. It
    required him to write a mini paint program, a mini sound editor, and save/load. Published through
    his **BudgeCo** and then **Electronic Arts** (he's the one wearing the glove in EA's 1983
    "Software Artists / We See Farther" photo). He later built tools at **3DO**, **Sony** (Lead Tools
    Programmer), and **Google** (retired 2022), and still ships editor frameworks on GitHub. His
    passion, in his own words, is building **tools and frameworks**.

