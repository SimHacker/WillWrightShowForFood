bio:
  summary: |
    **Jeff Adkins** (GitHub **DnfJeff**) is the creator of the **SimObliterator Suite** — AI-assisted,
    open tools for reading, writing, and analyzing **The Sims 1** save files and objects: IFF/FAR
    parsing, GUID/object (OBJD) analysis, and catalog inventory. His work is the concrete substrate
    under the show's **character import/export** — the "soul mover" — the thing that turns Will
    Wright's 1996 "data-portability holy grail" into something you can actually run today. (**VitaMoo**,
    the in-browser character/skeleton/mesh renderer, is **Don's** TypeScript reimplementation that grew
    up alongside — SimObliterator is what inspired it; see why_a_guest.the_build.)
  known_for:
    - "SimObliterator Suite — Sims 1 save/object tooling (IFF/FAR, GUID analysis, catalog inventory)"
    - "AI-assisted reverse engineering across languages — analyze, translate, verify, iterate"
    - "The tooling that inspired Don's VitaMoo (Don's own TypeScript character renderer)"

why_a_guest:
  foundational: "SimObliterator is part of what made the show technically possible — the save-file read/write layer under the soul mover."
  the_feedback_loop: |
    Jeff built SimObliterator with AI by studying Don's documented, published code plus open-source
    Sims-family reimplementations (different languages, analyzed + translated + verified by AI). Don
    is now reimplementing it in WWSFF-owned TypeScript, also with AI — each iteration feeding the
    other and improving every pass. AI copying AI copying people, all the way down: stone soup,
    cauldron, cellular automata, Wolfram, and Eno's generative systems, made literal in a codebase.
  full_credit: "Jeff gets full credit for SimObliterator's influence and code — interview or not. The TypeScript reimplementation follows the repo's IP-hygiene + credit rules (apps/micropolis-angel/, CREDITS)."
  the_build: |
    Concrete engineering role: his solid, well-organized Python (incl. SimAntics analysis) is being
    ported to the browser (via Claude, credited) to power a content 'file cop' / 'virus scanner' —
    detect missing objects + broken UCC, repair, and locate sources in the catalog. Jeff best placed
    to lead the content-management features + back-end site. (Parallel + separate — **VitaMoo**: Don's
    own clean-room Sims character-animation system. Don had ALREADY hand-written a compatible VitaBoy
    implementation for **Unity3D (C#)** from decades-public designs; VitaMoo is that C# **AI-translated
    to TypeScript** for the browser — a translation of his OWN prior work, not generation from scratch.
    Independent IP lineage. Unity3D C# zip sources: TODO link.)

