bio:
  summary: >
    **Paul Rother** was the in-house programmer at **HOMER & Assoc.** (Sunset Gower Studios,
    1977–1997). Hired to program **Homer II** — the real-time visual mixing console — he worked
    directly with **Charles Moore** (Forth, Inc.), programming the **2K EPROM** in each of 24 Z80
    visual channels while Moore programmed the PolyForth host. He got the **CAT-700** 7-bit frame
    buffer running in Forth — optical-printer control, paint system, OS, compiler, and debugger in
    **32K** — first used on *Abracadabra* and *Atomic Dog*. He also designed S100 boards (stepper
    motors, projector lamp triacs) and co-authored the public HOMER history with Coco Conn.

