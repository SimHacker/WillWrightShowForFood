# Ian Bogost — Cow Clicker (2010)
# Satire that became a phenomenon; procedural rhetoric as performance art

game:
  title: Cow Clicker
  developer: Ian Bogost
  release: 2010-07-21
  platform: Facebook (browser)
  genre: incremental / social satire
  site: http://www.cowclicker.com/
  bogost_page: https://bogost.com/games/cow-clicker/

purpose: |
  Built in ~three days for NYU seminar "Social Games On Trial" (July 2010), after Bogost coined
  "cow clickers" at GDC 2010 criticizing FarmVille winning Best New Social/Online Game.
  Distilled Zynga-style mechanics to absurd essence: click cow every six hours, earn clicks,
  buy Mooney, invite friends, post to feed — to demonstrate what social games abuse, not to ship
  a product.

mechanics:
  core: "Click one cow every six hours; earn clicks; optional Mooney micropayments"
  social: "Friends' cows in pasture; news-feed posts on click"
  parodies_added: |
    Cowclickification API; Cow Clicker Blitz (with Jason Kapalka); My First Cow Clicker (iOS);
    Cow Clicktivism / emaciated cow → Oxfam; Stargrazer Cow (~$20 mirror-image cow)

cowpocalypse:
  arg: Cow ClickARG — "bovine gods"
  scheduled_end: 2011-07-21  # one year after release
  mechanic: "Each click deducts 30s from countdown; pay Facebook Credits to extend"
  extension_rates:
    - { credits: 10, extends: "1 hour" }
    - { credits: 4000, extends: "1 month" }
  paid_extensions_total_usd: ~700
  actual_end: 2011-09-07 evening
  end_state: "Cows raptured — blank spaces remain; still clickable"
  bogost_to_fan: "It wasn't very fun before."
  wikipedia_section: https://en.wikipedia.org/wiki/Cow_Clicker#%22Cowpocalypse%22_event_and_conclusion

reception:
  unexpected: "50,000+ players by Sept 2010 — Bogost disturbed but continued as layered satire"
  wired: "The Curse of Cow Clicker — Jason Tanz, Wired, Dec 2011"
  npr: "If You Can't Ruin It, Destroy It — On the Media, Nov 2011"
  nick_yee: "Incredibly clear Skinner box"
  jason_kapalka: "Ironic, satirical, self-referential — what Facebook lacked"
  cookie_clicker: "Bogost: Cookie Clicker (2013) is Cow Clicker's logical conclusion"
  atlantic_2018: '"My Cow Game Extracted Your Facebook Data" — Cambridge Analytica context'

