title: Ian Bogost
iconic: "🐄 Ian"
description: |
  Coined procedural rhetoric — argument encoded in rules and processes, "an unholy blend of
  Will Wright and Aristotle." Cow Clicker (2010): satire that went viral, then ended honestly
  in the Cowpocalypse. The lens this repo reads Sims objects through, Motive.c to Dumbold.
  WashU distinguished professor across three colleges; comp-lit PhD; edits Platform Studies
  with Montfort and Object Lessons with Schaberg.

