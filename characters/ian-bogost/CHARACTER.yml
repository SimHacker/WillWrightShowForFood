bio:
  summary: >
    **Ian Bogost** coined **procedural rhetoric** — "an unholy blend of Will Wright and Aristotle"
    ([The Atlantic](https://www.theatlantic.com/technology/archive/2015/03/video-games-are-better-without-characters/387556/),
    16 Mar 2015) — argument encoded in rules, processes, and interactive failure modes, not essays
    on a page (*Persuasive Games*, MIT Press, 2007). *Cow Clicker* (2010) deconstructed social-game
    mechanics on purpose; the Sims UCC lineage (Motive.c, SimProv Wedding Playset, Dumbold Voting
    Machine) and Don's QGCon inclusivity paper are natural case studies in inclusion agitprop vs
    institutional farce.

