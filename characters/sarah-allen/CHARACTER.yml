bio:
  summary: |
    **Sarah Allen** — a straight line through the history of multimedia on personal
    computers. Brown Graphics Group animator under **Andries van Dam** → co-founder of
    **CoSA** (The Company of Science & Art), shipping **After Effects 1.0** → wrote the
    **first Shockwave player** at Macromedia (one of the first Netscape plugins *and* first
    IE ActiveX controls) → created the **Shockwave Multiuser Server** → led **Flash Video
    and the Flash Communication Server** (later Flash Media Server) from inception through
    first release. Then **Laszlo Systems** (2003–2009): OpenLaszlo core architect through
    the proprietary→open-source transition, and Director of Application Development for
    **Laszlo Webtop** (mail/calendar licensed to Earthlink, Verizon, Alcatel-Lucent).
    Then the third act: founder of **Blazing Cloud**; CTO of **Mightyverse**; co-founder of
    **RailsBridge** (with Sarah Mei) → Executive Director of **Bridge Foundry**;
    **Presidential Innovation Fellow** at the Smithsonian (crowdsourced Transcription
    Center; first Smithsonian hackathon); **18F** (College Scorecard, announced by
    President Obama); **Google Cloud** engineering lead (serverless events / security
    policy). Blogs as **ultrasaurus**. Organized the 2007 Google fundraiser for the
    **ENIAC programmers documentary** with Jean Bartik in the room.
  don_connection: |
    First meeting, early 1990s: Sarah visited **Kaleida Labs** and installed a super-early
    **CoSA After Effects** on the Mac in Don's lab — it rocked his world. (Receipt: Don's
    2013 intro email — "I first met her way back in the day when I was working at Kaleida
    and she was working at COSA on AfterEffects!") A decade later she hired Don as the
    OpenLaszlo audio/video contractor in 2006 and was his code reviewer — the
    mediastream/mediadevice refactor was hashed out with her on laszlo-dev, and Don's
    YouTube player component grew out of that contract (Jim Grandy: "Wow, Don! That's
    fabulous"). Receipts, comedy included (stolen laptop, ten-fingers biometric login
    theory, AntiORP netart, DreamMachine hallucinotronics), in
    sources/2006-openlaszlo-video-collaboration.md. Warm thread ever since: newsletters,
    Pantomime Bug Squish, 2023 Leela AI exchange.

