bio:
  summary: "**Ben Shneiderman** — HCI pioneer who coined \"**direct manipulation**,\" invented embedded/highlighted hyperlinks, and founded the University of Maryland HCIL. Director of **HyperTIES** (from TIES, The Interactive Encyclopedia System) — an early hypermedia system whose highlighted, selectable embedded links are the ancestor of the modern hyperlink."

hyperties:
  role: "Director of HyperTIES at UMD HCIL. Don built the NeWS/PostScript version (embedded PostScript applets on hypermedia pages). Ben & Don discussed documenting the work — a living, pixel-perfect browser emulator would be the ideal documentation."
