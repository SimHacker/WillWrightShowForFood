bio:
  summary: |
    **Ben Shneiderman** — HCI pioneer who coined **"direct manipulation,"** invented **embedded /
    highlighted hyperlinks**, and founded the **University of Maryland HCIL**. Director of **HyperTIES**
    (from TIES — The Interactive Encyclopedia System): early hypermedia with highlighted selectable
    embedded links — ancestor of the modern hyperlink. **CACM July 1988** shipped *Hypertext on Hypertext*
    as an electronic journal (4000+ copies). Berners-Lee's **1989 Web proposal** cited Hyperties for
    **"hot spots"** and adopted **light blue link color** from Ben's user studies.

    Co-author of the **CHI'88** empirical **pie vs linear menu** study with **John Callahan**, **Don
    Hopkins**, and **Mark Weiser** — Fitts, error rates, direct manipulation made measurable. Known for
    **Dynamic Queries**, **The Eyes Have It** (info visualization), *Leonardo's Laptop*, and **human-
    centered AI** — human control in high-stakes automation.

    **Don** built the **NeWS/PostScript HyperTIES** (embedded PostScript applets on hypermedia pages).
    **Jan 2022:** Don sent Ben HN threads on Ted Nelson, Xanadu, self-revealing UI, HyperTIES→Web lineage.
    **Proposal:** reincarnate HyperTIES **pixel-perfect in the browser** — living emulator as documentation.

  known_for:
    - "Coined 'direct manipulation' (1980s HCIL)"
    - "Embedded / highlighted hyperlinks — Shneiderman + Dan Ostroff (1983–1986)"
    - "HyperTIES + CACM July 1988 electronic journal"
