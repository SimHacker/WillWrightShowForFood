# Netochka Nezvanova — invitation portrayal of a public art persona. NOT the person(s) behind it.
# Standards: ../../schemas/portrayal-standards.md
# Mystique is the medium here: suspected identities and rumors are labeled AS rumors, on purpose.

character:
  id: netochka-nezvanova
  name: "Netochka Nezvanova"
  type: invitation
  signifier: "🌼🎭🖥️"
  status: living            # person(s) behind the persona presumed living; the persona is a collective mask
  field: "Net-art persona / performance-art trolling; author of NATO.0+55+3d and m9ndfukc.0+99 (real-time video/audio for Max, classic Mac OS)"
  home: characters/netochka-nezvanova/

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent_level: 3          # public figure: public work + net-art legend; no impersonation, no invented inner life
  authored_by: don-hopkins
  persona_note: >
    NN is a deliberately anonymous, possibly collective online identity. We portray the PUBLIC
    persona and its documented software and writings. We do not dox, do not impersonate NN's
    voice, and do not publish private correspondence. The ambiguity is hers by design; we keep it.

invitation:
  status: stub
  consent: not_yet_asked
  document: invitation.md
  note: >
    Don would genuinely love her on the Repo Show. Reaching the person(s) behind the mask is its
    own adventure — and possibly, in Don's words, "awaking a monster with a new medium to terrorize." 😉

bio:
  summary: >
    **Netochka Nezvanova** ("NN") — a massively influential net-art persona at the turn of the
    millennium, name borrowed from the title character of **Dostoevsky's** first novel (1849),
    translating as **"nameless nobody."** Author(s) of **NATO.0+55+3d** (1999), a notorious and
    beloved real-time video/graphics extension for **Max** on classic Mac OS — years ahead of
    Cycling '74's Jitter (2002), which NN considered a rip-off — and of the data-visualization
    piece **m9ndfukc.0+99**. Equal parts brilliant software and spectacular performance-art
    trolling: ASCII code-poetry flames on the **nettime** mailing list, contentious per-site
    licensing, and a carefully crafted, water-through-your-fingers public mystique. What might
    look like line noise to some is actually responsive and prompt if not idiomatically encoded
    customer service to others.
  aliases:
    - "NN"
    - "antiorp"
    - "integer (inte.ger)"
    - "=cw4t7abs"
    - "punktprotokol"
    - "0f0003"
    - "maschinenkunst (m2zk!n3nkunzt)"
  quote_signature: >
    "I have not been thrown off a mailing list. / I have been illegally transformed into a yellow
    flower. / A young girl one day found me, and with half closed eyes whispered: / Perfection, /
    Today you've peered in my direction." — Netochka Nezvanova (nettime)

suspected_identity:
  primary: "Rebekah Wilson"
  basis: >
    Named in reporting and the IMA "video portrait #02 Rebekah Wilson aka Netochka Nezvanova."
    Wilson is a real composer/technologist (later co-founder of Source Elements). Treat as the
    most-cited *suspected* human behind the mask, not a settled fact — the persona outran any one person.
  handling: "Flagged as suspected; mystique retained deliberately. Confirm before stating as fact on air."

rumors:                     # labeled AS rumors — the legend is the artwork; do not launder into fact
  collective: "Widely described as a collective international project, not a single author — 'there is only 01 of me.'"
  many_faces: "Different people reportedly appeared AS NN at different events over the years (e.g. distributed at/around fiftyfifty.org, invited to Barcelona)."
  origins_speculation: "Press floated a female New Zealander artist, a male Icelander musician, or an Eastern European collective — the map contradicts itself, on purpose."
  steim_amsterdam: "VERIFIED: Rebekah Wilson / Netochka Nezvanova was Guest then Artistic Co-Director at STEIM (Amsterdam), 2001–2003 — self-styled title *Director of Leaves and Petals*. Same institution as Laurie's 1992 'invisible instrument' work and Tom Demeyer's Image/ine (1996–2001). Not necessarily direct collaboration with Laurie; same waters."
  hafler_trio: "Andrew McKenzie (Hafler Trio) was once hinted at as involved; appears NOT to have been the case (per nettime-era accounts)."

steim:
  verified: true
  role: "Guest Artistic Co-Director (from April 2001) → Artistic Co-Director, 2001–2003"
  title: "Director of Leaves and Petals (self-styled)"
  overlap:
    - "Laurie Anderson — STEIM 'invisible instrument' (1992); Talking Stick with Interval (1999)"
    - "Image/ine — Tom Demeyer + Steina Vasulka @ STEIM (1996–2001)"
    - "Don Hopkins — used Image/ine for live video performance; Amsterdam-based"
  invitation_note: "Separate Repo Show invitations for Laurie and NN; ask Laurie about the Max/NATO/Jitter scene on her episode only — never speak as either without consent."

don_connection:
  after_effects_host: >
    Don discussed an **After Effects plug-in host for NATO** — intrigued, **declined** (public HN/thread
    context; full timeline in studio repo). Parallel work: PowerPC Mac live video, AE plugins — see
    don-hopkins sources.
  voice: "Don has long championed NN on Hacker News — spectacular trolling AND spectacular software."

connections:
  max_pd_lineage: "NATO.0+55+3d lived inside Max's visual-programming protocol; part of the patch-cord dataflow world (see visual-programming trail). Jitter (Cycling '74) later covered similar ground."
  steim_imageine: "Image/ine (STEIM, 1996–2001, Tom Demeyer + Steina Vasulka) drew real-time video in a parallel direction; NN was STEIM Artistic Co-Director 2001–2003 — institutional overlap, not necessarily direct collaboration."
  laurie_anderson_steim: "Laurie Anderson worked at STEIM on an 'invisible instrument' (1992) — same lab, different decade, before NN's co-directorship. A Repo Show thread: did Laurie know NN's STEIM/AntiORP era?"
  microsound: "Adjacent to the microsound / glitch-art scene (see Kim Cascone)."

show_suggestions:
  - { what: "A net-art / code-as-cult conversation: NATO vs Jitter, licensing as performance, trolling as propaganda — with the mystique kept intact (masked appearance, text-only, or via an intermediary is fully in character)." }
  - { what: "STEIM co-director era + Image/ine overlap — Don used Image/ine; NN as Director of Leaves and Petals 2001–2003." }
  - { what: "Max/Pd patch-cord lineage — NATO inside Max, operators net-jamming, the Jitter controversy." }

facts_to_confirm:
  - "Rebekah Wilson as the (a) person behind NN — suspected/most-cited, not settled."
  - "Whether Laurie Anderson knew NN / AntiORP at STEIM or in the Amsterdam scene (institutional overlap is verified; personal overlap is an open question for Laurie)."
  - "Current reachability and whether NN/she would welcome a portrayal or an invitation (grace about any answer — or non-answer, which is very on brand)."

