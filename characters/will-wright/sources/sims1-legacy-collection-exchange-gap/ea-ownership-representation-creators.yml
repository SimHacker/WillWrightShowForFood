sims4_medical_wearables:
  date: "2023-01-31"
  what: |
    Free base-game update — CGMs (Continuous Glucose Monitors), hearing aids, top surgery scars,
    binders, shapewear. CAS → Body → Medical Wearables subcategory; children through elders;
    cosmetic only unless community mods (e.g. healthcare overhaul).
  partners: Breakthrough T1D charity streams cited in press
  gameplay: Visual representation — not functional diabetes simulation in base game
  show_tie: |
    Procedural rhetoric of inclusivity + player storytelling — same franchise lineage as Exchange
    and Family Album. Contrast with fears after 2025 ownership change.

