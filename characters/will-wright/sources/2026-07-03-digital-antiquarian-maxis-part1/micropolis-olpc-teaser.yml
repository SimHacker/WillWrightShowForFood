blog_comment:
  context: |
    Rowan Lipkovits (Jul 4, 2026) on Maher's post — asked for a note on Micropolis bundled with OLPC.
    Don replied on filfre.net offering deeper follow-up by mail. This teaser is the public-facing
    version of that promise — no ask, just "here's where the story lives."
  posted_filfre:
    date: "2026-07-07"
    note: "Don finished posting on filfre — SimRefinery, Micropolis/OLPC, Lauren/Gallium, Will Dev Diaries"
    draft_url: https://www.filfre.net/2026/07/the-life-and-times-of-maxis-part-1-simeverything/?unapproved=1064416&moderation-hash=e39ff321e459dfb466dc32df08f0e0de#comment-1064416
  rowan_reply_full: |
    Rowan — you're right that the delightful dead ends never fit. Two you named:

    **SimRefinery** — Phil Salvador at The Obscuritory did the definitive archaeology when an Ars reader
    surfaced the Chevron training floppy in 2020:
    https://obscuritory.com/sim/simrefinery-analysis/
    (Same family of odd Maxis Business Simulations prototypes Jimmy's catalog barely had room for.)

    **Micropolis on the OLPC XO** — Jimmy's Part 1 stops at SimCity 2000; the open-source chapter is
    the next one: Long Now audience question → John Gilmore → Will's yes → EA relicensing → GPLv3
    release renamed Micropolis (EA kept the SimCity trademark). I'm publishing the 2006–2008 primary
    sources — verbatim mail, XO-1 photos, pitch letters, show prep with Will:
    https://github.com/SimHacker/WillWrightShowForFood/blob/main/characters/will-wright/sources/2006-11-13-simcity-olpc-email-thread/README.md

    Funnily enough, Lauren Elliott — who created the Carmen Sandiego series — was also Will's project
    manager at Broderbund on *Raid on Bungeling Bay*, the game that led to SimCity. We all worked
    together at Will's Stupid Fun Club, and Lauren is now CEO of Will's company **Gallium Studios**,
    where they work together on **Proxi** — Will calls it a kind of software heirloom: family members
    each contribute memories of someone you love; you discover things you didn't know. Forty-plus years
    of collaboration.

    Will on the "software toy" lineage (same design thread that eventually went open for OLPC) and Proxi:
    https://www.youtube.com/watch?v=u73_yZyuDS0
  short_follow_up: |
    Update for anyone following Rowan's thread: the Micropolis / OLPC open-source saga is now being
    documented in public — verbatim 2006 email, XO-1 photos, contracts, and show prep with Will.
    Start here: {olpc_email_thread}
    (Jimmy's Part 1 ends at SimCity 2000; this is the next chapter.)

