# ARCHIE-SUIT CMX WHITMAN — GLANCE (nav + metadata SSOT)

title: "archie-suit.txt — Whitman in the bone report"
iconic: "🦴📜"
description: |
  Don's CMX exporter, run with debugging on, wrote a human-readable report for Archie Bunker's suit:
  the 21-bone skeleton sung as Dem Bones ("The ROOT bone's connected to the NULL bone") under an
  epigraph from Whitman's I Sing the Body Electric — the poem insisting the body's parts ARE the
  soul. The machine format and the human format came out of the same exporter, and the human one
  had room for poetry.

