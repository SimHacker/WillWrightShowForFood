# SIMLISH VOICE VIDEO 2001-08-23 — GLANCE (nav + metadata SSOT)

title: "Simlish voice video — Kearin & Lawlor at the mic, 23 Aug 2001"
iconic: "🎙️📼"
description: |
  78 seconds of Stephen Kearin and Gerri Lawlor recording Simlish on camera, voicing to picture
  with two Sims on a CRT in front of them. Camcorder-stamped AUG 23 2001 — expansion-pack era,
  a later session than the English ad-lib audio. Rescued from a 2,531-view upload Don found at
  700 views in 2022. Carries two accidental artifacts: YouTube's ASR transcribing Simlish as
  Spanish, and a 290-comment corpus from 290 distinct accounts that reads as an engagement farm
  performing memorial ritual for a real dead performer.

