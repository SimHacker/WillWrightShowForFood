    - id: open-source-simcity-audience-question
      aliases: [simcity-political-assumptions]
      title: "Open source SimCity? — audience question"
      hook: "Dan Ancona asks Will to open-source SimCity so we can play with the political assumptions in the rules. Don was in the room; Gilmore emailed Don 140 days later; Micropolis pitch ~5 months after."
      audience:
        askers: [Dan Ancona, Mark Live]
        question: |
          There are a lot of really interesting political assumptions embedded in the simple
          rules that drive SimCity — would you ever consider open sourcing a version of it
          so we could play with those assumptions?
      will_answer:
        highlights:
          - SimHealth let players adjust rules under the hood
          - Arguing with the simulation = success — mental model coalesced
          - Generative discovery ≠ dumping code — give access to underlying structures
          - "I'm very open to the idea — it's probably harder than it sounds"
      don_payoff:
        witness: Don Hopkins in audience (2006-06-26)
        gilmore_email: 2006-11-13  # 140 days after Long Now
        don_denial: 2006-11-19      # Don to Will — not me, not Gilmore; "humorous effect"
        pitch_letter: 2006-12-01    # 158 days after Long Now
