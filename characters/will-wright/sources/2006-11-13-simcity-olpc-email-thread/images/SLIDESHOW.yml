narrative:
  opening_quote: "The screen looks really great up close."
  closing_quote: "It runs very smoothly and is quite playable over the net."
  overview: |
    Five photos Don attached to his 29 Dec 2006 email to Jim Gettys and the OLPC
    list. SimCity displayed on the X11 OLPC screen, fed over wireless from a Fedora
    Core VMware session. Licensing locks removed; fonts patched for the XO X server;
    twm substituted for Sugar while debugging multi-window Tcl/Tk.
  style_notes: |
    Low-res webcam captures of an LCD. Warm tungsten cast. Multi-window X11/Tk UI
    (later reworked to single-window for Matchbox/Sugar). Historical evidence of
    the Micropolis/OLPC arc between EA clearance and January 2008 release.

