reference_cache:
  directory: .
  downloaded: 2026-07-04
  tool: yt-dlp
  extractor_args: "youtube:player_client=android"
  files:
    - youtube-auto-en.en.vtt
    - youtube-auto-en.en.json3
    - youtube-auto-en.timeline.tsv
  purpose: timestamp verification, clip cut discovery, diff against canonical
  not_for: on-air quotes, publication without Don's transcript

regenerate_timeline: |
  python3 -c "
  import json; from pathlib import Path
  p = Path('youtube-auto-en.en.json3')
  data = json.loads(p.read_text())
  out = Path('youtube-auto-en.timeline.tsv')
  with out.open('w') as f:
      f.write('sec\\tdisplay\\ttext\\n')
      for ev in data.get('events', []):
          if not ev.get('segs'): continue
          t = ev['tStartMs']/1000
          h,m,s = int(t//3600), int((t%3600)//60), t%60
          ts = f'{h}:{m:02d}:{s:05.2f}' if h else f'{m}:{s:05.2f}'
          text = ''.join(s.get('utf8','') for s in ev['segs']).replace('\\n',' ').strip()
          if text: f.write(f'{t:.3f}\\t{ts}\\t{text}\\n')
  "

