will_framing:
  metaphor: software_heirloom
  don_summary: |
    Will described Proxi as a kind of **software heirloom**: memorialize someone you love
    (e.g. your grandmother) with family members contributing — each tells stories they know
    from their own perspective; together you discover things you didn't know.
  mechanics_implied:
    - central figure (e.g. grandmother) as shared subject
    - multiple contributors — each partial, personal viewpoint
    - emergent discovery — gaps filled by others' memories
    - intergenerational preservation — pass down like an heirloom object, but living
    - identity_pronoun_surfing: |
        Each relative may narrate grandma in first person ("I remember…") or third ("she always…")
        — same pattern Will cites when players describe game play. See identity-pronoun-surfing.yml

