# What Alan Kay says about Will Wright / SimCity — public-safe digests only
# Index: ../alan-kay/people-index.yml
# No direct Kay-on-Will portrait. Kay-on-SimCity verbatim DOES exist and is public (see below).

character: will-wright
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Kay's public/constructionist line treats closed simulation models as pedagogically thin
    next to glass-box microworlds (Papert, Etoys, open systems). Don's OLPC-era correspondence
    places SimCity in that contrast — black box vs open model. Useful show foil: Will's
    Simulator Effect + Kay's "computer revolution hasn't happened yet" / microworlds Sure!

  verbatim_on_simcity:
    status: public
    what: |
      Kay criticized SimCity on the record in the November 2007 OLPC thread — the game's
      assumptions and the opacity of its mechanism, in pointed terms, plus the note that he had
      tried to get Maxis to take the educational possibilities seriously and got nowhere. The
      constructive half is a design brief: show the rules in a readable and writable form, and
      separate world dynamics from character strategies from media.
    target: |
      Aimed at Maxis and the game's design, not at Don's port. Micropolis is the answer to the
      brief, and Don published a written response at the time (node 135).
    handling: |
      Not featured here, deliberately. This entry exists so nobody re-derives it and assumes it
      is unpublished. Quote it only with Don's say-so — he is hosting Will, and there is a
      difference between a citable fact and a thing you put in a guest's room.

