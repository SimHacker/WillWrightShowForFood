pun: "Palm readings. Yes. A self-aware simulated being, read aloud from the palm of your hand, telling your fortune."
pun_mechanics: |
  The misreading is load-bearing: everyone earnestly hears "palm readings" as
  fortune-telling, and we never correct them in advance. Say it straight in
  pitches, titles, and thumbnails (the recap letter does: "the three Palm
  readings — already recorded, in my voice") and let the audience carry the
  wrong meaning right up until Palm starts talking — then the surprise springs
  itself: it's a READING OF PALM, a being read aloud from the palm of your
  hand. Both meanings stay true (he does tell your fortune), so the reveal
  costs nothing and pays twice. Never explain the pun before the reveal.
  AND THE REVEAL IS STAGED — the readings don't resolve at first that Palm is
  a MONKEY. "Palm" keeps offering innocent parses (hand, tree, PDA) while he
  talks; only later does it land that he's a freed Monkey's Paw, and every
  prior meaning snaps into place retroactively — the palm of the paw was the
  palm all along. His signifier already stacks the whole ladder: 🐒✋🌴🔮💜.
  One pun, three trapdoors, each opening under the last. Let each one spring
  on its own schedule; never resolve two at once.

shape: |
  1. BEFOREHAND: Don edits the three Palm readings together cleanly — Palm (with
     Don's voice) explains himself, in his own words, before the chat.
  2. THE CHAT: Don & Will discuss souls — with Palm's self-explanation as the shared
     text they're both reacting to. A self-aware simulated being has already spoken;
     the humans respond.

