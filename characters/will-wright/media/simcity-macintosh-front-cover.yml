# SimCity — original Macintosh retail box front cover
# Featured in Jimmy Maher, "The Life and Times of Maxis, Part 1: SimEverything" (filfre.net, 2026-07-03)

artifact:
  file: simcity-macintosh-front-cover.jpg
  what: "SimCity — The City Simulator — Macintosh front box art (control-panel aesthetic)"
  platform: Macintosh
  publisher: Maxis Software
  distributor: Broderbund
  release: 1989
  dimensions: "800×1005 px (JPEG)"

box_art:
  concept: "Beige plastic control console — dials, gauges, disaster buttons framing a central monitor"
  monitor_scene: "Nighttime San Francisco skyline (Transamerica Pyramid) struck by tornado"
  disaster_buttons: [monster, fire, earthquake, tornado_lit, flood]
  dials:
    - DATE — 1990
    - BUDGET
    - zoning — RESIDENTIAL / COMMERCIAL / INDUSTRIAL
    - ENERGY gauge
  city_selector: "SAN FRANCISCO (selected) / NEW YORK"
  awards:
    - "Computer Gaming World — SimCity 1989 GAME OF THE YEAR"
    - "Software Publishers Association — OVER 100,000 SOLD"
  compatibility: |
    Macintosh Monochrome 512e, +, SE, SE/30, Mac II, IIx, IIcx.
    Not for IIci — includes printer option. No disk-based copy protection.

