placard:
  title: "Sim City box, Maxis, US, 1989"
  text: |
    SimCity players build and control simulated cities while reacting to natural and man-made
    disasters. Designer Will Wright got the idea after realizing that it was more fun to design
    the simulated worlds for the game Raid on Bungeling Bay than to actually play the game. Wright
    was also inspired by computer pioneer Jay Forrester's computer models of cities in his study
    of system dynamics. SimCity's success led to dozens of sequels, including The Sims series of
    life-simulation games.

