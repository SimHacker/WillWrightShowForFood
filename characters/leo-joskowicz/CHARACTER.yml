bio:
  summary: |
    **Leo Joskowicz** (born 1961) — Mexican–Israeli computer scientist; professor at the **Hebrew
    University of Jerusalem**; member of **ELSC** (Edmond and Lily Safra Center for Brain Sciences).
    Founder of the **CASMIP Lab** (Computer-Aided Surgery and Medical Image Processing, 1996).
    Specializes in medical imaging, surgical navigation, medical robotics, and patient-specific modeling.
    Former **president of The MICCAI Society** (2019–2022). **IEEE Fellow** (2013) for contributions
    to computer-assisted surgery and medical image processing. Deep **CARS** involvement — organizing
    committee member (2007–2026 per CV), program committee (2000–2026); CARS Vice-President, Barcelona 2015.
  education:
    - { degree: BSc Computer Science, institution: Technion, year: 1983 }
    - { degree: MSc, institution: "NYU Courant Institute", advisor: "M. C. Harrison", year: 1984 }
    - { degree: PhD, institution: "NYU Courant Institute", advisor: Ernest Davis, year: 1988, thesis: "Reasoning about Shape and Kinematic Function in Mechanical Devices" }
  career:
