bio:
  summary: |
    **Andrew Armit** — Cambridge **Mechanical Sciences** (1965); PhD on **interactive computer-aided
    design of 3D shapes** when the field was new. Graphics pioneer: **Multipatch** and **Multiobject**
    on **PDP-7** + **Titan**; **ICON** with **Heinz Lemke** (NASTRAN data for ships and oil rigs);
    **TAG** aircraft modelling; **Parallel Graphics Machine**. Extended visitor at **University of Utah**
    (~1968–69) with Coons-patch interactive CAD — **Alan Kay** in awe. Author of 20+ academic papers
    and a school mathematics textbook. Later: high-performance **signal amplifiers** (electron microscopy
    backscatter — Leo/Zeiss, KE Developments); **Intellisense** environmental measurement (25+ countries);
    consumer designs (**CoreStuff**, **TAKT** metronome watch for Parkinson's gait). Autobiography
    *Mind My Machine*. Lives near Cambridge (Haslingfield area).
  timeline:
    - { when: "1966", what: "Self-built oscilloscope from 50µA meter + surplus 3-inch CRT — used in own construction" }
    - { when: "~1968–69", what: "Utah visitor — Multipatch/Coons patches on PDP-7; US CAD tour with Henri Gouraud" }
    - { when: "1974–75", what: "ICON with Lemke — Lloyd's Register FEM/NASTRAN interactive data creation" }
    - { when: "2026-07", what: "PIXIE thread — barn archive inventory; Multipatch film confirmed; octal listings offered" }

