bio:
  summary: |
    **Antoni Sawicki**, aka **Tenox** — retrocomputing engineer and prolific porter of software
    to places software was never supposed to go. His personal site (tenox.net) has run since
    **1994**; he's a mainstay contributor to the **VirtuallyFun** blog and ships a steady stream
    of tools from **github.com/tenox7**: ttyplot (terminal plotting), the Web Rendering Proxy
    (browse the modern web from vintage browsers), NT Games (public-domain game remakes for
    Windows NT RISC), and OpenTTD builds for Alpha, MIPS, and PowerPC.

    He is a **serial Micropolis porter**: **wintown** put SimCity Classic on Windows NT RISC
    machines (Alpha AXP, MIPS, PowerPC, Itanium, ARM — targeting NT 4.0 and working toward
    NT 3.1), and in July 2026 he shipped **ttycity** — Micropolis for the terminal, ncurses,
    with the original simulation engine preserved as-is and four rendering modes from
    7-bit vt100 ASCII to full **Unicode emoji tiles**. Aug 2026: **vtcity** experiments with
    soft downloadable fonts on DEC VT terminals; planning **SimCity on Sun 1/2/3 with SunView**.
    A city you can play over ssh, down to 80×24.

    He also works the way this show works: for the OpenTTD NT RISC port he used LLMs — his
    phrase: "a tireless army of robots" — to downgrade modern code to compile on Visual C 4.0.
    Humans author, robots do the code rewrites, old machines live again.

ttycity:
  repo: https://github.com/tenox7/ttycity
  author: Antoni Sawicki
  status_jul_2026: "Own project; not announced HN; polishing binaries for more platforms"
  emoji_ui: sources/ttycity-emoji-graphics-ui.yml
  screenshot: media/ttycity-emoji-ui-screenshot.png
vtcity:
  repo: https://github.com/tenox7/vtcity
  what: "Soft downloadable fonts on DEC VT terminals — glyph loading experiment (Aug 2026)"
sunview_simcity:
  status: planned
  note: "SimCity port to Sun 1/2/3 with SunView — Antoni Aug 2026"
  ties_to: ../mark-weiser/software/README.md
  what: |
    Port of Micropolis Activity to the terminal using ncurses; simulation engine untouched.
    Assets (scenarios, cities) baked into the binary — one file, no installs. Themes (tan,
    grass, dark); graphics modes: standard curses (8 colors), unicode/emoji, 7-bit ASCII
    vt100, optional aalib. hjkl or arrows, mouse support, resizable, works down to 80×24.
  lineage: |
    "Fork of Open Source Micropolis, based on SimCity Classic from Maxis, by Will Wright —
    https://github.com/SimHacker/micropolis/" — GPL v3. The freed 2008 code, still sprouting
    new heads eighteen years later.
  why_the_show_cares: |
    A repo show about a repo — the exact same medium. ttycity is living proof of the Walter
    Bender mandate (free games as viewable, buildable, reusable source) and of the Long Now →
    OLPC → Micropolis thread: Don freed the code; Antoni keeps planting it in new soil. The
    emoji tile set is also the funniest possible answer to "how portable is a city?"

