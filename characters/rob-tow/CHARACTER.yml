    **Rob Tow** — researcher at **Interval Research Corporation** (Paul Allen's lab). Known in the
    Terry Winograd **CS547** archive for **visual psychophysics** applied to scanning, printing, and
    video (1993), and for **Placeholder** — *Landscape and Narrative in a Virtual Environment* — presented
    with **Brenda Laurel** and **Rachel Strickland** (1993). Married to Brenda Laurel.
