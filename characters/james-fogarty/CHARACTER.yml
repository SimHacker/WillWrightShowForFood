bio:
  summary: |
    PhD in Human-Computer Interaction, Carnegie Mellon (2006), in the first
    cohort of CMU's HCII PhD program. Faculty at the University of Washington
    since 2006, now Professor in the Paul G. Allen School of Computer Science &
    Engineering; helped found and grow DUB. With Morgan Dixon, Prefab:
    pixel-based reverse engineering of interfaces. With Xiaoyi Zhang, Anne
    Spencer Ross and others, interaction proxies for repairing mobile app
    accessibility at runtime (CHI 2017), and the first large-scale assessment
    of accessibility in 10,000 Android apps. Personal informatics research
    (menstrual tracking, food journaling, migraines). CHI Best Paper Awards in
    2005, 2010, 2017, 2024 and 2025; SIGCHI Academy, 2025.
  papers:
    - "Prefab (CHI 2010, Best Paper), with Morgan Dixon"
    - "Zhang, Ross, Caspi, Fogarty, Wobbrock. Interaction Proxies for Runtime Repair and Enhancement of Mobile Application Accessibility. CHI 2017. doi:10.1145/3025453.3025846"
    - "Zhang, Ross, Fogarty. Robust Annotation of Mobile Application Interfaces in Methods for Accessibility Repair and Enhancement. UIST 2018. doi:10.1145/3242587.3242616"

