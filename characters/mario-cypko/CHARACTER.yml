bio:
  summary: |
    **Dr.-Ing. Mario A. Cypko** — Head of **Medical AI and Modeling (MedAIM)** at **Hahn-Schickard**
    (Freiburg), lecturer at **University of Freiburg**. PhD in computer-assisted medicine (**University
    of Leipzig / ICCAS**, 2017) on multidisciplinary oncology decision support using **Bayesian networks**;
    Springer thesis [9783658325930](https://www.springer.com/de/book/9783658325930). Diploma in computer
    science (**Freie Universität Berlin**, 2013, medical informatics major, psychology minor). Postdocs:
    **ESA** Human Research (2017–2019), **German Heart Center Berlin** (2020–2021), **Matters of Activity /
    FU Berlin HCC** (2021–2023). Research: **Model-Guided Medicine**, transparent clinical AI, digital
    patient twins, wearable vitals, human-in-the-loop model interaction. CARS organizing/program
    committee member; initiated **Digital Space Medicine** sessions at CARS with ESA colleagues.
  projects:
    - name: KI-Compass
      role: Scientific lead (per Uni Freiburg press release)
      focus: "AI-supported follow-up after esophageal cancer; smartwatch + clinical data; explainable digital patient models"
      url: "https://www.uniklinik-freiburg.de/presse/pressemitteilungen/detailansicht/6855-ki-gestuetzte-nachsorge-nach-krebstherapie-soll-herz-probleme-frueher-zeigen.html"

