bio:
  summary: "**Dave Ackley** (David H. Ackley) — computer scientist and **Professor Emeritus at the University of New Mexico**, best known for **robust-first computing** and **indefinitely scalable** (best-effort, tile-based) computer architecture. He built the **Movable Feast Machine** — a spatial computing substrate where programs are living, self-repairing patterns rather than fragile deterministic code — and the **T2 Tile Project**, physical hardware you can literally bolt together edge-to-edge to grow a computer with no global clock and no single point of failure. Decades earlier he co-authored the classic **Boltzmann machine** learning paper (Ackley, Hinton & Sejnowski, 1985). His mantra — *'a crashed system is infinitely wrong'* — inspired MOOLLM's **robust-first** ambient skill."
  don_epithets: "Don's affectionate handles for him (Don's words, not titles): 'Patron Saint of Robust-First Architecture,' 'Moveable Feast Machine' maker, 'Emacs hacker,' 'Infinitely Scalable Hardware Maker,' and 'T2 Tile Project Borg Queen.'"

why_him:
  robust_first: "Reframes the whole field: correctness and efficiency are luxuries; SURVIVAL comes first. A system that crashes is infinitely wrong. This is a genuinely different value system for computing — and a direct sibling to Margolus's physics-respecting, locality-first CA."
  movable_feast_machine: "The MFM: cellular-automata-descended spatial computing where code is a self-repairing pattern that diffuses, heals, and reproduces. CA as an *architecture for real machines*, not just a model."
  t2_tiles: "Indefinitely scalable HARDWARE — tiles with only local, asynchronous communication; add tiles to add compute, forever, with no global coordination. The physical answer to 'what if the hardware were as local as the CA?'"
  neural_roots: "Co-author of the 1985 Boltzmann machine paper with Geoffrey Hinton and Terry Sejnowski — a founding document of the neural-net revival."
  don_connection: "Don has written about Ackley's work extensively and often on Hacker News; robust-first is an ambient skill in Don's MOOLLM."

