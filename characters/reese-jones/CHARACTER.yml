bio:
  summary: "**Reese Jones** — biophysicist turned networking pioneer: co-founded BMUG (1984), founded Farallon Computing (1986 — PhoneNET, MacRecorder, Timbuktu), which became Netopia (acquired by Motorola). Associate founder and board trustee of Singularity University; board trustee of the Santa Fe Institute (2012–2015); Facebook advisor (2016–); chairman of Cambrian Genomics. Public speaker whose recurring thesis: networks, blockchains, genomes, and technologies are one evolving substrate."

career:
  - { era: "1978–1987", what: "UCSF medical lab tech; UC Berkeley biophysics (BA + 5 yrs toward PhD — brain imaging of schizophrenia chemistry); Berkeley Lab research; graduation speaker on 'Biophysics & Bioethics'" }
  - { era: "1984", what: "Co-founded BMUG (Berkeley Macintosh Users Group) — became the largest computer user group of its kind" }
  - { era: "1985–1995", what: "Founded Farallon: PhoneNET (LocalTalk over phone wire, from BMUGNet), MacRecorder (first Mac audio input, later Macromedia), Timbuktu (cross-platform screen sharing / remote control)" }
  - { era: "1985–2007", what: "Farallon → Netopia (founder/chairman/CEO, 22 years); broadband gateways; acquired by Motorola" }
  - { era: "1996–2008", what: "Convergence.com (cable broadband), Mediabolic (CE media, → Rovi), Smaato (mobile ads, >1B users), Current Group (#Enernet — internet over power grid)" }
  - { era: "2005–2012", what: "Board, Chabot Space & Science Center ('space science for kids') — hands-on STEM education; later invited speaker at Edmodo (K–12 ed-tech platform)" }
  - { era: "2008–2014", what: "Singularity University — associate founder, board trustee" }
  - { era: "2011–2015", what: "Genome Compiler (co-founder/chairman), Cambrian Genomics (chairman — 'DNA LaserPrinter'); Harvard Medical School Genetics Advisory Council; Santa Fe Institute board trustee" }
  - { era: "2016–", what: "Facebook advisor; talks on blockchains-as-biology, internet-as-mirror, digital twins, agent-based modeling, artificial life" }

recurring_theses:
  everything_evolves: "Blockchains carry information like DNA; consume energy as information flow; evolve by natural selection — expect a Cambrian explosion (APIdays 2018)"
  internet_as_mirror: "Your data is a digital twin — privacy, security, data science (TEDxCincinnati 2016)"
  simulation_humility: "A computer can't fold one protein in one neuron — whole-brain simulation is far away"
  alife: "Consciousness in the Cloud (Netflix HQ 2014) — artificial life, multi-agent systems, evolutionary computation, agent-based modeling, complexity theory"
  long_view: "Personal project: long-range evolutionary forecasts for life on this planet; 'internet of living things'; infinite game theory & evolution"
  public_education: "Open-source public education; STEM for kids (Chabot Space & Science Center board; Edmodo talk) — the teaching-CS-to-kids thread (Micropolis/SimCity in the classroom, Logo, Snap!)"

