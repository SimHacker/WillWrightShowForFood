bio:
  summary: "**Reese Jones** — biophysicist turned networking pioneer: co-founded BMUG (1984), founded Farallon Computing (1986 — PhoneNET, MacRecorder, Timbuktu), which became Netopia (acquired by Motorola). Associate founder and board trustee of Singularity University; reported board trustee of the Santa Fe Institute; chairman of Cambrian Genomics. Thinks about technology as evolved biology."

career:
  - { era: "1984", what: "Co-founded BMUG (Berkeley Macintosh Users Group) as a UC Berkeley biophysics grad student — became the largest computer user group of its kind" }
  - { era: "1986–1998", what: "Founded Farallon Computing: PhoneNET (LocalTalk over phone wire, from BMUGNet), MacRecorder (first Mac audio input, later Macromedia), Timbuktu (cross-platform screen sharing / remote control)" }
  - { era: "1998–2006", what: "Farallon → Netopia (founder/chairman/CEO); broadband gateways; acquired by Motorola" }
  - { era: "2008–", what: "Singularity University — associate founder, board trustee" }
  - { era: "2010s", what: "Cambrian Genomics (chairman — 'DNA laser printer'), Genome Compiler; genomics + synthetic biology infrastructure" }
  - { era: "ongoing", what: "Biology-of-technology talks; long-range evolutionary forecasts; 'internet of living things'; records and publishes talks on his YouTube channel" }

