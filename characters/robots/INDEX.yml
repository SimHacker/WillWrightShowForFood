# Robots — fictional bot cast
# Stupid Fun Club brains, Minsky koans, gallery-opening regulars

room:
  id: robots
  name: Robots
  tagline: Loud ones, quiet ones, and the box that only switches itself off

roster:
  slats:
    path: slats/
    signifier: "🤖"
    role: "Stupid Fun Club robot — RoboResurrection; loud, eager, reprogrammable ham"
    show_segment: ../../repo-shows/will-wright/slats-reincarnation.yml
    audience_fork: ../../repo-shows/will-wright/audience/bot-slats/
  ultimate-machine:
    path: ultimate-machine/
    signifier: "📦"
    role: "Minsky 1952 koan — only switches itself off; Slats's good old friend"
    audience_fork: ../../repo-shows/will-wright/audience/bot-ultimate-machine/

gallery_openings:
  always: [slats, ultimate-machine]
  roster: ../menagerie/GUEST-ROSTER.yml#gallery_openings

duo:
  name: more-and-enough
  members: [slats, ultimate-machine]
  dynamic: "Slats can't stop talking; the Ultimate Machine only ever wants to switch off"

turing_robot_olympics:
  spec: ../don-hopkins/media/turing-institute/first-robot-olympics.yml
  gag: ../../repo-shows/ideas/gags/turing-robot-olympics.yml
  lineage: "Richard 1st (Groucho) → Slats; Cardiff Walker → vision-API training data"

don_robot_collection:
  spec: ../don-hopkins/media/robot-collection/van-leer-leather-press.yml
  gag: ../../repo-shows/ideas/gags/van-leer-robot-collection.yml
  note: "Street art that accidentally reads as robots — Van Leer press, Modemstraat, Disketteweg"

slats_one_minute_movies:
  spec: slats/one-minute-movies-production.yml
  photos: slats/photos.md
  show: ../../repo-shows/will-wright/slats-reincarnation.yml

see_also:
  - GLANCE.yml
  - ../INDEX.yml
  - ../menagerie/GUEST-ROSTER.yml
