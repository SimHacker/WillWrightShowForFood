bio:
  summary: |
    **Paul Lamere** ran the developer platform at **The Echo Nest** — the MIT Media Lab
    spinoff (founders Tristan Jehan and Brian Whitman) that industrialized machine
    listening: tempo, energy, danceability, acousticness, speechiness, liveness — a
    per-song meaning database served over the net, powering Spotify Radio, iHeartRadio-era
    playlisting, and ten thousand hack-day apps. Spotify bought the company in 2014 and
    Paul went with it. His blog **Music Machinery** (musicmachinery.com, now also on
    Substack) is the genre's lab notebook. Before The Echo Nest: music and search research
    at Sun Microsystems Labs ("Search Inside the Music").
  signature_hacks: |
    **The Infinite Jukebox** (Music Hack Day Boston, Nov 2012, MIT Stata Center) —
    decompose a song into beats, graph the similar-sounding ones, branch playback through
    the graph so the song never ends; kept alive by the community as the Eternal Jukebox.
    Also: Boil the Frog (a playlist path between any two artists), the Bonhamizer, the
    Roadtrip Mixtape (artists from the cities your route passes through), "How good is
    Google's Instant Mix?" (the 2011 playlist-engine shootout that toured the tech press).

