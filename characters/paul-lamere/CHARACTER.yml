why_the_show_cares:
  moody_kin: "The Echo Nest is the industrial version of moody's 'hire monkeys to annotate
    CDs' — machine listening as the annotation army, minus the consumer: a world of
    simulated people who can FEEL the data (moody-design-doc-review.md)"
  city_record: "The Infinite Jukebox is the city record at song scale: beats become
    blocks, branches become intersections, the song graph drawn in asphalt (MOODY.md)"
  roadtrip_mixtape: "Echo Nest demo that playlists the cities your route passes through —
    geography-driven playback, the ebike safari's direct ancestor"
  taste_profiles: "Echo Nest Taste Profiles = the per-person reaction model the 1999
    SimRadio email wanted ('different people would react to the musical moods in
    different ways')"
  rosetta_stone: "Echo Nest's ID-mapping layer across music services rhymes with the
    soul-file: one identity, re-rendered per world"
  paths_through_jukeboxes: "His 2010 tutorial title IS the show's geometry: finding a
    path through the jukebox — through a song's beat graph, or through a city's grooves"

