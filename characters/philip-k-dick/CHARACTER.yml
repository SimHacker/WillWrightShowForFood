# Philip K. Dick — memorial portrayal (in memoriam). NOT Philip K. Dick.
# Memorial mode: represent + discuss, never interview. Standards: ../../schemas/portrayal-standards.md#memorial-mode

character:
  id: philip-k-dick
  name: "Philip K. Dick"
  type: memorial
  signifier: "🕯️"
  status: deceased
  field: >-
    Writer: Ubik, The Three Stigmata of Palmer Eldritch, Do Androids Dream of
    Electric Sheep?, The Man in the High Castle, VALIS; simulated worlds and
    counterfeit people
  home: characters/philip-k-dick/
  aliases: ["PKD", "Philip Kindred Dick"]

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent:
    state: not_asked
  authored_by: don-hopkins

invitation:
  status: memorial
  document: memorial.md
  note: "deceased (16 December 1928 – 2 March 1982) — represent + discuss"

memorial:
  mode: represent_and_discuss
  rule: "Discuss his published work. Do not speak as him; invent no inner life. Treat his 1974 experiences and the FBI letter factually and without diagnosis."
  who_can_discuss:
    - { who: david-rosenthal, why: "The PKD / Lem reading group; 'Rautavaara's Case'", consent: not_yet_asked }
    - { who: will-wright, why: "The Sims and Palmer Eldritch's Perky Pat layouts, as Don reads them", consent: accepted }
    - { who: tod-machover, why: "Composed the opera VALIS (1987)", consent: not_yet_asked }
    - { who: don-hopkins, why: "Reads Dick as design documents; Mark Weiser told him Ubik was an inspiration for ubiquitous computing" }
  could_be_invited:
    - "Jonathan Lethem, co-editor of The Exegesis of Philip K. Dick (2011)"
    - "Isa Dick Hackett, his daughter; Electric Shepherd Productions"

bio:
  summary: |
    Born in Chicago in 1928; lived most of his life in California. Wrote 44
    novels and over a hundred stories, including The Man in the High Castle
    (1962; Hugo Award), The Three Stigmata of Palmer Eldritch (1965), Do
    Androids Dream of Electric Sheep? (1968), Ubik (1969), Flow My Tears, the
    Policeman Said (1974), A Scanner Darkly (1977) and VALIS (1981), and the
    stories "Autofac" (1955), "We Can Remember It for You Wholesale" (1966)
    and "The Electric Ant" (1969). His experiences of February and March 1974
    led to the Exegesis, published in 2011. Died in Santa Ana on 2 March 1982,
    months before Blade Runner opened. First science fiction writer in the
    Library of America (2007).

