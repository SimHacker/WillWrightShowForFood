# Donald Michie — memorial character (Repo Show / Soul Plaza)
# Canonical room. Rich deposits also under don-hopkins/media/turing-institute/

id: donald-michie
name: Donald Michie
nickname: Duckmouse
status: memorial
alive: false
born: 1923-11-11
died: 2007-07-07

# Pronunciation is inheritance along one axis only: how the names sound.
# Loving, on the record, colleagues' gift — not a joke at his expense.
pronunciation:
  given: "DON-ald (as in Donald Duck)"
  family: "MICK-ee (as in Mickey Mouse — never MISH-ee / MY-kee / mi-SHEE)"
  combined_nickname: Duckmouse
  dimension: pronunciation_only
  tone: loving_respectful_on_the_record

# Pronunciation axis — sounds, not cartoon souls.
# from <well> import <dimension.aspect> as <local>
pronunciation_import: |
  # from <module> import <dimension.aspect> as <local>
  from donald_duck import pronunciation.donald as donald
  from mickey_mouse import pronunciation.mmickey as michie

  given_name = donald   # DON-ald
  surname = michie      # MICK-ee
  nickname = "Duckmouse"

pronunciation_inheritance:
  parents:
    - { archetype: donald-duck, contributes: given_name_pronunciation, sound: DON-ald }
    - { archetype: mickey-mouse, contributes: surname_pronunciation, sound: MICK-ee }
  blend: Duckmouse
  not: "Not soul-model multiple inheritance of cartoon characters as selves — only name-sounds + nickname destiny."
  kin_parallel: jesus-mouse  # Jesus Mouse = Jesus × Mickey as lived Self; Duckmouse = Duck × Mickey as said name

mice_affinity:
  schoolboy: "Mouse fancier as a schoolboy (on the record — Telegraph / British Library orbit)."
  papers: "Early career: ~25 papers on mice."
  landmark: "1958 Nature with then-wife Anne McLaren — mouse embryo in vitro → transplant → live pups; techniques leading to human IVF."
  pete: "Pete Mowforth (Apr 2026): Michie + mice clarified for the people-first book — see record below."

duckmouse_on_the_record:
  tone: >
    Colleagues' nickname, spoken with affection and occasional fury.
    Smile with love. The mnemonic stuck because the man was unforgettable.
  public:
    - { who: "Daily Telegraph obituary (July 2007)", what: "Known to his colleagues as 'Duckmouse'" }
    - { who: "British Library Science blog", what: "'Duckmouse', a modern-day polymath" }
    - { who: "Wikipedia / GCHQ person pages", what: "Biographical spine; nickname in secondary retellings" }
  eyewitness:
    - who: Peter Mowforth
      when: "10 April 2026 email to Don Hopkins (Cc Arthur van Hoff); digest in-repo"
      path: ../don-hopkins/media/turing-institute/2026-04-pete-mowforth-duckmouse.md
      quote: >
        Penny Montgommery (PA) shouted down the phone how to pronounce the name —
        Donald as in Duck, Michie as in Mouse — thinking Michie was out;
        he was standing directly behind her. Pete watching, desperately signalling.
      attribution: "Pete Mowforth, eyewitness clarification, Apr 2026 — public-acceptable paraphrase; full mail not dumped here."
  phone_incident:
    coined_by: Penny Montgommery  # PA; mnemonic shouted in thick Scottish accent
    reaction: "Michie furious for a stretch — love and irritation braided; nickname stuck anyway."
    do_not: "Do not soft-slapstick the fury; Pete was there."

tags:
  - memorial
  - bletchley
  - machine-intelligence
  - turing-institute
  - duckmouse
  - menace
  - ivf
  - robot-olympics
  - edinburgh
  - glasgow
  - pronunciation-inheritance

one_line: >
  Polymath who worked beside Turing at Bletchley, pioneered mammalian IVF techniques
  with Anne McLaren, taught matchboxes to play tic-tac-toe, founded machine intelligence
  in Edinburgh and the Turing Institute in Glasgow — and was loved, teased, and forever
  remembered as Duckmouse: Donald as in Duck, Michie as in Mouse.

role_in_show:
  kind: memorial_presence
  rooms:
    - Soul Plaza (lineage wall — friend who named an institute for a friend)
    - Turing Institute wing / Robot Olympics orbit
    - PIXIE storyline bridge (Oldfield examiner ↔ Michie Machine Intelligence group)
  never: "Do not speak as Michie. Celebrate; quote discussants and published sources."

portrait:
  preferred: ../don-hopkins/media/turing-institute/donald-michie-duckmouse.png
  note: "Archival grain; grey suit; serious gaze — the wall that remembers."

relationships:
  alan_turing: "Bletchley colleague; chess partner of a sort; silver-ingot hunt; named institute for him"
  anne_mclaren: "Then-wife; 1958 Nature mouse embryo work → IVF lineage"
  peter_mowforth: "Cofounder / director Turing Institute; eyewitness Duckmouse phone disaster; book in progress"
  tim_niblett: "Cofounder; suggested the name 'The Turing Institute' after MIRA clash"
  arthur_van_hoff: "HyperLook at the Institute Michie built; Olympics poster gift from Pete"
  don_hopkins: "Worked Turing Institute Feb–Sep 1992; never met Michie; inherited the stories"
  john_oldfield: "Edinburgh examiner associated with Michie's group — insisted Heinz rebuild PIXIE docs"
  robin_popplestone: "Alan Kay: character² if not ³ beside Michie; Pop-2"
  penny_montgommery: "PA who coined the Duck/Mouse mnemonic on the phone (Pete eyewitness)"

soul_model_kin:
  parallel: jesus-mouse
  note: >
    Jesus Mouse = Jesus + Mickey Mouse as one lived Self (soul inheritance).
    Duckmouse = Donald Duck + Mickey Mouse along the pronunciation axis only
    (given-name sound + surname sound → colleagues' nickname).
    Same cartoon grammar; different sanctity. Both belong on the memorial wall.
    Python sketch of the difference:
      # jesus-mouse (blended soul): parents = ["Jesus", "Mickey Mouse"]
      # donald-michie (name-sounds):
      from donald_duck import pronunciation.donald as donald
      from mickey_mouse import pronunciation.mmickey as michie

