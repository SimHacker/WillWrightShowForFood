# Cambridge PIXIE hardware stack (~1969) + DEC reference shelf
# PDP-7 graphics satellite ↔ Titan. Local PDFs in this directory where noted.

stack:
  host_graphics:
    cpu: PDP-7
    display: Type 340 Precision Incremental CRT (vector, 1024×1024, P7 phosphor)
    options:
      - Type 342 Symbol Generator (first 64 characters — labels/text on display)
      - Type 370 High Speed Light Pen
      - Type 347 Subroutine Option (display controller; RFI / "munching tunes" on living iron)
      - Type 341 Interface (340 ↔ host; cited in 340 programming manual bibliography)
    role: |
      Interactive drawing on PDP-7/340 + light pen; PIXIE radial menus ("lightbuttons").
      User at graphics console; application logic often on Titan over high-speed link.
  remote_compute:
    system: Titan (Cambridge Multiple Access System — Atlas-class successor)
    role: Application programs, analysis, batch work; PDP-7 as distributed graphics terminal
    link: Wiseman high-speed data link (Rainbow group; Lang's link software)
    software_note: |
      Cambridge link code and PIXIE sources largely lost — separate preservation project.
      See ../../../heinz-lemke/cambridge-films-flight-of-the-bumblebee.md · cucps Titan docs (web).

