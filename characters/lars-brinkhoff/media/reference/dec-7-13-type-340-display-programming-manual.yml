what_it_is: |
  Programming manual for the DEC Type 340 precision incremental CRT display — vector graphics,
  display lists, light pen interface. Used with PDP-7 (and other hosts) as graphics satellite for
  PIXIE-era Cambridge work. This is **display device** programming, not the PDP-7 CPU instruction set.

