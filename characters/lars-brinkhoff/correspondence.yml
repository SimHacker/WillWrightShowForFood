# Lars Brinkhoff × Don Hopkins — correspondence summary (public-safe)
# Tight public-safe digest. NOT the full private thread.
# Standards: ../../schemas/portrayal-standards.md

meta:
  with: lars-brinkhoff
  curated_by: don-hopkins
  consent: not_yet_asked
  span: "2017-12 — ITS, Type 340, RFI, Emacs, Logo; 2026-07 — PIXIE Repo Show invitation response"
  provenance_private: DonHopkins email ([email redacted])
  human_readable: correspondence.md

gist: |
  Lars replied **yes/later** to the PIXIE trio invitation — interesting, but heading into Swedish
  July vacation (much of Sweden offline for the month). Not sure what he can contribute; prefers
  unprepared/rambling format with someone prodding him. SIMH PDP-7 **340 device is ok**; light pen
  may not be available yet — thinks it would be an **easy addition**. Can make **PDP-7 munching
  squares** — he recently revised his PDP-10 Type 340 and Knight TV versions; linked YouTube
  munching-squares video is gone but survives on web archive.

  Don pivoted production to **async 1-on-1 recordings** interlinked in post — rich intertwingled
  tapestry instead of one live group call across time zones.

threads:
  pdp7_type340_emulator:
    date: "2020-03-10/2020-03-18"
    what: |
      Don introduced Lars and Heinz Lemke after simh#752. Lars: PDP-7 + 340 working as far as he
      could test, no PDP-7 340 software, light pen there; web emulators wanted but no time. Phil
      Budne wrote the 340 for PDP-6/10, Lars added PDP-7. Recommended LCM over CHM for reading
      tapes. Don asked if SIMH could fake RFI; Lars: "interesting thought. But before that I'd like
      to get the regular music players to work." Emscripten tried (Knight TV ran; sockets the
      problem); crt-simulation GLSL started.
    links:
      - https://github.com/simh/simh/pull/752
      - https://github.com/larsbrinkhoff/crt-simulation
    feeds: ../../packages/cabinet/AM-RADIO.md
  its_and_humor:
    date: "2017-12/2019-08"
    what: |
      TUHS: job control came from ITS. AI:HUMOR; lives in PDP-10/its-vault (ROCKY HOR yes, LOGO
      TURTLE no; Leigh Klotz has it). LLOGO runs under emulation with the Knight TV.
  its_github:
    date: "2018-10/2022-01"
    what: |
      PDP-10/its#1339: Guy Steele's "teen-age hacker" tour, the PDP-6 with speakers and a stereo
      amp playing Brandenburg no. 6. #425 ITS pictures: DM's pager panel (Don's two-Zork knob),
      and Bill Gosper hacking Life on the PDP-6 (via Steven Levy and Mike Beeler).
    links:
      - https://github.com/PDP-10/its/issues/1339#issuecomment-428878039
      - https://github.com/PDP-10/its/issues/425
  spring_2020:
    date: "2020-04/2020-05"
    what: |
      Gosling Emacs history for NeWS sources; ITS Maze running; Banks's rule in the MIT Life film
      (PDP-10/its#1866). Lars prefers simulators and remakes to owning hardware, and using ITS to
      letting restorations sit.
  you_devil_you:
    date: "2020-04-14"
    subject: "Re: You devil, you!"
    what: |
      Don sent Lars two HN posts. 22840639 revealed ITS DDT's secret :DDTSYM DPSTOK/-1 + $$^R
      (write into other users' jobs; DDT prints a fake " OP? "). Lars: "Oh no, all the secrets
      are out in the open! ;-)" Don: Stever's 1989 unix-haters application already gave it away.
      22853920 was Conway's Life on the LCM PDP-7 + Type 340 with AM-radio music; Lars replied
      that his PDP-6 simulator was making noises now.
    links:
      - https://news.ycombinator.com/item?id=22840639
      - https://news.ycombinator.com/item?id=22853920
      - https://www.youtube.com/watch?v=hB78NXH77s4
      - http://its.victor.se/pipermail/its-hackers_its.victor.se/2020/000578.html
  pixie_invitation_response:
    date: "2026-07-02"
    response: yes_later
    constraints:
      - "Swedish July vacation — much of Sweden offline for the month"
    format_preference: "Unprepared/rambling — not naturally talkative; needs prodding on air"
    technical:
      simh_pdp7_340: "340 device for SIMH PDP-7 is ok"
      light_pen: "May not be available yet — likely an easy addition"
      munching_squares: |
        PDP-7 munching squares video link dead; web archive still has it. Lars revised PDP-10
        Type 340 + Knight TV munching squares; can port to PDP-7.
    don-async-pivot:
      date: "2026-07-03"
      what: |
        Async 1-on-1 videos whenever convenient; Don interlinks directories, artifacts, and cuts in
        post. Presumes most Cambridge PDP-7 software lost (separate preservation project if found).
        Segment hooks: light pen + networking hardware research; implement/test PDP-7 code;
        label-target light-pen pie menus even without float trig; Engelbart mouse/keyset on PDP-10;
        emulator mouse→light-pen interpolation; discuss designs on air, ship code later or demo if done.
      outbound_draft: characters/lars-brinkhoff/outbound-2026-07-03-async-pivot.md

