  type: memorial
  signifier: "🕯️🏠"
  status: deceased
  born: "1950-06-24"
  died: "2003-01-09"  # Menlo Park, CA -- died in his sleep, aged 52
  field: "Little Computer People; Mattel PowerGlove; Xerox PARC ubicomp, PAIR and RED; Evocative Knowledge Objects"
  home: characters/rich-gold/

