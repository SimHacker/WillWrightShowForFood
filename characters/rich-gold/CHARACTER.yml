    path: ../terry-winograd/media/cs547-archive.yml
  the_plenitude: "The Plenitude: Creativity, Innovation, and Making Stuff, MIT Press, 2007 -- assembled by his family after his death"
  papers: "Rich Gold papers, circa 1978-2005, including 114 notebooks -- https://oac.cdlib.org/findaid/ark:/13030/c81v5m8c/"

