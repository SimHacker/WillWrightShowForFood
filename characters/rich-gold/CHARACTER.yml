memorial:
  mode: represent_and_discuss
  the_tribute_is_the_work: "Reading a real 1985 person off a real floppy and giving him somewhere to live is the tribute. Not a retrospective panel."
  who_can_discuss:
    - { who: david-crane, why: "Co-creator. Took Gold's passive concept and made it interactive, over Gold's objection -- the disagreement is the interesting part", path: ../david-crane/ }
    - { who: will-wright, why: "Cites LCP as an ancestor of The Sims, and is documented as having received feedback on The Sims from Gold", path: ../will-wright/ }
    - { who: mark-weiser, why: "PARC ubicomp and the calm-technology circle Gold was part of", path: ../mark-weiser/legacy.yml }
    - { who: terry-winograd, why: "CS547 holds Gold's 2002-10-11 talk on VHS -- see artifacts below", path: ../terry-winograd/media/cs547-archive.yml }
    - { who: ellpeck, why: "Tiny Life is where the little computer person finally gets neighbours", path: ../ellpeck/ }
  not_yet_approached:
    - { who: "Marina LaPalma", relation: "Widow and artistic collaborator; with the family, published The Plenitude posthumously", status: "Don's call, Don's wording -- nothing drafted, nothing sent" }
    - { who: "Sam Nelson", relation: "Activision producer whose LCP apartment-complex sequel was prototyped and dropped", status: "No contact route identified" }

bio:
  summary: |
    Artist, composer, cartoonist, inventor and researcher. Co-founded the League of Automatic Music
    Composers in the 1970s, the first network computer band. Directed sound and music at Sega, then
    conceived the Pet Person program that became Little Computer People (Activision, 1985) -- the
    first commercially available autonomous computer person. Ran electronic-toy research at Mattel
    and managed the PowerGlove. At Xerox PARC from 1991 he researched ubiquitous computing, founded
    the PARC Artist-in-Residence program (PAIR), and created RED, whose Experiments in the Future of
    Reading showed at the San Jose Tech Museum in 2000.

the_design_argument_worth_preserving:
  golds_position: "A pet person is a fishbowl. You watch; you do not poke. Interactivity was contrary to the Pet Rock premise the whole thing rested on."
  cranes_position: "It needed to respond to you, and he rewrote about half the program to make it do that."
  why_it_matters_now: |
    Both positions shipped: LCP is watched more than played, and The Sims is played. Ambient
    companion versus operable simulation is the live question in every agent design today, and these
    two had it out over one house in 1985.

artifacts_and_leads:
