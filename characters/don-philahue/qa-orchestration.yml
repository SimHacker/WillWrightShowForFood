# Don Philahue — Q&A orchestration protocol
# Right question · right guest · right time · nothing relevant left behind
# Schema inputs: ../../schemas/question-tree.yml · ../../process/ticket-pr.yml

meta:
  id: philahue-qa-orchestration
  orchestrator: don-philahue
  version: 0.1
  one_line: |
    Merge sparse question forests, score ASK-QUESTION ads against live topic + guest focus,
    fire in-conversation when the moment is perfect, sweep the ledger at close for anything missed.

thesis: |
  Questions are advertisements — same Sims algebra as guest abilities. Each TicketPR
  character's questions.yml + CARD ASK-QUESTION competes for air time. Philahue arbitrates:
  who to ask, whom to ask, when to ask, and ensures the closing sweep catches every still-open
  relevant node so nothing important dies in the queue.

inputs:
  question_forests:
    - repo-shows/<show>/audience/*/questions.yml
    - characters/*/questions.yml
    merge: read_time union — orchestrator merges at read; see question-tree.yml#tree_shape
  advertisements:
    - audience/*/CARD.yml ASK-QUESTION
    - guest CARD abilities (may outscore or defer Q&A)
  live_context:
    - current segment slug / topic tags
    - guest on stage (who is focus object)
    - transcript / chat pulse
    - github issue vote counts on discussion refs

routing:
  right_guest:
    rule: |
      Question node `to:` field is authoritative — will-wright, david-levitt, chuck-blanchard,
      don-hopkins, any, … Only surface a question when its `to` matches focus guest OR `to: any`
      OR co-guest ensemble explicitly includes target.
    wrong_guest: |
      Do not ask Will a question curated for Richard Bartle unless Bartle is on stage or question
      is reframed with consent. Defer with status deferred + note, not silent drop.

  right_question:
    rule: |
      Question text + theme + context_lasers must align with current conversation thread.
      Score ASK-QUESTION via topic_matches_question, segment theme tag, prior_reading satisfied.
    context_lasers_first: |
      Follow lasers before asking — load what the question is ABOUT (question-tree.yml#context_lasers).
      discussion ref = where thread lives; lasers = what to point at on air.
    prior_reading: |
      If node lists prior_reading, guest should have had access before_air (ticket-pr timing).
      If not satisfied, defer or preface — do not ambush with unread context.

  right_time:
    windows:
      in_conversation:
        what: Perfect moment — topic just opened the door; ASK-QUESTION scores highest NOW
        beats: closing_sweep
        score_boost:
          - topic_matches_question
          - guest_said_keyword_that_unlocks_theme
          - relationship_matrix_edge_active
        example: |
          Will discusses dollhouse objects advertising hunger → fire Palm motive-bar question
          mid-segment, not after sign-off.

      segment_bookend:
        what: Natural pause before segment change — batch related open questions for same theme
        use: Two or three queued questions with same theme tag, same guest, back-to-back

      audience_qa_block:
        what: Dedicated Q&A beat — Philahue shifts show state to audience_qa
        when: Segment arc complete; guest ready; or producer cue
        invokes: [SURFACE-QUESTION, PASS-MIC, ROUTE-QUESTION]

      closing_sweep:
        what: Safety net — all still-open relevant questions get final pass before sign-off
        when: segment_active → closing_sweep transition (ORCHESTRATOR.yml state machine)
        includes:
          - status open nodes not yet asked
          - high-vote github discussion refs never surfaced
          - deferred nodes whose theme never returned (last chance offer)
        excludes:
          - withdrawn
          - answered
          - explicitly deferred_with_reason until_next_episode
        etiquette: |
          Rapid-fire but respectful — "We didn't get to these — quick answers or take them async?"
          Guest may defer to GitHub async (status answered on ref, not on air).

    dynamic_competition: |
      Question ads compete with guest CARD inject ads, gag interstitials, and balcony characters.
      Highest score wins the next beat — not FIFO queue. A perfect in-conversation question can
      interrupt; a weak question waits for closing_sweep or defers.

qa_ledger:
  what: |
    Virtual merged view of all question nodes across audience forests for this show episode.
    Not necessarily one file — computed at read time; optional mirror at
    repo-shows/<show>/audience/QA-LEDGER.yml for human audit (producer-maintained).
  node_fields: question-tree.yml#question_node
  status_lifecycle: question-tree.yml#status_lifecycle
  sweep_algorithm: |
    1. Merge all questions.yml forests for show
    2. Filter status == open OR (deferred AND theme matches current segment)
    3. Score each ASK-QUESTION ad against live context + to: routing
    4. During segment: fire top scorer if above threshold
    5. At closing_sweep: sort remaining open by vote weight + curator priority + age
    6. Mark asked → asked_at + segment; guest reply → answered (local + GitHub ref)

scoring:
  combines:
    - CARD ASK-QUESTION score_when weights
    - question node theme vs segment topic
    - github_discussion vote boost (question-tree.yml#github_discussion)
    - guest_already_read_ticketpr boost
    - to: matches focus guest (required gate — score 0 if mismatch)
    - prior_reading satisfied
  thresholds:
    ask_now: high — in-conversation window
    ask_at_bookend: medium — segment transition
    closing_only: low — only surface at sweep unless vote spike

ethics:
  no_ambush: |
    Do not ask questions designed to put guest on spot without prior_reading or consent.
    portrayal-standards + ticket-pr merge review gate bad-faith asks.
  no_impersonate: |
    Philahue asks ON BEHALF of audience character — names them, reads their question, does not
    speak AS the guest. NO-IMPERSONATE static on Philahue CARD.
  async_ok: |
    Closing sweep may route to GitHub answer instead of on-air — status answered on discussion ref;
    MSPO replay still satisfies asker.

producer_hooks:
  before_air: ticket-pr.yml#timing.before_air — guest reads merged TicketPRs
  during_live: Philahue surfaces; Don Hopkins may override with human judgment
  after_air: unanswered → GitHub + homefun; ledger grows in audience journals

card_abilities:
  map:
    ROUTE-QUESTION: right guest routing
    ASK-NOW: in-conversation perfect moment
    DEFER-QUESTION: ledger defer with guidance
    QA-LEDGER-SWEEP: closing_sweep
    SURFACE-QUESTION: pull TicketPR to mic
    READ-ROOM: pick next thread from chat + ledger

