bio:
  summary: |
    **Ronald J. Reisman** (Ron Reisman; d. **7 November 2019**, pancreatic cancer) — computer engineer
    at **NASA Ames Research Center** on **air traffic management** and **flight safety**. BA Philosophy &
    Classical Greek (Dickinson); MS Computer Science (Miami). Joined Ames **1988** on the original
    **Center TRACON Automation System (CTAS)** team; later **traffic flow management** and **NextGen**
    research (**TFAS**). Patents on automated traffic management and surface-traffic advisories. Also:
    **Convolvotron** 3D audio at Ames (used in **Body Electric** VR simulations), **flight simulation**
    art, **Dolphin Research Center** research (Apple ][ talking to dolphins), and **AR tower** tools
    built on live CTAS feeds. **Don Hopkins's late friend** — Don toured Ames simulators and ATC labs
    after Ron's 1989 USEnix talk; has publicly defended Ron's legacy against glib FAA-bashing on
    Hacker News.

  don_on_ron: |
    After the 1989 USEnix Monterey Graphics Conference Ron gave Don a tour of NASA Ames flight
    simulators and air-traffic systems. Don's 2023 HN thread on the FAA NOTAM outage memorialized Ron:
    hiring **PATCO controllers Reagan fired**, teaching them to program, and the line that safety-critical
    ATM is not a web app — insulting Ron's memory to preach 'move fast and break things' when lives are
    at stake.

