bio:
  summary: |
    **Bill Joy** co-founded **Sun Microsystems** (1982), shaped **Berkeley Unix** and **vi**,
    and formulated **Joy's law**: peak computer speed ≈ **2^(Year−1984) MIPS**. He later joined
    **Kleiner Perkins** as a venture partner. Don Hopkins knew him from the **NeWS / Sun** era
    and from a legendary **Educom 1988** demo (pie menus, HyperTIES, Emacs — story in
    [quotes.md](quotes.md)).

why_a_dream_guest:
  joys_law: "Moore's law with a Unix beard — the 2^(year−1984) formula is a perfect Repo Show abacus."
  open_systems: "1991 Sun talk on open systems, innovation, and C++++-= — still reads fresh."
  pie_menus: "He reached out in 2006 because he remembered pie menus — UI that scales with human attention."
  micropolis: "Encouraged open-sourcing SimCity for OLPC — 'perhaps inspire another Will.'"
  sun_lineage: "NeWS, PSIBER, Java's Oak era — connects Will, Gosling, Ungar, and the whole microworld stack."

