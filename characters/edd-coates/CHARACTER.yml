bio:
  summary: |
    **Edd Coates** — UK UI artist / UX designer and toolmaker; creator of the
    **[Game UI Database](https://www.gameuidatabase.com/)** (Guinness World Record Nov 2022:
    42,706 screens / 1,013 games; archive continued growing; GUIDB 2.0 Aug 2024). Creator of
    **[PadCrafter](https://www.padcrafter.com/)** (control-scheme builder). Author of
    ***The Game UI Bible*** (500+ pages, Lost in Cult; announcement pending). Pocket Gamer
    Best Tools Provider 2021; Game Dev Heroes — Game Design Hero 2021. Portfolio / credits
    include Loco Motive, Prison Architect 2 (Double Eleven), Golf With Your Friends 2
    (Radical Forge), and others on eddcoatesdesign.com. **Friend of Don Hopkins.**

