privacy:
  rule: |
    Portray the published work under the name he publishes under. No research or
    speculation about legal identity, location, employer, or photographs.
  format_note: |
    Written answers, audio-only, or altered voice are first-class formats here, not
    accommodations. No camera required, ever. A written exchange conducted entirely in
    a repo — issues, PRs, review comments — is a completely acceptable "show" and may
    suit this guest better than a call.

scope:
  subject: "His published interface and design work."
  rule: |
    Portray the work. Nothing about his conduct, disputes, or personal
    characteristics belongs here — ours or anyone else's. If he wants to widen the
    subject, that is his to do.

invitation:
  status: draft
  consent: not_yet_asked
  document: invitation.md
  show_seed: null
  design_pack: https://github.com/SimHacker/moollm/tree/main/designs/webtop
  paired_guest: gwern
  note: |
    Invited in his own right, not as an appendage to the gwern invitation. Separate
    document, separate hooks, addressed to the interface work. Both invitations carry
    the same credit line and both refuse to divide the design between the two of them.
    Declared as a dependency in ../gwern/CHARACTER.yml before this directory existed.

bio:
  summary: >
    Said Achmiz is an interface designer and implementor. The site's own design page
    credits him with much of gwern.net's design and JavaScript/CSS from 2017 onward,
    including sidenotes.js and image-focus.js and — with Shawn Presser — the
    generalized popup system. He designed the themes and wrote much of the frontend
    JavaScript for GreaterWrong, an alternate reader for LessWrong and the EA Forum
    built by clone of saturn, and authored its 2018 feature releases: appearance
    customization, the theme tweaker, accesskeys throughout, adjustable text size,
    improved mobile layout. He publishes at wiki.obormot.net and hosts a mirror of
    gwern.net at gwern.obormot.net.

why_here: >
  Don's MOOLLM webtop inherits from gwern.net by name, and the specific thing it
  inherits is a frontend architecture decision: pinning a popup sets a flag on the same
  window object rather than rewrapping or reparenting it. Don read the source and
  recognized his own TNT OPEN LOOK pin-up menus, where menu frames subclass window
  frames and promotion is a flag. Two lineages, decades apart, same answer. That is a
  conversation between implementors, and it is not the same conversation as the one
  about writing.

craft_notes:
  the_pin_test: >
    The convergence Don found by reading the code rather than the docs. Promotion as a
    class flag on one window object is exactly the TNT OPEN LOOK architecture, and the
    opposite of the olwm/ICCCM rewrap dance that X11 forced on a separate-process window
    manager with no shared class hierarchy. Same constraint, same solution, no contact.
  reader_controlled_presentation: >
    GreaterWrong's theme tweaker lets the reader invert colors, and adjust brightness,
    contrast, saturation and hue, on any of nine themes, on mobile as well as desktop.
    That is reader control over presentation shipped years ago, and it is the
    presentation-layer sibling of the Know Knob — the same move applied to epistemic
    state instead of color.
  keyboard_as_invariant: >
    Accesskeys across GreaterWrong, all listed on its About page; a published keyboard
    chord table for gwern.net's popups. The webtop's TREE-NAVIGATION invariant — every
    structural operation reachable by keyboard, pie menu, and drag, all dispatching one
    named command — is the same discipline stated as a lint.
  argues_back: >
    Documented publicly: he told gwern the font could not go a touch bigger because of
    fractional sizes and rounding, and has repeatedly told him there are not enough
    pixels to lower the sidenote breakpoint. Gwern calls it an argument he has had
    several times. Useful to know before asking him to review a design.

credit_discipline:
  line: >
    Inspired by the publishing and hypertext system developed by Gwern Branwen and Said
    Achmiz at gwern.net.
  rule: |
    Carry it in both directories, identically. Do not use "frontend by" — gwern's own
    word for the relationship is "tech co-creator". Do not attempt to attribute
    individual ideas to one or the other; the public record does not support it and
    guessing is the specific rudeness this directory was built to avoid.
  receipts: sources/gwern-net-credits.md

