# Richard Bartle — Essex assignment bloopers (Facebook, Jul 2026)
# Public post + Don Hopkins replies. Anonymised student work; Bartle's own framing.

source:
  platform: Facebook
  author: Richard A. Bartle
  captured: 2026-07-08
  context: |
    Bartle marks game-design student work at University of Essex. He keeps a running list of
    bizarre lines from assignments and exams — attributed to students or ChatGPT. He only
    publishes after students' tenure ends, waits an extra year in case of resits, and
    anonymises so he cannot know who failed. This batch: cohort who finished last academic
    year. A larger set for students graduating this year stays private until next year.

publication_policy:
  wait: "Until tenure ends + one year (resit buffer)"
  anonymised: true
  attribution: "students and/or ChatGPT — Bartle does not distinguish in the post"

don_hopkins_replies:
  - on_quote: "This component has the power to build suspense and engorges players to interact"
    text: "+4 Stamina Fleshlight of Holding"
    approx_when: "2026-07-08 (~1m after post)"
  - on_quote: "The face of humanity hangs in the balance"
    text: |
      Is that what the face eating leopards are doing with them before eating: weighing them
      out? Is there a butcher for face eating leopards who sells them by the pound?
    edited: true
    approx_when: "2026-07-08 (~3m after post)"

other_comments:
  - author: Max Brandon
    text: "Very well observed professor... Most of the above referred narrations sound funny!"
    approx_when: "2026-07-08 (~1h after post)"

