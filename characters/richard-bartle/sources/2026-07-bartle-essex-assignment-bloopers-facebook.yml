show_hooks:
  educators_track: |
    Same Bartle who assigns critical MUD2 play — now marking Essex submissions and cataloguing
    ChatGPT-era prose. Segment: assignable games vs unassignable slop; what a repo-show rubric
    would look like.
  will_bartle_bridge: |
    Will cites Bartle types on Dev Diaries; Bartle publishes what happens when types meet
    autocomplete — Achievers write "whip out the entire group," Explorers get ladyrinths.
  don_beat: |
    Don's Facebook replies on Bartle's thread — warm public voice before formal invite; D&D
    item joke on "engorges players"; face-eating-leopard callback (political meme → game copy).

