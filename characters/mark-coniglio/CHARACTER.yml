bio:
  summary: >
    **Mark Coniglio** — composer, media artist, and programmer; co-founder of the dance-and-technology
    company **Troika Ranch**. As a CalArts composition student he hardcoded interactive ideas for
    **Morton Subotnick** that grew into **Interactor** (used in Subotnick's 1987 *Hungers*), and later
    created **Isadora**, the real-time interactive media/video environment widely used in live
    performance. Coniglio is also a key *historian* of the patch-cord lineage: he documents **David
    Levitt's Hookup** (MIT) as the first "patch-cord" visual language — the metaphor **Max** and
    **Isadora** both inherit.

what_he_said:
  hookup_first_patchcord: "Coniglio credits David Levitt's Hookup as the first 'patch-cord' visual language — the shared ancestor of Max and Isadora."
  timeline: >
    1986 — Morton Subotnick used Hookup at MIT; Coniglio hardcoded Mort's ideas → Interactor (1987,
    *Hungers*). 1996 — a Troika Ranch STEIM residency, where he saw Image/ine → Isadora grew out of
    Interactor.
  isadora_vs_max: "Both inherit the patch-cord metaphor from Hookup, but Isadora shows parameter names/values plus real-time graphic feedback per module."
  source: "http://www.sdela.dds.nl/sfd/isadora.html"

connections:
  hookup_david_levitt: "Documents Hookup (David Levitt) as the patch-cord origin — the through-line of this repo's visual-programming trail."
  steim_imageine: "1996 STEIM residency; saw Image/ine (Tom Demeyer + Steina Vasulka) — real-time video lineage into Isadora."
  patch_cord_family: "Isadora ↔ Max ↔ Pure Data (Miller Puckette) ↔ Bounce/Body Electric — the dataflow patch-cord family."

