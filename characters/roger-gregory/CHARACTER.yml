bio:
  summary: >
    **Roger Everett Gregory** — one of the people who actually had to build Xanadu. Mathematics at
    the University of Michigan; founded the **Ann Arbor Computer Club** in the 1970s. Met Ted Nelson
    in 1974, and in 1979 joined him for the **Swarthmore Summer** with Stuart Greene and Mark Miller,
    where he and Miller designed **tumblers** — transfinite-number addresses that can name any range
    inside any version of any document, the mechanism underneath Xanadu's whole claim about quoting.
    Moved to Sausalito in 1988 when **Autodesk** bought a controlling interest, and led the
    implementation there; later founder, CEO, CTO and chairman of the **Xanadu Operating Company**.
    Also co-designer of a rotary rocket engine based on Robert Goddard's posthumous patents
    (US 6,212,876, 2001), and a cofounder of Eyegorithm.

why_him:
  the_gap: |
    Three widely read post-mortems of Xanadu are on the table — Gwern's essay, Ben Shneiderman's
    assessment of Computer Lib, and Don's own 1999 review of the Udanax release — and all three are
    written from outside the implementation. Roger is the person who can say which parts of the
    machinery actually existed, in which language, in which year, and what the constraints were.
  what_only_he_can_settle:
    - "What the C and Rust ports are: which Smalltalk tree they came from, what turned it into them, and what byte-identical output was measured against."
    - "The Green / Xu88 versus Gold lineage, and who wrote which — Ted has corrected Don's account in public, and Roger is the primary source."
    - "What Don was shown at the Xanadu offices: a Smalltalk system, per Don's memory, distinct from the 1980s MIT AI Lab demo on an Ann Arbor Ambassador."
    - "What the 1999 release could legally and organizationally contain, and why the readable sources were not in it."
    - "Whether Xanadu was ever used to document its own source code — Don's 1999 question, quoted by Gwern in 2025, still unanswered."

