bio:
  summary: |
    **John von Neumann** (1903-1957) named the architecture every computer uses, then designed
    a decidedly non-von Neumann one for his last great work: a 29 state cellular automaton
    hosting a **universal constructor** that prints a powered-down copy of itself, injects its
    program through an umbilical cord, and boots its child with a reset pulse -- designed
    entirely on paper. He theorized **three universal constructors at three levels of
    reality**: deterministic mathematical (the CA), physical mechanical (the kinematic model;
    ancestor of von Neumann probes and gray goo), and probabilistic quantum mechanical
    (mutating, evolving machines -- unfinished at his death). Also: QM foundations, game
    theory, EDVAC report, Monte Carlo, numerical weather prediction.

