bio:
  summary: >
    Kaleida Labs engineer on the ScriptX object system; later Danger,
    then Google, where he created the Dalvik VM that Android shipped
    on. Keeps milk.com and its Wall o' Shame.

connections:
  don-hopkins: "Fellow Kaleidan — worked together in the ScriptX era; in touch since"
  david-ungar: >
    Don recalls Dan at the Conscientious Objectors meetup (ScriptX
    object-system team × Self team, Kaleida, early 1990s) —
    unconfirmed, ask both.

recollections:
  # Don's memories, marked as such — ask Dan to refresh them, if he remembers
  scriptx_multiple_dispatch: >
    Don recalls ScriptX supported CLOS-like multiple dispatch, which
    Dan implemented: single-dispatch syntax already annotated the
    first parameter with its class when defining a method outside
    the class, and multiple dispatch was just annotating subsequent
    parameters. Don discussed it with Dan at the time; shipping
    status uncertain ("I think so").
  scriptx_scheme_surface: >
    Don recalls Dan implemented a Scheme-like syntactic surface for
    ScriptX — straightforward because the language was layered.

