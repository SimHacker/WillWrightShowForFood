bio:
  summary: |
    **Kim Cascone** — electronic composer and founder of **Silent Records** (1986),
    a defining U.S. ambient / experimental label (PGR, Heavenly Music Corporation,
    and many others). Berklee / New School trained; assistant music editor on David
    Lynch's *Twin Peaks* and *Wild at Heart* before leaving film for the label.
    Author of the widely cited Computer Music Journal essay **"The Aesthetics of
    Failure: 'Post-Digital' Tendencies in Contemporary Computer Music"** (2000) —
    glitches, bugs, and system noise as intentional material. Later anechoic /
    microsound work, drone cinema, lectures at Tate Modern and elsewhere.

