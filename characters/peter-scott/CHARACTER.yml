bio:
  summary: |
    **Peter Scott** — Acorn legend who wrote original Electron/BBC games (Thunderstruck,
    Ransack, Pandemonium, the Peter Scott Trilogy) and became Superior Software's conversion
    specialist under the pseudonym **Dylan** after leaving Audiogenic. His **SimCity** port
    (~1989, ~9–12 months) is the show's anchor: he squeezed Will Wright's simulation into
    **~20K** on the BBC Micro, spoke with the original developer by phone, received Infogrames'
    full algorithm dump, and deliberately softened American tax politics for European players.
    Predator sold best; SimCity sold steady for years and is what he points to with pride.

simcity_bbc:
  publisher: Superior Software (UK); Infogrames (European rights)
  memory: "~20K BBC Micro — entire game 'a tenth of a Mac icon' in his telling"
  duration: "~9–12 months development; last major BBC game he shipped"
  source_material: "Box files, algorithms, drawings from Infogrames; Amiga + C64 references"
  phone_call: |
    Called original developer Will Wright: 'BBC Micro has 20K.' Wright: 'Seriously?' Scott:
    promised not to write a cut-down C64-style port.
  design_tweaks: |
    Adjusted tax/service assumptions so low-tax and high-tax strategies could both succeed;
    noted American default bias in original model.
  technical: |
    Mostly 6502 assembly with BBC BASIC core for menus/high scores; screen blanked for
    year-end calculations; multi-load on disk.
  reception: "Good reviews; long-tail royalties; Richard Hanson (Superior) praised conversion quality"

career_arc:
  early: "ZX81 1982; magazine type-ins; Electron then BBC; Gary Partis schoolmate"
  audiogenic: "Peter Scott Trilogy; Thunderstruck; exclusive ~20-year contract (signed young)"
  superior_dylan: "Spycat, Barbarian, Last Ninja 1&2, SimCity, Hostages — pseudonym for contract gap"
  tv: "Gamesmaster researcher → producer; Games World; Live TV 'head of stupid ideas'; Channel 4 animation studio (~100 staff); now freelance + planned YouTube channel"

design_philosophy:
  fair_play: "Games playable by average buyers — not curry-eating difficulty contests"
  electron_first: "Letterbox screen trick doubled working memory; Electron + BBC from one design"
  title_first: "Needs catchy title page before code — same brain as TV pitch names (Propportunities, sid.com)"
  reuse: "Sprite/screen routines recycled across games; screen compression (32 bytes per full screen in Ransack)"

