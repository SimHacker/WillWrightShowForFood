    - ../alan-kay/correspondence.yml  # transcript review
    - ../alan-kay/media/from-mail/REVIEW.yml  # yoot-transcript-review thread
  yoot_interview:
    transcript: https://github.com/YootTowerManagement/YootTower/tree/main/Yoot_Saito_Alan_Kay_Interview
    people_md: https://github.com/YootTowerManagement/YootTower/blob/main/Yoot_Saito_Alan_Kay_Interview/People.md#yutaka-yoot-saito

