# What Alan Kay says about Yoot Saito — public sources only

character: yoot-saito
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Yoot personally interviewed Alan Kay in Japan (~1993) for the 25th anniversary of Engelbart's 1968 demo.
    Don OCR-restored the transcript; **Alan reviewed names, timeline, and corrections** (including People.md
    entries for PARC figures). Alan's feedback improved the published companion in YootTower.

