bio:
  summary: |
    **Subutai Ahmad** — Chief Scientist at **Numenta** and an initiator of the **Thousand Brains
    Project** (neuroscience-based AI: cortical columns, reference frames, **sparse distributed
    representations**, active dendrites). Before the brain work he was a **real-time computer-vision**
    researcher: **Interval Research** (1993–97 — one of the first DVRs / TV-news indexing, foundational
    CV, patents), then co-founded **ePlanet** (1997–99, an Interval spin-off) which shipped the first
    consumer computer-vision product — the **IntelPlay Me2Cam** (Mattel & Intel, 1999): real-time
    body/head/arm tracking + a **"Virtual Blue Screen"** background-removal effect on a plain USB webcam.
    Then co-founded **YesVideo** (1999–2005, automated DVD authoring / scene detection). Cornell BS;
    UIUC MS/PhD (PhD research at UC Berkeley's ICSI). Advisors: **Gerald Tesauro** (TD-Gammon) and
    **Steve Omohundro**.
  don_connection: |
    Don **helped Subutai with real-time video motion tracking + background removal on Windows** at
    Interval (late '90s), then went on to do **his own on the PowerPC Mac**. **Intel bought the Interval
    spin-off (ePlanet)** and turned the tech into a consumer **webcam with background removal** (the
    Me2Cam). Direct ancestor of the show's browser **video motion tracking** puppet input (Bounce /
    Faceball motion-drive lineage).
  will_connection: |
    Will Wright was **working with Subutai's AI company on Proxi** (Will's AI/memory project). FLAG:
    confirm the company (Numenta?) and the nature/dates of the collaboration before stating on air.

