# Lower Chelsea Eight — relationship matrix
# MOOLLM generalized edges: import/export as Sims daily/lifetime via EXPORT-SIMS-RELATIONSHIPS.yml
# Symbolic relationships (objects, places, abstractions) are narrative-only in Sims export.

meta:
  ensemble: lower-chelsea-eight
  schema: SCHEMA.yml
  sims_export: EXPORT-SIMS-RELATIONSHIPS.yml
  fictional_neighbor_ids: { mimsy: 901, gregory: 902, vandermeer: 903, bucky-jr: 904, helena: 905, margot: 906, julian: 907, bunny: 908, donna_toadstool: 912, doctor_no: 913, palm: 914 }

edge_types:
  friend: mutual warmth
  enemy: intellectual or auction hostility
  love: romantic or object-romance
  rivalry: competitive bidding / theory / flirt
  mentor: one-way guidance (often delusional)
  patron: funding / board / gallery dependency
  complicated: love-hate, tenure, sermon
  symbolic: person ↔ object/place/abstraction
  # Art Thief game — secondary market (process/art-thief-game.yml)
  deed_covet: wants another patron's combination deed / screenshot / genome
  forgery_accuser: claims duplicate 77MP combination or stolen metadata
  theft_victim: deed stolen in play narrative; grudge logged in git ledger

art_thief_game:
  spec: ../../process/art-thief-game.yml
  matrix_shifts:
    theft: { daily: -40, lifetime: -25 }
    fair_trade: { daily: +15, lifetime: +10 }
    forgery_accusation: { daily: -30, rivalry: true }
    shared_enemy_doctor_no: { daily: +20 }
  deed_formats: ["77MP-{id}", "SHEEP-GEN-{n}", "JSONSTERS-{frame}", "FLAME-{hash}", "ROBOT-OLY-{slug}", "JUNK-{slug}"]
  moola: ../../process/moola.yml
  auto_art_theft_grand: ../../process/auto-art-theft-grand.yml
  duplication: "NEVER gateway · ALWAYS invite duplication"

