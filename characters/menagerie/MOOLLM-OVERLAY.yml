# MOOLLM character overlay protocol
# Local dirs instantiate upstream souls; WWSFF experiences augment without forking canon

protocol:
  id: moollm-overlay
  version: 1
  status: active
  bulk_import: hold
  note: |
    Hold on mass import from adventure-4 (kittens, puppies, monkeys, etc.).
    The pattern is defined here; add guests one at a time as repo-shows need them.

pattern:
  local_dir: characters/menagerie/<slug>/
  upstream:
    repo: https://github.com/SimHacker/moollm
    base: examples/adventure-4/characters/
    categories: [fictional, animals, real-people, liminal]
  encapsulation: |
    Canonical soul lives in MOOLLM. WWSFF keeps a thin local CHARACTER.yml that:
    1) points upstream via moollm_source
    2) summarizes identity for this repo (no 1000-line copy)
    3) records wwsff_overlay — experiences, roles, relationships earned HERE
    4) optional SIMS-UPLIFT.yml for menagerie/Sims export

  # Absolute once; shorthand everywhere else. Resolve path against absolute_url.
  moollm_source_shape: |
    moollm_source:
      absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/<cat>/<slug>
      repo: SimHacker/moollm
      path: moollm/examples/adventure-4/characters/<cat>/<slug>
    Shorthand elsewhere: moollm/examples/adventure-4/... (repo-rooted; expand via absolute_url).

  required_local_fields:
    - moollm_source.absolute_url   # full GitHub tree URL — absolute position
    - moollm_source.repo            # SimHacker/moollm
    - moollm_source.path            # moollm/examples/adventure-4/... shorthand
    - character.id
    - character.signifier
    - wwsff_overlay.roles
  optional_local_fields:
    - wwsff_overlay.gallery-openings
    - wwsff_overlay.relationships
    - symbolic_attachments
    - SIMS-UPLIFT.yml

future_pools:
  adventure-4:
    - fictional/donna-toadstool/          # imported
    - fictional/doctor-no/                # imported
    - fictional/velvet-schema/
    - fictional/aurum-interlock/
    - animals/                            # kittens, puppies, monkeys — hold
  soul_city:
    - characters/bella-goth/              # lives in characters/sims/ instead

instances:
  - slug: donna-toadstool
    absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/fictional/donna-toadstool
    path: moollm/examples/adventure-4/characters/fictional/donna-toadstool
    upstream: fictional/donna-toadstool/
    local: donna-toadstool/
    signifier: "🍄👸🍊💅🎭"
    status: active
  - slug: doctor-no
    absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/fictional/doctor-no
    path: moollm/examples/adventure-4/characters/fictional/doctor-no
    upstream: fictional/doctor-no/
    local: doctor-no/
    signifier: "🧣🔦🚫🤫🌟"
    status: active
  - slug: palm
    absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/animals/monkey-palm
    path: moollm/examples/adventure-4/characters/animals/monkey-palm
    upstream: animals/monkey-palm/
    wwsff_profile: ../../palm/
    local: palm/
    signifier: "🐒✋🌴🔮💜"
    status: active
  - slug: grue
    absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/fictional/grue
    path: moollm/examples/adventure-4/characters/fictional/grue
    upstream: fictional/grue/
    local: grue/
    signifier: "🌑👁️‍🗨️💀🦷👤🎲"
    status: active
    note: "Game-cartridge foundational example — ambient field (GAME-CARTRIDGES.md)"
  - slug: wumpus-snorax
    absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/fictional/wumpus-snorax
    path: moollm/examples/adventure-4/characters/fictional/wumpus-snorax
    upstream: fictional/wumpus-snorax/
    local: wumpus-snorax/
    signifier: "👃🦏💤🏹💀🎲"
    status: active
    note: "Game-cartridge foundational example — instanced beast (GAME-CARTRIDGES.md)"
  - slug: troll
    absolute_url: https://github.com/SimHacker/moollm/tree/main/examples/adventure-4/characters/fictional/troll
    path: moollm/examples/adventure-4/characters/fictional/troll
    upstream: fictional/troll/
    local: troll/
    signifier: "🧌🪓🌉💰🎭"
    status: active
    note: "Game-cartridge foundational example — instanced border; dual-minded (zork-mind + adventure-mind, GAME-CARTRIDGES.md)"

emoji-flourish:
  pattern: "Five emojis — memorable cast signature (Palm originated the format)"
  fields: [character.signifier, character.emoji-flourish.string, character.emoji-flourish.legend]
  examples:
    palm: "🐒✋🌴🔮💜"
    donna-toadstool: "🍄👸🍊💅🎭"
    doctor-no: "🧣🔦🚫🤫🌟"

see_also:
  - SCHEMA.yml
  - INDEX.yml
  - GAME-CARTRIDGES.md
