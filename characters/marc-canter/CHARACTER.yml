bio:
  summary: |
    **Marc Canter** — co-founder of **MacroMind** (1984), the company behind **VideoWorks → Director**
    that became **Macromedia**; a founding figure of desktop **multimedia authoring**. Later a vocal
    advocate of the **open social web**: **Broadband Mechanics** and **People Aggregator** (an open
    social-networking platform / "digital lifestyle aggregator"). An exuberant, larger-than-life
    performer who relishes the spotlight.
  don_firsthand: |
    Don, **David Levitt**, and Marc go way back — friends and sometime colleagues (including **People
    Aggregator**, affectionately "**People Aggrivator**"), with a trove of outrageous stories, many from
    **Amsterdam**, where Marc loves to visit. Marc is **unabashed about singing and dancing in public**
    and being the center of attention — he even has an **animated reggae dancing cartoon character of
    himself**. He will LOVE the show's puppets; we'd love to give him some.
  known_for:
    - "MacroMind / Macromedia — Director (from VideoWorks); desktop multimedia authoring pioneer"
    - "People Aggregator + Broadband Mechanics — open social web / digital lifestyle aggregator"

why_a_guest:
  connective_tissue: |
    Marc is the **Macromedia/Director** node — the multimedia-authoring runtime the show's **Bounce** and
    **Macromedia Player (MMP)** thread grows out of — AND the open-social-web node (People Aggregator).
    Plus he's a natural performer who'll dive straight into the puppets.
  flags:
    - "Confirm specific dates/roles (MacroMind ~1984; Macromedia ~1992 merger) before stating on air."

