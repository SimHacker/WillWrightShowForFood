bio:
  summary: |
    **Alan Curtis Kay** (b. 1940) — computer scientist who led Smalltalk and overlapping-window
    personal computing at Xerox PARC, coined much of the popular vocabulary of
    **object-oriented** programming (later stressing that **messaging** was the big idea),
    and conceived the **Dynabook** as a computer for children of all ages. Utah PhD (1969);
    PARC Learning Research Group; Atari Chief Scientist (1981–1984); Apple Fellow; Disney /
    VPRI / Viewpoints. Constructionist ally of **Seymour Papert**; Turing Award 2003.
    Long correspondent of Don's (Qwaq 2008 → Fabrik/Ingalls → Yoot transcript → MOOLLM 2026).
    Lives in London with **Bonnie MacBird**. Widely attributed line: *"The best way to predict
    the future is to invent it."*

known_for:
