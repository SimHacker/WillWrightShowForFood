# Alan Kay × Don Hopkins — correspondence summary (public-safe)
# Tight public-safe digest of a real, long exchange. NOT the full private thread.
# Standards: ../../schemas/portrayal-standards.md

meta:
  with: alan-kay
  curated_by: don-hopkins
  consent: not_yet_asked
  span: "2008–2026"
  provenance_private: SimHacker/DonHopkins/characters/don-hopkins/correspondence/alan-kay.yml

gist: |
  Nearly two decades of wide-ranging exchange. Alan introduced Don to **Dan Ingalls** via the
  **Fabrik** paper (2018), recalling "swiped pie menus" used at Apple in the Fabrik project (~1986).
  Threads touched **PIXIE** light-pen menus, Smalltalk **halos** (Ted Kaehler, ~PARC), praise for
  **NeWS** ("the right way to go — except it missed the live system underneath") and **HyperCard**
  ("finished, smoothed, documented beautifully"), Alan's review of the **Yoot Saito 1993 interview**
  transcript, and Don's **MOOLLM** announcement (Jan 2026). Don visited **Qwaq** (the Croquet
  spinoff) with Randy Farmer and Chip Morningstar in 2008 at Alan's invitation.

  **PIXIE thread, July 2026** (Heinz Lemke, Roy Eagleson, Lars Brinkhoff, Will Wright cc'd):
  Alan recalled **Andrew Armit**'s months-long Utah visit (~1969) with his Coons-patch
  interactive system on a PDP-7 ("quite in awe"); noted he and **John Warnock** both took PhDs
  in the summer-'69 graduation. Asked about the **Wilkes–PARC connection** (2026-07-14), he
  mapped the whole lineage: the ARPA twenty-somethings' reverence for **Wilkes, Wheeler** and
  the **LEO** story; **Butler Lampson**'s Berkeley capability OS on the unprepared CDC 6400
  (capabilities invented by the **B5000** folks, "named and not done very well for Multics") as
  an influence on his thinking about OOP; **Roger Needham** (protection work with **Mike
  Schroeder**, Butler in the loop), **Don Davies**' independent packet-switching at NPL —
  "the first real Internet was the connection between NPLnet and ARPAnet"; love for
  **Strachey, Landin, Michie**; **Chuck Thacker** as Needham fan who later set up the
  Cambridge research lab; **Andrew Herbert** (Needham grad student, PARC resident, now
  director of TNMOC at Bletchley Park). Alan **donated his last Alto to TNMOC** for their
  planned exhibit next year. On London: he forwarded his public Quora answer — Bonnie
  MacBird's Holmes novels drew them there; "she has now published 6 highly rated and
  reviewed novels for Harper-Collins" → media/quora-recaps/why-alan-kay-moved-to-london.md

sourced_quotes:
  on_news: "I thought NeWS was 'the right way to go' (except it missed the live system underneath)."
  on_hypercard: "HyperCard is an especially good example of a system that was finished and smoothed and documented beautifully."
  on_fabrik: "I recall 'swiped pie menus' being used at Apple in the mid-80s in the Fabrik visual language project."

