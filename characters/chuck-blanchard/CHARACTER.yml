bio:
  summary: >
    **Chuck Blanchard** — the **lead designer/programmer of Body Electric** at **VPL Research**, the
    real-time visual-programming language for VR, music, and hardware that Jaron Lanier's VPL used to
    build virtual worlds and instruments, and the direct ancestor of David Levitt's **Bounce**. Per
    Jaron's own 1999 email to Don, Chuck's authorship "wasn't credited… when David brought the program
    to Interval," and his name "was reduced in stature." This repo credits him plainly: Body Electric's
    tools — including the Swivel 3D transform-tree editor built into the environment — were Chuck's work.

