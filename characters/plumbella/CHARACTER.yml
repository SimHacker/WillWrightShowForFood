bio:
  summary: |
    **Jesse McNamara** (**Plumbella**) is one of The Sims 4's best-known UK creators — history,
    commentary, and advocacy with a large YouTube following. In **October 2025** she was among the
    first high-profile resignations from the **EA Creator Network** after EA's reported ~$55B
    acquisition involving Saudi Arabia's Public Investment Fund. Public posts: asked to leave the
    network; will not buy or make content around future releases; values at odds with new ownership.

  tiny_life: |
    Quoted on [Tiny Life's Praise page](https://tinylifegame.com/): "I had a really great time
    playing with this. This very much makes me feel the way that The Sims 1 did." — indie sim
    solidarity thread with Ell (Ellpeck) and Legacy Collection Exchange gap.

ea_creator_network_exit:
  timing: "Oct 2025 (verify exact post date before on-air)"
  reported_actions:
    - Left EA Creator Network
    - Will not buy or showcase future EA Sims releases
  public_framing: |
    Acknowledged privilege to leave easily; won't judge creators who stay; hopes sale falls through
    or remaining creators pressure EA on inclusivity (NME/IGN paraphrase — verify quote)

