bio:
  summary: >
    **Coco Conn** — a beloved figure in the computer-graphics community, associated with the
    **SIGKIDS / SIGGRAPH kids' programs** (where children — not allowed on the main show floor — got
    to see and make cool things) and with early collaborative virtual-world-for-kids projects
    (**CitySpace**). Don met her at SIGGRAPH's SIGKids area — the serendipitous spot where he ran into
    **[David Levitt](../david-levitt/)** demoing Bounce's animated band. *(Don's affectionate framing:
    "royalty and a goddess.")*

