bio: |
  **Coco Conn** (with **Peter Conn** and in-house programmer **Paul Rother**) co-ran **HOMER & Assoc.**
  at **Sunset Gower Studios** (1977–1997) — music videos, commercials, and film FX. **HOMER** (Hybrid
  Optical Montage Electronically Reproduced) was a **real-time visual mixing console** built 1978–1981;
  Coco helped **solder LEDs** and **run cables**. They **hired Forth, Inc.** and **Charles Moore**
  programmed the host; **PolyForth** ran in **32K** on the master **Z80** with **24 channel Z80s**.
  Public credits include **George Clinton — Atomic Dog**, **Steve Miller — Abracadabra / Bongo Bongo**,
  **RoboCop** (1986), **Total Recall** x-ray (1989), and ***Flying Logos*** (SIGGRAPH **1989**
  Electronic Theater). Later: **SIGGRAPH SIGKids** (where Don met **[David Levitt](../david-levitt/)**
  demoing **Bounce**) and **CitySpace** collaborative virtual worlds for kids (details to confirm).
  Don proposes a Repo Show segment watching **highlights from her Hackers Conference video tapes** —
  speakers and demos (**Scott Kim**, **Rudy Rucker**, others) with Coco narrating.

