bio:
  summary: |
    BS in computer science, Yale (1980). In the 1979 Xanadu summer at
    Swarthmore he and Stuart Greene developed General Enfilade Theory, and he
    was one of Xanadu's lead architects through the Udanax Green and Gold
    designs, including the Autodesk years (1988-92). Wrote the Agoric Open
    Systems papers with K. Eric Drexler (1988). Worked at Xerox PARC on
    concurrent logic programming, co-founded Agorics, designed E with
    colleagues from Electric Communities, led the Virus-Safe Computing
    Initiative at HP Labs, and was a research scientist at Google (2007-17),
    where he designed the JavaScript side of Caja and worked on ECMAScript in
    TC39: strict mode, Proxies, Promises and the foundations of SES. PhD, Johns
    Hopkins (2006), "Robust Composition", advised by Jonathan Shapiro. Chief
    Scientist at Agoric; Senior Fellow of the Foresight Institute.
  known_for:
    - "Object-capability security and the Principle of Least Authority"
    - "E (erights.org); promises derived from Joule's channels and the Udanax promise architecture"
    - "Agoric Open Systems, with K. Eric Drexler (1988)"
    - "Robust Composition (PhD thesis, 2006)"
    - "Caja; ECMAScript strict mode, Proxies, Promises; SES / Hardened JavaScript; Endo"
    - "Capability Myths Demolished (with Yee and Shapiro, 2003)"
    - "Miller columns (attributed; Wikipedia marks it citation needed)"

