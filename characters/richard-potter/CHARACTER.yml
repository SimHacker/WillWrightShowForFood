bio:
  summary: |
    At the University of Maryland's Human-Computer Interaction Lab, co-author
    with Linda Weldon and Ben Shneiderman of "Improving the accuracy of touch
    screens" (CHI '88), the take-off strategy. Developed Triggers, which drove
    Macintosh applications by recognizing patterns in screen pixels: "Guiding
    automation with pixels" (HCIL video report 1992; INTERCHI '93 video
    program), "Graphical macros" (HCIL 1994), and two chapters of Allen
    Cypher's Watch What I Do (1993), "Triggers: Guiding Automation with Pixels
    to Achieve Data Access" and "Just-in-Time Programming". PhD, University of
    Maryland (1999), "Pixel Data Access: Interprocess Communication in the User
    Interface for End-User Programming and Graphical Macros"; with Shneiderman
    and Ben Bederson, "Pixel Data Access for End-User Programming and Graphical
    Macros".
  known_for:
    - "Triggers: condition-action rules on screen pixels, driving any Mac application"
    - "Just-in-Time Programming: programming a task that is already in progress"
    - "The take-off touch-screen strategy (CHI '88)"

