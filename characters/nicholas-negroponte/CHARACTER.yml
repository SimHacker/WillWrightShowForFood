bio:
  summary: "**Nicholas Negroponte** (b. 1943) — architect by training who founded the **Architecture Machine Group** at MIT (1967), the human–machine-interface lab that grew into the **MIT Media Lab**, which he co-founded with Jerome Wiesner and directed from its 1985 opening. Wrote **Being Digital** (1995) — 'move bits, not atoms' — after years as the back-page columnist and first investor of **Wired**. Founded **One Laptop per Child** (2005), the $100-laptop project chaired with Walter Bender. Was **Margaret Minsky's PhD advisor** (per the HCI Museum's Sandpaper exhibit), and the man who gave Marvin Minsky, Seymour Papert, and Muriel Cooper the institutional roof the Media Lab became. Brother of diplomat John Negroponte."
  honest_note: "The 2019 MIT Media Lab / Jeffrey Epstein donations scandal is part of his public record: Negroponte said at a lab meeting he had advised taking Epstein's money and 'would do it again.' A portrayal that omits this would be gloss; a show that asked him about institutional ethics directly would be better than one that pretends."

connections:
  minsky: "Gave Marvin the Media Lab as institutional home (1985); founding-faculty relationship documented everywhere including Stewart Brand's The Media Lab (1987)"
  margaret: "Margaret Minsky's PhD advisor (MIT PhD 1995, haptics/Sandpaper — HCI Museum credits Negroponte as advisor)"
  walter_bender: "Longtime deputy; Bender succeeded him as Media Lab director and co-ran OLPC"
  machover: "Recruited/hosted Opera of the Future at the founding Media Lab"
  wired: "First investor + back-page columnist of Wired — the magazine that put the First Wired Family (the Minskys) on record"

