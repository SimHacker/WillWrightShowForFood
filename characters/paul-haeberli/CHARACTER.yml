bio:
  summary: |
    Computer graphics researcher at Silicon Graphics, February 1983 – August 1999 ("I did horribly
    unpleasant stuff for about 6 years. Then I got a research position where I could explore
    computer graphics full time."). Publisher of GRAFICA Obscura (1994→), the open web notebook of
    his unpublished SGI research. Since 2004: Lamina Design — fabricating precise free-form
    structures from planar material. Later iPhone/iPad apps (Explore 3D).
  greatest_hits:
    conman:
      what: "ConMan: A Visual Programming Language for Interactive Graphics — SIGGRAPH 1988"
      why: "Dataflow components connected live on an IRIS workstation; connection manager routes data"
      money_quote: "we replace the usual user-machine dialog with a dynamic live performance that is orchestrated by the user"
      paper: https://people.cs.vt.edu/~north/infoviz/conman.pdf
    accumulation_buffer:
      what: "The Accumulation Buffer: Hardware Support for High-Quality Rendering — SIGGRAPH 1990, with Kurt Akeley"
    paint_by_numbers:
      what: "Paint By Numbers: Abstract Image Representations — SIGGRAPH 1990"
    dynadraw:
      what: "DynaDraw (1989) — calligraphy with a physically modeled brush (mass, drag, spring)"
    texture_mapping:
      what: "Texture Mapping as a Fundamental Drawing Primitive — 1993, with Mark Segal"
    fast_shadows_siggraph_1992:
      what: "Fast Shadows and Lighting Effects Using Texture Mapping — SIGGRAPH 1992, with Mark Segal, Carl Korobkin, Jim Foran, et al."
      paper: https://dl.acm.org/doi/pdf/10.1145/133994.134071
      page_252: "Figure 3 hosts the non-distorted Skinnyhacking poster image (proceedings Easter egg)"
    skinnyhacking:
      what: "Skinnyhackers group lore — Tom Davis, Rocky Rhodes, Scott Carr; Paul was photographer for 'No Skinnyhacking' poster"
      showcase: "Showcase was best-known Skinnyhackers product; poster was first"
      in_repo: sources/skinnyhacking-siggraph-1992.md
    grafica_obscura:
      what: "GRAFICA Obscura — open research notebook, online since 1994"
      url: https://graficaobscura.com/
    lamina:
      what: "Lamina Design (2004→) — precise free-form structures from planar material"

don_thread:
  aug_2010: |
    Paul sent Don his iPad app Explore 3D; advised on OpenGL ES rendering for Don's cellular
    automata toy — fillRectangle() code in the email, 'draw everything and let the hardware
    cull' — and pointed at Jared Tarbell's levCAWorm for mapping CA onto 3D. On Don's animated
    text fountain: 'I want to resurrect that code someday. it would be F.U.N.'
  see: correspondence.yml

