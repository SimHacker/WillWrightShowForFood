bio:
  summary: "**Brad A. Myers** — CMU HCI professor; expert in **programming by demonstration (PBD)**; developed **Garnet** (pull constraints, KR frame system, CMU Common Lisp, CLX); Peridot, C32; *All the Widgets*; VPL taxonomy. Don worked in his lab (~1992–93). Warm email contact (2023). Invited to OpenLaszlo → Declare reunion as well as solo Garnet/PBD shows — get into what prototypes *are* with Ungar et al."

