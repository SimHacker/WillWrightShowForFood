bio:
  summary: |
    **Audrey Tang** — Taiwanese civic hacker and public technologist; core g0v
    contributor; pivotal digital-consensus work around the 2014 Sunflower Movement;
    Taiwan's first digital minister (and widely noted as the world's first openly
    non-binary cabinet minister); later cyber ambassador. Co-author of *Plurality*
    (with E. Glen Weyl and many collaborators) on collaborative technology and
    democracy. 2025 Right Livelihood laureate for advancing social use of digital
    technology. Public themes: radical transparency, prebunking, participatory
    platforms (vTaiwan, Join), broadband as human right, Mask Map / COVID civic tools.

