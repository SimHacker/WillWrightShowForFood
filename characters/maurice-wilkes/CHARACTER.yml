relationship:
  to_project: storyline_figure
  to_pixie: |
    Head of the Cambridge Mathematical Laboratory who, per Heinz Lemke's 1967 memoir, personally
    opened the door to PIXIE: received Heinz on Phil Cook's introduction, put him on the Wednesday
    lecture programme, then — invoking an old Cambridge statute — arranged his PhD despite no prior
    university and no funding. The lab he ran and the Titan he built are the ground PIXIE stood on.

bio:
  summary: |
    **Sir Maurice Vincent Wilkes** (1913–2010) led the design and construction of **EDSAC** (1949),
    the first practical stored-program computer to enter regular service; invented **microprogramming**
    (1951); published the first paper on **cache memory** (1965); co-authored the first textbook on
    programming (Wilkes, Wheeler & Gill, 1951, introducing program libraries and subroutines); and
    built the **Titan** (the Cambridge Atlas 2), host of one of the earliest time-sharing systems.
    He headed the Cambridge Mathematical Laboratory (later the Computer Laboratory) 1946–1980, and
    his group built the **Cambridge Ring**, an early high-speed local network. Turing Award 1967;
    FRS; knighted 2000.

