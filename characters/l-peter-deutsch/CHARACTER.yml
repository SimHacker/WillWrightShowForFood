bio:
  summary: |
    **L. Peter Deutsch** — UC Berkeley → Xerox PARC (1971–1986) with the Lampson/Thacker cohort.
    On Smalltalk: redesigned bytecode instruction set, rewrote the compiler, created ChangeList;
    principal designer of **PS** (PortableSmalltalk) — first modern on-the-fly-compiling VM — and
    **HPS** successor. Later **Ghostscript**. Yoot People.md is the interview companion blurb.

