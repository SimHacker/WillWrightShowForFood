bio:
  summary: |
    **L Peter Deutsch** (b. 1946, Boston) wrote **Basic PDP-1 LISP**, a Lisp 1.5 for the PDP-1 and
    one of the first interactive read-eval-print loops, finishing it in 1963 at 17. The March 1964
    document he wrote with Edmund C. Berkeley, *The LISP Implementation for the PDP-1 Computer*,
    carries the listing. On the PDP-1 he also wrote the first implementation of Calvin Mooers's
    **TRAC** (1964). At Berkeley (1964–67) he worked with **Butler Lampson** and **Chuck Thacker**
    on the **Berkeley Timesharing System** for the SDS 940, which went on to run Tymshare,
    Engelbart's NLS and Community Memory. His 1973 Berkeley PhD was the PIVOT program verifier.

    At **Xerox PARC** (1971–86) he worked on Interlisp and Smalltalk. He redesigned the Smalltalk
    bytecode set, rewrote the compiler, created the ChangeList, and was the principal designer of
    **PS**, the Smalltalk-80 implementation that translated bytecodes to native code on the fly,
    and its successor HPS (Yoot People.md). Gosling has credited that work as the inspiration for
    Java's JIT technology about fifteen years later. At **Sun** he set down the **Eight Fallacies
    of Distributed Computing**. He founded **Aladdin Enterprises**, wrote **Ghostscript**, the
    free PostScript and PDF interpreter, and wrote the zlib, DEFLATE and gzip RFCs (1950–1952).
    He coined the **Deutsch limit** on visual programming. ACM Fellow, 1994. Since 2009 he has
    studied and written music (M.A., CSU East Bay, 2011) and describes himself as a composer.
  known_for:
    - "Basic PDP-1 LISP (1963, age 17); the 1964 Deutsch & Berkeley document"
    - "TRAC's first implementation, on the PDP-1 (1964), with Calvin Mooers"
    - "Berkeley Timesharing System on the SDS 940, with Lampson and Thacker"
    - "Smalltalk bytecodes; PS and HPS, the dynamically translating Smalltalk-80 VMs"
    - "Interlisp; the Deutsch limit"
    - "The Eight Fallacies of Distributed Computing"
    - "Ghostscript and Aladdin Enterprises; RFCs 1950–1952"
    - "Composer"

connections:
  pdp1_lisp_in_the_cabinet: |
    The cabinet plans a PDP-1, with SIMH's `PDP1/` as oracle, whose showcase is Basic PDP-1 LISP.
    Each word in core gets source maps to its line in the 1964 listing, to rectangles on the scans
    of it, to the document's explanations, and to walkthroughs written since
    (packages/cabinet/TODO.md, "A PDP-1"; DESIGN.md, "Source maps as transclusion").
  postscript: |
    Don wrote PostScript for a living in NeWS, Sun's PostScript window system, and in HyperLook;
    Ghostscript is the other great PostScript interpreter of those years, and the free one.
  sun: "Both were at Sun in the NeWS years."
  vm_lineage: "PS's dynamic translation leads to Self, HotSpot and V8, the line David Ungar's Self carried on (../david-ungar/)."
  berkeley_parc_cohort: "Lampson, Thacker and Deutsch went from Berkeley Computer Corporation to PARC in January 1971."

