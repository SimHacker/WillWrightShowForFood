bio:
  summary: |
    Co-developed outSPOKEN for Windows, a screen reader, at Berkeley Systems
    (1994). At Sun Microsystems he was on the team that built the Java
    Accessibility API and implemented it in Swing, wrote the original Java
    Access Bridge for Windows, and as Accessibility Architect brought
    accessibility to the Unix and GNU/Linux desktop, largely through GNOME.
    Accessibility Principal at Oracle after it acquired Sun, and technical
    manager of the EU AEGIS project. Director of Accessibility for Amazon
    Devices (Lab126), where he led VoiceView, the screen reader for Fire TV,
    Fire tablets and Kindle. Represented Sun, Oracle and Amazon at the W3C.
  known_for:
    - "Java Accessibility API; Java Access Bridge"
    - "GNOME accessibility (AT-SPI)"
    - "VoiceView on Amazon devices"
    - "outSPOKEN for Windows (1994), with Ben Drees"

connections:
  aquery: >-
    Don first described aQuery, now Screen Angel, in an email to Peter Korn
    around 2013. Korn replied that it sounded "quite do-able" and that he had
    more to say by email. The thread is public in MicropolisCore
    (apps/screen-angel/sources/2013-email-thread.md).

