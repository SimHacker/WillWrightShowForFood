bio:
  summary: |
    **David A. Tristram** is a pioneer of **real-time graphics for live performance**. Don met Dave in
    the **mid–late 1980s** at the **USENIX Fifth Computer Graphics Workshop**, **Monterey** (16–17 Nov
    1989) — Dave presenting the **Panel Library**, Don presenting the **PSIBER Space Deck** (visual
    PostScript programming and debugger for **NeWS**). At **NASA Ames** Dave (with **Eric Raible**)
    had built that **3D GL user-interface toolkit** (beveled widgets in GL, some attached to animated
    3D objects) for interactive visualization. The toolkit became **Electropaint**'s **live performance
    console** (banks of bouncing sliders — value, min, max, speed, wrap — scrubbed in real time). Electropaint became the legendary **SGI/IRIX**
    screensaver/demo; extended versions powered **Raster Masters**, the 1990s **visual-music
    ensemble** Dave co-founded with **Creon Levit** and **Ron Fischer** — **Maggie Hoppe** (video
    switcher), **Johnathan Nelson** (sound) — **MIDI-reactive, multi-operator psychedelic graphics**
    on **Onyx** rigs at **Shoreline Amphitheatre**, on tour with the **Grateful Dead** (footage on
    *Infrared Roses*), and with **Herbie Hancock** and **Graham Nash** (*Wired*, 1994–1995). Shared
    **Panel Library + Electropaint source** freely — Dead-scene taping ethos applied to code.
    **NASA Ames → SGI → Adobe**; **Viviography** / **Tristram Visual** (Electropaint™). Still
    performing (2025): **Resolume Avenue**, **TouchDesigner**. At Adobe: interactive live-painting /
    filter R&D (Don beta-tested ~2022; **pre-release — public details withheld** until Dave clears).
    See [`sources/live-canvas-effects-stub.md`](sources/live-canvas-effects-stub.md).
    Generative influences he has
    cited publicly include CelLab, *Chaos*, reaction-diffusion, feedback, and Toffoli & **Norman
    Margolus**'s *Cellular Automata Machines*.
  known_for:
    - "USENIX Monterey 1989 — Panel Library paper; met Don Hopkins (PSIBER Space Deck) same workshop"
    - "Sent Don Panel Library + Electropaint SGI source — Don hacked tree-shaped s-expr viz at UMD"
    - "Panel Library + Panel Editor (Eric Raible) — 3D GL UI toolkit at NASA Ames"
    - "Electropaint — Panel Library demo → SGI screensaver; live slider-bank performance UI"
    - "Raster Masters — SGI-sponsored visual-music ensemble (Levit, Fischer, Tristram, Hoppe, Nelson); Onyx rigs; Dead/Shoreline/Hancock/Nash; *Infrared Roses*"
    - "Electroslate, EP2, Squish — extended Electropaint performance stack; recursive texture-map feedback"
    - "Reaction-diffusion, video feedback, and CA-inspired generative imagery in performance"
    - "Viviography — art in motion; Resolume + TouchDesigner (HN 2025)"
    - "Open-source / share-the-tape culture — Panel Library + EP source before SGI demo bundle; IGL lineage"

connections:
  don_hopkins: |
    **Old friends since the mid–late 1980s** — Don and Dave met at **USENIX Monterey 1989**: Dave's
    **Panel Library** paper, Don's **PSIBER Space Deck** (visual PostScript / NeWS debugger). Dave
    then sent Don **Panel Library + Electropaint source**; Don hacked Electropaint on an **SGI at UMD**
    to render **recursive s-expr trees** (transforms between nodes, not linear histories) — a **3D
    Pseudo Scientific Visualizer** parallel to PSIBER's **2D** object browser from Monterey. In the
    **1990s SGI era** Don saw **Raster Masters** at **Shoreline** and **Grateful Dead** shows. Don calls
    those **"Grateful Dead Conferences"** — same Silicon Valley / Free Software crowd (public HN, 2022).
    Same live-generative orbit as
    Don's **CAM6**, **HyperLook**, and **Musical Gas** — and **[Scott Draves](../scott-draves/)**
    ("Spot"): **Fractal Flame** (flam3), **Electric Sheep**, **Dreams in High Fidelity** — evolutionary,
    feedback-driven generative art in the same psychedelic-performance family. Deep dive:
    [`raster-masters-panel-library.md`](raster-masters-panel-library.md).
  generative_performance: "Sibling thread to **[Scott Draves](../scott-draves/)** (Fractal Flame, Electric Sheep, collective breeding), **[Brian Eno](../brian-eno/)** (generative ambient/systems), and the CA looping fest — generative imagery *performed* live, not just rendered offline."
  ca_looping_fest: "Natural co-guest for **[Norman Margolus](../norman-margolus/)**'s CA looping fest — with **Scott Draves**, Wolfram, Crutchfield, Ackley; Dave has publicly credited the *Cellular Automata Machines* book; Don built **CAM6** from it."
  video_feedback: "Same feedback family as **[Jim Crutchfield](../jim-crutchfield/)** — iterated graphical systems, camera/screen loops, reaction-diffusion."

