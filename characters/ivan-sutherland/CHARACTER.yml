  year: 1963
  machine: "MIT Lincoln Laboratory TX-2 (Wesley A. Clark)"
  why: |
    Light pen + constraints + master/instance drawings + zoom — interactive CAD and
    declarative "whats" before the word GUI. North star for Roy Eagleson's teaching,
    PIXIE's pen era, Kay's proto-OOP reading, and the Geometer's Sketchpad educational line.

bio:
  summary: |
    **Ivan Edward Sutherland** (b. 1938) created **Sketchpad** (MIT PhD 1963, advisor Claude
    Shannon; committee included Marvin Minsky) on the TX-2 — light-pen interactive drawing with
    geometric **constraints** and master/instance structure. Kay cites Sketchpad (with Simula and
    the B5000) as a root of object-oriented thinking. Later: Harvard / **"Sword of Damocles"**
    head-mounted display (1968); ARPA; co-founded **Evans & Sutherland** with Dave Evans; taught
    at **University of Utah** while Alan Kay was a grad student (Armit/Coons-patch era neighbor).
    Sun Fellow; with Marly Roncken founded the Asynchronous Research Center at Portland State —
    still researching ("I'm planning not to retire"). Turing Award 1988.

