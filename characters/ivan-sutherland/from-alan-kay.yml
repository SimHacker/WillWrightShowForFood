character: ivan-sutherland
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Kay saw Sketchpad's use of objects and instances (master drawings + constraints) as one of
    the key precedents for object-oriented programming, alongside Simula and the B5000.
    Sutherland later co-founded Evans & Sutherland and taught at Utah while Kay was a grad student.
    Quora: Sketchpad as "monumentally wonderful" interactive declarative CAD+sim — show what you
    want (pictures + constraints); solver maintains truth. Relational / requirements programming
    Kay now contrasts with pure messaging. Yoot People.md compresses this for the 1993 interview.

