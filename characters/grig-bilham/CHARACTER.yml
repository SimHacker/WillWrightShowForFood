bio:
  summary: |
    **Grig Bilham** — Laszlo Systems alum who went all-in on **public-good
    infrastructure for creators**. Current constellation: **Universal Manifest** (the
    permissions/control layer the internet is missing), the **Open Spatial Lab** at
    peers.social — where he designed, built, and shipped the SIGGRAPH 2026 proof of
    concept for the **Web of Worlds** standard (W3C-published, developed at the
    **Metaverse Standards Forum**) alongside the **spatial fabric** standard and the RP1
    **Open Metaverse Browser** — plus a new open-source rendering engine for spatial
    fabrics and WASM widgets. **EverArchive**: a foundation for **200–1000 year storage**
    of creative work with self-sovereign publishing tools (panel with **Brewster Kahle**
    at the eARTh pARTy conference on Forbes Island); digital lending/sales via atomic
    peer-to-peer swaps on **Chia** (works with **Bram Cohen** on standards).
    **localartist.network**: hyper-local digital signage for creatives (Boulder pilot for
    Sundance). **Distributed Creatives**: the nonprofit keeping it all pointed at
    communities. **peers.social**: an open stack for building your own platform while
    adopting the network effect of each.
  don_connection: |
    Laszlo orbit (Temkin cc'd him on the OL 5.0 announcement); knows Don's Sims history;
    mutual friends (Pablo Kang, Max, Sam). Jul 2026: reached out warmly on LinkedIn with
    the full project constellation, said he'd love to collaborate — and closed with "I was
    working on a circular menu today, and of course thought of you and the study you did."
    A man building circular menus into an open metaverse is already halfway on the show.

