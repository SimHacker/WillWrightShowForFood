weizenbaum_class:
  course: "MIT 6.030 Intro to Programming (late 1970s)"
  teacher: joe-weizenbaum
  kmp_quote: |
    I didn't write the original ELIZA program, although my Lisp class was taught by Joseph
    Weizenbaum, who did. I later wrote a very elaborate program of similar kind, which I just
    called DOCTOR, in order to play with some of the ideas.
  elizagen_note: |
    KMP took Weizenbaum's course where he was introduced to ELIZA; wrote DOCTOR on ITS (MACLisp).
    Built on Bernie Cosell's BBN-Lisp ELIZA lineage — hack upon hack, proto free software.

