tagline: |
  A communal expert-system tree grown by yes/no play and natural-language teaching — proto-character
  with foul-language memory, grudge state, and email to KMP.

tree_format:
  persistence: "(PRINT *MEMORY* OUTSTREAM) via UNSAVE/SAVE"
  initial_seed: "(CONSTRUCT-TERMINAL 'DOG '|No one|)"
  question_node: "(QUESTION text author no-branch yes-branch)"
  terminal_node: "(TERMINAL animal author)"
  internal_forms:
    - HAS-STATE
    - HAS-ACTION
    - HAS-POSSESSION
    - HAS-HABITAT
    - HAS-PROPERTY
    - MAKES-NOISE
    - ARE-YOU-THINKING-OF
  example_leaf: "((HAS-STATE A (REAL) ANIMAL)) KMP ..."

