  summary: >
    **Kent Pitman (KMP)** — central figure in **MACLISP** and **Common Lisp** standardization; author of
    the **Pitmanual** (Revised Maclisp Manual). Creator of **ANIMAL** (the guessing game with emotional
    state, foul-language tracking, and email tattling to KMP) and **DOCTOR** (Eliza lineage). Deep work
    on **special forms**, **fexprs**, and evaluated vs unevaluated arguments. Taught Don Maclisp on **ITS**
    at the MIT AI Lab when Don was a high school ARPANET tourist — old friends from the AI Lab days.

