bio:
  summary: |
    **Laurie Anderson** (b. 1947) — American avant-garde artist, composer, and musician; a defining
    figure of performance art. Best known for the unexpected 1981 hit **"O Superman"** and the
    epic multimedia work **United States I–IV**. A relentless **inventor of instruments and voice
    technology**: the **tape-bow violin** (playing recorded tape with a bow instead of horsehair), the
    **talking stick**, and the **"Voice of Authority"** — a pitch-shifted male vocal filter she uses as
    a recurring persona. NEA-controversy-era **anti-censorship** voice; longtime partner of **Lou Reed**.
    Later works push into **VR/immersive** storytelling (*Chalkroom*, *Aloft*). Her whole practice is
    **spoken word + technology + generative systems on stage** — the exact register the Repo Show performs in.

  don_connection: |
    **Don's long-time avant-garde north star.** Don briefly met Laurie Anderson during his time at
    **Interval Research** (Paul Allen & David Liddle's lab, 1992–2000). Her Interval tie is confirmed
    on the public record: she built the **Talking Stick** — a ~6-foot MIDI baton that granularizes and
    replays audio in real time — with **Bob Bielecki and Interval Research (c. 1999)**, debuting it on
    the *Songs and Stories from Moby Dick* tour. She sits squarely in Don's performer pantheon alongside
    Bowie, Klaus Nomi, Joey Arias, Leigh Bowery, and Nina Hagen.

