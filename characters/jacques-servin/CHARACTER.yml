bio:
  summary: |
    **Jacques Servin** was a programmer on Maxis's **SimCopter** (1996). He inserted an easter
    egg that, on certain dates (his birthday, his boyfriend's birthday, Friday the 13th),
    filled the game's cities with **men in swim trunks hugging and kissing** -- partly a protest
    over working conditions, later framed as an RTMark-sponsored act of culture jamming. A
    trigger bug made the "himbos" appear far more often than intended; the egg was discovered
    after the game shipped, and Servin was **fired** in late 1996. **ACT UP** called for a
    boycott of Maxis until he was rehired; Servin called the boycott "absurd" and had no desire
    to return. Maxis patched the content out and publicly insisted it was not anti-gay.

    He went on to co-found **RTMark** (as "Ray Thomas") and, as **Andy Bichlbaum**, co-founded
    **The Yes Men** -- the culture-jamming duo behind the 2004 BBC Dow/Bhopal hoax and the Yes
    Men films. The SimCopter egg is a canonical entry in the LGBTQ Video Game Archive.

  wwsff_connection: |
    Don's 7 Aug 1998 Draft 3 review of The Sims cites the episode directly: "We are going to be
    expected to do better than that after the SimCopter fiasco and the lip service that Maxis
    publically gave in response about not being anti-gay" -- and models "monosexual homosexual
    (like the guys in SimCopter)". The fiasco set the context in which written inclusion won.
    See characters/patrick-j-barrett-iii/same-sex-relationships-the-record.md.

ea_2026_context: |
  EA (Maxis's parent; fired Servin, patched the himbos) was bought in 2026 by the Saudi Public
  Investment Fund and Jared Kushner's Affinity Partners. The Yes Men's specialty -- identity
  correction of corporations -- makes Servin uniquely qualified to comment on what the sale
  means for The Sims' queer legacy. Stated as situation, not attack; see the record's closing
  chapter.

