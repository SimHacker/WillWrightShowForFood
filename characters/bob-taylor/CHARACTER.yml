bio:
  summary: |
    **Robert W. ("Bob") Taylor** (1932–2017) ran ARPA IPTO (ARPANET initiation) then led Xerox
    PARC's Computer Science Laboratory. Kay credits Taylor's hands-off, people-not-projects
    management for the freedom that produced the Alto and Smalltalk. Recruited Lampson, Thacker,
    Deutsch and most of the Berkeley Computer Corporation group to PARC (Jan 1971). Later founded
    DEC SRC. Draper Prize with Kay, Lampson, Thacker (2004).

