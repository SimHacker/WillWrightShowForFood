# What Alan Kay says about Bob Taylor — public sources
character: bob-taylor
kay_hub: ../alan-kay/
kay_says:
  gist: |
    ARPA IPTO then PARC CSL. Funded and managed people rather than projects. Recruited Berkeley
    Computer Corporation group (Lampson, Thacker, Deutsch…) Jan 1971. Yoot 1993 interview: Kay
    credits Taylor's hands-off approach for the freedom that produced Alto and Smalltalk.
