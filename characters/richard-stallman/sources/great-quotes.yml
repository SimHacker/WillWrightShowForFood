    source: "kabuki-west mailing list"
    link: "https://donhopkins.com/home/catalog/text/rms-vs-doctor.html"
    also: "http://www.art.net/Studios/Hackers/Hopkins/Don/text/rms-vs-doctor.html"
    tags: [humor, deadpan, legendary, natalism]
    context: "Baby announcement on SF Bay dinner-planning list"
    significance: "Opened the Natalism Flame."
    humor: true

  - id: doctor-funny
    quote: "Funny."
    date: "1993-02-21"
    source: "kabuki-west mailing list"
    link: "https://donhopkins.com/home/catalog/text/rms-vs-doctor.html"
    tags: [humor, doctor, legendary]
