# RMS — public contact protocol
# Sources: stallman.org, rms-assist autoreply, gnu.org/audio-video

public_email:
  general: rms@gnu.org
  speaking_invitations: rms-invitation@gnu.org
  urgent_callback: rms-assist@gnu.org
  gpg: "See stallman.org/gpg.html — do not trust key servers"

phone:
  mobile: none
  landline_callback: |
    Email rms-assist@gnu.org with topic and landline number; he may call back.
    For urgent contact only.
  fsf_office: "+1-617-542-5942"

refuses_or_avoids:
  video: [Zoom, Skype, WhatsApp, Discord]
  other:
    - mobile phones
    - preferred term open source — uses free software
    - Linux alone — GNU/Linux when the OS is meant

accepts:
  email: primary
  video: [Jitsi Meet, BigBlueButton]
  audio: landline callback via rms-assist
  recording_formats:
    video: WebM VP8/VP9
    audio: Ogg Vorbis or Speex

rider_accommodation:
  summary: "Glad to accommodate. See sources/rider-and-parrot.md"
  highlights:
    - "Do not buy a real parrot as a surprise — offer ethical virtual Copyleft instead"
    - "Tea OK; no spicy; no breakfast interrogation"
    - "Plain ASCII; ask before files >100k"
    - "free software / GNU/Linux wording in all publicity"
  rider_archive: https://github.com/ddol/rre-rms
  virtual_parrot: https://github.com/SimHacker/tmnn7-8/blob/main/analysis/characters/StIGNUcius/parrot-copyleft.yml
