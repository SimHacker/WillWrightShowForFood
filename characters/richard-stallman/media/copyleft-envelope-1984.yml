# Copyleft (L) envelope — Don Hopkins → Richard Stallman, 1984
# Canonical scans live in this directory. Not Pantomime / Bug Farm / Oculus.

event:
  year: 1984
  from: "Don Hopkins, 819 Ruatan St., College Park, Md. 20740"
  to: "Richard M. Stallman, 545 Tech Square, Cambridge, Ma. 02139"
  contents: "68000 manual Don borrowed from RMS — returning by mail"
  outcome: "Sticker inspired Stallman to use the word *copyleft* for free software licensing"
  wikipedia: "https://en.wikipedia.org/wiki/Copyleft#History"
  gnu_art: "https://www.gnu.org/graphics/copyleft-sticker.html"
  license: "CC BY-SA 4.0 (Don Hopkins; see footer on scans)"

files:
  front: copyleft-envelope-front-1984.png
  back: copyleft-envelope-back-1984.png
  sticker: copyleft-sticker-1984.png

front_art:
  address: "Richard M. Stallman / 545 Tech Square / Cambridge, Ma. 02139"
  doodles: "Grinning creature, screaming mouth, DON'T GET WET, THANK YOU!, claw marks"
  commands: "DONT FOLD !!!!!!! — POSTAGE box"

back_art:
  attention: "READ NOTE BEFORE OPENING!"
  mark: "Copyleft (L)"
  body: |
    The material contained in this envelope is Copyleft (L) 1984 by an amoeba named "Tom".
    Any violation of this stringent pact with person or persons who are to remain un-named
    will void the warrantee of every small appliance in your kitchen, and furthermore, you
    will grow a pimple underneath your fingernail. Breaking the seal shows that you agree to
    abide by Judith Martin's guidelines concerning the choosing of fresh flowers to be put on
    the dining room table. Failure to break the seal on a weekday is […]
  margin: "SPAM column — repeated graffiti typography"

repo_jokes:
  lisp_parallel: ../../don-hopkins/media/metropolitan-rage-warehouse-mit.yml
  morningstar_parallel: "Mail-art deconstruction — cousin to How to Deconstruct the Cube"
  li_chen_wang: "@COPYLEFT ALL WRONGS RESERVED — Palo Alto Tiny BASIC, Dr. Dobb's 1976"
  stallman_line: "Copyleft — all rights reversed"

