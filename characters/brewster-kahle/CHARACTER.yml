bio:
  summary: >
    **Brewster Kahle** — founded the **Internet Archive** (1996), built **WAIS** wide-area information
    servers, and co-founded **The Little Garden (TLG)** early ISP in Palo Alto with John Gilmore, John
    Romkey, Steve Crocker, and Tom Jennings. Famous for preserving early web culture and arguing we
    should live up to the **first dreams** of the medium, not only what technicians later shipped.

synergies:
  wikimedia_partnership: >
    The Internet Archive and Wikimedia are formal, working partners: InternetArchiveBot repaired
    over a million broken Wikipedia links by pointing them at the Wayback Machine (2016), and the
    book-weaving program turned 130,000+ Wikipedia book references into live links to digitized
    Internet Archive books (2019) — Brewster quoted in Wikimedia's own announcements both times.
  kennisnet_wikimedia_amsterdam: >
    Kennisnet — the Dutch public educational ICT organization that funded Micropolis in 2008–09 —
    hosted roughly fifty Wikimedia Foundation servers from June 2005 to 2009 at SARA in Science
    Park Amsterdam: Wikimedia's European cluster ran on Dutch public-education infrastructure
    during the exact years Kennisnet backed Micropolis. Dutch public-interest hosting of global
    knowledge commons is not a hypothetical; it's recent history with a direct Micropolis overlap.

