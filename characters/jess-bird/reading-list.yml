  preservation_and_loss:
    logline: "Talk to people while we can — recovery stories and the on-the-record archive."
    sources:
      - ../will-wright/sources/simrefinery-recovery/
      - ../phil-salvador/README.md
      - ../will-wright/primary-sources-evidence-room.md
      - ../will-wright/sources/2006-06-26-long-now-playing-with-time-eno-wright/
      - ../will-wright/sources/2006-11-13-simcity-olpc-email-thread/
      - ../will-wright/sources/simcity-open-source-saga/
    long_now_thread: |
      Long Now (Jun 2006) → TWO audience members (Dan Ancona + Mark Live — neither Don, nor
      planted by him) ask Will about open-sourcing SimCity; Will very open, on tape; Don in the
      audience, having already written proposals years earlier to open-source SimCity and to
      build open-source Sims content editing/management tools → 140 days later John Gilmore
      connects OLPC to the charge (the two askers' spark plus Don's old lightning bolts)
      → EA clearance → SimCity free on the OLPC XO-1 by New Year's. Credit where the work was:
      WALTER BENDER — Stone Soup, the OLPC booth at GDC (Don manned it), and the explicit
      appeal to game developers to make FREE GAMES as examples kids can learn from, view
      source, and build on top of — factored into reusable modules, tools, and libraries of
      code and content. That appeal recruited Don to OLPC, and it is exactly what
      WillWrightShowForFood executes on today. The hard work, brilliant practical inspiration,
      and leadership were Walter's; the connecting email was John's. The ball that became
      Micropolis — and the tool proposals Don is now building for real.

  show_born_in_public:
    logline: "The Repo Show assembling itself — a present-tense production thread."
    sources:
      - ../will-wright/sessions/README.md
      - ../../repo-shows/will-wright-premiere/BROWSE.md
