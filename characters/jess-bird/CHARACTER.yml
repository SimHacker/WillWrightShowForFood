bio:
  summary: |
    **Jess Bird** is a writer and documentary researcher building a **television history of
    The Sims, Will Wright, and Maxis** — the kind of long-form, sourced, broadcast-scale work
    that needs years of interviews, archives, and community trust. **Jami Becker** connected
    Jess and Don in 2025; they've been in steady correspondence since — video calls, deep
    reading lists, and introductions across the preservation and fan-builder worlds.

    Jess does the hard part most hobby projects skip: **finding the right people**, honoring
    their stories on camera, and holding the thread from **Project X** naming lore through
    **SimRefinery recovery**, **SimFreaks / SimSlice**, and the **Soul of The Sims** primary
    sources Don has been publishing. She interviewed **Tim LeTourneau** before his passing —
    Don shares her wish that Tim's words live on in whatever form the history takes.

    For **Will Wright Show For Food**, Jess is a **real-TV production anchor**: someone who
    knows how commissioned documentary actually gets made, while Don's repo show ships code,
    interviews, and artifacts in public. The projects **lend each other credibility** — her
    broadcast rigor, our runnable demos and guest ladder — without either side pretending to
    be the other.

