# Jess Bird — documentary mission (public-safe framing only)
# No funding status, delays, or deal terms — Jess controls what appears here.

mission:
  title: "The Sims / Will Wright / Maxis — broadcast history"
  holder: Jess Bird
  scale: television documentary
  lineage: BBC Studios research thread (writer/creative)

  what:
    - The design and cultural story of The Sims — from Maxis workshop to global phenomenon
    - Will Wright's simulation lineage (SimCity → dollhouse dreams → shipped game)
    - Veterans who built it — motives, tools, accidents, and epithets worth remembering
    - Community archivists and modders who kept the history alive when corporations moved on
    - Primary sources: interviews, recovered artifacts, published code and design documents

  how:
    - Long-form interviews with people who were there
    - Archival research (corporate training sims, lost floppies, fan sites, design docs)
    - Community trust — introductions through people like Don, not cold extraction
    - Care for memorial voices — e.g. Tim LeTourneau's interview held with honor

  why_it_matters: |
    The Sims changed how millions think about play, home, and simulation. That story belongs in
    durable broadcast form — not only in forum posts and rotting hard drives. Jess is doing the
    patient work of **finding everyone worth hearing** and **getting it on record**.

  not_in_this_file:
    - fundraising or co-production status
    - network or licensor negotiations
    - production timelines or delays
    - contributor agreement terms

synergy_with_repo_show:
  complementary: |
    Will Wright Show For Food is a **public repo show** — code, sessions, guest ladder, artifacts
    anyone can fork. Jess's documentary is **commissioned television**. They reinforce each other:
    the repo proves Don is shipping interviewable reality; Jess's rigor proves the history deserves
    a broadcast seat.
  shared_assets:
    - Don's published sources under characters/will-wright/sources/
    - Guest roster overlap (Phil, Jeff, Heather/Steve, Maxis veterans)
    - Recording ethic — talk to people while you can; Tim's lesson landed for both projects
