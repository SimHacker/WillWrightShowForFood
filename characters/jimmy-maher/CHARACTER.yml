bio:
  summary: |
    **Jimmy Maher** lives with his wife **Dorte** in a village near **Billund, Denmark** (he moved
    from **Dallas, Texas** in 2009). Since the early 2010s he has written **The Digital Antiquarian**
    (filfre.net) — a chronological chronicle of interactive entertainment and digital culture he
    describes as a journey that can never be truly completed. Articles stay **free to read**;
    optional **Patreon** and PayPal support keep the work sustainable. Since 2019 he also writes
    **The Analog Antiquarian** (world-history wonders).

    He is also an **interactive fiction** author (*The King of Shreds and Patches*), builder of the
    **Filfre** IF interpreter, and author of **MIT Press** books including *The Future Was Here:
    The Commodore Amiga* and *Let's Tell a Story Together: A History of Interactive Fiction*.
    Public thread on his About Me page shows a historian who **reaches out to living subjects**,
    **welcomes insider corrections**, and **points researchers to primary sources** (Internet Archive
    magazines, etc.) — the same ethic Don wants in the Repo Show.

    **Jul 2026:** *The Life and Times of Maxis, Part 1: SimEverything* — SimCity through SimCity 2000,
    citing Phil Salvador's Obscuritory work. Don engaged on HN and filfre (Rowan Lipkovits asked about
    Micropolis/OLPC; Don replied with SimRefinery + OLPC footnotes + Will Dev Diaries link).

