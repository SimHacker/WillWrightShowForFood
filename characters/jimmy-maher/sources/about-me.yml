historian_practice:
  note: "Observed from public About Me thread — not claims about private process"
  patterns:
    - Reaches out to living subjects before writing when possible (e.g. Jason Scott → Ron Martinez)
    - Welcomes corrections from insiders; updates articles (Jim Levy, Brian Kerslake, Dene Grigar)
    - Points researchers to Internet Archive magazine scans for image rights (Sarah Fairhurst, Pandora Monnas)
    - Separates factual correction from critical opinion (Ron Martinez thread, 2018)
    - Patient, civil public voice under hostile commenters

