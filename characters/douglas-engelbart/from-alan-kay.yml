# What Alan Kay says about Douglas Engelbart — public sources only

character: douglas-engelbart
kay_hub: ../alan-kay/

kay_says:
  gist: |
    Engelbart is Kay's augmentation north star — not "tools" but **augmentation** of human intellect.
    Kay saw the 1968 demo at Utah; NLS shaped PARC windows, menus, and collaboration. Kay repeats that
    the web did not recover Engelbart's goals ("inverse vandalism"). PIXIE (light-pen menus on Engelbart-era
    hardware) threads through Don's preservation mail with Alan.

