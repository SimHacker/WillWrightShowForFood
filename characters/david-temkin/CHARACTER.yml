    TypeScript compiler + server, in-browser LZX→DHTML compile, claims byte-for-byte
    parity with OpenLaszlo 4.9. Software Preservation Society framing. Live Explorer
    on GitHub Pages.
  provenance: "David Temkin LinkedIn post + public repo (activity 7476118515758809088); earlier relay via Henry Minsky email (June 2026)."
  why_it_matters: "Revived toolchain + Laszlo reunion energy (Adam Wolff, Antun, Eric Bloch, Grig, Sundman, …) — anchors the OpenLaszlo Repo Show; Don can aim Micropolis LZX / SimFaux / myAlive-class apps at 5.0."
