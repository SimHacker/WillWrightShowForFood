bio:
  summary: "**David Temkin** — founder (and first CEO, then CTO/VP Engineering) of **Laszlo Systems** (2000–2009), creator of **OpenLaszlo**: the **LZX** XML+JavaScript language and Presentation Server for rich internet apps that compiled to Flash or DHTML/Ajax, open-sourced in 2004. In 2026 shipped **OpenLaszlo 5.0** (TypeScript/browser compile) and **Declare** (`declarelang`) — a new UI DSL that declares itself heir to OpenLaszlo but is not a port; also **Mesa** (spatial AI canvas) and the **In Formation** magazine revival. Earlier Senior Director of Engineering at Excite@Home; later co-founded **Cola**. Brown undergrad. Don worked with him (and Henry Minsky and Oliver Steele) on OpenLaszlo."

openlaszlo_revival:
  fact: |
    OpenLaszlo 5.0 (davidtemkin/openlaszlo-5.0): AI-assisted rewrite — Java out,
    TypeScript compiler + server, in-browser LZX→DHTML compile, claims byte-for-byte
    parity with OpenLaszlo 4.9. Software Preservation Society framing. Live Explorer
    on GitHub Pages.
  provenance: "David Temkin LinkedIn post + public repo (activity 7476118515758809088); earlier relay via Henry Minsky email (June 2026)."
  why_it_matters: "Revived toolchain + Laszlo reunion energy (Adam Wolff, Antun, Eric Bloch, Grig, Sundman, …) — anchors the OpenLaszlo Repo Show; Don can aim Micropolis LZX / SimFaux / myAlive-class apps at 5.0."
  repo: "https://github.com/davidtemkin/openlaszlo-5.0"
  live: "https://davidtemkin.github.io/openlaszlo-5.0/"
  linkedin: "https://www.linkedin.com/feed/update/urn:li:activity:7476118515758809088/"

declare:
  fact: |
    Declare (davidtemkin/declarelang): DSL for UIs — [ ] view tree, { } TypeScript
    constraints; reactive by construction; no VDOM/hooks/CSS-as-language; DOM or canvas
    backends; compiler in browser or Node; agent skill + declare.md sized for LLM context;
    heir to OpenLaszlo but ground-up redesign (not a port). Reference apps: calendar,
    desktop, docs, inspector. Does not use Svelte; spiritually closer to Svelte 5 runes
    than to React.
  provenance: "Public GitHub + davidtemkin.github.io/declarelang; LinkedIn DM to Don (Jul 2026) before public post — treat 'wet cement' framing as sensitive until he posts."
  why_it_matters: "Third act of the reunion show — OL soul for the AI era; Don's Svelte/Micropolis parallel; training-data leverage (OL in corpus, Declare declares the inheritance)."
  repo: "https://github.com/davidtemkin/declarelang"
  live: "https://davidtemkin.github.io/declarelang/"
  skill: "https://github.com/davidtemkin/declarelang/blob/main/skill/SKILL.md"
  language_doc: "https://github.com/davidtemkin/declarelang/blob/main/docs/declare.md"

