bio:
  summary: |
    Born 1943 in Friuli and raised in Rome. Doctor of Physics, University of
    Rome (1967); PhD in Computer and Communication Sciences, University of
    Michigan (1977), thesis "Cellular Automata Mechanics". At MIT's Laboratory
    for Computer Science 1977-1995, where he led the Information Mechanics
    Group; then Boston University, Electrical and Computer Engineering. IEEE
    Fellow (2012). Introduced the Toffoli gate (MIT/LCS/TM-151, 1980), wrote
    "Conservative Logic" with Edward Fredkin (1982), and with Norman Margolus
    built the CAM-6 and wrote Cellular Automata Machines (MIT Press, 1987).
  known_for:
    - "Toffoli gate (1980): the universal reversible gate, later a basic primitive of quantum computing"
    - "Conservative Logic, with Edward Fredkin (1982), source of the billiard-ball computer"
    - "Proof that invertible cellular automata are computation-universal (1977)"
    - "CAM machines: Squareland (1982), CAM-2 to CAM-5, CAM-6 (1985-86), CAM-8 with Margolus (working 1992)"
    - "Cellular Automata Machines: A New Environment for Modeling, with Norman Margolus (MIT Press, 1987)"
    - "Lattice-gas hydrodynamics; organizer of the 1981 Physics of Computation conference at Endicott House"
  later_work:
    - "simp/step cellular automata environment, with Ted Bach"
    - "Quantum gate speed limits, with Lev Levitin (2003, 2009)"
    - "'Lattice gases vs cellular automata: the whole story at last' (Automata 2008)"
    - "'Entropy? Honest!' (Entropy, 2016)"
    - "'Action, or the fungibility of computation', in Feynman and Computation (1998)"

connections:
  cam6: >-
    Don's CAM6 simulator follows the book and is compatible with the Forth rule
    software Toffoli and Margolus wrote for the CAM-6. It went from C and Forth
    to C++ and Python to JavaScript; the lookup tables stayed the same.
  cam6_borrowed: >-
    Don handled Norman Margolus's CAM-6 at the MIT AI Lab, and borrowed one for
    a weekend science fiction convention (HN 37029593, 2023).
  courseware: >-
    Norman Margolus has given Don permission to build interactive courseware
    from the book, chapter by chapter.
  fredkin: >-
    Edward Fredkin, Toffoli's co-author on Conservative Logic, died 13 June
    2023. No Fredkin directory exists yet.

