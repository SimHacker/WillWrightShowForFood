bio:
  summary: |
    **Ken Kahn** — fifty years researching AI, creativity, and education, from his MIT
    AI Lab PhD (1979, advisor Carl Hewitt; Minsky and Papert reported on his committee;
    Logo group member) to the present. His thesis system, Ani, made animated films from
    vague story descriptions — text-to-video with provenance, 45 years early. Creator of
    **ToonTalk**, the game-like visual programming world where computation is a city,
    methods are robots trained by demonstration, and messages are carried by birds to
    nests. Built the **eCraft2Learn AI blocks** for **Snap!** (speech, ML, pattern
    recognition — in the browser, kid-accessible). Author of **The Learner's
    Apprentice: AI and the Amplification of Human Creativity** (how anyone can
    co-create apps, adventures, and stories with chatbots). NPUC speaker (Almaden 1993:
    "Sketches and Animations as Programs"). Lately publishing a stream of documented
    chatbot-collaboration experiments, including a machine-written AI-history essay he
    editor-in-chiefed between Claude and ChatGPT. An all-around nice,
    interesting-to-talk-to guy.

