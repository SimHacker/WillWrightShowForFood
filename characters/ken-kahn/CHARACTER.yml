bio:
  summary: |
    **Ken Kahn** — fifty-three years teaching AI to children, which is the single fact
    that reframes everything else. He arrived at the MIT AI Lab in the 1970s (PhD 1979,
    advisor Carl Hewitt; Minsky and Papert reported on his committee; Logo group member),
    and **between 1973 and 1979, as a graduate researcher in the Logo Group, he taught
    artificial intelligence to elementary school children** — the thing everyone treats
    as a 2020s question, answered by doing it, half a century ago. His thesis system,
    Ani, made animated films from vague story descriptions — text-to-video with
    provenance, 45 years early. **Pictorial Janus** (1990–91) made a distributed
    concurrent constraint language visual. **ToonTalk** (1995–present) is the game-like
    visual programming world where computation is a city, methods are robots trained by
    demonstration, and messages are carried by birds to nests. The **eCraft2Learn AI
    blocks** for **Snap!** (speech, ML, pattern recognition, LLMs — in the browser,
    kid-accessible) are the current instrument, and he is still teaching the same
    subject to the same age group with it. Author of **The Learner's Apprentice: AI and
    the Amplification of Human Creativity**. NPUC speaker (Almaden 1993: "Sketches and
    Animations as Programs," under the company name Animated Programs, Inc.). At
    Snap!Con 2023 in Barcelona he led the session on integrating LLMs with Snap!,
    including extensions that orchestrate conversations between characters. Lately
    publishing a stream of documented chatbot-collaboration experiments, including a
    machine-written AI-history essay he editor-in-chiefed between Claude and ChatGPT. An
    all-around nice, interesting-to-talk-to guy.

  the_arc: |
    Started teaching kids AI in 1973 with Papert in the Logo Group; still teaching kids
    AI in 2026 with Snap! and eCraft2Learn. Fifty-three years, same question, four
    substrates (Logo, Pictorial Janus, ToonTalk, Snap!). Nobody's hardware curve did
    that; he did, by hand, continuously.

