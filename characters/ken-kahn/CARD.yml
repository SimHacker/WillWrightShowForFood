    signature: pictorialJanus(concurrentConstraintProgram) → a picture that runs
    score_when:
    - trigger: claim_that_visual_languages_cannot_express_hard_semantics
      weight: 0.93
  effect: 1990–91 — a distributed concurrent constraint language given a visual syntax, where the diagram is not documentation of the program but the program. The counterexample to "blocks are for beginners," thirty-five years old.
  verifiable: "Wikipedia: Janus (concurrent constraint programming language)"
  combos_with:
  - TOONTALK
