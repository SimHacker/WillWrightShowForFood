abilities:
- id: ANI-STORY-ANIMATION
  name: Ani — Story to Animation (1979)
  type: legacy
  mana: '{U}{U}'
  conditions:
  - segment_topic_in: [generative-ai, text-to-video, ai-history, actors, creativity-models]
  advertisement:
    method: aniStoryAnimation
    signature: aniStoryAnimation(vagueStory) → film, from suggestions of many knowledge bodies
    score_when:
    - trigger: audience_realizes_1979_did_text_to_video
      weight: 0.96
    - trigger: society_of_mind_architecture_echo   # many small suggestion-makers, focus-driven
      weight: 0.9
  effect: His PhD system made simple animated films from high-level, vague, incomplete story descriptions — collecting suggestions from several bodies of knowledge, implemented in Hewitt's actor model. Text-to-video with provenance, 45 years early; a computational model of creativity.
  verifiable: "'Creation of Computer Animation from Story Descriptions' (MIT AI Lab TR-540, 1979; advisor Carl Hewitt) — MIT DSpace 1721.1/16012"
  combos_with:
  - SOCIETY-OF-MIND
  - TOONTALK
- id: TAUGHT-AI-TO-KIDS-IN-1973
  name: Taught AI to Kids in 1973
  type: legacy
  mana: '{W}{U}'
  conditions:
  - segment_topic_in: [ai-education, constructionism, logo, ai-history, curriculum]
  advertisement:
    method: taughtAIToKidsIn1973
    signature: taughtAIToKidsIn1973() → the question, already answered, fifty-three years ago
    score_when:
    - trigger: someone_asks_whether_kids_can_learn_AI
      weight: 0.99
    - trigger: panel_treats_AI_education_as_a_new_problem
      weight: 0.97
  effect: Between 1973 and 1979 he taught artificial intelligence to elementary school children as a graduate researcher in the MIT AI Lab's Logo Group. Play this when anyone frames teaching AI to children as a question the field has not tried yet. He is still doing it, which makes it a longitudinal study nobody designed.
  verifiable: "Don's HN summary 12 Sep 2026 (sources/hn-2026-09-career-summary.md); Logo Group membership in thesis front matter"
  combos_with:
  - AI-BLOCKS
  - CONSTRUCTIONIST-ML
- id: PICTORIAL-JANUS
  name: Pictorial Janus
  type: legacy
  mana: '{U}{G}'
  conditions:
  - segment_topic_in: [visual-programming, concurrency, constraints, diagrams-as-code]
  advertisement:
