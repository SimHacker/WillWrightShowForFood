bio:
  summary: |
    Dutch computer artist and language designer. Institute of Sonology under
    Koenig; real-time synthesis in PDP-15 assembly (1977). Independently
    discovered the Bohlen–Pierce scale via continued fractions (Interface,
    1978); the Kees height is named for him. Technology founder of Electrogig
    (Amsterdam/SF): designed 3DGO and the languages Intercol and IL — IL
    "based on intensional logic," unifying imaging, modeling, texturing,
    animation, and sound. Maxis 2001–2007: one of three engineers on the
    Spore prototyping team — creature editor, GA-evolved nervous systems for
    locomotion (in IL), L-system body plans, the any-number-of-legs walking
    algorithm (GDC 2005 demo; SIGGRAPH 2008 retargeting paper). Art: grown
    then sculpted, printed 1/1; Berg Lyric Suite Function series; Tribonacci
    "Odd Golden Section" aspect ratio; Filter Farm genetic Photoshop filters.
