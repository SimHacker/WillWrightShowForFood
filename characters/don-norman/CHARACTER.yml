bio:
  summary: |
    **Don Norman** — cognitive scientist and design theorist; author of *The Design
    of Everyday Things* (1988 as *The Psychology of Everyday Things*; revised 2013)
    and related books on emotional design and complexity. Co-founder of **Nielsen
    Norman Group**. Public vocabulary — affordances, signifiers, mapping, feedback,
    conceptual models, "Norman's law" of product schedules — is the lingua franca
    of HCI critique. Strong fit for pie-menu / PIXIE / SimCity UI history nights:
    why controls should teach, not punish.

why_invited:
  doet: "The book every UI argument eventually cites — doors that are also menus."
  show_fit: "Radial menus, SimCity tools, Sims needs — discoverability under playful complexity."

