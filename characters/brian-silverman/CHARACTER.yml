bio:
  summary: |
    **Brian Silverman** is a Canadian computer scientist known for **Logo** dialects (LogoWriter,
    MicroWorlds, IBM Logo, Apple Logo at **LCSI**), **Scratch** (with Mitchel Resnick), **LEGO
    programmable bricks** (Media Lab precursor to Mindstorms), and **cellular automata** rules including
    **Brian's Brain**, **Seeds**, and **Wireworld**. MIT student-era **tinkertoy computer** played
    tic-tac-toe. Co-founder and president of **Playful Invention Company** (Montreal) — **Crickets**,
    **TurtleArt**, **Phantom Fish Tank**. Emulator work: **PDP-1 Spacewar!** in Java, transistor-level
    **6502** and **4004**. Visiting scientist, MIT Media Lab. Don's note (pending Brian's confirmation):
    **PDP-7** experience relevant to reading **Heinz Lemke's PIXIE** assembler listing.
  known_for:
    - "Brian's Brain — three-state CA rule; community named it; inventor did not self-name"
    - "Seeds, Wireworld — CA rules family"
    - "Logo — decades of dialects; Papert lineage"
    - "Scratch — co-developer with Resnick"
    - "LEGO programmable bricks — Media Lab"
    - "Playful Invention Company — Montreal"
    - "Spacewar! Java port via PDP-1 emulator"
    - "Minsky Logo / TT2500 workshop heritage"

