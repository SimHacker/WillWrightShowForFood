bio:
  summary: |
    **Steven Anson Coons** (1912–1979) — MIT mathematician/engineer whose **Coons patch**
    (surface interpolation from boundary curves) became a foundation of computer-aided geometric
    design. At Utah and beyond, interactive Coons-patch systems (e.g. **Andrew Armit**'s Multipatch
    on PDP-7) are what **Alan Kay** recalled being "quite in awe" of. Memorial room for the surface
    math behind the Armit film hunt — not a People.md heading, but essential Utah-lane intertwingularity.

