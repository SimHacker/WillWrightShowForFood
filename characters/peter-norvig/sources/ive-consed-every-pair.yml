# I've Consed Every Pair — Peter Norvig (2020)
# Johnny Cash parody born from a Palo Alto cafe Clojure evangelist.

meta:
  author: Peter Norvig
  url: https://medium.com/@peternorvig/ive-consed-every-pair-54ef5d9d93b6
  year: 2020
  kind: song_parody
  hn_thread: https://news.ycombinator.com/item?id=23036893
  consent: public

origin_story: |
  Peter met a hacker excited about Clojure who seemed to know Peter only as a Python programmer,
  not as someone with fifteen years of Lisp as a primary language. He wrote a Johnny Cash-style
  road song listing Franz Lisp, MacLisp, Emacs Lisp, Symbolics, Racket, R7RS, and every `cons`
  in the land. Don posted it to Hacker News; Daniel compared it to Guy Steele's AI Lab hacker
  songs of the late 1970s.

show_hooks:
  - "Perform it on air — or ask Peter to read a verse"
  - "The Lisp/Python identity joke as warm-up before a serious MOOLLM skills conversation"
  - "Pair with Don's XML song ('Twenty Twenty Twenty Four Escapes to Go') as the Repo Show's musical interlude tradition"

