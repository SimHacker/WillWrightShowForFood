# Teach Yourself Programming in Ten Years — Peter Norvig (2001)
# Public essay. The URL says 21-days; the title says ten years. Both are the joke.

meta:
  author: Peter Norvig
  url: https://norvig.com/21-days.html
  also_known_as: "21 Days / Ten Years essay"
  year: 2001
  kind: essay
  consent: public

the_hook: |
  Deliberate practice beats "Teach Yourself X in 24 Hours" hype. Peter's thesis: nobody becomes
  Mozart in three weeks; programming mastery takes about ten years of serious work — and the
  click-bait URL (`21-days.html`) is itself the punchline.

why_don_loves_it: |
  Don forwarded this to Paul in 2009 with the line: "Hang in there! 10 years will go by really
  fast if you're having fun programming!" It became a touchstone for the Repo Show's constructionist
  frame: skills and microworlds are what you practice *with*, not shortcuts around the work.

show_hooks:
  - "Ten Years, revisited — what does deliberate practice mean when an LLM writes the boilerplate?"
  - "Are MOOLLM skills the constructionist artifacts we practice with for the next decade?"
  - "Peter's recent talks: AI raised the ceiling; judgment and architecture matter more, not less"

