# Peter Norvig × Don Hopkins — worms, Ground, and The Ground Truth (Jan 2026)
# Paraphrased from Facebook group thread + email; not verbatim quotes unless marked.

meta:
  date: 2026-01-07
  medium: facebook_group_thread
  consent: warm_lead
  portrayal: paraphrase_only

peters_scruffy_neat_line: |
  "It's the triumph of scruffy AI running on the substrate of neat AI! It's ok if it's not perfect
  or exact." — Peter, on MOOLLM's layered metadata pipeline (summaries, keywords, ratings,
  clustering into publications with editorial voice).

publications_peter_named:
  - Looming Stone — Hunter S Thompson's usual outlet
  - LOOMIT Press — technical stuff
  - Jacquard — artsy fartsy style magazine
  - Nurture — counterpart to Nature
  - OMNISCENT — sci-fi speculative OMNI counterpart
  - The Flat Glober — enigmatic self-contradictory conspiracy-theory X-Files publication
  - The Scallion — humor like The Onion
  - The Ground Truth — AI and ML and worms

ground_as_character: |
  Peter independently named **The Ground Truth** as the publication about AI/ML and **worms** —
  and noted that **Ground itself is a character**, whose pets are all the worms living inside his
  directory. Ground is editor of The Ground Truth. This matches the lloooomm/MOOLLM canon before
  Palm's field expedition made it public in the notebook.

worm_pipeline_peter_described: |
  Worms as cursors — even dual cursors like selections (point and mark). Input mouth (dot), output
  anus (mark): eat(), transform(), poop(), move forward. Chain worms; worms within worms. Castings
  return home through a wormhole so they don't leave poop on the data they're eating (nondestructive
  by default). Write-only numbered .001 .002 .003 output files for batch processes — map/reduce
  agents or pipes. Tagline Peter offered: "Worm Pipelines: We're Better Than Boring, We're WORMS!"

emacs_parallel: |
  "It's like save-excursion in Emacs!" — Peter's own comparison for region-bound transformation.

moollm_reading_peter_requested: |
