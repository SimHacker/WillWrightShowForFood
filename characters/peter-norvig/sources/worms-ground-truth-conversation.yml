what_don_described: |
  Don walked Peter through his metadata pipeline: consistent metadata for 251 generated web
  pages (summaries, keywords, ratings), clustered into categories, then organized into
  "publications" with editorial voice and style.

publications_don_named:  # Don's own naming, from his messages
  - Looming Stone — Hunter S Thompson's usual outlet
  - LOOMIT Press — technical stuff
  - Jacquard — artsy fartsy style magazine
  - Nurture — counterpart to Nature
  - OMNISCENT — sci-fi speculative OMNI counterpart
  - The Flat Glober — enigmatic self-contradictory conspiracy-theory X-Files publication
  - The Scallion — humor like The Onion
  - The Ground Truth — AI and ML and worms

ground_as_character: |
  Don described **The Ground Truth** as the publication about AI/ML and **worms** — and that
  **Ground itself is a character**, whose pets are all the worms living inside his directory;
  Ground is editor of The Ground Truth. This is Don describing his own lloooomm/MOOLLM canon
  to Peter, months before Palm's field notebook made it public.

worm_pipeline_don_described: |
  Worms as cursors — even dual cursors like selections (point and mark). Input mouth (dot),
  output anus (mark): eat(), transform(), poop(), move forward. Chain worms; worms within
  worms. Castings return home through a wormhole so they don't leave poop on the data they're
  eating (nondestructive by default). Write-only numbered .001 .002 .003 output files for
  batch processes — map/reduce agents or pipes. "It's like save-excursion in Emacs!"
  Tagline: "Worm Pipelines: We're Better Than Boring, We're WORMS!"

scruffy_neat_line: |
  "It's the triumph of scruffy AI running on the substrate of neat AI! It's ok if it's not
  perfect or exact." — from the January thread.
  ATTRIBUTION FLAG: speaker not yet confirmed against the original thread. Until Don
  verifies, cite as "from the January thread" — do NOT quote it as Peter's.

