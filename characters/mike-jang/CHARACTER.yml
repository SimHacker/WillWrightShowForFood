bio:
  summary: >
    **Mike Jang** — long-time Industrial Designer, Atari coin-op division (mid-1970s through 1980s).
    San Jose State; ergonomics advocate; patents in his name. Cabinets include **Starship 1**,
    **Missile Command** (prototype → production marquee fix), **Star Wars** cockpit (hydraulic-ram /
    Millennium Falcon ramp motifs; truss roof), **Hard Drivin'**, **RoadBlasters** (oversaw early
    Ireland production with Dave Cook), **Stun Runner**, unfinished **Starfighter** (appeared in the
    film), **Firefox** control panel, **Hydra**, and more. Donated Atari documents to Stanford
    (*Michael Jang collection of Atari materials, 1978–1991*). Post-Atari: hot-rodding — customized
    1951 Mercury coupe.

