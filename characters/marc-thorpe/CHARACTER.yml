relationship:
  to_project: |
    Invented Robot Wars (1994, Fort Mason SF). Stupid Fun Club partner with Will Wright
    and Mike Winter. Repo Wars vision continues his gladiatorial-sport + merch model for
    code resurrection events.

bio:
  summary: |
    **Marc Thorpe** created **Robot Wars** — radio-controlled combat as live sport and art
    installation. ILM/LucasToys veteran; Wired cover (Feb 1994, Jef Raskin) launched the
    sport. First event competitors included Will Wright (JulieBot), Mark Setrakian, Caleb
    Cheung, Mike Winter. Later Stupid Fun Club conceptual designer; EA mechanical engineer;
    BattleBots Hall of Fame 2022.

