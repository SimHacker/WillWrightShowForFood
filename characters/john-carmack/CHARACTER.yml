bio:
  summary: |
    **John Carmack** — co-founder of **id Software**; lead programmer on *Commander
    Keen*, *Wolfenstein 3D*, *Doom*, *Quake* and their engine lineages that defined
    real-time 3D on PCs. Later CTO of **Oculus** / Meta Reality Labs work, then
    independent focus including aerospace / Keen Technologies. Public communicator
    of low-level graphics, networking, and VR systems thinking. Repo adjacency:
    Jennell Jaquays (Quake level design), Rebecca Heineman (Wolf3D ports), Don's
    HN threads on engines and Dynabook tangents — not a claim of personal friendship.

why_invited:
  engines: "Primary voice on how real-time worlds became possible on cheap hardware."
  craft: "Builder episodes — constraints, shipping, open technical explanation."
  memorial_adjacency: "Quake-era colleagues memorialized elsewhere (Jaquays) — discuss work, not gossip."

