  summary: "**Craig Latta** — livecoding composer and research computer scientist (UC Berkeley, CS + Music), founder of **Black Page Digital**. Creator of **Caffeine** (livecode the web — the SqueakJS Smalltalk VM bridged into browsers/Deno with dynamically generated WebAssembly), the **Context** minimal Squeak distribution, and **Catalyst** (a self-hosted WASM-GC Smalltalk VM with LLM-assisted method translation). Squeak Foundation board member, Appsterdam volunteer; Amsterdam ⇄ Berkeley. Rehearsed the Vanessa memorial with Don (2026-07-20 — the session that sparked the prestoration); also invited to OpenLaszlo → Declare reunion (what prototypes are / live objects) and a Caffeine solo."

