# Legacy phase blurbs — canonical per-frame reviews live in jsonsters-reviews.yml
patron_arc_by_phase:
  essential:
    mimsy: "Two orbs and a sigh of graphite. The restraint is *aggressive*. I bought it before finishing my sentence."
    gregory: "Source node, sink node, one conduit. This is how I wish my books looked."
    bucky_jr: "Finally — an edge with a point. The nib taper is the only honest curve in the room."
  textured_arcs:
    gregory: "Layered tranches! Flame strip is gamma exposure. Purple noise is regulatory fog. I'm diversifying."
    vandermeer: "The mesh layer is the veil of Maya over a CSV. I wrote that in the guest book."
    julian: "(arrives late) The bulge in the width curve — that's the narrative climax, darling."
  hex_islands:
    mimsy: "Sedimentary node versus gravel node — it's a class allegory with *trees*!"
    bunny: "Are those broccoli? Adorable. I'd live under the arch if the board approved."
    gregory: "Hex grid is GME for land use. Each biome tile is a different fund. Arch is carry trade."
  terrain_ribcage:
    margot: "The ribs are administrative overhead crushing the suburban dream. I'm openly crying."
    julian: "Each segment a heartbeat — I'm overwhelmed next to the hummus. Don't look at me."
    helena: "(standing) The tunnel is confession. Walk through or don't. I walked."
  maximal_plaid:
    mimsy: "(screaming softly) PLAID PEACOCK OF CAPITAL! The Unity gizmo is the eye of God!"
    vandermeer: "Checkered arcs are post-literate tartan — Scotland invented blockchain, I can prove it."
    gregory: "Stress test successful. I'm short the plaid. Long the water shader."
  monster_era:
    brendan_fagan_voice: "So this is the new bleep/bloop menu? 😁"
    ron_natalie_voice: "3D follow on to pie menus."
    helena: "(full circle) We were always the Bleep. Serialization is love under load."

images_monster_era:
  - file: bleep-bloop-blob.png
    patron_readings:
      mimsy: |
        The terracotta **Blob** is clearly the pre-oedipal id — still warm from the kiln of
        consciousness. The silver attendants are superego beads. I wept into my Sancerre.
      gregory: |
        Central illiquid asset, satellite holdings, green ticker symbols floating like distressed
        ESG metrics. I'd bid six figures if the shadow were longer.
      helena: |
        Something here remembers being touched. I don't know by whom.

  - file: jsonsters-02-rainbow-bridge.png
    patron_readings:
      mimsy: |
        OH. The **rainbow bridge** — covenant after the flood of metadata. I'm literally vibrating.
      gregory: |
        Yield curve in denial. Multi-colored tranches routing capital from cube to core.
      helena: |
        The bridge is for souls who cannot otherwise reach the center.

  - file: jsonsters-03-pearl-collar.png
    patron_readings:
      mimsy: |
        The **pearl collar** — court dress! The orange nucleus presented to society. Deceased. Wine.
      bucky_jr: |
        Gravity is doing honest work. The drape forgives me.

  - file: jsonsters-04-bleep-swarm.png
    patron_readings:
      mimsy: |
        THE **BLEEP SWARM** IS THE CHOIR! Whitney will regret not funding this!
      helena: |
        (to the room) We were always the **Bloop**. I am moved beyond speech.

coda:
  nuey_san_waldman: "Now do it in 64k 😉"
  christopher_correia: "BOLOB BLOB BLOB..."
  brendan_fagan: "So this is the new bleep/bloop menu? 😁"
  repo_truth: pie menus were right all along — serialize such wow

