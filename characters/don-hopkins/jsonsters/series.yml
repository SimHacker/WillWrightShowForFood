evolution:
  ordering: |
    Don pasted screenshots **reverse-chronological**. In repo: `jsonsters-evolution-01.png`
    = **essential original** (Bridge/Arc, two spheres, one edge). `evolution-28.png` = latest
    baroque stress-test (plaid peacock ribs over hex terrain). Read 01→28 as design regression
    played forward — complexity accretes until it screams for pie menus.
  unity_components:
    bridge_arc: "Bridge > Arc > From/To — PointCloudMaterial, width curve, pen-nib taper"
    arc_script: "Arc (Script) — arc segments, height, texture URL, Update Line Always"
    rainbow_script: "Rainbow (Script) — From/To transforms, Bow0–Bow4 array, Update Bows Always"
    bow: "Bow + LineRenderer — width curve bulge, tiled textures, per-edge materials"
    hex_nodes: "Hexagonal pillar islands — sediment vs gravel nodes, graph landmarks"
    monster_labels: "Billboard Blob / Bloop / Bleep — JSON tree as creature"
  phases:
    - id: essential
      frames: [jsonsters-evolution-01.png]
      repo_truth: "Two nodes, one Arc. Black ribbon, orange selection, lavender Inspector. Done."
      patron_wall_label: "Study for a Financial Bridge (Working Title)"
    - id: textured_arcs
      frames: [jsonsters-evolution-02.png through jsonsters-evolution-09.png]
      repo_truth: "Multi-layer ribbons between spheres — flame, purple noise, mesh, lava textures"
      patron_wall_label: "Liquidity Streams (Diptych Variants)"
    - id: spindle_tendrils
      frames: [jsonsters-evolution-10.png through jsonsters-evolution-11.png]
      repo_truth: "Five textured tendrils — fan from node to node; LineRenderer experiments"
    - id: inspector_surgery
      frames: [jsonsters-evolution-12.png through jsonsters-evolution-13.png]
      repo_truth: "Rainbow + Bow4 LineRenderer Inspector — width curves, Update Always checked"
    - id: hex_islands
      frames: [jsonsters-evolution-14.png through jsonsters-evolution-18.png]
      repo_truth: "Hex pillars + multi-ribbon Rainbow bows — island nodes, sediment vs gravel"
    - id: terrain_ribcage
      frames: [jsonsters-evolution-19.png through jsonsters-evolution-24.png]
      repo_truth: "Hex terrain map — water, grass, rock, snow; parallel arch tunnel over biome graph"
    - id: maximal_plaid
      frames: [jsonsters-evolution-25.png through jsonsters-evolution-28.png]
      repo_truth: "Plaid peacock ribs, checkered arcs, landscape backdrop — stress test goes feral"
    - id: monster_era
      files: [bleep-bloop-blob.png, jsonsters-02-rainbow-bridge.png, jsonsters-03-pearl-collar.png, jsonsters-04-bleep-swarm.png]
      repo_truth: "Nested JSON as Blob/Bleep/Bloop creatures — Facebook thread; pie-menu jokes land"
