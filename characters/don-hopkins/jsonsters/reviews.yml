series: JSONsters
critics: critics.yml

rooms:

  - id: bridge_studies
    series_title: "Studies in Serialized Ontology"
    room_label: "Room I — Bridge Studies"
    frames:
      - file: jsonsters-evolution-01.png
        wall_title: "Study for a Financial Bridge (Working Title)"
        repo_truth: "Two nodes, one Arc. Black ribbon, orange selection, lavender Inspector."
        reviews:
          mimsy: "Two orbs and a sigh of graphite. The restraint is *aggressive*. I bought it before finishing my sentence."
          gregory: "Source node, sink node, one conduit. This is how I wish my books looked."
          vandermeer: "The black ribbon is mourning worn by capital — Benjamin wept, I have the footnote."
          bucky-jr: "Finally — an edge with a point. The nib taper is the only honest curve in the room."
          helena: "Something here remembers being chosen. I stood a long time."
          margot: "Two spheres and a leash — even minimal graphs administer distance."
          julian: "(arrives late) The arc is foreplay. Don't explain it to me."
          bunny: "Two balls and a stick! Is it sports? I'd live between them."

  - id: liquidity_streams
    series_title: "Liquidity Streams (Diptych Variants)"
    room_label: "Room II — Liquidity Streams"
    frames:
      - file: jsonsters-evolution-02.png
        wall_title: "Conduit No. 2 — Black Ribbon Variation"
        repo_truth: "Layered ribbon arc between spheres — texture experiments begin."
        reviews:
          mimsy: "The second conduit *apologizes* to the first. Diptych energy. Sancerre."
          gregory: "Second tranche, same counterparty. I'm adding to position."
          vandermeer: "Duplication is dialectics without the reading list."
          bucky-jr: "Width curve still honest. Second pass forgives the first."
          helena: "Twin streams — one for grief, one for return."
          margot: "They layered the leash so we wouldn't notice the choke."
          julian: "Two ribbons now — I'm scheduling therapy."
          bunny: "Double spaghetti! More room to live underneath."

      - file: jsonsters-evolution-03.png
        wall_title: "Conduit No. 3 — Layered Accretion"
        repo_truth: "Multi-layer ribbon stack on single arc."
        reviews:
          mimsy: "Accretion as *policy*. The stack is a manifesto."
          gregory: "Stacked exposures — this is how fraud looks when it's beautiful."
          vandermeer: "Strata are sedimentary ideology. I lecture on this."
          bucky-jr: "Layers without collapse. Rare."
          helena: "Each layer a year I didn't speak."
          margot: "Accretion is how institutions bury complaints."
          julian: "The bulge deepens. I'm flushed."
          bunny: "Like cake! Can the board approve cake?"

      - file: jsonsters-evolution-04.png
        wall_title: "Conduit No. 4 — Violet Noise"
        repo_truth: "Purple/violet textured ribbon layer on arc."
        reviews:
          mimsy: "Violet noise — the color of *withheld* disclosure. Whitney, wake up."
          gregory: "Purple book is regulatory fog. I'm hedged."
          vandermeer: "Lavender Inspector panel is the veil of Maya. I said it first."
          bucky-jr: "Noise texture lies. But the curve doesn't."
          helena: "Violet was my mother's favorite. I wasn't expecting that here."
          margot: "Noise hides the violence in the edge shader."
          julian: "Purple is erotic caution. I'm taking notes."
          bunny: "Pretty purple streamers! Festive."

      - file: jsonsters-evolution-05.png
        wall_title: "Conduit No. 5 — Flame and Mesh"
        repo_truth: "Flame strip, purple noise, mesh textures on layered arc."
        reviews:
          mimsy: "Flame strip! The work is *combusting* semiotics!"
          gregory: "Flame strip is gamma exposure. Mesh is netting illiquidity. Diversified."
          vandermeer: "Fire over mesh — Prometheus outsourced to a hedge fund."
          bucky-jr: "Flame texture on a line is dishonest. I forgive the mesh."
          helena: "Fire without heat — like prayers that don't arrive."
          margot: "Burning the mesh won't free the nodes."
          julian: "Flame at the climax — obviously."
          bunny: "Ooh, campfire! Can we roast broccoli?"

      - file: jsonsters-evolution-06.png
        wall_title: "Twin Conduits — Sphere Pair I"
        repo_truth: "Multi-ribbon arcs between two sphere nodes."
        reviews:
          mimsy: "Twin conduits — *dialogue*! The spheres are in couples therapy."
          gregory: "Pair trade visualized. Long sphere A, short sphere B."
          vandermeer: "Dyadic relations are always already leveraged."
          bucky-jr: "Two edges, one honesty test. Pass."
          helena: "They speak across the gap. I used to do that."
          margot: "Couples therapy sponsored by administrative UI."
          julian: "Two arcs — a love triangle missing me."
          bunny: "Two bridges! I'd live on the left one."

      - file: jsonsters-evolution-07.png
        wall_title: "Twin Conduits — Sphere Pair II"
        repo_truth: "Variant multi-ribbon arc materials between spheres."
        reviews:
          mimsy: "Variant two — the couple has *fought*. Still married in graphite."
          gregory: "Correlation breakdown. Rebalancing into flame strip."
          vandermeer: "Iteration is historiography for people who don't read."
          bucky-jr: "Second pair, same taper. Consistency is craft."
          helena: "The fight healed. You can see it in the ribbon."
          margot: "Reconciliation propaganda."
          julian: "Make-up arc. Devastating."
          bunny: "They made up! Happy ending."

      - file: jsonsters-evolution-08.png
        wall_title: "Twin Conduits — Sphere Pair III"
        repo_truth: "Further multi-ribbon material variants."
        reviews:
          mimsy: "Triptych energy in a diptych room. *Illegal* and I love it."
          gregory: "Third variant — I'm scaling in."
          vandermeer: "Trinity of conduits — Father, Son, CSV."
          bucky-jr: "Third pass. Still no collapse."
          helena: "Third prayer. Someone heard."
          margot: "Trinity sells better than truth."
          julian: "Three's a crowd. I'm the crowd."
          bunny: "Three bridges means three bedrooms. Board?"

      - file: jsonsters-evolution-09.png
        wall_title: "Twin Conduits — Sphere Pair IV"
        repo_truth: "Late liquidity-stream variant before tendril phase."
        reviews:
          mimsy: "The last conduit before the room turns. *Aggressive* cliffhanger."
          gregory: "Closing the liquidity-stream book. P&L positive."
          vandermeer: "End of Room II is always apocalyptic. I have a syllabus."
          bucky-jr: "Room ends on a clean edge. Respect."
          helena: "Goodbye to the simple bridges. I'm ready."
          margot: "They fattened the stream before the slaughter."
          julian: "Finale of Act One — I'm breathless."
          bunny: "Bye-bye spaghetti! What's next room?"

