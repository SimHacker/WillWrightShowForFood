# Logo Adventure — C64 Terrapin Logo (1983)
# Girder for machines; humans read logo-adventure-c64-terrapin.md

meta:
  title: Logo Adventure for C64 Terrapin Logo
  author: Don Hopkins
  year: 1983
  age_at_ship: 17
  kind: commercial_first_sale
  platform: Commodore 64
  publisher: Terrapin Software
  distribution: Terrapin Logo utilities disk

hook: |
  No separate parser — the Logo top-level read-eval-print loop *is* the adventure.
  Words like LOOK, N, S, E, W, TAKE, EXAMINE extend the interpreter; list processing
  and functional style do the work a text adventure engine would normally hide.

why_terrapin_wanted_it: |
  Terrapin wanted a simple non-graphical game on the utilities disk that showed off
  Logo's list processing and functional programming — not another turtle demo.

parser_design:
  no_main_program: true
  mechanism: extended Logo interpreter top level
  cheat_friendly: true
  pedagogy: examining and modifying world state teaches Logo, not just play

