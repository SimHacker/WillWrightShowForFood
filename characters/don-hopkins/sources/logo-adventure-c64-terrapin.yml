      with LOAD to navigate across roomsets.
  - who: Don Hopkins
    thread: 12207532
    text: |
      The nice thing was that there was no "main program" or parser, it just extended
      the Logo interpreter top level to be an adventure game!
  - who: Don Hopkins
    thread: 38016554
    text: |
      I wrote a Logo Adventure for Terrapin that they shipped on the C64, the point of
      which was to show off Logo's list processing and functional features, because most
      of the other examples were focused on turtle graphics.

implementation_notes:
  - CMD / TOPLEVEL pattern — commands as Logo words, not a separate grammar
  - INITITEMS and world state as Logo data structures
  - Room navigation via LOAD overlays across roomsets (per Leigh Klotz)
  - Non-graphical by design — complements turtle-heavy Terrapin marketing

show_hooks:
  - REPL-as-parser → MOOLLM microworlds where the language *is* the game shell
  - Cheat-friendly = constructionist honesty (Brian's "computing is your birthright")
  - Pair with Brian's CSLS list/functional chapters and Snap! first-class data
  - Scott Adams lineage — same adventure grammar, different implementation strategy

