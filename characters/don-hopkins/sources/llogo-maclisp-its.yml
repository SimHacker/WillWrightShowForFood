tagline: |
  Where the rubber meets the road — Logo implemented in MacLISP with drivers for pots,
  plotters, robotic turtles, TV turtles, graphical displays, XGP laser printers, music
  devices, and decades of lab hardware.

rescue_story: |
  Don stashed the concatenated LLogo sources from the MIT-AI ITS system before the
  hardware era passed. Lars Brinkhoff and collaborators ported it to run under MacLisp
  on a PDP-10 emulator; display works on emulated Knight TV. Full historical hardware
  emulation is ongoing.

analysis_status: open
analysis_notes: |
  Driver-level discussion with collaborators is in progress. This dossier captures
  architecture and preservation links; deep hardware walkthroughs will be merged
  when pulled in.

architecture:
  model: Logo-in-Lisp
  dual_obarrays: true
  readtable_switching: Logo readtable vs Lisp readtable; # for cross-obarray read
  conditional_compilation:
    - ITS vs DEC10 vs Multics via square-bracket readmacros
    - CLOGO vs 11LOGO compatibility switches
  define_macro_system: DEFINE file auto-loaded; compiler-expanded macros

module_files:
  - name: DEFINE
    role: readmacros, compiler macros, DEFINE function bootstrap
  - name: SETUP
    role: obarrays, readtables, utilities, homonym checking
  - name: READER
    role: LOGOREAD, LINE, editing chars, history
  - name: PARSER
    role: Logo → Lisp translation, infix, PARSEMACRO
  - name: UNEDIT
    role: editor, TO/END, line numbers
  - name: PRINT
    role: LOGO-PRINT, listing, DPRINC on ITS displays
  - name: PRIMIT
    role: most Logo primitives, turtle allocator hooks
  - name: ERROR
    role: LOGOBREAK, stack hacking, GC daemons
  - name: TVRTLE / TURTLE
    role: TV turtle, GT40/340, Germland, music optional loads
  - name: GERMLAND
    role: grid microworld on ITS terminals
  - name: MUSIC
    role: LLOGO music box primitives (ITS/Multics)

allocator_prompts_its:
  - '"DO YOU WANT TO USE THE TV TURTLE?" → TVRTLE FASL'
  - '"DO YOU WANT TO USE THE DISPLAY TURTLE?" → TURTLE FASL (GT40 vs 340)'
  - 'GERMLAND? → GERM FASL'
  - '"MUSIC BOX?" → MUSIC FASL'

hardware_drivers_mentioned:
  - pots (joystick / dial inputs)
  - plotters
  - robotic turtles
  - TV turtles (Knight TV buffer)
  - graphical displays (GT40, 340)
  - XGP laser printers
  - music devices / music box
  - Germland split-screen grid on display TTYs

