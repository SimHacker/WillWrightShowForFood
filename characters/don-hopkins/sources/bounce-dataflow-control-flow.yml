gist: |
  **Bounce** (David Levitt's derivative of VPL **Body Electric**) is a real-time patch-cord
  dataflow language. Conditionals and loops do **not** need explicit continuation-passing style:
  orthogonal mechanisms handle selection, sequencing, and iteration while the runtime computes a
  **partial order** from wires. Brian Harvey (Sep 2020 Snap! forum): dataflow fits Snap!'s functional
  paradigm but he gets stuck on conditional evaluation without CPS — Bounce is Don's worked example of
  another answer.

execution_model:
  partial_order: "Icons execute once per frame in dependency order from wires — programmer thinks dataflow, not program-counter maze (contrast Max)"
  against_the_flow: "Upstream wire from downstream output → last frame's value (one-frame delay); can build counters and velocity without explicit latch"
  loops_via_delay: "Feedback wire delays one frame — `+` with constant 1 on one input, output to other = per-frame counter"

conditionals:
  switch_icon:
    what: "Pure dataflow relay — third binary input selects between two data inputs"
    reads_like: "Condition ? A : B on wires"
  enable_line:
    what: "Implicit input+output on every module — power switch / gate"
    uses:
      - "Turn nested modules or individual icons on/off (control flow)"
      - "Sequence side-effecting icons when partial order is insufficient — chain enable wires for ordering dependency"
      - "Implicit output latch when off (last value holds) — David discourages; prefer explicit latch icon"
    david_levitt_note: "Discourages using enable-off as implicit latch; use explicit latch instead"

loops:
  while_encapsulation:
    what: "Nested folder module; same input/output arity; one binary conditional input"
    behavior: "While condition true, interior executes; outputs loop back to inputs — telescoping iteration"
    limit: "Recursion not really supported this way (implementation); stateful modules like `smooth` break inside while — see stateful_modules problem"
  frame_feedback: "Against-the-flow wires as alternative to while for some patterns"

contrast_max:
  max: "Explicit control-flow drawing — program counter navigates maze of icons"
  bounce: "Dataflow switching + enable sequencing + telescoping while — orthogonal concepts, not both projected onto same 2D maze"
  grasshopper: "Functional dataflow — Condition node, A, B (Don's HN 10100932 taxonomy)"
  simantics: "Control flow — branch follows program counter (The Sims visual VM)"

