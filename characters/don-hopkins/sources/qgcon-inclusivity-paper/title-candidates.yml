working_favorite: "How Inclusivity Saved The Sims"

subtitle: |
  The evolution of The Sims same-sex relationships, marriage, sexual preference,
  and gender expression — how procedural rhetoric saved the franchise, and how
  Soul City + Soul Saver save player souls from oligarch-owned games today.

subtitle_2026_addendum: |
  From McKissick's Soul City NC (Nixon HUD, Helms foreclosure) to EA's reported
  Saudi-backed buyout: inclusivity as mechanism in rules **and** in exit rails
  (Sims ⇔ Soul City ⇔ Tiny Life).

subtitle_alternates:
  - "How The Sims became more inclusive over time."
  - "The history of inclusivity in The Sims."

inclusive_term: "inclusive"  # umbrella for relationships, marriage, preference, gender expression

