    - "Soul Bridges — Sims ⇔ Soul City ⇔ Tiny Life (Ell/Ellpeck); Stardew; Spore; …"
    - "Exchange revival via GitHub + Steam Community Guides — not EA dependency"
    - "Wayback / Archive tornado (Brewster Kahle beat) — resurrect Family Album literature"
    - "Indie exodus as feature not bug — characters evacuate to worlds that still ship share + story"

tiny_life:
  why: |
    Solo queer indie life sim; Workshop + export; praised by ex–Creator Network voices; natural
    spoke when EA removed Exchange from Legacy Collection.
  bridge: ../../../../repo-shows/will-wright-premiere/game-bridge-sims-tiny-life.yml
  ellpeck: ../../../ellpeck/
  line: "Sims characters can evacuate the EA-owned property and live happier lives in Tiny Life"

paper_structure_additions:
  act_1: "How inclusivity saved The Sims (1999–2020) — procedural rhetoric + timeline"
  act_2: "Soul City NC namesake — Nixon, Helms, second chances; why we stole the name carefully"
  act_3: "2025 ownership change — community fears; Creator Network exodus; Legacy gap"
  act_4: "Soul City + Soul Saver — mechanism for saving souls today; Tiny Life bridge as case study"
  conclusion: |
    Inclusivity saved the franchise once by making better rules and tools. It saves players now
    by making **exit** — portable souls, federated publishing, indie destinations — as real as
    the original inclusion was in SimAntics.

