# Soul City + Soul Saver — QGCon paper spine (2026 reframe)
# Extends "How Inclusivity Saved The Sims" from franchise history → player infrastructure today

thesis:
  headline: "How Inclusivity Saved The Sims — and what saves the sims now"
  saved_then: |
    Inclusivity was not a late patch or a marketing slide — it was **playability** and
    **procedural rhetoric** (Ian Bogost): argument encoded in SimAntics rules, Motive.c failure
    modes, masking (McCloud), constructionist microworlds (Papert), community tools (Family Album,
    Exchange, Transmogrifier), and twenty years of society ↔ game co-evolution across gender, race,
    sexuality, and expression. That stack **saved** the franchise culturally and commercially.
  saves_now: |
    When oligarch-owned publishers (reported ~$55B EA buyout: Saudi PIF, Silver Lake, Affinity
    Partners / Jared Kushner in press) and religious-fanatic censorship markets threaten to
    repossess representation, the counter-move is **infrastructure**: **Soul City** (git-checked-in
    hub for round-trippable character **soul-files**) and **Soul Saver** tooling (**SoulAngel**:
    DVR, Family Album revival, Soul Bridges) to **relocate** player souls from walled gardens into
    indie worlds — **Tiny Life**, Stardew, Shattered Pixel Dungeon, and federated creator catalogs.

procedural_rhetoric:
  bogost: |
    Mechanism, not decoration. Wedding Playset (inclusion agitprop), Dumbold (institutional farce),
    same-sex relationship rules — all argument in processes. Soul City extends rhetoric to **platform**:
    publish gates, attribution, and bridge schemas that say who gets recognized and where souls may travel.
  cite: ../procedural-rhetoric-theory.yml

inclusivity_axes:
  not_only_lgbtq: |
    Paper spans gender (binary → fluid → CAS medical wearables), race and representation in CAS,
    LGBTQ+ relationships/marriage/preference (Patrick Barrett arc), modding as player-authored
    inclusion (Tanja Sihvonen), safe-space storytelling (Family Album), and flying under hostile
    radar (Russia ban as badge, assimilation rhetoric).
  qgcon_fit: "Queer game design conference — marriage-law parallel track in timeline.yml"

soul_city_namesake:
  not_confused_with: "Soul City, North Carolina — Floyd B. McKissick's anti-racist planned town"
  nixon: |
    HUD New Communities funding (1972) — Nixon backed Black-led Soul City NC for coalition math,
    not conviction. Audit cleared the project; Jesse Helms smear + economy killed it. Incubator
    became a prison — **inverted coda** for our project.
  our_soul_city: |
    Liminal hub between games where souls meet, mate, and **cannot be foreclosed** (GPL + git).
    Namesake sentence required on air: *not to be confused with, but inspired by*.
  sources:
    - ../../../../repo-shows/will-wright-premiere/soul-city-namesake.md
    - https://www.youtube.com/watch?v=R2karaKGgkk

soul_saver:
  brand: Soul Saver  # mission / Repo Show naming (see process/repo-show-class-naming.md)
  product: SoulAngel  # MicropolisCore/apps/soul-angel — universal companion + per-game Soul Bridges
  what_it_saves: |
    Character souls locked in EA-owned saves, dead Exchange URLs, Legacy Collection without sharing,
    and platforms subject to sovereign-wealth or censorship pressure. Read/write soul-files; publish
    to Soul City; bridge outward.
  hydraulics: |
    game-bridge-soul-hydraulics.yml — repossessing lost souls from dead formats (arrow reversed
    from NC Soultech → prison).

