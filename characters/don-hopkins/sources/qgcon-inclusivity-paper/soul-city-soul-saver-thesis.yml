    tiny_life_praise: "Plumbella: feels like Sims 1; James Turner: what we know and love"
    wwsff_stance: |
      Solidarity interviews — not partisan theater. Document functional impact on LGBTQ+ community
      and sharing rails. Soul City as **fan infrastructure + attribution**; lift creators first.
  what_to_do:
