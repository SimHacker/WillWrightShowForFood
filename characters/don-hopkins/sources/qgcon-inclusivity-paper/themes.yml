# Thematic sections — QGCon paper outline (beyond timeline)

simulator-effect:
  will_definition: |
    Players imagine the simulation is vastly more detailed than it is — don't talk them out of it.
  two_computers: "Electronic desk machine + biological imagination in player's head"
  reverse_over_engineering: |
    Desirable outcome: players over-estimate simulator work; imagination fills gaps.
  zodiac_confirmation_bias:
    story: |
      Will insisted on real Zodiac signs (not fictional SimSigns) to leverage emotional baggage.
      UI showed sign from personality vector; zero behavior code — testers reported sign had
      TOO MUCH effect. "Astrillogical signs."
    url: https://www.youtube.com/watch?v=ffzt12tEGpY
  simlish: |
    Unfamiliar language + tone → players read in more (Claire Curtin, improv comedians).

masking_mcccloud:
  books: [Understanding Comics, Reinventing Comics]
  will_endorsement: "Anyone involved in interactive entertainment should read this book."
  technique: "Abstract characters (low-poly sims) against realistic pre-rendered grounds"
  tintin_parallel: "Hergé — concrete background, abstract figures → projective identification"
  gutters: "The Sims encourages players to get their mind into the gutter — player fills transitions"

constructionism:
