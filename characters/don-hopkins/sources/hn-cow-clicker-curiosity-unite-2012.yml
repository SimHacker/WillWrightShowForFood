# Don Hopkins — HN harvest: Cow Clicker, Curiosity, Unite 2012 cow joke
# Primary voice preserved; cross-links for Ian Bogost show + cube parody

events:
  unite_2012:
    conference: "Unity Unite 2012"
    location: "Westergasfabriek, Amsterdam"
    date: 2012-08  # keynote published YouTube 2012-08-22
    keynote_video: https://www.youtube.com/watch?v=24AY4fJ66xA
    molyneux_segment_starts: "1h 08m 21s"
    crucifix_pose_quote_at: "1h 48m 06s"
    crucifix_quote: |
      Because we can dynamically put on ANY surface of the cube ANY image we like.
      So THAT's how we're going to surprise the world, is by giving clues about what's
      in the middle later on.
    don_action: |
      After Molyneux's Curiosity keynote, Don chatted him up and joked that the big secret
      inside the cube was a cow — ironic reference to Ian Bogost's Cow Clicker. Molyneux
      didn't get the joke; Don explained the Cow Clicker / Zynga-satire context; still
      didn't get it.

  curiosity:
    title: "Curiosity: What's Inside the Cube?"
    developer: 22cans / Peter Molyneux
    released: 2012-11-06
    ended: 2013-05-26
    wikipedia: https://en.wikipedia.org/wiki/Curiosity:_What%27s_Inside_the_Cube%3F
    don_characterization: |
      Epitome of dopamine addiction clickers — cop-out of game design, nothing original;
      arbitrary value becomes real value. Prize ("god of gods" in Godus) famously under-delivered.
    qz_2012: https://qz.com/34024/life-really-is-a-game-with-a-lot-of-clicks-and-then-you-die
    qz_pullquote: |
      Just ask Ian Bogost, who created the satirical social game Cow Clicker that went on to
      such absurd popularity that he felt compelled to continue developing it, trapping himself
      in an ironic loop that refuses to end.

  cow_clicker:
    see: ../../ian-bogost/sources/cow-clicker.yml

