facebook:
  don_caption: |
    RIP Heklina, the legendary queen of drag from San Francisco who founded Trannyshack and Mother,
    beloved by so many for her kind heart and volcanic wit, who left us too soon.
  comments:
    - author: Chuck Farnham
      text: "Mother was awesome"
    - author: Don Hopkins
      text: "https://www.youtube.com/watch?v=61qbUimYg9g&t=4s — Heklina | KQED Truly CA"
    - author: Don Hopkins
      text: |
        I'll never forget the cloying smell of Trannyshack: hotdogs, bacon, caramelized onions,
        marijuana, booze, smoke machines, chocolate, astroglide, glitter, sweaty trannies, cheeky punks,
        fabulous freaks, and nuns with dirty habits.
    - author: Don Hopkins
      text: |
        But there was one distinctive, commemorative item that the local TV reporters couldn't fully
        comment on — a spotlit chair that was in the center of the room, on stage at Oasis, surrounded
        by flowers. That's because it commemorates one of Heklina's best-known sexual proclivities, and
        something she was known to do to select audience members she pulled on stage back in the day at
        Trannyshack at the Stud: rimming. This was a symbolic rimming chair, with Heklina's face painted,
        mouth open, on the seat — a hilarious IYKYK object for all the friends who gathered to mourn on
        Monday, and an item that recalls a raunchier, not-ready-for-prime-time era in SF drag with which
        Heklina will always be associated.
      link: https://sfist.com/news/local-news-stations-cover-heklinas-memorial-at-oasis
    - author: Don Hopkins
      text: '"Tales of the Tails of the City"'

