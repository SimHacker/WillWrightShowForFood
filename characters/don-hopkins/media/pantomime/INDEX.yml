# Pantomime gallery — Don Hopkins media room
# Bug Farm AR/VR · Oculus SDK demos · Unity3D w/ David Levitt
# Copyleft 1984 mail art lives with RMS — not in this wing.

room:
  id: pantomime-gallery
  name: Pantomime Gallery
  parent: ../../media.md
  company: Pantomime Corporation (~2014)
  cofounders: [Don Hopkins, David Levitt]
  donhopkins_tech: private (not in this repo)

what_this_is:
  pitch: |
    **Pantomime** — physically realistic, networked AR/VR on phones and tablets as portals
    (no headset required). **Bug Farm** is the creepy bug-squisher: reach in with your hands,
    squash flies and spiders on a wooden table, green splats and yellow hit-flares at 60 FPS.
    Early **Oculus SDK** demos include *Too many butterflies!* — stereo barrel distortion,
    blue morphos swarming a stone hall. Don, **David Levitt**, and **Nelson** hacked it in **Unity3D**
    (PantomimeSoccer, PantomimePong, AccessoryHands, TreeJoint).

