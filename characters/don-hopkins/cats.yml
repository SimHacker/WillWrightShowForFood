  - ./ideas.md
  - ../../apps/performance-space/faceball-construction-set.yml   # talking-selfies → talking cat faces
  - ../../process/repo-show-branding.yml                          # interstitials in show orchestration
  - ../../process/repo-show-format.yml                            # directors-cuts: short-form between-segment
