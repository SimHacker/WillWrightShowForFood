  google:
    automotive: |
      Pitched integrating Google's maps into embedded automotive offerings shortly after joining,
      which led to Google Automotive Services — she names Volvo, BMW and Ford among the customers.
    data_services: |
      Her team then widened data services beyond automotive, enabling scaled connections to thousands
      of data sources: authoritative GIS datasets, transit feeds, road incident feeds, EV data
      providers, Waze. Stated outcomes were high-volume, cost-efficient data for Geo and better
      partnerships with cities and governments.
  vantor:
    role: "VP of Engineering"
    fact: |
      Mapping foundations — the lowest layers, collected from satellites. Led the launch and evolution
      of Vantor's Spatial Intelligence Platform (Tensorglobe): large-scale high-quality imagery
      access, satellite tasking for up-to-date high-resolution capture, and services on top including
      AI-powered insights and site monitoring.
