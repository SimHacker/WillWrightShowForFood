career:
  games:
    fact: "Worked on and led SimCity 3000, which became the top-selling PC game in its year of release."
    motivation_stated: "Started in games with a vision of unlocking human creativity through open-ended game design."
    ea_overlap_with_don: "1997-09 — 2000-03, per LinkedIn's own shared-employer highlight"
    ea_role_stated: |
      Director of Development for SimCity 3000, later Executive Producer for the SimCity franchise,
      with involvement in studio executive leadership and direction of other products including
      The Sims.
    perpetual_entertainment: |
      First employee of a startup that reached nearly 200 people; three VC rounds, a Sony publishing
      deal, and the Star Trek licence. Development focus on Gods and Heroes, an MMO.
  dash_navigation:
    fact: |
      Principal Software Engineer, 2007-01 to 2011-12: UI and graphics engineering lead for embedded
      vehicle navigation software, and after the RIM acquisition primarily responsible for
      server-side routing and guidance services.
    why_it_matters: |
      Dash Navigation built the Dash Express, the connected two-way PND — the thesis TomTom and
      Garmin declined to bet on, in the years Don was inside TomTom watching the category get eaten
      by phones. She built its cockpit; he watched the incumbent lose. Same war, opposite buildings.
  apple:
    fact: "Built and led parts of mapping and navigation products."
    detail_stated: |
      Named features she drove or led: turn-by-turn driving and walking navigation, suggested
      destinations, Apple Watch navigation, CarPlay navigation, transit navigation, China navigation,
      MapKit JS, Apple Pay business identification. Progression: senior engineer on the iOS Maps
      launch (turn-by-turn), then manager for navigation features, then manager for Maps client core
      technologies (navigation, APIs, rendering, services, analytics, web frameworks, release
      tooling), then stealth work on a next-generation maps platform.
  the_pivot:
    fact: |
      She states that SimCity introduced her to the concepts of mapping and urban planning, and that
      this led to her career focus on mapping and navigation.
    why_it_matters: "This is the eBike Safari thesis, asserted by someone whose career is the evidence."
  google:
    automotive: |
      Pitched integrating Google's maps into embedded automotive offerings shortly after joining,
      which led to Google Automotive Services — she names Volvo, GM, Ford, BMW and Honda among the
      OEM contracts, and states the product contributed over $1B in revenue. She also proposed and
      designed "Vehicle Map Service", a bi-directional map-insights exchange running in the vehicle
      to support ADAS and autonomy, and managed embedded perception and localisation support with
      NVIDIA and Qualcomm explored as partners.
    data_services: |
      Her team then widened data services beyond automotive, enabling scaled connections to thousands
      of data sources: authoritative GIS datasets, transit feeds, road incident feeds, EV data
      providers, Waze. Stated outcomes were high-volume, cost-efficient data for Geo and better
      partnerships with cities and governments.
  vantor:
    role: "VP of Engineering"
    fact: |
      Mapping foundations — the lowest layers, collected from satellites. Led the launch and evolution
      of Vantor's Spatial Intelligence Platform (Tensorglobe): large-scale high-quality imagery
      access, satellite tasking for up-to-date high-resolution capture, and services on top including
      AI-powered insights and site monitoring.
  leadership:
    fact: "States a regular practice of mentorship, coaching, community support and team development."

