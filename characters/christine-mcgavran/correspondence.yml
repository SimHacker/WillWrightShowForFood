  to.

threads:
  - id: yoot_tower_code_drop
    date: "2024-03"
    summary: |
      Christine followed the announcement to the public repo, found only the README there, and asked
      where the code actually was. Don gave her access to the management repo. She went looking for
      the art assets — the movies were easy to find and the icons and graphics were not — and found
      some. She offered to think about who could help with the Japanese comments and user-visible
      strings, which is still an open problem. She also asked whether the port would use AI to move
      the C code to web technology, which is a fair description of what MicropolisCore turned out to
      be.
    still_open:
      - Japanese comments and strings need a translator
      - Nintendo-owned content in the DS version cannot ship in an open version
      - Where the complete art assets live

