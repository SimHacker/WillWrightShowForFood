bio:
  summary: |
    Christine McGavran worked on and led **SimCity 3000**, the top-selling PC game of its release
    year, then spent her career building navigation: the cockpit of the **Dash Express** connected
    PND, turn-by-turn and CarPlay and Watch and MapKit JS at **Apple**, the embedded-automotive
    integration at **Google** that became Google Automotive Services plus the data ingestion behind
    it, and satellite imagery foundations as **VP of Engineering at Vantor**. Since **July 2026** she
    is **VP of Engineering at Mapbox, leading the teams responsible for its navigation products**.
  hats_worn: [software engineer, engineering manager, director, VP, executive producer, game designer]
  stack_worked: [embedded systems, graphics, applications, services, algorithms, big data]
  don_connection: |
    Known since the early 1990s — Don at Sun, Christine at SGI working with game developers. Later
    colleagues at Maxis/EA; LinkedIn puts the overlap at September 1997 to March 2000, which is the
    SimCity 3000 window. In March 2024 Don sent her the Yoot Tower open-source announcement and she
    took access to the management repo (see correspondence.yml).
  the_line_that_matters: |
    From her own public profile: SimCity introduced her to the concepts of mapping and urban
    planning, and that is what led to her career focus on mapping and navigation. A city simulator
    turned into a career in maps — which is the eBike Safari thesis, stated by someone who lived it.

career_notes:
  simcity_3000: "Worked on and led it; top-selling PC game in its year of release (1999)."
  dash_navigation: |
    2007–2011. UI and graphics engineering lead for embedded vehicle navigation — the Dash Express,
    the connected two-way PND — then server-side routing and guidance after RIM acquired the company.
    Don was inside TomTom for the collapse of the category Dash was trying to save.
  apple: |
    2012–2016. Turn-by-turn driving and walking, suggested destinations, Watch, CarPlay, transit,
    China, MapKit JS. Shipped on the iOS Maps launch, then managed navigation, then the whole Maps
    client core: rendering, APIs, services, analytics, release tooling.
  google: |
    Pitched integrating Google's maps into embedded automotive offerings, which became Google
    Automotive Services (she names Volvo, GM, Ford, BMW, Honda; states $1B+ revenue). Designed
    "Vehicle Map Service" — bi-directional map-insight exchange from the vehicle, for ADAS and
    autonomy — which is the car-shaped version of the eBike Safari feedback loop. Team then widened
    data services beyond automotive: authoritative GIS datasets, transit feeds, road incident feeds,
    EV data providers, Waze, and the city and government partnerships that come with them.
  vantor: |
    VP of Engineering. Led the launch and evolution of the Spatial Intelligence Platform
    (Tensorglobe): large-scale imagery access, satellite tasking for high-resolution up-to-date
    capture, and services on top including AI-powered insights and site monitoring.
  mapbox: "Current. Exact title not yet verified — do not state one until confirmed."
  also: "Regular mentorship, coaching, community support and team development."

