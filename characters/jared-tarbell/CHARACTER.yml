bio:
  summary: |
    Born 1973, Albuquerque, New Mexico; first personal computer 1987; BS Computer Science, New
    Mexico State. Built levitated.net (2000) — open-source Flash generative sketches — and
    complexification.net, the Gallery of Computation (2004): Substrate, Happy Place, Sand Traps;
    serious write-ups, prints for sale. Co-founded Etsy (July 2005) after co-founder Rob Kalin
    found him through his art site. Etsy's success funded the Levitated Toy Factory (2014, downtown
    Albuquerque): laser-cut wooden toys and artifacts from nature-inspired algorithms — LifeStar,
    Castle Builder, Invader Cubes. Flash-era book author (Flash Math Creativity, Fresh Flash, New
    Masters of Flash). Explores New Mexico wilderness when not computing.
  quote_2014_launch: |
    "The abstract gems we discover will be manufactured into actual physical artifacts using the
    finest natural materials… I believe there is magic to be discovered in this realm."

