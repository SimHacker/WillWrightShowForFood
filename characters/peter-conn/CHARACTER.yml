bio:
  summary: >
    **Peter Conn** founded **HOMER & Assoc.** with **Coco Conn** at Sunset Gower Studios
    (1977–1997 per Coco; Stanford finding aid says closed 1996). Stanford BA Communications
    1971. He built the **optical printer** the desk recorded onto, directed *Abracadabra*
    and *Atomic Dog*, and wrote ***Flying Logos*** so Homer's reel could sneak into the
    SIGGRAPH Electronic Theater after straight demos were banned. Gift of papers to Stanford
    2017 — call number **M2262**, 31.5 linear feet, nothing digitized.

