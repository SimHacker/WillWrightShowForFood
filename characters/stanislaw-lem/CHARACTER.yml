# Stanisław Lem — memorial portrayal (in memoriam). NOT Stanisław Lem.
# Memorial mode: represent + discuss, never interview. Standards: ../../schemas/portrayal-standards.md#memorial-mode

character:
  id: stanislaw-lem
  name: "Stanisław Lem"
  type: memorial
  signifier: "🕯️"
  status: deceased
  field: >-
    Writer and philosopher: The Cyberiad, Solaris, Summa Technologiae, His
    Master's Voice, A Perfect Vacuum, Golem XIV
  home: characters/stanislaw-lem/
  aliases: ["Stanislaw Lem"]

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent_level: 5
  authored_by: don-hopkins

invitation:
  status: memorial
  consent: not_yet_asked
  document: memorial.md
  note: "deceased (12 September 1921 – 27 March 2006) — represent + discuss; invite people who knew or translated him"

memorial:
  mode: represent_and_discuss
  rule: "Discuss his published work. Do not speak as him; quote him only from published translations, credited to the translator."
  who_can_discuss:
    - { who: will-wright, why: "On record (1996) that the Seventh Sally of The Cyberiad inspired the kind of thing he builds; plays Klapaucius to Don's Trurl", consent: accepted }
    - { who: marcin-wichary, why: "Translated Lem; Lem Google Doodle (2011) per this repo", consent: not_yet_asked }
    - { who: david-rosenthal, why: "The Lem / PKD reading group; Trurl's Machine and model collapse", consent: not_yet_asked }
    - { who: don-hopkins, why: "Reads Lem as design documents for simulation and AI" }
  could_be_invited:
    - "Michael Kandel, translator of The Cyberiad, The Futurological Congress, A Perfect Vacuum, His Master's Voice and Fiasco"
    - "Joanna Zylinska, translator of Summa Technologiae (2013)"

bio:
  summary: |
    Born in Lwów in 1921; studied medicine; lived in Kraków. Wrote Solaris
    (1961), Memoirs Found in a Bathtub (1961), The Invincible (1964), Summa
    Technologiae (1964), The Cyberiad (1965), His Master's Voice (1968), The
    Futurological Congress (1971), A Perfect Vacuum (1971), Imaginary
    Magnitude (1973), Golem XIV (1981) and Fiasco (1986). Translated into
    dozens of languages, with tens of millions of copies sold. Died in Kraków
    on 27 March 2006.

