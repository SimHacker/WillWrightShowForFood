# Standards: ../../schemas/portrayal-standards.md

character:
  id: scott-jenson
  name: "Scott Jenson"
  type: invitation
  signifier: "🍺"
  status: living
  field: "UX strategy and interaction design — Apple Human Interface group (System 7, Newton, the HIG), Symbian, Google (mobile UX, the Physical Web, Android), frog design; now open source UX for Mastodon and Home Assistant; 'are we really going to use the same desktop UX forever?'"
  home: characters/scott-jenson/

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent_level: 3
  authored_by: don-hopkins

invitation:
  status: draft
  consent: not_yet_asked
  document: invitation.md

bio:
  summary: "**Scott Jenson** — first member of Apple's Human Interface group in the late 1980s (System 7, Newton, the Human Interface Guidelines); UX director at Symbian; creative director at frog design; mobile UX at Google, then back at Google from 2013 on the **Physical Web** and Android UX, leaving in 2024. Author of **The Simplicity Shift**. 35+ patents. Now 'partially retired', mentoring, and doing UX for open source — Mastodon and Home Assistant — 'to atone for my sins' (Ubuntu [0:04]). His two desktop talks, Ubuntu Summit 25.10 and KDE 2026, ask the free desktop to stop copying and start exploring."
  self_description_source: "https://jenson.org/about-scott/"

talks:
  kde_2026:
    title: "Are we really going to use the same Desktop UX forever?"
    url: "https://www.youtube.com/watch?v=V7AfAcQwLW0"
    mirror: "https://media.ccc.de/v/kde2026-7-are_we_really_going_to_use_the_same_desktop_ux_forever"
    transcript: sources/2026-kde-akademy-same-desktop-ux-forever.transcript.txt
    moments:
      - { t: "2:16", gist: "the middle ellipsis — Finder truncates long filenames in the middle, so you see both ends" }
      - { t: "2:48", gist: "dragging from a background window without raising it" }
      - { t: "9:23", gist: "we can't patch and bug-fix our way into the future" }
      - { t: "12:06", gist: "'I hate the term UI/UX with the heat of a thousand suns'" }
      - { t: "14:16", gist: "Simplicity Shift layers: style, structure, strategy" }
      - { t: "14:50", gist: "'there's a layer below this, which I kind of called stuff. Because cuz I just liked ST words'" }
      - { t: "15:57", gist: "the invented long-press event: 'It's a long story… Buy me a beer and we'll talk about it.'" }
      - { t: "17:36", gist: "the original Mac was 342 pixels tall" }
      - { t: "18:10", gist: "Alan Kay's thinking about steps; 'perspective is worth 80 IQ points'" }
      - { t: "19:12", gist: "AI above the UX vs AI below the UX" }
      - { t: "21:53", gist: "Claude Code got better by embracing the desktop and the file system" }
      - { t: "23:29", gist: "'it's not about generation, it's about context'" }
      - { t: "24:34", gist: "'the curse of direct manipulation' — the clipboard holds one thing, then it's gone" }
      - { t: "25:06", gist: "37 window managers, alternative shells, file and clipboard managers, each solving the pain in its own silo; 'this is really about working memory'" }
      - { t: "25:39", gist: "'I want to solve this for people first, and if the AI can use it, great'" }
      - { t: "26:11", gist: "Lifestreams, WinFS, Nepomuk — 'the hardware and the systems at the time let the vision down'" }
      - { t: "27:48", gist: "questions: design only for very large monitors; integrate clipboard, files, windows; capture intent over time" }
      - { t: "29:25", gist: "SPATIAL prototype: stash windows in the periphery, a window becomes a widget, shake to gather; 'messy, organic' WM; most consumers can't deal with virtual desktops" }
      - { t: "32:40", gist: "ASSOCIATIVE prototype: 'steal a page from Obsidian' — a per-document collection of clips and files that survives restart" }
      - { t: "34:16", gist: "EPISODIC prototype: 50 e-bike pages collapsed into a few nodes from attention signals (scroll, dwell, copy/paste events), 'not using AI, just using simple math'" }
      - { t: "36:29", gist: "spatial, associative, episodic memory" }
      - { t: "37:00", gist: "Ink & Switch's model; he worked with them on Upwelling" }
      - { t: "38:05", gist: "'no one else is going to try and I think someone's got to start'" }
      - { t: "39:26", gist: "Q&A on Recall privacy: 'the world's greatest honeypot'; gather focus, not text" }
  ubuntu_summit_2025:
    title: "Are we stuck with the same Desktop UX forever? | Ubuntu Summit 25.10"
    url: "https://www.youtube.com/watch?v=1fZTOjd_bOQ"
    transcript: sources/2025-ubuntu-summit-stuck-with-same-desktop-ux.transcript.txt
    moments:
      - { t: "2:18", gist: "'We don't need a 37th window manager.'" }
      - { t: "3:23", gist: "'good artists naively copy and great artists creatively steal' — the Mac's creative copy of the Star" }
      - { t: "3:56", gist: "virtual desktops came from Linux" }
      - { t: "5:37", gist: "picking a window manager at boot as 'the ultimate UX sin'" }
      - { t: "6:43", gist: "Windows Recall: 'awesome concept, very poorly executed'" }
      - { t: "7:49", gist: "there isn't anything left to copy" }
      - { t: "9:59", gist: "Nick Foster's Could, Should, Might, Don't" }
      - { t: "13:46", gist: "'exploring isn't a binary, it's a float'; Google's 70/20/10" }
      - { t: "18:42", gist: "'programmers think mathematically and designers think statistically'; lack of trust as the most destructive force" }
      - { t: "21:24", gist: "Raph Koster's Theory of Fun; learning loops; 'fun is just another word for learning'" }
      - { t: "24:40", gist: "text-editing study: 12 people, wrong 12 times" }
      - { t: "26:51", gist: "a gesture keyboard for power users — 'a little bit like pie menus if you're familiar with that'" }
      - { t: "29:01", gist: "toy WM: click-drag left or right to destinations — 'effectively your temporary palette. Lots of different directions that you could go'" }
      - { t: "29:33", gist: "'crossed the boundaries between a window manager, a clipboard manager, and a file manager'" }
      - { t: "30:42", gist: "not AI first; small local models; 'Boring is good'" }
      - { t: "32:51", gist: "Dynamicland (Bret Victor) — the desktop sits between the command line and Dynamicland" }
      - { t: "35:01", gist: "Princess Leia blasts a hole into the trash compactor — coloring outside the lines" }
      - { t: "37:45", gist: "three proposed projects, easy first: KDE Connect 2.0" }
      - { t: "38:50", gist: "medium: a 'super windowing system' — 'I don't mean a 37th windowing system' — about how 'users flow with their data through history and data and files and time' [39:23]" }
      - { t: "40:27", gist: "hard: history, clipboard, local-model predictions — 'could we build the ultimate right click'" }
      - { t: "41:32", gist: "the Ink & Switch model: a few people, a few months, open source" }
      - { t: "43:09", gist: "'all I want us to do is to try'" }

st_layers:
  source: "The Simplicity Shift; KDE [13:42]–[15:23], verbatim from the auto-captions"
  layers:
    style: "'style is white space, iconography, colors, yeah, pixels, right?' [13:42]–[14:16]"
    structure: "'how do you move through the application? What's your navigational model? … all the flow through all the pixels is the structure' [14:16]"
    strategy: "'Who is their user? What do they want? … What are you going to ignore? The fastest way a UX designer can save your team time is to help you say no.' [14:16]"
    stuff: "'there's a layer below this, which I kind of called stuff. Because cuz I just liked ST words … it's really more like underlying technology … The technology dictates what you can do' [14:50]; and 'expected standards … historical cruft … a bunch of stuff that we've just accepted' [15:23]"
  note: "The four names are his; every other ST word is Don's riff (see ideas.md)."
  don_riffs:
    stanza: "Italian for 'room'. A hall is a room whose job is to connect other rooms."
    enfilade: "Xanadu's name for its tree data structures, borrowed from architecture: a suite of rooms whose doors line up on one axis, so you can look straight down the row. No hall — the rooms connect directly and the aligned doors make an implicit hallway. Don builds his RimWorld complexes that way."

clipboard:
  scott_building_blocks: "'We have Windows, we got files and icons, and the clipboard … the things that allow you to kind of capture and move and edit and store data' (KDE [24:03]); direct manipulation is 'completely stateless … if you copy a few too many things to the clipboard' (KDE [24:34])"
  scott_fixes: "visual clipboard that pops over the same place and crosses WM/clipboard/file-manager boundaries (Ubuntu [29:33]); a clipboard *file* attached to the document, Obsidian-style (KDE [32:40])"
  ted_nelson: "Copy-and-paste to an invisible clipboard is the thing Ted has railed against for decades — ../ted-nelson/sources/invisible-clipboard-rant-catalog.md"
  don_position: |
    Don's proposal, not Scott's: Don is horrified that the invisible clipboard is one of the three
    building blocks, and Ted would be too. Replace it with a URL pointer that can drill down into a
    file in a filesystem snapshot of a ref in a git repo. Editable, journaled, every version
    inspectable — a safety net for trapeze artists. Copy mints a pointer, paste transcludes or
    forks it; nothing is overwritten, so the clipboard's statelessness Scott names at [24:34] goes away.
  clips_are_cursors: |
    Don's proposal: a clip is a mobile cursor, not a frozen copy. Move it around; expand it to a
    region by character, by line number, or by expression (regex, AST node, query). That makes the
    Emacs keyboard-macro trick a first-class desktop verb — programming by demonstration as a worm's
    digestive cycle, in two parts:
      1. digest — do the thing to the selected object (recorded as you do it once by hand);
      2. advance — move the cursor to select the next object, or fail, which stops the loop.
    Repeat until the advance fails. Every bite is journaled in the git-ref clipboard above, so the
    whole meal can be inspected, rewound, or replayed on another file.
  pbd_at_the_heart: |
    Don's proposal: programming by demonstration is the center of the desktop, not a feature.
    Every direct-manipulation gesture is published as a command on one visible command bus that
    both the user and the LLM can read. That one stream gives you:
      - undo/redo for free — Shneiderman's direct manipulation requires "rapid, incremental,
        reversible operations", and you can't reverse what you didn't record;
      - demonstrations — a span of the bus is a macro, generalized by the digest/advance loop above;
      - shared context — the LLM sees what you did, not a scrape of your pixels; Scott's
        "gathering focus information and not text" (KDE [39:26]) and "capture user intent over
        time" (KDE [28:19]), made inspectable instead of a hidden honeypot;
      - the cure for the "curse of direct manipulation" Scott names at KDE [24:34]: it stops being
        stateless the moment its gestures land in a journal.
    The LLM writes to the same bus, so its actions are as visible, undoable, and replayable as yours.
  corpus:
    - ../ben-shneiderman/
    - ../henry-lieberman/
    - "https://github.com/SimHacker/moollm/blob/main/designs/webtop/READING-CURSORS.md"
    - "https://github.com/SimHacker/moollm/blob/main/designs/webtop/CURSOR-STORAGE.md"
    - ../../repo-shows/unnatural-selection/
    - ../david-rosenthal/selection-clipboard-lineage.md
    - "https://github.com/SimHacker/moollm/blob/main/designs/pie-stack-views/VIEWS-AS-TESTIMONY.md  # 'GitHub is the clipboard bus'"

bob_and_clippy:
  scott_on_winfs_nepomuk: "'both of these projects basically crashed and burned … the ideas are really quite clever … my concern is that … you see these projects as proof that these ideas were wrong, which is no, not at all the case … the hardware and the systems at the time let the vision down … these are not bad ideas' (KDE [26:44]–[27:16])"
  scott_on_clippy: "Clippy is his shorthand for the failure that copying protects you from: 'who wants to like experience Clippy all over again, right?' (Ubuntu [4:30]); letting someone else go first so you don't 'implement Clippy again' (KDE [5:31])"
  don_hot_take: |
    Don's take, not Scott's: apply Scott's own WinFS/Nepomuk argument to Microsoft Bob and Clippy.
    Their failure isn't proof the ideas were wrong. Bob tried rooms as a desktop — spatial memory,
    the thing Scott's stash demo is after. Clippy tried an assistant that watches what you do and
    offers help — Scott's "ultimate right click" (Ubuntu [40:27]) with the 1997 brain of a rule
    table. Today's local models are the hardware that would have kept that vision up; the
    remaining sins are fixable design, not a doomed premise.
  will_wright_on_bob: "'Like \"Microsoft Bob\", there was some great thought and research that went into it, but the execution was flawed and it got a bad rep from the backlash to all the hype.' — ../will-wright/sources/2004-01-10-barbie-mortalkombat-jenkins/article.md"
  why_they_failed_design: "MOOLLM's reading via McCloud's masking effect: Bob cartooned the world, leaving nothing to see; Clippy kept the real document but gave the mask eyes, eyebrows and reactions, leaving nothing to be. https://github.com/SimHacker/moollm/blob/main/designs/GLOSSARY.yml (MASKING-EFFECT)"
  fix: "Clippy done right sits on the visible command bus (pbd_at_the_heart): it sees what you did, proposes on the bus where you can read, undo, or ignore it, and never interrupts with a face."

transformation_field:
  attribution: "Don's proposal, not Scott's. Hook into Scott's float (Ubuntu [13:46]), spatial stash (KDE [29:25]–[31:03]) and 'design for big monitors' (KDE [27:48])."
  field: |
    The desktop isn't a flat pixel plane, it's a continuous transformation field: every point
    carries scale, offset (a distortion map) and rotation. Draw a "hole" and the field
    shrinks toward its center, a pocket universe inside a black hole, where you can stuff a whole
    project and still see it there, tiny. Zoom into the hole and it unfolds. Pad/Pad++ zoomed the
    whole plane uniformly. Temkin's Mesa does the same. Fisheye/DOI distorts around one focus. This
    generalizes both to a field you paint.
  weight_is_scale: "The one-scalar-per-window weight (K-pyramid attention maps) is the scale field sampled under the window. Decay writes into the field, so unused things sink into a local hole in place and nothing moves. Direct manipulation writes the weight back."
  pins:
    rule: "Windows don't have positions, they have push-pins into the field (or into another window's surface). Each pin is a correspondence between a point on the window and a point on whatever it's pinned to; the pin count decides how rigid the window stays."
    one: "Translation only. Rotation is free, so a joyful window can spin or swing like a pendulum around its pin."
    two: "Similarity: translate, rotate, uniform scale. Stretch between two pins."
    three: "Affine: shear and non-uniform scale."
    four: "Projective: perspective keystone."
    more: "Mesh warp (moving least squares / thin-plate spline): the Dalí window, draped over a branch like a melting clock."
    corners: "Any corner or edge point can take a pin, the same places tabs and pie menus live (tabs on any frame edge or corner, pies on tabs and frames)."
  hierarchy: |
    Fields are recursive. Every window has its own field over its own surface, and sub-windows
    are pinned into it, so bending a parent bends its children through their pins. Windows can
    pin to each other directly, so the document graph and the layout graph can be the same graph.
  unpinned: "Pull every pin and the window becomes a vehicle or Alternate Reality Kit object: it keeps its last transformation and its momentum, and floats, collides, docks (grooves and spikes) until you pin it again."
  time: |
    As long as space bends, bend time too. ScriptX (Kaleida) had a clock hierarchy alongside the
    transformation hierarchy: a child clock's rate, offset and pause derive from its parent. Here
    the field also carries a clock rate. Animations, video and agent activity inside a hole run
    slow, or pause, and catch up when you zoom out, like relativistic time dilation near a black
    hole. Scrub a region's clock backward and the window shows its own history (journaled clipboard,
    episodic memory).
  scrapbook: |
    The scrapbook (Scott's per-document stash) is pinned to a window, but you can unpin it and put it
    in your pocket, an inventory that travels with you between rooms. It holds sub-containers, and
    you can pull any of them out into its own window and pin it to part of another window. Pull
    out, pin, pocket, nest: it's all the same stuff, at every level.
  rigs:
    idea: |
      Another source of scale: the window takes it from whatever it's snapped into (an edge, groove,
      spike, line or hall), not from the field under it. A horizontal hanger holds a row of things
      at one scale so you can compare them. Diagonal rails on the left and right run back into
      z-perspective, so a window slid along one shrinks as it recedes. Stage Manager and Cover Flow
      have fixed, arbitrary shrinking edges you can't edit; here users build their own rigs and set
      their own levels of detail, scales and lenses for whatever hangs on them.
    building_blocks: "Geometric, interpolative pieces that snap together: straight hangers (constant scale), perspective rails (scale interpolates along the length), curves, junctions, splitters and mergers. Each piece maps position-along-it to scale, LOD and lens, so a rig is a piecewise function you assemble by hand."
    lenses: "A lens is a property of a rail segment, not a mode: this stretch shows thumbnails, that one shows titles only, the stretch at the front shows the live editable window. Moving an object along the rail changes its LOD."
    flow: |
      Rails can move. Make them belts and you have Factorio conveyor data flow: streams of incoming
      and outgoing objects ride the belts through splitters, filters and inserters, like an
      automated dry cleaner's rack bringing your garment round to the counter. The rig is the
      program, visible and editable, which is dataflow programming by direct manipulation.
    queues: |
      - The Sims action queue: queued actions hang as icons in a row, the head one runs, and you can
        cancel or reorder them by clicking. That's a rig, and people already know how to use it.
      - Email and message input queues: incoming items arrive on an inbound belt and slow down near
        the front, where the lens shows enough to triage them. You flick each one off onto a
        sorting rail.
      - Replies: draft a reply and insert it into the shared history (the chat log, thread or git
        log) at the point it answers, rather than only at the bottom. The history is a rail too.
    why_scott: "It answers his 'design for big monitors' (KDE [27:48]) and spatial stash (KDE [29:25]–[31:03]) with user-built structure instead of yet another fixed layout policy, and Hutchings & Stasko's careful coordinators (sources/2004-hutchings-stasko-display-space-management.md) are already hand-building these rigs out of window edges, with no tools to help."
    moollm: "A rig is a logistic-container in MOOLLM terms (https://github.com/SimHacker/moollm/tree/main/skills/logistic-container): rails are containers with ordering, belts are containers with a clock, inserters are actions. All of it is files in git."
    corpus:
      - "../john-von-neumann/sources/hn/24163024-factorio-simcity-kay.md (Factorio belts, Kay on rule-based SimCity)"
      - "https://github.com/SimHacker/moollm/blob/main/designs/pie-stack-views/GROOVES-AND-SPIKES.md (grooves and spikes as snap targets)"
  its_all_stuff: "Scott's fourth ST layer, taken literally. Every window, scrapbook, clip, pin and pocket is a MOOLLM object (a file or directory in a git repo, as in the room, container, inventory, object and card skills). So a pin is a reference you can commit, a layout is a diff, and moving a scrapbook between pockets is a git mv you can see in the log and undo."
  moollm_skills: "https://github.com/SimHacker/moollm/tree/main/skills (room, container, inventory, object, card, file-system-object)"
  why_scott: "It's his three memories in one substrate: spatial (where it's pinned), associative (what it's pinned to) and episodic (the clock you can scrub)."
  corpus:
    - "../../repo-shows/building-the-sims/pause-time-and-rng.md (ScriptX clock hierarchy)"
    - "https://github.com/SimHacker/moollm/blob/main/designs/webtop-gwern-inheritance/K-PYRAMID-ATTENTION-MAPS.md (weight scalar, fisheye/DOI)"
    - "https://github.com/SimHacker/moollm/blob/main/designs/pie-stack-views/GROOVES-AND-SPIKES.md (ARK, tabs on any side)"
    - "../ken-perlin/ (Pad, zooming plane)"
    - "../david-temkin/ (Mesa zoom canvas, Declare constraints for pins)"
    - "../david-ungar/ and ../randall-smith/ (Self, ARK)"

working_memory:
  thesis: "The desktop's real job is working memory; windows, files, and clipboard each solve a slice of it in silos (KDE [25:06])."
  three_memories:
    spatial: "where I put it — a messy, organic arrangement in the periphery"
    associative: "what goes with what — a document's own collection of clips and files"
    episodic: "what I did and when — attention traces summarized into a story"

learning_loops:
  source: "https://jenson.org/games/ ; Ubuntu [21:24]"
  summary: "From eight weeks applying Raph Koster's A Theory of Fun: intent → action → result → feedback updates the mental model. Affordances prompt loops you know; 'hintiness' moves you to new ones. Mario has three jump loops; pinch is a higher-order loop on drag. Mobile is 'a prisoner of our flat slab of glass'; long-press is evidence of an expression problem."

files:
  source: "https://jenson.org/files/ ; https://jenson.org/files2/"
  summary: "Files are chunks of work you can see, move, act on, and share; folders organize data-first instead of app-first. The Mac desktop was a temporary working area, and the original Finder's 'Put away' returned a thing to where it came from — dropped in OS X. Documents are dope; data should live outside apps."

