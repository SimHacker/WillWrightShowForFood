# Standards: ../../schemas/portrayal-standards.md

character:
  id: scott-jenson
  name: "Scott Jenson"
  type: invitation
  signifier: "🍺"
  status: living
  field: "UX strategy and interaction design — Apple Human Interface group (System 7, Newton, the HIG), Symbian, Google (mobile UX, the Physical Web, Android), frog design; now open source UX for Mastodon and Home Assistant; 'are we really going to use the same desktop UX forever?'"
  home: characters/scott-jenson/

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent_level: 3
  authored_by: don-hopkins

invitation:
  status: draft
  consent: not_yet_asked
  document: invitation.md

bio:
  summary: "**Scott Jenson** — first member of Apple's Human Interface group in the late 1980s (System 7, Newton, the Human Interface Guidelines); UX director at Symbian; creative director at frog design; mobile UX at Google, then back at Google from 2013 on the **Physical Web** and Android UX, leaving in 2024. Author of **The Simplicity Shift**. 35+ patents. Now 'partially retired', mentoring, and doing UX for open source — Mastodon and Home Assistant — 'to atone for my sins' (Ubuntu [0:04]). His two desktop talks, Ubuntu Summit 25.10 and KDE 2026, ask the free desktop to stop copying and start exploring."
  self_description_source: "https://jenson.org/about-scott/"

talks:
  kde_2026:
    title: "Are we really going to use the same Desktop UX forever?"
    url: "https://www.youtube.com/watch?v=V7AfAcQwLW0"
    mirror: "https://media.ccc.de/v/kde2026-7-are_we_really_going_to_use_the_same_desktop_ux_forever"
    transcript: sources/2026-kde-akademy-same-desktop-ux-forever.transcript.txt
    moments:
      - { t: "2:16", gist: "the middle ellipsis — Finder truncates long filenames in the middle, so you see both ends" }
      - { t: "2:48", gist: "dragging from a background window without raising it" }
      - { t: "9:23", gist: "we can't patch and bug-fix our way into the future" }
      - { t: "12:06", gist: "'I hate the term UI/UX with the heat of a thousand suns'" }
      - { t: "14:16", gist: "Simplicity Shift layers: style, structure, strategy" }
      - { t: "14:50", gist: "'there's a layer below this, which I kind of called stuff. Because cuz I just liked ST words'" }
      - { t: "15:57", gist: "the invented long-press event: 'It's a long story… Buy me a beer and we'll talk about it.'" }
      - { t: "17:36", gist: "the original Mac was 342 pixels tall" }
      - { t: "18:10", gist: "Alan Kay's thinking about steps; 'perspective is worth 80 IQ points'" }
      - { t: "19:12", gist: "AI above the UX vs AI below the UX" }
      - { t: "21:53", gist: "Claude Code got better by embracing the desktop and the file system" }
      - { t: "23:29", gist: "'it's not about generation, it's about context'" }
      - { t: "24:34", gist: "'the curse of direct manipulation' — the clipboard holds one thing, then it's gone" }
      - { t: "25:06", gist: "37 window managers, alternative shells, file and clipboard managers, each solving the pain in its own silo; 'this is really about working memory'" }
      - { t: "25:39", gist: "'I want to solve this for people first, and if the AI can use it, great'" }
      - { t: "26:11", gist: "Lifestreams, WinFS, Nepomuk — 'the hardware and the systems at the time let the vision down'" }
      - { t: "27:48", gist: "questions: design only for very large monitors; integrate clipboard, files, windows; capture intent over time" }
      - { t: "29:25", gist: "SPATIAL prototype: stash windows in the periphery, a window becomes a widget, shake to gather; 'messy, organic' WM; most consumers can't deal with virtual desktops" }
      - { t: "32:40", gist: "ASSOCIATIVE prototype: 'steal a page from Obsidian' — a per-document collection of clips and files that survives restart" }
      - { t: "34:16", gist: "EPISODIC prototype: 50 e-bike pages collapsed into a few nodes from attention signals (scroll, dwell, copy/paste events), 'not using AI, just using simple math'" }
      - { t: "36:29", gist: "spatial, associative, episodic memory" }
      - { t: "37:00", gist: "Ink & Switch's model; he worked with them on Upwelling" }
      - { t: "38:05", gist: "'no one else is going to try and I think someone's got to start'" }
      - { t: "39:26", gist: "Q&A on Recall privacy: 'the world's greatest honeypot'; gather focus, not text" }
  ubuntu_summit_2025:
    title: "Are we stuck with the same Desktop UX forever? | Ubuntu Summit 25.10"
    url: "https://www.youtube.com/watch?v=1fZTOjd_bOQ"
    transcript: sources/2025-ubuntu-summit-stuck-with-same-desktop-ux.transcript.txt
    moments:
      - { t: "2:18", gist: "'We don't need a 37th window manager.'" }
      - { t: "3:23", gist: "'good artists naively copy and great artists creatively steal' — the Mac's creative copy of the Star" }
      - { t: "3:56", gist: "virtual desktops came from Linux" }
      - { t: "5:37", gist: "picking a window manager at boot as 'the ultimate UX sin'" }
      - { t: "6:43", gist: "Windows Recall: 'awesome concept, very poorly executed'" }
      - { t: "7:49", gist: "there isn't anything left to copy" }
      - { t: "9:59", gist: "Nick Foster's Could, Should, Might, Don't" }
      - { t: "13:46", gist: "'exploring isn't a binary, it's a float'; Google's 70/20/10" }
      - { t: "18:42", gist: "'programmers think mathematically and designers think statistically'; lack of trust as the most destructive force" }
      - { t: "21:24", gist: "Raph Koster's Theory of Fun; learning loops; 'fun is just another word for learning'" }
      - { t: "24:40", gist: "text-editing study: 12 people, wrong 12 times" }
      - { t: "26:51", gist: "a gesture keyboard for power users — 'a little bit like pie menus if you're familiar with that'" }
      - { t: "29:01", gist: "toy WM: click-drag left or right to destinations — 'effectively your temporary palette. Lots of different directions that you could go'" }
      - { t: "29:33", gist: "'crossed the boundaries between a window manager, a clipboard manager, and a file manager'" }
      - { t: "30:42", gist: "not AI first; small local models; 'Boring is good'" }
      - { t: "32:51", gist: "Dynamicland (Bret Victor) — the desktop sits between the command line and Dynamicland" }
      - { t: "35:01", gist: "Princess Leia blasts a hole into the trash compactor — coloring outside the lines" }
      - { t: "37:45", gist: "three proposed projects, easy first: KDE Connect 2.0" }
      - { t: "38:50", gist: "medium: a 'super windowing system' — 'I don't mean a 37th windowing system' — about how 'users flow with their data through history and data and files and time' [39:23]" }
      - { t: "40:27", gist: "hard: history, clipboard, local-model predictions — 'could we build the ultimate right click'" }
      - { t: "41:32", gist: "the Ink & Switch model: a few people, a few months, open source" }
      - { t: "43:09", gist: "'all I want us to do is to try'" }

st_layers:
  source: "The Simplicity Shift; KDE [13:42]–[15:23], verbatim from the auto-captions"
  layers:
    style: "'style is white space, iconography, colors, yeah, pixels, right?' [13:42]–[14:16]"
    structure: "'how do you move through the application? What's your navigational model? … all the flow through all the pixels is the structure' [14:16]"
    strategy: "'Who is their user? What do they want? … What are you going to ignore? The fastest way a UX designer can save your team time is to help you say no.' [14:16]"
    stuff: "'there's a layer below this, which I kind of called stuff. Because cuz I just liked ST words … it's really more like underlying technology … The technology dictates what you can do' [14:50]; and 'expected standards … historical cruft … a bunch of stuff that we've just accepted' [15:23]"
  note: "The four names are his; every other ST word is Don's riff (see ideas.md)."
  don_riffs:
    stanza: "Italian for 'room'. A hall is a room whose job is to connect other rooms."
    enfilade: "Xanadu's name for its tree data structures, borrowed from architecture: a suite of rooms whose doors line up on one axis, so you can look straight down the row. No hall — the rooms connect directly and the aligned doors make an implicit hallway. Don builds his RimWorld complexes that way."

clipboard:
  scott_building_blocks: "'We have Windows, we got files and icons, and the clipboard … the things that allow you to kind of capture and move and edit and store data' (KDE [24:03]); direct manipulation is 'completely stateless … if you copy a few too many things to the clipboard' (KDE [24:34])"
  scott_fixes: "visual clipboard that pops over the same place and crosses WM/clipboard/file-manager boundaries (Ubuntu [29:33]); a clipboard *file* attached to the document, Obsidian-style (KDE [32:40])"
  ted_nelson: "Copy-and-paste to an invisible clipboard is the thing Ted has railed against for decades — ../ted-nelson/sources/invisible-clipboard-rant-catalog.md"
  don_position: |
    Don's proposal, not Scott's: Don is horrified that the invisible clipboard is one of the three
    building blocks, and Ted would be too. Replace it with a URL pointer that can drill down into a
    file in a filesystem snapshot of a ref in a git repo. Editable, journaled, every version
    inspectable — a safety net for trapeze artists. Copy mints a pointer, paste transcludes or
    forks it; nothing is overwritten, so the clipboard's statelessness Scott names at [24:34] goes away.
  clips_are_cursors: |
    Don's proposal: a clip is a mobile cursor, not a frozen copy. Move it around; expand it to a
    region by character, by line number, or by expression (regex, AST node, query). That makes the
    Emacs keyboard-macro trick a first-class desktop verb — programming by demonstration as a worm's
    digestive cycle, in two parts:
      1. digest — do the thing to the selected object (recorded as you do it once by hand);
      2. advance — move the cursor to select the next object, or fail, which stops the loop.
    Repeat until the advance fails. Every bite is journaled in the git-ref clipboard above, so the
    whole meal can be inspected, rewound, or replayed on another file.
  pbd_at_the_heart: |
    Don's proposal: programming by demonstration is the center of the desktop, not a feature.
    Every direct-manipulation gesture is published as a command on one visible command bus that
    both the user and the LLM can read. That one stream gives you:
      - undo/redo for free — Shneiderman's direct manipulation requires "rapid, incremental,
        reversible operations", and you can't reverse what you didn't record;
      - demonstrations — a span of the bus is a macro, generalized by the digest/advance loop above;
      - shared context — the LLM sees what you did, not a scrape of your pixels; Scott's
        "gathering focus information and not text" (KDE [39:26]) and "capture user intent over
        time" (KDE [28:19]), made inspectable instead of a hidden honeypot;
      - the cure for the "curse of direct manipulation" Scott names at KDE [24:34]: it stops being
        stateless the moment its gestures land in a journal.
    The LLM writes to the same bus, so its actions are as visible, undoable, and replayable as yours.
  corpus:
    - ../ben-shneiderman/
    - ../henry-lieberman/
    - "https://github.com/SimHacker/moollm/blob/main/designs/webtop/READING-CURSORS.md"
    - "https://github.com/SimHacker/moollm/blob/main/designs/webtop/CURSOR-STORAGE.md"
    - ../../repo-shows/unnatural-selection/
    - ../david-rosenthal/selection-clipboard-lineage.md
    - "https://github.com/SimHacker/moollm/blob/main/designs/pie-stack-views/VIEWS-AS-TESTIMONY.md  # 'GitHub is the clipboard bus'"

bob_and_clippy:
  scott_on_winfs_nepomuk: "'both of these projects basically crashed and burned … the ideas are really quite clever … my concern is that … you see these projects as proof that these ideas were wrong, which is no, not at all the case … the hardware and the systems at the time let the vision down … these are not bad ideas' (KDE [26:44]–[27:16])"
  scott_on_clippy: "Clippy is his shorthand for the failure that copying protects you from: 'who wants to like experience Clippy all over again, right?' (Ubuntu [4:30]); letting someone else go first so you don't 'implement Clippy again' (KDE [5:31])"
  don_hot_take: |
    Don's take, not Scott's: apply Scott's own WinFS/Nepomuk argument to Microsoft Bob and Clippy.
    Their failure isn't proof the ideas were wrong. Bob tried rooms as a desktop — spatial memory,
    the thing Scott's stash demo is after. Clippy tried an assistant that watches what you do and
    offers help — Scott's "ultimate right click" (Ubuntu [40:27]) with the 1997 brain of a rule
    table. Today's local models are the hardware that would have kept that vision up; the
    remaining sins are fixable design, not a doomed premise.
  will_wright_on_bob: "'Like \"Microsoft Bob\", there was some great thought and research that went into it, but the execution was flawed and it got a bad rep from the backlash to all the hype.' — ../will-wright/sources/2004-01-10-barbie-mortalkombat-jenkins/article.md"
  why_they_failed_design: "MOOLLM's reading via McCloud's masking effect: Bob cartooned the world, leaving nothing to see; Clippy kept the real document but gave the mask eyes, eyebrows and reactions, leaving nothing to be. https://github.com/SimHacker/moollm/blob/main/designs/GLOSSARY.yml (MASKING-EFFECT)"
  fix: "Clippy done right sits on the visible command bus (pbd_at_the_heart): it sees what you did, proposes on the bus where you can read, undo, or ignore it, and never interrupts with a face."

transformation_field:
  attribution: "Don's proposal, not Scott's. Hook into Scott's float (Ubuntu [13:46]), spatial stash (KDE [29:25]–[31:03]) and 'design for big monitors' (KDE [27:48])."
  field: |
    The desktop isn't a flat pixel plane, it's a continuous transformation field: every point
    carries scale, offset (a distortion map) and rotation. Draw a "hole" and the field
    shrinks toward its center, a pocket universe inside a black hole, where you can stuff a whole
    project and still see it there, tiny. Zoom into the hole and it unfolds. Pad/Pad++ zoomed the
    whole plane uniformly. Temkin's Mesa does the same. Fisheye/DOI distorts around one focus. This
    generalizes both to a field you paint.
  weight_is_scale: "The one-scalar-per-window weight (K-pyramid attention maps) is the scale field sampled under the window. Decay writes into the field, so unused things sink into a local hole in place and nothing moves. Direct manipulation writes the weight back."
  pins:
    rule: "Windows don't have positions, they have push-pins into the field (or into another window's surface). Each pin is a correspondence between a point on the window and a point on whatever it's pinned to; the pin count decides how rigid the window stays."
    one: "Translation only. Rotation is free, so a joyful window can spin or swing like a pendulum around its pin."
    two: "Similarity: translate, rotate, uniform scale. Stretch between two pins."
    three: "Affine: shear and non-uniform scale."
    four: "Projective: perspective keystone."
    more: "Mesh warp (moving least squares / thin-plate spline): the Dalí window, draped over a branch like a melting clock."
    corners: "Any corner or edge point can take a pin, the same places tabs and pie menus live (tabs on any frame edge or corner, pies on tabs and frames)."
  hierarchy: |
    Fields are recursive. Every window has its own field over its own surface, and sub-windows
    are pinned into it, so bending a parent bends its children through their pins. Windows can
    pin to each other directly, so the document graph and the layout graph can be the same graph.
  unpinned: "Pull every pin and the window becomes a vehicle or Alternate Reality Kit object: it keeps its last transformation and its momentum, and floats, collides, docks (grooves and spikes) until you pin it again."
  time: |
    As long as space bends, bend time too. ScriptX (Kaleida) had a clock hierarchy alongside the
    transformation hierarchy: a child clock's rate, offset and pause derive from its parent. Here
    the field also carries a clock rate. Animations, video and agent activity inside a hole run
    slow, or pause, and catch up when you zoom out, like relativistic time dilation near a black
    hole. Scrub a region's clock backward and the window shows its own history (journaled clipboard,
    episodic memory).
  scrapbook: |
    The scrapbook (Scott's per-document stash) is pinned to a window, but you can unpin it and put it
    in your pocket, an inventory that travels with you between rooms. It holds sub-containers, and
    you can pull any of them out into its own window and pin it to part of another window. Pull
    out, pin, pocket, nest: it's all the same stuff, at every level.
  rigs:
    idea: |
      Another source of scale: the window takes it from whatever it's snapped into (an edge, groove,
      spike, line or hall), not from the field under it. A horizontal hanger holds a row of things
      at one scale so you can compare them. Diagonal rails on the left and right run back into
      z-perspective, so a window slid along one shrinks as it recedes. Stage Manager and Cover Flow
      have fixed, arbitrary shrinking edges you can't edit; here users build their own rigs and set
      their own levels of detail, scales and lenses for whatever hangs on them.
    building_blocks: "Geometric, interpolative pieces that snap together: straight hangers (constant scale), perspective rails (scale interpolates along the length), curves, junctions, splitters and mergers. Each piece maps position-along-it to scale, LOD and lens, so a rig is a piecewise function you assemble by hand."
    lenses: "A lens is a property of a rail segment, not a mode: this stretch shows thumbnails, that one shows titles only, the stretch at the front shows the live editable window. Moving an object along the rail changes its LOD."
    flow: |
      Rails can move. Make them belts and you have Factorio conveyor data flow: streams of incoming
      and outgoing objects ride the belts through splitters, filters and inserters, like an
      automated dry cleaner's rack bringing your garment round to the counter. The rig is the
      program, visible and editable, which is dataflow programming by direct manipulation.
    queues: |
      - The Sims action queue: queued actions hang as icons in a row, the head one runs, and you can
        cancel or reorder them by clicking. That's a rig, and people already know how to use it.
      - Email and message input queues: incoming items arrive on an inbound belt and slow down near
        the front, where the lens shows enough to triage them. You flick each one off onto a
        sorting rail.
      - Replies: draft a reply and insert it into the shared history (the chat log, thread or git
        log) at the point it answers, rather than only at the bottom. The history is a rail too.
    journeys:
      idea: |
        Anything can come out onto the rigging: events, notifications, chat messages, LLM prompts and
        their outputs, tool calls, commits, clips. Each one becomes a visible object you can grab.
        Nothing stays trapped in a scrolling log inside one app's window. Then you send it on a
        journey between rooms, windows and characters.
      examples:
        - "A prompt rides a belt out of your editor into a character's room; the character's output rides back on the return belt and docks beside the paragraph it answers."
        - "One chat message forks at a splitter: one copy goes to the thread, one to a scrapbook, and one to a reviewer character's inbox rail."
        - "A CI failure event travels a hall to the room of whoever last touched the file, and hangs on their door until someone picks it up."
        - "A chain of agents is a chain of rooms. You watch the prompt hop from room to room, each stop adding to it, and you can grab it mid-journey, edit it and put it back on the belt."
      rules:
        - "Every journey leaves a trail: where it went, who touched it and what changed. The trail is the episodic memory, so you can scrub it with the region's clock."
        - "Objects in transit are still direct-manipulable: pause, reroute, copy, or pull off the belt."
        - "Routes are part of the rig, so they are visible and editable. Routing is not a hidden rule in a settings dialog."
        - "Characters are stations on the line. Their inbox is an inbound rail and their outbox an outbound one, and their action queue is the Sims queue above their head."
      why_scott: "It's his crossed boundaries (Ubuntu [29:33]) carried through to the end: data moves between apps, windows and people as visible stuff, not through the invisible clipboard."
      moollm_skills:
        - "https://github.com/SimHacker/moollm/tree/main/skills/postal (letters, texts, attachments between characters)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/data-flow (rooms as pipeline nodes, exits as edges, objects as messages)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/worm (two-pointer reversible cursors for traversal and dataflow)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/action-queue (Sims-style queues)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/vehicle (movable rooms that carry things)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/exit (halls and doors as edges)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/session-log (the trail)"
        - "https://github.com/SimHacker/moollm/tree/main/skills/speed-of-light (many hops in one call when you don't need to watch)"
    why_scott: "It answers his 'design for big monitors' (KDE [27:48]) and spatial stash (KDE [29:25]–[31:03]) with user-built structure instead of yet another fixed layout policy, and Hutchings & Stasko's careful coordinators (sources/2004-hutchings-stasko-display-space-management.md) are already hand-building these rigs out of window edges, with no tools to help."
    moollm: "A rig is a logistic-container in MOOLLM terms (https://github.com/SimHacker/moollm/tree/main/skills/logistic-container): rails are containers with ordering, belts are containers with a clock, inserters are actions. All of it is files in git."
    corpus:
      - "../john-von-neumann/sources/hn/24163024-factorio-simcity-kay.md (Factorio belts, Kay on rule-based SimCity)"
      - "https://github.com/SimHacker/moollm/blob/main/designs/pie-stack-views/GROOVES-AND-SPIKES.md (grooves and spikes as snap targets)"
  live_crop:
    attribution: "Don's proposal, answering Hutchings & Stasko 2004 §7.1: 'an operation that shows or hides a user-specified region of a window … better suited for the window manager because an application designer will likely not know a priori what information will be displayed and valued by the user.'"
    idea: "A live, editable crop tool in the window manager, like Photoshop's. Crop any number of edges at once (none, some or all) and re-edit it at any time. The app keeps its full layout, so nothing reflows. Crops can be saved, named and stacked, so one window can expose several cropped region-windows, each pinned somewhere else."
    source: sources/2004-hutchings-stasko-display-space-management.pdf
  live_views:
    attribution: "Don's proposal: live_crop carried to the end, a 2D-surface Xanadu for running programs."
    idea: |
      Any window, or any part of one, can be shown live somewhere else, cropped and scaled, as many
      times as you like. The source window can be kept off-screen and still live, and the views
      are where you actually work. Put two parts of the same window side by side (the toolbar
      next to the status line it changes, the top and bottom of a long form, both ends of a
      timeline). Transclude a gauge from one app into the document that talks about it. The view
      isn't a screenshot or a thumbnail: input goes back through it, so you can click and type
      into the original.
    views:
      transclusion: "A view is a live quotation of another window's region, kept in its place with a visible link back to the source, like Ted Nelson's transclusion. Drag along the link and you go to the source in context."
      side_by_side: "Several views of one window, laid out together, like Nelson's parallel side-by-side documents with visible connections between corresponding parts."
      off_screen_live: "The source can live in a hole, a bag of holding or off the edge of the field, still running and still rendering. The views are its only face."
      many_scales: "Each view picks its own crop, scale and lens, and takes them from the field or the rig it's pinned to, so a view on a perspective rail shrinks as it recedes."
    proxies:
      idea: |
        A proxy goes further than a view. It operates the real control panel underneath while showing
        a totally different interface on top: a pie menu over a toolbar, one slider driving three
        settings scattered across two dialogs, a big-type high-contrast panel for a tiny cramped one,
        a translated or annotated one, a curated panel built from the five controls you actually use
        across four apps. The original stays the authority; the proxy reads its state and works its
        controls.
      curated: "Curated alternative views are shareable stuff: a file in git describing which source regions and controls, what layout and what mapping. Someone else can install your panel over their copy of the app, fork it, and send you a diff."
      prior_art:
        - "Morgan Dixon and James Fogarty, Prefab (CHI 2010, 2011; target-aware pointing CHI 2012): recover interface structure from pixels alone, then modify any interface without its source. 'Imagine if every interface was open source. Any of us could modify the software we use every day.' 'Prefab realizes this vision using only the pixels of everyday interfaces … to add new functionality to Adobe Photoshop, Apple iTunes, and Microsoft Windows Media Player.' Don cited it on HN: https://news.ycombinator.com/item?id=14182061 ; video https://www.youtube.com/watch?v=lju6IIteg9Q"
        - "Richard Potter, Triggers (HCIL 1991): pixel-reading to drive Mac apps that offered no other way in."
        - "Tan, Meyers and Czerwinski, WinCuts (CHI 2004): cut live regions of windows out into new windows you can rearrange."
        - "Stuerzlinger, Chapuis, Phillips and Roussel, User Interface Façades (UIST 2006): copy parts of interfaces into new windows and recombine them, without the app's cooperation."
        - "Don's aQuery: select and operate accessibility trees the way jQuery does the DOM. https://web.archive.org/web/20180826132551/http://donhopkins.com/mediawiki/index.php/AQuery"
        - "Simon Schneegans's Kando: pie menus laid over any desktop app (../simon-schneegans/)."
      lineage: "It's the oldest goal in window systems. Alan Kay, in email Don quoted on HN: Sketchpad III 'had 4 windows showing front, side, top, and 3D view of the object being made … One of the big goals from the start was to include the ability to do multiple views of the same objects, and to edit them from any view.' https://news.ycombinator.com/item?id=34302718"
    plumbing:
      pixels: "Compositors already keep every window's pixels off-screen. Windows DWM thumbnails take a live source rectangle and scale it (DwmRegisterThumbnail); X11 has Composite and Damage; KWin scripts get live window thumbnails; macOS ScreenCaptureKit captures one window at a time."
      input: "Map a click in the view back through the view's transform to the source window's coordinates, then deliver it with the platform's accessibility or input-injection API (AXUIElement, UI Automation, AT-SPI, XTest)."
      structure: "Pixels give you the view; accessibility trees and Prefab-style pixel parsing give you the controls, so a proxy can work a button by name, not by coordinate, and survive the app moving it."
      problems: "Off-screen windows get throttled. Browsers and macOS slow down or stop occluded windows, so the source has to be kept 'visible' to the app while hidden from you. Wayland deliberately forbids one client from reading or driving another, so it has to live in the compositor or go through a portal. And proxies drift when the app updates its layout."
      news: "NeWS could have done this from the inside: canvases were PostScript objects that the window manager could reparent, scale and re-render, and the toolkit ran in the server. Today it has to be done from the outside, Prefab-style."
    why_scott: "His silos (KDE [25:06]) and crossed boundaries (Ubuntu [29:33]): today's window is the unit the app chose. Views and proxies let you pick the unit of work yourself, across apps, and keep it where your spatial stash is."
    why_hutchings_stasko: "§7.1 asks for showing or hiding a user-specified region of a window, done by the window manager, because the app designer can't know what the user values. Live views are that operation made into stuff you can pin, rig, stash and share."
  photographs:
    source: "Craig Tashman, 'WindowScape: A Task Oriented Window Manager', UIST 2006 — sources/2006-tashman-windowscape.pdf. Raised by Mat Duggan, 'Make tmux the OS' (2026-10-02), written after Scott's KDE talk: https://matduggan.com/what-does-my-dream-os-ui-look-like/"
    windowscape: |
      Windows live as miniatures that the user places and the system never moves. Every time you
      expand or miniaturize, a photograph-like snapshot of the expanded windows goes onto a timeline,
      and clicking a snapshot puts the windows back the way they were. Tasks are never declared; they
      are whatever snapshots you keep going back to.
    quotes:
      - "'requiring windows to be in a single group forces users to decide ahead of time where a new window belongs.'"
      - "'People understand that there can be several photos of an object with there being only one underlying object.'"
      - "On Rooms' window placements, the same window in several Rooms: 'there is no clear analog to such an abstraction in the real world … copying something generally produces a completely independent duplicate, whereas copied placements all refer to the same underlying window.' The photograph supplies that analog."
      - "'If the panel is full, the leftmost snapshot is discarded.' and 'the contents of the windows depicted in the snapshots are occasionally updated to reflect the current content of the actual windows.'"
    the_gap: "The photos evaporated. The timeline is a fixed-length strip; the only way to keep one is to copy it to a favorites bar, which is a second fixed strip with the same problem. Duggan first called this 'the gap to fix', then, after trying an append-only infinite canvas, changed his mind: 'evaporation was quietly doing the job of a garbage collector … Something needs to go dormant without moving but deciding what goes dormant is a reaping decision, and reaping is exactly what append-only forbids.'"
    don_answer:
      attribution: "Don's proposal, not Tashman's, Duggan's or Scott's."
      keep_everything: "A photo is a commit. The arrangement (which windows, their pins, crops, scales and views) is a small file in git, so taking a photo costs a diff, and nothing has to be thrown away to make room. The timeline is the log, and the favorites bar is a set of branches and tags."
      dormant_without_moving: "Duggan's garbage collector is the weight decay already in transformation_field: a photo you don't revisit sinks into a local hole where it lies, smaller and slower, but never moves and is never reaped. Revisiting it writes the weight back and it grows. Forgetting is shrinking in place, not deletion, so append-only and garbage collection stop fighting. Real deletion is a git gc you choose to run, and the log still says what was there."
      photos_are_live: "WindowScape already refreshed the photos 'occasionally'. Make every photo a set of live_views of the real windows, so a photo is a live, cropped, scaled transclusion of the arrangement. One window in many photos is one source with many views, which is exactly Tashman's 'several photos of an object' and Rooms' placements, with the real-world analog he wanted."
      tabs: "Duggan's docs tab that serves both the Terraform task and the ticket update is one source window in two photos. Tabs become sources that photos view, so 'belongs to two tasks at once' stops being a question."
      post_hoc: "WindowScape's best property survives: you never decide in advance. Tasks are named after the fact by giving a branch a name, pinning a photo into a room, or hanging it on a rig, and an LLM can propose names and groupings on the visible command bus (pbd_at_the_heart) that you accept or ignore, Duggan's 'it proposes and you press y'."
      privacy: "Duggan asks for 'presenter view as a desktop primitive' and says 'Private is a property of a window or tab, not a region of the screen.' A photo does both: a presenting photo shows only the views you put in it, so the projector gets a curated photo instead of your desktop, and the private windows were never in it."
    why_scott: "It's his episodic memory (KDE) done without logging everything: the photos are the episodes, you can scrub them, and the ones you don't need shrink out of the way without anyone deciding to delete them."
  self_hosting:
    duggan: "'All of this makes sense from the perspective of \"the browser is now the operating system\", but I think this is a fundamentally flawed idea. If a web application is operating as an application, it should be its own window. If it is complimentary to another application, it should be a window associated with another application and be allowed to contain many tabs, to reflect the idea of the browser as the portal for all research and lookup.' (Make tmux the OS, on Arc and Chrome OS)"
    don_answer:
      attribution: "Don's proposal, disagreeing with Duggan."
      idea: "Neither 'the browser is the OS' nor 'break the browser into OS windows'. The frame system should be able to host, view and manipulate itself as just another window. Tabs, apps, OS windows, and the frame system itself are all windows of the same kind, and any of them can appear inside any other."
      how: "It's live_views turned on itself. The frame system shows a live, cropped, scaled view of a native window, a browser tab, or another instance of itself, with input passed through. A whole workspace can then be a pinned thumbnail inside another workspace, a photo, or one stop on a rig, and you can open it there and work in it."
      consequences:
        - "Where a window lives stops mattering. A docs tab can be in the browser, in a task, and in two photos at once, as views of one source, so Duggan's question of which window owns the tab never comes up."
        - "No separate manager layer. Window management, task management and the photo timeline are ordinary windows inside the space they manage, so you can view, crop, fork and script them like anything else."
        - "Nesting goes as deep as you like. A view of the frame system showing a view of itself is a Droste picture, and the scale painting decides where it stops being worth drawing."
      lineage:
        - "NeWS: window managers were PostScript programs running in the same server as the windows they managed, not a privileged outside process."
        - "Smalltalk-80 and Morphic: the browser, inspector and debugger are windows built from the same objects they inspect, and in Morphic the World itself is a morph."
        - "Ted Nelson's transclusion and Alan Kay's 'multiple views of the same objects, and to edit them from any view' (live_views.lineage)."
    why_scott: "His files essays argue for stuff you can see, move and act on outside of apps. Here the container is stuff too: there is no special layer left, only stuff and views of stuff."
  app_locked_tasks:
    duggan: "'When you define a task, this allows you to organize all the windows together, including specific browser tabs detached and associated with the task, not with the concept of \"browser\".' And on the weak filesystem: 'Teams and Slack content lives inside those applications unless I manually \"bring it out,\" and when I do, I'm making a copy.' He cites Boardman & Sasse's CHI 2004 paper 'Stuff goes into the computer and doesn't come out.'"
    don_problem: "Don's point: some tasks are locked inside an app's own window structure. Slack's main window shows one workspace at a time, switched from the icon rail on the left edge, so you can't put the foo workspace in the foo task and the bar workspace in the bar task. The task structure (workspaces, channels, threads) is outside the filesystem and inside the app."
    checked: "Partly true. Slack's main window does switch workspaces one at a time ('Switch between workspaces', slack.com/help/articles/1500002200741). But the desktop app can pop any channel, DM, thread, canvas, Activity or Later out into a separate window: 'You can have as many windows as you'd like' (slack.com/help/articles/4403608802963). Whether popped-out windows from two workspaces can be open at once is not verified here. Either way, the popped-out windows are still Slack's windows, run by Slack's rules and invisible to a task system as anything but 'Slack'."
    don_answer:
      attribution: "Don's proposal."
      web_surfaces: "Where an app has a web surface, open it there. Each workspace, channel or thread has a URL, and a URL is a handle a task can hold. app.slack.com/client/<team>/<channel> in a browser tab is a separate window per workspace or channel, which the task, photo or rig can own instead of Slack."
      profiles: "Browser profiles (and Firefox containers) are session containers. When one account can't be signed into two things at once, or two tasks need two identities, a profile per identity gives each task its own cookie jar. The profile is an implementation detail of the task, not something the user manages."
      live_views: "Once it's a window, live_views apply: crop one channel pane out of the Slack tab, scale it into a glanceable, and put the foo channel in the foo task and the bar channel in the bar task, even if they come from the same tab."
      proxies: "Where there is no web surface, fall back to the proxy layer in live_views (accessibility APIs, pixels with input pass-through, Prefab-style reverse engineering). You can't move the structure out of the app, but you can show a view of each part in the task it belongs to."
      bring_it_out: "Duggan's 'making a copy' becomes a reference: a task holds a link and a live view, not an export, so there's still only one underlying object, as in WindowScape's photographs."
    limits: "Web surfaces can drift, log out, or forbid framing (X-Frame-Options, CSP frame-ancestors), so the views are of top-level windows or tabs, not iframes. Some apps have no web surface at all, or a worse one."
    why_scott: "'The future needs files' asks for data outside apps. This gets the effect without the apps' cooperation: the data stays where it is, and the task gets a handle and a view."
  presenter_view:
    duggan:
      - "'Privacy becomes a first-class flag, driven by machine state. Private is a property of a window or tab, not a region of the screen. Private content renders occluded unless the machine can vouch for safety.'"
      - "'derive privacy state from machine-observable facts like connected displays, or active capture sessions and never from inferred human states like attention or idleness.'"
      - "'Connect to a novel display and it gets a \"ready to present\" screen by default. You explicitly aim it: this task, this window, or extend the canvas. Known displays skip the dance. Screen sharing is the same event with no cable. You don't need the model to have discipline if the door won't open, and you don't need the user to have memory if the default can't leak.'"
      - "'I'm asking for presenter view as a desktop primitive.'"
      - "'Browser tabs detach into real windows and join whatever task they belong to. The \"browser\" stops being a place windows live.'"
      - "The bad idea he gave up: idle drifts the viewport to public windows. 'reading is an idle state' and 'the threat is a pedestrian, which is undetectable.'"
    connections:
      attribution: "How it fits the field. Assembled from Don's earlier proposals; Don hasn't signed off on this section yet."
      per_output: "Presenter view is per-output rendering: the same canvas drawn differently on each display and each capture stream. The laptop panel draws private sources; the projector and the share stream draw them occluded. This is the only way 'occluded' can be done right, because a whole-screen share captures what the compositor hands it, so the occlusion has to be in that output, not on the screen."
      flag_follows_views: "Private is a property of the source window, and every live view, crop, photo or proxy of it inherits the flag. A cropped corner of a private mail window is still private unless you clear it on that view. Without inheritance, live_views would be a leak: transclude the private thing into a public task and it's shown."
      ready_to_present: "The 'ready to present' screen is an empty presenting photo (photographs.don_answer.privacy). Aiming the display means putting views into it. Nothing private is in the photo until you put it there, so the default can't leak."
      known_displays: "Known displays and their aims are small files in git, like photos: display identity, which photo or task it aims at, and whether it's trusted. 'Known displays skip the dance' is a lookup in that file, and trust is something you can read and diff."
      prior_art:
        - "Apple Keynote presenter view: slides on the projector, notes and the next slide on your screen."
        - "Per-window capture exclusion already exists, but apps set it, not users: macOS NSWindow.sharingType = .none, Windows SetWindowDisplayAffinity(WDA_EXCLUDEFROMCAPTURE), Android FLAG_SECURE. Duggan's flag is the same mechanism handed to the user per window or tab."
        - "macOS can hide notification contents while the display is mirrored or shared, which is a machine-state privacy rule shipping today for one kind of window."
        - "Sharing one window instead of the whole screen in Zoom, Meet and Teams is the manual version of aiming."
      tabs: "Detached tabs are already covered by self_hosting and app_locked_tasks: a tab is a source, tasks and photos hold views of it, and the browser is one more window, not the place windows live."
      limit: "Machine state covers projectors and shares. It does not cover someone looking over your shoulder, and Duggan is right that nothing machine-observable does."
    why_scott: "Scott's KDE talk asks what the desktop would be if we started from today's hardware. Every laptop now plugs into strange screens and shares its screen many times a day, and the window system still treats both as a surprise."
  box_model:
    attribution: "Don's proposal: the CSS box model (crop, border, padding, margin) made live and inhabitable."
    edges: "Crop, border, padding and margin are all edge operations, and every edge is editable live (none, some or all at once). Crop cuts into the content, padding pushes the content in from the border, and margin pushes neighbors away from it."
    borders_are_grooves: "A border isn't decoration. It's a groove or spike you can attach things to: tabs, pies, sub-windows, rigs, pins. Every window frame is a line of attachment points (GROOVES-AND-SPIKES)."
    both_sides: |
      Every border has two sides: padding inside, margin outside. Both are optional areas where
      things can live, like both sides of a street. Things hung on the inside belong to the window;
      things hung on the outside belong to the neighborhood. It's Don's roads with even addresses on one
      side and odd on the other, and halls with doors on both walls. Each border is a street, padding
      and margin are its two sidewalks, and a sub-window's address is (border, side, distance along).
    membrane:
      idea: |
        The border is the actual membrane. Things sit on either side of it, or penetrate it and sit on
        both. A door is an opening people pass through; a window is an opening light and information
        pass through, but not people. Openings can be one-way, typed, or rate-limited.
      customs: "Borders can have customs posts that filter what crosses and convert it in and out of local currencies and materials: formats, units, permissions, scales, languages. A clip crossing into a spreadsheet room becomes cells, and a prompt crossing into a character's room is translated into that character's voice and context."
      alan_kay: "Kay's cell metaphor for objects: an opaque interior, a membrane, and messages as the only way across. In biology the membrane is studded with transport proteins (channels, pumps, receptors), each a gateway for one particular kind of molecule, energy or signal. Here every opening in a border is one of those: a typed port, so the membrane decides what can come in, what can get out, and at what cost. See ../alan-kay/ideas.md (cells and membranes, the repo as message bus)."
      why_scott: "Scott's silos (KDE [25:06]) are membranes with no openings. His crossed boundaries (Ubuntu [29:33]) need doors, windows and customs, not a wall knocked down."
    composes: "Padding and margin are just fields too, so they can carry scale: a margin can be a puff zone holding a big signpost tab, or a padding a bag of holding along the inside edge. Two windows whose margins touch share a street, and things on it can belong to both."
  non_empty_space:
    paper: "'Future systems might explore how to designate a group of icons as \"non-empty space,\" where, for example, maximize does not cover the space, but manual resizing of windows allows the icons to be covered. Alternatively, the notion of desktop icons could be replaced by something that more tightly integrates with the window system.' (Hutchings & Stasko 2004 §6.3)"
    answer: "This room's proposals take the second option. Icons stop being a layer under the windows: they become stuff hung on rigs, in bags and on puff zones, pinned into the same field as the windows. A rack of icons is a rig whose space other things snap around, not into. Maximize means 'grow until you meet a rig', and a manual drag can still push past it. Nothing has to be a special desktop layer, because the desktop is just the root window's field."
    links: "rigs, painted_scale, pins (above); sources/2004-hutchings-stasko-display-space-management.md"
  painted_scale:
    attribution: "Don's proposal. You build containers and emphasis by painting the scale field, with no special widgets."
    bag_of_holding: |
      Paint a U-shaped bag with walls, then draw a scale gradient from the open top line (1.0) down the
      sides to the bottom of the U (0.1). Paint a flat 0.1 floor at the bottom so it isn't all ramp. In ARK
      physics, throw an object in: it shrinks as it falls and bounces around among the other tiny
      things at the bottom. Reach in and drag one up the gradient and it grows back to full size as it
      comes out. A bag is just walls plus a gradient, and you can carry it in your pocket (the scrapbook).
    puff_zone: |
      Turn it upside down: an inverted U that ramps from 1.0 along the bottom to 10.0 at the top. Throw
      an object up there and it gets really big. It projects out past the edges of its box instead of
      being clipped, so you can see it from a distance and it becomes a focus of attention or a signpost.
      Importance is a place you put things, not a style you apply.
    headers: "A header is a puffed-up circular area at the left of the page. Drag the start pin of a line of text into it and the line puffs up. Heading levels are puff strengths, and an outline is a column of puffs. Demote a heading by dragging its pin out of the puff."
    rules:
      - "Scale is in the field, not on the object, so the same object reads differently depending on where it sits, and moving it is how you restyle it."
      - "Overflow is allowed. Big things draw over their neighbors' borders, the way a signpost stands above the roofs."
      - "Physics respects the field: momentum and collisions happen in local scale, so tiny things at the bottom of the bag jostle at their own size."
    corners_not_iconify: "Want a small icon you can always see? Don't iconify it and then move it; just move it to a corner or edge whose scale is small. Being there is what makes it small, and dragging it back out restores it. Iconify stops being a state of the window and becomes where you put it."
    regions_have_policies: |
      Each region carries its own dimensions of scale, not just one number: how far to shrink, in
      which direction to project or collapse, and whether to iconify, minimize, summarize (title only,
      a one-line LLM précis, a thumbnail), filter (show only unread, only errors, only diffs) or leave
      some part visible (the cropped region you chose, the status light). The policy belongs to the
      place, not to the window, so moving a thing between places changes how it's shown.
    many_holes: "So you get different holes and boxes for different purposes, each a different kind of collection and data flow: an always-visible corner tray, a bag of holding for stash, a summarizing inbox rail, a filtering error drain, an archive hole that slows time. Choosing where to drop something is choosing how it'll be kept, shown and processed."
    reminder_hole:
      paper: "Hutchings & Stasko 2004 §6.4: interrupted users want 'a visually salient area of the screen to drop windows that should be returned to later'; the dock 'is not in my face enough'. They suggest a special drop area, or a 'super window' that cycles reminders with change-blind animation. sources/2004-hutchings-stasko-display-space-management.md"
      answer: "One of the many holes, with a salience policy instead of a shrink policy: things dropped there stay readable, glow or grow a border spike, and their weight never decays. A cycle policy turns the same hole into the super window, a deck that deals one reminder at a time. Filter rules (the admins' 'important people', 'important subjects') can route mail straight into it."
      journey: "Every reminder keeps its journey back to the room, task and conversation it was pulled from, so going back restores the context, not just the window."
      never_close: "The hole is the opposite of CIWM: nothing in it gets closed for lack of focus. Burden moves 'from the brain to the eyes', and stays there until you take it out."
    kit: "ARK physics + push-pin constraints + transformation and distortion areas + grooves and spikes + girders + roads + halls + racks. Every piece is stuff you can paint, snap, pin and throw, and save to git."
    why_scott: "It's his spatial stash (KDE [29:25]–[31:03]) given depth: a stash that doesn't take up room, and emphasis you make by direct manipulation rather than through a style menu."
  its_all_stuff: "Scott's fourth ST layer, taken literally. Every window, scrapbook, clip, pin and pocket is a MOOLLM object (a file or directory in a git repo, as in the room, container, inventory, object and card skills). So a pin is a reference you can commit, a layout is a diff, and moving a scrapbook between pockets is a git mv you can see in the log and undo."
  moollm_skills: "https://github.com/SimHacker/moollm/tree/main/skills (room, container, inventory, object, card, file-system-object)"
  why_scott: "It's his three memories in one substrate: spatial (where it's pinned), associative (what it's pinned to) and episodic (the clock you can scrub)."
  corpus:
    - "../../repo-shows/building-the-sims/pause-time-and-rng.md (ScriptX clock hierarchy)"
    - "https://github.com/SimHacker/moollm/blob/main/designs/webtop-gwern-inheritance/K-PYRAMID-ATTENTION-MAPS.md (weight scalar, fisheye/DOI)"
    - "https://github.com/SimHacker/moollm/blob/main/designs/pie-stack-views/GROOVES-AND-SPIKES.md (ARK, tabs on any side)"
    - "../ken-perlin/ (Pad, zooming plane)"
    - "../david-temkin/ (Mesa zoom canvas, Declare constraints for pins)"
    - "../david-ungar/ and ../randall-smith/ (Self, ARK)"

working_memory:
  thesis: "The desktop's real job is working memory; windows, files, and clipboard each solve a slice of it in silos (KDE [25:06])."
  three_memories:
    spatial: "where I put it — a messy, organic arrangement in the periphery"
    associative: "what goes with what — a document's own collection of clips and files"
    episodic: "what I did and when — attention traces summarized into a story"

learning_loops:
  source: "https://jenson.org/games/ ; Ubuntu [21:24]"
  summary: "From eight weeks applying Raph Koster's A Theory of Fun: intent → action → result → feedback updates the mental model. Affordances prompt loops you know; 'hintiness' moves you to new ones. Mario has three jump loops; pinch is a higher-order loop on drag. Mobile is 'a prisoner of our flat slab of glass'; long-press is evidence of an expression problem."

files:
  source: "https://jenson.org/files/ ; https://jenson.org/files2/"
  summary: "Files are chunks of work you can see, move, act on, and share; folders organize data-first instead of app-first. The Mac desktop was a temporary working area, and the original Finder's 'Put away' returned a thing to where it came from — dropped in OS X. Documents are dope; data should live outside apps."

