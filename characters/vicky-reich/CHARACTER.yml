bio:
  summary: |
    A librarian whose career runs from reference work to building the systems
    that keep scholarly publishing readable. Library of Congress (science
    reference, planning, and an early optical disk pilot in the 1980s);
    National Agricultural Library (head of acquisitions); University of
    Michigan; Stanford University Libraries (chief of serials and
    acquisitions). Assistant Director of HighWire Press at Stanford, which put
    scientific and medical journals on the web from 1995, and the Libraries'
    expert on copyright and fair use. With David S. H. Rosenthal she founded the
    LOCKSS Program at Stanford Libraries in 1999, and was a founder of the
    CLOCKSS Archive; they stepped away from managing LOCKSS in 2016.
  awards:
    - "ALCTS Outstanding Collaboration Citation, February 2007, as a founder of CLOCKSS (LOCKSS history)"
    - "ALCTS/Ulrich's Serials Librarianship Award, February 2008 (LOCKSS history)"
    - "LITA/Library Hi Tech Award for Outstanding Communication in Library and Information Technology, April 2014, with David Rosenthal (LOCKSS history)"
    - "Paul Evan Peters Award, 2025, with David Rosenthal, from CNI, ARL and EDUCAUSE (LOCKSS news; ARL)"
  papers:
    - "Vicky Reich and Mark Weiser, 'Libraries Are More Than Information: Situational Aspects of Electronic Libraries', Serials Review 20(3), 1994; Xerox PARC CSL-93-21"
    - "David S. H. Rosenthal and Vicky Reich, 'Permanent Web Publishing', FREENIX track, USENIX 2000, which credits the Long Now clock as an inspiration"
    - "Vicky Reich and Terry Winograd, 'Working Assumptions About the Digital Library', Stanford Digital Library Project"

connections:
