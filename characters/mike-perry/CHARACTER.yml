  home: characters/mike-perry/

representation:
  governed_by: ../../schemas/portrayal-standards.md
  consent_level: 1                      # public Facebook post to Maxis Alumni; not yet contacted
  authored_by: don-hopkins
  needs_confirmation:
    - "Start date at Maxis — March 1996 newsletter says producers had been around 'the last year and a half', implying ~late 1994. Not stated directly."
    - "Exact role/title on LunaSim/Tycho Rising — 'designing' per his own post; 'Producer' per the newsletter. Both, probably; confirm."
    - "Whether the Tycho Rising E3 disc (6-17-97) and LunaSimX Resource Files (4/29/98) are readable."
    - "Whether the Talley Research LunaSim focus group report (Dec 1996) survives."
