design_notes:                            # quoted from the document, see lunasim-tycho-rising.md
  creed: "'a software toy whose uses are limited only by the player's imagination'; 'no winning or losing conditions'"
  central_mechanic: "player cannot act directly — must instruct special-function robots, which carry out the instructions"
  economy: "LUNOX oxygen from 40%-oxygenated regolith; Hydrogen arrives only as export profit, so breathing depends on trade"
  combat: "no dedicated weapons — civilian machines repurposed; Road Builder's paving laser (1:1 accuracy), Truck's rock-throwing (1:3)"
  city_form: "radial colony growing in rings from a pressurized hub, not a grid"
  disasters: [meteor strikes, rocket crashes, radiation, moonquakes]      # press sheet
  research_basis: "'Scientifically accurate with information from NASA and the USGS'"  # press sheet
  tension: |
    Internal doc calls it a "software toy" with "no winning or losing conditions"; the press sheet
    calls it "a strategic game" with "combat missions" and "declare war". Same features, inverted
    priority. The robot-command mechanic survives in both.

lineage:
  chain: "LunaSim (1996) → Tycho Rising (1997) → shelved for SimMars → SimMars cancelled, climate tech reused in Spore"
  see: ../jason-shankel/sources/spore-prototyping-career.md
  irony: "'launching a mission to Mars' was itself an advanced-event feature of Tycho Rising, per the press sheet"

