invitation:
  status: not_yet_written
  consent: not_yet_asked
  contact: "via Maxis Alumni (Facebook)"

bio:
  summary: |
    **Mike Perry** — Maxis producer and designer. Designed **LunaSim** (1996), an open-ended
    moonbase colony simulator, which by 1997 became **Tycho Rising**, adding RTS combat. Shelved
    shortly after the EA acquisition in favor of **SimMars**. He kept the design binder, the
    focus-group report cover, and two CD-Rs, and photographed them for the Apollo 11 50th
    anniversary in July 2019 — which is the entire surviving public record of the project.

career:
  - era: "by ~1994–1998"
    org: Maxis
    role: "Producer; designer, LunaSim / Tycho Rising"
    evidence: "March 1996 what Newsletter? names 'Producers Michael Perry, Andy Larson and Chris Weiss'"

artifacts:                              # unless noted, photographed by him, 2019-07-21
  - what: "Tycho Rising press fact sheet — description, features, availability, price, sysreqs"
    date: "1997-06"
    held_by: "The Strong / Museum of Play"
    found_by: phil-salvador
    photographed: "2018-05-02"
