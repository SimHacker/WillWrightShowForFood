    announced:
      availability: "1st Quarter 1998"
      price_usd: "40-50"
      players: "1-8; modem, LAN, Internet"
      platform: "Windows 95, Pentium 90MHz, SVGA 65K colors, 2x CD-ROM, 16MB RAM"
  - { what: "LunaSim / Tycho Rising design document, 'Design Details', Rev A", date: "1997-07-22", pages: 49, held_by: "Mike Perry" }
  - { what: "Same title, Introduction section, Rev A", date: "1997-08-29", pages: 36, held_by: "Mike Perry", note: "second document, same revision letter" }
  - { what: "LunaSim Focus Groups, Talley Research (Mill Valley CA), prepared for Maxis", date: "1996-12", held_by: "Mike Perry", note: "cover sheet only in photographs" }
