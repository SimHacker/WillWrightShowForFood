# Van Leer leather press — robot collection gag

id: van-leer-robot-collection
type: gag
status: canon
authored_by: don-hopkins
tagline: "Menacing antique leather press. Modemstraat. Disketteweb. Of course."

pitch: |
  Don's **robot collection** — not built robots, **street art that reads as robots**. A massive
  **Van Leer** antique leather press sits outdoors in industrial **North Amsterdam** near
  **Oosterdok**: grey/charcoal frame, pink gears, rust-orange press pistons as teeth. Every angle
  is a different menacing face.

  **Modemstraat** and **Disketteweg** (*disketteweb*) in **Tuindorp Oostzaan** — tech-themed
  street names beside heavy iron. Slats claims training data. Vandermeer cites floppy storage.

