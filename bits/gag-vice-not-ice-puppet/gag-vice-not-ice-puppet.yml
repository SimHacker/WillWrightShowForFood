# VICE NOT ICE — the balloon-physics drag puppet (a segment concept)
# A joyful, trans-inclusive video-puppet bit: celebrate gender play, skewer the hypocrisy + cruelty of
# an anti-trans / anti-immigrant DHS-ICE regime. Celebrate, don't shame. Aim the edge at power.

id: vice-not-ice-puppet
type: gag
status: seed

the_bit: |
  A video puppet (the show's chroma-key / low-tech kind) rigged with EXAGGERATED soft-body physics —
  giant jiggly balloon "boobs," and (per the puppet-me-consent grant) dongs too — for the bimbos, drag
  queens, faux/bio queens, drag kings, and girls — and TRANS GIRLS ARE GIRLS. A dance number where
  dongs and boobies bounce together, physics played for pure joy. Slogan: **VICE NOT ICE** — choose
  harmless, joyful vice over state cruelty.

what_its_really_about: |
  The joke is NOT "ha, a man in fake boobs" — the show LOVES drag and gender play; that's the opposite
  of shame. The target is HYPOCRISY + STATE CRUELTY: a DHS/ICE regime that persecutes immigrants and
  trans people for who they are, run by officials who **costume themselves for the cameras** as a
  matter of public routine. Celebrate the gender play; point the mockery at the cruelty and at the
  official performance, never at anyone's private life.

the_target_is_the_officeholder: |
  **Kristi Noem, Secretary of Homeland Security** — the official who ran the department, on the public
  record, in her own press appearances. The satirical material is her **own publicly staged costume
  presentation**: turning up to enforcement operations kitted out in tactical gear for photographers.
  That is dress-up as statecraft, performed voluntarily, in public, by a cabinet officer — which is
  fair game by every standard this repo has.
  **The double standard writes itself and needs no tabloid:** an official who plays costume identity
  for the cameras, heading a department that persecutes people over identity. Aimed at power, sourced
  to public conduct, and funnier than the alternative because it is about her own choices.
  needs-check: cite specific appearances and dates from mainstream reporting before writing a script.
  Her public statements and DHS actions are the sourcing; nothing else is needed.

house_test: |
  **What earns a satirical preset here, stated once so it can be applied evenly.** Three conditions,
  all required:
    1. **The subject holds office or power.** Not a spouse, not a relative, not a household. An
       officeholder acting as one.
    2. **The material is the subject's own public conduct** — things they said, staged, or did in public,
       or that are on the court record. Mainstream sourcing with a date.
    3. **The joke survives being fact-checked.** If the bit needs a specific contested image to be
       genuine in order to land, it is built on sand and belongs to whoever disputes the image.
  `trump_mushroom` passes on all three: public record, court matters, an on-the-record published
  account. A preset that fails any of them gets retargeted at power or deleted — the parts are generic,
  so nothing is lost either way.
  **Why condition 3 is not squeamishness but this repo's own argument:** the Faceball adult section
  demonstrates that an occluder plus a tracking signal makes audiences construct a maximal version
  WHETHER OR NOT anything is behind it — bubble porn fires on nothing but clothing. So a blurry image
  plus a confident caption is exactly the configuration that manufactures certainty, and we do not get
  to invoke that mechanism as design insight and then forget it when a photo flatters the bit.
  → ../../designs/faceball-construction-set/adult-section.md#what-censorship-actually-does

thats_not_ai_this_is_ai: |
  Kept, retargeted. **Crocodile Dundee style: "That's not AI. THIS is AI."** — aimed at the whole
  current flood of AI slop and at every "must have been AI" dismissal, rather than at one disputed
  image. We build a proudly, obviously AI-coded boob-physics sim and let it out-absurd the genre.
  Stronger this way: the bit no longer depends on winning an argument about a photograph.

care: |
  Consistent with puppet-me-consent#scope_and_care: satire of PUBLIC officials and their hypocrisy is
  fair game; gleefully punching DOWN at a private individual for gender-nonconformity is not the point
  (and cuts against our own pro-drag ethos). Keep the edge on power — the anti-trans/anti-immigrant
  posture of DHS/ICE, and the official costume performance — and keep the gender play a celebration.
  **No spouses, no children, no private citizens. Officeholders and their public conduct only.**

the_song: |
  Open casting call: the PERFECT song to dance dongs + boobies to together — bouncy, joyful, a little
  filthy, ideally a cover-chain candidate (resample it, cover it, transcend it — see the riff loop).
  Audience / homefun can nominate and fork.

dance_off:
  what: |
    A **dance off** built from **Faceball Construction Kit** puppets — dongs and boobies bouncing
    together on soft-body jiggle physics. Show a guest the puppets others have made, then invite them to
    build their own and join the floor.
  build_with: ../../apps/performance-space/faceball-construction-set.yml#soft-body-anatomy
  cast:
    # NOTE: we do NOT presume Brian participates in this bit. He's a conversation guest about the
    # Bowie/Eno history; he was shown the tools + warned about the ADULT section earlier, and any
    # involvement is entirely his call — no expectation. See ../../characters/brian-eno/bowie-snl-1979.md.
    will_wright: |
      Dances with a **Spore penis monster** — the emergent "**Sporn**" his own creature editor made
      inevitable. Will, of all people, knows you can't stop the players from building one.
    everyone: "Bimbos, drag queens, bio/faux queens, drag kings, girls — trans girls are girls — audience balls too."
  mythic_quest_ttp: |
    Screen the **Mythic Quest "Time To Penis"** beat (its penis-building storyline) as the cold open:
    every creation tool becomes a penis generator. Faceball agrees — so we make it a **dance number**,
    not a bug report. TTP as a feature, celebrated.
  spore_tie: ../../repo-shows/will-wright-premiere/game-bridge-sims1-spore.yml

the-reveal:
  what: |
    The comedic climax. The balloon-boob / dong puppet is a **full-screen anonymizing mask** the dancer
    performs behind — driven by their whole-body motion. After a spectacular number, **with their
    explicit up-front consent**, we show the raw "behind-the-scenes" video WITHOUT the overlay. The
    unmask is the punchline.
  consent_first: |
    Opt-in agreed BEFORE the dance, revocable up to air; the performer owns both cuts (masked + raw).
    No non-consensual reveal, ever.
  blackmail_trope_inverted: |
    Deliberately evokes the kompromat / "Epstein tapes" blackmail vibe — then INVERTS it: real kompromat
    is nonconsensual coercion; ours is consensual celebration. Same tension, opposite ethics; the
    consent is the joke. The peg is the OFFICEHOLDER and her own costume presentation — see
    the_target_is_the_officeholder. Nothing here rests on anyone's spouse or on a private person's
    body, which is the distinction the whole bit is about: consented performance versus coerced
    exposure. Getting that wrong would invert the ethics back.
  engine: ../../apps/performance-space/faceball-construction-set.yml#anonymizing-puppet-and-reveal

physics_note: |
  Real, buildable: soft-body / jiggle physics on a puppet rig is a legible, funny tech demo — the
  seams-showing, low-tech spirit of the video puppet. A forkable browser toy in its own right.

