# FlatterBot 2000!
# Repeatable guest segment — over-the-top AI sycophancy reading

id: flatterbot-2000
name: "FlatterBot 2000!"
type: tradition
status: seed
invented: 2026-07-15

tagline: |
  Subject the guest to a dramatic reading of their own AI-generated hagiography —
  biographically accurate enough to sting, wrong enough to laugh off.
  **Jiminy Glick fawning + Pee-wee Playhouse terrible ventriloquism.**

vibe:
  glick:
    source: "Jiminy Glick (Martin Short) — Primetime Glick"
    what_to_channel:
      - absurd hyperbolic fawning ("YOU are the Meryl Streep of [guest's field]!")
      - confident wrong facts; guest corrections steamrolled or misheard
      - invented celebrity adjacency and name-drops
      - physical/read-aloud intimacy — too close, too earnest, too long
      - oblivious grandeur; the reader believes every syllable
  pee_wee_ventriloquism:
    source: "Pee-wee's Playhouse — terrible ventriloquism bit"
    what_to_channel:
      - FlatterBot 2000! is obviously Don doing bad ventriloquism; audience totally in on it
      - the "dummy" voice reads the AI mega-lecture; lips move, everyone sees through it
      - no attempt to sell the puppet as real — the badness IS the joke
  don_denial:
    beat: |
      After a especially grotesque FlatterBot line, cut to Don's normal voice:
      "I would never say that." — even though he clearly just did.
      Guest may echo denial about praise wrongly attributed to them, or accept stolen valor.
      Layered consent theater; everyone knows, everyone plays along.
  humble_credit_correction:
    beat: |
      FlatterBot attributes someone else's real achievement to the guest — inflated twice
      (wrong person + "famous" when it was merely early). Guest modestly corrects and
      redirects credit to the right colleague. Warm, not cruel. Misattribute bits of fan
      trivia, like conspicuously specific details of the deadly guinea pig incident, to
      the obviously wrong people. The this into other fictitious controversies like
      pools: rooms or objects? Flatterbot should be the one to deliver this standard
      question to every guests after flattering them, to irritate, provoke, and enrage them! 
  not: mean-spirited roast; hidden-camera embarrassment without consent, actual conflicts

premise: |
  Don performs FlatterBot 2000! as Pee-wee-grade ventriloquism: a separate "bot" voice reads the
  Mega Lecture (Glick-level fawning + AI sycophancy) while the audience watches Don's mouth move.
  Guest reacts live — deny, correct, humble-brag. Don periodically breaks character:
  "I would never say that." Transparent fiction; never presented as biography.

recipe:
  inputs:
    - verified public sources (CHARACTER.yml, talks index, press, GitHub)
    - optional MOOLLM/lloooomm whimsical corpus (private; performance material only)
  generation:
    - LLM or hand-edit: ~70% real career beats, ~30% loving bullshit
    - mandatory_errors: [wrong dates, fake TED talks, invented job titles, prophecy checkmarks, wrong author on real books]
    - tone: earnest lecturer who believes every word — **Jiminy Glick fawning + AI sycophancy**
  performance:
    - title_card: "FlatterBot 2000! presents: THE [GUEST] MEGA LECTURE"
    - reader: Don as bad ventriloquist; FlatterBot voice ≠ Don voice (obviously)
    - audience: in on the ventriloquism; no fourth-wall confusion
    - guest: seated; Glick guest-trapped-in-interview + may join denial game
    - pause_points: guest fact-checks; Don drops to own voice — "I would never say that"
    - optional_prop: cheap bot puppet or cardboard FlatterBot 2000! logo — not required
  consent:
    - preview script with guest before air or read cold only if they want the surprise
    - guest may veto lines; portrayal standards still apply

founding_example:
  guest: jason-shankel
  source_fiction: moollm/temp/lloooomm/00-Characters/jason-shankel/mega-lecture-synthesis.md
  source_verified: WillWrightShowForFood/characters/jason-shankel/sources/TALKS-INDEX.md
  private_gate: "private archive — not in this repo"
  sample_mistakes:
    - '"Jars AI founding Unity engineer" (unverified)'
    - '"Clinivise Director 2025" (unverified)'
    - '"Dr. Elena Rodriguez 2030" (fabricated historian)'
    - '"Sion Shankel goddess trinity" (LARP)'
    - GDC 2016 / TED 2019 talks that never happened
    - directx_book_wrong_author: see signature_beats.directx_bobo_correction
  sample_real_beats:
    - ParticleMan, SimMars, first Spore programmer
    - AWE 2013 Connected Play
    - Sonoma CS Colloquium teaching arc

signature_beats:
  directx_bobo_correction:
    canonical: true
    flatterbot_line: |
      "And of course we must pause to honor Jason Shankel's FAMOUS definitive book on DirectX —
      the sacred text that taught an entire generation of graphics programmers how to survive HRESULT!"
    don_denial: "I would never say that."
    guest_correction: |
      Jason (modest): "That wasn't me — that was Eric Bowman. We call him Bobo. And it wasn't
      famous, it was just early. Direct3D: Professional Reference, 1997."
    truth:
      author: Eric Bowman
      nickname: Bobo
      title: "Direct3D: Professional Reference"
      year: 1997
      coauthors: [Michael Stein, Gregory Pierce]
      fame_level: early reference book, not household famous
      source: "private archive — not in this repo"
      evidence_card: ../../characters/eric-bowman/sources/direct3d-professional-reference.md
      listing_cover: https://www.abebooks.com/products/isbn/9781562057251
    guest_room: characters/eric-bowman/
    payoff: Jason gives Bobo credit; bridge to building-the-sims reunion / Sims DirectX war stories
    evidence_bounce_cut: |
      After Jason's correction, hard-cut to book listing (cover + author line). Hold long enough
      to read "Eric Bowman." Eric reacts in a later splice. See building-the-sims/evidence-bounce-cut.md

repeatable_with:
  - any guest with enough public footprint for a "mega lecture"
  - memorial mode: read about deceased guest with discussants reacting (tasteful variant)

lineage:
  jiminy_glick: "Martin Short — Primetime Glick; fawning interviewer who gets everything wrong"
  pee_wee_playhouse: "Terrible ventriloquism — audience in on bad puppetry; joy through obvious artifice"
  don_denial: "I would never say that — performer disowns the dummy voice mid-bit"
  repo_traditions:
    - ../tradition-honest-fake-call-in/tradition-honest-fake-call-in.yml   # transparent fiction labeled on air
    - ../tradition-foreign-poet-play-along/tradition-foreign-poet-play-along.yml # guest narrates / reacts to performed text
    - ../tradition-unnecessary-censorship/tradition-unnecessary-censorship.yml # comedy through earnest misframing

