# bits/ — flat registry of cross-cutting show material
# One directory per bit; big-endian kind prefix (gag- theme- tradition- swag-).
# Kind lives in the name AND may live in the entry's BIT.yml (optional interface).
# Recategorize = rename, not migrate. Shows reference bits by id.
# Status: seed | ready | brewing | design_brief | recorded_prior_art | graduated
# Programming arcs are NOT bits — see ../process/tracks/. Refactor: ../repo-shows/REFACTOR.md

meta:
  id: bits-index
  last_reviewed: 2026-08-08
  rule: "One directory per bit; this index is the map; ls groups kinds by prefix."

