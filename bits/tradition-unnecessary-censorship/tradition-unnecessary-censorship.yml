# Unnecessary Censorship — cross-show tradition
# Policy: ../../repo-shows/will-wright-premiere/performance-and-culture.yml#unnecessary-censorship

id: unnecessary-censorship
type: tradition
status: seed

homage: "Jimmy Kimmel Live — 'This Week in Unnecessary Censorship'"
credit: "Full credit on air; voluntary comedy, never timid euphemism."

variants:
  broadcast:
    what: "Bleep/black-bar innocent words — comedy is the listener's dirty imagination."
    fits: [live_stream, captioned_clips]
  sims_gameplay:
    what: "In-engine bone-mesh pixelization over recorded machinima."
    gag: ../gag-pixelized-joint-wedding/gag-pixelized-joint-wedding.yml
  faceball_live_pixelization:
    what: |
      Live, in the Faceball kit: a **bounding box** on any part (boobs, dongs, joint, head) drives a
      **Sims-1-style pixelization mosaic** on the screen layer beneath it — **pixelated by DEFAULT**,
      with a local opt-in **"cheat code"** to lift it. Exactly how The Sims 1 self-censored.
    why_it_matters: "This is the PLATFORM-SAFE default: the uploadable cut is already self-censored, so it survives TikTok/Facebook moderation. The mosaic IS the joke."
    bit: "Pass a pixelated joint → it pixelates your head (mosaic follows the contraband)."
    engine: ../../apps/performance-space/faceball-construction-set.yml#modifiers   # sims1_pixelization

anti_rule: |
  We do NOT censor real names. Conan's Masturbating Bear stays Masturbating Bear.
  Unnecessary censorship is opt-in comedy; plain speech elsewhere.

