# Markup facade registry — yaml girders ↔ human markdown views
# Schema: ../schemas/markup-facade.yml
#
# POLICY: Important docs are hand-authored (LLM + human edit). Yaml→md script is TEMPORARY FALLBACK.

meta:
  id: markup-facades
  generator: ../scripts/generate-markup-facades.py
  invoke: "pnpm run facades"
  policy:
    default: instance_first
    rule: |
      Yaml girders are canonical for machines (tools, MOOLLM, CI, automation).
      Important human-facing markdown is hand-authored — link-rich, readable, no-ai-slop.
      Deterministic yaml→md (pnpm facades) is a TEMPORARY FALLBACK until a quality instance exists.
      Once hand-authored: render.mode llm in this registry; edit the .md; sync girder separately.
    hand_author_priority:
      - repo-show-format → FORMAT.md
      - ai-offs → AI-OFFS.md
      - homefun-grading → HOMEFUN.md
      - challenges/retrocomputing-drive → RETROCOMPUTING.md
  rendering:
    instance_first:
      - vision
      - crazy-idea-jam
      - character-endosymbiosis
      - entryways-root
      - entryways-museum-map
      - cross-links-trails-index
    fallback_deterministic:
      - repo-show-format
      - micropolis-ai-drag-race
      - ai-offs
      - manual-transmission
      - homefun-grading
      - brain-stream
      - orchestration-gold
      - retrocomputing-drive

facades:
  - id: repo-show-format
    source: repo-show-format.yml
    output: FORMAT.md
    title: "Repo Show format"
    status: fallback_deterministic
    note: "Hand-author next — current md is yaml tree dump until replaced"
    depends_on:
      - showmaker-network.yml
      - ai-offs.yml
      - brain-stream.yml

  - id: micropolis-ai-drag-race
    source: micropolis-ai-drag-race.yml
    output: DRAG-RACE.md
    title: "Micropolis AI Drag Race"
    depends_on:
      - code-that-spec.yml
      - manual-transmission.yml
      - ai-offs.yml
      - brain-stream.yml
      - challenges/retrocomputing-drive.yml
      - challenges/apple2-drive.yml
      - challenges/pdp10-maclisp-drive.yml
      - challenges/lisp-machine-hack-off.yml
      - ../repo-shows/micropolis-ai-drag-race.yml

  - id: ai-offs
    source: ai-offs.yml
    output: AI-OFFS.md
    title: "AI-offs"
    depends_on:
      - manual-transmission.yml
      - orchestration-gold.yml
      - brain-stream.yml
      - model-branching.yml
      - rig-feedback.yml

  - id: manual-transmission
    source: manual-transmission.yml
    output: MANUAL-TRANSMISSION.md
    title: "Manual Transmission"
    depends_on:
      - ai-offs.yml
      - brain-stream.yml
      - stick-shift-protocol.yml

  - id: homefun-grading
    source: homefun-grading.yml
    output: HOMEFUN.md
    title: "Homefun grading"
    depends_on:
      - ai-offs.yml

  - id: brain-stream
    source: brain-stream.yml
    output: BRAIN-STREAM.md
    title: "Brain stream"
    depends_on:
      - ../apps/stream-gateway/

  - id: orchestration-gold
    source: orchestration-gold.yml
    output: ORCHESTRATION-GOLD.md
    title: "Orchestration gold"
    depends_on:
      - model-branching.yml
      - ai-offs.yml

  - id: vision
    source: vision-and-ambition.yml
    output: VISION.md
    title: "Vision and ambition"
    status: instance_first
    render: { mode: llm, tone: longform, verbosity: standard }
    note: "Hand-authored — edit VISION.md; sync vision-and-ambition.yml girder"
    depends_on:
      - showmaker-network.yml
      - live-repo.yml
      - crazy-idea-jam.yml
      - repo-show-format.yml

  - id: crazy-idea-jam
    source: crazy-idea-jam.yml
    output: CRAZY-IDEA-JAM.md
    title: "Crazy Idea Jam"
    status: instance_first
    render: { mode: llm, tone: invitation, verbosity: standard }
    note: "Hand-authored reactor — edit CRAZY-IDEA-JAM.md; sync crazy-idea-jam.yml"
    depends_on:
      - vision-and-ambition.yml
      - cross-links.yml

  - id: retrocomputing-drive
    source: challenges/retrocomputing-drive.yml
    output: challenges/RETROCOMPUTING.md
    title: "Retrocomputing Drive"
    depends_on:
      - challenges/apple2-drive.yml
      - challenges/pdp10-maclisp-drive.yml
      - challenges/lisp-machine-hack-off.yml
      - apple2-emulator-stack.yml
      - pdp10-its-stack.yml
      - lisp-machine-stack.yml
      - ../schemas/rig-setup-dna.yml
      - ../rigs/_TEMPLATE.SETUP.md

  - id: entryways-museum-map
    source: entryways.yml
    output: entryways/README.md
    title: "Museum map — entryways hub"
    status: instance_first
    render: { mode: llm, tone: invitation, verbosity: standard }
    depends_on:
      - cross-links.yml
      - ../ENTRYWAYS.md
      - ../TRAILS.md
    note: "Hand-authored — per-doorway pages in entryways/*.md"

  - id: entryways-root
    source: entryways.yml
    output: ../ENTRYWAYS.md
    title: "Entryways — museum map (root)"
    status: instance_first
    render: { mode: llm, tone: invitation, verbosity: standard }
    depends_on:
      - cross-links.yml
      - entryways/README.md
    note: "Hand-authored — edit ENTRYWAYS.md; sync entryways.yml girder"

  - id: cross-links-trails-index
    source: cross-links.yml
    output: ../TRAILS.md
    title: "Trails index"
    status: instance_first
    render: { mode: llm, tone: invitation, verbosity: standard }
    depends_on:
      - entryways.yml
    note: "Hand-authored — per-trail pages in trails/*.md"

  - id: character-endosymbiosis
    source: character-endosymbiosis.yml
    output: CHARACTER-ENDOSYMBIOSIS.md
    title: "Character Endosymbiosis"
    status: instance_first
    render: { mode: llm, tone: longform, verbosity: standard }
    note: "Hand-authored article"
    depends_on:
      - ../repo-shows/INDEX.yml
      - crazy-idea-jam.yml

  - id: repo-show-themes-index
    source: ../bits/INDEX.yml
    output: ../bits/README.md
    title: "Repo Show themes — bucket index"
    status: instance_first
    render: { mode: llm, tone: invitation, verbosity: standard }
    note: "Hand-authored — edit themes/README.md; per-theme *.md overlays; sync *.yml girders"
    depends_on:
      - ../repo-shows/ideas/INDEX.yml
      - cross-links.yml
      - ../schemas/markup-facade.yml

see_also:
  - { path: INDEX.yml, why: "Process spec registry" }
  - { path: cross-links.yml, why: "Narrative trails — where to wander next" }
  - { path: ../schemas/markup-facade.yml, why: "Facade contract" }
  - { path: ../skills/INDEX.yml, why: "MOOLLM skills harvest registry" }
