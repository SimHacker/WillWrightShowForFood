  mediagraph:
    emoji: "🎵🥧"
    blurb: |
      Unity3D music-navigation prototype Don built for Will Wright at **Stupid Fun Club** (Jul 2015
      demo). **Songs** on a pan/zoom map, **roads** kiss-toggled by drop-on/drop-off. Per-song
      **pie menus** set radius + **biome** (cellular automata — Life, ice, moon surface; same
      biomes merge, different compete). **LOD:** flat polygons far, 3D terrain when close/editing
      (~85 fps with 1–4 live terrains). **Flick:** drag on a song (not empty map) fires you down
      the road in drag direction — Mario World cannon; cursor stays underneath. Auto-scroll follow
      or detach. Nested pies: config pies on songs build/edit the geographic song+road graph.
    video: "https://www.youtube.com/watch?v=2KfeHNIXYUc"
    medium: "https://donhopkins.medium.com/mediagraph-demo-a7534add63e5"
    source: ../characters/don-hopkins/sources/mediagraph-sfc-youtube-demo.md
    ties:
