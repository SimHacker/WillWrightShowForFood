      - ../characters/don-hopkins/career/stupid-fun-club.yml
      - crazy-idea-jam.yml#creationtv-storymaker

  ebike-safari:
    emoji: "🚴🎤"
    blurb: |
      **StoryMaker on wheels** — voice-first adventure navigation through a hidden story graph while
      riding a Koga eBike (Bosch motor + Enviolo CVT), any camera for capture, phone-as-display-only,
      Apple SpeechAnalyzer for words. The rider never sees the graph; the LLM interprets intent and
      hops virtual focus across POIs. **Voystick is the primary navigation UI on the bike** — not a
      side demo: warble along pie wedges to hop down arcs and between POIs/cards in the linked overlay,
      hands on handlebars, open-air gestures.
    why_voystick_on_bike: |
      **Outdoor = wide sloppy fast warbles without social cost.** Continuous pitch+vowel trace steers
      **singing while biking** — hands on handlebars, no office shame. **Both channels at once**:
      natural-language voice (SpeechAnalyzer) for commands, questions, tool names; gestural voice
      (Voystick) for arc hops. Rider **code-switches** fluidly between them — and combines them (say
      "Invader" while warbling the wedge). Not either/or.
    pie_navigation_lineage:
      zeroth: "Terrapin Logo Adventure (C64, age 17) — REPL-as-parser; hidden graph; GO between rooms"
      first: "DreamScape (1995 WWDC) — rooms kiss to connect; link globally, interact locally"
      then: [MediaFlow, iLoci, MediaGraph, Urban_Safari, Urban_eBike_Safari]
      chain: |
        Logo Adventure (zeroth) → DreamScape (first) → MediaFlow → iLoci → MediaGraph → Urban Safari → eBike Safari
      mediaflow: "Interval — Mac Common Lisp + QuickTime hypermedia streams/dataflow (no pie menus)"
      iloci: "pie-menu network — rooms kiss to connect"
      mediagraph: "SFC Unity Jul 2015 — per-song pies (radius, CA biome); kiss-toggle roads; flick-on-song Mario-cannon nav; LOD terrain"
      urban_safari: "cards at POIs — invisible graph overlay"
      urban_ebike: "Outdoor = wide sloppy fast warbles, no social cost; pitch+vowel trace steers singing while biking"
    mediaflow_navigation: |
      Same navigation problem solved at every layer — from Terrapin **Logo Adventure** (zeroth:
      REPL-as-parser, hidden graph) through **DreamScape** (first: rooms kiss, link globally interact
      locally) to Interval **MediaFlow** (Mac Common Lisp + QuickTime hypermedia streams — **no pie
      menus**), **iLoci**, **MediaGraph** (song+road graph with Mario-cannon flick navigation),
      **Urban Safari** cards at POIs. **eBike Safari** completes it: outdoor = wide sloppy fast
      warbles without social cost; continuous pitch+vowel trace steers **singing while biking** —
      Voystick warbles along wedge arcs, hop POI→card, hands on bars. Don: "really fun and smooth —
      best gestural UI I've ever done."
    field_hardware: [Koga, Enviolo, Bosch, any camera]
    voystick: crazy-idea-jam.yml#voystick-homomorphic-vocal-joystick
    ties:
      - ../repo-shows/ebike-safari/ebike-safari.yml
      - ../characters/don-hopkins/sources/urban-safari-steering-voystick-pie-network.md
      - ../characters/don-hopkins/mediaflow-design-comments.md
      - ../characters/don-hopkins/interval-research-pluggers-and-mediaflow.md
      - crazy-idea-jam.yml#urban-safari-gps-storytelling
      - crazy-idea-jam.yml#voystick-homomorphic-vocal-joystick
      - crazy-idea-jam.yml#iloci-memory-palace
      - crazy-idea-jam.yml#mediagraph
