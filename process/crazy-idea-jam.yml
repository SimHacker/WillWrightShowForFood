      - ../characters/don-hopkins/sources/mediagraph-sfc-youtube-demo.md

  urban-safari-gps-storytelling:
    emoji: "🗺️"
    blurb: |
      **Urban Safari** — the geolocated branch of StoryMaker: capture scene cards in the field,
      follow others' paths through a shared graph at real POIs. Layar AR field demos, Facebook album
      export/edit/import round-trip, lessons from playtesting StoryMaker on Bar Karma's real audience.
      Performed in Amsterdam (2011); 2026 carries it forward as eBike Safari — the live app and Repo Show.
    progenitor_of: [ebike-safari]
    progenitor_chain: [bongo-bingo, creationtv-storymaker, iloci-memory-palace]
    demo: "https://www.youtube.com/watch?v=Db8KGNoeKHE"
    room: ../characters/don-hopkins/media/storymaker-urban-safari/INDEX.yml
    ties:
