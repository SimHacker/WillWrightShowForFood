      - crazy-idea-jam.yml#dreamscape-scriptx

  voystick-homomorphic-vocal-joystick:
    emoji: "🎙️"
    blurb: |
      **VoyStick** — pitch=Y, vowel=X: a parallel gesture channel *below* speech recognition. The
      computer synthesizes the same vocal gesture it recognizes (**homomorphic** bidirectional loop):
      you sing along to confirm — harmonic blend = on target, inharmonic clash = off. Coined 1991
      from Oppenheim DSP homework (inverse telephony problem: track motion in voice space for UI,
      not reconstruct speech for bandwidth). First apps imagined: trippy paint program, whack-a-mole,
      blind users, lazy typists. Thirty-five-year arc: Phoneloper pitch envelopes → CMU pie-menu
      lecture → Evan Balster formant counsel → Geoff Lindsey F1/F2 vowel space → Pink Trombone
      synthesis → Zack Qattan Vocap/ML → GuitarPie 2025.
    axes:
      Y: "pitch (voicebox) — less reliable than vowel (Evan: auto-tune abundance)"
      X: "vowel — F1/F2 acoustic space; diphthong rails front (i,e,ɛ,a) + back (u,o,ɔ,ɑ); skip schwa"
      pressure: "lip rounding (minor)"
      click: "consonant delimiter"
    homomorphic_stack:
      analysis: [imitone resonator, aubio YIN, Praat formants]
      synthesis: [Pink Trombone, Flite/Phoneloper, LPC stub]
      feedback: "harmonic blend when matched; quiet monotone mode for non-singers (Evan)"
    pink_trombone: |
      Neil Thapen's browser vocal-tract toy — synthesis layer for homomorphic feedback. "yeah yeah"
      = yes, "oy oy" = attention/no (Don → Ben Shneiderman 2019). Zack Qattan: voice→params ML
      (Vocap, KNN/MFCC classifiers — Evan warns direct F1/F2 beats classifiers), Croquet multiplayer
      Pink Trombone, MIDI/gamepad control. Repo Show stacks Phoneloper × Pink Trombone × Voystick live.
    pie_integration: |
      Steady vowel pops pie menu at voice-space coordinates; each slice label sung as its vocal
      gesture; **voice ahead** = expert path (mouse-ahead analogue). eBike Safari = **primary
      use case**: hop down arcs and between POIs/cards in the linked overlay while pedaling — hands
      stay on handlebars.
    bike_navigation:
      what: "Essential navigation for the geolocated card overlay — not speech commands alone"
      outdoor: "Outdoor = wide sloppy fast warbles without social cost; pitch+vowel trace steers singing while biking"
      gesture: "Warble along a pie wedge = flick to the next linked node; pitch+vowel trace = arc along the menu"
      flick_navigation_lineage: |
        **MediaGraph** (SFC): flick in direction of travel — integrated pie-menu tracking on pan/zoom,
        Mario World cannon aim-and-fire. iLoci → MediaGraph → Urban Safari card graph — same navigation
        problem, now outdoors on a bike. (Interval **MediaFlow** = Lisp+QuickTime streams — parallel
        hypermedia thread, not pie flick.)
      don_verdict: "Really fun and smooth — best gestural UI I've ever done"
    dual_channel_voice:
      natural_language: |
        SpeechAnalyzer (words): "What's near me?", "Tell me about that canal", "Set destination",
        "Capture this", tool names, questions, guess confirm/veto in plain speech.
      gestural: |
        Voystick (pitch+vowel trace): warble along pie wedge arcs, hop POI→card, homomorphic
        sing-along confirm, voice-ahead expert path without menu diving.
      code_switching: |
        Rider **code-switches** between NL and gestural voice — and **combines** them. Select a tool
        or operation in natural language; execute spatial navigation gesturally. Expert riders stay
        mostly in gesture with NL punctuation; novices lean on words until gestures lock in.
        Both streams run in parallel; the LLM/parser fuses intent from whichever channel is active.
    extensions:
      guitar_pie: "Andreas Fender UIST 2025 — fretboard pies + Voystick on the bike"
      domain_specific_roar: "one-minute-intense.yml — continuous pitch+vowel+timbre as command bus"
      aquery: "jQuery-for-accessibility overlay — prerequisite in arbitrary apps"
    not_stickers: "Merch warnings live in bits/ (swag-*) — this entry is the *idea*"
    posture: "Flexible working implementation to discover what works — not academic, not startup"
    lecture: "https://scs.hosted.panopto.com/Panopto/Pages/Viewer.aspx?id=f0600d9d-282e-4b83-a6f4-a9f2003ad407"
    moollm: https://github.com/SimHacker/moollm/blob/main/skills/speech/voystick.yml
    ties:
