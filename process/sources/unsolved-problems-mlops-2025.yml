thesis: |
  ML systems are non-deterministic and data-driven; classical CI/CD, SLO alerting, canarying,
  and fast binary rollback do not transfer cleanly. Practitioners lack reliable production quality
  measurement, versioning, monitoring, cost routing, and leakage/injection controls.

problem_clusters:
  measuring_quality:
    unsolved:
      - bound stochastic model responses for testing
      - canary quality control across multiple models with stable baseline
    cited_examples:
      - { who: Brendan Burns, org: Microsoft Azure, event: SRECon Americas 2025, method: "LLMs judge LLMs + employee thumbs-up" }
      - { who: OpenAI, what: sycophantic release, issue: overly supportive disingenuous answers reinforced by short-term feedback }
    what_works_per_article: production user feedback (clicks, thumbs, copy-paste)

  provenance_versioning:
    unsolved:
      - widespread tooling + agreed versioning surface
      - dataset management at scale
      - provider transparency to API consumers
    note: same model name may differ by weights, system prompt, safety filters, time

  monitoring_observability:
    unsolved:
      - org ownership consensus
      - best practices for practitioners not monitoring
      - efficient inspectability without per-weight logging
    cited_stat:
      source: "State of Production ML 2024, Institute of Ethical AI & Machine Learning"
      finding: ~50% do not monitor model performance in production
      category: observability largest problem category

  efficiency_cost:
    unsolved:
      - LLM query cost estimation
      - load balancing across fine-grained model pools
      - capacity planning vs model proliferation
    cited_cost_example: "NVIDIA DGX B200 eight-card ~$500k (2024, per article)"

  security_leakage_injection:
    unsolved:
      - safe emission at source while retaining training data
      - practical universal inbound jailbreak filtering
    cited_mitigations:
      - remove secrets from training data (leakage)
      - defense in depth monitoring + failover (injection)
      - egress filters; proprietary stacks (Anthropic RSP / ASL-3 mentioned)

not_unsolved_per_article:
  - training network fragility (known expensive mitigations)
