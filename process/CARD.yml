# CARD — process/ room (WWSFF MOOLLM microworld)

room:
  id: process
  name: "Process & protocols"
  type: [yaml_girders, markup_facades, show_rules]

purpose: |
  Canonical specs for Repo Show format, game-show variants, retro challenges, ai-offs,
  and vision. Yaml stays brutalist machine-readable girders.
  Important markdown (VISION, CRAZY-IDEA-JAM, ENTRYWAYS, TRAILS, …) is curated directly;
  yaml→md script is temporary fallback for the rest.

methods:
  FIND-SPEC:
    signature: "INDEX.yml → yaml girder"
  READ-MARKUP:
    signature: "Human markdown view"
  READ-GIRDER:
    signature: "Raw yaml when implementing or automating"
  PICK-ENTRYWAY:
    signature: "entryways.yml → playlist by interest (guest, hacker, retro, …)"
    human: ../ENTRYWAYS.md
    human_dir: entryways/
  PICK-TRAIL:
    signature: "cross-links.yml → thematic sideways leap"
    human: ../TRAILS.md
    human_dir: trails/

entries:
  format: { yaml: repo-show-format.yml, markup: repo-show-format.md }
  moola: { yaml: moola.yml, topic: "Native play currency — exchange, duplication policy, performances" }
  auto_art_theft_grand: { yaml: auto-art-theft-grand.yml, topic: "AATG — Slats batch-scrapes deeds at GTA scale" }
  drag_race: { yaml: micropolis-ai-drag-race.yml, markup: micropolis-ai-drag-race.md }
  retro: { yaml: challenges/retrocomputing-drive.yml, markup: challenges/retrocomputing-drive.md }
  ai_offs: { yaml: ai-offs.yml, markup: ai-offs.md }
  manual: { yaml: manual-transmission.yml, markup: manual-transmission.md }
  homefun: { yaml: homefun-grading.yml, markup: homefun-grading.md }
  brain_stream: { yaml: brain-stream.yml, markup: brain-stream.md }
  orchestration: { yaml: orchestration-gold.yml, markup: orchestration-gold.md }
  vision: { yaml: vision-and-ambition.yml, markup: vision-and-ambition.md }

see_also:
  - README.md
  - INDEX.yml
  - GLANCE.yml
  - entryways.yml
  - cross-links.yml
  - entryways/README.md
  - ../TRAILS.md
  - ../ENTRYWAYS.md
  - ../skills/repo-show/CARD.yml
  - ../skills/INDEX.yml
