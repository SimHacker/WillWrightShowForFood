    note: "131 skills in SimHacker/moollm (and counting); WWSFF breeds show-born skills in ../skills/ separately"
  where: ../skills/
  pyramid: "GLANCE.yml → CARD.yml → SKILL.md → README.md (same as SimHacker/moollm)"
  harvest: |
    Cauldron SCOOP after each show — PLAY → LEARN → LIFT (play-learn-lift); skills are the LIFT.
    Protocol: github.com/SimHacker/moollm/tree/main/skills/cauldron
    scoop: github.com/SimHacker/moollm/blob/main/skills/cauldron/protocols/SCOOP.yml
