attention-atoms:
  tagline:
    - "Twittier than Twitter."
    - "Exier than X."
  thesis: |
    Shorter than TikTok. If we embrace short-form, go **shorter still** — respect the bumblebee
    span by not explaining what the link already contains.
  premium_tier_gag:
    what: |
      Satire of enshittified platforms: you **subscribe and pay** for the right to post **single
      letters and emojis** — the shorter the atom, the higher the tier. 🌀 costs more than "plays."
    repo_show_flip: |
      **TicketPR is free.** Merged PR = crew member. Optional donations buy recognition (box seats),
      not the right to speak. We charge for **less** text only as comedy — never as gatekeeping.
    see: repo-shows/will-wright-premiere/performance-and-culture.yml#participation-economy
  forms:
    one_quote_one_link:
      what: "One quote. No explanation. Just a link."
      example_shape: |
        > "Pac-dots are calorie free."
        → repo path or primary source URL
    one_glyph:
      what: "One letter or emoji — maximum compression; premium-tier gag only"
      examples: ["🌀", "X", "⚡"]
      note: "Twittier than Twitter; Exier than X"
    one_kline:
      what: "One word, phrase, or K-line that **explains itself** and invites exploration."
      examples:
        - "fnord"
        - "plays"
        - "Send code, not commands"
        - "Be somebody important — be yourself."
      rule: "Send code not commands — the atom RUNS in the reader's head; the repo is the manual"
  not:
    - "Thumbnail face + 90-second setup before the point"
    - "Algorithmic engagement bait padding"
  yes:
    - "Shotgun blast of atoms — skim, skip, jump; depth is optional, always linkable"
    - "Repo path as the explanation (RTFR when you want more)"
  ties_to:
    - couple-and-solo-shows.yml#shows-and-episodes
    - characters/will-wright/guest-prototype.yml#attention-economy
    - characters/don-hopkins/portrayal/voice.yml#writing-philosophy

interstitials:
  note: "Between-segment bumpers + palate cleansers that make full shows feel personal and lived-in."
  the_cats:
    what: |
      Don's CATS as recurring stars — talking-cat-face faceballs, interstitial bumpers, and the real
      at-home INTERRUPTIONS (cat crosses the desk mid-take) kept in, not cut. Includes a gentle
      recurring tribute to **Napoleon** (the cat we lost) from the photo/video archive.
    running_gag: "Monetize the cats to pay for the food they eat — deadpan mock-business (a PUBLIC gag, not the real monetization plan)."
    spec: ../characters/don-hopkins/cats.yml
    faceball: ../apps/performance-space/faceball-construction-set.yml#talking-selfies
    feeds: repo-show-format.yml#directors-cuts     # short-form between-segment content

participation-rituals:
  note: "Local kids-TV participation → Repo Show orchestration (TicketPR, audience/, live call-on)"
  map:
    - from: "Captain 20 Gerbil Races — postcard in, call kid live, pick a racer, win a prize"
      to: "TicketPR lottery + YOUR NAME HERE: COME ON DOWN"
    - from: "Channel 20 Club Card drum — numbered stubs pulled between cartoons"
      to: "Merged TicketPRs + box-seats / balcony in audience/INDEX.yml"
    - from: "Space Gallery / Bozo Art Gallery — every kid drawing on air"
      to: "Audience PR artifacts, costume.yml, homefun — shown in repo + on stream"
    - from: "Captain Chesapeake treasure chest — read viewer letters on the tugboat"
      to: "Don Philahue surfaces questions.yml + HN comments; letters become git"
    - from: "Bruce the Bird unseen — kids mail how they imagine him"
      to: "MOOLLM audience characters — you define the persona; host reads your CARD"
    - from: "Crew Members Club cards"
      to: "TicketPR merge = crew member at repo-shows/<show>/audience/<you>/"
