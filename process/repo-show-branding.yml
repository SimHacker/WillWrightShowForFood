    character: "Claudia (Margo Martindale) — KGB handler"
    scene: "Cafe — Elizabeth finds 'Granny' playing Ms. Pac-Man"
    dialogue:
      - "I enjoy the maze part and the eating without eating part. Pac-dots are calorie free."
    theme: |
      Maze chase, consume without consequence, hunter and hunted — life as arcade logic.
      Viewers read it as existentialism through Pac-Man: the handler philosophizing spy life
      as a game you play in a maze. GO-TO excerpt for episodes about **video games and
      existentialism** (SimCity, The Sims, microworlds, attention economy).
    use_when:
      - "Video games + philosophy / procedural rhetoric"
      - "Cold War DC backdrop + formative tech culture"
      - "Handlers, puppetry, characters who perform identities (ties to Don Philahue)"
    host_note: upbringing.yml#dc-metro
  americans-arpanet-pdp10:
    show: The Americans
    season: 2
    episode: ARPANET
    episode_no: 7
    air_date: 2014-04-09
    character: "Thane Rosenbloom (Geoffrey Cantor) — computer science professor"
    scene: |
      Philip (posing as journalist) gets an **ARPANET** explainer in the professor's lab — virtual
      highway, post-office translation analogy, **Interface Message Processor** as interstate for
      information — then the camera **pans up to a PDP-10**. "It's like God." (LA Times: "…except
      without the big beard and flowing white robes.")
    dialogue:
      - "It is, in a manner of speaking, the interstate highway system through which all of information flows."
      - "It's sort of like God, except without the big beard and flowing white robes."
    theme: |
      Cold War spy fiction meets real networking history — ARPANET as deity, **PDP-10 as the icon**.
      Perfect cold open before Lars Brinkhoff makes dead iron boot again.
    references:
      - title: "Wikipedia — Arpanet (The Americans)"
        url: https://en.wikipedia.org/wiki/Arpanet_(The_Americans)
      - title: "net.wars — The PDP-10 who was God"
        url: https://www.pelicancrossing.net/netwars/2014/04/the_pdp-10_who_was_god_1.html
      - title: "LA Times recap"
        url: https://www.latimes.com/entertainment/tv/showtracker/la-et-st-the-americans-recap-20140409-story.html
    use_when:
