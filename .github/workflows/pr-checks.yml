name: PR Checks

# Provision toolchains, then hand off. The checks themselves live in scripts/ci-verify.sh so
# they can be run and debugged locally; only runner setup that needs the Actions cache stays
# in this file.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/ci-verify.sh
